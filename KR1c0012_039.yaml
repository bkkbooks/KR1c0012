body:
  text: 毛詩集觧卷三十九宋李樗黄櫄撰武奏大武也於皇武王無競維烈允文文王克開厥後嗣武受之勝殷遏劉耆定爾功李曰武詩者乃武王之樂歌也周禮曰舞大武以享先祖謂之大者如堯之樂大章舜之樂大韶禹之樂大夏湯之樂大濩武王之樂大武是也此詩乃武王之樂歌也皇美也於乎美哉武王之為君其功烈可謂無與强矣其始也則信有徳者文王受命作周以開示我後世子孫之基緒故武繼嗣而受之得以勝殷止殺致定其成功焉遏者止也劉者殺也劉與虔劉我邊陲之劉同耆者致也鄭氏以為耆老言武王誅紂年老乃定汝之此功言不汲汲於誅紂須暇五年按左氏宣公十二年引此詩曰耆定爾功耆致也其意言致紂於昬昧者故以耆為致也王肅亦云致定其大功當從毛氏與王肅之説武王之始也未嘗有取天下之心觀大武之詩與大武之舞可見矣按禮記揔干而山立武王之事也𤼵掦蹈厲太公之志也武亂皆坐以象周召之治言大武之舞其始則持盾正立以待諸侯既而戰鬬既而又使行列皆坐以見其為止戈之武也大武之意在於止戈也大武之詩在於止殺其類一也後世以謂大武聲滛及商則是有貪商之心也故孔子曰有司失其傳也若非有司失其傳則武王之志荒矣且武王本無取天下之心而孔子曰韶盡美矣又盡善也武盡美矣未盡善也且大武之樂終不如舜之為善豈其有貪商之心哉唐太宗即位謂侍臣曰雖𤼵掦蹈厲異乎文容然功業由之被於樂章示不忘本也太宗快一時之意以取天下止戈之武果安在哉韓文公嘗作元和聖徳詩以謂觧脱攣索夾以砧斧婉婉弱子赤立傴僂牽頭曳足先斷腰膂次及其徒體骸撐拄末乃取闢駭汗如寫揮刀紛紜爭刌膾脯文公詩所以形容聖徳而不知其詩適足以為憲宗之暴其與武王之詩異矣黄曰堯之樂曰大章舜之樂曰大韶禹之樂曰大夏湯之樂曰大濩武王之樂曰大武夫樂所以象徳亦以見聖人之心也觀此一詩而武王之心可見矣夫言武王功烈之盛而必及於文王積累之乆者以見周家之當為天子而非武王之有心也勝殷遏劉劉者殺也如虔劉我邊陲之意也耆定爾功耆者老也如上帝耆之之意也武王之伐紂也救民於塗炭之苦而遏絶其殺人之事如武城所謂以遏亂虐者是也然武王之於紂未嘗不欲其改過也既觀政於商惟受罔有悛心然後不得已而伐之蓋至於老而後成定天下之功所謂須暇五年者是也烏乎武王之心吾於大武見之故大武之舞在於止戈而大武之詩在於遏劉後世謂大武聲滛及商而孔子以為有司失其傳也若非有司失其傳則武王之志荒矣孔子信武王之心而不疑武王之樂至於謂武盡美矣未盡善也蓋武王之心自有不足之意具見於樂非孔子始為是論也襄公十九年季札來聘見舞大武者曰美哉有周之盛其若此乎吁若季札者其真知武王之心矣閔予小子之什詁訓傳第二十八周頌閔予小子嗣王朝於廟也閔予小子遭家不造嬛嬛在疚於乎皇考永世克孝念兹皇祖陟降庭止維予小子夙夜敬止於乎皇王繼序思不忘訪落嗣王謀於廟也訪予落止率時昭考於乎悠哉朕未有艾將予就之繼猶判渙維予小子未堪家多難紹庭上下陟降厥家休矣皇考以保明其身李曰王肅以此篇為周公致政成王嗣位始朝其廟之樂歌而康成以謂除武王之喪將始即政朝於廟也則以為未攝政之時無所考證大抵此詩言閔予小子嬛嬛在疚是始除喪之辭當且從鄭氏之説孔氏以為若已除喪當為吉稱而經言小子在疚為喪中辭者以其服雖除去喪日近又序其在喪之事其説是也閔予小子皆是居喪之辭也言困病之小子乃遭家之不造造者成也武王之死則無所成立亦如人之遭喪家之不幸也説大日疚貧病也因舉此詩嬛嬛在疚其字與哀此㷀獨之義同則知嬛者孤獨而已閔予小子皆是死喪之辭也如左氏傳曰寡君少遭閔凶不能文則是閔者居喪之稱也而左氏亦有在疚之文亦是居喪之稱也王雖朝於廟然去喪未甚逺故猶以死喪之辭為言王氏以為文武為周天下未集而終故成王自以為遭家不造也張丈潜以為成王而溢之則未收泮渙則未圖法度則未立故以為遭家不造者也然武王之業豈有至死而未成乎蓋所謂遭家不造者但以武王之死則無所成立故也非必以業未成為説也皇考者武王也言武王能終身克孝於文王鄭氏以為武王長世能孝故能以孝行為子孫法度使長見行者非也所謂永世克孝者亦猶太舜終身慕父母也然武王之所以為孝者果何為哉不過念兹皇祖而已皇祖文王也文王之為文王以其俯仰之間皆盡其直道庭直也惟武王能法於文王故我小子夙夜欽之不敢懈怠其心言為君之道繼其序事故其心未嘗忘於文王也文王之詩曰文王陟降在帝左右文王之心俯仰之間無有愧怍洋洋如在其上如在其左右而武王之所以繼志述事者亦本於此武王能以念兹皇祖為孝則成王亦當以率時祖考為孝其日夙夜敬止則可以繼陟降庭止之道矣易曰敬以直内惟能敬則能直矣訪落乃成王即政謀事於羣臣也孔氏云閔予小子之篇王所以自言亦是謀政之事但謀者與人之辭故下篇言謀此説是也訪謀也落始也言成王謀其始即政之事也王氏鄭氏以訪予落止為成王之言率時昭考為臣下之言朕未有艾又為成王之言蘇氏皆以為成王之言當從蘇氏之説言成王始訪即政之事欲率循昭考武王之道巍巍乎悠逺而不可及而成王方幼沖未有所經歴將勉强以從就之繼其道而猶恐泮渙而不合艾歴也王氏以為欲羣臣扶持成就之以繼圖天下之泮離渙散也張文潜以為成王之時天下已治矣乃曰繼猶泮渙然則承文武之緒而猶有泮離渙散之患者何邪蓋丈武之徳大矣泮然而離無有不至渙然而散無有不及洋溢傍肆至於成王將欲収之以立法度之節故也是皆以為繼圖天下之泮離渙散其説非也所謂泮渙者但是欲繼武王之道猶恐泮渙而不合也自訪予落止以至繼猶泮渙皆是仰武王之盛徳嘆眇躬之涼薄苦前哲之髙逺故也然所以繼道而猶恐不合者則以予小子未堪家多難故也紹庭上下此又深言武王之道也紹文王直道於上下俯仰於家未嘗少離美哉皇考所以保明其身也王氏以為保其身無危亡之憂明其身無昬塞之患其説是也夫人君者天下之本也始即位者又人君之本也始即位之時而知所戒慎猶恐其終之不繼苟始之不慎則終為如何故伊尹告太甲以謂今嗣王新服厥命惟新厥徳召公亦告成王曰王乃初服嗚呼若生子罔不在厥初生自貽哲命蓋言始之不可不慎此訪落之詩所以作也成王即政之初閔予小子訪落之詩其言皆自處於涼薄惟恐其忝父之訓書大誥之篇亦曰予惟小子若渉淵水予惟徃求朕攸濟此皆是慄慄危懼之心也惟其即位之初而存戒懼之心故謀羣臣以始即政之事則冝其以中人之質而保其盈成之業也黄曰閔予小子蓋成王始即位而朝於廟之詩也鄭康成李迃仲皆以為成王未即政之詩然訪落之詩言嗣王謀於廟落者始也是始即位謀之於羣臣也成王朝於廟之時羣臣在焉故成王因而謀之則朝於廟與謀於廟之詩皆是一時所作鄭氏李氏於閔予小子之詩既言成王之未即位而至於訪落之詩則又言成王之始即位何其相戾也予嘗言詩至此二篇蓋喟然而嘆曰人謂成王為中材之主其亦不知成王者哉夫當武王之後王業已成矣天命已固矣天下廓廓乎無事矣而二詩之作皆有慄然若處危難之辭讀之使人肅然而有不敢自忽之意曰閔予小子遭家不造維予小子未堪家多難若禍患之迫乎其後而不能以自安豈成王矯為是言哉此皆其誠心之所著見而不能自己也蓋天下之治常生於戒謹恐懼之中而天下之亂常基於泰然自滿之日故天下雖有泰山之勢而聖人常以累卵為心無虞而戒無難而畏此其能保治於無窮也中材之主其何足以語是乎大誥之書亦言予維小子若渉淵水又曰予造天役遺大投艱於朕身又曰矧今天降戾于周邦皆若此二詩之意則成王之心亦可見矣雖然成王之所以自警者如此而成王之所以自勉者不止於此也閔予小子言念兹皇祖陟降庭止而訪落則言紹庭上下陟降厥家謂我文武直道而行俯仰無愧則我亦當繼其直道而期無愧於俯仰之間也閔予小子言於乎皇王繼序思不忘而訪落則言休矣皇考以保明其身吾於繼序思不忘之一句見成王未嘗一日不以文武為念想其食見於羮坐見於牆而不能以頃刻忘也吾於以保明其身之一句見成王未嘗一日不以文武勉其身想其心惟恐言之或過行之或虧而身之或不正也吁吾於此二詩見成王之用心真文王武王之用心成周泰和之治雖本於文武之功而亦成王以此心致之也人謂成王為中材之主何足以知成王敬之羣臣進戒嗣王也敬之敬之天維顯思命不易哉無曰髙髙在上陟降厥士日監在兹維予小子不聰敬止日就月將學有緝熙于光明佛時仔肩示我顯徳行李曰訪落之詩成王謀政於羣臣敬之之詩羣臣進戒於嗣王所以荅成王謀政事之意也蓋自敬之敬之以下至日監在兹此羣臣之進戒也自維予小子以下此又成王因羣臣之進戒故又問所以持敬之方欲知其所以進修之道也敬之敬之言不可不敬也天之道甚顯善則福之滛則禍之栽者培之傾者覆之未有善而不獲福也未有惡而不獲禍也天之道顯矣惟天有顯道故其命靡常此命所以為不易也鄭氏以易為變易之易不如杜元凱以為難易之易僖公二十三年左傳曰敬之敬之天維顯思命不易哉杜元凱注云周頌言有國冝敬戒天明臨下奉承其命甚難歐陽公亦以為難易之易如大王之詩命之不易鄭氏以為改易之易凡詩之所謂不易皆以為改易非也夫天命難諶如此凡為人君者無以天之髙髙在上去人為甚逺而不知敬也士毛氏皆以為事意或然也然鄭氏以為天主其事謂運轉日月施其所行日月曕視近在此也此則非也陟降厥士是指人君而言也惟其指人君而言則人君俯仰之間所為之事天皆日監而見之矣夫天之去人甚逺而其監人則不逺也昊天曰明及爾出王昊天曰旦及爾游衍人之出入天亦從而出入人之游衍天亦從而游衍則是天命常在目前也為小人者乃以天為去人甚逺故人所不覩則未嘗戒慎人所不聞則未嘗恐懼是欺天也天其可欺乎茍知日監在兹之説則必知所敬矣日監在兹言天之監人常在此也天監在兹則敬之之道豈可須臾離之哉故羣臣進戒嗣王欲其知敬之之道也觀堯之兢兢舜之業業禹之懍懍湯之慄慄文王之汲汲與夫武王之所以造周皆莫不本於此則為人君者必當造次必於是顛沛必於是所居有隱顯之不同其存心則一也有煩簡之不同其存心則一也大學中庸所謂慎獨者亦猶此則知羣臣之進戒嗣王欲成王知持敬之道良有㫖耳成王因羣臣之進戒乃曰維予小子未明乎持敬之道庶幾日有所就月有所將學緝熙于光明輔佛是任以示我顯徳行然後知持敬之道矣觀閔予小子以夙夜敬止為言訪落之詩又以紹庭上下為言則知成王固知敬之之道矣猶曰不聰敬止者此足以見成王之賢也成王以羣臣戒我所敬止之道然成王知以涼薄之質未堪家多難尚未知敬之之道為何如而行之故必待學緝熙于光明然後可以知敬之之道也大學之道必先致知然後誠意故學有緝熙于光明則知所謂敬之矣而又在當時之人輔之示我顯徳行也佛弼也仔肩任也張文潜之説曰徳行固道之顯也而曰示我以顯徳行者學之始也道固當然徳行之幽者未足以知之故但言示我以顯徳行然未必詩人之意蓋成王自處於不明故必待學有緝熙于光明又賴輔弼之臣示我以徳行則為成王者雖愚必明然後可以知敬之之道此成王之意也黄曰成王既作謀政之詩以𤼵羣臣之志故羣臣亦進其敬之之戒以荅成王之休自維予小子以下又成王荅羣臣之辭也觀此一詩其君臣更相戒勸更相答問皆以敬為主敬之敬之猶所謂欽哉欽哉之意也羣臣以敬之之道戒成王而使之知天道之甚彰天命之可畏雖闇室屋漏之間而敬之之念不可少忘凡進退羣臣之際常若天之有以臨乎其前也而成王之答羣臣則又以為予小子耳未知其所以為敬之之道庶幾積學以成之耳尤頼爾羣臣輔弼之功而告我以徳行之著也嗚呼羣臣之所以戒成王與成王之所以答羣臣者不出於敬之一辭蓋人君惟以敬存心則雖不暏不聞之地而亦如承大祭之時敬心少衰則雖天地鬼神臨之猶將藐然而况不顯之中亦何所不至哉不特此也大雅文王之篇大臣之所以告成王者亦曰於緝熙敬止而成王朝於廟之詩亦曰維予小子夙夜敬止則成王君臣之間凡議論之及未嘗不以敬為念也伊尹之告太甲曰惟天無親克敬惟親又曰先王惟時懋敬厥徳克配上帝其諄諄之意無非以敬為主而以天為戒羣臣之進戒成王特曰敬天云者其亦如伊尹之意歟觀書之所載皆帝王為治之法曰柰何不敬曰其汝克敬徳曰敬哉有土曰惟敬五刑曰敬授人時敬之一辭君臣言之不能自已誠以天下治亂之基皆在於一念之敬與不敬也堯之所以兢兢舜之所以業業禹之所以孜孜湯之所以汲汲文王之所以亹亹皆自其敬心之所𤼵耳曲禮論安民之道而先之曰毋不敬中庸之所謂篤恭皆敬之充也大學之所謂正心誠意者此敬之本也為人君者試以是思之小毖嗣王求助也予其懲而毖後患莫予荓蜂自求辛螫肈允彼桃蟲拚飛維鳥未堪家多難予又集于蓼李曰小毖之詩乃成王懲戒徃日之事自此欲戒慎幾微之事亦欲羣臣助己而以知禍亂之機也惟其懲艾後患言徃者管蔡流言雖以周公之忠聖幾陷於管蔡之計中今則欲懲徃日之事而慎其後患遂使羣臣莫予荓蜂自求辛螫也荓與荓云不逮之荓同荓者使也言汝羣臣莫使我為蜂乃汝自求毒成王既悟管蔡之流言故羣臣不得復為流言亦如漢昭帝既悟上官桀之譖亦曰復有敢譖光者坐之其意一也肈允彼桃蟲拚飛維鳥此則言管蔡流言之禍也桃蟲爾雅云鷦陸璣䟽云今鷦鷯是也微小於黄雀蓋比始小而終大也方桃蟲之始也無能為矣及其飜然而飛則為大鳥亦如管蔡之流言其始甚微而其終則為王室之禍况我於是時年尚幼沖未堪家多難成王新即位既遭不幸矣茍又遭流言之禍是重遭不幸也故曰予又集于蓼夫涓涓不壅終為江河綿綿不絶或成網羅豪末不札將尋斧柯天下之禍常作於細微之中始茍不圖則其終汗漫而不可救管蔡流言茍能圖之於其始則雖頃刻去之可也惟其始之不圖而圖其後故必待三年之乆然後可以無禍蓋不能圖其始而其後無救矣亦如上官桀之徒使昭帝不能正其始則其後圖之豈不難哉此不得不慎也黄曰百尋之岸或潰於一穴之蟻千間之厦或燼於一隙之煙天下之事當於其微而謹之不可以事之小者為不足慮而忽之也天下之禍常起於不足慮之處而事之滋蔓而不可圖者常存於萌蘖之初是以聖人知治亂之機而每謹於常人所忽之地此非為是過慮也蓋以涓涓不壅將成於江河綿綿不絶將尋於斧柯豈不甚可畏哉是以古之聖人堅冰之戒常存於履霜之初苞桑之繫尤謹於安强之日成王當天下治安之時而作小毖之詩以求助其意誠在是也載芟春藉田而祈社稷也載芟載柞其耕澤澤千耦其耘徂隰徂畛侯主侯伯侯亞侯旅侯彊侯以有嗿其饁思媚其婦有依其士有略其耜俶載南畝播厥百榖實函斯活驛驛其達有厭其傑厭厭其苖綿綿其麃載穫濟濟有實其積萬億及秭為酒為醴烝畀祖妣以洽百禮有飶其香邦家之光有椒其馨胡考之寜匪且有且匪今斯今振古如兹李曰此詩乃藉田而祈社稷之樂歌也春藉田而乃祈社稷者蓋天子親耕不能終畝故借民力以終之則知是詩乃藉田之後因而祈社稷焉此詩不言藉田者蓋特因藉田及社稷故其因而及之耳禮記月令孟春天子親耕帝藉仲春擇元日命民社是藉田祈社稷不同月也今此乃云春藉田而祈社稷其事可疑若以月令為吕不韋所作則其説未可盡信若非吕不韋之誤則此序之誤皆不可得而知也禮記言王為羣姓立社曰泰社王自為立社曰王社則是社有二也孔穎逹以此社為百姓祈祭文當主於泰社蘇氏以為王社二説皆未可必假此詩兼祭二社亦未可必姑且闕之以待知者左氏曰芟夷藴崇之則是除草謂之芟也周官柞氏掌攻草木及林麓則是除木曰柞也始也開闢其土田則除其草木然後從事於耕其耕則澤澤然惟其除草木然後土氣觧散其耘作者有千耦二人相對者有千耦之人也其所耘之地或徃之隰畛隰者新𤼵田也畛者舊田有徑也其耘之人則維主之家長侯伯之長子主為家長則知伯為長子也亞伯之次也旅衆子弟也彊有餘力者如周官强予任民以用也如左傳師能左右曰以之義同以先王之時中田有廬疆埸有𤓰則地無餘利矣侯主侯伯侯彊侯以則民無遺力矣安有惰農之患哉嗿衆貎言衆人飲食之聲也婦人有饁為夫者則愛其婦也為婦者亦依其夫也依亦相愛之意言婦人行饁之時則相慰勞苦於此而述其情也上文言千耦其耘於此言利其未耜有事於南畝播厥百榖而其種皆函生氣而生長而其苖則驛驛然逹地而生其苖之生長其中又有傑然者其衆苗皆齊等而生而耘者綿綿而不絶也王氏以謂前曰千耦其耘則既耕而耘也今曰綿綿其麃則既苖而耘也此之所謂既苖而耘其説固是上文千耦其耘以謂既耕而耘則非矣方其始也除去草木然後可從事於耕及草木既除然後俶載南畝方從事於耕也非是既耕而耘也禾既成熟於是穫之濟濟而衆其穗實之多則至於萬億及秭故可以為酒為醴而進予祖妣以和洽百禮飶芬芳也香可以薦其賔客故為邦家之光椒之馨可以養老胡考者耇老也儀禮士冠禮祝辭曰眉壽萬年永享胡福注云胡遐也逺也左氏以為雖及胡耇獲則取之杜元凱曰胡耇元老之稱也則知胡耇乃老人也且此也非特此日方有此也非特今年方有豐年其所由來也逺矣造始而先之者天道也作成而繼之者君道也王氏以為率時農夫播厥百榖為造始而先之也此詩實函斯活為作成而繼之也凡此詩一一以天地配之如言成象者天道也成形者地道也其穿鑿如此何其勞也竊嘗以謂噫嘻者是祈榖之詩載芟亦是祈榖之詩豐年者是報祭之詩良耜者亦是報祭之詩噫嘻豐年言祈上帝載芟良耜言祭社稷特詳略之不同耳噫嘻豐年其説為略載芟良耜其説為詳蓋祈上帝所以尊之也故其辭略祭社稷所以親之也故其辭詳欲知祭天地觀諸此而已然觀載芟之文則可見詩人形容物態之巧其始也言載芟載柞其耕澤澤其次又及於行饁之夫婦相慰其勞苦又其次及於禾之成熟則載穫濟濟及其為酒為醴烝畀祖妣以洽百禮黙而觀之如觀諸畫圖如大田信南山甫田生民之詩亦然且黍稷者一微物耳詩人形容其巧屢矣如曰厭厭其苖綿綿其麃可以見春生之多也如曰穫之挃挃積之栗栗又以見穫之時也釋之叟叟丞之浮浮又以見祭祀之用也凡此之類皆曲盡其狀使後人為之則必數十句然後盡其物態豈能盡其物色哉詩人獨以一二句而物態自見則知詩人之為詩真可為後世之法也黄曰藉田者天子所耕之田也藉者借也天子千畝諸侯百畝天子親耕不能終畝借民力以治之故謂之藉田周禮甸師氏之所掌也載芟一詩乃成王春藉田而祈社稷然考之月令天子親耕在於孟春而擇元日以命民社者在於仲春時既不同而此詩乃合而言之者蓋此特言春而不言月要之皆在於春也古之聖人親耕以率民而尤慮民力有所不及之地於人為之求社稷焉甫田言以社以方我田既臧而雲漢亦言祈年孔夙方社不莫則社稷之祈信乎其不可緩也當周之時為君者不少忘於農為民者不少倦於農此所以自古有年振古如兹而為豐年之屢歟此一篇訓詁甚詳良耜秋報社稷也畟畟良耜俶載南畝播厥百榖實函斯活或來瞻女載筐及筥其饟伊黍其笠伊紏其鎛斯趙以薅荼蓼荼蓼朽止黍稷荗止穫之挃挃積之栗栗其崇如墉其比如櫛以開百室百室盈止婦子寜止殺時犉牡有捄其角以似以續續古之人李曰畟畟毛氏曰猶測測也説文曰治稼畟畟進也爾雅曰畟畟耜也舎人曰畟畟耜入地之貎郭璞曰言嚴利也數者之説皆不同然大抵是刃利之狀農夫以利刃而耕遂始事南畝播厥百榖皆含生氣以生長於是有來視汝謂婦子來饁者也王氏曰其曰或來瞻汝非是婦子也然觀詩之意言或來瞻汝者不過言婦子耳不必泥一或字也郤缺之妻饁其夫有童子以黍肉餉七月之詩曰同我婦子饁彼南畝甫田之詩曰以其婦子饁彼南畝皆是婦人耳其婦行饁則有筐筥之器其所盛之物則有黍之美榖也農夫食黍足以見其豐年也載筐及筥其饟伊黍此則言婦子行饁之器與所盛之物也其笠伊紏其鎛斯趙此則言農夫也言行饁之時見農夫所戴之笠則紏紏然而輕舉所執之田器則刺地以薅説文曰拔去田草也荼陸穢也蓼水草也其薅去其荼蓼而荼蓼已朽敗黍稷遂長而荗盛於是穫之則有挃挃之聲其實之積則栗栗而多積之髙大則如城雉之險其密則如櫛之相比既積之矣於是開百室以納之百室既盈矣而婦子於是安寜蓋是時終歳勤勤不得安寜今農事已畢故各享其樂也蘇氏曰聖人之為詩道其耕耨播種之勤而述其歳終倉廩豐實婦人喜樂之際以感動其意故曰畟畟良耜俶載南畝播厥百榖實函斯活或來瞻汝載筐及筥其饟伊黍其笠伊紏其鎛斯趙以薅荼蓼當此之時也民既勞矣故為之言其室家來饁而慰勞之者以勉卒其事而其終章者荼蓼朽止黍稷茂止穫之挃挃積之栗栗其崇如墉其比如櫛以開百室百室盈止婦子寜止殺時犉牡有捄其角以似以續續古之人當此之時嵗功既畢民之勞者得與其婦子皆樂於此休息閒暇飲酒食肉以自快於一歳其説甚善夫詩之可以興者所以感𤼵人之善志故也先言勤勞後言逸樂使夫勤者有以自忘其勤勞怠者亦知以自奮則天下之人趨事赴功而其心未嘗惰於三農之務也既獲豐年矣乃殺是犉牡黄牛黒脣曰犉其牛之角則捄捄然榖梁曰郊牛日展斛角而知傷展道盡矣此之所謂有捄其角者即榖梁所謂斛角也其字不同其義一也社稷之牛角尺殺時犉牡所以報祭社稷復嗣前歳以求豐年也續古之人庻幾不替其先也鄭氏云求有良司嗇非也王氏言有嗿其饁則言饁之容載筐及筥則言饟之器形乃謂之器則器也者地道之成也以其鎛斯趙則指其器以薅荼蓼則指其物王氏之學好生分别故以載芟言地道之始故其詩亦必言其始此詩言地道之終故其詩亦必言其終兩篇之中皆附㑹其説如曰其笠伊糾則嗇也嗇則土之性如此之類乃其穿鑿如此夫坤之吝嗇固然矣使果可以附㑹其説則凡詩之文皆可附㑹以為説王氏之學不可不戒也載芟之詩多與此詩相類載芟之詩曰有畟其耜此詩則曰畟畟良耜載芟之詩曰俶載南畝播厥百榖實函斯活此詩言亦如此載芟之詩言厭厭其苖綿綿其麃此詩亦曰以薅荼蓼載芟之詩言載穫濟濟此詩亦曰穫之挃挃載芟之詩曰有實其積此詩則曰積之栗栗自此以下其文大抵相類又安得以載芟言地道之始此詩言地道之終乎如以此詩言地道之成則必指其器既曰畟畟良耜則載芟之詩有畟其耜何以復言器邪則王氏之說不攻而自破矣噫嘻是播種之詩故其詩專言播種豐年之詩是収成之詩故其詩專言収成此二詩分别明甚無足疑者而載芟良耜之詩乃異於噫嘻豐年之詩者蓋以祭祈上帝之詩其辭略故言播種而不及収成言収成而不及播種蓋不用繁辭也祈社稷之詩則其辭繁蓋祈社稷欲其豐年故其言及於豐年如曰載穫濟濟報祭之詩必自播百榖然後可以得豐年故自播厥百榖而言之其辭不得不繁二詩之意如此而已若謂載芟為地道之始此詩為地道之終則泥矣黄曰有載芟之祈則有良耜之報禮也然祈上帝與報上帝之詩則其言略祈社稷與報社稷之詩則其言詳蓋祀帝而略其辭所以尊之也祀社稷而詳其辭所以親之也詳觀載芟良耜之詩其所以形容耒耜之器黍稷之熟豐年之慶者無所不盡始則言其農夫耕耨播種之勤婦子饁餉喜樂之意而終則言其倉廩委積之盛享祀燕飲之樂而又為之求來歳之稼興嗣歳之功以繼古人豐年之效其言意之無以相異也而安辨其為祈與報也哉蓋祈之之詩則詳及其耕種之事報之之詩則詳其収成之事故載芟言以洽百禮者願其豐年之慶而百神之祀皆無所闕也良耜言殺時犉牡者則專主祭祀而言也二詩之意亦明矣絲衣繹賔尸也髙子曰靈星之尸也絲衣其紑載弁俅俅自堂徂基自羊徂牛鼐鼎及鼒兕觥其觩㫖酒思柔不吳不敖胡考之休李曰宣公八年六月辛巳有事于太廟仲遂卒于垂壬午猶繹公羊傳曰繹者祭之明日也蓋以辛巳之日祭於太廟而壬午之日乃用繹祭則是繹乃祭之明日也賔尸者以賔事所祭之尸也周謂之繹商謂之肜書所謂髙宗肜日即此祭也絲衣之詩繹祭之樂歌也其後髙子謂祭靈星據繹祭行於廟門之外豈復祭靈星邪髙子與孟子同時公孫丑問曰髙子曰小弁小人之詩也孟子曰何以言之曰怨曰固哉髙叟之為詩也夫以小弁之詩乃孝子之詩也而髙子以為小人之詩如絲衣之詩乃繹賔尸之詩而髙子以為靈星之詩若髙子者非惟失之於小弁抑亦失之於絲衣矣竊謂靈星之祠無所經見惟漢髙祖郊祀志云親詔御史令天下立靈星祠注曰張晏云龍星左角曰天田則農祥也晨見而祭之髙子所謂靈星之詩豈謂此邪大抵髙子之學失之固陋其見之於孟子有二一則公孫丑所言是也其二則禹之聲尚文王之聲則以為禹之聲樂過於文王髙子之學人以為是己以為非人以為非己以為是徒知求異於人而不知自失之固陋也髙子之學既失之矣而後人復以其言而列之於此則誤矣當削去之可也絲衣其紑毛氏以為鮮潔貎説文以為白鮮貎俅俅毛氏以為恭順貎説文以為冠飾貎夫祭之前士之行禮則設絲衣其色必紑然而鮮潔所戴之弁則俅俅然而恭順從廟堂而徂於門塾之基所以告濯具也又視三牲從羊而之牛所以告肥充也大鼎謂之鼐鼎圜弇上謂之鼒舉其鼎鼐及鼒所以告潔此亦祭之明日薄於祭祀故但使士行禮焉孔氏云若正祭則小宗伯省牲視滌濯祭之日逆齍省鑊告時于王告備于王彼正祭重使小宗此繹祭輕故使士其説然也繹祭既在於廟門之外則所謂基者非廟堂之基乃門塾之基也自堂徂基自羊徂牛鼐鼎及鼒則各盡其敬矣既盡其敬然後祭焉既祭之矣然後有旅酬之節飲宴而用罰爵但觩然徒設無所用之所以然者由其有美酒皆思自安不諠譁不傲慢故以此得壽考之福吳説文曰大言也徐鉉曰大言故矢口而出聲後世以吳從口從天此皆謬也孔氏曰此述繹祭之事上五句言祭之初下四句言祭之末初言卑者恭順則當祭尊者可知祭末舉其不慢則當祭而恭欽明矣孔氏之説深得詩人之意謂上五句自絲衣其紑至鼐鼎及鼒此其未祭之時是告濯告充告潔無所不謹則臨祭之時謹於禮可知也下四句自兕觥其觩至胡考之休既祭之後飲酒未嘗至於諠譁失禮則當祭之時謹於禮可知矣學詩者當通其倫類以詩之所言而求其所未言則可以通詩矣黄曰絲衣之詩其意明甚自漢儒雜取髙子之言而汨之而詩之大義不全矣祭之明日復祭曰繹所以賔尸者也古之祭必立尸至於祭之明日所以賔事所祭之尸故為繹祭焉周謂之繹商謂之肜所謂髙宗肜日則其繹祭也宣公八年六月辛巳有事于太廟壬午猶繹夫辛巳祭而壬午繹之此所謂祭之明日也絲衣本宗廟之祭而髙子以為靈星之尸豈不失詩之意乎公孫丑問曰髙子曰小弁小人之詩也孟子曰何以言之曰怨孟子曰固哉髙叟之為詩也則髙子蓋與孟子同時人其繆於詩者孟子辨之詳矣以追蠡而論禹文王之聲以小弁為小人之詩此皆髙子之蔽則以宗廟之尸為靈星之尸又何怪乎靈星之祭未之前聞至漢髙祖詔天下立靈星祠見於漢書郊祀志張晏曰龍星左角曰天田則農祥也晨見而祭之髙子所謂靈星之尸其此之謂乎漢儒雜髙子之言以汨一篇之義今宜削此一句而詩之大義復全矣酌告成大武也言能酌先祖之道以養天下也於鑠王師遵養時晦時純熙矣是用大介我龍受之蹻蹻王之造載用有嗣實維爾公允師李曰大武之詩張横渠嘗以謂必是武王既死周家所奏之樂舞於武王之廟勺是周公七年之後制禮作樂時於大武有所増添也不如是則武王之樂既奏之矣胡為至此而復告成邪前漢志曰周公作勺招舜樂也勺武樂也其字但從勺顔師古注云勺讀作酌至左傳但作汋字雖不同其義一也然觀此詩未嘗有酌字而詩以酌名篇故作序者但言酌先祖之道以養天下也鑠美也美哉文王之師也退而自養與時皆晦蓋時未可為也養者但晦而自養也鄭氏謂養紂暗昧之君以老其惡是誣文王也歐陽氏以為苟如鄭説則文王幸紂為不善養成其惡利而取之此小人尚或不為孔子何誣稱其美哉惟文王之時不可為故遵養時晦至武王之時周室始大明盛矣天下有大助之者武王寵而受之蹻蹻乎王之成功也文王之時不當為故不為之武王之時可以為故為之茍可為之時而為之是當其可也武王當可為而為之故其功所以蹻蹻然而有成是用後世嗣續而不絶然其所以傳嗣而不絶者蓋能合天下之公而信於衆也説者多以我為武王王氏以我為成王寵受武王之業歐陽以為武王能興此王業成王寵受而成之張文潜以為成王寵受武王之成功其武功蹻蹻然征伐四方以成祖考之業我但當從鄭氏以為武王蹻蹻武貎此詩乃武王之詩故詩中言武王之事則知我者但是武王也黄曰周公攝政六年制禮作樂待成王即位而始用之如洛誥所謂肈稱商禮祀于新邑所以明成王即位而後行周禮也前漢志言周公作勺顔師古注曰勺讀曰酌則酌一詩乃大武之樂既成而告於武王之廟也觀此詩未嘗有酌字而詩以酌名篇故序者以為酌先祖之道以養天下可謂得於言意之外矣於鑠王師遵養時晦鄭氏以為文王舉商之叛國以事紂養是暗昧之君以老其惡宣公十三年隨武子舉是詩以為暗昧而杜氏注云致紂於昧者嗚呼果如是説則是文王幸紂之為不善養成其惡以為取之之道其又何足以為文王乎學者不知聖人之心而信口耳之學則昧於聖人多矣書曰兼弱攻昧取亂侮亡蓋仲虺戒湯以為兼人者必自弱攻人者必自昧取人者必自亂侮人者必自亡而後世以為湯於弱者兼之昧者攻之亂者取之亡者侮之是誣湯也彼鄭氏之説其亦誣文王歟要以此詩之意詩言美哉文王之師也退而自養與時俱晦可以與民同患而乃退藏於密藏其威而不用懷其勇而不矜以見其無取天下之意至於天時之已至人心之已歸然後武王不得已而受之以成周家之王業故後世子孫所以嗣而不絶者皆武王有以合天下之功孚天下之衆夫惟得之無媿故能傳之無窮若得之不以其道取之非其所當取則非惟有媿於一時亦有媿於後世文王順乎天理而養時晦武王順乎民心而成王業所以八百其年三十其世而天命人心之不容釋歟噫成王奏武王之樂而序者以為酌先祖之道其㫖亦微矣學者當以意悟之毛詩集解卷三十九
