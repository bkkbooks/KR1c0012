body:
  text: 毛詩集解卷四十宋李樗黃櫄撰桓講武類禡也桓武志也綏萬邦屢豐年天命匪解桓桓武王保有厥士于以四方克定厥家於昭于天皇以間之李曰宣公十二年左傳曰武王克商而作頌其三曰敷時繹思我徂維求定其六曰綏萬邦屢豐年敷時繹思我徂維求定即賚之詩也綏萬邦屢豐年即此詩也然謂武王克商則桓者乃武王之詩也既是武王之詩而乃序於成王之後者蓋是成王之時而作之也如使果是武王之為詩則詩之言曰桓桓武王保有厥士武王豈自言其諡邪則知此桓之詩乃成王時追稱之也雖然成王之追稱而乃列於成王之後者抑所作有先後邪抑自有先後之序而後人改易之邪左氏所載其三乃賚詩其六乃桓詩今賚之詩乃序於桓詩之後者此又先後之失其次序也詩人之失其次者多鄭文公之詩乃列於忽之前載馳之詩衛懿公為狄人所滅而乃序於衛文公之後是皆失其序也綏萬邦言武王之用兵所以安萬邦故能享豐年之報老子曰大兵之後必有凶年軍旅所處荆棘生焉蓋以大兵之後殺戮為多傷天地之和氣此所以凶年也武王之用兵在於容民畜衆非快一已之私欲蓋為天下除害故能召天地至和之氣所以獲豐年之報也左氏曰昔周飢克商而年豐謂之年豐固有矣謂之周飢克商而年豐則非也孔氏舉左氏云昔周飢克商而年豐是伐紂之後即有豐年也孔氏徒見左氏之言與詩合然不知周豈有飢哉如其有飢則不足為屢豐年矣武王用兵安萬邦而享豐年之報足以見上天既命我周家勤勤而匪解矣遂申言武王之用武上合天心也言武王之用武桓桓而保有其衆用之于四方以克定厥家此其德所以昭明于天故能君天下而代商也皇君也間代也保有厥士如熊羆之士虎賁之士同鄭以士為事謂能安有天下之事非也此詩言講武類禡也而詩言武王用師未嘗有講武之意蓋觀其不妄用武之意則足以見講武之意觀詩者又以意通之也武王既定天下歸馬于華山之陽放牛于桃林之野載戢干戈載櫜弓矢示天下不復用兵而猶講武者蓋武備不可一日弛天下雖安忘戰必危故雖至於已安己治而武備猶不可不設如其不然則不免有銷兵之患矣黃曰桓之詩果作於武王之時邪果作於成王之時邪曰講武類禡則是作於武王之時曰桓桓武王則是作於成王之時宣公十二年楚子言武王克商作頌其六曰綏萬邦屢豐年則是乂以為武王所作也然當武王之時豈自言其諡邪李迃仲以為成王追作是詩以述武王之事然質之左傳而不合質之詩序而不安則吾亦未之敢從也豫竊以武王云者特言其威武之志耳不必以為武王之諡也如所謂寧王受命成王不敢康武王靡不勝亦豈必以為諡乎詳觀此詩以為武王用兵而類於上帝禡於所征之地故作是詩耳老子曰大兵之後必有凶年軍旅所處荆棘生焉蓋以大兵之後殺戮之多傷天地之和氣也今武王之兵在於安民而非所以擾民故屢豐年而無凶荒之災此如湯之興師耕者不變是也左氏曰昔者周飢克商而年豐然左氏亦附會之説使周而果有飢嵗則又安得為屢豐乎惟武王之兵在於安民故天之命周無解怠之心而周王之威武有桓桓之志此其所以能定其王家以昭著於天而代商以君天下也此詩之意與武成之篇相類學者試詳考之賚大封於廟也賚豫也言所以錫豫善人也文王既勤止我應受之敷時繹思我徂維求定時周之命於繹思李曰武王克商大封有功之臣於廟蓋歸功於祖宗不敢専也禮記曰古者明君必賜爵祿於太廟示不敢專也然此詩同宣王之時命孝公為侯伯命之於夷宫亦是不敢自専也為天子者封功臣以告於廟為諸侯者班爵祿亦在於廟衛之封功臣即服將命則知亦在於廟也衛雖封功臣於廟然不知所任者非其人也賚者豫也序詩者又説其所以名篇之意言其所以錫與善人也語曰周冇大賚善人是富序詩之言與論語相為表裏武王克商封兄弟之國者十有五人姬姓之國者四十人書之所載列爵惟五分土惟三禮記之所載將帥之士皆封諸侯此皆武王之封功臣也武王之封功臣必在於廟中蓋謂吾之所以封功臣者非吾之私意乃文王之意也文王所以受命作周可謂勤勞矣而我則安然而受之故當敷其事而繹其志我之所往惟在於求定天下蓋錫豫善人者乃求定天下之術也時周之命在於錫豫善人我故當繹而不忘也此詩言文王之志武王繼之而不言錫豫善人大抵與桓之詩同學詩者當以意逆之也黃曰武王勝商而大封功臣如武成所謂列爵惟五分土惟三是也夫武王之封功臣而必封之於廟者何哉王制曰爵人於朝與士共之祭統曰古者爵有德祿有功必賜於太廟注云詢於朝取於衆也後命於廟不敢專也此説盡之夫此詩無賚之文而以賚名篇君子慮後世之不知其意故釋之曰賚豫也又慮後世不知所以錫豫之意故又釋之曰言所以錫豫善人也曰善人云者以見上之人不妄豫爵必及於有德而無德者無所覬祿必及於有功而無功者無所求周家之法度豈不宏逺哉孔子曰周有大賚善人是富孔子之言其此詩之證歟詳考此詩蓋武王封於廟而其所以得天下之道謂我文王既勤止而我當受之則周之得天下者非偶然也蓋當然也既而又自言我之所以用兵者惟求以定天下而已武王之意在於安民而不在於好戰今天下已定則惟思所以保之也噫天下之理得於無愧則言之亦無愧武王之得天下蓋天命人心之自歸而非武王之有心此武王所以告之於廟告之於諸侯告之於天下來世在我無愧心則言之無愧辭使天下後世知之亦無異議矣般巡守而祀四嶽河海也於皇時周陟其髙山墮山喬嶽允猶翕河敷天之下裒時之對時周之命李曰孔氏云武王既定天下巡行諸侯所守之土祭祀四嶽河海之神至周公成王太平之時詩人述其事而作此頌故序般者巡守而祀四嶽河海也於美哉周之君天下也武王巡守四方所至之地則登髙山而祭之其祭地則嶞山喬嶽無所不祭嶞山小山也喬嶽髙嶽也允猶翕河者信其謀合衆河而祭之也嶞山喬嶽則山無不祭允猶翕河則河之神無不祭則以敷天之下裒時之對時周之命故也遍天之下當裒聚而對答其功此乃周之所以受命也周之得天下皆本於事神之功武王所祭則歸功於山川之神觀此詩謂之般者則以武王非恣意於般樂也武王之巡守不敢以般樂為務則異乎後世之君所謂般遊者矣如秦皇漢武非不巡守也嘗祭泰山矣亦嘗祭河矣然不過快一己之欲而誇大其名非武王之所謂般也黃曰般之詩與時邁之詩同先儒以為武王既得天下封泰山禪梁父而遍及於山川之祭夫封禪之禮自秦始也而謂武王為之乎聖人之得天下必告於名山大川者禮也舜受天下於堯猶必望于山川遍于羣神嵗二月而東五月而南八月而西十有一月而朔舜豈邀福於鬼神者哉受命之始不得不然也而况於武王革命之主乎故此詩言於乎美哉周受命嶞山喬嶽則山之神無不祭允猶翕河則河之神無不祭合天下名山大川之神而配祭之以見周家之受命無愧云耳此詩之言與武之篇類則武王之心亦可見矣雖然武王之頌當在於成王之前而著於頌之末者蓋經秦火之餘詩之失其次者不可一一舉如衛懿公之詩載於文公之後甘棠之詩載於聽訟之前學者不必泥於篇次之末可也駉詁訓傳第二十九魯頌駉頌僖公也僖公能遵伯禽之法儉以足用寬以愛民務農重榖牧于坰野魯人尊之於是季孫行父請命于周而史克作是頌駉駉牡馬在坰之野薄言駉者有驈有皇有驪有黃以車彭彭思無疆思馬斯臧駉駉牡馬在坰之野薄言駉者有騅有駓有騂有騏以車伾伾思無期思馬斯才駉駉牡馬在坰之野薄言駉者有驒有駱有駵有雒以車繹繹思無斁思馬斯作駉駉牡馬在坰之野薄言駉者有駰有騢有驔有魚以車袪袪思無邪思馬斯徂李曰蘇氏曰詩惟雅為非天子不作也頌之為詩本於為德而已矣故天子有德於天下則天下頌之諸侯有德於其國則國人頌之商周之頌天下之頌也魯人之頌一國之頌也竊嘗疑之商周之德可以頌也魯果可與商周並乎以僖公三十三年間考之春秋所書皆無可褒之事不宜有此頌也此其所以為可疑也蓋嘗觀魯之頌所陳之辭多誇如修泮宫服淮夷考之春秋不見其有服淮夷之事也如云戎狄是膺荆舒是懲考之春秋不見其有膺戎狄之事也僖公二十八年為楚戍衛楚人救衛不克公懼于晉殺公子叢以説焉安在其為懲荆舒邪如書郊者所以譏其僭也魯以諸侯而僭天子之制春秋書郊所以正其不臣之罪也若乃頌之所陳乃所以誇示天下徒言其容飾之盛美此所以可疑也雖然於事可疑而孔子乃存而不刪之此所以雖疑之而未得其説也或者曰季孫行父請命於周而史克作頌亦猶晉文公請隧于王當時王室微弱不能仗大義以拒之故魯得以作頌是僭天子之頌也孔子存之以見魯之強大周之微弱也周以天子之國而黍離之詩乃降為國風魯以諸侯之國而其詩乃同於天子之頌此以見周之弱魯之強也此其説意或然也或者又曰春秋所書者書其罪頌之所言者言其美故二經不同然春秋褒貶之經豈可以為有貶而無褒乎孫明復先生解春秋失之太過議者遂議其書多貶而無褒借使僖公有一事之可紀豈春秋不褒之乎或者之言不足信也伯禽魯之先祖也如伯禽為頌可也僖公果可為頌乎況當僖公之時亦有賢者如衛武公鄭武公齊桓公晉文公皆諸侯之賢者猶且無頌而僖公乃獨有頌此其所以可疑也孔子曰道千乘之國敬事而信節用而愛人使民以時非惟千乘之國為然也雖有天下者亦當如此今僖公能儉以足用寬以愛民牧馬于坰逺之地逺避農田而馬又各得其所所為如此魯人安得不尊之乎説詩者且以詩中之辭為説其辭非不美僖公不足以當之也史克作頌文公十八年左傳季文子使太史克對宣公則知史克魯之史官也班孟堅曰奚斯頌魯孟堅徒見閟宫之詩言奚斯所作而不知四詩皆史克所作也子雲曰公子奚斯嘗晞正考父矣亦是誤矣駉駉良馬也坰逺也邑外曰郊郊外曰牧牧外曰野野外曰林林外曰坰必在坰之野者蓋其去民田為甚逺而又於坰之野其水草甚美既不害於農又使馬得其所養此所以在坰之野也詩言務農重榖但觀牧馬於逺方之地則可見矣既言牧馬於坰野又言馬之駉駉然而肥者有何馬也有驈有皇有驪有黃以車彭彭白跨曰驈黃白曰皇純黑曰驪黃騂曰黃有此數馬故以之御車所以彭彭而壯也其所以如此者則以僖公之思無有窮故能使馬至於善也蒼白雜色曰騅黃白雜色曰駓赤黃曰騂蒼騏曰騏惟有此數馬故以之御車則伾伾然而有力其所以如此者則以僖公之思無期故能使馬多而有才力也青驪驎曰驒白馬黑鬛曰駱赤身赤鬛曰駵黑身白鬛曰雒惟有此數馬故以之御車則繹繹然而善走其所以如此者則以僖公之思無厭斁故能使馬至於作而奮起也隂白雜色曰駰彤白雜色曰騢豪骭曰驔二目白曰魚惟有此數馬故以之御車則袪袪而強健也其所以如此者則以僖公之思正而無邪故能使馬至於善行也徂往也毛鄭以為天子十二間諸侯六間馬四種有良馬有戎馬有田馬有駑馬第一章所言良馬也二章所言戎馬也三章所言田馬也四章所言駑馬也陸師農曰上章言有驈有皇皇云者馬之最善者也下章言有驔有魚魚云者馬之最小者也以見僖公之思有加而無已也竊嘗以為不然此章所言亦猶魚麗之詩也魚麗言魚之多此詩言馬之多言魚之多以見魚之品無不備言馬之多以見馬之品無不備如此而已不必以上章為良馬二章為戎馬也定之方中曰騋牝三千牝所以三千者由衛文公之秉心塞淵也今馬之所以多者原其所以致之之由本於僖公之思無邪也莊子曰百里奚爵祿不入於心牧牛而牛肥詎不信然觀此詩但言牧馬之事而僖公思之如此蓋僖公之所為者無所不致其思則推之於國豈不盡心哉通詩者以其思馬而觀之可以見治國之用心也孔子曰詩三百一言以蔽之曰思無邪即此詩之所言也此詩所言思無邪言僖公之所思者惟馬而已孔子蔽以三百篇者蓋以通詩者不可以詁訓求也孔子告子貢以未若貧而樂富而好禮而子貢遂明如切如磋如琢如磨之旨子夏問孔子巧笑倩兮美目盼兮孔子告之以繪事後素而子夏遂明禮後之旨此二人者可以為通詩之法不可以學漢儒之泥也黃曰或曰周以天子之國而黍離之詩乃降為風魯以諸侯之國而其詩乃同於天子之頌季孫行父之請頌于周猶晉文公之請隧於襄王孔子存之以見諸侯之強大周之微弱也豫竊以為不然魯頌之作皆美之之辭安得以為孔子之存魯頌所以譏魯乎魯同姓之國而周公之後也孔子欲尊周室而思周公則周公之後有如僖公者能撫循其民而國人愛而尊之雖魯國之未必能有是事而魯人尊之以願其如此故吾夫子進魯頌於周頌之後者所以見其思周公之意而亦所以尊周也且夫子之心猶有深取於魯而學者不之察也當是時王室既弱侯國爭大齊桓晉文名為尊周而實富強其國故孔子豫其事而不豫其心魯人一頌之作猶不敢忘周而必請命于天子則是諸侯不知有王而魯知尊王者也孔子幸魯之有王室而不暇論其頌之當否也故其序曰僖公能遵伯禽之法儉以足用寬以愛民務農重榖牧于坰野魯人尊之於是季孫行父請命于周而史克作是頌以見魯人愛僖公而且知有周也駉之一序乃魯頌之總序而非駉之序曰史克作是頌豈特指一篇而言哉史克者魯之史官而頌之為史官所作明矣班孟堅乃以為奚斯頌魯是特見閟宫之詩言奚斯所作而不知其為寢廟奕奕而言也豈奚斯之作頌乎如嵩髙之詩言申伯之功召伯是營而頌則尹吉甫之所作也如孟堅之説則嵩髙之詩亦可以為申伯作矣揚子雲言公子奚斯嘗睎正考父其亦子雲之誤歟駉之一詩言馬之盛多而本於僖公思慮之微如衛文公秉心塞淵騋牝三千夫天下之事觀之於大容有偽焉觀之於小則可以見其心矣僖公儉以足用不傷民財寬以愛民不傷民力務農重榖不奪民時牧于坰野不奪民利則其思慮之正可知也孔子以是詩思無邪之一言而盡三百篇之義此又聖人造化運用之妙而非後世章句詁訓之學所可及也子貢子夏之言詩而為聖人所取者其亦以是歟有駜頌僖公君臣之有道也有駜有駜駜彼乘黃夙夜在公在公明明振振鷺鷺于下鼓咽咽醉言舞于胥樂兮有駜有駜駜彼乘牡夙夜在公在公飲酒振振鷺鷺于飛鼓咽咽醉言歸于胥樂兮有駜有駜駜彼乘駽夙夜在公在公載燕自今以始嵗其有君子有榖詒孫子于胥樂兮李曰孟子曰欲為君盡君道欲為臣盡臣道二者皆法堯舜而已不以舜之所以事堯事君不敬其君者也不以堯之所以治民治民賊其民者也夫為君臣必當法堯舜茍為不法堯舜則君為賊民臣為不敬故君臣之有道惟堯舜為能盡之也自堯舜以來惟三代之君臣可以繼堯舜之君臣有成湯之君則有伊尹之臣有髙宗之君則有傅説之臣有文武之君則有太公周召之臣聚精會神相得益章翼乎如鴻毛之遇順風沛乎如巨魚之縱大壑凡此數聖人然後稱君臣有道不為溢美也僖公果為有道之君乎僖公之臣果為有道之臣乎以左傳考之僖公之臣其賢者惟公子季友臧文仲而已公子季友不能死子般之難閔公既立復歸於魯又不能死閔公之難為臣有道者果如是乎臧文仲下展禽廢六關妾織蒲孔子不以仁稱之作虛器縱逆祀祀爰居孔子不以智稱之孔子又稱其竊位臣而至於竊位所謂有道者果如是耶詩人稱之無乃魯自伯禽以來皆無賢君至僖公特異於羣公乎當時之臣皆無賢臣如季友文仲彼善於此者乎不然則風俗澆薄毁譽失真如鄭人以共叔段為仁故無道者皆為有道邪有駜有駜駜彼乘黃此則取喻也毛鄭蘇氏皆以為取喻獨歐陽文忠公以為僖公寵賜其臣車馬之厚此説固無害然詩人以他物取喻者多矣不必以詩文所無遂以為寵賜其臣車馬之厚也駜説文曰肥馬蓋言馬之所以肥者乃乘黃之馬也夫馬必豐其芻秣然後致馬之肥亦猶人君必豐其爵祿然後可以責其臣之用力也先言有駜有駜駜彼乘黃則是君之待臣者盡其道矣既又曰夙夜在公在公明明則又言人臣報其君者又盡其道也夙夜在公言其夙夜匪懈以事一人故職事無不修明也明明言明之至也鄭氏曰明義明德此説鑿也王氏則舉大學所謂在明明德亦非也韓文公曰馬之千里者一食或盡粟一石今之食馬不知其能千里而食也是馬雖有千里之能食不飽力不足雖欲與常馬等不可得安求其能千里也故欲馬可致力者必先豐之以芻秣欲臣之盡力者必先豐之以爵祿故在公明明先在於有駜乘黃也蓋我以此而待之而臣不以此而報我豈不負人君之寄託哉孟子曰君之視臣如手足則臣視君如腹心君之視臣如土芥則臣視君如寇讎君以手足而視臣而臣不以腹心而視君果足以為臣乎賈誼曰上設廉恥以馭其臣而臣不以節義報其上者則非人類也今也上能如是下又能如是所謂君臣之有道也振振羣飛貌鷺于下此則羣臣之來如鷺之有威儀也與之飲酒以鼓節之而咽咽然其醉也則為君起舞以盡其歡於是羣臣皆喜樂君臣之相與可謂厚矣孔氏以鷺于下為新來之士夙夜在公乃其舊臣也歐陽公以謂舊臣夙夜在公而新進之士飲酒醉舞此豈近於人情其説為善君能待其臣而臣能報其君則可以飲酒為樂君不能待其臣臣不能報其君而徒然飲酒則如紂為長夜之飲何足貴哉駜彼乘牡駜彼乘駽列子曰牝而黃牡而驪天下之良馬也前曰駜彼乘黃又曰駜彼乘牡又曰駜彼乘駽皆言良馬也所言在公明明則職事皆修明矣於是可以飲酒焉鷺于飛亦鷺于下之意也載燕亦飲酒之意也末章則言君臣醉飲相與祝之以為自今以始享豐年之報而又皆有福祿以遺厥子孫則相樂之誠可謂盡矣夫以鹿鳴四牡皇皇者華君能下下以成其福祿至於天保則臣歸美以報其上惟君臣能如此故始於憂勤終於逸樂此魚麗之詩所以作也今此駜彼乘黃是君能下下也夙夜在公在公明明是臣能報上也至於鷺于下醉言舞是終於逸樂也周之文武以勤勞而成周家之業不過如此而已僖公之君臣果足以盡之乎陸農師以為鹿鳴之詩和樂而已非君臣有道也故六月之序至四牡廢曰君臣缺矣至於此詩君有餘惠臣有餘敬則非特賔主而已此所以為君臣有道如陸農師之説則是鹿鳴之詩不如有駜之詩何其待文武之小而置僖公於文武之上邪黃曰或曰僖公之臣其賢惟公子季友臧文仲而已公子季友不能死子般之難閔公既立復歸於魯又不能死閔公之難為臣有道者果如是乎臧文仲下展禽廢六關妾織蒲作虛器縱逆祀祀爰居而孔子以不仁不知稱之有道者果如是乎今曰君臣有道云者風俗澆薄毁譽失真如鄭人以共叔段為仁無道或以為有道也夫詩經孔子所刪而為萬世法安有無道謂之有道而孔子存之乎此且可以據一詩之意而未可必以春秋質之也夫詩以為君臣飲燕之樂而序以為頌僖公君臣有道而後可以為飲燕之歡無道而醉則可刺而不可頌也觀有駜一詩君有餘恩臣有餘敬其曰有道也固宜泮水頌僖公能修泮宫也思樂泮水薄采其芹魯侯戾止言觀其旗其旗茷茷鸞聲噦噦無小無大從公于邁思樂泮水薄采其藻魯侯戾止其馬蹻蹻其馬蹻蹻其音昭昭載色載笑匪怒伊教思樂泮水薄采其茆魯侯戾止在泮飲酒既飲旨酒永錫難老順彼長道屈此羣醜穆穆魯侯敬明其德敬慎威儀維民之則允文允武昭假烈祖靡有不孝自求伊祜明明魯侯克明其德既作泮宫淮夷攸服矯矯虎臣在泮獻馘淑問如臯陶在泮獻囚濟濟多士克廣德心桓桓于征狄彼東南蒸蒸皇皇不吳不揚不告于訩在泮獻功角弓其觩束矢其搜戎車孔博徒御無斁既克淮夷孔淑不逆式固爾猶淮夷卒獲翩彼飛梟集于泮林食我桑黮懷我好音憬彼淮夷來獻其琛元龜象齒大賂南金李曰明堂位曰米廩有虞之庠也序夏后氏之序也瞽宗殷學也頖宫周學也明堂位之意以為魯得立四代之學非獨頖宫也嘗疑其説若以得用天子之學則建辟雍可也何獨泮水哉況周乃辟雍也以泮水為周學則亦非也鄭康成注禮記以為泮之為言班也於是以班政教也及其注此詩則曰泮之言半也蓋東西門以南通水北無也康成之説不同蓋以禮記之字從半從頁此詩從水從半故於禮記則言其義於泮水則言其名二説不同且當以詩泮水字為正蓋以泮水為名則當以水求其義然康成之説以為半水者蓋東西門以南通水北無水也以見諸侯降殺於天子之制天子之學謂之辟雍者辟取其圓也欲其觀之者平均諸侯降殺其制故但有泮宫也觀説文之言乃謂泮者諸侯鄉射之宫也西南為水東此為牆康成以為東西門説文以謂東西牆二説不同當待博識之士辨其非也鄭康成曰思樂僖公之修泮宫之水王氏則以思為語辭當從王氏説思如思皇多士之思同思皇亦是語辭也泮水之中其可樂者以其有芹可采也孔氏之説則以謂既采其芹又觀其化蘇黃門則以謂吾思樂泮水之上雖無所得聊采其芹而已足矣是皆不以為取喻人才也如菁莪之詩曰菁菁者莪在彼中阿是以莪喻人才也文王有聲之詩曰豐水有芑武王豈不仕亦是以芑喻人才也此詩言薄采其芹薄采其藻薄采其茆皆是言僖公能育人才也芹水中之菜也藻水草也茆鳧葵也采藻采茆皆是采芹之意王氏之説則以謂薄采其藻而其采也深矣次言薄采其茆而其采也加深是皆鑿説陸農師又從而廣其説芹者草之有香也藻者草之有文也茆者草之有味也言士始至則慕其香臭而至焉此采芹之譬也既至則學文此采藻之譬也及其知道之味嗜而學焉此采茆之譬也詩人所言不過樂所見而已不應如是之鑿也泮水之中其可樂也以其有芹可采也魯侯親至於學莫不觀其所見之旗其旗則茷茷而飛揚和鸞之聲則噦噦而有聲國人無長無幼皆從公而往以見國人從僖公之樂也鄭氏以為小大之臣非也蓋此之所言者國人耳漢明帝開辟雍冠帶縉紳之人圜橋門而觀聽者蓋億萬計今僖公修泮宫而國人從之者多宜矣其馬蹻蹻言魯侯至泮水其馬則蹻蹻然而壯以見其車馬之盛其音則昭昭以見其聲音之好載色載笑以見其顔色之和僖公之至泮水和其顔色非有所怒但欲教人也教人而至於有所怒是非所謂樂育人材也惟其匪怒伊教此其所以為善育人材歟洪範所載而康而色亦此意也以國人之從公于邁其喜觀之如此僖公至泮水又且和顔恱色其樂教人又如此上下各盡其樂則泮水之中風化之盛可知矣第一章則言僖公之至泮水第二章則言僖公之教人第三章則又言魯侯之既至泮水又取其賢者與之飲酒也其所飲者旨酒也其待賢才如此之厚則莫不祝之以天長與之以難老之福然所以錫之以難老之福者則以魯侯能順賢者之長道而服魯國之衆也長道者道之長逺也魯侯之待賢者既盡其誠則賢人君子亦必以長道而告之魯侯又從而順之又足以見魯侯之賢也漢明帝建辟雍尊養三老五更帝正坐自講諸儒問難於前是皆偃然自大非人主之體也今僖公至泮宫能順賢者之長道然後知僖公之泮水有補於教化多矣穆穆魯侯此又言遵伯禽之法也言伯禽穆穆然其德則敬和而昭明其威儀則欽敬而恭順內有明德外又有威儀內外表裏無不盡善此民所以則之也然民之所以則之者非在於空言亦以僖公內焉能慎其明德外焉能慎其威儀故民所以慕其德而化之也允文允武言僖公信有文信有武矣而其功之光大乃至於烈祖也僖公遵伯禽之法盡其文武之道凡所行之事無不盡其孝故福祿是魯侯之福祿乃自求之也靡有不孝若一事不合於伯禽則非所以為孝也僖公之允文如修泮宫可以見其文也僖公之允武如服淮夷可以見其武也然所謂文武者亦遵伯禽之法也伯禽亦嘗修泮宫矣亦嘗服淮夷矣魯僖公之修泮官與夫服淮夷亦是遵伯禽之法也駉之序言遵伯禽之法下文曰儉以足用寬以愛民則是僖公之節儉皆遵伯禽之法也此詩言允文允武昭假烈祖則是僖公之文武亦遵伯禽之法也其以節儉與夫文武觀之則僖公之孝可謂盡矣故曰靡有不孝明明魯侯明明言明之至也魯侯能明其德故能修泮宫而服淮夷也此下序服淮夷之事古者天子將出征受成於學出征執有罪乃釋奠於學以訊馘告則是僖公征伐淮夷必先在於泮宫內與賢臣謀事焉故其返也則蹻蹻然有威武如虎之臣在泮之宫而獻馘又有善問之臣如臯陶者在泮宫之下獻所執之囚則必使善聽訟之臣察其辭而斷其罪也古者建學校養人材在此飲酒在此受成在此獻功在此則學校之制不為虛設也鄭之鄉校以議執政之善否則是學校之建其有補於風化多矣豈徒文具而已哉後世之建學校不過誇示人物之盛求其有補於風化則未也僖公之所為未必如是然詩人之辭非不美不可以溢美而廢其詩也此下文申言服淮夷之事言多士濟濟而有威儀而能廣大其德心矣夫人心可謂廣矣以其無所不至無所不有也惟其為血氣所使一有豪髮之利則忿而爭其心於是乎隘惟其洪厚未嘗偏躁此其心所以廣也心之廣矣故往征伐也則桓桓然而有威武逖逺淮夷於東南之地不得虔劉我邉陲其功可謂大矣然多士又蒸蒸然而厚皇皇然而大未嘗喧譁未嘗輕揚無以爭訟之事而告於治獄之官惟在泮宫之中獻功而已此其所以為多士歟吳大聲也揚輕揚也訩訟也夫征伐有交爭者則必告於治獄之官左傳襄公二十六年楚子侵鄭鄭皇頡戍之出與楚師戰敗穿封戍囚皇頡公子圍與之爭之正於伯州犂伯州犂曰請問於囚乃立囚伯州犂曰所爭君子也其何不知上其手曰夫子為王子圍寡君之貴介弟也下其手曰此子為穿封戍方城外之縣尹也誰獲子囚曰頡遇王子弱焉若穿封戍與公子圍爭安得為不吳不揚乎安得為不告于訩乎惟魯之臣子皆重厚未嘗有爭忿之心則其報功之際無有以所爭之訟告於治獄之官則治獄者不過斷囚之輕重而已蓋爭其功者戰士之常也僥幸一勝於萬死一生之間惟圖厚賞而已則其爭功無所不至如王濬王渾平吳渾則以濬為不受節度濬則以疏辨其非二人文爭如仇讎焉以魯人觀之則知渾濬為非矣蓋以魯之多士觀之則渾濬之心不得謂之濟濟伯州犂不得謂之淑問也此下文言魯之君臣不以一勝之故遂驕其志也淮夷既克之後其角弓則觩然而陳設其束矢則徑疾其戎車則甚大所謂徒御者無有厭斁克平淮夷之後且如此可謂能持勝矣克平淮夷之後既已甚善而無有叛逆猶且固其謀猷此淮夷所以卒獲也夫一戰而驕則必墮敵人之計雖獲勝反以致敗所謂暫勝而已安得以為卒獲乎惟其既服淮夷之後其為謀也愈深故不墮敵人之計而敵人所以逺遁而臣服也翩彼飛梟乃取譬也梟惡鳥也翩然而飛者惡鳥也今乃集于泮宫之林食我泮宫之桑黮懷我好音集于泮林此則取喻淮夷慕泮宫之化也懷我好音此則取喻淮夷之歸於我無有惡聲也憬説文曰覺悟也既來歸魯故獻其國之珍寶所謂珍寶者何也元龜也象齒也又有南方之金以見其向化也如此向也征伐淮夷猶未必心服今也來獻其琛元龜象齒大賂南金則可謂心恱誠服矣觀書所載魯侯伯禽宅曲阜徐戎並興東郊不開作費誓以魯侯之時淮夷為患猶且如此則淮夷世世為患久矣今僖公之時乃使之來獻其琛元龜象齒大賂南金果何道而致之邪孟子曰以善服人者未有能服人者也以善養人然後能服天下觀武王作辟雍也自東自西自南自北無思不服若武王者可謂能以善養人者也今僖公乃能為武王之所為乎使僖公果能為武王之所為則是春秋之諸侯亦可以比肩武王矣黃曰天子之學曰辟雍諸侯之學曰泮宫故雅稱武王曰鎬京辟雍無思不服而頌稱僖公曰既作泮宫淮夷攸服夫世俗以學校為不急之務而武王以之服天下僖公以之服一國此所謂善政不如善教之得民也孟子當戰國之時而以謹庠序之教為急使戰國之君能去其世俗之説而從吾孟子之説則國不必富兵不必強人心歸之有不可辭者泮宫之頌八章而三章皆以思樂泮水為言夫泮水之中初無可説可玩而人情之樂形於歌詠不能自止其所樂果何事邪孟子曰人樂其父兄之賢者而菁莪之詩亦曰能長育人材則天下喜樂之矣魯人之樂泮水非樂乎泮水也樂乎僖公之賢而人材所賴以長養成就也樂心一生則烏可已觀其旗則樂其茷茷聞其鸞則樂其噦噦見其馬則樂其蹻蹻愛其人則亦愛其物也薄采其芹薄采其藻芹藻微物也而樂之有餘所樂者在僖公而寓於芹藻也吁僖公何以得此於人哉載色載笑即之也溫匪怒伊教循循善誘其心休休而有容粹然而不怒僖公育材可見矣穆穆魯侯敬明其德敬慎威儀維民之則夫容貌之溫威儀之謹此豈勉強所能為哉溫良本於天性則有自然之和至誠得於素養則有自然之恭動容周旋而中禮然後見其盛德之至僖公之所以為賢者益可見矣在泮獻馘在泮獻囚在泮獻功以見僖公雖征伐聽訟之事而不忘庠序之教也在泮飲酒以見僖公略其邦君勢位之尊而與賢者相忘於醉酒飽德之樂也吁僖公之賢如此魯人將何以報之邪翩彼飛梟集於泮林食我桑黮懷我好音夫梟何知也而猶懷其好音況於人乎憬彼淮夷來獻其琛元龜象齒大賂南金淮夷何知也而猶感其德況魯國乎惟僖公有不可忘之德而魯人有不能忘之情則相與頌而歌舞之以期長守富貴而與過厯之期相為無窮也故曰既飲旨酒永錫難老此豈魯人之私願邪仁者之夀天理之必然而亦人情之公願也夫鄭國之學不修子襟刺之僖公既修泮宫魯人頌之世俗以學校為不急之政而乃人情怨樂之所係則是果為不急之政邪惟當時之急乎此而僖公獨先之此魯人之所以頌其能修泮宫也毛詩集解卷四十
