body:
  text: 毛詩集解卷二十三宋李樗黃櫄撰斯干宣王考室也秩秩斯干幽幽南山如竹苞矣如松茂矣兄及弟矣式相好矣無相猶矣似續妣祖築室百堵西南其户爰居爰處爰笑爰語約之閣閣椓之橐橐風雨攸除鳥鼠攸去君子攸芋如跂斯翼如矢斯棘如鳥斯革如翬斯飛君子攸躋殖殖其庭有覺其楹噲噲其正噦噦其冥君子攸寧下莞上簟乃安斯寢乃寢乃興乃占我夢吉夢維何維熊維羆維虺維蛇大人占之維熊維羆男子之祥維虺維蛇女子之祥乃生男子載寢之牀載衣之裳載弄之璋其泣喤喤朱芾斯皇室家君王乃生女子載寢之地載衣之裼載弄之瓦無非無儀唯酒食是議無父母詒罹李曰宣王考室也禮記曰晉獻文子成室晉大夫發焉所謂成室即此類也鄭氏曰宣王於是築宮廟羣寢既成而釁之歌斯干之詩以落之此之謂成室鄭氏所謂歌斯干以落之其言則是而其言羣寢既成而釁之則非也雜記曰路寢成則考之而不釁焉安神明之道也則此斯干考室未嘗釁也而鄭氏以謂築室羣寢既成而釁之豈其然乎秩秩斯干鄭氏則以秩秩斯于幽幽南山如竹苞矣如松茂矣兄及弟矣式相好矣無相猶矣為一章歐陽則以秩秩斯干至如松茂矣為一章然鄭氏之說則以宣王之德如澗水之源秩秩流出無極已也國以饒富民取足焉如於深山如竹苞矣如松茂矣則以為言民殷衆如竹之本生矣其佼好又如松柏之暢茂矣不如歐陽氏以為頌禱之辭其說為優今當從其說而用鄭氏之意秩秩有常干澗也幽深也言澗也山也各有常處而不遷以譬宮室之固者也爾雅所謂如竹箭曰苞如松柏曰茂苞本也蓋言竹也松也生於山澗之間茂盛而不雕正如所謂如竹箭之有筠如松柏之有心貫四時而不改柯易葉譬如人之居此宮室安樂夀考之久亦如松柏之在山澗也兄及弟矣式相好矣無相猶矣猶毛氏曰道此非也鄭氏作愈亦非也惟王蘇歐陽皆曰訓圖其說為長蓋言宣王之時兄弟之居此室各相和好輯睦無有相圖以見其居此室而安也似續妣祖築室百堵似繼也鄭氏曰似續若己午之已似續妣祖者己成其宮廟也其說非詩人之本意王氏曰似續妣祖言其宮室內外皆如先王之制繼紹先王之制而築室於百堵言其宣王之居處可謂安矣蓋言其百堵皆興也夫一人之情千萬人之情是也人君有髙臺深池之安必思吾民得安其居焉況夫古者宮室則欲民有棟宇宣王之時其考室也築室百堵又遣使招集流民而百堵皆作則斯民必有居處也若宣王者所謂與民同其憂樂也西南其户者西南向也然其所以西南其户者則於此居處於此笑語而已爰居爰處爰笑爰語即禮記所謂歌於斯哭於斯聚國族於斯是也約之閣閣此章言其築牆也方其築牆以繩縮板其繩則在乎板上厯厯然而均閣閣猶厯厯也椓之橐橐言其既已成縮板則投土於板以杵椓築之皆橐橐然而用力然其所以如是也蓋將以除風雨而去鳥鼠也芋毛氏曰大也孔氏曰宮室既成君子處之所以為光大也歐陽氏曰君子增大而新之也蘇氏曰君子於是居焉所以為尊且大也此皆因毛氏之說而求之然蘇氏之說為優如跂斯翼至君子攸躋此章言其堂也鄭氏謂主於宗廟非也七月詩曰躋彼公堂今此詩下言君子攸躋則知其為堂也明矣如跂斯翼言其嚴正如人之跂足翼翼而恭也如矢斯棘言其四隅如矢之急直也如鳥斯革言其峻起如鳥之驚而革也故歐陽曰謂如鳥驚變而竦顧也革變也如翬斯飛言其軒翔如翬之飛而矯其翼也翬素質五色皆備成章曰翬君子攸躋言君子於是升此堂也殖殖其庭至君子攸寧此章言其路寢也殖殖平正也覺直也噲噲猶快快也噦噦猶煟煟也蓋言其正晝之時則快然而明至於夜間晦昧之時則噦噦焉蘇東坡詩曰晝窗明快夜堂深皆本於此君子攸寧言君子居之而安寧也下莞上簟鄭氏曰小蒲之席也竹葦曰簟陸德明曰莞草生水中鄭氏寢既成乃鋪席與羣臣安燕為歡以樂之非也據上文言宮室之成宮室既成此蓋鋪莞簟以寢臥下云乃興則是為寢臥矣非謂鋪席與羣臣燕安為歡以樂之此蓋言其有莞簟乃安寤於寢室之中既寢而興乃占其夢或夢熊羆或夢虺蛇此皆設為之辭以見其祝頌之辭非真夢也大人占之鄭氏曰謂以聖人之法占之不如王氏謂當時在位之大人也其大人占之曰維熊維羆此男子之祥也維虺維蛇此女子之祥也蘇氏曰熊羆物陽之祥也虺蛇物隂之祥也王曰熊羆強力壯毅故為男子之祥虺蛇柔弱隱伏故為女子之祥此二說皆通蓋人之夢各有其類故祥若此乃生男子男子之初生也則寢之牀牀尊之也裳晝服也載衣之裳明其主外事也載弄之璋欲其有德也其泣之聲則喤喤然至其長大則皆佩朱芾朱芾者天子之服也天子純朱諸侯黃朱皇猶所謂皇皇者華是也室家君王言室家之內皆是君王者也君謂諸侯王謂天子也女子之初生則寢之地地卑之也裼夜服也載衣之裼明其主內事也瓦紡磚也男子之初生則玩以璋女子之初生則玩紡磚則古人之教其子也已無非僻之心矣安得風俗而不淳厚乎無非無有非僻也無儀無有不善也猶所謂無咎無譽也唯酒食是議蓋女人之職惟議其酒食而不遺父母之憂也男子則冝其君王女子則冝其室家蓋祝頌之辭也論曰劉向曰周德既衰而奢侈宣王賢而中興更為儉宮室小寢廟詩人美之蘇氏曰厲王之世亂而宮室敗壞宣王謀所以績其先祖先妣者蓋築其宮廟一則以為因其敗壞而作新之也一則以為因其奢侈而革之以儉也然皆無所經見不足信也竊觀此詩則知宣王之營宮室可謂得禮不失之侈亦不失之陋觀詩中作宮室之制如所謂如跂斯翼如矢斯棘如鳥斯革如翬斯飛等句不失之陋矣然其作室也將以除風雨而去鳥鼠則不失之侈矣則於先王之為宮室非徒為美觀將以承先王所為而已故曰似續妣祖易曰上古穴居而野處未有宮室後世聖人易之以宮室上棟下宇以待風雨古聖人作宮室之意惟欲待風雨而已然尊卑不可無别而於此又不可以逼下考之周禮宮室之制廣狹小大皆有法度存乎其間後之人君失其意肆為奢侈千門萬户之宮神明通天之臺勞民費財無所不至其禍有不可勝言者則後世欲求作室之意者當以周禮斯干求之黃曰雜記載子羔言曰成廟則釁之路寢則考而不釁考者設酒食以燕樂之也古者成室而燕之必有祝頌之辭如晉獻文子成室大夫發焉所謂歌於斯哭於斯聚國族於斯與夫美哉輪奐之意君子謂之善禱故斯干一詩皆考室稱頌之辭也先則言其基址壯厚而不拔兄弟之安居而不爭次則言其室家之制度居處之歡悅又次則言其垣牆之固棟宇之麗堂室之美至末數章則願其男女之衆多子孫之蕃衍而禱頌之意盡矣雖然當天下甫定之餘而遽役民以宮室之事豈不過乎司馬光嘗曰天下未定當克己節用以趨民之急而顧以宮室為先豈可謂之知務哉嘗觀鴻鴈之詩見宣王所以勞來天下之民者無所不至散四方者安其居轉溝壑者得其所之子于垣百堵皆作而民有其室矣然後可以樂吾樂而無愧也宣王先天下之憂而憂後天下之樂而樂此吾聖人所以深取之與昔者蕭何治未央宮髙帝見其壯麗甚怒曰天下洶洶勞苦數歲成敗未可知是何治宮室之過度也何曰天子以四海為家非令壯麗則無以示威夫何之言則固有為之言矣而非為子孫法至於孝武皇帝以宮室疲敝天下千門萬户之宮神明通天之臺豈非蕭何啓之歟噫章臺之土未乾而楚宮之禍已至阿房之工未畢而秦室之亡已兆因詳論之以為後世人君之戒無羊宣王考牧也誰謂爾無羊三百維羣誰謂爾無牛九十其犉爾羊來思其角濈濈爾牛來思其耳濕濕或降于阿或飲于池或寢或訛爾牧來思何蓑何笠或負其餱三十維物爾牲則具爾牧來思以薪以蒸以雌以雄爾羊來思矜矜兢兢不騫不崩麾之以肱畢來既升牧人乃夢衆維魚矣旐維旟矣大人占之衆維魚矣實維豐年旐維旟矣室家溱溱李曰鄭氏曰厲王之時牧人之職廢宣王始興而復之至此而成夫考牧者亦猶斯干所謂考室也考則言其歌以落之至於考牧則牧事有成恐與考室不倫然則所謂考牧者乃牧養之處而考之乎誰謂爾無羊至其耳濕濕羊非止於三百也言以三百為一羣則其羣尚多也安得謂之無羊乎故曰誰謂爾無羊黃牛黑脣曰犉九十其犉者言犉者之有九十則不犉尚多也安得謂之無牛乎故曰誰謂爾無牛孔氏曰羊三百頭而為一羣故一羣有三百不知其羣之有多少也犉者九十頭故知犉者有九十亦不知其不犉者之數也此說是也思辭也其角濈濈言其角聚濈濈然王氏曰聚而不相觸也羊以善觸為患蓋羊好抵觸故以其角濈濈為善也爾牛來思其耳濕濕言牛以呞而動其耳濕濕然陸農師曰其耳濕濕言潤澤也蓋牛之為物病則耳燥安得濕濕潤澤也故古之視牛者以耳濕濕則牛之安可知也祭義所謂卿大夫袒而毛牛尚耳也或降于阿至或寢或訛此言牛羊之得所也言或降于阿或飲于池或寢或訛動息各遂其性也訛者動也爾牧來思至爾牲則具此言牧人之得所也蓑所以禦雨笠所以禦暑餱食也言其飲食寒暑皆備也三十維物爾牲則具言毛色之物有三十或青黃赤白黑毛色别異者有三十物既别如此故其牲牷皆具祭祀則索而有之徐安道曰毛色異物各三十其牲具矣犉牛九十則三倍之羊三百則十倍之爾牧來思至不騫不崩此言牧人之有力以取薪蒸以雌以雄鄭氏以為摶禽獸以來歸王氏亦用其說歐陽則破其說以謂牛羊在野牧人有餘力於薪蒸而牛羊以時合其牝牡所以云此者見人畜各遂其樂也蘇氏亦本此說矜矜陸農師曰言羊之愛牧人也兢兢言羊之畏牧人也此說為鑿不如且從毛氏以為堅強騫虧也崩羣疾也言羊之不耗散也陸農師曰羊之為物多瘦而病而又死善耗敗故於不騫不崩舉羊言之也禮云羽鳥曰降四足曰潰潰者謂死相殱潰而善耗散也六畜言死皆善耗散而羊尤甚故齊民要術曰羊有疾輒相汚此言是也麾之以肱畢來既升此言擾馴以從人之意也言麾之以肱則皆來入羊牢也牧人乃夢此章言占夢之事則亦如考室言占夢之事鄭氏以為衆相與捕魚則是歲熟相供養之辭也室家溱溱則以為人之子孫衆多也歐陽氏則破其說以謂據詩言衆維魚矣但言魚多爾何有捕魚之文及人之子孫皆不關牧事詩人本為考牧不應泛言獻夢而為鄭學者遂附益之以為庶人無故不殺雞豚惟捕魚以為養此為繆說不待論可知以為魚之為物生子最多故夢魚者占為豐年歲無水旱則野草茂而畜牧飽此牧人之樂也室家溱溱謂牛羊蕃息衆多也鴟梟之詩曰豫未有室家則鳥獸以所居為室家矣牛羊牢攔亦其室家也今當用其說旗旐所以集衆故為蕃息衆多之兆也論曰漢時卜式為郎布衣草蹻而牧羊歲餘羊肥息上過其羊所善之式曰非獨牧羊也治民亦猶是矣以時起居惡者輒去無令敗羣式之此言蓋有得於莊子之說也莊子所載黃帝將見大隗乎具茨之山遇牧馬童子問塗焉因問為天下之道小童曰夫為天下者亦奚以異乎牧馬者哉亦去其害馬者而已蓋言牧人得其道則牛羊自然蕃息牛羊蕃息則可以知當時萬物之盛多也蓋古人以畜牧之多寡而見其國之興衰宣王之時牛羊之數如此其國可知也然觀此詩之善形容數言或降于阿或飲于池或寢或訛以見牛羊之得其所荷蓑荷笠或負其餱三十維物爾牲則具又以見牧人之得其所至於麾之以肱畢來既升等句皆曲盡物態詳味此詩有似牛羊之畫圖古人所謂詩中有畫者請以無羊觀之杜子美而下特其小者矣黃曰厲王亂亡之後宮室廢矣宣王從而新之於是有考室之詩牧職廢矣宣王從而復之於是有考牧之詩考牧者亦因其牧圉之成而作為禱頌之辭也古人以生畜之多寡而卜其國之興廢故奉牲以告曰博碩肥腯謂民力之普存也謂其備腯咸有也於是民和而神降之福故動則有成此禱頌之辭所以詳及於牛羊之衆多牧人之安逸以見其民物富庶之效也前輩謂無羊一詩似畫出牛羊圖所謂詩中圖畫是也牧人乃夢與斯于言乃占我夢皆是設辭非果有是夢也宣王中興而富庶之效己襲人之耳目不待夢卜而後信而詩人言之者蓋以人情當飢饉之餘則莫不以豐年為願也當離散之後則莫不以室家為念也人情之所欲者在此則詩人之所言亦在此學者當以意逆之節南山之什詁訓傳第十九變雅從此始小雅節在切反南山家父刺幽王也節彼南山維石巖巖赫赫師尹民具爾瞻憂心如惔徒藍反不敢戲談國既卒子律反斬何用不監古銜反節彼南山有實其猗於冝反赫赫師尹不平謂何天方薦瘥才何反喪亂𢎞多民言無嘉憯七感反莫懲嗟尹氏大師維周之氐丁禮反秉國之均四方是維天子是毗皮尸反俾民不迷不弔丁立反昊天不冝空我師弗躬弗親庶民弗信弗問弗仕勿罔君子式夷式已無小人殆瑣瑣姻亞於嫁反則無膴音武仕昊天不傭降此鞠訩音凶昊天不惠降此大戾君子如届俾民心闋苦穴反君子如夷惡怒是違不弔昊天亂靡有定式月斯生俾民不寧憂心如酲音呈誰秉國成不自為政卒勞百姓駕彼四牡四牡項領我瞻四方蹙蹙子六反靡所騁方茂爾惡相爾矛矣既夷既懌音亦如相酬矣昊天不平我王不寧不懲其心覆怨其正家父作誦以究王訩式訛爾心以畜萬邦李曰家父周大夫也按春秋桓公十五年天王使家父來求車桓公之十五年上距幽王之卒七十五年不知言所謂家父者乃春秋所謂家父乎不可得而知也或曰幽王之時有兩家父又曰父子皆字家父或又以為追刺幽王皆不知其真而意之未敢信也歐陽公不以此詩為家父所作為序者之誤然觀此詩末句如嵩髙蒸民詩言吉甫作頌分明是家父吉甫所作無疑矣節彼南山毛氏曰髙峻貌巖巖積石貌師尹毛氏曰師大師周之三公也尹氏為大師徐安道曰大誥曰越尹氏庶士御事尹氏庶官之長也言尹氏太師則三公兼庶官之長竊嘗考詩書中皆有師尹之人如洪範曰師尹惟日此師尹不可以指其人如詩曰尹氏太師是尹氏為太師眀矣春秋書曰尹氏卒譏世卿也其後又書尹氏立王子朝則尹氏之為世卿其來甚久詩所謂尹氏太師正春秋所謂尹氏當幽王之時專政至平王之世猶為卿故春秋之末猶且專權則其為世卿也明矣節彼南山維石巖巖言以山石之巖巖然四方皆可以逺望而見之以譬赫赫然之師尹為萬民之所瞻仰惟其為民之瞻仰則其行事也必有以副民心之望矣大學曰詩曰節彼南山維石巖巖赫赫師尹民具爾瞻有國者不可以不慎辟則為天下僇矣蓋為民所瞻不可以不慎一或不慎則為天下僇不足以為民所望也今也師尹所為不足以副羣心之望故憂心如惔惔燔也雲漢曰如惔如焚惔焚之類也惟其憂之甚故不敢相與戲而談言國之必亡也其言非戲實其國之將亡也國既卒斬卒終也監明也言國既如此終至於滅盡為師尹者何不視之乎鄭氏曰天下之諸侯日相侵伐其國已盡絶滅女何用為職不監察之非也蓋此詩言所謂國者不必指諸侯只是言周之將亡而師尹乃恬然而不之慮也節彼南山有實其猗實草木也猗長也如緑竹猗猗是也言南山之生物而草木無不茂也為師尹者冝盡其公心則物無不平今師尹之所為乃不能平心處事則事之不公者多矣是果何為邪薦重瘥病也左傳昭十九年札瘥夭昏杜元凱注曰小疫曰瘥也𢎞大也喪亂𢎞多言喪亂之大而多也民言無嘉嘉美也蓋謂民無善言但怨讟爾憯曽也懲艾也嗟憫也天方薦瘥喪亂𢎞多是天怒也民言無嘉憯莫懲嗟是民怨也天怒於上民怨於下冝其可以覺悟而乃曾不懲艾嗟閔者以見尹氏為惡常自若也王氏於維石巖巖曰南山之髙草木無不生之而維石巖巖此剛節也於此章則言南山之卑有草木生之以實其傍之畝谷此柔節也此皆鑿說也若以草木無所生為美事則草有所生為可刺矣剛柔之節詩人本無此意皆是於詩人之外自生此義也尹氏大師維周之氐氏本也言尹氏乃周之根本其任之重可見矣當有以持國之鈞使無輕重於國外以維制四方內以毗輔天子使民不至迷惑觀上文言不平謂何則是尹氏之不均也惟其不均則何以制四方而輔天子哉伊尹曰豫將以斯道覺斯民也天之生斯民也使先知覺後知使先覺覺後覺豫天民之先覺者也非豫覺之而誰所謂覺民必如伊尹而後可今尹氏所為如此安能覺民而使不迷惑哉惟其不能平心處事外不能維制四方內不能毗輔天子其民之迷無所覺悟則其亂必矣尹氏專以致國之亂至於如此故呼天而告之曰昊天不弔而使我空窮如此不宜空我師言不冝如是之空窮我師王氏曰尹氏空我師而歸怨昊天師尹之所為王實使之而王之所為天實使之也龜山辨之詳矣曰天下罹此鞠訩知其無可奈何安之若命不敢以尤人故歸之天而已毛氏以弔為至鄭氏乃曰至猶善也歐陽氏不從其說以為昊天不弔哀此下民而使王政害民如此是也蓋此所謂不弔昊天如書云不弔昊天降割于我家不少延弗弔天降喪于殷相似左氏傳曰成七年吳代郯郯成季文子曰中國不振旅蠻夷入伐而莫之或恤無弔者也遂引此詩弗弔昊天之言為證則不弔不恤也襄十三年吳侵楚喪君子以吳為不弔亦引此章不弔昊天杜氏注曰不為昊天所恤則不弔為不恤明甚凡人之遭患難或呼天或呼父母此其常也北門之詩刺仕不得志也曰天實為之謂之何哉黍離之詩閔宗周之為禾黍曰悠悠蒼天此何人哉則是人之遭患難多呼天也弗躬弗親前數章既深責尹氏此章則責幽王信任師尹也言王不躬親其事使師尹得以專恣也夫所謂躬親者不必如始皇衡石程書不必如魏文帝之按行簿書也天子當攬權於上不可使出於臣下今王權不出己故使尹氏得以專恣下文不自為政是也惟其如此故庶民皆疑之而不信也仕察也君子之所為王當問而察之則人之邪正可知矣今尹氏誣譖君子王不問察便以君子為可罪則是罔君子故戒之以勿罔君子言王問察其事則以君子為有罪猶云可也今弗問弗察便以君子為非非罔君子乎為王者當平其心而已蓋公生明偏生暗王者之道無黨無偏王道平平無反無側王道正直苟能平其心而正之則君子小人之情狀不能逃吾之視聽惟其不公此小人所以得志也故教之以平其心而使小人不得進則不為小人之所危矣故曰式夷式已無小人殆夷平也殆危也不為小人之所危則其瑣瑣然之姻亞亦無豐厚之仕也壻之父曰姻兩壻相謂曰亞言其信師尹故師尹之姻亞得以類進蓋師尹之不平如此甚也昊天不傭傭均也昊天不傭降此鞠訩鄭氏曰昊天乎師尹為政不均乃下此多訟之俗此非也與下文昊天不惠皆以不平不均歸之於天言天何使我不均而降鞠訩也鞠盈也訩訟也言民盡訟也昊天不惠降此大戾鄭氏曰又不為和順之行乃下此乖爭之化亦非也此正如瞻卬昊天則不我惠言天之不我愛也天不我愛故降此大乖戾也蘇氏以為昊天不常而有此謗訟歟非也以昊天不順而降此罪戾歟非也此其說為甚繆於鄭氏矣鞠訩大戾雖則如此然王者但恐懼修省則可以去其災矣故教之以在上君子如届俾民心闋言已去小人則民心自闋矣安有鞠訩乎但夷平其心而考君子小人之所為惡怒是違矣安有大戾乎君子如届届至也如上文所謂式已也君子如夷如上文所謂式夷也夷平也闋息也不弔昊天亂靡有定此章又言天之不弔問我民而亂未有所止且與月俱生言其日浸月長使民不得安其居故我心之憂如病酒然且歎其誰能秉國之平者乎成平也苟能秉國之成則無是患矣尹氏不平謂何則是秉國之成矣所貴乎大臣者貴乎均一而已陳平之宰肉社下以謂使我得宰平天下亦當如宰此肉則大臣必當得均一之道然後可矣尹氏失均一之道所以歎曰誰秉國成幽王之不自為政故使尹氏用事徒使百姓憂苦而不得安其居所謂不自為政即前所謂弗躬弗親庶民弗信是也鄭氏以謂天不出圗書其言且怪可鄙矣駕彼四牡鄭氏以此四句分為兩意上二句則以為大臣專恣下二句則以見四方土地日以侵削於夷狄蹙蹙然雖欲馳騁無所之也歐氏不從其說合為一意言我駕此大領之四牡顧天下王室昏亂諸侯交爭而四方皆無可往之所其說為簡徑言我心之憂如此而為大臣者方且為惡日熾視其戈矛欲相征矣言其快私怒也既和且平無事則又如賓主飲酒相酬然蓋其性之無常如此所謂喜者私喜而已所謂怒者私怒而已言其私喜怒不在國家也昊天不平言天不使我均平使我王不得安寧今王不自懲艾其心而反怨人臣之正己者小人之專權可以去之而不去忠臣之正己者不可怨而怨之是誠不可與為善者也故家父作此詩以窮王所以致訟之由庶幾訛王之心以養萬邦也孟子曰人不足與適也政不足與間也惟大人為能格君心之非蓋用人之失政事之過雖皆是王之非然未嘗先論也惟當格君心之非則政事無不善矣用人皆得其當矣故家父欲以訛王之心心既正則小人不得用而君子進萬邦之受其賜必矣正月大夫刺幽王也正月繁霜我心憂傷民之訛言亦孔之將念我獨兮憂心京京哀我小心癙憂以癢音羊父母生我胡俾我愈不自我先不自我後好言自口莠餘久反言自口憂心愈愈是以有侮憂心惸惸其營反念我無祿民之無辜并其臣僕哀我人斯于何從祿瞻烏爰止于誰之屋瞻彼中林侯薪侯蒸民今方殆視天夢夢莫紅反既克有定靡人弗勝有皇上帝伊誰云憎謂山蓋卑為岡為陵民之訛言寧莫之懲召彼故老訊音信之占夢具曰豫聖誰知烏之雌雄謂天蓋髙不敢不局謂地蓋厚不敢不蹐井亦反維號音豪斯言有倫有脊哀今之人胡為虺暉鬼反蜴星厯反瞻彼阪田有菀其特天之扤五忽反我如不我克彼求我則如不我得執我仇仇亦不我力心之憂矣如或結之今兹之正胡然厲矣燎之方揚寧或滅之赫赫宗周褒姒滅之終其永懷又窘隂雨其車既載乃棄爾輔載輸爾載將七羊反伯助豫無棄爾輔貟音云于爾輻方六反屢顧爾僕不輸爾載終踰絶險曾是不意魚在于沼亦匪克樂潛雖伏矣亦孔之照之若反憂心慘慘念國之為虐彼有㫖酒又有嘉殽洽比其鄰昏姻孔云念我獨兮憂心殷殷佌佌音此彼有屋蔌蔌音速方有穀民今之無祿天夭是椓哿矣富人哀此惸獨李曰正月夏之四月也非建寅之正月也昭十七年夏日有蝕之祝史請用幣平子禦之曰惟正月朔慝未作日有食之於是乎伐鼓用幣禮也其餘則否此所謂正月與左傳所謂正月同孟夏之四月正陽之月隂慝未作也夏之四月而有繁霜方為災害若建寅之正月有霜則不得為災也則知正月非建寅之正月也當為夏之四月也正月繁霜孔氏曰正陽之月而有繁多之霜是由王急酷之異以致傷萬物故我心為之憂傷也有霜由於王急酷致於訛言則此民之訛言為害亦甚大矣孔氏之意以霜之所以降者以訛言之致此說非也王氏曰正月繁霜民之訛言亦孔之將故我心憂傷也蓋為非有繁霜但訛言爾此說亦非歐氏曰降霜非時天災可憂而民之訛言以害其國其害甚於繁霜之害物也此說得之蓋以正月之陽而有繁霜我心固已憂傷矣今也民又訛言其言甚大則其心之憂愈甚矣將大也京京憂之不去也癙癢皆病也夫繁霜訛言之為害幽王與羣臣皆莫之憂惟此正月大夫憂之而已故哀小心而病也夫在天則有繁霜之異在人則有訛言之害其禍不難知也幽王之君臣而莫以為憂者蓋亂亡之世常安其危而利其菑夏商之季至於漢唐之末天災屢見非不明甚民心謗讟非不深切而君臣未有覺悟者蓋不如是則國不之亡也紂之時失日而不知問於左右左右不知問於箕子曰為天下主而一國失日天下其危乎一國不知而我獨知之我其危乎今幽王之世繁霜訛言為害上下相蔽曽莫之憂則周室危矣一國莫以為憂而正月之大夫憂之大夫其危矣父母生我胡俾我愈此言深歎生之不逢時也愈病也言父母之生我胡為使我戚戚無聊而至於愈乎不自先時如此不自後時如此而適遭此時所謂我生不辰逢天疸怒是也毛氏以父母為文武非也不自我先非欲其祖先適當用之也不自我後非欲其子孫適當用之也此特深序其怨歎之辭自傷其適遭此時有此災厄也好言自口此則言小人之巧僞其言之美惡惟意好之者至於鑽皮出羽故為好言惡之者至於洗垢索瘢故為惡言莠言醜言也特任口之所出而不得其可愛可惡之實也我心之憂而愈愈然是以有侮也幽王之時在位無非小人而正月大夫間於小人之列小人不以為憂而惟大夫為憂安得不遭其侵侮哉安得不罹其謗讟哉惸惸亦是已獨憂也無祿陳少南曰猶言不幸此說是也民之無辜并其臣僕此言幽王之刑濫其民之無罪者既殺矣而又并其臣僕皆從而陷於刑網以見其虐之甚也大夫見其如此故自傷其國政如是曰我何為而祿仕於此乎視彼烏之所止者於誰之屋乎必有所擇也蓋以烏之所止猶避其弋射之患而我乃處無道之朝何也左𫝊曰鳥則擇木木豈能擇鳥哉烏鳥微物猶有所擇自歎已之不如烏也瞻彼中林侯薪侯蒸侯維也鄭氏王氏皆以薪蒸喻小人此說固無害然不如蘇氏曰中林之木莫不摧毁而維薪蒸在焉其殘之也甚矣其說與下文相貫言民之危殆如中林之木非不美也而乃為人所殘害天乃夢夢然而莫之覺察夢夢昏亂之貌也雖然天意豈真若是哉但天意未定爾故曰既克有定靡人弗勝蘇氏曰方其未定也何所不至及其既定人未有不為天所勝者申包胥曰人定則勝天天定亦能勝人而老子所謂天網恢恢踈而不失不然則天豈有所憎而禍之者邪適當其未定故耳此言皆諸儒之所未及也謂山蓋卑此則以喻訛言者謂山蓋卑則有為山脊言者有為大阿言者而皆以為卑民之訛言變白為黑如此乃不懲止何也故曰謂山蓋卑為岡為陵民之訛言寧莫之懲訛言可懲而王曽莫之恤乃召彼故老不問之以政事而乃問之以占夢則其所問者非所冝問也賈誼之於文帝問之以鬼神之事說者猶譏以為不問蒼生而問鬼神況夫訛言之為害如此王乃舍之而問占夢之事可謂非所問而問也具曰豫聖誰知烏之雌雄言幽王之君臣自以為聖而無有知烏之雌雄者夫烏之雌雄豈難知哉雖常人猶知之不待聖賢始知之也自以為聖而烏之雌雄乃不能别則其與菽麥不辨亦無以異其敢自以為聖乎夫聖孔子不居以孔子之聖猶不敢居聖人名而幽王何人乃自以為聖乎自以為聖則又不肯以其國事而下問其臣故但問以區區不急之事則國家安得而不亂也謂天蓋髙不敢不局局毛氏曰曲也蹐毛氏曰纍足也說文曰小步也孔氏曰謂天蓋實髙矣而有雷霆擊人不敢不曲其脊以欽之謂地蓋厚矣而有陷溺殺人不敢不纍其足以畏之此說是也局曲其身也東京賦曰云云注曰局傴僂也以天之至髙冝其可以髙舉而乃傴僂而行以地之至厚冝其可以闊步而乃側足而行蓋言禍之不可測而安之不可恃也我之所以號呼而為此言皆有道理也哀今之人胡為虺蜴之毒安行無禮無所忌憚何也鄭氏曰虺蜴之性見人則走此非詩人之意也但取其虺蜴之毒耳瞻彼阪田此章言己之特立而無助也視彼阪田﨑嶇之處有菀然特盛之苖亦猶昏亂之朝有挺然特立之賢者特立之苖特生於阪田之中而天為風雨以扤動之惟恐其不勝亦猶賢者之特立而小人成羣思有以中傷之惟恐其不及也蓋皎皎者易汚嶢嶢者難全自古邪說之害君子多矣己之守正則為邪者所忌己之好諌則為邪者所嫉其道常不兩立故小人必思有以中傷而逐之然後已然在朝之臣其初求我以為法則惟恐失我非不好賢也及其執我以為仇則不我助也仇仇偶也此以見其孤立也以五隂而剝一陽則陽必消故曰剝剝也柔變剛也謂陽之剝落而至於盡也以見幽王之朝小人背君子其如幽王何心之憂矣如或結之此章言閔國之將亡也言我心之憂如有物纒結之者以國政之危故也鄭氏曰正長也憂念此之君臣何厲然為惡如是王氏又以正為邪正之正言正危則以邪勝故也此說比於鄭氏為長然不如歐氏之說正為政事之政言古用字多通也厲危也燎之方揚寧或滅之言火之燎于原寧有能滅之乎今也赫赫然方盛之宗周乃為褒姒所滅誠可駭也歐氏曰火燎于原其熱盛若不可嚮而猶或有撲滅之者周雖赫然而必為褒姒所滅也然詩本義正不如此顔師古嘗解此四句曰言火燎方盛寧有滅之者乎宗周之盛而為褒姒所滅怨其甚也此論得之褒國名也姒姓也褒姒猶所謂齊姜宋子也滅亦滅也此時周未滅而言滅者言其有滅亡之理也國語所載神龍吐漦檿弧箕服之謡雖曰知褒姒之必為害然其為說涉於怪誕不足取也今此正月之大夫知褒姒之必滅周者則以其國勢知之也卒之褒姒不好笑幽王欲其笑萬方故不笑幽王舉烽燧諸侯悉至而無寇褒姒乃大笑其後數舉烽燧諸侯亦不至卒有驪山之禍但以一笑而傾國家知此則傾人之國不在多也當此時也其去滅之時無幾矣歐陽曰上七章皆述王信訛言亂正至此始言滅周本於褒姒者謂王溺女色而致昏惑推其禍亂之本以歸罪之也終其永懷此章又言終其長思知君必陷於禍如困於風雨而載車以行其危可知而又棄其輔則其危甚矣輔輻傍之斜木也輸墮也既棄其輔則必墮敗爾車之所載既敗爾事方請長者以助不亦晚乎如晉惠公乘小駟慶鄭知其必悔弗聽既而戎馬還濘而止於是號慶鄭與此將伯助豫何以異自古昏亂之主國未至於亂則多忽賢者之言至於喪亡始思賢者之言有效雖悔昔日之不用已無及矣無棄爾輔此又詳陳駕車之所當然也不棄其輔又當益其輻屢顧其僕然後不墮敗爾車之所載不棄爾輔可謂慎矣然猶以為未也而又貟於爾輻貟于爾輻可謂慎矣猶以為未也而又屢顧爾僕然後不至於多難今幽王乃終然踰於絶嶮之地而不以為意其忽於禍難可知矣人而有畏禍之心此猶可救也今也曽不以禍難為禍難則末如之何也矣安得不輸爾載邪魚在于沼此章言居於亂世無所逃其禍如魚在池沼之中不足為樂雖潛伏之深亦昭昭然而易見蓋言禍難之不可逃如此故憂心慘慘念國之虐政不可逃也彼有㫖酒又有嘉殽言小人之徒自以酒食相樂而大夫獨憂也小人之徒以髙爵厚祿遂為酒食之歡雖為目前之樂而不知他日之禍旋踵而至也有㫖酒嘉殽和洽其鄰里與其親戚周旋而我獨憂心殷殷也云旋也言周旋也昔人有言曰燕雀處堂母子相安自以為樂也突決棟焚而子母恬然不知禍之將及也今國勢如此而小人之徒乃羣居飲酒以相樂殆燕雀之類也佌佌彼有屋佌佌小也說文佌字與此不同而訓以為小蔌蔌陋也言以小人而有屋之富祿之腆則小人之幸也小人之幸則民之不幸也民人不幸乃天之夭害以椓破之也民之遭虐富人猶云可為惸獨之人無以勝其貧實可哀也衰亂之世要其極也貧富俱受其禍言其一時之虐政富者之財猶可以勝其求貧者愈甚而不堪也然則為幽王之民者何其不幸歟幽王驪山之禍乃自取之而斯民受其禍斯民何罪焉毛詩集解卷二十三
