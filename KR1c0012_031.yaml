body:
  text: 毛詩集解卷三十一宋李樗黄櫄撰旱麓受祖也周之先祖世修后稷公劉之業大王王季申以百福干禄焉李曰旱麓受祖云受祖者言文王能受其先祖之業也周之先世自大王以來能世修后稷公劉之業守而不失至於大王王季又申之以福禄則其子孫所以承先祖之業者其所由來者漸矣瞻彼旱麓榛楛濟濟豈弟君子干禄豈弟瑟彼玉瓉黃流在中豈弟君子福禄攸降鳶飛戾天魚躍于淵豈弟君子遐不作人清酒旣載騂牡旣備以享以祀以介景福瑟彼柞棫民所燎矣豈弟君子神所勞矣莫莫葛藟施于條枚豈弟君子求福不回李曰瞻彼旱麓云云旱山名麓山足榛似栗而小楛木名也王氏之說則謂内有以致其文外有以致其武此牽強之說也詩人之言直以為草木濟然而盛多如此蘇氏曰山作雲雨以澤萬物而麓之草木亦被焉譬如周之先祖其所以利人者廣故其子孫亦受其福是也豈弟樂易也豈弟君子干禄豈弟言周之先祖有樂易之徳故其干禄亦自樂易也孟子曰經徳不回非以干禄干禄者非君子之所貴也有心於修徳無心於干禄則其為善出於誠心茍有心於干祿則其經徳是有所利也非誠也何足貴哉而此乃曰干禄者蓋周家君子之干禄異乎人之干禄也子張學干禄子曰多聞闕疑愼言其餘則寡尤多見闕殆愼行其餘則寡悔言寡尤行寡悔禄在其中矣能愼言行則禄在其中能樂易則禄斯至矣是所謂自求多福也蓋福豈可以求而得之哉惟能盡其在我則干禄之道也玉瓉圭瓉也以玉為柄用之以盛鬯也瑟鮮潔貌黄流秬鬯也以秬米為之以鬱金草和之使之芬芳條鬯其色如金又在酒器中流動故曰黃流鄭氏曰殷王帝乙之時王季為西伯以功徳受此賜其意以謂賜之圭瓉則是受其福禄也蘇黃門則以謂言其祭也此皆指此章為實事非也王氏則曰瑟彼玉瓉則以譬有美而能事鬼神黃流在中則譬美在其中而暢乎其外雖以為取譬然其說又不如程氏之簡勁也程氏曰瑟彼玉瓉其中所盛必黃流也豈弟君子則福禄所降必有賢子孫也鳶飛戾天毛氏曰上下察也此蓋援禮記以為說至於諸家說此多異鄭氏則以鳶飛戾天為惡人逺去以魚躍于淵為民喜得所言先祖之徳可以作後人也其說亦未易通愚竊以謂詩人所興皆是言文王之官人也嘗觀抱朴子曰鳶飛無力在下及至乎直網之上聳身直翅而已然然後知鳶飛更不用力亦如魚躍恬然自得而不知其所以然而然也王者之作人鼔之舞之使之盡其才亦不知其所以然而然也遐不作人言其逺作人也蓋言其作人之久也次章言以清酒則載之於器以赤色之牡則旣備言子孫享祀祖考而受此福也豈以清酒騂牡之故而得之哉古人奉牲以告曰博碩肥腯謂其民力之普存也謂其畜之碩大蕃滋也謂其不疾瘯蠡也謂其備腯咸有也奉酒醴以告曰嘉栗㫖酒謂其上下皆有嘉徳而無違心也所謂馨香無䜛慝也如此則神降之以福茍為不然則如隨侯之牷牲肥腯粢盛豐潔其何福之有瑟彼柞棫鄭氏曰瑟茂盛貌孔氏曰此柞棫所以得茂者正以為民所熂燎而除其傍草亦猶豈弟君子所以得福者正以為神所勞來也莫莫茂盛貌彼葛藟也乃縁於木之條榦附麗而生亦猶君子承其先祖之道以求福禄其求福也無所回邪惟承其先祖之道而已黃講同思齊文王所以聖也思齊大任文王之母思媚周姜京室之婦大姒嗣徽音則百斯男惠于宗公神罔時怨神罔時恫刑于寡妻至于兄弟以御于家邦雍雍在宫肅肅在廟不顯亦臨無射亦保肆戎疾不殄烈假不瑕不聞亦式不諫亦入肆成人有徳小子有造古之人無斁譽髦斯士李曰思齊文王所以聖也王氏曰所以聖者聖而不知是詩言大姒大任之徳而不言其所以然則文王聖而不可知於是乎在此說非也序之言所以聖者言文王之聖有所自來本於大王刑於大姒以至宗廟宫室之中皆無所不宜此其所以為聖也非聖而不可知也言思齊莊者大任也乃為文王之母又嘗思愛大姜之能配大王故能為周家之婦也而大姒又能繼大任之徳此天之所以使之多男子也古者親迎之禮父南向子北向而跪醮而命之曰往迎爾相成我宗事勗率以敬先妣之嗣者則有常夫為人婦而必事其先妣之事此古之賢女也以大任而能思愛大姜以大姒而又能嗣大任之徽音則周之賢妃可謂世不乏人矣以周之興大王肈基王迹王季其勤王家我文考文王克成厥勲治外事者其徳如此大姜之後有大任大任之後有大姒治内事者其徳如此此周之所以興也詩人於文王之時而言此蓋文王之徳本於大任大任能盡其為婦之道觀列女傳載胎教則文王由大任而成徳可知矣而大姒又能化文王之徳又繼大任之徽音其母與其匹如此則文王之徳可知矣惠于宗公宗公鄭氏以為大臣歐陽公已辨之矣蓋以宗公為臣其文不相連屬當從毛氏以為先公蓋言文王能上承宗廟先公又能推其心以事神無有怨者無有恫者以見文王事神無所不順者寡妻猶言寡小君也言文王治家惟能以刑法于寡妻以至于兄弟而後施之於邦無所不宜也中庸曰君子之道譬如行逺必自邇登髙必自卑詩曰妻子好合如鼓瑟琴兄弟旣翕和樂且耽宜爾室家樂爾妻孥以妻子好合而後推之於兄弟兄弟和樂而後及於家邦蓋其序如此也王氏以刑于寡妻為形而上者則有道存焉以御于家邦為形而下者則有度數存焉是故謂之御也此王氏好合上下為兩端之說也心正而後身修身修而後家齊家齊而後國治本無二道推舉斯心而加諸彼而已茍以度數而治其國以道而治其家則是本末異意初無此理雍雍在宫肅肅在廟言文王在宫則雍雍然而和在廟則肅肅然而敬以見動容周旋無不中禮孔子之於鄉黨則恂恂在朝廷則便便蓋其動容中禮如此觀鄉黨一篇則知孔子之徳觀思齊一詩則亦可以見文王之徳矣鄭氏以不顯謂有賢才之質而不明者以無射為無射才者以射為射作射字讀歐陽已辨之矣然無射亦保頗難說愚竊妄意以為人之所不見者是在隱處也而文王則齊莊恭敬若有所臨人之所不厭射者是在顯處也而文王則安之從容自得詩人之意以謂文王之徳外内顯隱如一也夫有人則作無人則輟不顯者無人之時也以此而輟則作亦偽矣非安也文王則安之非偽也彼常人於不顯之時不肯齊莊至於無射之時雖齊莊而不安惟文王則如一也肆戎疾不殄歐氏曰戎衆也烈光也假大也言文王之應於事雖衆多敏疾而不絶其施於事者光大而無瑕也不聞亦式言事有未之前聞者文王行之亦合於法式毛氏曰言性與天合是也不諫亦入言不待諫諍而亦入於善也蓋其徳牲可謂不勉而中不思而得矣豈待於有所聞有所諫而後中道哉惟文王之徳能如此故天下之士皆化之而好善成人則有徳小子則有造孟子曰待文王而後興者凡民也若夫豪傑之士雖無文王猶興非豪傑之士必待文王而後興焉此成人小子所以待文王而能有造有徳也古之人謂古之聖人也指文王而言也言古人但無斁於為善故聲名有俊才者自然見於多士矣正心以正朝廷正朝廷以正百官其序如此不待致力而後能也此篇與中庸大學之書相為表裏中庸之書發明無聲無臭之義大學之書發明誠意愼獨之理而終歸於治國平天下此詩言文王所以聖而與中庸大學相合學者能深思而熟究之則可以入徳矣不可輕也皇矣美周也天監代殷莫若周周世世修徳莫君文王皇矣上帝臨下有赫監觀四方求民之莫維此二國其正不獲維彼四國爰究爰度上帝耆之憎其式廓乃眷西顧此維與宅作之屏之其菑其翳修之平之其灌其栵啟之辟之其檉其椐攘之剔之其檿其柘帝遷明徳串夷載路天立厥配受命旣固帝省其山柞棫斯拔松栢斯兊帝作邦作對自大伯王季維此王季因心則友則友其兄則篤其慶載錫之光受禄無喪奄有四方維此王季帝度其心貊其徳音其徳克明克明克類克長克君王此大邦克順克比比于文王其徳靡悔旣受帝祉施于孫子帝謂文王無然畔援無然歆羨誕先登于岸密人不恭敢距大邦侵阮徂共王赫斯怒爰整其旅以按徂旅以篤于周祜以對于天下依其在京侵自阮疆陟我髙岡無矢我陵我陵我阿無飲我泉我泉我池度其鮮原居岐之陽在渭之將萬邦之方下民之王帝謂文王予懷明徳不大聲以色不長夏以革不識不知順帝之則帝謂文王詢爾仇方同爾兄弟以爾鉤援與爾臨衝以伐崇墉臨衝閑閑崇墉言言執訊連連攸馘安安是類是禡是致是附四方以無侮臨衝茀茀崇墉仡仡是伐是肆是絶是忽四方以無拂李曰皇矣美周也云云此詩言天監視四方代商而有天下者惟周可以當之而其周之君莫不修徳惟文王為盛焉序詩者據詩中第一章言周受上天之眷故曰天監代商莫若周而其末數章盛稱文王之事故曰周世世修徳莫若文王皇矣上帝皇大也如書所謂惟皇上帝亦言上帝之大也上帝之大者赫然有明有道則享之有徳則親之有罪則黜之福善禍淫無有毫髮之差是以監觀四方求民之所以定者果何自而定之哉不過作之君師而已二國毛氏以為夏商鄭氏以為紂及崇侯蘇氏程氏則從毛氏之說王氏則從鄭氏之說而歐氏以為崇宻歐陽公之所以不指夏商者以詩中無夏商之事故也以為不指紂者亦以詩中無紂事故也故但據詩中伐崇伐密之事以此為二國然觀作序之意必以此二國為夏商序曰天監代殷莫若周故詩中以為夏之國旣失政其政不獲矣商之國又如孫毓之說以為天觀衆國之政可以代殷之人先察王者之後故言商而及夏夫夏者夏禹之世時為二王之後此說雖以夏商為二國而其所以為說則非也夫天旣以此二國為失政矣則於四方之國尋究之謀度之使王天下然天未肯棄紂也紂之惡益大天於是憎惡之乃眷然西顧以周有徳而與之居焉此維與宅者言天與之居天常在其所也耆毛氏以為惡程氏以為致詩曰耆定爾功是也不如鄭氏以為老也書曰天惟五年須暇之子孫便是此謂上帝耆之也夫紂之過惡可謂至矣而天猶待之者以此見天之仁愛人君者厚矣自非大無道者天皆欲扶持而全安之惟紂無悛心此天之禍所以不可遏也鄭氏以四國為密阮徂共歐陽闢之甚詳則引四國順之四國是皇正是四國皆是指四方非指其國也作之屏之云云說者以此章為大王意或然也蓋第三章言王季第四章言王季遂及文王其序如此大王遷於岐山下民歸之如歸市則必刋除其樹木以居民焉故其攻作之屏除之則菑木翳木之所也木立死曰菑自斃曰翳其修治之平理之則灌木栵木之所也叢生曰灌栵栭也江淮之間謂栵為栭其啓拓之開闢之則檉木椐木之所也檉河畔柳也椐樻也其攘去之剔除之則檿木柘木之所也檿山桑也王氏曰其始作之屏之也則菑翳而已旣而又就之者衆無所容之則其修之平之也及於灌栵其啟之辟之也及於檉椐則皆材之小者爾至其甚衆則無以處之也則其攘之剔之者及其檿柘矣檿柘材之美人所恃以蠶者也今乃攘剔以及於檿柘者蓋以民歸之多無所容之不得已而及於檿柘之木也此說甚善而程氏則以為去惡養善生息其人民皆以養治人才為興此說甚鑿矣今所不取惟民之歸國如此天人從之故亦遷就其徳而命之至於後世則習以為常此其所以大也路大也串習也夷常也惟其如此此所以能配天受命堅固而不可易也惟其所以配天也亦是天立之也帝省其山言帝之省視其山也其柞棫則拔然而起其松栢則兊然而易直以土地之肥美如此故可以作為邦國可以為配天之業其所以配天者則以大伯王季而已大伯三以天下讓民無得而稱焉其可謂至徳也已矣讓國者雖大伯之賢然亦王季有以致之王季能盡為人弟之道以恭事其兄故大伯讓之以國故能篤周之慶而錫之以光正所謂其徳厚其流光是也故其子孫世世受天之禄以奄有天下蓋其所由來者逺矣其曰因心則友者夫孝弟之道豈可以偽為哉因其心而然爾孟子曰人之所不學而能者謂之良能不慮而知者謂之良知孩提之童無不知愛其親長而無不知敬其兄本於良知良能豈非因心而然哉帝度其心者言上帝開度其心猶所謂天誘其𠂻也上帝開度其心故其徳教至於清淨貊者清淨也程氏曰貊字之義疑是大也程說則其音訓未知所出不敢以為據也惟王季之徳如此故其徳明又能類類善也以見其表裏如一也克長者言能盡其克長之道也克君者言能盡其克君之道也其王此大邦則又能克順克比克順者言從民之所欲也克比者言後世亦克繼其徳也比於文王其徳純一無有可恨此所以受天之祉傳之永永及子孫也左傳曰心能制義曰度徳正應和曰貊照臨四方曰明勤施無私曰類敎誨不倦曰長賞慶刑威曰君慈和徧服曰順擇善而從曰比經緯天地曰文此皆斷章取義而鄭氏引以為說非也帝謂文王王季之為國則帝度其心文王之為國則帝謂之也帝之所以謂之者豈諄諄然命之哉孟子曰知其性則知天矣天之所以命之者不在於言語之閒黙然而意已傳矣畔援鄭氏曰畔援猶跋扈者帝謂文王汝無信諸侯之畔援無信諸侯之貪羡其所當先者當濟人於難也茍為信其畔援信其歆羨是助紂為惡豈能濟難於人哉今也密人不恭敢拒大邦之國旣已侵阮又徂共矣此豈可以置而不問哉故王赫然發憤整師旅以遏其侵阮徂共之旅此所以篤周之福以答天下也夫文王之怒非私怒也蓋以密人之罪乃上天所其怒也故文王因天之怒此所以答于天下蓋言其合人心也孟子曰文王一怒而安天下之民惟文王一怒而安天下之民則文王之怒異於常人之怒矣依其在京京大阜也岡山春阿大陵也孔氏蘇氏皆以此三句為密人不恭來侵周境非止侵我周之阮疆又升我遠疆之髙岡凡處軍相敵以依山為利旣侵阮疆又陟髙岡則密人之勢可謂強矣故文王行師責之以罪曰爾乃密人也安得陳兵於我周家之陵乎此乃我周之陵也此乃我周之阿也汝安得飲食於我周家之泉乎此我周之泉也此我周之池也言皆非密人之所宜有故以此問其罪於是拒之密人旣服矣遂獲其鮮原求其善地得於岐山之陽渭水之側遂遷都而為萬邦之所向下民以之為君也以文王諸侯耳而曰下民之王者此亦追稱之也予懷明徳上帝告文王曰我之所懷汝者汝之德明也以大王之時則帝遷明徳以文王則子懷明徳則是文王之徳上與大王合也在常人則外飾容貌以取名而文王未嘗大聲音於顔色之間也在常人則好作聰明以亂舊章而文王未嘗長諸夏以變革之道也蓋文王之為無所知無所識惟順帝之則而已不識不知者無私心也有私心則與天異矣夫人之所以飾名譽以欺世者皆私心也變亂舊章以逞才能者亦私心也惟文王胷中湛然行其所無事所以與天同徳也惟與天同徳故天之所怒文王亦怒之非作怒也奉天之怒也以崇國之罪而命文王伐之得不奉天討乎故下文繼之以伐崇之事上天又告文王詢問爾所為仇讎之方同入兄弟之國以爾攻城之具以伐崇國之墉也鉤梯也可以鉤引而上城者車有衝車有臨車臨者在上臨下也衝者從旁衝突也鄭氏以不識不知為不識古不知今歐陽以為使人不識不知皆不如王氏以為無所識無所知其說為善仇方毛氏以為匹也不如鄭氏以為怨耦曰仇前章言伐密而上文冠之以為帝謂文王數句此章言伐崇而上文亦冠之以為帝謂文王詢爾仇方蓋文王之伐非出於私意也惟奉天之怒而已孔子曰三分天下有其二以服事殷周之徳可謂至徳也已矣文王之心不忍伐紂則其於崇國密國豈忍伐之哉蓋罪惡貫盈為天所怒此文王所以征之也桀有罪而湯伐之紂有罪而武王伐之此皆奉天之意也自古未有不奉天之意而能有為者也臨衝閑閑閑閑乃閒暇也言文王始伐崇國閒暇而不用力見文王不忍伐崇之意也而崇乃恃其強大言言言其強盛也不肯服周如此文王遂進而伐之執其訊問者連連而不絶執其俘馘者安安而不遽於是為類禡之祭也古者出征類於上帝禡於所征之地旣克崇矣於是致其社稷羣神而來又附其先祖而為之立後言無絶崇國之祀崇旣服矣故四方無有侮慢之者茀茀強盛貌言文王伐崇用其力以攻之也而崇之城仡仡然而壯猶負固以不服文王於是伐之肆之肆與左傳所謂若使輕者肆焉其可之肆同忽亦是絶滅之意崇侯滅故四方無敢有拂戾之者文王之所伐者但崇國耳而四方之國無有侮慢拂戾之者以文王之罰當其罪故也舜流共工於幽州放驩兜於崇山竄三苖於三危殛鯀於羽山四罪而天下咸服舜之所刑者止四罪耳而天下咸服之則刑罰何必多為哉文王之所伐者止崇國耳而四方無侮慢拂戾之者則征伐何必多為哉後世人君窮兵黷武連年動衆卒以無成功者是亦不知文王之用師乎書曰大邦畏其力小邦懷其徳觀文王之伐可謂大邦畏其力矣左氏傳曰文王聞崇徳亂而伐之軍三旬而不降退修教而復伐之因壘而降則似不戰而崇自服矣今此乃陳其戰伐之事者孔氏曰子魚欲勸宋公修徳故隱其戰事而言降耳意或然也黃講同靈臺民始附也文王受命而民樂其有靈徳以及鳥獸昆蟲焉經始靈臺經之營之庶民攻之不日成之經始勿亟庶民子來王在靈囿麀鹿攸伏麀鹿濯濯白鳥翯翯王在靈沼於牣魚躍虡業維樅賁鼔維鏞於論鼔鍾於樂辟廱於論鼔鍾於樂辟廱鼉鼔逢逢矇瞍奏公李曰靈臺民始附也云云始附者孔氏曰謂心附也往前則貌附之爾此說非也豈有文王之徳而貌附之哉蓋周為靈臺之時而民心樂從如此始知民之附文王也非是始曰貌附而今曰心附也惟文王受命而民樂其有靈徳故謂其臺曰靈臺謂其沼曰靈沼謂其囿曰靈囿此皆是因文王之徳以為靈臺靈沼靈囿之名非文王自名之也如春秋之時僖公十五年秦伯獲晉侯乃舎諸靈臺則晉亦有靈臺也哀公二十五年衛侯為靈臺於籍圃則衛亦有靈臺也不知二國之臺果出於民之安樂而名之歟是果自名之乎後世之論必曰天子有靈臺諸侯有觀臺然文王諸侯爾安得擅築天子之臺乎其曰天子有靈臺者固是因文王有此臺後世因而設之也非文王敢築天子臺也使果是文王自名為靈臺則是文僭稱天子也經始靈臺經始者經營其始也經之營之者經其南北而四營之也庻民攻之言庶民之為臺攻治之不日而成也然文王經營之心本不欲亟也苐以庶民慕文王之徳名為靈臺如子之事父而來築之也鄒侍郎曰庶民子來非強之也在彼者實子來也不日成之非廹之也在我者實勿亟也為上者惟恐民之勞苦為下民者乃不憚其勞苦以從上見民之樂從也觀左傳曰築郎囿季文子欲其速成叔孫昭子曰焉用速成其以勦民也蓋速成者出於民之意則可出於君之意則不可出於君之意則為勦民出於民之意則為愛君然築靈臺者民之所甚憚也以民所甚憚之事則不日而成此豈可勉强而為之哉以此見其得民也宋平公築臺妨於農收子罕親執扑以行築者而抶其不勉者曰吾儕小人皆有闔廬以避燥濕寒暑今君為一臺而不速成何以為役宋築臺必待執扑以抶其不勉者文王之民豈待執扑以抶其不勉者哉王在靈囿言王在靈囿之所麀鹿則攸伏言其馴擾而不驚也言其麀鹿又且濯濯然而充肥其白鳥則翯翯然而潤澤王在靈沼之所其魚充牣於中皆跳躍伏隱言文王之徳雖鳥獸魚鼈無不得其所也鄒侍郎曰麀鹿之在囿不知囿之為囿亦如在於山林魚鼈之在沼不知沼之為沼亦如相忘於江湖自非文王之徳上及飛鳥中及走獸下及潛魚豈能及此雖然詩人之意亦以形容民樂文王之徳也後世人君莫不大為苑囿使禽獸得其樂而民不以為樂也蓋禽獸得其所而民又得其所然後為徳之盛不然則是恩足以及禽獸而功不至於百姓矣果何益哉虡業維樅植者曰虡橫者曰栒設大板於栒之上曰業樅崇牙也言懸於鍾鼔之處則采色為大牙其狀隆然謂之崇牙冇瞽之詩曰設業設虡崇牙樹羽此所謂虡業維樅與有瞽之詩同也賁大鼔也鏞大鍾也上章旣言文王與民同樂矣故此章遂言文王因民之樂而寫之於樂樂不徒作蓋所以形容四海之歡心也不然則斯民愁怨徒然為此鍾鼔之樂果何益哉惟文王與民同樂故於此論理鼔鍾之音而作辟廱之樂也辟廱文王之樂名莊子曰黃帝有咸池堯有大章舜有大韶禹有大夏湯有大濩文王有辟廱武王周公作大武以是知辟廱文王之樂名也鼉即鼉皮為鼔其聲逢逢然而和作樂之時矇瞍則奏其公有眸而無見曰矇無眸子曰瞍其作樂如此則文王之治可知矣王氏以鼉鳴逢逢如鼔故謂之鼉鼓非也觀上林賦曰建翠羽之旗擊鳴鼉之鼔則以鼉皮為鼔可知也黃曰此一詩惟孟子之說為盡而先儒之言皆不足信孟子曰文王以民力為臺為沼而民歡樂之謂其臺曰靈臺謂其沼曰靈沼皆斯民樂文王有靈徳而自以靈臺靈沼靈囿名之非文王自為之名也而先儒之說則曰天子有靈臺諸侯有觀臺夫後世之所謂靈臺者蓋因文王之有靈臺而慕其名也而不知文王之所謂靈臺者特斯民以其德而名其臺耳豈文王自為之乎此先儒之說所以不足信也麀鹿攸伏麀鹿濯濯白鳥翯翯與夫所謂於牣魚躍者蓋斯民樂其靈沼靈囿而亦樂其有麀鹿魚鼈此所謂愛人而亦愛其物也故序言民樂其靈徳以及鳥獸昆蟲者非謂文王靈徳所及也民樂文王之靈徳而亦樂其鳥獸昆蟲之類也先儒之言則曰言文王之愛物如此夫以為文王之愛不若以為斯民之愛之也使文王專於愛物則殺其麀鹿如殺人之罪恩足以及禽獸而功不至於百姓豈聖人之心歟此先儒之說所以又不足信也莊子曰文王有辟廱之樂則辟廱者文王之樂名而說者以為文王之學名夫天子之學曰辟廱與文王有聲所謂鎬京辟廱者蓋作辟廱之樂於天子之學宫而遂以名之耳此詩所謂於樂辟廱者自於論鼔鍾而言之蓋文王作樂於靈臺之中而民歡樂之也想其聞鍾鼔管籥之音欣欣然有喜色而相告樂之不能已而言之不能盡故曰於論於樂於者歎辭也文王之始經營此臺也非出於文王之心而出於斯民之意庶民攻之不日成之非文王役民之力而速其成也經始勿亟而惟恐斯民之勞苦庶民子來而斯民自忘其勞苦及其臺之旣成也則又樂其鳥獸昆蟲樂其鼔鍾辟廱民之於文王如子之慕慈母君子以是知民心之始附也春秋昭公九年昭公築郎囿季文子欲其速成叔孫昭子曰經始勿亟庶民子來焉用速成其以勦民也無囿猶可無民其可乎魯君之囿其所以欲速者出於君之心文王之臺其所以欲速者出於民之心出於君之心則為勦民出於民之心則為愛君宋平公築臺子罕親執扑以抶其不勉者曰吾儕小人皆有闔廬以避寒暑今君為一臺而不速成何以為役夫宋人之築臺至於執鞭扑以隨其後而驅之則民之心可知也即此而論則文王之得民心者為何如哉噫觀遷岐之役而始知民心之歸大王觀靈臺之歌而始知民心之附文王也下武繼文也武王有聖徳復受天命能昭先人之功焉下武維周世有哲王三后在天王配于京王配于京世徳作求永言配命成王之孚成王之孚下土之式永言孝思孝思維則媚兹一人應侯順徳永言孝思昭哉嗣服昭兹來許繩其祖武於萬斯年受天之祜受天之祜四方來賀於萬斯年不遐有佐李曰下武繼文也文王旣受命作周矣武王有聖徳故復受天命以顯先世之功焉孔氏謂白魚入舟為武王之受命此說非也大抵後世溺於䜟緯之言以帝王之興必有受命之符言文王受命曰得赤雀丹書言武王受命必曰白魚入舟而司馬子長猶且著於史記其言殊怪誕不經曰武王渡河中流白魚躍入王舟中武王俯取以祭旣渡有火自復至於王屋流為烏其貌赤其音魄云惟唐柳子厚著徳貞符其言甚善孔子序書於堯則曰克明峻徳於舜則曰濬哲文明於禹則曰文命柢承于帝於湯則曰克寛克仁彰信兆民於武王則曰有道曽孫皆是以徳為受命之符後之妖淫嚚昬好怪之徒乃始陳大電大虹元鳥巨跡白狼白魚流火之烏以為符斯皆詭譎怪誕甚可羞也由此觀之則知武王之有聖徳便是受命之符不必神怪之辭以為神也下武維周毛氏曰武繼也鄭氏曰後人能繼先祖者惟周家最大世世益有明智之王蘇氏曰武迹也蓋言先王旣没而其跡在下不絶在後之人能繼其先祖者惟周然耳蓋其世世有哲王上有大王王季文王今則有武王居於鎬京而其徳可以配其在天者也其曰三后在天者書曰惟殷先哲王在天亦是此意天子之死則曰升遐已亡則曰在天王配于京言武王居于鎬京其徳可以配在天者也皇矣序曰周世世修徳自古以來其修徳者不為無人但世世修徳則難其人堯之徳非不盛也而有丹朱舜之徳非不盛也而有商均禹湯之徳非不盛也而其後有桀紂周自大王以來無不修徳故曰下武維周世有哲王也中庸曰無憂者其惟文王乎夫舜以瞽瞍為父以商均為子則舜之父子皆不肖矣至於禹則其子有啓之賢而其父則鯀未有父子之賢者今周家之興旣有太王又有王季文王自古所無也中庸又曰武王纉大王王季文王之緒則知武王之配三后者在此王配于京世徳作求言武王之所以配三后者則亦惟世徳是求故也作者起也言起而求先祖之徳以繼述之也夫三后之時其信已著於天下矣維武王能配其命是以能成其孚也大王肈基王迹王季其勤王家文王則大勲未集武王之有天下然後能成其孚也成王之孚下土是式言王孚旣成則下土以為式也下土之所以為式者以武王之孝而民則之故也中庸曰武王周公其達孝矣乎夫孝者善繼人之志善述人之事武王之孝至矣孝悌之至通於神明光於四海民安得而不則之乎此四句大槩相因武王成王之孚乃是孝思也惟孝思則是成王之孚也媚兹一人媚愛也言天下之人愛此武王而應之以順徳也順徳者孝也孝敬盡於事親而徳教加於百姓刑於四海武王旣盡孝道於上故天下之人亦應之以順徳也論至於此則武王所以繼嗣其先祖之行事者豈不彰明較著者哉蓋天子之孝刑于四海然後為至也昭兹來許許所也言武王所以昭然嗣服者其所由來在於繩約其祖考之蹤跡此其所以萬斯年而受上天之福也於萬斯年乃祝頌之辭也受天之祜四方來賀蓋祖考之心即天之心也天之心即民之心也今武王得斯民之心故能受天之福是合乎祖考之心也得天之福而四方之民舉皆來賀是合乎民之心也四方來賀者武王旣勝商西旅獻獒巢伯來朝而國語亦載武王克商通道於九夷八蠻則當是時也四方之人無有不來賀者非特一時然也將至於萬斯年之久豈有逺方不來佐助者乎佐者助也得道者多助失道者寡助四方之人皆來助之也先儒於此篇以下武維周世有哲王等語為詩人之言以永言配命成王之孚等句為武王之言不必如此分别也黃曰大明之序曰文王有明徳故天復命武王而下武之詩則又曰武王有聖徳復受天命能昭先人之功焉夫武王受命一事也旣歸之文王之明徳又歸之武王之聖徳蓋惟文王之有是徳也則在天固有不容釋之心而武王復有是徳也則亦自足以當上天眷顧之意曰明徳曰聖徳初非冇優劣之辨神而明之謂之明大而化之謂之聖要之文武之徳初未嘗有異而隨所寓而有所見者不可以一言盡也仁者見之謂之仁知者見之謂之知百姓日用而不知此聖人之所以為聖人歟以聖人之志繼聖人之志以聖人之事述聖人之事大勲之未集者至此而集王業之未成者至此而成此能昭先人之功詩人所以為繼文之美也詳觀下武其大要言武王得天下之實而歴序大王王季文王積累之久惟周家之君世世修徳而武王又以聖徳繼之此天命人心之所以歸也三后在天則大王王季文王之於天也無媿王配于京則武王之於三后也無媿武王之所以無媿者以周之先祖素有以信於民而武王又能成王之孚孚信之在民心也萬邦作孚之意也繼志述事所以為聖人之孝則武王之所以為孝者孰能加於此乎故曰永言孝思孝思維則孝之至則通於神明光於四海而得萬國之歡心此所以受天之祜而四方來賀也鷹揚之師方舉而八百之國已㑹倒戈之兵未還而簞食之迎已至東西南北無思不服㣲盧彭濮不期而萃此所謂多助之至天下順之也故曰不遐有佐佐命之臣皆不逺數千里而來也中庸言武王纘大王王季文王之緒身不失天下之顯名而此詩言武王得天下之實則亦先言大王王季之徳故中庸言武王之達孝而此詩言武王之孝思中庸言孝者善繼人之志善述人之事而此詩言能昭先人之功其㫖一也文王有聲繼伐也武王能廣文王之聲卒其伐功也文王有聲遹駿有聲遹求厥寜遹觀厥成文王烝哉文王受命有此武功旣伐于崇作邑于豐文王烝哉築城伊淢作豐伊匹匪棘其欲遹追來孝王后烝哉王公伊濯維豐之垣四方攸同王后維翰王后烝哉豐水東注維禹之績四方攸同皇王維辟皇王烝哉鎬京辟廱自西自東自南自北無思不服皇王烝哉考卜維王宅是鎬京維龜正之武王成之武王烝哉豐水有芑武王豈不仕詒厥孫謀以燕翼子武王烝哉李曰文王有聲繼伐也鄭氏曰繼伐者文王伐崇而武王伐紂此亦泥也文王之時雖未伐紂而武王之所以伐紂者乃能成文王之志亦是繼伐也不必但指伐崇為言此篇上四章說文王而王氏乃以為第一章兼說文武之事此亦非也彼但見序言武王能廣文王之聲遂以此便為武王之事殊不知文王之有聲者亦是繼述廣大其先祖之聲也非指武王也觀下文言文王烝哉則知其為文王明矣詩中言文王有聲則以其能繼述先人也序言武王之有聲則亦以其能繼述先人也文王有聲觀先儒作去音讀今當作如字讀言文王之有聲者豈有他哉惟繼𫐠廣大大王王季之聲也然其所以繼述廣大其大王王季之聲者則維繼述其大王王季寜民之道觀其成功之道爾此文王之所以為君也文王受命言文王之受天命卒能著其成功旣伐崇矣遂遷都於豐也說文曰文王之都在京兆杜陵西南築城伊淢淢成溝也說文曰十里曰成成間有淢廣八尺深八尺言文王築豐之城其下則有淢陳少南曰匹稱也言文王作豐之制不為侈大惟其稱而已以見其不侈不陋也然文王之築城也非欲以其急成惟在於繼述先人之行而為孝也觀其作豐也惟繼述先人之孝則知文王之舉措無非繼志述事者但觀其遷都之事從可知矣王公伊濯云云鄭氏曰公事也毛氏曰濯大也言文王之事所以大者自築作豐邑始文王之作邑于豐四方皆來同心而歸之則以文王為之翰故也言豐邑之内皆以文王為翰翰者築牆所立之木此文王之所以為君也豐水東注此又指豐水以言武王之功堯之時洪水滔天使禹治之故豐水之所以入渭東注于河者禹之功也至於四方之所以同歸於周者以武王為之君也惟武王能如此故言烝哉以見其足以為君也故曰武王烝哉鎬京辟廱鎬京武王之所都也言武王之作邑於鎬京行辟廱之禮四方無有不服焉孟子曰以善服人者未有能服人者也以善養人然後能服天下天下不心服而王者未之有也武王建鎬京而行辟廱之禮徳之所感化之所移至於四方萬里之逺如此此言武王之所以為君也考卜惟王此又言其初居鎬京之時稽考其卜本於武王乃宅是鎬京以龜正之而得吉卜故武王之所以遂居於此此武王之所以為君也夫以文王遷都於豐武王復遷都於鎬以武王之遷都宜若更變前王之制然其繼述之事未嘗少忘蓋繼祖考之事者不在於區區之迹但係其心之如何耳豐水有芑芑草也言豐水之旁有芑草以譬人君之作人材也言文王之都豐作成人材如豐水之芑而武王繼之亦以作成人材為念是以貽其孫順之謀而安子孫之敬者文王以作成人材而遺武王武王又以作成人材而訓子孫則知世世子孫皆以作成人材為本也此詩先言文王則先曰文王後曰王后言武王則先曰皇王後曰武王說者不一王氏則以字說分别孔氏則曰其稱后者則為徳之盛不稱者則不為徳之盛蘇氏則以為文王老而稱王武王即位而稱王其說皆失之鑿矣以王后稱文王言文王之時已有王業也武王稱皇王者皇大也言王業至此始大矣或稱文王又稱王后或稱皇王又稱武王其辭不同者詩人歌詠之旣稱其人如此又稱其事業如此以見其美之不足故其設辭如此之異也如必以此章而言文王此章而言王后此章而言皇王此章而言武王則一一為之說不失之鑿者未之有也黃曰文王一怒而安天下之民武王亦一怒而安天下之民故曰繼伐也下武之詩言繼文文王有聲之詩言繼伐惟其能繼文王之文徳而後卒文王之伐功故曰能廣文王之聲卒其伐功也文王述大王王季之業已有其聲矣武王從而大之此文王有聲之所由作歟此詩八章前四章則言文王之所以為君也後四章則言武王之所以為君也文王未嘗為王而曰文王曰王后者天下稱之之辭以見其為君之道而宜為吾君也至武王則王業大矣故曰皇王而以武王終之方文王之作也天下欲文王之君哉而不可得也文王有心於安民而無心於成王業故雖有君民之大徳而不忘事君之小心天下之人皆欲其為君而樂稱之故曰文王烝哉又曰王后烝哉樂之辭也統雖未集臣已父歸故雖匪棘民已子來周徳之冝王久矣文王之冝王而不王也然文王能逃諸其身而不能逃諸其子能止汝墳之怨而不能遏孟津之畢集至武王一興而東征之士女皆篚厥𤣥黃昭我周王曰是西伯之子也是吾民之君也吾君之穪尤籍籍於斯人之口則曰皇王烝哉武王烝哉亦樂之之辭也孟子曰得天下有道得其民得其民有道得其心天下可得而匹夫匹婦之心不可得聖人之君天下必使天下皆樂於我而後聖人之心可以無愧以一人君天下而一夫有不樂之心則人君之心豈自安是故欲觀聖人所以盡為君之道者當於斯民之心求之人之無良我以為君其辭之不樂也則其心固可知矣顔如渥丹其君也哉其辭之樂也則其所以樂之者可想而見也以文王為父而以武王為子父子兩聖而天下一心武王以文王所以為君者而君天下天下亦以愛文王者而愛武王此詩八章皆不出於烝哉之辭文武之所以得民者可於此而卜之矣毛詩集解卷三十一
