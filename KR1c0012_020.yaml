body:
  text: 毛詩集解卷二十宋李樗黃櫄撰天保下報上也君能下户嫁反下如字以成其政臣能歸美以報其上焉天保定爾亦孔之固俾爾單音丹厚何福不除俾爾多益以莫不庶天保定爾俾爾戩子淺反榖罄無不宜受天百祿降爾遐福維日不足天保定爾以莫不興如山如阜如岡如陵如川之方至以莫不增吉蠲吉𤣥反為饎尺志反是用孝享禴祠似辭反蒸之丞反嘗于公先王君曰卜爾萬壽無疆神之弔都厯反矣詒以之反爾多福民之質矣日用飲食羣黎百姓遍為爾德如月之恆如日之升如南山之壽不騫起䖍反不崩如松柏之茂無不爾或承李曰自鹿鳴至伐木言君所以下下也君能下下則政無不成矣君能下下以成其政則臣能歸美以報其上報施之理然也孟子曰君之視臣如手足則臣視君如腹心君之視臣如犬馬則臣視君如國人君之視臣如土芥則臣視君如寇讎蓋君之待臣也厚則臣之報君也亦厚君之待臣也薄則臣之報君也亦薄茍君不能下下則臣安能歸美以報其上哉孔氏曰詩者志也各自吟詠六篇之作是非一人而已以此為答上篇之歌者但聖人示法義取相成次鹿鳴至伐木於前此篇繼之於後以著義非此固答上篇也此說是也天保定爾亦孔之固者保安也蓋言天之保定我君其位甚固也單毛氏曰信也或曰厚也鄭氏曰盡也蘇氏亦從鄭訓王氏曰單厚也厚下之至也鄭氏以為厚天下之民王氏以為厚下據此章方言人君之受福未及論民之福也厚但言其受福之厚也除毛氏曰開也程氏曰更新也王氏曰除舊置新也此言天之保定我君其位甚固俾之單厚凡有所福無不與之又與之以福祿俾爾多益以莫不庶以見其受福之多也鄭氏以為每物益多非也歐陽氏曰俾爾多益而衆也戩榖福祿也罄無不宜罄盡也言天保定我君與之福祿無所不宜也既無所不宜又受天百祿而又降爾遐逺之福汲汲然受之而不足也猶曰惟日不足是也歐陽公曰既曰何福不除矣又曰俾爾戩榖矣又曰無所不宜受天百祿又曰降爾遐福其所以殷勤重復如此而猶曰惟日不足者大抵詩之六章文理重復以見人臣愛上之德深且至也夫以福祿日至而猶欲其無有止足非愛君能若是乎王氏以為何福不除為人君之福以莫不庶為人君之祿罄無不宜為人臣之福受天百祿為人臣之祿則是以一章為君二章為臣非也王氏之說本於鄭氏鄭氏曰天使女祈福祿之人謂羣臣也夫君受福祿之多而後及於人臣也然此詩是臣歸美於君當說人君不當以為人臣也天保定爾以莫不興天之保定人君使國家無不興盛髙平曰陸大陸曰阜大阜曰陵山脊曰岡如山之髙如阜之大如岡之彌髙如陵之彌大又如川之浸長而莫不增多也吉善也蠲潔也饎酒食也享獻也春曰祠夏曰禴秋曰嘗冬曰蒸公毛氏曰事也鄭氏曰先公謂后稷至諸盩當從鄭氏之說孔氏曰經於公上不言先者以先王在公後王尚言先則公為先可知欲省文以完句也如擊鼓之詩序言使公孫文仲將而詩特言從孫子仲蓋省文也此不言先而言于公者亦省文也君曰卜爾為王卜也鄭氏曰尸嘏主人𫝊神辭也不如程氏以為君使卜之設辭也此章君既享福祿之盛用報其先祖善潔其酒食之饌以致孝享于公先王其所獻者有四時之祭往祭于先公先王既祭而君使卜之卜得有萬夀無疆之兆乃設為之辭也非實使之卜也王氏曰先禴後祠禴厚而祠薄先蒸而後嘗蒸厚而嘗薄此非也趙伯循云按周禮記四時之祭名云春祠夏禴秋嘗冬蒸公羊所記亦同而此詩乃曰禴祠蒸嘗其文與周禮異協韻故爾其實祠禴嘗蒸不以厚薄為先後之序也孔氏曰詩以便文故不依先後弔至也詒遺也言多福至矣而百姓亦受其福也質毛氏以為成程氏以為實皆不如王氏之說王氏曰神無所出其靈響也詒爾多福而已民無所施其智巧日用飲食而已以見民之和平無有詐欺矣百姓毛氏以為百官族姓然百姓自古有二有所謂百官族姓者有所謂庶民者書言平章百姓者百官族姓也論語曰修己以安百姓者庶民也此言羣黎百姓則當以為民不當以為百官族姓也言天下之民受其賜無有巧僞惟日用其飲食而又效上所為遍為爾德無不順也恆鄭氏以為月之上弦而就盛其字從逆不從行今則從行不從逆當從王氏作恆久說言如月之恆久如日之升如南山不虧而不壞如松柏之茂盛皆悠久之狀也以言人君之福興而未艾也無不爾或承者鄭氏曰青青相承無衰落也歐陽曰上六章之所陳者使我君皆承之也皆不如王程之說王氏曰松柏之茂盛無不承其庇覆蓋人君受福普天之下無不受其賜也論曰詩曰自求多福孟子曰禍福無不自己求之者蓋人君之受福不在於禱祝之間使人君無德則雖禱祝而其福亦不加益人君有德雖不禱祝而其福亦不加損惟其臣報上之心切所以必願其君受福之多也然君之所致此蓋由下下以成其政此所以自求多福也觀江漢之詩曰釐爾圭瓚秬鬯一卣告于文人錫山土田于周受命自召祖命虎拜稽首天子萬年虎拜稽首對揚王休作召公考天子萬夀宣王之於召虎寵任可謂専矣召虎思之無以報其德惟曰天子萬夀而已以是知人臣所以報君非此無以見其誠也黃曰自天保以上五詩皆文王燕羣臣勞使臣遣使臣燕兄弟朋友之樂章也天保一詩其臣下答其君歌燕之樂章與故曰下報上也君能下下以成其政臣能歸美以報其上焉竊嘗為之說曰人君惟不自有其尊故能成其尊謙者益之地滿者損之藏使人君自恃其能而不復資臣之能則臣亦將自矜其能而不復遜其君之能矣君能下下以成其政則君不敢忽其臣臣能歸美以報上則臣不敢忘其君此天道下濟而光明地道卑而上行之理也故天保一詩皆羣臣愛其君而願之之辭愛之之心無時而窮則願之之辭亦無時而窮非故以是媚其君也誠以吾之所欲然期天理之必然而亦因以為當然也曰天保定爾亦孔之固如親卜之於天曰君曰卜爾萬夀無疆如親卜之於神曰何福不除罄無不宜欲其備天下之福也曰降爾遐福維日不足欲其享無窮之福也曰以莫不庶以莫不興以莫不增以見其非止一身之福而子孫之福也終之曰無不爾或承以見天地鬼神山川草木昆蟲禽獸臣民百姓無不賴之而非止一人之福也如山如阜如岡如陵如川之方至如月之恆如日之升如南山之夀如松柏之茂廣譬曲喻言有盡而意無窮豈周人之媚其君哉豫嘗三復是詩而見君子愛人之意曰俾爾單厚以信厚之德期於君也曰吉蠲為饎是用孝享則奉先思孝之意也曰民之質矣日用飲食羣黎百姓遍為爾德則斂福錫民之意也是數者皆所以受福之資與詳其喻於形容之中而寓其意於勸戒之際此臣報君之志也學詩者試以是思之采薇遣戍役也文王之時西有昆夷之患北有玁音險狁音允之難以天子之命命將子向反率所類反遣戍役以守衛中國故歌采薇以遣之出車以勞力報反還枤大計反杜以勤歸也采薇采薇薇亦作止曰歸曰歸嵗亦莫音暮止靡室靡家玁狁之故不遑啓居玁狁之故采薇采薇薇亦柔止曰歸曰歸心亦憂止憂心烈烈載飢載渴我戍未定靡使歸聘采薇采薇薇亦剛止曰歸曰歸嵗亦陽止王事靡盬不遑啓處憂心孔疚久又反我行不來彼爾維何維常之華彼路斯何君子之車戎車既駕四牡業業豈敢定居一月三捷駕彼四牡四牡騤騤求歸反君子所依小人所腓四牡翼翼象弭弭氏反魚服豈不日戒玁狁孔棘昔我往矣楊柳依依今我來思雨于付反雪霏霏行道遲遲載渴載飢我心傷悲莫知我哀李曰遣戍役也言文王為西伯之時西有昆夷之患詩所謂薄伐西戎是也北有玁狁之難詩所謂玁狁之故是也既有戎狄之難遂以紂命命其將帥遣屯戍之役以扞衛中國其遣也則歌采薇之詩其歸也則歌出車枤杜之詩出車之詩所以勞將帥枤杜之詩所以勞戍役於出車言勞還於枤杜言勤歸但變其文耳昆夷則言患玁狁則言難亦不必分别也此詩則遣將帥與戍役而序但以遣戍役為言者孔氏云將帥者與君同其憂其戍役則身處卑賤非有憂國之情不免君命而行文王為恤之情深殷勤於戍役簡略於將帥故此篇之作以遣戍役為主此說非也夫將帥所以統戍役豈可輕哉文王豈有簡略將帥之意此詩序言遣戍役則遣將帥可知矣不必為是說也薇菜莖葉皆似小豆蔓生其味亦如小豆藿可生食作生也言始遣戍役之時薇已生矣當采薇之時遣之則何時而歸乎其得歸則嵗已暮矣其所以舍其室家者以玁狁之故其所以不遑安處者亦以玁狁之故言吾之所以遣戍役者非吾之本心但以昆夷之患玁狁之難不可得而辭爾以民之勞苦皆歸罪於玁狁則無有愁嘆之心矣柔始生而柔脆鄭氏於薇亦作止則謂今薇生矣先輩可以行孔氏曰先輩可以行言先對後之辭則二章為中輩三章為後輩矣首章二月下旬遣二章三月上旬遣三章三月中旬遣以中章為三月上旬遣詩中無此文而創為此說不可信也蘇氏則以為遣戍役而戒其期曰薇可采而行而督之曰薇亦作矣可以行矣始言薇作次言薇柔終言薇剛言時日已晚不可復留也蓋以剛柔為士卒未行亦不可從王氏則謂戍役之久且又采薇食之而已王氏以為嵗暮之時孔氏以為三月上旬其異同如此然不必指時以為說薇亦作止是始遣戍役之時薇始生也其後薇始長而柔又其後薇始壯而剛以見天時之變如此亦猶昔我往矣楊柳依依今我來思雨雪載塗亦言天時之變爾憂其歸期之晚而憂心烈烈者憂之狀也其所以憂心烈烈者則載飢載渴也孔氏曰汝所以憂心烈烈者以道路之中則有飢而有渴勞苦甚矣諸家皆從其說是以飢渴為真飢渴程氏則以為如飢渴其說固善然觀下文言行道之遲遲載飢載渴則又似真飢渴矣當從諸家之說我戍未定靡使歸聘言我屯戍於此未得底定無人可以歸問家之安否蘇氏則謂聘于天子此詩所言大抵言室家之情亦如東山詩不得以為聘天子也陽者十月為陽鄭氏以為坤用事嫌於無陽故以名此月為陽王氏以為陽用事此則非也王事靡盬言我之於王事無不堅固故我不遑安處也王氏曰啓則居之也處則方之也不遑居者以言從戍役之事而不遑居也不遑處者以言居戍役之地而不遑處也以居為從征役之事以處為居戍役之地亦妄生分别也憂心孔疚我行不來者憂心甚病我去而未得歸也來與今我來思之來同爾毛氏以為華盛貌言爾然而盛者何物也乃常之華也以喻路車之盛者何人之車也乃君子之車也王氏曰常之華上承下覆甚相親比猶之路車將帥乘之以庇其下師徒恃之以載其上上載下庇甚相親比鄭氏則謂棠棣華鄂相親其下盡力以事上言當如棠棣然也如棠棣之華鄂不韡韡以喻兄弟之相親比則可以上承下覆為說此詩但言路車之盛不必上承下覆為說也業業壯也一云馬行不止貌戎車既駕而四牡又壯吾敢安居必欲一月之間而有三捷所謂一月三捷者非是果有三捷但言士卒之鋭皆有勝敵之心欲其如此也鄭氏乃謂侵也伐也戰也此說泥矣駕彼四牡騤騤然而强健此乃君子所依小人所腓鄭氏以為腓當作芘好改字不可從也蘇氏乃謂腓辟也小人所恃以辟難以腓為辟難不知有何所據程氏則謂腓從動之義人之腓在股下足上身行則從動也蓋程氏解易咸其腓亦以腓從動為義且從其說言此車乃君子所處小人則從而動也翼翼間也象弭者爾雅曰弓無緣者謂之弭孫炎曰不以繫束骨飾兩頭者也以象骨為之故謂之象弭毛氏謂弓反末也所以解紒也魚服矢服也以魚皮為之左𫝊歸夫人魚軒服䖍曰魚獸名則魚皮又可以飾車亦可以為矢服也車馬之備器械之修豈不日相警戒但以玁狁甚急而不可緩也其我昔往戍役之時則楊柳依依然而生今我來歸則雨雪已霏霏而下則是嵗晚而歸矣行道遲遲然而久又有飢渴之苦我心所以傷悲莫有知我哀者豈真莫我知哉此詩言遣戍役而謂莫知我哀是深知之矣論語曰三分天下有其二以服事殷周之德其可謂至德也已矣以文王之德較之於紂其昏明不同文王三分天下有其二紂徒得其一其勢又不同也然文王尚以紂之命遣將帥與戍役則是文王之心其尊王之至如此所謂有事君之小心但於遣將帥見之矣後世如齊威晉文非無功也侵伐圍戰皆不本天子之命其功雖可嘉而其心可謂專矣此文王之所以為不可及也吕吉甫嘗云其遣也則豫述其還歸之事其還歸也又不忘其行役之勞故采薇出車杕杜之詩其遣勞帥役之事雖不同而序其往反始終之情而憫之則一也蓋其始以序其勞苦之事以遣之則是恤之也厚矣吳起之為將也卒有病疽起為吮之卒母聞而哭之人曰子卒也而將軍自吮其疽何哭為母曰非然也往年吳公吮其父其父戰不旋踵而死於敵吳公今又吮其子妾不知其死所矣是以哭之惟吳公所以待之也厚其卒必將以死報之今文王遣戍役其遣之時已知其勞苦則士卒之心當如之何是必思所以報其上也黃不講出車勞力報反還音旋率所類反也我出我車于彼牧矣自天子所謂我來矣召彼僕夫謂之載矣王事多難乃旦反維其棘矣我出我車于彼郊矣設此旐矣建彼旄矣彼旟音餘旐斯胡不旆旆音背憂心悄悄七小反僕夫況瘁音悴王命南仲往城于方出車彭彭旗旐央央天子命我城彼朔方赫赫南仲玁狁于襄昔我往矣黍稷方華今我來思雨雪載塗王事多難不遑啓居豈不懷歸畏此簡書喓喓於遙反草蟲躍躍吐厯反阜螽未見君子憂心忡忡敕中反既見君子我心則降赫赫南仲薄伐西戎春日遲遲卉許貴反木萋萋倉庚喈喈采蘩祁祁執訊獲醜薄言還歸赫赫南仲玁狁于夷李曰采薇序言文王命將帥遣戍役將帥戍役合而為一詩今勞還之詩則出車與枤杜分而為二詩者鄭氏曰遣將帥及戍役同歌同時欲其同心也反而勞之異歌異日殊尊卑也禮記曰賜君子小人不同日此說盡之矣此章蓋言承文王命急於趨事而出不敢緩也荀子曰大子召諸侯諸侯輦輿就馬禮也遂舉此詩云我出我車于彼牧矣自天子所謂我來矣荀子之意則以出車為諸侯赴天子之召然按此詩乃南仲出車非是諸侯之赴召也蓋古人觀詩不拘詩之文故其言及此毛氏曰出車就馬于牧地王氏曰出車于牧就馬故也此蓋本荀子之說然未必得詩人之意蘇氏曰其將北伐也出車于郊牧即郊也諸家皆以出車就馬于牧地蘇氏則以于彼牧者即是郊也此說為簡徑按爾雅曰郊外曰牧此章言牧與下章言郊同義但其字異爾其所以出車于郊自天子之所命我而出征也惟天子命我而出征於是命僕夫載而行之其所以召僕夫遑遽如此則以王家之事多難不可不急也觀其命僕夫如此則當時將帥其心可知矣我出我車于彼郊矣設此旐矣建彼旄矣此蓋言旗章之盛也龜蛇曰旐言設此旐矣又建其旄於干之首毛氏曰旄干旄也鳥隼為旟旆旆毛氏曰旒垂貌王氏曰未有事故不旆也蘇氏曰君子勇於從事惟恐旟旐之不旆旆與僕夫之甚瘁不如其志也此皆非詩人之意也此蓋南仲出征之日下令軍中曰彼旟旐何不旆旆乎以見其車旗之盛也如左𫝊昭十三年晉人治軍建而不旆壬申復旆之諸侯畏之則旆者將戰之象也憂心悄悄言南仲之心則憂而悄悄臨事而懼其僕夫之人亦為之憔悴況瘁甚瘁也以僕夫猶且惟悴則南仲之心可知矣王命南仲毛氏曰殷王也蘇氏曰紂得命文王而不得命南仲故王乃為文王不得為紂此說甚善此乃文王命南仲者以有天子之命城彼朔方此正序所謂以天子之命命將帥是也惟其天子之命如此故稱南仲之賢赫然而顯盛從此征玁狁於是而除之襄除也王氏曰襄之言勝也以襄為勝無所經見牆有茨之詩曰不可襄也則襄是除也昔我往矣黍稷方華觀此詩言此二句又似南仲之出車當黍稷方華之時而往然此詩繼於采薇之後文王出師采薇之詩則以春初而往不應於黍稷方華而出師也故為可疑鄭氏曰六月時也以此時始出壘唐孔氏曰春末而行當以夏初到朔方也既至朔方將設經略五月尚猶停息六月乃始出壘此說雖迃曲今當且用之今我來思來思來歸也思語辭也方其歸也雨雪載塗言其出戍之久也其所以出戍之久者則以多難之故無暇於啓居也非是無懷歸之心所以畏戒命耳古者鄰國有急以簡書相告則奔命而救之左氏曰同惡相恤之謂也正此是也喓喓草蟲此章皆言其室家之辭喓喓草蟲與草蟲之詩其意一同但當從草蟲之說觀下文未見君子憂心忡忡既見君子我心則降皆是言婦人之情鄭氏曰喻近西戎之詩侯聞南仲既征玁狁將伐西戎之命則跳躍而鄉望之如阜螽之聞草蟲鳴焉程氏曰草蟲阜螽其類相應民心之望王師猶是也此皆過論此蓋言婦人之情婦人謂草蟲鳴則阜螽躍已之於君子猶是也故未見君子則其心憂懼既見君子則其心降下也赫赫南仲薄伐西戎言其成功之如是也春日遲遲此又言其春歸時春色之暄和如此則其樂可知也言當春色之舒緩草木之茂盛黃鳥之和鳴其在野之中則采蘩之人祁祁而衆多而汝乃於此時執訊獲醜而歸則其樂為何如哉訊問也囚之可問也醜衆也赫赫南仲玁狁于夷夷平也又美南仲之成功如此夫詩之序可疑者非一如此篇言王命南仲如從毛氏之說以王為殷王則與序不相合其說為可疑若從蘇氏之說以王為文王然亦窒礙而不通夫文王未嘗生時稱王其所以稱王者後世追稱爾不應文王之時作此詩也然采薇之序曰文王之時命將帥遣戍役以守衛中國則是文王之時作此詩豈文王之生時稱王乎此詩序為可疑者也大抵去古既逺無所考據如此詩既言旐又言旟又言旗者唐孔氏曰雜互陳之則軍之諸帥有建之者矣然周禮王載大常諸侯載旗軍吏載旗郊野載旐百官載旟則是旗者諸侯之所建不應南仲非諸侯而建此然此猶可說也文王之時周禮未作旗未必諸侯之所建旐未必郊野之所建皆不可得而知也至於王氏不知王與天子之說乃以為軍旅之事仰得天俯得人然後動此其所以或稱王或稱天子也則其言不通至班固作漢書胸奴傳又引此詩出車傍傍旗旐央央為宣王命將帥征伐北狄蓋詩之作去聖逾逺不可深信也黃曰曰自天子所曰天子命我以見紂雖不道而文王事紂之心未嘗敢變征伐自天子出我不敢專所謂有事君之小心者於此可見豈若齊晉之名為尊周而實欲專權也哉杕杜勞還役也有杕之杜有睆華板反其實王事靡盬繼嗣我日日月陽止女心傷止征夫遑止有杕之杜其葉萋萋王事靡盬我心傷悲卉木萋止女心悲止征夫歸止陟彼北山言采其杞音起王事靡盬憂我父母檀車幝幝尺善反四牡痯痯古緩反征夫不逺匪載匪來憂心孔疚期逝不至而多為恤卜筮偕止㑹言近止征夫邇止李曰杕杜特生之杜也睆者實貌毛氏曰杕杜猶得其時蕃滋役夫勞苦不得盡其天性是也蓋言特生之杜猶且睆然結實而得其所征夫行役乃不得安其室家曽杕杜之不若也蘇氏曰君子行役則婦人獨任其家事如特生之杜而負有睆之實言弱而不能勝也此說不如毛氏繼嗣我日言其行役以日繼日無有休息之期也陽十月也此蓋言特生之杜得所如此征夫所以不如杕杜則以從於王事也無不堅固日夜不息至十月陽止可以歸矣而猶未至故其室家傷悲則曰征夫今已遑暇矣胡為而不歸哉有杕之杜至征夫歸止亦是上章意陟彼北山言采其杞此又言時物之變也惟其時物之變征夫可以歸矣何為而不歸哉鄭氏曰杞非常菜也而升北山采之託有事以望君子其文與上不相貫此說亦未盡詩人之意王氏曰陟山之髙而以采杞故也采杞則以杞為可食故也此說迂曲甚矣蘇氏曰山之草木非一也而獨采其杞則山嘗有餘矣今王事靡盬非獨以病行者也又以憂其父母曽山木之不如也此說與王氏亦不甚相逺竊意以為此二句正猶草蟲之詩言陟彼北山言采其薇言采其蕨皆以見時物之變感其君子久出思得以見之非有他義也父母者孔氏曰謂其夫也其夫謂其父母者己尊之又親之此蓋曲說此但君子久於行役以王事無不堅固故其父母亦憂懷之安得以父母指為夫邪檀車以檀為車也大明之詩曰檀車煌煌正與此類幝幝敝貌痯痯罷貌此言君子久於行役以檀為車而至於敝以四牡而至於罷而征夫又近而不逺胡為而不歸哉此皆望其歸之之辭也君子不裝載不為來歸使我心孔病矣昔與我期今又不至使我多為憂也至於卜之筮之又㑹其卜筮之言皆曰近也則征夫將邇矣皆是望其歸之辭也觀此詩言王事靡盬憂我父母何以異鴇羽之詩言王事靡盬不能藝稷黍父母何怙期逝不至亦何以異於采緑之詩言五日為期六日不詹然鴇羽采緑之詩乃以為刺而此詩乃以為美者何也蓋鴇羽采緑之詩下之人自訴其勞苦而上之人不知之此其所以可刺下之人勞苦而上之人知之此其所以可美至於憂心孔疚我行不來亦何異於道之云逺我行不來昔我往矣黍稷方華亦何異於小明之詩曰昔我往矣日月方除皆其文不同而意則同學者之於詩當求其意不可泥於句此學詩之法也黃曰鴇羽小明與此詩同意然彼以下之人自訴其勞苦而上不知之此其所以可刺此以下之人初不自言其勞苦而上自知之所以為可美也魚麗力馳反美萬物盛多能備禮也文武以天保以上治內采薇以下治外始於憂勤終於逸樂故美萬物盛多可以告於神明矣魚麗于罶音柳鱨音常鯊音沙君子有酒㫖且多魚麗于罶魴鱧君子有酒多且㫖魚麗于罶鰋鯉君子有酒㫖且有物其多矣維其嘉矣物其㫖矣維其偕矣物其有矣維其時矣李曰魚麗之詩美萬物之繁多也以魚麗觀之則萬物可知矣惟其萬物之盛多故可備禮也序詩者又推其萬物盛多之由蓋由文武以天保以上之三詩以治中國采薇以下之三詩以治夷狄其初則憂勤以致內外之治內外既治皆無事矣故終於逸樂故萬物滋多則可以歌詩而告於神明也采薇之詩以為文王既有異同而常棣之詩則曰閔管蔡之失道故作常棣焉閔管蔡之失道正在成王之世而此序乃以為文王之詩以見詩序非出於一人之所作蓋無疑也罶曲梁也爾雅曰嫠婦之笱謂之罶孫炎曰罶曲梁其功易故謂之寡婦所作也麗厯也鱨說文曰黃楊鯊一名吹鯊陸元恪曰魚狹而小常張口吹沙魴今之青邊也鱧今之𤣥鱧也鰋額白魚也鯉今之赬尾也以寡婦之笱而獲鱨鯊魴鱧鰋鯉如此之多足以見物之盛多也陸農師曰鱨魚黃魴魚青鱧魚𤣥鰋魚白鯉魚赤又鱨鯊小魚魴鱧中魚鰋鯉大魚又謂鱨鯊長魚魴鱧之魚則一方一圓鰋鯉之魚則一俯一仰又鱨鯊魴其性浮鱧鰋鯉其性沈陸農師之意以謂五色之備而小大長短浮沉之不同蓋以見其盛多也然陸元恪乃謂鱨魚之有力而解飛不知有何所據而云君子有酒㫖且多於是君子為酒醴以薦之其物如此之多也鄭氏以君子有酒㫖為絶句而下章皆如此君子有酒㫖且多言酒美而此魚又多君子有酒多且㫖言酒多而此魚又美君子有酒㫖且有言酒美而此魚又有然按下文言物其多矣維其嘉矣物其㫖矣維其偕矣物其有矣維其時矣皆是言萬物之多不必言酒與魚也此蓋言君子為酒醴以宴樂之而其物㫖且多多且㫖㫖且有也物其多矣維其嘉矣以其物之多而又嘉矣物其㫖矣維其偕矣以其物之㫖而又齊矣物其有矣維其時矣以其物之有而又得其時矣皆是言萬物之盛多也哉論曰中庸曰惟聖人為能盡其性能盡其性則能盡人之性能盡人之性則能盡物之性蓋先王之治天下至於使人民繁庶户口滋殖不足為治功之盛若鳥獸草木皆得其性然後可以見治功之最盛也所以致此者亦有由焉語曰焚林而獸明年無獸竭澤而漁明年無魚魚之竭澤可以為一時之富不可以為常惟其取之有時用之有節則可以為不傷孟子曰數罟不入汚池魚鱉不可勝食也斧斤以時入山林材木不可勝用也則知取之多者則其所得者少取之少者則其用為無窮此治亂之所以異也黃曰盡己之性而後能盡人之性盡人之性而後能盡物之性文武之治始之於身推之於人而及之於物自其內外之已治而至於萬物之盛多此孟子所謂魚鱉不可勝食也聖人之治至於鳥獸昆蟲無不咸遂而後為極至一物不得其所則於聖人之治有闕然者然則必曰魚之多者以微者言之也詩人之言萬物不得其性必曰魚在在藻言豐年之兆必曰衆維魚矣亦是此意至末一章言物其多矣維其嘉矣物其㫖矣維其偕矣物其有矣維其時矣此則合萬物而言不必專指酒與魚也文武之治功至此而成矣故曰可以告於神明矣此文武之小雅所以至此而盡歟南陔古哀反孝子相戒以養也白華孝子之潔白也華黍時和歲豐宜黍稷也有其義而亡其辭李曰六篇皆以秦火之後而亡其辭其辭既亡則其義不可得而知毛氏今於南陔則曰孝子相戒以養於白華則曰孝子之潔白於華黍則曰時和嵗豐宜黍稷於由庚則曰萬物得由其道於崇丘則曰萬物得極其髙大於由儀則曰萬物之生各得其宜皆是意度之耳鄭漁仲曰詩多以首二字或篇中次取二字或一字以為題如螽斯樛木之類皆是即物而命或賦或喻故一篇之義全屬題中如竹竿君子陽陽大東四月之類一篇之義不全屬題中丰還之類一篇之義全不在是但說篇中一兩字爾此六章有題無詩作序者但考兩字便率意作一篇之序此說是也夫言詩正如言書其亡書序雖存亦不可以强通詩既亡其辭又無其文安可以强通乎毛氏以意度之其後束晳又以毛氏之意作補亡是益其惑也黃曰此三篇詩已經秦火煨燼而亡其辭辭雖亡而義不可亡則三篇亦可想而見也南陔孝子相戒以養則見其風俗之美而孝子皆相率以養其父母也白華孝子之潔白則見君子之愛其親而思全其身惟恐有所玷汚也華黍時和歲豐宜黍稷則見王者之治至於位天地育萬物而中和之極致也即其義可以悟其意即其意可以知其辭然束晳之補亡詩則過矣南有嘉魚之什詁訓𫝊第十七小雅南有嘉魚樂與賢也太平之君子至誠樂與賢者共之也南有嘉魚蒸然罩罩張教反君子有酒嘉賔式燕以樂南有嘉魚蒸然汕汕所諫反君子有酒嘉賔式燕以衎苦旦反南有樛居虬反木甘瓠音護纍力追反之君子有酒嘉賔式燕綏之翩翩者隼音佳蒸然來思君子有酒嘉賔式燕又思李曰唐孔氏以太平君子當成王之時君子之人已在位有職祿皆有至誠篤實之心樂與在野有賢德者共之於朝而有之願俱得祿位共相燕樂然以詩之文勢觀之其曰太平之君子蓋指成王無疑也孔氏以君子為賢者不以為成王非也此詩言太平之君子至誠得賢者與之共天位食天祿則其尊賢樂善之心無有窮已故作是詩也南有嘉魚鄭氏曰南方有善魚鄭氏意以為善魚是魚之美者王氏亦曰嘉魚以言民之賢者有養人之嘉祉亦是以嘉魚為魚之善者按左太冲蜀都賦嘉魚出於丙穴先儒曰丙穴在漢中沔陽縣嘉乃是魚名也故陸農師曰嘉魚鯉質鱒鯽肌肉甚美食乳泉出於丙穴則知嘉魚者乃是魚之一種也蒸久也罩者爾雅云篧謂之罩李巡云篧編細竹以為罩捕魚也罩罩非一罩也此詩以魚喻賢者魚之為物游於水中可謂難致者也而人乃能久而以罩得之此其所以得魚也賢者處於山林巖阿之下亦可謂難致之矣而太平之君子乃能至誠而樂與之而置之於朝以見君得賢也君子有酒嘉賔式燕以樂言君子有酒以與賢者宴樂則其與賢可知矣汕汕說文曰魚游水貌然罩既是取魚則汕亦是取魚也故毛氏云撩也撩或作樔鄭氏曰撩者今之撩罟也爾雅云罺謂之汕陸農師云太平之君子至誠樂與賢者共之而所以求者上籠之如罩下撩之如汕至誠之道也淮南子曰罩者抑之罾者舉之為之雖異得魚一也觀此則知詩人先言罩後言汕者以見其求賢無方也衎亦樂也南有樛木甘瓠纍之言南方有樛然下垂之木甘瓠之草得以纍蔓之風之所言后妃逮下則言后妃無嫉妒之心以喻樛木此言人君能以禮待人臣亦如樛木下垂而甘瓠纍之則賢者亦將翕然而赴人君之求矣君子有酒嘉賔式燕綏之綏安也隼一宿之鳥言翩翩然者乃隼鳥也鳥久而求集於此鄭氏喻賢者有專一之意於我我將久如而來遲之也此說固非矣而蘇氏又以君臣父子為說亦為不通蓋此詩先以魚取喻以見其求賢之切次言樛木以見其禮下之篤末又言隼以見其賢者之羣然如隼之來集也思語辭也既燕而又思之以見其至誠有加而無已也黃曰東坡嘗曰天下無事則公卿之言輕於鴻毛天下有事則匹夫之言重於太山此非智有所不及而明有所不察緩急之勢異也唐太宗以大亂之後欲致太平則専任魏徴至貞觀之後則漸不克終德宗當播遷之中則姑存陸贄明皇當富庶之後而乃好近小人蓋天下無事之際則人君有自足之心自足之心萌則謂天下無事於賢者矣雖勉强與賢而非出於中心之所樂則不能久矣成王視天下不足為樂而惟賢者為可樂非至誠能若是乎念皎皎之白駒而思今朝之永思渠渠之夏屋而歎無餘之食此皆不能樂與賢之譏也髙宗思賢佐而傅說夢文王善養老而太公歸火不與燥期而就水不與濕期而流人若苟有好賢之心則賢者將自至故曰蒸然來思也南山有臺樂得賢也得賢則能為邦家立太平之基矣南山有臺北山有萊樂只君子邦家之基樂只君子萬夀無期南山有桑北山有楊樂只君子邦家之光樂只君子萬夀無疆南山有把音起北山有李樂只君子民之父母樂只君子德音不已南山有栲北山有杻女久反樂只君子遐不眉夀樂只君子德音是茂南山有枸俱甫反北山有楰音庾樂只君子遐不黃耉樂只君子保艾爾後李曰臺者夫須也陸璣疏云舊說夫須莎草也可以為蓑笠萊者草也陸元恪曰萊草名其葉可食今兖州人蒸以為茹謂之萊蒸此詩言得賢以南山壯山為言者蓋言國之有賢者如山之有草木以自覆蓋也詩言山有苞櫟隰有六駁是言山之有草木以喻國之有賢者如山有喬松隰有游龍亦是山之有草木以喻國之有賢者國而無賢則空其國矣山而無草木則空其山矣孟子曰不信仁賢則國空虛左傳曰師慧過宋朝將私焉其相曰朝也慧曰無人焉相曰朝也何故無人慧曰必無人焉若猶有人豈其以千乘之相易淫樂之矇必無人焉故也見襄十五年是時在宋朝非無人也以千乘之相易淫樂之矇謂之無人可也觀此則知舜之有五臣武王之有十人其賢才止於如是謂之有人可也其後至幽厲之時垂紳搢笏朱紫滿朝謂之無人可也惟國之有賢如山之有草木以自覆蓋故人君樂得賢者則可以為邦國之基本也非特可以為基本又且享萬夀之報也無期者言夀考無有定期也邦家之光言為邦家之光輝也無疆亦與無期同意樂只君子民之父母言能樂只君子可以為民之父母也蓋其所得者皆賢人君子而其所施者亦不忍人之政則民得所親矣德音不已言其令聞合於衆聽無有休已也栲者山樗也杻者檍也遐不眉夀鄭氏曰言其近眉夀也不如程氏曰猶云不遐逺眉夀乎下章言遐不黃耉亦是此意德音是茂言其令聞之茂盛也枸者枳枸也陸氏曰樹髙大似白楊有子著枝端大如指長數寸今謂之木蜜楰者鼠梓也陸氏曰其樹葉木理如楸山木之異者今人謂之苦楸黃耉言其髮黃而面如耉也保安也艾養也已既享其萬夀其遺愛又及於後昆也此詩言衆多之木大抵以見得賢之多也王氏曰臺為賤者所衣萊為賤者所食桑可以衣楊可以為宫室器械之材樗可以為車之巾杻可以為弓弩之幹枸有美食楰有文理而又髙大中宫室器械之材觀此數木雖是如此然詩人之意只言山之有草木以喻國之有賢者若必一一為說則拘矣嘗觀君奭其言文王之臣自虢叔而下太公畢公皆不與焉孔子稱周有八士自虢叔閎夭而下亦不與焉周之多士可知矣其多士如此而成王猶且求之如是蓋人君之求賢不可謂賢才衆多如是而不求也國之有賢才譬猶山澤之有珍寶求之不已珍寶隨至無不如意然觀南有嘉魚南山有臺之詩以見成王得人之多如此及觀卷阿之詩召公又戒成王求賢成王求賢如此其切而召公又戒之以見人君求賢之心不可一日忘也一日少原闕之心生矣此召公所以戒成王也當是時非特成王之求賢而周公又能吐哺握髮以待士周公求賢也又如此君臣之間皆以求賢為急此周之所以為多士也黃曰成王之時周公居左召公居右畢公榮公之列布在邦國賢已用矣而猶曰得賢既醉之太平鳧鷖之守成治已極矣而猶曰立太平之基足見成王之心愈足而愈不自足也成王以為治者亂之幾安者危之府恃其已治而不能保狃其已安而不知戒雖可以為子孫之榮而非子孫無窮之福也成王之治不為一時計故其求賢之心不能自已此詩所以終言保艾爾後而序以為立太平之基也由庚萬物得由其道也崇丘萬物得極其髙大也由儀萬物之生各得其宜也有其義而亡其辭李迃仲解見南陔篇黃曰得由其道如斂藏順其時之類得極其髙大如斧斤以時入山林之類得其宜如各遂其長生之類非聖人能盡人物之性致中和之功贊化育之妙安能致此毛詩集解卷二十
