body:
  text: 毛詩集解卷六宋李樗黃櫄撰北門刺仕不得志也言衛之忠臣不得其志爾出自北門憂心殷殷終窶其矩反且貧莫知我艱已焉哉天實為之謂之何哉王事適我政事一埤避支反益我我入自外室人交遍謫我已焉哉天實為之謂之何哉王事敦我政事一埤遺我我入自外室人交遍摧我己焉哉天實為之謂之何哉李曰言衛之諸臣盡瘁於國而不免於終窶且貧不得志甚矣記曰忠信重祿所以勸士大夫忠信所以待之重祿所以養之然後可以勸士今衛之忠臣其盡瘁如此且不免於終窶且貧將何以為勸養之道然人臣事君惟效其忠而已若以利祿存心則是懷二心以事其君也表記曰故君子不以小言受大祿不以大言受小祿也以小言受大祿則報踰其分固不當受也以大言受小祿是不見知於君亦所不當受也衛之忠臣終窶且貧是不見知於君也可知非是專較其廩祿之厚薄也出自北門憂心殷殷毛氏説以北門背明向隂喻已仕於暗君猶行而出北門諸家之説皆同據此詩但以從王事出自於北門矣非取譬於暗君也下文曰王事適我則以王事有所之往矣憂心殷殷者言君子不得志而小人用事此其所以可憂也終窶且貧先儒以謂貧窶兩事窶謂無財可以為禮貧謂無財可以自給竊謂貧窶不必如此分别爾雅曰窶貧也窶只是貧而兼言之以見貧之甚也莫知我艱説者謂終窶且貧君之莫我知也莫知我艱固是人之莫我知然亦不必如此分别已焉哉天實為之謂之何哉君己不我知則君之罪也今也歸之天而不怨於君乃知天命者之言也王事適我政事一埤益我適之也埤厚也敦近也遺加也言王國之事皆就於吾身而吾終窶且貧是徒勞也故自外入室人交遍來責沮我見其勞苦而家之窶貧不能無怨使忠臣而亦懷怨懟則與無知之婦人何異故但歸之於天而曰已焉哉天實為之謂之何哉然此詩云婦人或謫之或摧之則與殷其雷召南之大夫逺行從政不遑寧處其室家能閔其勤勞勸以義也大異矣夫自古無道之世無功者受祿有功者不見知無功而受祿則若伐檀之詩是也不稼不穡胡取禾三百廛兮不狩不獵胡瞻爾庭有縣貆兮此之謂無功而受祿有功不見知則此詩是也王事適我政事一埤益我而不免於貧窶則衛君不我知也甚矣無功者食祿有功者不見知則有功者必怨故北山之詩我從事獨賢役使不均以至於不知呌號或慘慘劬勞而怨憾之情如此今北門之詩則不然是能安窮順受歸之天者也昔公伯寮訴子路於季孫孔子曰道之將行也與命也道之將廢也與命也魯平公欲見孟子而嬖人沮之孟子曰吾之不遇魯侯天也夫孔孟所以能過人者以其能樂天知命也而北門之大夫亦爾可謂賢矣王氏乃以謂人臣事是君為容悅者其北門大夫之謂乎若有道之士道合則從不合則去其説不合詩人之意龜山已言其非矣兹所以不復云黃曰此詩言出自北門是特忠臣役於王事自北門而出耳諸人以背明向隂喻其君之昏暗安有為人臣子以仕不得志而遽以昏暗喻君乎韓文公貶知潮州見吏與民盛言朝廷清明天子愛民而未嘗敢有怨辭也蓋臣之於君猶子之於父雖勞而不敢怨惟當泣於旻天以自責己而已北門之忠臣役於王事而困於貧窶既不見知於其國復不見知於其家自常人處之有不能堪者而此詩特歸之天可謂不見是而無悶人不知而不愠也嗚呼匪兕匪虎而孔子弦歌不輟嬖人臧倉沮孟子孟子曰吾不遇魯侯天也北門之忠臣可謂樂天知命北風刺虐也衛國並為威虐百姓不親莫不相攜持而去焉北風其涼雨于付反雪其雱普康反惠而好呼報反我攜手同行其虛其邪音徐既亟紀力反只且子余反北風其喈雨雪其霏芳非反惠而好我攜手同歸其虛其邪既亟只且莫赤匪狐莫黑匪烏惠而好我攜手同車其虛其邪既亟只且李曰言衛之君臣並為威虐故百姓不親相攜持而去他國也夫三代之時君有愛民之心故天下之人並蒙其澤自三代而後君臣上下同惡相濟秦始皇之為君虐甚矣李斯之為臣復以暴虐漢武帝之為君暴甚矣而張湯杜周之為臣皆一時之酷吏唐武后殘忍加以來俊臣之徒為之爪牙是皆同惡而相濟使人臣而有愛民之心而君暴虐則為臣者當奉身而去使人君而有愛民之心而其臣暴虐則君當黜之今也君臣並為威虐則是上下一體此百姓所以舍無道之國而之有道之國也北風其涼雨雪其雱北風寒涼之風也雱盛也喈疾也霏甚貌歐陽公説云雖風雨如此有與我相惠好者當相與攜手同行同歸衝風冒雪避衛之虐亦不憚雨之寒而往也然詩人之意以風雪寒盛喻君政酷暴病虐百姓如終風之詩云終風且霾終風且曀之類皆取譬於暴虐而此詩亦然程氏云四時之風春而自東生物也夏而自南長物也秋而自西成物也冬而自北殺物也以北風之肅殺於物故多興虐政也風而又雪者則其雪甚矣王氏之説曰北風之寒也而以為涼北風之厲也而以為喈此以言其為威雨雪之散也而以為雱雨雪之集也而以為霏此以言其為虐則鑿之甚矣惠而好我攜手同行言彼有推恩惠而好我者我與此人攜手而去欲其共歸有德者也曰同歸同車者皆同行之意故也而王氏云乘車則非賤者也攜手同行則賤者去也攜手同車則貴者去之矣言國人無貴賤皆憚其威虐莫不舍之而適他國也蓋民常情去就視君書云厥終智藏瘝在夫知保抱攜持厥婦子以哀籲天徂厥亡出執瘝病也言在位皆為民之病紂既威虐而在位者又皆為斯民之病則民安得不攜持而去及其出亡也紂出執之然民終不可得而留也其虛其邪既亟只且鄭氏以虛邪容止也言在位之人其威儀虛邪寬仁者今皆盡為亟刻之行矣其説不通王氏以虛邪只作如字讀其虛者不以忮害物邪者不以正格人二者雖君子小人之道不同然宜皆不為威虐者也以虛為君子以邪為小人其説鑿矣惟歐陽程氏之説為當歐氏之説曰其可虛邪而不進乎當急去之矣程氏以虛邪為雍容只且助語言尚可寬容徐緩乎宜急去之夫民之去父母國豈人之本情也哉昔孔子去魯曰遲遲吾行也去父母國之道也今衛之暴虐而民急去者蓋恐遲留於此而遭其禍必有大不忍於此而奪其情也莫赤匪狐莫黑匪烏王氏狐赤烏黑莫能别也鄭氏云赤則狐也黑則烏也猶今君臣相承為惡如一歐陽又以謂民各呼其類而往皆不如程氏莫赤者匪狐乎莫黑者匪烏乎以見其色而知其物也豈難辨哉觀其政之道則知其暴虐將及於人矣蓋望其赤則知其為狐望其黑則知其為烏為虐則知其為禍必矣如周之興不必觀其白魚之祥但觀其興仁政則知其必興矣如紂之亡不必觀其晝星見而雨但觀其虐則知其必亡矣夫民撫我則后虐我則讎使人君能撫其民民必翕然歸之雖欲驅之而民不去也使人君虐其民則民望望然去之欲撫而留之亦不可也既去無道之國則必歸有道之國蓋無道之國驅民也孟子為叢驅雀者鸇也為淵驅魚者獺也為湯武驅民者桀與紂也如漢高祖入關秋毫無所取與民約法三章去秦之暴政而民皆悅之逮項羽入關焚燒宫室而秦民失望若羽者正為髙祖驅民也為人上者可不戒哉黃曰觀此詩而見民情之不可失也夫人情豈欲去其室家而之他國哉而北風之詩言衛之人略無愛君之心歟君臣並為威虐則民無所措手足其欲去塗炭而坐衽席避水火而適樂郊亦民情之所同然歟孟子曰為叢驅雀者鸇也為淵驅魚者獺也為湯武驅民者桀與紂也觀湯武之興而簞食壺漿之迎有不辭者漢髙祖入關而父老爭持牛酒民情所在其可一日失乎人君苟能發政施仁則耕者皆欲耕於其野商賈皆欲藏於其市行旅皆欲出於其塗賢者皆欲立於其朝而尚忍去之哉靜女刺時也衛君無道夫人無德靜女其姝赤朱反俟我於城隅愛而不見搔蘇刀反首踟直知反蹰直朱反靜女其孌貽我彤徒冬反管彤管有煒于鬼反説音悅懌音亦女美自牧歸荑洵音荀美且異匪女之為美美人之貽李曰衛宣公之無道上焉納於夷薑下焉又納於宣薑故國人化之而淫風盛行詩序曰刺時也以衛之風俗皆效宣公而為淫亂之事故谷風之詩言衛之人化其上靜女其姝俟我於城隅毛鄭王張皆以為美詩如毛氏云城隅以言其髙而不可踰此但説城隅兩字至於俟我則説不出張氏則以為夫人居後宫之西北是城隅也俟我人君也此猶可説也於自牧歸荑則説不行惟歐陽以為刺時詩衛人化其上雖貞靜之女亦俟我於城隅既而失約求之不見故搔其首而踟蹰靜女其孌貽我彤管靜女孌然而美好遺我以彤管彤赤色赤色之管可以悅人如女色之美可以悅懌也自牧歸荑言自牧田之地而歸我以荑荑茅之始生也信為美且異然非可以比女人之美但遺之以為美耳男女相遺正如溱洧之詩云贈之以勺藥之類東門之枌之詩貽我握椒從歐陽之説惟彤管可疑其説難通惟毛鄭之意謂彤管者后夫人必有女史所書后妃羣妾功過之筆歐陽則以謂彤管既是王宫所有之物靜女何由得之況古者針筆皆有管樂亦有管不知所謂彤管何物也如左傳定公九年靜女之三章取彤管焉杜元凱以為三章之詩雖説美女美在彤管則又以為美事今但闕之以待知者黃曰歐陽公以為貽我彤管如贈之以勺藥貽我握椒之類是特男女相遺以通情結好云耳古者針筆皆有管樂器亦有管彤管乃色之尤美者毛鄭以為女史所執以書后妃羣妾功過之筆而歐陽子辨之豫以謂毛鄭之説必有自來不可非也左傳定公九年言靜女三章取彤管焉杜元凱注以為三章之詩雖説美女美在彤管則歐陽之説為不通矣歐陽疑俟我於城隅非靜女之事豫以為俟我於堂乎而以待親迎之禮今宣薑與宣公為淫奔之行則又不足言此故詩人刺之新臺刺衛宣公也納伋之妻作新臺於河上而要於遙反之國人惡之而作是詩也新臺有泚七禮反河水瀰瀰莫爾反燕婉之求籧音渠篨音除不鮮斯淺反新臺有灑七罪反河水浼浼音每燕婉之求籧篨不殄魚網之設鴻則離之燕婉之求得此戚施李曰宣公上蒸於夷薑而生伋為伋娶其妻伋之妻自齊來宣公聞其色之美欲納之又恐其不從焉故於河上作新臺而要之國人皆知其惡宣公不自知其惡此宣所以為宣也新臺有泚河水瀰瀰毛氏云泚鮮明貌瀰瀰盛貌灑髙峻也浼浼平也王氏以泚為清瀰為盛言為清潔之臺而盈其淫汚之行毛氏以水所以潔汚穢反於河上而為淫昏之行二説皆非原詩人之意蓋以記其作新臺於河上而水瀰瀰泚泚而已新臺臨河今澶州尚存遺地燕婉之求籧篨不鮮燕婉安順也籧篨不能俯者也戚施不能仰者也鄭氏説以齊女來嫁於衛其心本求燕婉之人謂伋也反得籧篨不善之人謂宣公也此説固然至於籧篨為口柔戚施為面柔其説非也王氏以籧篨不能俯者所以刺宣公之無見於下戚施不能仰者又以言齊女之無見於上是以亂人倫而不恥也亦非也惟蘇黃門之説謂此二者天下惡疾而詩人之言所以深惡宣公也其説得之矣而歐陽公謂宣公之築臺求燕婉之樂國人過其下者皆仰而視之既而惡之又不能仰視皆不如蘇氏之説其曰籧篨不鮮者言籧篨之疾不善也不殄者言籧篨之疾不絶此見其惡疾之多也魚網之設鴻則離之夫網者所以求魚今也鴻反離之是其所得非所求也如宣薑本求伋而反得宣公是也觀此詩則國人惡宣公甚矣國人深惡之而宣公乃安然而為之宣公其非人乎聖人存此以戒後世後世之君宜懲其轍而乃有踵其惡者如楚平王為太子建娶於秦費無極言秦女美王遂自娶之唐明皇為壽王娶楊妃聞其美色更為壽王别娶而自納為妃是此三君者其惡一也故左傳載子産警蔡侯之惡曰其不免乎若不免必由其子其為君也淫而不父僑聞之如是當有子患乎其後景公果為太子班所殺以此見其為惡之報也衛宣公楚平王唐明皇雖無景公之禍然宣公之子伋壽皆為所殺惠公奔齊其後惠公子懿公為狄所滅楚平王有鞭尸之禍吳入郢幾失其國唐明皇末年盜發幽陵身竄南蜀幾失天下則知淫亂之禍其報如此可不戒哉黃曰此一詩乃國人惡宣公之辭鄭氏失其義辨鄭氏者又從而自戾之歐陽公謂宣公淫恣於新臺之上國人過其下者或仰面而視之故曰籧篨戚施按國語謂籧篨戚施與焦僥侏儒之類謂之八疾則詩人之意以為宣公之惡疾不少而且不絶也向蒸夷薑今又淫宣薑其惡疾可勝言哉燕婉之求或以為伋豫以為宣公美辭順語而惑宣薑也則詩人之意明矣宣公之疾固疾也而宣公不自知其疾故詩人疾之後世如楚平王唐明皇皆為此疾所敗至於幾死可不畏哉二子乘舟思伋壽也衛宣公之二子爭相為去聲死國人傷而思之作是詩也二子乘舟泛泛其景願言思子中心養養二子乘舟泛泛其逝願言思子不瑕有害李曰宣公納伋之妻生壽及朔朔與其母訴伋於公公使之齊使盜先待於隘欲殺之壽知以告伋使去之伋曰君命也不可逃壽竊其旌以先往盜遂殺之伋至曰君命殺我壽有何罪賊又殺之見桓公十六年國人見無罪而死作是詩以思之二子乘舟泛泛其景蘇氏以二子自衛適齊必涉河乘舟然焉知自衛適齊以為乘舟耶不如歐陽以為譬喻言乘舟者無所維制泛泛然徒見其影則其終必有覆溺之禍二子之輕生此所以有見殺之禍也國人救之而不可得是以思之養養然憂而不知所定也逝者往也不瑕有害者蘇氏言二子若避害而去於義非有瑕疵也而曷為不去哉衛宣公奪伋之妻而又殺伋楚平王奪建之妻而又殺建二人所為若合符節人君一惑於色則父子之間害恩害義如此乃知好色之為害也夫宣公既奪其妻矣而又從而殺之則宣公之罪也然而於伋亦不能無過焉蓋父之命有可從者有不可從者如舜之為子見大杖則走小杖則受小杖則受是可從大杖則走是不可從也不從父之命則其過在己陷父不義則是歸過於父與其歸過於父寧且歸過於己也今也伋既不能避害而見殺是不可從而從也壽之爭死非所宜矣無救於兄而重父之過君子以為非義也昔晉獻公將殺其太子申生重耳令去其國申生曰不可君謂我弒君也天下豈有無父之國吾何行如之遂縊於新城是以謂之恭世子矣太子申生謂之恭則可而謂之孝則未可也若伋壽以恭名之則可論其孝則亦未可也黃曰楚平王奪建之妻而殺建衛宣公奪伋之妻而殺伋私欲既甚天理必絶若仇讎然風俗敗壞至此極矣或曰是敗風俗也聖人何為不刪曰聖人所以示戒於後世也聖人以宣公淫亂之事為衛風之首而齊人救衛之亂為衛風之終聖人之意深矣天下國家所以維持安全者禮也禮亡矣其能國乎父子相為仇敵則與夷狄何異天理既亡人倫既亂則與禽獸何異衛之為夷狄所窺者久矣不然則蕞爾之狄何能一旦舉堂堂之大國而墟其社稷哉辛有適伊川見被髮而祭於野者曰不及百年此其戎乎今宣公淫亂至於殺其二子是亦戎狄而已矣則衛之為狄所滅非一朝一夕之故也聖人不刪宣公淫亂之詩而以木瓜之詩繫之於終焉蓋君以此始必以此終人君於閨門衽席之間可不戒哉可不畏哉鄘音庸柏舟詁訓傳第四國風柏舟共音恭薑自誓也衛世子共伯蚤死其妻守義父母欲奪而嫁之誓而弗許故作是詩以絶之泛彼柏舟在彼中河髧徒坎反彼兩髦音毛實維我儀之死矢靡它母也天只不諒人只泛彼柏舟在彼河側髧彼兩髦實維我特之死矢靡慝他得反母也天只不諒人只李曰共伯者衛僖侯之子也史記云衛共伯之弟和是為武公知有寵於釐侯釐侯多與之賂和以賂賂士襲攻共伯於墓上共伯入釐侯羡自殺衛人因葬於釐侯旁按詩序曰衛世子共伯早死其妻守義初無篡奪之文且武公賢者衛人謂睿聖武公奪適之事未可以誣之故疑之而不録也今以詩觀之但蚤死則知子由之説為然夫篡奪天下之大惡也以武公之睿聖豈為是哉猶後世以宰豫為與田常作亂也蘇子能辨其誣善矣世子既蚤死共薑能守義父母欲奪而嫁之則誓而弗許故作是詩以絶之所以止父母奪己之意也泛彼柏舟亦泛其流王氏立説以柏非不可以為舟然而為舟者非柏之所宜以譬之女非不可以再嫁而再嫁非女之所宜王氏之説多以柏為不宜舟如前柏舟亦曰柏者天下之良材也不以為舟皆非也前之柏舟則其意在於泛泛其流言柏舟不可以載物而徒泛其流則其誣一也此柏舟則其意在於從中河也共薑自誓若柏舟之為物當常在中河如婦人之義當常在夫家若捨之而之它則不可中河即河中也如在彼中谷即谷中也在彼河側亦言其在河之側與上文其意則同矣髧兩髦之貌兒生三月剪髮為鬌男角女羈內則注云髦者用髮為之象幼時鬌其制未聞喪大記云小斂主人脫髦則共伯之死時僖侯已葬去髦久矣猶云兩髦者孔氏云追本在父母時飾也實維我儀儀匹也言共伯實我之匹也特亦匹國語云丹朱憑身以儀之是亦儀匹之意也之死矢靡它誓至死而無有它心也母也天只不諒人只天也父也母也言父母何不信我而欲奪己以再嫁乎夫忠臣不事兩君貞女不嫁二夫易曰恆其德貞婦人吉夫子凶象曰婦人貞吉從一而終也則知婦人之節蓋當如此然而風俗薄惡禮義消亡雖有七子之母猶不能安其室若共薑者當共伯蚤死能守節義不嫁乃不從父母之意可謂難能矣後漢蔡琰始適河東衛仲道既而夫亡又適胡人凡兩適夫其節已失矣然而博學有才辨妙於音律范曄載之於列女傳夫以博學才辨乃婦人之末節至夫死不嫁乃婦人之大節彼既失其大節而區區於末節何足道哉琰之失節比之共薑固萬萬不相侔而范曄之去取異矣吕吉甫嘗曰匹婦不嫁無以自存共薑乃衛世子之妻公室之婦其勢非不能自存故以不嫁為宜此説非也後世婦人有改嫁者以謂飢寒所係遂失節而再嫁殊不知失節之大罪不容誅飢寒之患所係者小再嫁而失節所係者大五代王凝妻不忍以手見汚於人為一身之纍遂斷其手雖死不避況於飢寒乎以此見吉甫之説又不然也黃曰豫嘗讀詩至鄘之柏舟喟然而歎曰當衛國淫亂之時而猶有若是婦人也哉吾乃今知天理之不可泯沒而天下未嘗無正人也共伯雖死妻能守義父母欲奪嫁之而誓弗許其守死不二之志雖忠臣正士無以過其節孔子刪衛之詩而亦幸之深也是其所以首鄘風乎泛彼柏舟在彼中河以喻婦人雖亡其夫而不可以它適也髧彼兩髦實維我儀言婦無夫不事膏沐自誓以此終其身也特以言實我之特節如此不必以為匹也婦人從夫人臣事君其義不可不明而不可有二心此皆當然之事而在衛國則有深可貴者唐太宗賜蕭瑀曰疾風知徑草板蕩識忠臣吾亦於衛國淫風而深歎共薑守義之志也牆有茨衛人刺其上也公子頑通乎君母國人疾之而不可道也牆有茨不可掃也中冓古候反之言不可道也所可道也言之醜也牆有茨不可襄也中冓之言不可詳也所可詳也言之長也牆有茨不可束也中冓之言不可讀也所可讀也言之辱也李曰閔公二年左傳曰初惠公之即位也少齊人使昭伯蒸於宣薑生齊子戴公文公宋桓夫人許穆夫人昭伯者即公子頑也乃惠公之庶兄宣薑惠公之母也王氏曰當是時惠公幼故刺其上也楊龜山乃以為不然言衛人化其上故淫風大行公子頑之惡國人雖疾之而不可道序言刺其上者蓋推本而言之非謂惠公之幼也牆有茨不可掃也毛氏謂牆所以防非常茨蒺藜也欲掃去之反傷牆如毛氏之説不可掃則得詩人之本意而謂墻所以防非常茨蒺藜非也鄭氏又從而附其説歐陽詳言之矣王氏又以謂牆所以限制內外有避嫌之道故以況君牆茨為之穢故以況公子頑是亦毛氏之意不可取也惟歐陽公云宣薑是國君之母欲誅公子頑則暴宣薑之罪傷惠公子母之道故不得而誅耳詩人乃引蒺藜人所惡之草今乃生於牆理當掃除然欲掃則恐傷墻以比公子頑罪當誅戮則惟恐傷惠公子母之道其義如此此説是也蓋詩人欲掃去牆之茨又恐傷其牆正猶投鼠忌器鼠近於器故不可投也茨生於牆不可掃也不可襄者如詩人謂玁狁于襄是也束者束而去之也中冓之言宫中所冓淫亂之言也詳審也讀毛氏云抽也不必以讀為抽但宣露之意也善乎楊龜山之言曰公子頑通乎君母閨闥之言至不可讀其汚甚矣聖人何取而著之於經也蓋自古淫亂之君自以謂祕密於閨門之中世無得而知然行無隱而不彰言無細而不聞苟行淫昏於庭闈而牀簀之言無不踰于閾外其為諷誡深矣蓋天下之理莫見乎隱莫顯乎微雖鼓鐘于宫聲聞于外潛雖伏矣亦孔之照此勢之必然也昔班固作漢史凡諸侯王為淫亂之事褻瀆之言一一備載似非作史之體也然得詩人垂戒之意也彼漢之諸王當其為惡謂世莫之知今史臣載於書則是當世亦知之以是知惡之不可掩也若秦之時誹謗者誅偶語者棄市想秦之過惡是無知之者也然考之史無不具載則人亦知之大抵人之為不善固欲人之不言人之不知然終不免於人之言人之知也由是觀之則是相在爾室尚不愧於屋漏學者其可不盡心於斯言乎一云殿中通謂之中冓黃曰衛國淫亂之風及於牆有茨之詩有不可言者矣言之則汚齒牙書之則汚簡䇿詩人以為不可道其疾之深矣宣公納伋之妻而公子頑通乎君母傳曰君以此始亦以此終曽子曰戒之戒之出乎爾者反乎爾者也君子偕老刺衛夫人也夫人淫亂失事君子之道故陳人君之德服飾之盛宜與君子偕老也君子偕老副笄六珈音加委委於危反他他徒何反如山如河象服是宜子之不淑云如之何玼音此兮玼兮其之翟也鬒真忍反髮如雲不屑相節反髢徒帝反也玉之瑱吐殿反也象之揥勑帝反也揚且之皙星歷反也胡然而天也胡然而帝也瑳七我反兮瑳兮其之展也蒙彼皺仄救反絺是紲息列反袢符袁反也子之清揚揚且之顔也展如之人兮邦之媛于眷反也李曰夫人宣薑也言宣薑淫亂失事君子之道故詩人陳古人君之德以諷之鄭氏謂人君乃小君也或者小字誤作人耳理或然也小君者言其德只足以為國君之配故服其夫人之服而宜與君子偕老如文王之后太姒有關雎之德故詩曰天作之合言其配文王實天作之也今宣公淫亂以宣薑配之是其同惡相濟也故詩人深責宣薑徒盛其衣服而無其德不足與君子偕老之道也君子偕老副笄六珈副者后夫人祭服之首飾周禮追師掌王后之首服為副編次副之為言覆也所以覆首而為之飾毛氏云副者后夫人之首飾編髮為之祭統曰夫人副褘蓋首著副而服褘衣也笄衡笄也以玉為之垂於副之兩傍當耳其下以紞懸瑱是也六珈者鄭氏云珈之為言加也副既笄而加此飾如漢金步搖之上飾也古之制所有未聞然考之後漢輿服志步搖以黃金為山題貫白珠為桂枝相繆一爵九華熊虎赤羆天鹿辟邪南山豐大特六獸詩所謂副笄六珈者蓋漢之時皇后之飾如此亦是倣象此詩之制也然畢竟不知六珈果何物耶但見其加上者飾之有六而所施之處亦未知釋訓云委委他他美也孫炎曰委委行之美他他長之美蓋言其威儀也言其行步詳緩長大之美如山之崇如河之深如山之崇則不至於慢易如河之深則不至於淺狹象服是宜象服謂褕翟闕翟也夫副笄六珈委委他他如山如河則有德矣故可以稱其服今也以宣薑之淫昏其如是服何玼兮玼兮其之翟也説文曰玼玉色之鮮也言褕翟闕翟其色之鮮也褕翟刻繪為翟形畫以五色綴之於衣闕翟者亦刻繪為翟形但不畫以五色故謂之闕翟此二者皆侯伯夫人之服鬒髮黑也左昭公二十八年有仍氏生女鬒黑而甚美光可以鑑故舉詩云鬒髮如雲服虔云美髮為鬒是鬒為黑髮也如雲衆也屑潔言其髮之美故不以髢為屑潔説文曰髢益髮也言人髮少聚他人髮益之今此髮既美矣故不用他人之髮以益之也瑱所以塞耳也以玉為之如淇奧曰充耳琇瑩是也揥所以摘髮也以象骨為之如葛屨詩佩其象揥是也揚眉上廣其面之色又白皙也左傳曰澤門之皙是也上既言衣服容貌之盛以此言其胡然而尊如天耶胡然而尊如帝耶以其有德故尊之也鄭氏以帝為五帝其説出於穿鑿其語不可信胡然而天胡然而帝蓋反覆言之程氏以帝為君亦不必如此瑳兮瑳兮説文曰玉色鮮白也瑳兮言其展衣之白也絺以葛為之皺絺絺之蹙蹙者是紲袢也毛氏云是當暑袢延之服王氏則據説文袢當讀絆然袢字又與絆繫字同紲與褻狎之褻字同此紲袢人只作紲是自為異同難以取信毛氏但言袢為當暑袢延之服至於紲字全不見義王氏之説曰暑服則加紲袢焉所以自斂飭也清視清明也揚廣揚而且顔角豐滿也信如此之人可以為邦之媛也媛美女也王氏云以展為有信誠之道焉且王氏既以上文為冶容又以下文為有誠信其文殊不相貫故知展如之人兮蓋言其服飾之盛容貌之美信如此之人然後可以為邦之媛也表記曰君子服其服則文之以君子之容有其容則文之以君子之辭遂其辭則實之以君子之德苟為徒服其服而無德與衣猿狙以周公之服者何以異夫人所以服者以其有德而已豈直以衣服為觀美耶善乎東坡之言曰夫詩者不可以言語求而得必觀其深意焉故其譏刺是人也不言其所為之不善而言其爵位之尊車服之美而民疾之以見其不堪也君子偕老副笄六珈赫赫師尹民具爾聸是也其頌美是人也不言其所為之善而言其冠辨之華容貌之盛而民安之以見其無愧也緇衣之宜兮敝豫又改為兮服其命服朱芾斯皇是也詳觀於詩大槩如此如充耳琇瑩會辨如星是國君之稱其服也如蜉蝣之羽衣裳楚楚是國君之不稱其服也朱幩鑣鑣翟茀以朝是夫人之稱其服也如此詩是夫人之不稱其服也左氏傳曰服之不衷身之災也今也夫人無其德而徒服其服故國人譏之若此豈非身之災乎黃曰東坡云云見前君子偕老一詩盛言夫人服飾之盛而當思所以稱之以愧宣薑耳副笄六珈揚且之皙也止上一段見李則又有其容矣既有其服又有其容當思所以稱之瑳兮瑳兮是紲袢也止並見李其末章又言信有如此之人而後可以助人君之內治以為邦人之倚賴其微意以責其不能如此蓋服必與德稱而後可以無愧不然則彼其之子不稱其服所謂以小人而乘君子之器盜思奪之矣桑中刺奔也衛之公室淫亂男女相奔至于世族在位相竊妻妾期於幽逺政散民流而不可止爰采唐矣沫音妹之鄉矣云誰之思美孟薑矣期我乎桑中要於遙反我乎上宫送我乎淇之上矣爰采麥矣沫之北矣云誰之思美孟弋矣期我乎桑中要我乎上宫送我乎淇之上矣爰采葑矣沫之東矣云誰之思美孟庸矣期我乎桑中要我乎上宫送我乎淇之上矣李曰衛之夫人淫亂臣下化之在位相竊妻妾期於幽逺故政教荒散世俗流移淫亂成風不可止也記曰鄭衛之音亂世之音也比於慢矣桑間濮上之音亡國之音也其政散其民流誣上行私而不可止正此詩之謂也爰采唐矣唐是蒙也爾雅曰唐蒙女蘿女蘿菟絲蘇云唐菟絲也託采唐以相誘也蓋其采唐於沫之鄉其所思乃在於孟薑正氓所謂匪來貿絲來即我謀是也鄭云於何采唐必沫之鄉沫邑名也沫鄘邑近衛地書曰明大命於妹邦紂都朝歌即此是也云誰之思所思者誰乎在於美好孟薑為淫亂也所以思孟薑者蓋孟薑與我期於桑中要我乎上宫送我乎淇之上此所以思之也桑中上宫皆地名也淇上淇水之上也王氏云上宫城中之宅也方桑之時民宜在田不宜在城中之宅皆曲説也葑蔓菁也孟長女也弋庸皆姓也王氏則以孟薑為公室以弋庸為世族其稱薑與弋庸皆曰孟者孟則長矣而猶犯禮則季稚可知不必如此分别也詩之國風惟衛風陳風多淫泆之事衛詩三十有九其淫亂者十有一如雄雉匏有苦葉凱風谷風新臺靜女牆有茨桑中鶉之奔奔蝃蝀氓之詩淫亂之詩如此其多原其所自蓋有由矣衛自宣公淫亂而世族在位從而淫亂其民亦從而化之至於政散民流而不可止陳自幽公靈公之亂而子仲之子從而化之以至於男女相悅而憂思感傷惟其公族既化則下從之矣孟子曰上有好者下必有甚焉者矣春秋之時魯之君率皆專權自恣征伐不請於天子故三家亦皆專權自恣三家既專權矣故陪臣亦執國命勢之相激使之然也夫為人君者必當正其本本正則末從而正矣苟不正其本而區區於法制將以禁民之淫亂何得而正哉黃曰記曰桑間濮上之音亡國之音也其政散其民流誣上行私而不可止衛國之風而至於此則亡之兆矣孟子言王曰何以利吾國推而至於大夫推而至於士庶人莫不皆然則國非其國而危之兆也宣公不知戒謹於衽席之上而成衛國淫奔之風為衛國者其能久乎鶉音純之奔奔刺衛宣薑也衛人以為宣薑鶉鵲之不若也鶉之奔奔鵲之強強人之無良我以為兄鵲之強強鶉之奔奔人之無良我以為君李曰宣薑通於公子頑衛人惡之故作是詩以刺之言宣薑之行反鶉鵲之不若也鶉之奔奔鶉居也今之䳺雀莊子有鶉居詩人有懸鶉莊子曰烏鵲孺陸農師云烏鵲傅枝上欲故謂之孺鄭氏曰奔奔強強言其居有常匹飛則相隨之貌以刺宣薑與頑非匹偶蓋公子頑乃惠公之庶兄也言鶉鵲尚且如此人之行乃不如是也故下文則曰人之無良我以為兄者言人之不善我以為兄兄公子頑也頑乃惠公之庶兄也我以為君者人之不善我乃以為君君者宣薑也夫人稱曰小君故謂之君左傳襄九年筮穆薑曰君必速出則知小君亦可謂之君也徐安道曰一章言我以為兄斥公子頑故先言鶉鶉好鬭以守所匹男子之義也二章言我以為君斥宣薑故先言鵲鵲之性不淫其匹者婦人之義也據此詩言鶉鵲但顛倒其文而便於押韻爾陸氏謂我以為兄兄女兄也我以為君君女君也故序曰刺宣薑曰兄者妹刺宣薑之辭曰君者妾刺宣薑之辭也其説皆不然序言衛人刺之亦猶牆有茨序言衛人刺之不必專指妹與妾也孟子曰人之所以異於禽獸者幾希庶民去之君子存之舜明於庶物察於人倫人之所以異於禽獸者以其知人倫故也禽獸而不知於人倫所以為禽獸人而知人倫所以為人所謂人者以其為萬物之靈苟不能明於人倫則失其所以為萬物之靈矣詩人多以禽獸而比人如雄雉于飛泄泄其羽匏有苦葉言有鷕雉鳴雉鳴求其牡南山言南山崔崔雄狐綏綏皆刺其淫亂故以鳥獸比之也今此詩序曰衛人以為宣薑鶉鵲之不若亦疾之甚也大學言詩曰綿蠻黃鳥止于丘隅子曰於止知其所止可以人而不如鳥乎鳥獸苟能知所止而守其匹名雖為禽獸而其實人也人苟不能知所止而失其匹名雖為人而其實則禽獸也以此推之螻蟻有君臣之義人而無君臣之義則螻蟻之不若也虎狼有父子之仁人而無父子之仁則虎狼之不若也鴻鴈有兄弟之義人而無兄弟之義則鴻鴈之不若也至於一草一木一蟲一豸皆有妙理學者於此類求之然後可以盡為人之道也黃曰惟禽獸無禮故父子聚麀是故聖人作為禮以教使自别於禽獸又曰於止知其所止可以人而不如鳥乎今宣薑瀆亂人倫故詩人以為鶉鵲之不若夫詩本鶉厚而忍以禽獸喻之則其君亦可知矣毛詩集解卷六
