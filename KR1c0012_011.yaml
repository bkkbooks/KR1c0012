body:
  text: 毛詩集解卷十一宋李樗黃櫄撰出其東門閔亂也公子五爭兵革不息男女相弃民人思保其室家焉出其東門有女如雲雖則如雲匪我思存縞衣綦巾聊樂我貟音云出其闉音因闍音都有女如荼雖則如荼匪我思且縞衣茹音如藘力於反聊可與娛一作虞李曰春秋左氏𫝊桓公十一年宋人執祭仲出忽而立突此一爭也十五年鄭厲公使雍糾殺祭仲祭仲知之殺紏厲公出奔蔡而忽立此二爭也十七年髙渠彌殺昭公而立公子亹此三爭也十八年祭仲逆鄭子于陳而立之此四爭也莊公十四年傅瑕殺鄭子而納厲公此五爭也惟鄭國之亂如此故民困於兵革之事室家相弃而思保其室家焉出其東門有女如雲言出鄭國之東門有女如雲之多也鄭氏曰如雲者如其從風東西南北心無有定非也雖則如雲匪我思存言雖有女如是之多然非我思之所存我思之所存者欲昔日夫婦相得矣縞衣綦巾言昔日夫婦之服也惟得昔日夫婦之服且可以樂我心也貟助語也縞白也男子之服也綦蒼艾色女子之服也出其闉闍闉門之外曲城也闍門之上門臺也自其闉闍而出則有女如荼亦是言其多也吳語曰白裳白旗素甲白羽之矰望之如荼今此詩言荼亦是言其多也漢禮樂志曰顔如荼應劭曰荼野菅白華也言此竒麗白如荼也顔師古曰菅茅也言美顔色貌如茅荼之柔也今俗所謂蒹葭也觀此詩則知有女如荼亦是言其多也毛氏以謂荼英荼也言皆喪服也鄭氏謂荼茅秀物之輕者皆非也雖則如荼匪我思且亦是思存之意縞衣茹藘聊可與娛亦是上章之意茹藘染巾也言其服茹藘之女人也以見夫婦相弃欲思昔日夫婦之情又得配合也黃講同野有蔓草思遇時也君之澤不下流民窮於兵革男女失時思不期而㑹焉野有蔓草零露溥兮有美一人清揚婉兮邂逅相遇適我願兮野有蔓草零露瀼瀼有美一人婉如清揚邂逅相遇與子偕臧李曰此詩言人君之澤不下流及於民其國內之民皆困於征役久在兵間是以男女失時思不期而㑹也野有蔓草零露溥兮蔓延蔓也零落也溥兮言露溥溥然而多也瀼瀼盛也野冇蔓草零露溥兮毛鄭之說不同毛氏則以為興其意則以謂草之蔓者由露之滋潤王肅亦曰草之所以能延蔓者被盛露也民之所以能蕃息者蒙君澤也王氏之說亦如此此皆徒見序言君之澤不下流以為此說則上文曰野有蔓草零露溥兮下文曰有美一人清揚婉兮則其文勢不相貫以詩中之文而觀之恐詩人之意不如此也蘇氏則専以為澤不下流之詩蘇氏之意則據左𫝊子太叔賦野有蔓草之詩文子曰吾子之惠也遂以此篇皆是此意非男子不期而㑹之詩然古人賦詩斷章取義蓋取其臨時意之所寓若以左𫝊所舉者解詩則不通矣鄭氏則不以為興以謂蔓草而有露仲春月草始生霜為露也周禮仲春之月令㑹男女之無夫家者歐陽氏破之以謂假如是乃平時之常事兵亂之際何待仲春乃知毛鄭之說俱非據此詩乃是男女昏姻失時邂逅相遇於野草之間爾此說為長野有蔓草零露溥兮蓋言男女相遇於野草之間零露正多之時也有美一人清揚眉目之間婉然而美也邂逅相遇適我願兮言邂逅與之相遇則吾願足矣邂逅不期而㑹也婉如清揚亦是清揚婉兮之意但顛倒其文耳與子偕臧臧善也丈夫生而願為之有室女子生而願為之有家父母之心人皆有之則知男女之情蓋人之所欲也然不待父母之命媒妁之言鑽穴隙相窺踰牆相從則父母國人皆賤之乃知不期而㑹雖適我之願詩人所不取也黃講同溱洧刺亂也兵革不息男女相弃淫風大行莫之能救焉溱與洧方渙渙兮士與女方秉蕑古顔反兮女曰觀乎士曰既且且往觀乎洧之外洵訏况于反且樂維士與女伊其相謔贈之以勺時灼反藥溱與洧瀏音留其清矣士與女殷其盈矣女曰觀乎士曰既且音徂且往觀乎洧之外洵訏且樂維士與女伊其將謔贈之以勺藥李曰漢地理志鄭武并虢鄶之地右雒左泲食溱洧焉土狹而險山居谷汲男女亟聚㑹故其俗淫則知淫亂者鄭國之風俗然也然上之人苟能正其風化則移風易俗咸與維新何患其為淫亂其風化不正是以淫奔之俗日入於非禮乃其宜也溱與洧方渙渙兮者渙毛氏曰春水盛也說文曰渙流散也蓋是春冰解釋而流散也溱與洧方渙渙兮士與女方秉蕑兮言方春水渙渙之時而士與女方秉蕑草也鄭氏曰男女相弃各無匹偶感春氣並出託采芬香之草而為淫泆之行此說是也韓詩注亦曰鄭國之俗三月上已之辰往溱洧兩水之上招魂續魄秉蘭草以祓除不祥時人願與所說者俱往也女曰觀乎士曰既觀矣此未從女子之言也且往觀乎洧之外言女又勸士更往觀乎溱洧之外信寬大而且樂也洵信也訏大也惟士與女伊其將謔贈之以勺藥蓋結其情也毛氏曰勺藥香草也孔氏曰士愛此女贈送之以勺藥之香草勺藥既無香氣未審何如草韓詩曰離草也按崔豹古今注牛亨問於仲舒曰將别贈之以勺藥何也答曰勺藥一名可離故相别以贈之後世雜記以謂贈之以勺藥乃男宜女貽我握椒乃女宜男此說不必詳究李方叔師友談記深闢其非矣若必深求其理雖使深求而得之亦何益哉瀏深也殷其盈矣言女士之衆也伊其將謔將大也亦相將也論曰曽子曰春服既成冠者五六人童子六七人浴乎沂風乎舞雩詠而歸曽子以暮春而浴沂鄭俗以三月而往溱洧蓋風乎舞雩所以樂聖人之道而溱洧乃淫奔之行地與時同一則樂聖人之道一則為淫奔之行其相逺如此可不戒哉黃曰韓詩注曰鄭國之俗三月上已之辰往溱洧兩水之上招魂續魄秉蘭草以除不祥時人願與所說者俱往也鄭之風俗至此則國非其國矣此季札所以知其必亡也齊雞鳴詁訓𫝊第八國風雞鳴思賢妃也哀公荒淫怠慢故陳賢妃貞女夙夜警戒相成之道焉雞既鳴矣朝既盈矣匪雞則鳴蒼蠅之聲東方明矣朝既昌矣匪東方則明月出之光蟲飛薨薨甘與子同夢㑹且歸矣無庶豫子憎李曰齊哀公荒淫於女色故怠慢於政事此雖是哀公之罪亦由無賢妃以相警戒之故詩人陳古之賢妃貞女所以警戒其君者以刺當時之不然也雞既鳴矣朝既盈矣匪雞則鳴蒼蠅之聲蓋言雞既鳴矣朝廷之臣亦盈滿矣言可以夙興之時也然非是雞鳴乃是蒼蠅之聲也段氏曰蒼蠅聲雄壯青蠅聲和恬雞鳴之聲與蒼蠅大小不相類而乃聞蒼蠅之聲以為雞鳴者志之所在惟恐其失時也東方明矣朝既昌矣匪東方則明月出之光東方既明矣朝廷之臣又昌盛矣君子可以聽朝矣然非是東方之明乃月出之光則其志之不可忘可知也夫以月出之光而謂東方之明其與東方未明之詩何以異蓋二詩之意各有所主不可失之泥也毛鄭則以雞既鳴矣為夫人作朝既盈矣為人君作東方明矣為夫人朝君朝既昌矣為君能聽朝亦不必如此分别也蟲飛薨薨甘與子同夢㑹且歸矣無庶豫子憎者薨薨爾雅曰衆也日將旦百蟲作當此時豈不願與君同夢然羣臣㑹於朝亦欲退而歸也是以當夙興無以我之故而憎惡於君子也此皆警戒之意也周宣王夜卧晏起姜后乃脫簮珥待罪於巷內曰妾不才淫心見矣致君子失禮而晏起宣王曰寡人之罪夫人何辜遂勤於政事以成中興之功觀此則夙夜警戒賢妃貞女之所當然也孟子曰雞鳴而起孜孜為善者舜之徒也雞鳴而起孜孜為利者跖之徒也欲知舜與跖之分無他善與利之間爾夫雞鳴為善舜之所以為舜者不過是也然女人乃能以此勉其君惟恐失雞鳴之時有至聞蒼蠅之聲以為雞鳴婦人而能如此豈不可貴蓋心苟在焉則聞蒼蠅之聲以為雞心不在焉雖雷鼓在側而心不聞矣由此觀之則中才之主內無賢妃貞女外無忠臣良士而能恐懼修省者未之有也黃曰哀公政事不修本於衽席之失助故作是詩以思賢妃此一詩皆是夙夜警戒之意宣王晏起姜后待罪遂勤政事以致中興觀此則夙夜警戒乃賢妃貞女所當然也還刺荒也哀公好田獵從禽獸而無厭國人化之遂成風俗習於田獵謂之賢間於馳逐謂之好焉子之還兮遭我乎峱乃刀反之間兮並驅從兩肩兮揖我謂我儇許全反兮子之茂兮遭我乎峱之道兮並驅從兩牡兮揖我謂我好兮子之昌兮遭我乎峱之陽兮並驅從兩狼兮揖我謂我臧兮李曰子曰上有好者下必有甚焉者矣哀公好田獵而無厭則上所好者如此國人好之亦皆以田獵為務也其習於田獵者謂之賢其善於馳逐者謂之好蓋所謂賢者非君子之所謂賢所謂好者非君子之所謂好惟其從上之化故其好惡顛倒錯亂如此是風俗所以敗壞也子之還兮還毛氏以為便捷也韓詩作從女從旋為好貌其字雖不同只是一說峱山名也說文曰在齊地肩獸三嵗曰肩說文曰三嵗豚肩相及其字亦作獻豜于公之豜同儇說文曰利也方言曰慧也鄭氏曰捷也亦如荀子曰鄉曲之儇子茂美也子之昌兮昌盛豐美也如丰之詩曰子之昌兮猗嗟之詩曰猗嗟昌兮皆言其盛也陽山南曰陽子之還兮遭我乎峱之間兮並驅從兩肩兮揖我謂我儇兮蓋言子之便捷與我相遇於峱山之間既相遇矣於是又並驅而逐兩肩揖我而謂我儇利也蓋言以田獵為美事如此下二章皆此意王氏謂峱之間禽獸所在峱之道則人所往來禽獸宜少以峱之陽則出於峱間逺矣禽獸宜甚少也其說皆鑿論曰自古國之所以亡風俗之所以敗者皆由是也太康以逸豫滅厥德乃盤遊無度十旬弗反因以失邦在帝夷羿冒于原獸忘其國恤而思其麀牡用不恢於夏家曹伯陽好田獵其野人公孫强亦好田弋獲白鴈而獻之且言田弋之說伯陽大悅因廢政事其後曹伯陽亦以失國此三者皆以田獵而失國也方其好田獵也其意以謂田獵不足以亡國而乃欲田弋以為樂使其知田獵之可亡國則必不為之矣孟子曰從流下而忘反謂之流從流上而忘反謂之連從獸無厭謂之荒樂酒無厭謂之亡夫田獵之事自有識者觀之則以為荒自無識者觀之則以為賢夫賢與荒相去甚逺一惑於志是非紛亂如此故王吉曰大王不好書術而樂逸遊馮軾撙銜馳騁不止口倦乎叱咤手苦於箠轡身勞乎車輿朝則冒霧露晝則被塵埃夏則為大暑之所暴炙冬則為風雪之所偃薄非所以全夀命之宗也觀王吉之言則知田獵非美事也明矣然時君世主甘心於此者豈不謬用其心哉唐髙宗常田獵涇陽大獲詫左右曰今日田樂乎蘇世長曰陛下廢萬機事田獵不滿十旬未為樂也觀此諸說則知田獵非所以為賢也亦非所以為好也今之齊哀公好田獵自以為賢自以為好其國人從上所化亦皆以為賢亦皆以為好國之不亡也幸矣黃曰孟子曰從流下而忘反謂之流從流上而忘反謂之連從獸無厭謂之荒樂酒無厭謂之亡今哀公從禽獸而無厭則孟子之所謂荒者也上有所好下必有甚焉國人安得不化之哉田獵不足為賢而謂之賢驅馳非可為好而謂之好此猶鄭之國人以太叔之善射善御而謂之洵美且武也曹伯陽好田獵其野人公孫强亦好田弋獲白鴈而獻之且言田弋之說伯陽大悅因廢政事而卒以亡國蓋不軌不物謂之亂政政既亂矣其能久乎著刺時也時不親迎也俟我於著乎而充耳以素乎而尚之以瓊華乎而俟我於庭乎而充耳以青乎而尚之以瓊瑩乎而俟我於堂乎而充耳以黃乎而尚之以瓊英乎而李曰蓋是時親迎之禮廢故詩人陳古人親迎之禮以刺之俟我於著乎而著門屏間也漢地理志舉此句顔師古曰著地名也濟南郡有著縣亦不必如此說下章言俟我於庭乎而俟我於堂乎而皆非地名則上章亦不得謂之地名也當作門屏間說俟我於著乎而蓋謂男子親迎俟女子於門屏間我蓋指女子也丰之詩曰子之昌兮俟我乎堂兮皆是言其親迎也充耳以素乎而尚之以瓊華乎而蓋言男子親迎既俟女於門屏間又揖我於庭揖我於堂導之而出女子見其衣冠之飾充耳以素為懸瑱而飾之以瓊尚飾也魯女敬姜云王后親織𤣥紞懸瑱之物以五色為之𤣥者色之尊也據此詩言素青黃者即此所謂紞也瓊英者瓊華瓊瑩之類也毛氏以為首章言士親迎二章言卿大夫親迎三章言人君親迎詩中本無此意故鄭氏王氏皆不從其說鄭氏謂三章具述人臣親迎之禮王氏又謂仁以親之義以帥之信以成之夫道也以充耳之素配義以充耳之青配仁以充耳之黃配信此皆强生分别異於毛氏者無幾皆所不取也論曰周易咸卦兊上艮下彖曰止而悅取女吉也恆卦震上巽下彖曰雷風相與蓋長久之象也是以禮有親迎御輪三周所以下女也道先乘車婦車從之所以反尊卑之正也凡此皆是聖人禮法之所存不可亂也禮惟天子不親迎蓋以天子之尊無二上故其逆后以三公逆之春秋書王使劉夏逆王后于齊非譏其不親迎也譏其不使三公而使士往也自諸侯以下皆有親迎之禮春秋書公如齊逆女非譏其親迎也譏其取讎女也其餘諸侯使人逆女皆書之蓋不如是無以正夫婦之始也始輕之則其終也必不正矣故詩人刺之曰時不親迎也然當是之時親迎之禮廢詩人猶以為刺是猶知有親迎也降及叔世不知親迎為何如其禮之廢不知幾年矣而恬不之怪則知後世之不如古也宜矣黃曰昏姻之道闕而親迎之禮不行故詩人陳古義以刺今也俟我於著乎而漢地理志舉此句顔師古曰著地名也濟南郡有著縣然下文曰庭曰堂則著當如先儒曰門屏之間也充耳謂瑱以瓊玉為之以素青黃三色之絲為紞以垂之尚飾也親迎之服如此今不復見矣東方之日刺衰也君臣失道男女淫奔不能以禮化也東方之日兮彼姝赤朱反者子在我室兮在我室兮履我即兮東方之月兮彼姝者子在我闥兮在我闥兮履我發兮李曰君臣得其道則淫奔之俗止如文王之化故野有死麕之詩猶惡無禮其次如衛文公能以道化其民故蝃蝀之詩國人皆不齒其淫奔之俗今也齊之君臣既失其道此淫奔之風所以靡然而莫之遏止也東方之日兮彼姝者子在我室兮東方之日毛鄭皆以喻君毛氏謂日出東方人君明盛鄭氏以謂日在東方其明未融喻君不明東方之月毛鄭皆以喻臣毛氏謂月盛於東方鄭氏謂月在東方亦言不明如鄭氏之說固非矣毛氏之說雖無害然未盡詩人之意惟程氏之說最為分明條暢日月明照則物無隱蔽姦慝莫容如朝廷明於上也今君不明故有淫奔之俗詩人以東方之日刺其當明而昏也東方之日蓋言日出當明而彼姝美之人在我室所以在我室者履我即而來也即就也謂行迹履我迹而來奔也東方之月者言月出亦當明照而彼姝美之人在我門內所以在我門內者履我發而來也發行履步行步而來奔也此皆言其淫奔之狀歐陽氏既不取毛鄭之說而又以日月喻顔色之美也亦不必如此分别履毛氏以為有禮也在我室兮者鄭氏以禮而來我則就之與之去也皆非詩人之意黃曰文王正信之教興則人知淫奔之可惡衛文公以道化民則人知淫奔之可恥今也齊之君臣既失其道則淫奔之風其能禁乎故曰上失其道民散久矣觀桑中之詩則知衛之所以亡觀東方之詩則知齊之所以亡東方未明刺無節也朝廷興居無節號令不時挈壺氏不能掌其職焉東方未明顛倒衣裳顛之倒之自公召之東方未晞顛倒裳衣倒之顛之自公令之折柳樊圃狂夫瞿瞿俱具反不能辰夜不夙則莫李曰興起也朝廷之起居或失之早或失之晚皆無節度人君之號令不以其時所以至於此者挈壺氏不能掌其職故也挈壺漏刻也壺盛水器也謂置箭壺內刻以為節而浮之水上令水漏而刻下以記晝夜昏明之度數也東方未明顛倒衣裳顛之倒之自公召之東方未晞顛倒裳衣倒之顛之自公令之東方未明羣臣促遽顛倒衣裳而著之所以顛倒其衣裳者以其君所來而召之也東方未明未是入朝之時羣臣入朝辨色始入今未當入朝之時則可徐徐也而乃顛倒遑遽如此失之太早可知晞毛氏曰明之始升也令亦召也折柳樊圃狂夫瞿瞿者柳柔脆之木也樊藩也樹菜𬞞曰圃瞿瞿毛氏曰顧禮義則瞿瞿毛氏為有兩句以禮記考之則毛氏所說蟋蟀之詩近之矣此狂夫瞿瞿毛氏則以為無守貌蓋謂折柳不足以為藩亦猶狂夫為挈壺無守而不任職則是以兩句分而為之兩說王氏則謂折柳樊圃則其於限禁也不足賴矣狂夫瞿瞿則其於守視也不足任矣王氏之說亦與毛氏之說相似蘇氏曰為藩以禦狂夫豈不知柳之不可用哉無其備而不得已也此無節之過也此雖以兩句而合為一說不如程氏之說曰折柳以藩圃狂夫瞿瞿然而驚晝夜之限非不明也乃不能知而不早則晏言無節如此此說盡之矣不能辰夜不夙則莫言不能時節其夜之早晚不失之早則失之晚也夫觀人之政者一見其失則逆料其餘也以東方未明之時觀之其無節如此其餘可知也夫迷者不辨東西聾者不知聲音君臣上下不知興居之節則其在朝者皆如迷聾而不知如在夢寐之中失之早晚而朝廷不知以見紂之將亡也不能辰夜而失之早晚有以見齊之無政也若宣王庭燎之詩首章則言夜如何其夜未央卒章則言夜如何其夜向晨則入朝之時也其夜未央則太早矣亦與東方未明之詩同類豫曰不然也蓋宣王之時勤於政事故夜未央而設庭燎皆其勤之過也此詩則知失之太早非其勤也乃無意於為政或早起或晏興其錯亂若此是與庭燎異矣黃曰若挈壺氏不能掌其職則當刺挈壺氏不當刺朝廷若朝廷興居無節則當刺朝廷不當刺挈壺氏今詩人兩責之者蓋詩人微其意以責其臣而作序者原其本以責君也或曰夜未央而設庭燎詩人之針針其失也其亦與此詩同意乎曰宣王以勤而過此詩以慢而過其興居無節號令不時此非勤之罪而慢之罪也南山刺襄公也鳥獸之行淫乎其妹大夫遇是惡作詩而去之南山崔崔子雖反雄狐綏綏魯道有蕩齊子由歸既曰歸止曷又懷止葛屨五兩冠緌雙止魯道有蕩齊子庸止既曰庸止曷又從止藝麻如之何衡音橫從足容反其畝取妻如之何必告父母既曰告止曷又鞠止析薪如之何匪斧不克取妻如之何匪媒不得既曰得止曷又極止李曰南山崔崔雄狐綏綏魯道有蕩齊子由歸崔崔髙大也綏綏匹行也所謂有狐綏綏者是也南山崔崔雄狐綏綏言人君尊嚴當如南山而仰之髙大乃如雄狐之匹行也孔氏曰雄當配雌理當然也今雌雄無别失隂陽之匹以喻夫當配妻今襄公兄與妹淫亦失陰陽之匹此非也雄狐亦如雄雉于飛言鳥獸之雄也惟雌之匹而無别也魯道有蕩齊子由歸蕩平易也齊子魯桓公夫人文姜也婦人謂嫁曰歸懷思也蓋言魯道平易齊女既由此道而歸於魯何乃又思襄公而為淫汚之行乎葛屨五兩喻文姜與姪娣及傅姆同處冠緌喻襄公也五人為竒而襄公往從而雙之歐陽公曰詩人之意必不如此王氏曰言匹之尤不當也今且從王氏之說魯道有蕩齊子庸止者言文姜既用此道以嫁於魯何又從襄公以為淫汚之行乎庸用也用此道以嫁於魯也藝麻如之何衡從其畝衡古橫字也藝樹也樹麻者必東西踐躡其畝亦猶娶妻必告父母以娶於齊也曷為使窮極其姦以至是哉鞠窮也析薪如之何匪斧不克者析薪者必用斧亦猶娶妻必用媒既而得之矣其禮如是之重曷為使極其姦以至於是哉極至也後兩章蓋譏齊襄公魯桓公齊襄失為兄之道魯桓失為夫之道皆所當譏也黃講同甫田大夫刺襄公也無禮義而求大功不修德而求諸侯志大心勞所以求者非其道也無田甫田維莠音有驕驕無思逺人勞心忉忉無田甫田維莠桀桀無思逺人勞心怛怛旦末反婉兮孌兮總角丱古患字兮未幾見兮突而辨兮李曰此詩言齊襄公有求諸侯求大功之意不先修德而無禮義是猶不耕而求穫無是理也夫不耕而穫雖心有所求望者切徒勞其志耳故曰志大心勞所以求者非其道也甫田大田也無田甫田者言無得田此大田也田此大田而力不及則其莠驕驕然無思逺人者言無得思逺人也思逺人而德不及是徒勞耳驕驕徐氏曰柔且茂也桀桀徐曰强立也忉忉怛怛皆是心之勞也婉兮孌兮總角丱兮上二章既言所以求之者非其道此章又言所以得之之道也婉兮孌兮少好貌總角聚兩髦也亦猶所謂總角之晏也丱童稚也突方言曰凡卒相見謂之突是忽然之意也辨周禮掌冠冕者也其職謂之辨師則辨者冠之大號也此章言總角之童而至於突然而辨者豈其求之哉理之自然也亦猶修其德而諸侯至豈待求之哉不待求而自至也蘇氏曰人之於物聽其自附而任其自去則人重而物輕物之附人也堅物之所以去人分裂四出而不可禁者物重而人輕也古之聖人其取天下非其驅而來之也其守天下非其劫而留之也使天下自至夫是以去就之權在君而不在民是謂人重而物輕夫湯之興也諸侯歸者三千武王之興也諸侯歸者八百豈湯武驅而使歸哉亦曰積行纍功其有自矣故不求而自至也如齊之桓公晉之文公其行事雖不及於湯武逺甚然能假仁義而行至於召陵之盟城濮之戰亦能㑹諸侯以成伯功若夫宋襄公且異於是矣其假仁義則不及於威公而又執滕子嬰齊圍曹伐鄭其虐如此雖不鼓不成列天下其誰與之宋襄公者可謂志大心勞不修德而求諸侯矣況為齊襄公者何人哉鳥獸之行淫乎其妹其惡不容於天地之間又且志大心勞雖欲驅諸侯而從之諸侯誰肯從之哉黃曰詳味此詩如孟子告齊王之意齊王言將以求吾所大欲而孟子曰王之所大欲可知矣欲闢土地朝秦楚蒞中國撫四夷也以若所為求若所欲猶緣木而求魚也王曰若是其甚歟曰殆有甚焉緣木求魚雖不得魚無後災也以若所為求若所欲盡心力而為之後必有災至於終而又告以發政施仁孰能禦之之說夫齊王之欲求所大欲即齊襄公之無禮義而求大功不修德而求諸侯之意也末一章即孟子發政施仁之說以是求之則詩人之意明矣盧令刺荒也襄公好田獵畢弋而不修民事百姓苦之故陳古以風焉盧令令其人美且仁盧重環其人美且鬈音權盧重鋂音梅其人美且偲七才反李曰刺荒者以襄公好田獵也孟子曰從獸無厭謂之荒是也爾雅曰噣謂之畢郭璞曰掩兔之畢或呼為噣因星形以名之月令注云網小而柄長謂之畢以其形似畢星也弋繳射也此詩蓋言襄公好田獵而民事廢百姓憂苦之故陳古者田獵百姓樂之以風刺其時也盧令令其人美且仁盧田犬也戰國䇿曰韓國盧天下之駿犬也令令毛氏曰纓環聲其字或從金從令說文作從金從令揵也按下文言重環重鋂則此章令令當從毛氏作纓環聲重環子母環也謂大環貫一小環也鬈毛氏以為好貌爾雅曰鬈好也毛氏以為好則近之矣鄭氏以鬈當作權衡之權蓋鄭氏喜於改字不敢信也鋂一環貫二環也謂一大環貫二小環也偲說文曰强力也上章言美且仁美且鬈下章言偲為强力其文不相稱當從毛氏以為多才此詩三章皆言古者之君田獵以時故百姓聞其田犬令令之聲相與稱其人美且好而且仁美好而且鬈美好而且偲也還之詩曰揖我謂我儇兮揖我謂我好兮揖我謂我臧兮是自以為好也有識者觀之以為荒而乃自以為好何足取哉惟此百姓樂之以其施愛之及民也深矣夫田獵之事而百姓皆樂之是必有所自孟子曰今王田獵於此百姓聞王車馬之音見羽旄之美舉疾首蹙頞而相告曰吾王之好田獵夫何使我至於此極也父子不相見兄弟妻子離散此無他不與民同樂也今王田獵於此百姓聞王車馬之音見羽旄之美舉欣欣然有喜色而相告曰吾王庶幾無疾病與何以能田獵也此無他與民同樂也夫聞車馬之音舉欣欣然有喜色則是聞令令之聲而稱美之也如騶虞詩曰搜田以時車攻詩曰因田獵而選車徒以田獵之事而民樂之必稱美以為詩則知當時之民稱美之亦必如此詩之所謂也昔漢武帝好為微行馳射鹿豕狐兔熊羆馳騖禾稼稻粱之地民皆號呼罵詈夫民之號呼罵詈如此則知其聞車馬之音而舉疾首蹙頞者必矣然則古之人君田獵皆同於民之憂樂後之為君可不慎哉黃曰古之人君與民同其憂而後與民同其樂田獵之是好而民事之不修豈與民同憂樂之意故盧令一詩言古之人君田獵而民樂之之意夫田獵之美而民樂之者與民同其樂也七月之詩言獻豜于公而斯民有愛上之心車攻之詩言四牡龐龐而斯民有欣欣然之辭蓋后稷先公在於稼穡宣王在修政事豈若襄公之畢弋而不修民事者哉噫田獵一耳不與民同樂則蹙頞而相告與民同樂則欣欣有喜色詩人所以風襄公者亦孟子告齊宣之意歟戰國䇿曰盧駿犬也敝笱古口反刺文姜也齊人惡魯桓公微弱不能防間文姜使至淫亂為二國患焉敝笱在梁其魚魴音房鰥齊子歸止其從如雲敝笱在梁其魚魴鱮昔吕反齊子歸止其從如雨敝笱在梁其魚唯唯齊子歸止其從如水李曰蓋言桓公之孱弱不能制其文姜使至淫亂在魯則其君為齊所殺在齊則襄公播其惡於民而卒亦不免此其為二國患也笱捕魚器也鰥毛氏以為大魚鄭氏以為小魚以為大魚者蓋據孔叢子云衛人釣於河得鰥魚焉其大盈車則是鰥魚大魚也歐陽氏曰毛氏以為大魚不無所據鄭氏以為小魚其得失不較可知敝笱在梁其魚魴鰥者蓋言敝敗之笱在於魚梁而魚乃是大魚非敝笱之所能制敝笱則譬桓公之微弱魴鰥則譬文姜之勢盛敝笱之不制魴鰥亦猶桓公之不能制文姜也魴鱮毛氏以為大魚鄭氏以為弱鱗陸璣注云鱮似魴厚而頭大魚之不美者故里語曰網魚得鱮不如啖茹其頭尤大而肥者徐州人謂之鰱或謂之鱅幽州人梟或謂之胡鱅惟其肥而至大則知為大魚也唯唯出入不制也如雲毛氏曰盛也其說得之矣齊子歸止其從如雲蓋言齊子之嫁於魯從之盛者如此恣行而無忌憚也如雨毛氏以為多也如水毛氏以為衆也如雲如雨如水皆一意也鄭氏以如雲為如雲之行順風耳如雨言無常天下之則下天不下則止如水為水之性可停可行其說不如毛氏簡而當也言魯桓公之從文姜如雲之從風如雨之從天如水之就下王氏則以泛字為從字皆不足取陸農師則曰其從如雲無定從風而已雲合而為雨故以雨繼之雨降而成水故以水繼之皆是屋上架屋也論曰在易之恆卦六五曰恆其德貞婦人吉夫子凶象曰婦人貞吉從一而終也夫子制義從婦凶也夫君之為國也威令所施當及於一國乃近不行於室家惟婦人是從豈不凶哉春秋書公與夫人姜氏遂如齊夫春秋未嘗書與書與而不書及者以見文姜之與公伉也使其書及則是桓公及之以行文姜適從之爾知春秋書與之意則知敝笱之刺文姜也黃講同載驅齊人刺襄公也無禮義故盛其車服疾驅於通道大都與文姜淫播其惡於萬民焉載驅薄薄簟茀朱鞹苦郭反魯道有蕩齊子發夕四驪濟濟上聲垂轡濔濔乃禮反魯道有蕩齊子豈開改反弟汶水湯湯失章反行人彭彭必旁反魯道有蕩齊子翺翔汶水滔滔行人儦儦表驕反魯道有蕩齊子遊敖李曰通道大都蓋十目所視十手所指之地而襄公於此為淫亂之行則其無恥甚矣載驅薄薄疾驅之聲也簟茀朱鞹毛氏曰簟方文席也茀車之蔽曰茀諸侯之路車有朱鞹之質而羽飾孔氏曰用竹為席其文必方茀車之後席名也此詩曰簟茀朱鞹則明其以簟為蔽亦通為席也蓋言齊襄公疾驅其車於通道大都有簟以為茀蔽又有朱色之革為車之飾言盛其衣服如此而來與文姜㑹也魯道有蕩齊子發夕蕩平也言魯國之道平蕩而齊子發夕者從夕發而至旦也四驪濟濟垂轡濔濔驪馬黑色或曰鐵也四驪濟濟然而美也垂轡濔濔然而衆也是皆盛其車服也魯道有蕩齊子豈弟毛氏曰豈弟樂易也歐陽曰安然樂易而無慚愧之色也汶水湯湯行人彭彭彭彭多也言行人之多如此以見其無恥也翺翔猶倣徉翺翔遊敖皆是安行無禮而無恥也淹淹說文曰水漫而流貌瀌瀌衆貌汶水出萊蕪縣西南至東平夀張入濟論曰春秋莊公二年書夫人姜氏㑹齊侯于禚四年書夫人享齊侯于祝丘曰㑹曰享雖其為姦猶有㑹享之名至於五年書夫人姜氏如齊師以師旅所在而夫人往淫之是為無恥之甚也詩言行人儦儦疾驅於通道大都則與春秋如齊師同也楊國忠與虢國夫人通頗為人知不恥每入謁並驅道中從監侍姆百有餘騎炬密如晝夫楊國忠於虢國夫人亦猶齊襄之於文姜也並馳道中即所謂通道大都也夫為惡於隱微之中猶有避諱之心然至於通道大都則其無恥甚矣為人而至於如此則不可救藥然則為善者當謹於微可也黃講同猗於宜反嗟刺魯莊公也齊人傷魯莊公有威儀技藝然而不能以禮防間其母失子之道人以為齊侯之子焉猗嗟昌兮頎音祈而長兮抑若揚兮美目揚兮巧趨蹌兮射則臧兮猗嗟名兮美目清兮儀既成兮終日射食亦反侯不出正兮展我甥兮猗嗟孌兮清揚婉兮舞則選兮射則貫兮四矢反兮以禦亂兮李曰禮記曰婦人從夫者也夫死從子桓公既卒莊公當以禮防間其母今也不然徒有威儀技藝若詩所謂美目揚兮美目清兮清揚婉兮所謂威儀也射則臧兮射則貫兮所謂技藝也徒有威儀技藝而不能防間其母失人子之道是其大節既失則區區於小技何足道哉此詩所以刺之也考之春秋桓公十八年書公與夫人姜氏如齊雖以譏文姜之淫亦以桓公失為夫之道也莊公二年書夫人姜氏㑹齊侯于禚四年書夫人姜氏享齊侯于祝丘五年書夫人姜氏如齊師七年春夫人姜氏㑹齊侯于防冬夫人姜氏㑹齊侯于陽榖雖以譏文姜之淫亦皆以譏莊公失為子之道也人以謂齊侯之子者若所謂徴舒似女亦似公之說也猗嗟昌兮猗嗟歎辭也若所謂猗嗟即與猗與漆沮之類皆是歎辭也昌盛也所謂子之昌兮頎長貌也所謂碩人其頎是也抑若揚兮毛氏曰抑美色揚廣揚也孔曰揚是顙之别名言其顙之美也美目揚兮言其好目揚眉也凡此皆是面貌之美也巧趨蹌兮言其巧為步趨而蹌蹌然又曲禮云蹌蹌者巧趨之貌也射則臧兮臧善也猗嗟名兮美目清兮目上為名目下為清言其目上之名目下之清皆美也儀既成兮成備也言其威儀之全終日射侯不出正兮言終日射侯不出於正之內正侯中所射處也周官射人氏曰諸侯三正注云正之言正也射者內志正外體直則能至畫五正之侯中朱次白次蒼次黃𤣥居外三正者損𤣥黃二正者去白蒼而畫以朱緑其外之廣皆居侯中三分之一也展誠也誠是我之甥也姊妹之子曰甥鄭氏曰誠我齊之甥言誠者拒時人言齊侯之子猗嗟孌兮孌壯好貌清揚婉兮言其清揚眉目之間婉然而美也舞則選兮選者謂於倫等最上也貫毛氏以為中鄭氏以為習當從毛氏之說大射禮曰不貫不釋言不中鵠則不憚選也四矢反兮反復也每射四矢皆得其故處也以言其善射也所貴乎射者所以禦亂也今也文姜之淫莊公不能制徒知射之能禦亂而不知所以禦亂此詩與大叔于田詩相類猗嗟則惟言其威儀之美技藝之習大叔于田則惟言其射御之精若大叔于田之詩以將叔無狃戒其傷女二句是可以見其不義得衆此詩則言展我甥兮以禦亂兮可以見其失人子之道學詩者於此反覆求詩之意則可以言詩矣夫射者固所當習然而非所貴也大宰問於子貢曰夫子聖者歟何其多能也子貢曰固天縱之將聖又多能也子聞之曰大宰知我乎吾少也賤故多能鄙事君子多乎哉不多也牢曰子云吾不試故藝夫使聖人而為多能不害其為聖常人有多能而無其本則不過為鄙事爾子曰志於道據於德依於仁本也遊於藝末也君子以道德仁為本以藝則遊之而已後世乃専心於此而忘其本非孔子之意故莊公有威儀技藝而不免猗嗟之刺昭公習儀以亟而不能止乾侯之禍漢成善修容儀升車正立不內顧不疾言不親指不能制趙氏之橫雖多材多藝而不能務本何所補哉黃曰趙氏春秋曰或曰子何以制母乎曰夫死從子況國君乎君者人神之主也風教之本也不能正家如正國何若莊公者哀痛以思其父誠敬以事其母夫人能徒往乎夫人之往也則君之威命不行而誠敬不至耳噫凱風之孝子能安其母欲嫁之心而莊公不能防間其母如齊之惡詩人之刺也固宜毛詩集解卷十一
