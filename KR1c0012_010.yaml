body:
  text: 毛詩集解卷十宋李樗黃櫄撰清人刺文公也髙克好利而不顧其君文公惡而欲逺之不能使髙克將兵而禦狄于竟陳其師旅翶翔河上久而不召衆散而歸髙克奔陳公子素惡髙克進之不以禮文公退之不以道危國亡師之本故作是詩也清人在彭駟介旁旁二矛重英河上乎翺翔清人在消駟介麃麃表驕反二矛重喬河上乎逍遙清人在軸駟介陶陶左旋右抽中軍作好李曰此詩言鄭文公之時有髙克注心好利而不顧其君也王氏曰未有義而後其君者也髙克既好利不顧其君文公惡而欲逺之又不能也於是使將兵而禦狄于竟翶翔河上久而不召惟以此為去髙克之上策故公子素惡髙克事其君不以禮而文公去其臣不以道所以致師散而將奔是乃危國亡師之本故作是詩也清人在彭在消在軸皆鄭地也清鄭之邑也彭消軸鄭郊也清人言當時髙克將兵皆清邑之人彭消軸皆所次之地孔氏曰久不得歸又遷移三地亦應不甚相逺駟四馬也介甲也言使駟馬而皆被甲也左氏曰不介馬而馳則馬亦被甲也旁旁孔氏以為不得已據二章言麃麃乃是武貌三章言陶陶乃是馳驅貌不應於此乃謂不得已也陸德明曰旁旁強也當從此説二矛者酋矛夷矛也故謂之二矛重英英飾也言二矛之末有畫飾也喬髙也二矛五兵之最髙也二矛重髙故謂之重喬此皆是甲兵之盛而文公委而棄之乃使翶翔於河上至於衆散而後已左旋右抽中軍作好王氏曰左旋者軍之左旋而歸也右抽者軍之右抽而退中軍作好者中軍髙克所自將也蓋其散最後以髙克所自將故也後散者豈誠好於髙克而留哉亦作好而已楊龜山以為不然左旋右抽當從舊説左謂御者在左右謂戎者在右中謂將軍居中也左旋謂回旋其車右抽謂抽刃以習擊刺髙克自居軍中之容好貌抽説文作搯字雖不同其實則一清人之詩刺文公不以髙克為有罪叔于田刺莊公不以叔段為有罪觀春秋書鄭棄其師則文公之罪可見矣夫賞慶刑威人主之柄也髙克有罪則當戮之於市朝如其罪小則竄逐之可也何乃委而棄之至於不召乎鄭文公之棄髙克是乃棄其師也後漢耿恭為胸奴所圍公卿以為不宜救鮑昱議曰今使人於危難之地急而棄之外則縱蠻夷之暴內則傷死難之臣胸奴如復犯塞為寇陛下何以取將今鄭文公於髙克久而不召至於衆散如其後有狄難則文公何以使兵乎其不亡者幸矣黃曰前輩謂叔田刺莊公不以叔段為有罪清人刺文公不以髙克為有罪蓋君之於臣國人以為可用則用之國人以為可殺則殺之豈容有曖昧不決之事哉若髙克好利而不顧其君則誅之可也逐之可也今乃使之將兵而禦狄翶翔而不召是委其國而棄其師也閔公二年書狄人入衛鄭棄其師聖人固明以責文公矣此詩人亦所以不刺髙克而刺文公清鄭之邑也彭消軸鄭河上之地也衛在河北鄭在河南狄人入衛壓鄭境也於是有河上之戍而髙克實將之夫髙克平時既不可用而緩急猶可使乎用之則不絶絶之則不用文公當有以處此也羔裘刺朝也言古之君子以風其朝焉羔裘如濡洵直且侯彼其之子舍命不渝羔裘豹飾孔武有力彼其之子邦之司直羔裘晏兮三英粲兮彼其之子邦之彥兮李曰此詩言古之君子其在朝廷則有稱其服以刺今之不然也羔裘如濡者言古之君子其服羔皮以為裘其色光潤若濡濕然此詩亦與後羔裘詩羔裘如膏同洵信也侯毛氏曰君也鄭氏曰君者正其衣冠尊其瞻視儼然人望而畏之毛鄭之意則以人臣而有人君之德也以人臣而有人君之德其説為難通歐陽曰言羔裘潤澤可以為君朝服按經但謂且侯不應以此為君朝服如此則所謂直者又如何説王氏曰羣而不黨則宜直致恭而有禮則宜侯侯以順王命為善故也君能直已以順王命則其臣化之舍命不渝矣王氏之説固亦為鑿然又以洵直且侯為君舍命不渝為臣其説難通王氏於此詩皆分作君臣事孔武有力則以為君邦之司直則以為臣三英粲兮則以為君邦之彥兮則以為臣皆是強生分别也蘇氏曰其裘則光潤其人則洵直且侯其民稱之曰彼其之子舍命不渝則是全以此詩為人君也果是人君則詩人美之不應以洵美且侯為言也韓詩曰侯美也今且從韓詩以侯為美也洵直且侯言其服此光潤之裘信其正直而且美也故其民稱之曰是子也能舍人君之命而不渝也舍處也渝變也處君命而不變信其能見危授命也夫守君命而不變則如荀息之不食言解揚之授命有死無隕是皆能舍命不渝故也可以託六尺之孤可以寄百里之命臨大節而不可奪君子人歟君子人也蓋非君子則不能守君命而不變故必君子之人然後可以稱其服也羔裘豹飾者言以豹皮為飾也孔武有力者言其人之甚武而有力也亦猶簡兮所謂有力如虎不必如賁育然後為有力彼其之子邦之司直言其民稱之日是子也一國之人言以為直也如汲黯之徒是也羔裘晏兮毛氏曰晏鮮盛也三英粲兮此最難考毛氏曰三德也鄭氏以為剛克柔克正直此蓋牽合於三之數而為此説也歐氏曰六經所載三數甚多苟可曲以附麗則何説不可據然歐陽之説又曰三英粲兮當是述羔裘之美此説亦不然據次章言羔裘豹飾孔武有力尚可以為豹取其孔武有力上章言洵美且侯安得以謂述羔裘之美乎程氏曰粲光明貌三英若五紽類自是衣服禮儀制度非三德也程氏只是臆度如此畢竟不知為何物當闕之以俟知者鄭謂英者裘衽出縫線之飾衽則後有三故曰三英彥者美士也且人君之命其臣使之衣其衣服豈徒為是觀美哉蓋必有其德而稱其服也如其徒為觀美則無異於土木偶人而被以冕辨衣以文繡其有補於國家者幾希古者冠圎冠者則知其天時履方屨者則知其地形佩環玦者取其事至而能斷服是服者非可以無其德也且以深衣觀之制有十二幅以應十有二月袂圎以應規曲夾如矩以應方負繩及踝以應直下齊如權衡以應平以深衣觀之乃知古者制衣服必有象也是以舍命不渝方可以稱其羔裘如濡孔武有力方可以稱其羔裘豹飾邦之司直方可以稱其羔裘之晏今乃不然此詩所以刺之也朝野僉載曰唐之朱紫滿朝皆無德時人以為麒麟楥蓋言脫去衣服飾其中枵然無有故知人臣之服飾不可不稱也黃曰召南之在位者化文王之政而能節儉正直故詩人作羔羊以美之曰羔羊之皮素絲五紽美其能稱是服也鄭莊公時朝無賢人而徒盛其衣服故詩人言古之君子有其服必有其德以風其朝而愧其在位耳遵大路思君子也莊公失道君子去之國人思望焉遵大路兮摻所覽反執子之袪兮無我惡兮不寁市坎反故也遵大路兮摻執子之手兮無我魗兮不寁好也李曰遵循也路道也袪袂也此詩言君子之去國人欲於道路之中執其袂而留之也摻執子之手亦是言執其手當留之也王氏謂是大路言君子循道以去其君此本無是義理王氏強生義理於其間也無我惡兮不寁故也寁者速也言君子無惡我也我之故惟願子之不速去也無我魗兮不寁好也言君子不醜我也鄭氏曰魗亦惡也我所愛惟願子之不速去也故曰不寁好也鄭氏曰不寁故也言我乃以莊公不速於先君之道故也王氏則謂國人留君子之言故舊無大故則不棄也好之宜忘其醜此於文勢皆不相貫難信其説詳觀此詩乃是國人見君子之去則欲留之也序乃謂國人思望疑非詩意毛鄭則謂思望君子於道中此説亦非也以國人之留君子如此而莊公乃任其去而不留之以此知古之君子以民之心為心故其用人皆合民心後世不以民之心為心故其民之所留而去者人君乃不之恤可勝歎哉黃曰此詩是君子去國而國人欲留之之意執其袪執其手而惟恐去之之速也古者人君之用人皆必察於國人之好惡而今國人皆欲留之而莊公不能用而失國人之望矣噫用人以望徇衆嚮也國人思望而莊公棄之吾見莊公非特棄賢而亦失國人之心也女曰雞鳴刺不説德也陳古義以刺今不説德而好色也女曰雞鳴士曰昧旦子興視夜明星有爛將翶將翔弋鳧與鴈弋言加之與子宜之宜言飲酒與子偕老琴瑟在御莫不靜好知子之來之雜佩以贈之知子之順之雜佩以問之知子之好之雜佩以報之李曰此詩言古之賢大夫於其妻不恱其色而賢婦之於其夫又不以色取愛皆相勉勵以恱有德而刺當時之不然也女曰雞鳴至明星有爛此蓋夫婦相告語之辭女既曰難鳴士又曰昧旦於是皆興而起其興起而視之也則視夜之如何見明星之爛以見其夙興也旦未明曰昧旦將翶將翔弋鳧與鴈弋言加之與子宜之宜言飲酒與子偕老琴瑟在御莫不靜好毛氏謂間於政事則翶翔習射此説非也將翺將翔弋鳧與鴈此蓋是婦人勉其夫往取鳧鴈而歸以為食是也加者加豆之實也宜者言所以弋鳧鴈將以為加豆之實而與子共肴也宜言飲酒與子偕老鄭氏謂宜乎我燕樂賔客而飲酒與之俱至老親愛之言也歐陽氏以為不然賔客一時相接豈有偕老之理是殊不近人情以此求詩何由得詩之義與子者皆婦人謂其夫也琴瑟在御莫不靜好言御其琴瑟莫不安好之是夫婦相愛之意也知子之來之此章言不獨厚於室家又當尊賢也知子之來之我則雜佩以贈之雜佩珩璜琚瑀衝牙之類知子之和順也我則雜佩以問之問遺也禮記曰凡以苞苴簞笥問人者左氏曰衛侯使人以弓問子貢則知問皆遺之意也知子之和好也我則雜佩以報之正序所謂説德也孔子曰吾未見好德如好色者也人能以好德之心而易其好色之心則可謂賢矣然此其難事况所謂婦人者方願以色求媚人而乃不以色愛於其夫而説德豈不甚難乎難鳴之詩謂雞既鳴矣朝既盈矣匪雞則鳴蒼蠅之聲曰雞鳴矣乃是蒼蠅之聲亦猶此詩既曰昧旦矣而明星尚爛然也雞鳴之詩賢妃之佐人君也女曰雞鳴之詩賢婦之佐君子也惟其人君有賢妃故不恱色而急於親賢故曰會且歸矣無庶子子憎惟為士大夫有賢婦故不恱色而急於賔客故下文又曰知子之來之雜佩以贈之蓋自天子至于庶人未有不資內助以成也黃曰齊雞鳴之詩思賢妃之配國君女曰雞鳴之詩則言古之賢婦以刺時人之不恱德而好色也子者皆婦人告其夫之辭言古之婦人與其夫相警戒而不敢自暇自逸勉其早興往取鳬鴈以為中饋飲食之具以遂其燕飲歡樂之意其末章又言知子之來相和好者當有以贈之遺之報之是勉其夫不獨厚於室家又當尊賢友善以成其德也言古之婦人如此以刺今之不然有女同車刺忽也鄭人刺忽之不昏于齊太子忽嘗有功于齊齊侯請妻之齊女賢而不取如字又促句反卒以無大國之助至於見逐故國人刺之有女同車顔如舜華將翶將翔佩玉瓊琚彼美孟薑洵美且都有女同行顔如舜英將翶將翔佩玉將將彼美孟薑德音不忘李曰左傳云桓公六年北戎伐齊齊侯使乞師于鄭鄭太子忽帥師救齊六月大敗戎師獲其二帥大良少良甲首三百以獻于齊所謂太子忽有功于齊也又曰公之未昏于齊也齊侯欲以文薑妻鄭太子忽太子忽辭人問其故太子曰人各有耦齊大非吾耦也在我而已大國何為君子曰善自為謀及其敗戎師也齊侯又請妻之固辭人問其故太子曰無事於齊吾猶不敢今以君命奔齊之急而受室以歸是以師昏也民其謂我何遂辭諸鄭伯則是齊侯以女妻太子忽也此詩言齊女賢而不取恐只是後之所謂請妻者若謂齊侯以女妻鄭太子忽乃是文薑又安得為賢乎卒以無大國之助至於見逐者據鄭莊公卒太子忽立宋人乃執鄭祭仲出忽而立突突雍姞之子也雍氏有寵於宋莊公故宋人執祭仲而立突是突得大國之助而忽無大國之助所以見逐詩人推原其見逐之由蓋本於辭齊之昏故詩人作以刺之也歐陽則謂卒以無大國之助所以見逐移於山有扶蘇之詩以所美非美然移於此詩蓋歐陽徒見卒無大國之助至於見逐詩中本無此意也以詩考之所謂卒無大國之助至於見逐者乃是國人推原其見逐之由不必求於詩中也今且從本序有女同車顔如舜華士昏禮曰壻御婦車授綏則是昏娶之時夫婦同車也忽不昏於齊而謂之同車者欲其如此也同行行道也亦是同車之意王氏則謂忽之小廉適足以致大亂也此詩所以刺之也而又謂下文乃是孟薑蓋王氏則於同車同行之説不通故為此説舜木槿也其樹如李其華朝生暮落月令仲夏之月木槿榮是也顔如舜華言顔色如木槿之華也鄭云今謂之朝生暮落花英亦華將翺將翔佩玉瓊琚言其翺翔之間所佩者瓊琚之玉言其行步中節也將將佩玉聲也彼美孟薑洵美且都言彼美好之孟薑信美而且都也都亦美也亦訓為間間習容儀也司馬相如上林賦曰妖冶間都則以都為間傳又曰雍容間雅甚都顔師古曰間美之稱也鄭風有女同車詩曰有女同車洵美且都則知以都為間也山有扶蘇曰不見子都則知以都為美也德音不忘言其德音之不可忘也言其有美譽也論曰嘗觀自古賢人君子亦有辭昏者劉德妻死霍光欲以女妻之德不敢畏盛滿也又欲妻雋不疑固辭不敢當若二子者可謂善避禍者矣卒之霍禹謀不軌霍氏之壻如鄧廣漢范明友皆不得其死然則知辭昏若二子者然後為善也劉雋之辭昏乃免於禍忽之辭昏乃所以召禍故王氏曰娶大國賢女以其有助則無國家之難矣忽不務此而辭之以為廉終至於公子互爭而兵革不息國人皆不得保其室家也黃曰桓六年云見李講以理觀之若太子可謂知道故左氏亦記當時君子之言曰善自為謀則是太子忽之不昏於齊宜詩人之所美也而今反以為刺豈非以其為祭仲所逐而無大國之助詩人因為之惜乎或曰文薑非賢女其歸於魯桓公而成魯國之亂安得謂齊女賢而不取乎意此詩所謂齊女非文薑也不然則詩人之言何惑之甚山有扶蘇如字又音踈刺忽也所美非美然山有扶蘇隰有荷華不見子都乃見狂且山有橋松隰有遊龍不見子充乃見狡童李曰言忽之所美者非所當美也山有扶蘇隰有荷華扶蘇小木也荷華芙蕖也橋松木也遊龍紅草也爾雅曰紅蘢古其大者其名蘬即遊龍也毛氏則以山有扶蘇隰有荷華言髙下小大各得其宜也其説未盡蘇氏則以山有扶蘇喻忽置不正之人於上位隰有荷華喻忽置美德者於下位鄭氏於上章既如此説下文又以橋松在山上喻忽無恩澤於大臣也紅草放縱枝葉於隰中喻忽聽恣小臣其説可謂勞矣蘇氏則以鄭氏之説為非蘇氏以謂扶蘇生於山其居非不髙矣而枝葉不足以自庇不如荷花之生於隰得其澤以滋其説與鄭氏亦不甚相逺即目睫之論也此詩大意只是山之有木隰之有草可以為榮為太子忽者國乃無人何以為國之光華若如此説豈不簡而易明乎都美也不見子都乃見狂且者言不往見子都美之人乃反見狂醜之人也且結語之辭不見子充乃見狡童言不往見子充良之人而乃見狡猾之童也言其不别美惡論曰自古人君雖甚愚亦皆知用君子則可以致治用小人則可以召禍然每至於危亡者蓋以君子為小人小人為君子也唐德宗以薑公輔為賣直以盧把為忠李泌曰天下皆知陛下獨不知之此其所以為姦邪也夫薑公輔天下以為君子也而德宗乃以為賣直盧把天下以為大姦也而德宗乃以為忠是皆以忠為佞以佞為忠也此亂亡相繼未有不由於是蓋皆所美非美也黃曰此詩古今之説皆失其義豫考詩人之意蓋以為山有扶蘇亦有橋松隰有荷華亦有遊龍以見國人未嘗無君子亦未嘗無小人在人君能辨之耳今昭公不見子都子充而乃見狂且狡童是所美者非所當美而反以小人為君子也漢武帝賢公孫𢎞而愚汲黯唐德宗以盧把為忠以薑公輔為賣直皆是此類蘀兮刺忽也君弱臣強不倡而和也蘀兮蘀兮風其吹女叔兮伯兮倡豫和女蘀兮蘀兮風其漂匹妙反女叔兮伯兮倡豫要女李曰君倡臣和理之常也今也君弱臣強專命自恣不稟於君不待君命而動詩人所以刺之也蘀兮蘀兮風其吹女七月之詩曰十月隕蘀落葉故謂之蘀蘀兮蘀兮風其吹女言蘀之落也必待風之吹猶臣之和也必待君之倡故下文曰叔兮伯兮倡豫和女者蓋是詩人指羣臣而戒之曰叔兮伯兮汝羣臣和之則在乎君倡之汝今則不然何也君天道也臣地道也乾知大始坤作成物乾以始之坤以終之君行於上臣從於下亦猶乾坤之終始也今也臣之行事而乃不稟命於君是専命也春秋凡書遂者皆譏大夫之専也事之小大不同皆書之者以謂一萌専命之心是有無君之意其禍必至於不可勝言矣故魯之三家齊之諸田晉之六卿所以有篡弒之禍也黃曰人臣之事君如婦人之從夫其義不可不順故夫倡而婦隨君倡而臣和者理之當然也事不出於夫而出於婦則其家必亂事不出於君而出於臣則其國必危故易之乾君也坤臣也乾取其健坤取其順臣不敢以先乎君也魯之政出於三家晉之政出於六卿齊之政出於田常則有篡弒之禍周之衰也事不出於天王而出於諸侯漢之衰也事不出天子而出於強臣唐之亂也事不出於昭宗而出於朱全忠此危亡之證也今昭公微弱而為祭仲所專此詩人所以悲其將亡而為之嗟歎歟狡童刺忽也不能與賢人圖事權臣擅命也彼狡童兮不與我言兮維子之故使我不能䬸兮彼狡童兮不與我食兮維子之故使我不能息兮李曰權臣指祭仲也祭仲專廢立之權故謂之權臣也彼狡童兮狡童指鄭忽也以忽為狡童豈人君之事所當然哉程氏曰作詩未必皆聖人當時所取者但取其意止於禮義聖人所取未必然如比君以狡童碩鼠此説是也不與我言兮言不能與賢人圖事也不與我食兮言不與賢人食也王氏曰不與我言是不與我治天職也不與我食是不與我食天祿也此説是矣然又謂弗與治天職食天祿所謂賢人者亦可以已矣而至於不能食息者何哉忽猶足與為善也此説非也鄭忽豈足與為善哉既以為狡童則其不足與為善也明矣詩曰維子之故使我不能餐兮使我不能息兮蓋民言鄭忽不與賢人圖事我是以憂其滅亡而不能䬸息也楊龜山曰人臣任君之事然後食君之祿義也弗與食天祿故至不能食弗與賢臣圖事則其憂甚矣故至於不能息亦不必如此分别也黃曰説者以狡童喻昭公蓋詩人疾之之辭夫詩人至於疾其君而以狡童目之豈敦厚之意哉少南以狡童目祭仲此説甚善夫昭公微弱而為權臣擅命尚足謂之狡童前詩謂不見子充乃見狡童謂其不親近賢人而好任小人也故此詩之意以為昭公惟彼狡童之與言而不與我言惟彼狡童之與食而不與我食昭公信任權臣而至為權臣擅命此賢者所以深憂而食息不能安也褰裳思見正也狂童恣行國人思大國之正已也子惠思我褰裳涉溱子不我思豈無他人狂童之狂也且子惠思我褰裳涉洧子不我思豈無他士狂童之狂也且李曰狂童恣行謂忽與突也蓋謂忽立未及年而突逐之突立四年祭仲逐突而立忽其後交爭不息國人欲得大國以兵加鄭正其是非庶可以定也子惠思我褰裳涉溱溱水名説文從水從秦出鄭國洧説文曰出潁川陽城山東南入潁二水皆在鄭之境內孟子曰子産以乘輿濟人於溱洧是也子惠思我褰裳涉溱鄭氏謂子者斥大國之正卿子若愛而思我我國有突篡國之事而可征而正之我則揭衣渡溱水以往告難也歐陽以為不然謂以難告人豈待其思而後往告哉歐陽以謂大國有惠然思念我鄭國之亂欲來為我討正之者非道逺而難至但褰其裳而行溱洧水而來則至矣言甚易而不來爾此説為善王氏蘇氏皆與歐氏同子不我思豈無他人言子苟不思我不來吾國豈無他人來正我哉此蓋鄭人怨諸侯不相救正故為此辭也鄭氏謂他人者先鄉齊晉宋衛後之荆楚詩中本無此意鄭氏蓋臆説也豈無他人鄭氏謂大國之卿當天子之上士皆非詩人之意他士猶他人也王氏謂子不我思豈無他人蓋望乎大國之君大夫既不可望則又思其微者故又曰子不我思豈無他士此蓋泥於文字章句之末不可取也狂童之狂也且言大國既不救已而狂童之狂甚矣亦無可奈何也黃曰忽突微弱不能自存而祭仲恣其狂狡之行擅廢其君之權弄其君於股掌之上故國人思大國之正已而怨諸侯之不我救也曰褰裳涉溱謂大國若惠而思我則但褰裳涉溱揭衣以渡溱水而可以至矣言甚近且易而大國之不來也曰狂童之狂也且言大國之不能正己則狂童之狂日甚以見權臣擅命而舉鄭國無如之何也丰刺亂也昏姻之道缺陽倡而隂不和男行而女不隨子之丰兮俟我乎巷兮悔豫不送兮子之昌兮俟我乎堂兮悔豫不將兮衣錦褧衣衣錦如字一音於記反褧苦迥反裳錦褧裳叔兮伯兮駕豫與行裳錦褧裳衣錦褧衣叔兮伯兮駕豫與歸李曰昏姻之道缺者蓋言嫁娶之禮失男子親迎而女子不肯從之故曰陽倡而隂不和男行而女不隨取譬於隂陽者以明男女之非禮也夫婦猶君臣也君不倡而臣和非禮也君倡而臣不和亦非禮也男子不親迎而女從非禮也男親迎而女不從亦非禮也子之丰兮此詩蓋是當時婦人辭也男子親迎則女子有他志而不從其終也又悔而欲從之故上二章則曰悔豫不送兮悔豫不將兮下二章則曰駕豫與行駕豫與歸蓋是悔而欲復從之也丰滿也左氏曰榖也豐下之類是也俟我乎巷兮言男子親迎俟我於巷也巷門外之道也悔豫不送兮此蓋言舊時來迎己巳不從之今則悔其不送也子之昌兮昌盛也如猗嗟昌兮之類是也俟我乎堂兮亦是親迎也孔氏曰士昏禮主人揖賔入於廟主人升堂西面賔升堂北面奠鴈再拜稽首降出婦人從降自西階則是士禮受女於廟堂庶人雖無廟亦當受女於寢堂鄭氏以堂為棖棖門梱上木不必如此説悔豫不將兮亦是不送之義也衣錦褧衣庶人嫁者之服也褧襌也錦衣加以襌縠言被此衣服汝叔兮伯兮再乘車來迎已則嫁而與之同行同歸也觀此章則鄭風俗可見矣始也男子親迎女則不從其失正也如此及其終也已失身於他人欲復從昔日親迎之男子其失正也又如此此詩所以刺之也叔兮伯兮孔氏謂呼迎者之字云叔兮伯兮若復駕車而來我則與之行矣此説是也王氏謂叔兮伯兮駕豫與行駕豫與歸者謂壻親迎之叔伯以女悔而不隨故但相與駕而行以歸也其論叔伯既已失詩人之意而其論駕豫與行駕豫與歸之義又非詩人之意不可從也黃曰有天地則有男女有男女則有夫婦婦人之從夫者天地之義也而從之不可以不正苟以正禮求我若之何不從哉故丰之一詩皆言女子不從於始而悔於終也夫男行而女不從雖非所以為禮然不猶愈於淫奔之風乎而詩人遂曰刺亂者蓋天下之事不從之於此者則從之於彼親迎正禮而女不從非不從也志在淫奔而不知正禮之當從也及至華落色衰復相棄背則未有不悔之於終者詳觀此詩乃女子為淫奔所誤故思其初而悔其不從正禮之為禍其曰刺亂也固宜東門之墠音善刺亂也男女有不待禮而相奔者也東門之墠茹藘力於反在阪其室則邇其人甚逺東門之栗有踐家室豈不爾思子不我即李曰墠除也阪説文曰陂者曰阪茹藘茅搜也李巡云一名茜可以染絳此詩最難曉毛氏則以東門之墠為一説以茹藘在阪為一説至於下章亦以東門之栗為一説以有踐家室為一説其説以謂男女之際近而易則如東門之墠逺而難則如茹藘在阪至於東門之栗則以謂東門之外有栗樹生於路上無人守護其欲取之則為易有物在踐室家之內有主守之其欲取之則難以興為昏者得禮則易不得禮則難詩中所言不可分而為二也鄭氏則謂東門之外有墠墠邊有阪茅搜生焉茅搜之為物淺矣易越而出此女欲奔男之辭此雖以兩句為一説然其説則不可以從也王氏則以謂東門之墠言以禮則平易茹藘在阪言以道則阪險蘇氏則以東門之墠茹藘在阪為譬喻以東門之栗有踐家室為非譬喻其説皆難取信詳觀此詩是思古之詩當時既不待禮而奔故思古之人能以禮自防也東門之墠言東門除處之地易往也而有茹藘在阪焉言其難行也其室則邇其人甚逺者言其人雖甚近卓然有不可犯故曰其人甚逺亦如晉人所謂室邇人遐實勞我心皆是言人不可犯也鄭氏言其室則近謂所欲奔男之家望其來迎已而不來則逺曲説也東門之栗有踐家室者蓋言欲采東門之栗當踐室家而後行亦言甚難也豈不爾思言我豈不思爾哉蓋以禮不可犯而我不敢就也即就也詳觀此詩蓋是漢上遊女之流確然以禮自守不陷於淫奔之欲故詩人思其人也若此説其義曉然矣黃曰此詩蓋刺今淫奔而思古之貞女如見漢水之廣者自無泳之之思見江水之永者自無方之之思室家之情人所不免特畏禮義而不敢奔耳東門之墠雖易至而茹藘在阪為難及女子之室雖甚近而禮義之不可犯則若甚逺一篇之義皆當以是求之風雨思君子也亂世則思君子不改其度焉風雨淒淒雞鳴喈喈既見君子云胡不夷風雨瀟瀟雞鳴膠膠既見君子云胡不瘳風雨如晦雞鳴不已既見君子云胡不喜李曰風雨淒淒而雞鳴喈喈然不失其和以譬君子居於亂世而不改其度也瀟瀟疾也膠膠亦如喈喈如晦言其昏晦也此詩皆以雞鳴喻君子之度也當今之世無此人也苟見君子則云胡不説故曰既見君子云胡不夷夷恱也瘳愈也言如病之愈也論曰震風淩雨然後知厦屋之為帡幪也虐政亂世然後知聖人之為郛郭也蓋非亂世則無以見君子之難也常人之情隨世變遷治世則為善人亂世則為不善之人其所行皆因俗而改君子則不以夷險改其心故其所行有人亦若是無人亦若是蓋不如是無以見君子之髙節也不有瞽瞍之頑無以見大舜之孝不有管蔡之流言無以見周公之忠不有安史之亂無以見張巡許逺之節且以孔門觀之陳蔡之厄如子路則愠見子貢則不免有所疑惟顔子與夫子同志夫孔子之門尚且如此况其餘乎黃曰疾風知徑草板蕩識忠臣善論人者當於衰亂之時觀之糧不絶無以見夫子巷不陋無以見顔回若談仁論義於間暇之時變節易慮於緩急之際則不可以託六尺之孤寄百里之命矣今曰亂世則思君子不改其度意當時之士皆隨世俯仰而無嵗寒之操者也噫顛沛而不違仁然後為仁之至舉足而不忘親然後為愛親之篤此詩人所以思君子於衰亂之世歟子襟刺學校廢也亂世則學校不修焉青青子襟悠悠我心縱我不往子寧不嗣音青青子佩悠悠我思縱我不往子寧不來挑他羔反又敕雕反兮達兮在城闕兮一日不見如三月兮李曰襟領别名也青領也青襟學子之所服也禮父母在衣純以青青青子襟悠悠我心者蓋言學校不修青襟分散不在學校故悠悠然思之也鄭氏謂學子而俱在學校之中已留彼去故隨而思之耳若如鄭氏之説則學校之中猶有留者未得為盡廢也故歐氏不從其説程氏謂世亂學校不修學者棄業賢者念之而悲傷故曰悠悠我思其説以謂我心悠悠謂賢者悲傷當時如此然亦不如歐陽氏以為學校廢而生徒分散朋友不復羣居相見而相思之辭耳二説為長嗣音毛氏以嗣為習謂習詩樂王氏亦謂嗣弦歌之聲三年不為樂樂必崩故嗣音不可忘也此説不如鄭氏以為曽不嗣續其聲問遂相棄乎青青子佩佩玉也青青者襟之組綬也其意亦與上章同王氏曰襟在上佩在下青青子佩者則又思其次也嗣音不可見矣子寧不來則又望其次也此皆鑿説也挑兮達兮挑達説者不同毛氏以為往來相見貌歐陽則以為挑達城闕間日遊遨無度也程氏則以謂挑達輕躍放恣不事於學則遊遨城闕而已許慎則又謂挑字作𠬢又以達為行不相遇也王氏則挑為佻字讀以達為撻字讀其説之不同如此王氏以為誘挑開達之事乎王氏又謂在城闕者學校廢於鄉黨也皆是鑿説其説難明毛氏以為往來相見而下文曰不見何緣謂之相見乎程氏之説與歐陽同今且從程氏歐陽之説在城闕兮言城上有髙闕居此遊遨而候望也一日不見如三月兮毛氏曰言禮樂不可一日而廢王氏亦從其説夫禮固是不可一日廢然詩人之意只思朋友之言一日不見如三月之久也論曰學校者教化之本原也王氏解此詩其義最詳自三代之學以下數百言其學者致爪掌之力而固執之龜山力辨之矣至謂人之行莫大於孝此乃人道未至於天道夫子襟之所刺蓋傷人倫之廢其於人道天道分而為二盡子道則人倫之道盡矣盡人道不能盡天道則天道果何物哉學者雖多徒亦贅矣此詩所刺學校之不修矣其後又有毁鄉校者夫學校不修生徒不在與夫毁鄉校者無以異也然不修學校猶可言也毁鄉校不可言也告朔之禮雖廢孔子以為不可去餼羊明堂之政雖廢孟子以為不可毁明堂觀此則知此詩之意也黃曰夏曰校商曰序周曰庠學則三代共之皆所以明人倫也古者學校修則學者於此藏焉修焉今鄭人學校不修而學者失業故此一詩皆是學者朋儕分散思念相責之意夫僖公修泮宫而魯人頌之鄭之學校不修其刺也宜矣揚之水閔無臣也君子閔忽之無忠臣良士終以死亡而作是詩也揚之水不流束楚終鮮兄弟維豫與女無信人之言人實迋女揚之水不流東薪終鮮兄弟維豫二人無信人之言人實不信李曰觀山有扶蘇之詩刺忽所美非美然則知忽之無忠臣良士也惟其無忠臣良士雖有如無也故序以為無忠臣良士焉韓退之送溫造序曰伯樂一過冀北之野而馬羣遂空夫冀北之馬多於天下伯樂雖善知馬安能空其羣邪釋之者曰夫所謂無非無馬也無良馬也知無馬為無良馬則知無臣為無忠臣矣左襄十五年師慧過宋朝將私焉其相曰朝也慧曰無人焉相曰朝也何故無人慧曰必無人焉若猶有人豈以其千乘之相易淫樂之矇觀此所謂無人則知此詩亦無忠臣矣忽不能任賢使能使在朝者不見信所信者皆小人安得不謂之無臣邪揚之水不流束楚揚之水非自流之水也水不能自流而或激揚之雖束薪束楚亦不能流矣以譬忽之失衆雖令之而不肯聽也所以然者以忽之偏信故也終鮮兄弟者言偏信則衆皆疑之終少兄弟言不見親昵之人也惟豫與女惟豫二人者蓋指當時所信之人此可得知其人也迋誑也無信人之言人實迋女無信人之言人實不信蓋言其以小人為可信然也人皆是迋女也不以小人為不足信此所以忽之無忠臣良士也黃曰師慧過宋見李講此所謂閔無臣者非無臣也無忠臣良士則雖有如無也傳曰不有君子其能國乎嘗觀漢武帝時淮南王安為反謀且曰漢廷大臣汲黯守節死義難惑以非至如丞相𢎞等如發蒙振落耳則其視公孫𢎞若無之也吁漢亦幸其有汲黯哉鄭亦不幸而無如汲黯者哉毛詩集解卷十
