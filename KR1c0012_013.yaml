body:
  text: 毛詩集解卷十三宋李樗黃櫄撰椒聊刺晉昭公也君子見沃之盛強能修其政知其蕃衍盛大子孫將有晉國焉椒聊之實蕃衍盈升彼其之子碩大無朋椒聊且遠條且椒聊之實蕃衍盈掬彼其之子實大且篤椒聊且逺條且李曰沃之盛強而桓叔又能修其政雖晉人亦將叛而歸之此君子所以知其子孫必有晉國而滅之也按左傳桓二年桓叔既與潘父比而滅昭侯莊伯又於惠之四十五年伐翼弒昭公子孝侯翼人立其弟鄂侯隱五年莊伯又伐翼鄂侯奔隨王立其子哀侯桓公三年莊伯子武公又伐翼侯而獲之七年又誘小子侯殺之王命立其弟緡莊十六年武公遂獲晉此則桓叔子孫并有晉國之事也君子於桓叔之世遂逆料其必如此者蓋觀人之國即其微以知其著而況昭公微弱桓叔強盛曲沃之并晉國有必然之理也椒似茱萸而小赤色內有黑子如點今謂之椒木其木有針刺葉堅而滑澤陸璣疏曰聊語助也王氏以為薄略之辭則鑿矣椒聊之實蕃衍盈升鄭曰椒之性芬香而少實今一救之實繁衍滿升非其常也蓋爾雅曰椒榝醜莍桃李醜核故鄭氏謂一救之實蕃衍盈升然而一救不可以滿升故孔氏謂若論一樹則不止一升才據一實則又不足滿升驗今椒實一裹之內惟有一實時有二實者少耳今言一救滿升假多為喻非實事也故知一救比一升為小矣然亦不必泥於一升之説詩人之意椒聊之實始生蕃衍可以盈升故其久也蕃衍可知但桓叔之強盛如此其子孫并有晉國又可知矣蕃衍盈掬本草曰據古升上徑寸下徑六分深八分則升小於掬然漢志又謂千二百黍為籥十籥為合十合為升見律歷志上則升又大於掬故陸農師謂兩手為掬兩掬為升先曰升後曰掬互相備而已詩人之意止是言曲沃盛強如椒之蕃衍而乃區區於升掬小大之不同亦無益之言也蘇氏曰椒之性芬烈而能奪物者也今其實蕃衍而盈升則其近之者未有不見奪者也王氏謂至治馨香能修其政則馨香上達皆不足以求詩人之意其意但以蕃衍而取喻桓叔初無奪物之意亦無馨香上達之説彼其之子指桓叔也碩大無朋鄭曰碩謂壯貌佼好也大謂德美廣博者非也蓋碩即大也即序所謂盛強也無朋無比也言其強盛而無比也毛曰朋比也釋文曰比為比字必理反又必二反是又以比為朋比之比故鄭氏以為平均不朋黨也惟歐以無比當從毛氏之説實大且篤言其強盛又且篤志以修其政也椒聊且遠條且毛氏曰條長也蓋椒之蕃衍日益逺以喻桓叔之子孫日強盛也夫以曲沃之盛強而能修其政詩人刺昭公者蓋欲昭公能修其政好禮則民莫敢不敬好義則民莫敢不服好信則民莫敢不用情則四方之民襁負其子而至矣況於晉國之民乎惟昭公之懦弱無立德不及民而桓叔乃能修其政君子知其將并晉國昭公乃恬然不之知此詩所以譏之也夫天下之勢如持衡首重則尾輕矣昭公能修其政以成其強盛桓叔安得強盛乎田氏厚施而得民心晏子之徒皆知齊之為田氏嘗謂景公曰陳氏厚施民歸之矣後世若少惰陳氏而不亡則國其國也已公曰善哉是可若何對曰唯禮可以已之公曰善哉我不能矣見昭公十六年昭公有桓叔之強盛而不之知齊有田氏之厚施知之而不能已知與不知雖不同而所以不能自立則一也此齊之所以為田氏而晉之所以并於曲沃也黃曰武公獲晉在莊十六年而君子於桓叔之世已逆知其如此者蓋觀人之國者當於其微履霜堅冰至則臣弒其君子弒其父非一朝一夕之故其所由來者漸矣田氏厚施而得民心晏子謂景公曰田氏厚施民歸之矣公曰若之何對曰惟禮可以已之公曰善哉吾不能矣此皆微弱而不能自立之過也晉之所以為曲沃之所獲亦類是歟綢繆刺晉亂也國亂則昏姻不得其時焉綢繆束薪三星在天今夕何夕見此良人子兮子兮如此良人何綢繆束芻三星在隅今夕何夕見此邂逅子兮子兮如此邂逅何綢繆束楚三星在戶今夕何夕見此粲者子兮子兮如此粲者何李曰綢繆猶纏綿蓋言束薪之狀也毛氏曰男女待禮而後成若薪芻待人事而後束則是以薪喻男女以束之者喻禮也蘇氏曰合異姓以為昏姻言猶錯取衆薪而束之耳薪之為物束之則合釋之則解是以綢繆固之而後可以望其合也蘇氏説與毛氏相似王氏説亦與此不相上下惟鄭謂束薪於野而見天星歐氏以為其義簡而直當從鄭説三星在天曰參也天文志曰參謂白虎三星故毛氏之意以謂昏姻之月自季秋盡於季春皆可以成昏不待初冬冬末開春之時故陳昏姻之正時以刺之在天謂始見東方也在隅東南隅也在户謂正月中直户也始見東方則十月之時在東南隅則十一月十二月正月中直戶則正月之時也月令孟春之月昏參中故知正月中直戶明矣既以在戶為正月則在隅為十一月十二月在天為十月可知鄭曰三星謂心星鄭以仲春昏而火星不見嫁娶之時也今已見在天非其時爾故詩人舉其昏姻失時而刺之故曰三星在天然三星一名大火歐以為參星皆三星則知鄭説為得矣以其所見之月候嫁娶早晚為有理此言是也若以三星為心星見失嫁娶之時則下文今夕何夕見此良人文意相屬也夫仲春之月心星未見至三月四月則見而在東方左氏曰火出於夏為三月見昭七年周官季春出火言三月之時已失其時矣況於在隅在戶乎在隅則四月之末五月之中在戶則五月之末六月之中月令白仲夏之月昏心中是也鄭以三星為心星則可若以心為有尊卑夫婦父子之象則其説鑿矣今夕何夕見此良人張橫渠曰今夕何夕見此良人言此時可以見也子兮子兮如此良人何言國亂不可得見也三星在天已非其時以相謂今三星在天之夕是何月之夕而女子見於良人非其時雖非其時然以國亂不可得見故曰如此良人何將奈之何哉子兮指娶也毛氏曰良人美室也孔氏曰小戎云厭厭良人蓋妻見此良人言女子之失時也今夕何夕見此粲者言男女之失時也不必如此説見此邂逅王氏曰失時故思不期而會焉則邂逅者不期而會也如此粲者何國語女三為粲大夫一妻二妾故王氏曰亂甚矣雖貴者亦不得以時娶然不當泥於三女之説國語雖曰三女為粲而又曰粲美物也是言美女也凡此皆是上文之意此詩與衛風有狐鄭風野有蔓草陳風東門之楊皆言世變多故兵飢喪亂民不安居而力不足故男女昏姻不得其時也然而陳鄭衛之詩其淫亂為多蓋當時政教不修禮義不明淫風大行此所以有相奔之俗其知以淫奔為恥兼又以喪亂之故而不得其時至於唐風則不然蓋淫泆之禍在於奢侈唐之風俗尚儉雖不得其時猶未至於淫奔也晉之儉雖不得先王之中制然猶以尚儉之故愈於奢也孔子曰禮與其奢也寧儉蓋言儉雖失於中道猶愈於奢也黃曰衛鄭陳齊之國皆有淫奔之風皆以兵飢喪亂人倫不明故男女有不待禮而相奔者也惟晉魏之國以聖人所都之地雖其習俗儉嗇隘狹而淫奔之俗不聞故綢繆一詩言國亂則昏姻不得其時曰昏姻則是猶有昏姻之禮也聖人之風化其入人深也如此哉杕徒細反杜刺時也君不能親其宗族骨肉離散獨居而無兄弟將為沃所并爾有杕之杜其葉湑湑私敘反獨行踽踽音舉豈無他人不如我同父嗟行之人胡不比焉人無兄弟胡不佽十利反焉有杕之杜其葉菁菁獨行睘睘求營反豈無他人不如我同姓嗟行之人胡不比焉人無兄弟胡不佽焉李曰夫欲人之親我者必有以親之也君不能親其宗族則骨肉相與離散而不我親矣惟其骨肉離散此君所以獨居而無兄弟之助既無兄弟此曲沃所以得肆其吞噬之心也杕特貌杜赤棠也爾雅曰杜赤棠郭璞曰今之杜梨也樊光曰赤者為杜白者為棠陸璣疏曰赤棠與白杜同但子有赤白美惡子白色為白棠甘棠也少酢滑美赤棠子澀而酢無味其葉湑湑毛氏曰枝葉不相比也菁菁毛氏曰葉盛也鄭曰希少貌既以湑湑為不相比又以菁菁為葉盛孔氏以為互相發明言葉雖茂盛而枝條稀踈以喻宗族雖強不相親昵也然按詩云其葉湑湑菁菁本無枝條稀踈之意蘇曰晉君逺其兄弟而親異姓喻如杕杜條幹不足以相扶持與毛鄭不相上下按裳裳者華其葉湑兮毛氏曰湑盛也菁菁者莪毛氏以為盛貌則是二者皆言茂盛不應以湑為枝葉不相比鄭又以為希少故知此當從王氏説曰杜之實不足食而又特生然其葉湑湑然則亦能庇其本根君不能親其宗族骨肉離散曽杕杜之不如也王氏説蓋本於左傳宋昭公欲去羣公子樂豫曰公族公室之枝葉也葛藟猶能庇其本根故君子以為比況國君乎見文七年王説蓋本於此踽踽毛曰無所親也按孟子何為踽踽涼涼則踽踽然無所親之意也睘睘毛氏曰無所依也説文曰堅固貌骨肉離散君獨行而無所親豈無異姓之臣乎雖有異姓之臣不如我同姓之親也他人謂異姓之人也同父謂同姓之親也同姓謂同祖之人也既有他人而乃曰獨行者王氏曰言既無同父雖有他人猶獨行也此言是也比輔也佽助也同姓之臣既不見親異姓之臣又不肯輔君以相比故同姓之人曰嗟乎君所與行之人嗟行之人指異姓大夫也言汝胡不輔君以為比乎汝既見君無兄弟之助汝何不佽助之乎同姓之臣既不見親異姓之臣又不見輔冝乎昭公孤立無助而為曲沃所并也棠棣詩兄弟鬩于牆外禦其侮此蓋言兄弟相須於急難之際同心於急難之中雖有鬩牆之忿不忘禦侮之事何者憂患同也昭公弱而有曲沃之強曲沃又有吞食晉國之意而昭公不能親其宗族何以禦外侮哉然昭公所以不親宗族者其意謂吾封桓叔非不親也封之曲沃待其盛強稔成其惡莫若與異姓之臣共事也彼豈知周公不以管蔡之故而不封同姓哉同姓之親既已離散異姓之臣又不忠其君此所以為曲沃所并也昔秦始皇振長策以馭宇內吞二周而亡諸侯踐華為城因河為池自以為關中之固子孫帝王萬世之業也然而懲周之弊以小弱之故罷侯置守而子孫亡尺寸之封終以孤立雖有至強之勢一夫作難而七廟墮秦強如此罷侯置守猶足以亡況昭公之微弱而又不能親其宗族是促其亡也黃曰古之有國者必封同姓以自衛所謂宗子維城者周以宗強是也今昭公不親其宗族其心必以為曲沃之封而反以噬晉故不若與異姓之人共事也然管蔡雖叛而周人不忘同姓不可以噎而廢食也秦始皇懲周之弱罷侯置守而子孫孤立一夫作難而七廟墮子孫無尺寸之地亦以骨肉離散故耳可不戒哉羔裘刺時也晉人刺其在位不恤其民也羔裘豹袪自我人居居音據豈無他人維子之故羔裘豹褎自我人究究豈無他人維子之好李曰言晉國之臣既不助其君以愛恤其民此其所以可刺也袪毛氏曰袂也孔氏曰玉藻云深衣袪尺二寸注云袂口也深衣亦云袂之長短反詘之及肘是通袂皆袖之大名袪是袖頭之小稱羔裘豹袪毛氏曰本末不同在位與民異心其説謂晉在位之臣服羔裘豹袪晉人因其服舉以為喻言以羔皮為裘豹皮為袪異皮本末不同以興民欲在上憂己在上乃疾惡其民此皆強生義理毛氏於鄭羔裘檜羔裘皆直説其事未嘗以為興乃於此強為之説何也蘇曰君子處於民上猶豹袪之在羔裘耳豹雖甚貴而以羔裘為本王氏曰羔裘在位之服也袪在手操執以從事指麾以使人也羔裘而豹袪則其在位操事使人以猛而已非恤其民者也褎袪之末而已羔裘而豹褎則其猛又甚矣蘇氏之説皆有王氏之失惟鄭氏曰羔裘豹袪在位卿大夫之服也其義為簡而直歐陽取之自我人居居毛氏曰自用也居居懷惡不相親比之貌究究猶居居也其説以謂在位者之心既與民異其用使我之民居居然悖惡之色不與我民相親按爾雅曰居居究究惡也毛説蓋本於此竊嘗疑爾雅之文是亦詩之詁訓也蓋其書出於漢世以居究為惡未甚顯然明白王氏曰居居者固而不知變究究者窮而不能通其説之鑿尤甚於毛氏張橫渠曰自我人居居自我人而晏安之也自我人究究言得我民而察察作威皆怨其反不恤已也其説益迃曲而難曉蘇曰捨羔則豹無所施而無民則君無所託則是以羔裘為喻其説又非也又謂君甚尊而由有民以安其居蘇氏説則是而其意未盡謂在位卿大夫之服者勢雖甚尊必由民以安其居則其説為得也蘇又曰究久也君之所以能居於此者由有民也然以究究為久無所據其義殊難曉當闕之以俟知者豈無他人惟子之故而不去耳子無以我無所歸而不恤我也鄭謂豈無他人可歸往者乎我不去者乃念子故舊之人此言是也但所謂此民卿大夫采邑之民其説非也故歐陽以為曲説惟子之好爾是念其恩好也此蓋國人將叛而歸沃未嘗適他國而其心巴離也唐人有言曰暑牛之渴豎子飲之停淖之污牛渴之久得停淖之汚寧復顧淸泠之水乎設使豎子牽之於淸泠之水以滌乎口中之泥然後知向之所謂停淖之水不可終而飲也今桓叔將有篡奪之謀民以其修政而欲歸之者蓋以晉人在位不恤其民民舍桓叔而不歸則將誰歸之哉正猶飲牛於停淖之汚也齊田氏以私量貸民而以公量收之民愛之如父母歸之如流水而齊之承嗣大夫強易其賄日求無藝徴斂無度宫室日更淫亂不道民人病苦夫婦皆詛此適所以啓其歸田氏之心也由此觀之齊之大夫強易其賄日求無藝是為田氏驅民也晉人在位不恤其民是為曲沃驅民也黃曰羔裘而豹袪者卿大夫之服也卿大夫之勢雖甚尊必由民以安其居今乃不恤我民如此我民亦豈無他人乎惟子之故而不忍去耳究久也卿大夫之所以能久於其位者以有民也噫田氏以私量貸民而以公量收之齊大夫乃強易其賄徴斂無度故卒為田氏所有桓叔既修其政而卿大夫乃不恤其民是為曲沃驅民也鴇音保羽刺時也昭公之後大亂五世君子下從征役不得養其父母而作是詩也肅肅鴇羽集于苞栩況禹反王事靡盬不能藝稷黍父母何怙悠悠蒼天曷其有所肅肅鴇翼集于苞棘王事靡盬不能藝黍稷父母何食悠悠蒼天曷其有極肅肅鴇行集于苞桑王事靡盬不能藝稻粱父母何嘗悠悠蒼天曷其有常李曰鄭氏云五世者昭公孝侯鄂侯哀侯小子侯是也按左傳小子侯為曲沃伯所殺王立哀侯之弟緡於晉鄭氏數五世不及緡者孔氏曰按晉國大亂五世不數緡者言昭公之後則是昭公之時自昭公數之至小子侯而滿五世故數不及緡也按序曰昭公之後大亂五世當自孝侯以至於緡也言五世大亂如此雖君子亦下從征役之事不得耕耨以養其父母而至於凍餒故作是詩也肅肅鴇羽聲也陸德明曰鴇羽似鴈而大無後趾性不樹止陳翥所謂連蹄也樹止則為苦爾雅曰栩杼郭璞曰柞樹也陸曰今柞櫟也徐州人謂櫟為杼或謂櫟為栩其子為皂或言皂去其殼為汁可以染皂苞稹孫炎曰物叢生為苞齊人名曰稹毛曰行翮也爾雅曰羽謂之翮孔曰鳥翮之毛有行列故稱行也言鴇之性不樹止而今乃飛而集于苞栩之上亦猶君子不當使之供賤役今乃下從征役言非其冝也盬毛氏曰不攻緻也孔曰盬與蠱字異義又曰左傳云於文皿蟲為蠱榖之飛亦為蠱見昭元年杜預曰皿器也器受蟲害者為蠱榖久積則變為飛蟲名曰蠱是蠱為不攻牢不堅緻之意也王事靡盬謂勤於王事而無不攻緻也藝樹也言君子既從征役為王家之事雖盡力為之無不攻緻而孝養之道為王事所奪故不能藝黍稷以供養其父母何所恃怙乎蓋當農事始興之時而乃從事於征役不得以時殖榖為一年之計父母亦將經轉乎溝壑矣故父母何怙何食何嘗悠悠蒼天曷其有所言君子既下從征役不得奉養父母於是仰天而訴曰悠悠蒼天何時而得其所而免於征役之事非是君子憚於王事而欲脫免之也蓋欲養其父母也曷其有極極已也言何時征役之事已也曷其有常言何時而得復其常也蓋言君子而從征役之事非其常也屈原曰人窮則反本故勞苦倦極未嘗不呼天疾痛慘怛未嘗不呼父母也此君子之於征役所以呼蒼天而訴之也王氏以謂始曰鴇羽中曰鴇翼卒曰鴇行始曰稷黍中曰黍稷卒曰稻粱始曰何怙中曰何食卒曰何嘗始曰有所中曰有極卒曰有常皆從而為之説以為中甚於始終甚於中其説可謂鑿矣春秋之時晉平公合諸侯以城杞晉悼夫人食與人之城把者絳縣老人亦與見襄十三年吳王夫差伐魯次於泗上魯七百人踊於幕庭有若與焉見哀公八年以絳縣老人之賢與於城把之役以有若之賢與於伐吳之役蓋當夫世亂多故征伐不休賢者蓋有不幸而與於征役也然以賢者而與此事已非其冝矣而況不得奉養其父母君子當何如哉古人有言曰枯魚銜索幾何不蠧二親之壽忽若過隙王氏又曰樹欲靜而風不息子欲養而親不待此皆孝子之心其愛親也勤思親也篤故汲汲於愛日以事親惟恐失之故願為人兄不願為人弟其愛日也如此今以征役之故不特廢其溫凊定省之禮又且無以為卒歲奉養之備其情豈不傷哉此詩如北山蓼莪陟岵皆孝子不得奉養父母故其詩哀以思也當征伐之時其心猶不忘苟在父母之側其事親為何如黃曰按左傳桓叔既與潘父弒昭公晉人立孝侯惠四十五年曲沃莊伯伐翼弒孝侯國人立其弟鄂侯隱五年莊伯又伐翼鄂侯奔隨秋王命虢公伐曲沃而立哀侯于翼桓公三年莊伯子武公又伐翼逐翼侯而獲之七年又誘小子侯而殺之王命虢仲立哀侯之弟緡莊公十六年武公遂獲晉此所謂大亂五世也竊嘗謂鄭之公子五爭而男女相奔晉之大亂五世而孝子思念父母此亦帝堯之美風也學者觀詩當知風俗之所以然無衣美晉武公也武公始并晉國其大夫為之請命乎天子之使而作是詩也豈曰無衣七兮不如子之衣安且吉兮豈曰無衣六兮不如子之衣安且燠兮李曰晉昭公封叔父成師於曲沃號為桓叔桓叔生莊伯莊伯生武公繼世為曲沃之君恃其盛強常有滅晉之志至莊十六年伐晉而滅之當是時天子之使適在晉故大夫為之請命于天子之使而天子之使為之請命于天子左傳曰王使虢公命曲沃武公以一軍為晉侯因其請命而命之也俟伯七命車旗衣服以七為節天子之卿六命車旗衣服以六為節上章言豈曰無衣七兮言我晉國之中豈不能為衣之七章但不如天子所賜之衣安而且吉也二章言豈曰無衣六兮蓋不可以必得侯伯之命服得受六命之服列於天子之卿猶愈於無天子之命也晉本侯爵故以七言之既而稱其次又以六言之王氏曰七者侯伯之服也六者子男之服也子男之服以五為節而曰六者天子之卿六命與子男同服故也據周官典命云子男五命其國家宫室車旗衣服禮儀皆以五為節秋官大行人云諸公諸子諸男冕服五章安得以六為子男之服乎鄭氏曰我豈無此七章之衣乎晉舊有之非新命之服晉本侯爵故言舊有七章豈曰無衣七兮詩人之意但是言豈不能造七章之服非以新舊論也豈曰無衣六兮蓋謂我晉國豈無六命之服言但欲以天子之命而安故爾天子之使為之請命故曰子者指天子之使言之燠暖也晉者曲沃之宗國也曲沃至於武公常有篡弒之志其行篡弒者屢矣至是而又滅之此先王之法所不容誅然其滅晉又不能請命於天子又不遣大夫以往乃因天子之使而請就命焉其驕蹇不臣以至於此如唐室之季強藩悍鎮皆伐其主帥擅自封殖坐邀天子之旌節劉仁恭嘗謂使者曰旌節吾自有但要長安本色爾此詩言豈曰無衣不如子之衣安且吉與劉仁恭之言無以異夫子刪詩乃取之者何哉王氏曰天下無道小大強弱相攘奪久矣非復知有王命也武公知請命于天子之使則所謂彼善於此此詩所以美之也此之謂與人為善不與人為善而盡義以絶之則人之為善者將寡矣程氏曰此美其請命一事不以篡君奪國為羞至於衣服僭侈何難然其心不安至於請命然後安此意可取此説皆是也蓋當是時周室衰微諸侯橫恣攘奪攻取惟力是恃豈知有天子之命哉惟知有天子之命是猶知有天子也春秋僖公朝于王所成公如京師蓋春秋之時諸侯偃然自肆無有朝王之禮惟僖公朝于王所因天子狩于河陽而遂朝之成公如京師則由會晉伐秦而遂朝之皆非有朝王之誠心使其過王所京師而不朝則無王之心甚矣今也猶能朝之是知有天王也晉武公滅晉雖非諸侯謹度之道使其不請命於周周亦末如之何矣今也能請於天子之使是知有天子之命也莊子曰人之逃於空谷者聞人足音則跫然而喜況於兄弟謦咳其側者乎孔子當衰周之時諸侯不修臣職滔滔者天下皆是也魯之僖公成公猶知有朝王之禮晉武公猶知有天子之命聖人安得不與之哉此正所謂聞足音者跫然而喜者也如氓云婦人望復關而為淫佚之行其後以夫見棄而始能自悔使其不見棄於夫未必自悔也詩人猶以反正善之夫子刪詩乃不去之者亦無衣美武公之意也黃曰臧武仲據防求後孔子曰雖曰不要君吾不信也曲沃以篡弒之逆而有晉國以春秋之法繩之罪不可赦而孔子遽録其詩而序者亦以為美武公此特美其請命一事耳蓋當時強陵弱衆暴寡諸侯不知有王也久矣晉武公以力雄晉國使其不請命於周周豈能伐之乎今猶能請命於天子之使則是知有王也齊桓晉文名為尊周而實欲富強其國孔子猶取之者取其彼善於此者也春秋書僖公朝于王所成公如京師皆美之之辭也有杕之杜刺晉武公也武公寡特兼其宗族而不求賢以自輔焉有杕之杜生于道左彼君子兮噬肯適我中心好之曷飲食之有杕之杜生于道周彼君子兮噬肯來遊中心好之曷飲食之李曰兼其宗族者言桓叔晉穆公之子桓叔既封於曲沃則晉國是其宗族也自桓叔以下常有并晉之心晉武公遂滅之是兼其宗族也既兼其宗族則是寡特也又不能求賢以共天位治天職以為股肱耳目之助其寡特可謂甚矣有杕之杜生于道左者道之東也孔氏曰王制云道路男子由右婦人由左在隂為右在陽為左道周者道之曲也此言木之生於道之東與道之曲故行者賴以休息今杜之特生陰涼寡薄人不得而休息焉猶之武公君子所願以仕遊而武公寡特此君子所以舍之而去耳王氏乃曰杜之實不足食也而又特生則其能庇人也寡矣然尚以生于道左生于道周其去人所往來之道不逺也君子逮肯適然而來遊然詩人言彼君子兮蓋指言晉之賢者非謂君子適我而來遊於杕杜之下也若如王氏之説則休息杕杜之下人人皆可也何必獨言君子哉爾雅曰噬逮也言君子之人亦有逮我國家肯適我者惟君子之中心有好賢之誠何但飲食而已乎苟能求賢以自輔則賢者恱而願仕於朝矣今也武公寡特兼其宗族既如特生之杜又不能舉賢以自輔但飲食之而已賢者豈肯以飲食之故而遲留不去乎周霄問於孟子曰古之君子仕乎傳曰孔子三月無君則皇皇如也出疆必載質又曰晉國亦仕國也未嘗聞仕如此之急也曰古之君子未嘗不欲仕又惡不由其道也惟其未嘗不欲仕至於出疆必載質此所以噬肯適我也惟其欲仕又惡不由其道彼雖飲食之而不能用賢者亦將自去之耳繆公之於子思也亟問亟饋鼎肉使已僕僕爾亟拜子思不恱曰今而後知君之犬馬畜伋者苟徒飲食之而不能用則其好之者非出於中心謂之犬馬畜伋者不亦冝乎張橫渠曰杜喬而少隂味不足嗜雖有來食者何以願肯適來而就養也噬食也此説是亦以彼君子兮噬肯適我連上文杕杜其説與王氏同如此則中心好之曷飲食之其文不相貫王氏曰愛之也仁而其敬之也有禮仁而有禮此君子所以適我而來遊以獲其助也然則武公之見刺必以不仁也必以無禮也道左者蓋以況仁道周者蓋以況禮詩言道左道周王氏以謂仁與禮如此則何之而不可為也其穿鑿至於如此楊龜山攻其説以謂道左非可以況仁道周非可以況禮使道左道周可以況仁況禮猶不可以為説況不可乎大雅文王之詩乃美文王受命作周之詩也其詩曰濟濟多士文王以寧又曰思皇多士生此王國此王國當文王創業垂統以基周室之初刑于寡妻至于兄弟其親戚之間多助如此猶以多士為務疏附奔走禦侮先後之人無不備者故傳曰文王猶用衆況吾儕乎今也武公始并晉國正是敷求賢人以共濟艱難之時乃兼其宗族而寡特又不能求賢自輔內無親戚之助外無君子之助其勢孤立如此譬如特生之杜固其冝也武公既并晉國乃兼其宗族遂以為不可用其意以為我既并國深懼人之謀我亦猶我之謀晉也至其子獻公患桓叔莊叔之族使士蒍與羣公子譖富子而去之既殺遊氏之子又圍聚而盡殺羣公子至驪姬之亂晉無羣公子自是晉無宗族獻公之寡特如此是亦武公有以遺之也使其無親戚而猶能求賢可也況不能求賢以自輔國之不亡也幸矣蓋能親親者必能用賢不能親親未有能求賢者也黃曰文王刑于寡妻至于兄弟其所以親睦九族者至矣而又有濟濟之多士疏附先後之人以為之輔助故傳曰文王猶用衆況吾儕乎今武公既併其宗族而無親親之心又不求賢以自輔而無左右之助此詩人所以刺之也其後獻公患桓叔莊叔之族至於盡殺羣公子驪姬之亂晉於是乎無公族是亦武公遺之也嗚呼去手與足尚足以為人乎晉武公自視其奪晉之罪而懼人之如已此即秦之所以亡也葛生刺晉獻公也好攻戰則國人多喪矣葛生蒙楚蘝音廉蔓于野豫美亡此誰與獨處葛生蒙棘蘝蔓于域豫美亡此誰與獨息角枕粲兮錦衾爛兮豫美亡此誰與獨旦夏之日冬之夜百歲之後歸于其居冬之夜夏之日百歲之後歸于其室李曰好攻戰國人多喪者按左傳晉獻公魯莊公十八年立至僖公九年卒在位二十六年傳稱晉伐驪戎驪戎男女以驪姬閔元年晉侯作二軍以滅耿滅霍滅魏二年晉侯使太子申生伐東山臯落氏僖二年晉師滅下陽五年晉侯圍上陽冬滅虢又執虞公八年里克敗狄于采桑見於左氏傳者如此是其好攻戰之明驗也惟其好攻戰窮兵黷武雖有克捷之功未嘗敗衄然其軍旅數起而國人多喪夫從征役其婦獨處於室故詩人陳其怨恨之辭以刺公也陸璣曰蘝似栝樓葉盛而細其子正黑如燕薁不可食也其莖葉煮以哺牛除熱渴葛生蒙楚蘝蔓于野者蓋言婦人託於夫猶葛之生蒙於楚蘝之生蔓於野今也國人多喪其夫既死則婦人無所依託曾葛之不如也故下文言豫美亡此誰與獨處豫之所美者夫也所美之夫既亡將誰與哉獨處而已域者塋域也息止也角枕粲兮錦衾爛兮毛曰齋則角枕錦衾鄭曰夫雖不在不失其祭也攝主主婦猶自齋而行事也二人之意以謂婦人其夫既不在當必有齋之事獨齋而行祭當齋之時出夫枕衾以思夫言此角枕粲然而鮮明錦衾爛然而色美雖有錦衾無人服用其説但據內則所謂夫不在斂枕篋簟席襡器而藏之然禮記所載但言夫不在非必有齋之事亦不當引此説此但其夫不在婦人獨寢因思其夫以及其物物存而人亡思之如此而已豫美亡此誰與獨旦鄭曰旦明也我君子無於此吾誰與齊乎獨自潔明王曰以息對旦則知旦者作也以旦對息則知息者夜也其説皆牽強不如程説曰獨處息至旦也夏之日冬之夜夏至日長晝六十刻夜四十刻冬至夜長晝四十刻夜六十刻夏之日冬之夜為最長當此之時思念之情尤切鄭曰極言之以盡情是也居與室皆墳墓也言生既不得見其夫要之百歲既死之後則可得見其夫也夫婦之道生則異室死則同穴故曰歸于其居歸于其室張橫渠曰葛得所託蘝不得所依傷已之不如也據詩言葛生蘞蔓之語皆是言得所託不必如此分别葛生婦人其情可謂切矣其義可謂髙矣始則謂己之託於夫如葛蒙楚蘞蔓野而乃思其夫不在無以為託而又感角枕之粲錦衾之爛以致其情既而又以夏之日冬之夜以致其思造次顛沛未嘗少忘於夫其情可謂切矣末乃言百歲之後歸于其室其義豈不髙乎此正唐國風也如柏舟詩曰之死矢靡他此詩曰百歲之後歸于其居亦是無二心也與柏舟詩無以異然柏舟乃美共薑齊侯之子衛世子之妻誓不再嫁為能守節至於此婦人居於微狹之中乃能如此可謂難能也黃曰獻公惟好攻戰則國人多喪故婦人思其夫之切思而不可得則以死自誓可謂義婦矣晉國當兵戈擾攘而孝子貞婦有如鴇羽葛生之詩者帝堯之風化盛矣哉采苓刺晉獻公也獻公好聽讒焉采苓采苓首陽之巔人之為言苟亦無信舍旃舍旃苟亦無然人之為言胡得焉采苦采苦首陽之下人之為言苟亦無與舍旃舍旃苟亦無然人之為言胡得焉采葑采葑首陽之東人之為言苟亦無從舍旃舍旃苟亦無然人之為言胡得焉李曰爾雅曰苓大苦也或以為甘草首陽毛氏云幽僻之地按首陽在河東蒲坂縣南安得為幽僻首陽山亦名首山亦名雷首山在河中平樂縣南巔頂也苦毛氏曰苦菜孔曰此荼也葑亦菜名蕪菁也采苓首陽之巔毛氏曰采苓細事也首陽幽僻也細事喻小行幽僻喻無徴也其意以謂獻公多問小行於小人言語無徴之人故所以讒言興也歐氏破其説謂首陽名山人所共見而易知者毛氏以為幽僻鄭氏以為無徴皆踈矣然謂細事喻小行則毛氏之説歐氏以無徴為鄭氏之説此則誤矣鄭曰采此苓於首陽山之上首陽山之上信有苓矣然而今之采者未必於此山然而人必信之興者喻事有似而非王蘇之説皆如此然王氏則以下文人之為言苟亦無信舍旃舍旃苟亦無然人之為言胡得焉連上采苓説按自人之為言以下皆是教獻公止讒之法不當連上文為説也鄭氏之説長於毛氏不如歐氏之説簡而明歐曰采苓者積少以成多如讒言積漸以成惑與采葛義同其首陽蓋興所見也而程氏謂首陽山生堅實之物以興讒誣之人不實其説陸農師曰讒人無所不至其害人也皆因其事而譖之也采苓因人之甘而譖之而采苦因人之苦而譖之葑有時而甘有時而苦言因人之甘苦而併譖之其穿鑿之甚以至於此旃鄭氏曰焉也陟岵詩曰尚慎旃哉鄭曰旃之也左氏曰其將聚而殱旃杜氏亦曰旃之也則旃字或為之或為焉蓋助語也人之為言苟亦無信舍旃舍旃苟亦無然鄭氏謂人為善言以稱薦之欲使見進用也旃之言焉也舍之焉舍之焉謂謗訕人欲使見貶退也則是以四句分為二事歐氏破其説謂以文意考之本是述一事而鄭分為二蓋其下文再舉人之為言胡得焉則舍旃舍旃者知非二事也王氏以謂人之造言不可以苟聽亦不可以苟舍此則王氏之心術也蓋此當從歐程之説以謂戒獻公以為聞人之言且勿聽信置之且勿以為然更考其言何所得焉蓋當深察其虛實也歐氏曰夫讒者踈人之所親疑人之所信奪人之所好非一言可效一日可為也必須積纍而後成或漸入而日深或多言而並進故曰浸潤之譖又謂積毁銷骨是以詩人刺讒多以積少成多為患惟其如此使人君不能無懼則以察其言無有不得其情矣觀獻公好讒以殺太子申生則知非一言可效一日可為其始也驪姬嬖欲立奚齊使外嬖梁五與東關嬖五言於獻公曰宗邑不可以無主必使太子居曲沃則可以威民而懼戎讒言始興如此及晉侯作二軍公將上軍太子將下軍以滅耿滅霍滅魏還為太子城曲沃分之都城而位以卿其讒言既興如此其後又使太子申生伐東山臯落氏公衣之偏衣佩之金玦克狄而反此則讒言又甚矣又告之太子祭于曲沃歸胙于公公田姬置諸宫六日公至毒而獻之公祭之地地墳與犬犬斃與小臣小臣亦斃姬泣曰賊由太子太子奔新城後縊于新城觀此則讒言之積纍也如此詩人喻之采苓冝矣然姬置諸宫六日非太子之為明矣為獻公者苟無以讒為信則其虛實自見矣昔漢蓋主上官桀與燕王旦通謀詐令人為燕王上書言光專權自恣疑有非常書奏昭帝曰朕知是書詐也將軍無罪以未能十日而知昭帝但以日之久近而察其譖使不以久近而察之則霍光是終有篡君自立之心使獻公能以日之久近而察之無以讒言而必信則安有太子之禍邪黃講同毛詩集解卷十三
