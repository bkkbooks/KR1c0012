body:
  text: 毛詩集解卷二十四宋李樗黃櫄撰十月之交大夫刺幽王也十月之交朔日辛卯日有食之亦孔之醜彼月而微此日而微今此下民亦孔之哀日月告凶不用其行四國無政不用其良彼月而食則維其常此日而食于何不臧􅏎􅏎於輒反震電不寧不令百川沸騰山冢崒崩髙岸為谷深谷為陵哀今之人胡憯莫懲皇父卿士畨維司徒家伯維宰仲允膳夫棸子內史蹶維趣馬楀音矩維師氏豔於贍反妻煽方處抑此皇父豈曰不時胡為我作不即我謀徹我牆屋田卒汙萊曰豫不狀禮則然矣皇父孔聖作都于向擇三有事亶侯多藏不憖魚郡反遺一老俾守我王擇有車馬以居徂向黽勉從事不敢告勞無罪無辜讒口嚻嚻下民之孽匪降自天噂子損反沓背憎職競由人悠悠我里亦孔之痗莫背反四方有羡於箭反我獨居憂民莫不逸我獨不敢休天命不徹我不敢效我友自逸李曰鄭氏以十月之交雨無正小旻小宛皆為刺厲王之詩不當為刺幽王之詩其意以謂毛氏作詁訓傳時移其篇第改厲為幽蓋以此篇之中疾豔妻煽方處又幽王之時司徒乃鄭桓公友非此篇之所云畨維司徒也但以此篇不當言畨維司徒故以此為厲王之詩蘇氏以為不終鄭桓公在幽王時與畨維司徒先後用事又褒姒以色居位謂之豔妻其誰曰不可當從此説觀鄭氏以詩所言艷妻與畨維司徒為厲王之詩其下雨無正小旻小宛亦以謂厲王其意以謂四序皆言大夫疑是一人之作其説未之敢信也十月之交日月交會也夫日行遲一年一周天月行速一月一周天日與月一年十二次交會其交會也或有日食之變故交會必於月朔日食必於月朔言此十月交會朔日辛卯也是時日有食之其醜莫大唐書志云十月之交以厯推之在幽王之六年則是為幽王之詩無疑矣日蝕而以厯推之則是當食也既是日之當食乃為變異之大者唐書志云古之太平日不食星不孛蓋有之矣若過至未分月或變行而避之或五星潛在日下禦侮而救之或涉交數淺或在陽厯陽盛隂微則不食或德之休明而有小眚焉則天為之隱雖交而不食此四者皆德教之所由生也蓋以日當食而不食則是有德者也日當食而不免於食則是無德者也春秋之時書日食三十六後世厯家皆能推之則是當食也日月交會而日必食雖日當食為人君者亦不可不自省而孔氏云日月交會於算可推而知則是雖數自當然而云為異者位貴居尊恐其志意易怠聖人假之神靈作為鑒戒爾夫以昭昭大明照臨下土忽爾殱亡俾晝作夜其為怪異莫此之甚故有伐鼓用幣之儀貶膳去樂之數皆所以重天變警人君也蓋不如是則當日食而使人君無戒懼之心是啓人君有怠慢之心也鄭氏謂辛金卯木也又以卯侵辛故甚惡也鄭氏溺於緯家之説故如此但日食自足以見其災異如春秋之書日食有不言日者豈不為災異乎彼月而微此日而微言月當有微細之時日不當微細也柏舟之詩曰日居月諸胡迭而微蓋日不當微今日月胡交迭而微惟日不當微而微故下民亦孔之哀言禍將及於下民也言日月告凶禍者以日月不用其常道也行道也望而正於黃道是謂臣干君明則隂斯蝕矣朔而正於黃道是謂日雍月明則陽為之食矣凡日月之蝕者皆不用其常道然其所以不用其常道者亦有故焉以四國為政不用其善人故也夫以不用善人而所用者莫非小人而致日蝕苟能用善人則足以消變異矣左氏曰國無政不用善則自取謫於日月之災故政不可不慎也彼月而食則維其常此日而食于何不臧夫以月食之變亦可以為變矣而乃以為維其常者王氏云月蝕非其常也然此日食以陽侵隂猶為常也其説是也春秋日食三十六月食則未嘗書豈其當時偶無月食邪亦其以為常故不書之也􅏎􅏎震電此章則言其為災異非獨日食也其災異交午旁至而又􅏎􅏎震電貌震雷也春秋書三月大雨震電周之三月乃夏之正月而有震電此其所以為異今此􅏎􅏎震電豈亦震電非其時邪惟其震電非其時則使天下不安寧不善之兆也百川之水皆溢出而相乘山之冢頂髙峯之上崒然崔嵬者皆崩落髙大之岸則陷為深谷岸應處上今乃陷而在下深下之谷則進出為陵矣谷應處下今乃進而在上變異如此今之人曽莫有懲艾之者仲舒云國家將有失道之敗天乃先出災異以譴告之不知自省又出怪異以警懼之尚不知變而傷敗乃至今幽王之時日食如此又有震電百川沸騰山冢崒崩髙岸為谷深谷為陵使能恐懼修省則日食之變必能自省矣況於震電之類乎惟其不知自省天欲扶持而全安之有所不可此所以亂亡也鄭氏云皇父家伯仲允皆字畨棸蹶楀皆氏蘇氏云人各有常官皇父則皆總其權故以卿士目之豔妻指褒姒也美色曰豔左傳曰美而豔煽熾也言此羣小人用事而褒姒其勢方熾與之羣處夫以小人用事已足以致危亂之機而況於羣小人之用事又有豔妻交結於內則其勢蟠結於朝廷之上不可解也商紂之時在朝廷則飛廉惡來之徒用事於內則有妲已焉明皇之時在朝則林甫國忠用事在內則有楊妃焉幽王之時在外則有皇父之徒在內則有褒姒焉內外為患如此安得不招致災禍哉此詩上三章則言災異之事下四章則言災異之由所用者非其人也西漢之末有日食則多責之大臣夫災異之興則大臣所不能無罪也然而人君亦當責已漢之君不能責已而責於大臣後世所以譏議之今幽王之時天變如此君臣皆有罪故責外所用之人又責其內寵者言其所以致之之由也豔妻或以為閻妻則是厲王之時當從王氏以為褒姒抑此皇父肯自以為不是乎言其不自知惡皆謂已為是也汝何為使我役作不先就與我謀遂毁其牆屋使失其業而田卒為汙萊乎下荒曰汙上荒曰萊皇父虐民如此猶不知反曰我不殘害汝在禮法下當供上役也若以為下供上役果合於禮則秦始皇驪山之役亦可以為禮乎此皆皇父文過飾非所為言無不偽是也已之為非則自以為是已之害民而自以為禮此蓋多行不義者也下章則又言皇父之欺君皇父孔聖言皇父自以為聖也當時君臣皆自以為聖故不肯求賢以自輔惟不忠之臣自以為聖故未嘗求賢以輔君作都于向向邑也作都于向之時則所擇之卿皆貪淫多藏之人曽不且憖遺一老使之守衛我王鄭氏謂憖者心不欲自強之辭也左傳曰不憖遺一老杜預注曰憖且也當從其説又擇其富有車馬者以往徂向此皆言皇父不忠之狀也當時大夫黽勉以從於王事雖勞亦不敢自訴猶且遭讒口之衆多況敢告勞乎苟告勞則罪日多矣下民之妖孽非自天降噂噂沓沓相對談語背則相憎逐其主凡此者皆由人也觀此詩日食震電山崩之變皆是人為之致非自天也故為君者當責其在已而已矣言我悠悠居今之世可為甚病而四方之民有饒羡而我獨居此憂四方之民皆享逸豫而我獨不得間暇非不能休也以天命至此不久故我不敢效我友之逸也茍欲自逸則安知他日不為禍邪觀幽王之時豈四方之民盡皆有饒羡者豈四方之民盡優遊而自逸哉如所謂不冝空我師則四方無有饒羡矣所謂卒勞百姓則民莫克有逸矣乃為此言者蓋大夫方言其已之勤勞憂思故為此辭學詩者當以意逆之雨無正大夫刺幽王也雨自上下者也衆多如雨而非所以為政也浩浩昊天不駿其德降喪飢饉斬伐四國旻天疾威弗慮弗圖舍彼有罪既伏其辜若此無罪淪胥以鋪周宗既滅靡所止戾正大夫離居莫知我勩三事大夫莫肯夙夜邦君諸侯莫肯朝夕庶曰式臧覆出為惡如何昊天辟言不信如彼行邁則靡所臻凡百君子各敬爾身胡不相畏不畏于天戎成不退飢成不遂曽我暬思列反御憯憯日瘁几百君子莫肯用訊聽言則答譖言則退哀哉不能言匪舌是出維躬是瘁哿矣能言巧言如流俾躬處休維曰于仕孔棘且殆云不可使得罪于天子亦云可使怨及朋友謂爾遷于王都曰豫未有室家鼠思息嗣反泣血無言不疾昔爾出居誰從作爾室李曰詩之名篇皆掇取詩中之文以為之惟雨無正酌賚般四詩篇名皆詩中無其文則别撰其名考諸左傳宣十六年酌曰於鑠王師遵養時晦耆昧也則知此篇其來久矣非必詩者之意然酌般賚三詩命名之義猶可曉惟雨無正為難曉作序者之説曰雨自上下者也衆多如雨而非所以為政也雨自上而下譬政自君出其文不貫兼中所謂雨自上而下與夫衆多如雨其意皆不見徐安道曰正大夫三事大夫邦君諸侯皆自肆與凡百君子不敬其身可謂衆多如雨此皆附會而為之説未可深信以為然也此當闕之以俟知者浩浩廣大之意駿長也幽王之時天下被其虐無可奈何而歸之於天曰天之於民其始也德甚大今乃不終其德既生之矣又從而禍之以至喪亂飢饉之災以斬伐四方之國所以歸其禍於天也蓋人之情疾痛則呼天本非天之不仁也其實召此禍者幽王之罪也人之為此言者特歸之於天而已亦甚其君之辭也旻天之威如此迅烈幽王弗之謀有罪既服其辜今則舍之而不問無罪者乃淪胥陷溺而偏及焉豈畏天者之所當為哉夫天討冇罪五刑五用哉有罪者天之所討也畏天者亦在順天之所討罪之意而已今也非特有罪不之討而無罪者又且濫及焉有罪者不可舍而舍之則惡者無所懲無罪者當舍而不舍則善人無所恃所為如此將見上天震怒而不佐其國也周宗既滅宗周鄭氏曰鎬京也徐安道曰宗周者周為天下宗也言宗周則在鎬京此蓋祖鄭氏之説不如蘇氏之説曰周宗姬姓之宗族皆破滅無所底定則幽王之勢孤矣而其臣下皆離散故繼之以正大夫離居莫知我勩三事大夫莫肯夙夜邦君諸侯莫肯朝夕正大夫者大夫之長也鄭氏曰上公也王肅則以三事為三公大夫乃其屬孔氏以鄭氏之説為然王肅不合分為二徐安道以謂周官曰三事暨大夫舉三公及大夫也其説為有據當從王肅徐安道之説言此大夫之長離散而居莫有知我民之勞勩以至三公大夫及諸侯無肯夙夜朝夕以省視王事其君臣解體如此夫三事大夫邦君諸侯冝其日當修省懼而為善今乃反而為惡以見其無遷善悔過之心也夫幽王上則為天所怒下則為民所怨內則宗族破滅外則羣臣諸侯攜二其孤立無侶而不之懼此所謂安其危而利其災樂其所以亡者不然則何亡國敗家之有哉如何昊天此又言王之為惡常自樂而不知自悔故呼天而告之以為何如以法度之言而人不信乎今王所為如此如行道之人不知所到言茫茫然而無所止定也猶所謂譬彼舟流不知所屆也雖然王之所為固不然矣凡百在朝之臣亦當敬其身耳蓋為王止於仁為臣止於敬君雖不仁臣不可以不敬父雖不慈子不可以不孝又責之曰胡不相畏乎汝不自相畏則是不畏於天也此句正猶孔子所謂吾誰欺欺天乎欺其心是欺其天耳不相畏是不畏於天也人欲知所以不欺天者不在乎他在不欺其心耳戎成不退戎兵也遂進也蘇氏以易曰不能退不能遂為證暬御國語居寢有暬御之針此言兵勢已盛不能退是無弭亂之道也飢饉已成不能遂是不能兆豐年也胡為使我小臣憯憯日瘁暬御侍御之臣也侍御之臣憯憯然而瘁而在位之臣無肯以此相告聞可聽之言則受其善而答之答之而未嘗行聞譖訴之言則拒其言而退止之蓋言不肯任其責也哿可也此言哀我之不能言者非出於舌之難出於舌則躬受其瘁矣當時之所謂能言者乃可於人意蓋以其巧言如水之流轉而躬受其休矣自古禍亂之世正人才出一言則必受其禍為正人者故多全身逺害緘默而不言不然則為泄冶之徒由是觀之其當時之緘默而不言者乃為不能言而喋喋自恣無所忌憚乃當時之所謂能言者維曰于仕此章言幽王之世而仕者可謂危且怠矣其曰不可使者則得罪於天子其曰可使者則怨及於同列則其仕豈不危且殆哉蓋天子欲其臣之盡瘁也今也言不可使則得罪於天子矣同列欲其同惡相濟今也以為可使則怨及同列也謂爾遷于王都鼠思憂思也此章言當時之臣離散而去也雨無正言大夫命之遷來王都其去者則以無家為辭也而此大夫乃憂思泣血無有出言而不我疾也蓋吾之心在於為國則其出言無非為國在朝無有為國者聞吾之言則皆疾吾也今命之遷來王都則彼無不疾我矣既而又責之曰昔爾出居於外誰作爾室亦有作之矣今乃以無室辭我何哉此蓋責之之深也幽王之時大臣無有以憂國為心小臣則有憂國之心正月之尹氏十月之皇父所謀者皆無憂國之心至於小臣雖有憂國之心亦何補哉小旻密巾反大夫刺幽王也旻天疾威敷于下土謀猶回遹音聿何日斯沮在吕反謀臧不從不臧覆用我視謀猶亦孔之卭其凶反潝潝許急反訿訿音子亦孔之哀謀之其臧則具是違謀之不臧則具是依我視謀猶伊于胡砥之禮反我龜既厭不我告猶謀夫孔多是用不集發言盈庭誰敢執其咎如匪行邁謀是用不得于道哀哉為猶匪先民是程匪大猶是經維邇言是聽維邇言是爭如彼築室于道謀是用不潰于成國雖靡止或聖或否方九反民雖靡膴或哲或謀或肅或艾音刈如彼泉流無淪胥以敗不敢暴虎不敢馮河人知其一莫知其他戰戰兢兢如臨深淵如履薄冰李曰鄭云所刺列於十月之交雨無正為小故曰小旻孔氏遂廣其意謂十月之交言日月告凶權臣亂政雨無正言宗周既滅君臣離散皆是事之大者此篇惟刺謀事邪僻不任賢者是其事小於上篇也此其為説不足信然鄭氏既以小旻為政教比於十月之交雨無正為小至於小宛之詩亦曰政教為小是二説固同矣至於小辨乃太子之事太子之儲事非小事也則其説不行又别為之説以謂鸒斯小鳥故曰小辨則其説自相異同如此不如蘇氏之説曰小旻小宛小辨小明四詩皆以小名篇所以别其為小雅也其在小雅謂之小明在大雅者謂之大明召旻獨宛辨闕焉意者孔子刪之矣其説是也蓋如叔于田大叔于田之詩以大加於叔于田之上特以為之别爾其所以小大者非有深義於其間也旻天疾威旻天説文曰秋天也王肅曰仁覆閔下曰旻天疾威敷于下土蓋言旻天之威迅烈敷于下土也沮止也王氏曰王者隆寬博愛以得天下之心而天下樂告以善道則無所事於疾威天下之善衆至如至誠由直道以圖天下之事有餘裕矣則無所事於回遹其意以疾威刺幽王非也蘇氏曰天禍迅烈遍於下矣而王之邪謀終莫之改也此説是也蓋言幽王不畏天禍天禍降於下不知所以順天使天有悔禍之意今乃偃然自若信用邪謀則天之禍何時而止也其謀之善者則不從其不善者則反用之夫所貴乎聽諌者惟欲其善者而從之其不善者則不從之今幽王之聽謀如此故我視其謀猶則但見其甚病也卭病也自古昏君暗主之聽謀雖曰善者不從不善者反從之原其本意豈固意必從不善者之謀哉蓋其意以臧為不臧而不臧者反以為臧也昔苻堅信慕容垂之謀而南伐晉後唐廢帝信薛文遇之謀而移敬塘節鎮當時羣臣皆以為不可而二帝獨以為謀之善自今觀之則其謀不善自當時觀之則當時之君必以為成功也潝潝訿訿毛氏曰潝潝然患其上訿訿然思不稱其上説文亦曰訿訿意不稱也孔氏推廣其説以謂小人在位皆潝潝然自作威福患苦其上訿訿然競營私利不思稱其上其説皆不甚明爾雅曰潝潝訿訿莫共職也韓詩亦曰不善之貌其説又不分别二字之説為何如王氏曰潝潝苟有所合也訿訿苟有所毁也王氏此言雖以字生義然實得詩人之意劉向曰衆小在位所從邪議潝潝相是而背君子蓋同乎已者則以為是異乎已者則以為非則王氏之言實與之暗合蘇氏曰潝潝言相和也訿訿言相詆也亦是此意蓋言小人之好惡如此則是可哀也小人之黨甚固故其謀之善者則相與違之謀之不善者則相與從之故作詩者視其謀猶則安所止乎左傳曰天祚明德有所砥止祈父之詩亦曰靡所砥止皆是訓至之意我龜既厭不我告猶易曰再三瀆瀆則不告今幽王之時卜筮既數故龜亦厭之不告其猶也其所謀者大多是非混淆故是用不集其發言者訩訩滿庭無能決其是非孰敢執其咎哉蓋所謀者一二而已則必有自任其責者所謀既多孰肯執其咎責哉左氏楚子伐鄭其六卿欲從楚其三欲待晉子駟曰請從楚騑也受其咎如此則所謂執其咎苟執其咎則為事必欲遂事苟不遂則自受其辜今也徒為其謀而不執其咎此所謂作舍道傍三年不成會禮之家名為聚訟也如匪行邁謀是用不得于道鄭氏曰君臣之謀事如此與不行而坐圖逺近是以道路無進於跬步何以異乎王氏之説亦如此不如蘇氏之説曰譬如欲行而不先為行邁之謀隨人而妄行亦是終不得其道也哀哉為猶此章言當時之為謀非以古人為法言任其私意爾如國猶而經理之但其目前之細務非國家之要務也其所聽受者皆邇言其所爭辨者亦邇言無逺圖也夫謀之逺者近於迂闊而難行謀之近者近於切要而易用故近雖有小利而其害隨至逺謀者雖目前未見其利而可以終身無害自非聽之者明安能慎擇而用之哉如彼築室於道謀於行道之人路人之意不同故不得遂成也所謂作室道傍三年不成是也國雖靡止或聖或否止定也聖哲謀肅乂此洪範之五事蓋指當時之賢者也膴大也言國中雖未定而有或聖或否者民雖小而哲謀肅乂者王當慎擇而用之無使如泉之流陷溺而敗也自古禍亂之興雖曰小人為之君子並受其禍幽王之時民之有聖哲謀肅乂者雖其國之危亂非已之所為而其受禍則一也不敢暴虎不敢馮河徒涉曰馮河徒搏曰暴虎虛手而摶虎無舟而涉河此皆人所易見故不敢也然常人之情但知其一自此之外而不知其他也喪國亡家之禍自非明哲君子莫有知者故我心之憂戰戰兢兢如臨深淵如履薄冰惟恐其墜也惟恐其陷也言人皆莫知其他則戰戰兢兢惟此大夫獨如是也觀正月之詩謂天蓋髙不敢不局謂地蓋厚不敢不蹐自常人觀之以天之髙又何待於不敢不局也以地之厚又何待於不敢不蹐也惟其知禍亂將至常人以為無害君子以為理之必至也小宛大夫刺幽王也宛彼鳴鳩翰胡旦反飛戾天我心憂傷念昔先人明發不寐有懷二人人之齊聖飲酒溫克彼昏不知一醉日富各敬爾儀天命不又中原有菽庶民采之螟音冥蛉音零有子蜾音果螺力果反負之教誨爾子式榖似之題彼脊令音零載飛載鳴我日斯邁而月斯征夙興夜寐無沗爾所生交交桑扈率場啄陟角反粟哀我填寡冝岸冝獄握粟出卜自何能榖溫溫恭人如集于木惴惴之瑞反小心如臨于谷戰戰兢兢如履薄冰李曰宛小貌翰者毛氏以為髙不如蘇氏以為羽也言以鳩之小鳥而羽飛欲至於天也毛氏曰行小人之道責髙明之功終不可得蘇氏亦曰宛然鳴鳩而求戾天亦難矣以小人而責其繼文武之功亦難矣此説與毛氏同而歐陽深破毛氏之説以謂小宛大夫刺幽王敗政不能繼先王之業其曰宛彼鳴鳩翰飛戾天云者謂此鳩雖小鳥亦有髙飛及天之志幽王不自勉強奮起曽飛鳩之不如以墜其先王之業此説是也蓋以鳩之小鳥而猶有髙飛及天之志而幽王乃不能勉強行道而墜文武之業是飛鳩之不如也王氏之意亦與歐氏同惟幽王既不勉強於此矣故我心憂傷念昔先人先人指宣王也宣王能夙興夜寐故能成中興之功今幽王乃自怠自棄無興復之心則文武之業墜矣故念昔先王以傷幽王不能然也蓋治亂之分勤與怠而已成天下之事者莫先於勤壞天下之事者莫先於怠文武造周家之業亦曰憂勤而已宣王成中興之功亦曰憂勤而已惟其憂勤故能興文武之業也周公思兼三王以施四事其有不合者仰而思之夜以繼日幸而得之坐以待旦周公思兼三王是亦宣王之有懷二人也周公坐以待旦是亦宣王之夙興夜寐也周公惟其勤故能守文武之業宣王惟其勤故能興文武之業今幽王乃不能如此此周之所以衰也先人毛氏曰文武也而孔氏廣其説以謂王無德而念其先人又云有懷二人則所念二人而已歐氏以先人為宣王是矣而又以有懷二人謂下章所謂二人刺王云人誰不飲酒一人則齋肅通明雖飲而溫克一人則昏愚無知但以沈醉苟一日之樂此又曲説徐安道曰幽王之先人既勤思文武之道此為得之齊聖書曰昔在文武聰明齊聖史記亦曰幼而徇齊毛氏曰正也齊聖聰明之稱言齊聖人之飲酒溫則和而無不容克則能勝己之私正所謂不為酒困是也彼童昏無知之人益醉日富鄭氏曰童昏無知之人飲酒日醉自謂日益富夸淫自恣以財驕人此不如陳少南之説益富也付朝夕於醉而日以增益也惟幽王之時如此故戒之以各敬爾儀天命不又王氏曰言各者則并戒其羣臣也各敬爾儀者以天命不又也又復也天命不再來也汝既以酒敗則天必罰之而其命不再來矣治積昧醉而亡其喪宋君曰醉足以亡喪乎對曰桀以醉亡天下則天威其可不欽哉中原有菽歐氏以此二句為勸勉王為善之意言中原有菽庶民皆可往采采者無不得也世有善道凡人皆可為為則得之矣王何獨不為也又言人性之惡可變而為善譬如螟蛉之子教誨之則可使變其形而為蜾螺子也此言雖無害然不如且依毛鄭之説從毛鄭之説則與上文相貫上文既言天命不又故此申述其天命無常之意言菽生於中原惟有力則采得之以譬人君之位無常惟有德者則得之螟蛉之子蜾螺負之以為己子以譬幽王苟不能養其民亦將有德者養之以為己之民也式用榖善也教誨其子而善從之所謂類我類我是也陸農師曰蜾螺取桑蟲負之七日而化為子其祝聲可聽法言云祝之曰類我類我蓋其音之然也夫天下不可以常有也商之季而有周正如有力者之采菽蜾螺之負螟蛉豈可常哉惟有德者則得之題彼脊令題視也脊令雍渠也視彼脊令之鳥或飛或鳴未常止息人亦當如是我日猶言此日也日既往矣月將行矣日月之逝其速如此幽王冝夙興夜寐庶無忝於所生矣所生指宣王也宣王能明發不寐有懷二人幽王苟能夙興夜寐則不忝其父矣交交桑扈交交毛氏曰小貌歐氏破其説以謂交交者往來貌率循也桑扈竊脂也陸璣注曰青雀也好竊人肌肉脂及膏故曰竊脂也桑扈食肉之鳥未嘗食榖也淮南子曰馬不食脂桑扈不食粟非廉也則是桑扈未嘗食粟也今也循場食粟則非其所冝矣亦猶我之填弱鰥寡而乃以為冝入於岸獄則亦失其所矣此所以可哀也民之不可以入岸獄亦桑扈之不可食粟今幽王乃以為冝正所謂倒置也幽王苟握粟以試之桑扈自何能食粟乎不能也能知此則知岸獄非民之所冝也溫溫恭人言幽王之暴虐如此則廷之臣危懼而不自安故我溫溫恭人如集于木恐其墜也惴惴小心如臨于谷恐其隕也戰戰兢兢如履薄冰恐其陷也夫以漢文帝之時漢興二十餘年天下和治而賈誼猶以為抱火厝積薪之下況幽王之時天怒人怨禍亂之至理之必然當時在朝之臣當何如哉毛詩集解卷二十四
