body:
  text: 毛詩集解卷二十六宋李樗黃櫄撰蓼音六莪五何反刺幽王也民人勞苦孝子不得終養爾蓼蓼者莪匪莪伊蒿哀哀父母生我劬勞蓼蓼者莪匪莪伊蔚哀哀父母生我勞瘁瓶之罄矣維罍之恥鮮民之生不如死之久矣無父何怙音户無母何恃出則銜恤入則靡至父兮生我母兮鞠我拊我畜我長我育我顧我復我出入腹我欲報之德昊天罔極南山烈烈飄風發發民莫不榖我獨何害南山律律飄風弗弗民莫不榖我獨不卒李曰此言幽王之世天下之人苦於征役孝子不得以終身養爾鄭氏曰不得終養者二親病亡之時時在征役之所不得見也歐氏以為滯泥之甚矣然觀此詩之言出則銜恤入則靡至則是言孝子行役而喪親之所作也蓼長大貌猶所謂蓼彼蕭斯也鄭氏曰莪已蓼蓼長大我視之以為非莪反謂之蒿興者喻憂思在征役中心不精識其事王氏亦同此說歐氏則破之以謂以文害辭故其辭以謂民人苦於勞役不得終養於父母見彼蓼蓼然長大者非莪即蒿彼草木之微者其茂盛如此由天地生育之功也思我之生也父母養育我亦劬勞矣而我不得終養以報之也其說比於鄭氏為優然不如蘇氏之說莪蘿蒿也莪蘿可食而蒿不可食采莪者將以食之譬如生子者將賴其養也幽王之世孝子行役而遭喪哀其父母生己之勞而終不得養如采莪者之得蒿也哀哀父母生我勞瘁言父母之生我亦劬勞矣今乃不得養其父母此所以可哀也凱風之詩以凱風喻父母以棘心喻其子棘心難長之木也而凱風吹之而至於夭夭亦可謂劬勞矣父母之於我如此今我殊無以報之其心如何哉蔚牡菣也此章亦是上意罍爾雅曰小罍謂之坎注曰罍形似壺大者受一斛蓋瓶小而罍大也罄盡也鄭氏以謂刺王不使富分貧衆恤寡其說不類王氏皆以瓶喻民罍喻王瓶罄則為王之恥鮮毛氏以為寡鄭氏遂箋之以謂供養日少王氏亦以為其禍己熾則民鮮矣故謂之鮮民皆不如蘇氏以鮮為善言民以初生為善今也孝子行役而不得以終養父母是不如死之久矣北山之詩曰鮮我方將亦是善也善者蓋善生惡死人之常情矣舊時以生為善今既如此不如死矣銜恤憂也言無父何所怙乎無母何所恃乎其出則抱憂思而去其入也則不見父母如無所至此以傷痛之甚也父兮生我母兮鞠我此以見父母之恩大也父兮則生我母兮則鞠我拊我畜我長我育我此皆重復言其生育之恩以見其恩之厚也顧我復我言其周旋反復於我其恩如此出入又腹我腹懷抱也言受其恩如此我欲報之當何如哉故其心之欲與天無極也鄭氏曰我欲報父母是德昊天乎我心無極非也南山烈烈然寒飄風發發然而疾皆以興王之虐政下章亦是此意鄭氏曰民之自苦見役視南山則烈烈然飄風發發然而寒且疾也此非詩人之㫖律律猶烈烈也弗弗猶發發也民莫不得以相養而我獨何害而遭此又不得以終養也故曰民莫不榖我獨何害我獨不卒晉王裒讀詩至哀哀父母生我劬勞未嘗不三復流涕門人受業者亦廢蓼蓼者莪之篇蓋此詩辭哀而切讀之易使人感動正如凱風之詩述父母劬勞之志亦無不切不讀此詩無以見孝子之志孟東野之詩以其草比其子以陽春比父母寸草不足以報陽春之德蓋本諸此推父母之劬勞如此故其子欲報其德其心無有窮己也嘗考於詩凱風之詩惟欲其父母能安其室之詩也小辨之詩太子見弃之詩也蓼莪孝子不得終養之詩也惟其父母不能安其室故其心思有以教之惟其不得終養父母故其哀慕如此向使不困行役不見弃於父母與夫父母能安其室則其歡欣之情可見矣讀詩當以此類求之人惟不得事其父母所以哀慕不已讀是詩亦可以興發矣大東刺亂也東國困於役而傷於財談徒南反大夫作是詩以告病焉有饛音蒙簋音鬼飱音孫有救音蚪棘七周道如砥其直如矢君子所履小人所視眷音卷言顧之潸所姦反焉出涕音體小東大東杼柚其空糾糾葛屨可以履霜佻佻公子行彼周行既往既來使我心疚有洌氿泉無浸穫薪契契寤歎哀我憚人薪是穫薪尚可載也哀我憚人亦可息也東人之子職勞不來西人之子粲粲衣服舟人之子熊羆是裘私人之子百僚是試或以其酒不以其漿鞙鞙佩璲不以其長維天有漢監亦有光跂彼織女終日七襄雖則七襄不成報章睆彼牽牛不以服箱東有啓明西有長庚有救天畢載施之行維南有箕不可以簸揚維北有斗不可以挹酒漿維南有箕載翕其舌維北有斗西柄之揭李曰此詩言東方之國偏困於賦役民財殫竭故談國大夫作詩以告病焉談國在王室之東春秋書齊師滅談杜元凱注曰在濟南平陵縣西南饛滿簋貌飱熟食救長貌下章有救天畢亦是此意棘匕以棘木為之匕所以載鼎實也有饛簋飱有救棘匕鄭氏以此二句為喻古者天子施豫之恩於天下厚王氏亦曰周之盛時饋諸侯之賔客以飱而饛其簋又有救然之棘匕以載鼎實則其盛饋可知矣言其遇人之厚如此然不如歐氏以為足於豐饒之辭蓋當幽王之時東方之國賦役煩重民財困竭故思先王之時諸侯富饒其簋之飱饛然而滿其鼎之匕救然而長蓋其時周之所取於諸侯者其平如砥石之平其直如矢之直君子之人則履而行之小人則瞻而視之君子小人蓋指當時在位在下也正如論語所稱君子學道則愛人小人學道則易使也君子有勇而無義為亂小人有勇而無義為盜其曰君子小人者皆是分别貴賤上下之稱也惟君子履此道而行小人瞻而視之今乃不然故我從今反而顧之則潸然出涕傷今之不如古也小東大東杼柚其空此章言東方之賦重至無小無大皆取於東使我杼柚其空其勢困乏則以糾糾然之葛屨履霜而行其公子則佻佻獨行至於周之行列皆是餫送而去或往或來不勝其勞此我心所以疾病也鄭氏曰言談人自虛竭餫送而往周人則空盡受之曽無反幣復禮之意是使我心傷病也歐氏以此為非詩人本義蓋此詩但言東人輸賦往來以是心疾殊無報幣復禮之事也此鄭氏所以為衍說也有洌氿泉此章則言民困於賦役欲王者少寬之也易曰井洌寒泉氿泉側出泉也穫刈也鄭氏以為穫落木名其說本於爾雅不然毛氏以為刈契契憂苦貌憚勞也此言薪已刈矣以氿泉浸之則必腐敗而不可用民已勞矣以重役困之則必將困窮而死故談大夫契契然而憂苦於寢寐之中而感歎東人之劬勞也尚庶幾也言已刈之薪庶幾可載而歸以為用亦猶我人亦可息之而使安堵也歐氏曰彼刈薪為水浸而腐壞尚可載刈若斯人者勞苦而困弊則將死矣故言可以休息之也此說雖無害然非詩人之意但言薪尚可載民亦可以休息但以二事相此也東人之子此章則言東人之勞西人之逸也東人之子自以其職為勞苦王國曾無有勞來之者西人方且盛其衣服粲粲然而自得以至水居之人亦衣熊羆之裘言以賤人而服貴者之服也私人之試百僚皆言小人得志紀綱敗壞無復王室之舊也或以其酒歐陽公曰言當飲漿者今飲酒矣非也此蓋言或醉以酒或不以漿或醉以酒言小人之得志也或不以漿言君子之不得任用也璲玉也佩璲以玉為佩也鞙鞙佩玉之貌也佩玉之貴者不以其才之長皆是小人用事故東方之賦重而不均也漢天河也言維天有漢監視於下亦有光矣今胡為不察此邪以言王之不明也跂然三隅之形者彼織女也七襄從旦而暮七辰一移因謂七襄襄駕也人之織也經緯往來報反成章今此織女之星名雖曰織不成報章徒有其名耳睆明星貌牽牛河鼓也服較也牝服八尺曰較箱兩較間也牽牛之星名曰牽牛牽牛其用在服箱也今此牽牛之星徒有其名而不可用之於服箱也啓明爾雅曰明星謂之啓明孫炎曰明星太白也出東方髙三舍今曰明星昏出西方髙三舍今曰太白觀此則啓明即是太白也長庚不知是何星毛氏云只是一星故後世亦以長庚為太白李白字太白白之生母夢長庚因以為名韓退之詩曰太白伴月蘇東坡詩亦曰長庚到曉猶陪月觀此則是以長庚為太白也鄭漁仲乃謂啓明金星長庚水星金在日西故日將出則東見水在日東故日將沒則西見此詩曰東有啓明西有長庚則又似是二星不得渾而為一也不如待知天文者而問之也此蓋言啓明長庚徒有光明而不知監察於下也救畢貌畢所以掩兔所謂田獵畢弋是也今此畢星徙有其名但施之於行列言不可用也箕可以簸米今南方之箕徒有箕之名而不可以簸揚箕星四二為踵二為舌踵狹舌廣故曰翕其舌北方之斗徙西其柄之揭然耳不可以挹酒漿許慎曰揭髙舉貌故不可以挹酒漿也歐氏曰天雖有織女不能為我織而成章雖有牽牛不能為駕車而輸物雖有啓明長庚不能助日為晝俾我營作雖有天畢不能為我掩捕鳥獸雖有箕不能為我簸揚糠粃雖有斗不能為我以挹酒漿其意以末章不關重役事故為此說上章既言西人之子粲粲衣服舟人之子熊羆是裘私人之子百僚是試等句故此併言百官具位莫有其實故賦役之不均必自小人用事之所致乃若君子之所為必以寬其賦役均其勞苦必不至於此也古人多以箕斗為虛名蓋此數星皆取人間器用之物為有其名而無其實故詩人以為喻而歐陽乃以為若必刺官司失職則日月星辰名職至多宜舉其大而要者義與王官相近方可以為善譬此則非也嘗觀唐盧同月蝕詩厯言星辰不救月蝕之事其體製正類此詩蓋此詩之作本無意於為文後之作者必求其法而放效之能知此則可以為詩矣四月大夫刺幽王也在位貪殘下國構禍怨亂並興焉四月維夏六月徂暑先祖匪人胡寧忍豫秋日淒淒百卉具腓亂離瘼矣爰其適歸冬日烈烈飄風發發民莫不榖我獨何害山有嘉卉侯栗侯梅廢為殘賊莫知其尤相彼泉水載清載濁我日構禍曷云能榖滔滔江漢南國之紀盡瘁以仕寧莫我有匪鶉匪鳶翰飛戾天匪鱣匪鮪潛逃于淵山有蕨薇隰有杞桋君子作歌維以告哀李曰徂往也鄭氏曰四月立夏矣至六月乃始盛暑興人為惡亦有漸非一朝一夕非也詩言徂者乃暑既往非是方盛也王氏以為四月維夏而六月徂暑則陽運而往矣往者屈也來者伸也陽屈而隂信則是由小人之道長此其所以亂也此說雖無害然亦不必泥於君子小人之說蓋此詩三章頗有次第一章則言夏時二章則言秋日三章則言冬日四月之時陽氣方盛至六月而暑往矣是其萬物微衰之漸其後遂為冬則其衰甚矣以喻幽王之政暴虐愈甚也四月維夏六月徂暑乃夏之四月六月也若周之時則以夏之二月為夏而周之六月乃夏之四月也不得為徂暑周時又用夏朔者蓋周雖自有正朔而夏之正朔亦不廢也如周官言正月之吉始和是周之正月也正嵗則贊教法如初此夏之二月如食齊視春時羮齊視夏時醬齊視秋時飲齊視冬時此皆夏之時也食齊視春時食宜溫也若用周之春則是十一月十二月也豈得為溫乎羮齊視夏時羮冝熱也若用周之夏則是二月三月也豈得為熱乎以至秋也冬也亦然以此觀之詩人之言有指周時者也有指夏時者也不可泥也先祖匪人胡寧忍豫此兩句頗難說諸儒之說固多未必是詩人之意一云上之人以我先祖為非人乎胡為忍加殘虐於我也苟以我先祖為人則當以人類待我不當視若土芥而無有不忍人之心正猶何草不黃之詩刺幽王之視民如禽獸故其詩亦曰哀我征夫獨為匪民皆言幽王不以人視人也王肅曰征役過時曠廢其祭祀我先祖獨匪人乎王者何為忍不憂恤使我不得循子道此詩固無大夫祭祀之事不得以此為說鄭氏曰我先祖非人乎人則當知患難何為使我當此亂世乎此說雖是然亦未之盡歐氏因其說之未盡以為作詩之大夫斥其先祖此失之大者也詩人之意決不如此孟子曰說詩者不以文害辭不以辭害志以意逆志是為得之此兩句當以意求之儻不以意求之則是先祖匪人胡寧忍豫乃是斥先祖也亦猶所謂不自我先不自我後若以是求之則必以謂貽禍於父母子孫為人而斥其先祖貽其禍於父母子孫豈人也哉豈夫子所取之詩哉其曰先祖匪人胡寧忍豫者言先祖非人乎胡為使我至於此也其意則謂先祖亦人也必不使我至於此也然則我之取禍自何來哉若泥於先祖匪人則是斥其先祖也子細觀之謂先祖乃是人我之此禍非先祖之罪也此豈斥其先祖哉秋日淒淒此章遂言貪殘之政下民困病如秋日淒淒然而百草俱病也亂離瘼矣爰其適歸此傷離散以為亂者也家語以爰為奚詩人本意未必不如是也沈內翰曰書之闕誤有可見於他書如詩言天天是椓後漢蔡雍言天天是椓與蔌蔌方有榖為對又彼徂矣岐有夷之行朱浮傳作彼徂矣岐有夷人行愚亦從此家語奚其適歸可以見其詩之闕誤言下民罹此亂離之病何所適歸乎冬日烈烈飄風發發言幽王之虐政愈甚如冬日烈烈然而甚虐飄風發發然而疾則其暴虐甚矣民莫不榖我獨何害民莫不得養其父母我獨何為遭此禍也幽王之時天下莫不被其禍乃云民莫不榖者此特據父母之家民莫不得以養其父母而我獨不能蓋傷己遭亂之甚也山有嘉卉侯栗侯梅此章言貪殘也諸家徒見詩以栗梅為嘉卉遂以為生於栗梅之下據詩言侯栗侯梅者侯維也言山有嘉卉是栗是梅也豈得為生於栗梅之下哉且如考工記言天下之大獸五脂者膏者螺者羽者鱗者正猶此詩所謂嘉卉者也若泥於嘉卉而求之是以物色而求馬也梅栗美草今也廢為殘賊曾莫知其所以得罪之由蓋民者國之本也今君忍而殘虐之則清濁不可常矣幽王失道諸侯放恣天下治亂莫能相一亦猶是也蘇氏之意蓋以此章連下章說詩人本義必不如是此言相彼泉水一則清一則濁水尚清者而今我構此橫禍無時而善則是無有清者也滔滔大貌書曰浩浩滔天言江漢甚大為國之綱紀固可以納衆水今幽王之時既無綱紀故我盡瘁以仕而莫我有則是不能納天下之善者也鶉注曰鵰也說文曰鷻雕也其字從敦若以為鶉鵲之鶉則無戾天之理惟鵰乃戾天爾雅曰鵰能食草似鷹而大黑色俗呼皂鵰一名鶉鳥其飛上薄雲漢此章蓋言下民欲深藏髙飛以逃難不可得也言我匪鶉也匪鳶也安能飛至於天匪鱣也匪鮪也安能深入於淵此言難之不可逃也山有蕨薇此章蓋言草木之生於山隰得其所托故作此詩以告哀而已把枸把也桋赤棘也蘇氏曰大夫有退而食蕨薇甘杞桋以免於禍者作此詩以告其哀憐天下之志非以為其身也蘇氏之意蓋連上文蓋亦不必如此也北山大夫刺幽王也役使不均已勞於從事而不得養其父母焉陟彼北山言采其把偕偕士子朝夕從事王事靡盬憂我父母溥天之下莫非王土率土之濵莫非王臣大夫不均我從事獨賢四牡彭彭王事傍傍嘉我未老鮮我方將旅力方剛經營四方或燕燕居息或盡瘁事國或息偃在牀或不已于行或不知呌號或慘慘劬勞或棲遲偃仰或王事鞅掌或湛樂飲酒或慘慘畏咎或出入風議或靡事不為李曰言幽王之時役使臣下不均北山之大夫獨勞於從事不得休息其他大夫未必爾北山之大夫所以懷怨不得養其父母而作此詩也昔晉周處以强毅為朝廷所惡及使𨽻夏侯駿西征孫秀知其將死謂之曰卿有老母可以此辭也處曰忠孝之道安得兩全既辭親事君父母安得而子乎今日是我死所也蓋既己事君則不得顧其父母既以為國則不知顧其家所以不敢以家事辭王事人臣之大義也若周處者可謂盡事君之節矣蓋處之於父母非不愛也義所當然也而北山之大夫勞於王事乃復念以不得養其父母何哉人嘗以謂北山之大夫不如北門之忠臣又不如汝墳殷其雷之婦人汝墳之婦人能勉其夫以正而曰魴魚赬尾王室如燬父母孔邇殷其雷之婦人乃能勸其夫以義而曰振振君子歸哉歸哉婦人之無知乃能不以王事為怨亦可謂難矣至於北門之詩則曰室人交遍謫我已焉哉天實為之謂之何哉室人交遍謫我則其忠臣已不如殷其雷汝墳之婦人矣然其臣乃能歸之於天不以為怨若北山之大夫則已為怨也此其所以為變風變雅也北山大夫不當怨而怨夫子不删之者蓋所以刺幽王也孔子曰公則說人主茍有均平之心則雖征役之重不以為怨若有不均之心則雖征役未甚勞苦而人亦將怨矣觀幽王之所為則甚不均矣大東之詩則賦役亦不均有粲粲衣服者有葛屨履霜者北山之詩則役使不均有偃息在牀者有不已於行者以此二詩觀之則幽王之政無一得其平矣則天下安得而恱服哉此其所以可刺也把枸杞也季氏昭十二年有圃生之把杜元凱注曰世所謂枸把者正與此把同鄭氏曰喻已行役不得其事此說是也此詩所言陟彼北山言采其把因見把菜之生感時物之變傷行役之久非有其實也王氏曰陟彼北山適險而之幽也亦非也此但言往北山采杞不以幽險為說偕偕强壯也說文曰强也因舉此詩言其强壯士子朝夕從事無有休息王事則無不堅固矣然而憂我父母不得養之也正如所謂劉氏安朝氏危矣之意同溥大也言天下之大無非王土循率土之濵誰非王臣何獨任我也今大夫不均以勞苦之事獨以我從事而推以為賢所謂賢者又如下文嘉我未老鮮我方將之意同孔氏曰作詩者言王道之衰傷境界之削則云蹙國百里蹙蹙靡所騁恨其有人衆而不使即以廣大言之所怨情異故設辭不同此說甚善蓋節南山瞻卬與此詩皆是幽王之詩一則言其地之廣一則言其地之削當以意而逆志也亦如言文王之地言其廣則曰三分天下有其二以服事商言其地狹則曰由百里起蓋方言其興王業不在地之廣而在其德則曰由百里起方言其形勢之强而不失其人臣之節則曰三分天下有其二以服事商其言各有當也四牡彭彭然不得休息王事傍傍然不得已蓋王之意善我之未老善我之方壯以我之力方且剛强可以經營四方而使之至於此極也將壯也旅毛氏曰衆也鄭氏曰王謂此事衆之氣力方盛乎此說不分明按此詩曰旅力方剛桑柔之詩曰靡有旅力書秦誓曰旅力既愆若桑柔之詩以謂衆之氣力也如秦誓所謂畨畨良士指此良士既雖無力亦不得以為衆也旅亦訓陳左氏庭實旅百杜元凱注以旅訓陳此旅力亦是陳力也自此以下皆是言役使不均有燕燕然而居息者有盡力以事國者有偃息而在牀者有不止於行驅馳於道路者有或不知上有徵發呼召者有或慘慘然而劬勞者有棲遲於家而偃仰者有或以王事之勞鞅掌而失容者或有惟湛逸樂而飲酒者或慘慘而畏獲罪者或有出入放恣議量時政者有無事不為者其不均如此之甚矣夫坐而論道謂之三公作而行事謂之士大夫三公之與大夫則有勞逸之殊其勢然也孰敢懷怨上之心哉今也同是大夫而不均如此所以北山致大夫之怨也無將大車大夫悔將小人也無將大車祇自塵兮無思百憂祇自疧兮無將大車維塵冥冥無思百憂不出于熲無將大車維塵雍兮無思百憂祇自重兮李曰此詩言幽王之時小人在朝而君子與之共事故悔之也鄭氏以無將大車為取喻以無思百憂為非取喻當從王蘇之說鄭氏曰百憂者衆小事之憂也此說不甚明白大車蘇氏謂牛車也言不可將扶大車茍將大車則塵汚之矣不可思百憂茍思百憂則禍及之矣亦猶小人不可與之共事茍與之共事則難及其身不可逃也下二章皆此意熲光也言不出於光明而致幽暗也重纍也王氏曰車君子之所乘而非君子之所將將之則祇自塵而已小人者君子乘而節之使退聽而已斯可也乃下而將之則是將大車之類也亦不必如此說蓋王氏皆以三章為取喻其說則是而其為說似未可行也小明大夫悔仕於亂世也明明上天照臨下土我征徂西至于艽野二月初吉載離寒暑心之憂矣其毒大苦念彼共人涕零如雨豈不懷歸畏此罪罟昔我往矣日月方除曷云其還嵗聿云莫念我獨兮我事孔庶心之憂矣憚我不暇念彼共人眷眷懷顧豈不懷歸畏此譴怒昔我往矣日月方奧曷云其還政事愈蹙嵗聿云莫采蕭穫菽心之憂矣自詒伊戚念彼共人興言出宿豈不懷歸畏此反覆嗟爾君子無恆安處靖共爾位正直是與神之聽之式榖以女嗟爾君子無恆安息靖共爾位好是正直神之聽之介爾景福李曰鄭氏以為名篇曰小明者言幽王日小其明損其政事以至於亂蓋鄭氏徒見大明者文王之詩也故以謂文王能大其明幽王之時謂之小明故以謂幽小其明然以詩求之詩之所謂明明上天但言上天之明也上天之明豈有小大邪在小雅則謂之小明在大雅則謂之大明鄭氏於小旻小宛皆求其義小旻則以為所刺列於十月之交雨無正為小小宛亦以政教為小皆不求其所以名篇之意而泥之於小大之字故其說至於如是也明明上天王氏言幽王作民主而悖天道無明德以察治故世亂此說不然所謂明明上天照臨下土言天之明無所不察今也大夫仕於亂世而乃勞苦是何上天不見察邪我征之往於西方至於逺荒之地乃以二月朔日始行今乃更厯寒暑尚未得歸至于艽野言其逺也二月初吉言其久也以行役之逺所厯之久天胡為不見察邪鄭氏乃以大夫為牧伯之大夫然小明之大夫乃周之大夫也何以知其為牧伯之大夫邪孔氏云牧伯部領一州大率二百一十國其事繁多然是時大夫其行役也亦有事繁多者何獨牧伯邪心之憂矣其毒大苦言其思之大苦也念彼共人蘇氏以為思得共德之人而事也不如陳少南以共人為大夫之友言大夫始仕之時必有友人諫之而大夫不聽既仕而復悔之故念其昔日之友而涕零如雨也我豈不懷歸又恐入於罪網也方其未仕不仕可也既仕則欲歸而不得蓋仕於亂世者多如此昔我往矣日月方除王氏以為幽王之大夫以周之九月十月之間出使以周二月至于艽野日月方除者周以夏之十一月為正則以夏之十月為除方除則九月之間也楊龜山破其說鄭氏謂四月陽極而隂生故陽有除之義也猶十月隂極而謂之陽月也若從王氏之說謂周以夏之十一月為正則十月為除歲莫而往嵗莫而還不足以為久也當從鄭氏之說蓋其說本於爾雅也昔我往而至於艽野以四月之時自謂何時而得歸乎今則嵗又莫爾念我獨兮亦猶我從事獨賢也我事孔庶亦猶或靡事不為也心之憂矣勞我不復有暇也念彼昔者之友眷眷然懷顧之非不懷歸畏取怒於當時也昔我往矣日月方奧奧暖也謂四月之時也四月之時方往謂何時而得歸乎而政事愈蹙今嵗聿云莫正采蕭穫菽之時也心之憂矣我仕亂世而自遺戚也念彼昔日之友興言出宿鄭氏以謂夜臥而起宿於外憂不能宿於內是也豈不懷歸畏此反覆反覆不常之意非不懷歸畏得其罪也嗟爾君子無常安處鄭氏謂其友未仕者人之居無常安之處謂當安安而能遷此說不然蘇氏以為久勞於外又有久安處於內者矣言我憂勞於外在內之君子無常安之處也靖共爾位所與之人皆正直之人然後神之聽之用以福汝爾茍貪於安處不靖共爾位則神從禍爾矣以見憂勞者在外告於內者故出是言也鼓鍾刺幽王也鼓鍾將將淮水湯湯憂心且傷淑人君子懷允不忘鼓鍾喈喈淮水湝湝憂心且悲淑人君子其德不回鼓鍾伐鼛淮有三洲憂心且妯淑人君子其德不猶鼓鍾欽欽鼓瑟鼓琴笙磬同音以雅以南以籥不僭李曰鼓鍾之詩諸家多以為作樂於淮水之上歐陽公以為不然考詩書史記皆無幽王東巡之事何由逺至淮上而作樂不知此詩安得為刺幽王也書曰徐夷並興蓋自成王時徐戎及淮夷已皆不為周臣故於此詩之義遂闕而不言惟張橫渠以為淮水為害幽王不恤作樂不止故詩人言憂心且傷作詩之人傷之也此說得之淮水湯湯諸家多以湯湯為溢至於湝湝則不溢矣淮水有洲則又勝於湝湝矣若以張橫渠之說求之湯湯乃是泛濫書曰湯湯洪水方割則湯湯之濫無疑也湝湝亦湯湯也三洲言水之浸及於三洲也此言泛濫之狀伐鼛大鼓也憂心且妯妯憂也此作詩之人所以憂之也方幽王之作樂所以為樂而人乃以為憂者是非所樂而樂之淑人君子懷允不忘言今我思古之善人君子念而信之未嘗忘也古者未嘗不為樂則與民同樂今民以為憂而王乃自以為樂其可乎淑人君子其德不回言古之善人君子其德不如是之回邪也其德不猶言其德不若是也至於末章則言所以為樂非不美也特以其所作非其時爾蘇黃門以為將作樂則鼓鍾所謂金奏也既鼓鍾欽欽於是乃鼓瑟與琴笙磬皆相和以至於二雅二南播之以籥皆不僭差蘇氏沈存中皆以為二南鄭氏則以為四夷之樂誤矣書曰洚水警豫洚水者洪水也以堯之聖德可謂至矣遭洪水猶有警戒之心為幽王者較之堯帝固甚相逺則其警戒之心當何如邪縱不能懷警戒之心則曷為作樂哉方民當昏墊之時幾不聊生而幽王乃安然作樂是可忍也孰不可忍也憂民之憂者民亦憂其憂樂民之樂者民亦樂其樂民方以為憂而幽王且以為樂斯民聞鍾鼓且蹙頞而相告曰吾王之好樂甚夫何使我至於此極也此樂也祇其所以為憂也唐太宗嘗曰夫聲之所感皆因人之哀樂將亡之政其民困故聞以悲今玉樹後庭花伴侣之曲尚存為公奏之知必不悲魏徵曰樂在人和不在音也夫玉樹後庭花伴侣之曲非不愁也然作於太宗之時則未必悲二雅之南非不美也然作於幽王之時則不足樂以此見樂之作也不繫於聲音之間惟繫人心如何耳毛詩集解卷二十六
