body:
  text: 毛詩集解卷四十二宋李樗黃櫄撰烈祖祀中宗也嗟嗟烈祖有秩斯祜申錫無疆及爾斯所既載清酤音户賚我思成亦有和羮既戒既平鬷假無言時靡有爭綏我眉夀黃耇無疆約軧祁支切錯如字又采故反衡八鸞鶬鶬七羊反以假以享我受命溥將自天降康豐年穰穰來假音格來饗降福無疆顧子烝嘗湯孫之將李曰烈祖祀中宗也中宗大戊也史記云大戊立亳有祥桑榖共生於朝一暮大拱大戊懼問伊陟伊陟曰帝之政其有闕歟帝其修徳大戊從之而祥桑枮死殷復興諸侯歸之故稱中宗烈祖之詩乃祀中宗之樂歌也按商有三宗太甲為太宗太戊為中宗武丁為髙宗烈祖則祀中宗𤣥鳥則祀髙宗太宗則無詩非無太宗之詩蓋商之詩散亡多矣未必其初無太宗之詩也烈祖鄭氏以為成湯歐陽以為大戊鄭氏以烈祖為成湯者則以那之詩衎我烈祖為成湯故以此詩烈祖亦為成湯以為太戊者則以此序言祀中宗故嗟嗟烈祖以為中宗如丙以甲為祖戊以丙為祖此古今之常也湯之後世以湯為祖中宗之後世以中宗為祖二說皆通如以烈祖為中宗固為無害如太甲謂之太宗亦謂之祖甲亦可以為烈祖也若如此序言祀中宗而以詩中所言者為中宗則亦不必如此之泥夫詩非一體也清廟之詩言祀文王詩中專言祀文王我將之詩言祀文王而詩中亦專言祀文王執競之詩言祀武王思文之詩言祀后稷蓋其序既言所祀之人故其詩所言不及其他此詩之一體也𤣥鳥之詩言祀髙宗而其詩之所言乃為中宗乎二家之說在學者自處之耳若從鄭氏之說以烈祖為成湯則言湯之福可謂有常矣天又錫以無疆之福故及爾中宗之世也若從歐氏之說以烈祖為中宗則言中宗之福可謂有常矣天又錫以無疆之福故及爾當時主祭之君也清酤清酒也既載此清酒於是神靈遂降格賚我以思成賚我思成亦猶所謂綏我思成也毛氏以為賚賜也王氏以為賚我以福與徂賚孝孫同鄭氏以賚讀如來往之來言神之來享不如毛氏王氏之說為不改字無害也王氏以賚為賚我之福固得之矣然分别綏賚二字則失之泥矣如綏我思成則以為湯孫能承烈祖之事業而廣其聲教則賚不足以道也夫所謂綏我思成賚我思成其意一也但其字異耳徐安道見王氏之說而從而増廣之必謂綏安也安之者聖人之事也其說亦鑿矣既有清酒又有和羮有和羮有大羮有鉶羮其美其和則既戒既平既戒言調羮之慎既平言鹹酸之適其酒食如此可以盡其至誠也鄭氏以為和羮喻諸侯有和順之徳鄭氏之說蓋舉晏子之言夫晏子舉詩一句以見意鄭氏以為說則非也上文言既載清酤下文言亦有和羮觀既亦二字則文意相接自可見若以和羮為取喻則清酤亦為取喻也鬷假無言言執事之臣鬷至於廟中無有爭訟此以見君能盡其誠臣亦能盡其誠也假至也祭祀之禮君牽牲公卿大夫序從是祭之日卿大夫皆列於廟中而盡其恭敬之心也使百官諠譁而失禮則非所以事神矣蓋宗廟之中尚敬故也惟君臣能如此然後為盡善矣故其神靈享之安我以秀眉之夀使得黄髪耇老而至於無疆約軧錯衡此又言諸侯來助祭也所乗之車以朱篆約其長轂之軧以綵飾錯置於衡之上其八鸞之聲則鶬鶬然而鳴故諸神至而享之其所以如此者則以我受命為君而溥助我也王者祭祀四海皆來助祭然後為孝之大揚子曰孝莫大於寧親寧親莫大於寧神寧神莫大於四海之歡心清廟之詩言肅雍顯相雍之詩言有來雍雍至止肅肅皆以諸侯來為助祭之盛事也惟其諸侯各以其職來祭故自天降之以康寧使之享豐年穰穰之福也孝經曰昔者明王之以孝治天下也不敢遺小國之臣而況於公侯伯子男乎故得萬國之歡心以事其先王是以天下和平災害不生禍亂不作惟其得四海之歡心故其和氣所感所以三光全寒暑平此天所以降豐年也來假來享但言神靈降格而錫之以福也詩人言福禄其辭多重複如天保之詩言福禄辭多重複魯頌之詩言福禄亦多重複故此詩言申錫無疆又言賚我思成又言綏我眉夀黄耇無疆又言自天降康豐年穰穰又言來假來享降福無疆此詩人之常耳顧予烝嘗言神靈顧享予烝嘗之祭者則以湯孫將其祀事也王氏曰祀中宗言清酤和羮而不及樂與那執競異矣夫那之詩但言作樂烈祖之詩但言酒食非祭成湯之時則無酒食之味也非祭中宗之時則無簫管之聲也詩人各隨其宜而言之耳蓋以大樂之奏所以發揚成湯之意故那之詩專言作樂烈祖之詩所以不言也𤣥鳥祀髙宗也天命𤣥鳥降而生商宅殷土芒芒古帝命武湯正域彼四方方命厥后奄有九有商之先后受命不殆在武丁孫子武丁孫子武王靡不勝龍旂十乗大糦是承邦畿千里維民所止肇域彼四海四海來假來假祁祁景貟維河殷受命咸宜百禄是何李曰𤣥鳥祀髙宗也髙宗武丁也鄭氏云祀當為祫祫合也夫祫者已毁未毁之主皆合食於太廟𤣥鳥之詩其所言者總祭商之先祖故為合祭若以為時祭則不及殷之歴代之祖矣此鄭氏之意也竊嘗以其說為不然𤣥鳥之詩歴言殷之先祖其實為髙宗設也髙宗中興之主也商之先祖能正四方故奄有天下其政中微則諸侯必有不服者髙宗既興之後能肈域彼四海是以四海之諸侯莫敢不服此詩卒二句大抵言奄有天下之由而𤼵揚髙宗能紹祖宗之舊服諸侯之心也𤣥鳥之詩既為祀髙宗殷武之詩又為祀髙宗孔氏云或者指為時祭但其所述之事自有廣狹耳其說是也王氏曰𤣥鳥祀髙宗之詩而上頌其祖下稱其孫子而已蓋上有以紹其祖下有以貽其孫子是乃髙宗之功美也王氏之說未必全是王氏之意以為𤣥鳥之所稱者髙宗之祖耳武丁之孫子耳至於髙宗之徳𤣥鳥未嘗一言以及之也夫上文言上有以紹其祖其說則是也至下文言下有以貽其子孫其說則未必然耳豈有頌髙宗之詩而曽無一言以及髙宗乎是詩言在武丁之孫子非謂武丁之孫子也但指武丁一人也天命𤣥鳥𤣥鳥燕也其色黒故謂之𤣥鳥毛氏云春分𤣥鳥降湯之先祖有娀氏女簡狄配髙辛氏帝率與之祈於髙禖而生契此說是也鄭氏謂鳦遺卵娀氏女簡狄呑之而生契此鄭氏之說亂經也按月令仲春𤣥鳥至至之日以太牢祠于髙禖天子親往后妃帥九嬪御乃禮天子所御帶以弓韣授以弓矢于髙禖之前是所謂𤣥鳥者舉𤣥鳥至之日也故詩人推本𤣥鳥至之日而生契故言天命𤣥鳥也司馬遷作史記又曰契母簡狄有娀氏之女為帝嚳次妃三人行浴見𤣥鳥墮其卵簡狄取吞之因孕生契司馬遷多愛竒者也故為史記其言多誣聖人如百里奚伊尹之事皆孟子之所不取子長獨載於史記蓋其擇之不詳如此鄭康成既曰釋經則當從六經之言而乃以謂簡狄吞鳦卵而生契則其過甚於子長者也觀生民之詩與𤣥鳥之詩大抵相類生民之詩言后稷所以生者乃因姜嫄隨帝跡而往耳鄭康成乃謂因踐巨人跡而生今此言𤣥鳥降之日以祈髙禖而生契鄭康成乃謂簡狄呑卵而生契其多怪如此善乎歐陽公之言秦漢之間學者喜為異說謂髙辛氏之妃陳鋒女感赤龍而生堯簡狄呑鳦卵而生契姜嫄履大人跡而生稷髙辛四妃其三皆以神異而生子蓋堯有盛徳稷契後世皆主天下數百年學者喜為之稱述欲神其事故務為其說至帝摰無所稱故獨無說此則怪誕之說不足信明矣歐公之說可謂合於毛氏矣惟天命契故以𤣥鳥降之日而生契謂之商者契封於商也故其子孫奄有天下宅殷土芒芒者大也左氏傳曰芒芒禹迹言其大也古者上帝命威武之成湯古帝鄭氏曰天也謂之帝者但言昔者上帝非是天之名也言古者上帝命我成湯正其四方之疆域故得當天之命出其命令於諸侯惟其如此故奄有天下而統一之成湯則既已然矣其子孫皆天所命無有危殆其後武丁子孫又皆中興故商之業所以不墜也此詩祀髙宗而指武丁者蓋以諱事神者周人之制也自周以前則未嘗諱之也武丁以威武而王天下無有不勝者蓋其威武赫赫四方諸侯無不震服殷武之詩曰奮伐荆楚易曰髙宗伐鬼方三年克之則是四方無不服也惟其威武如此故諸侯之來助祭所建之旂則有十乗奉承黍稷而助祭以見武丁之威可畏也自武丁以前商室中微諸侯必有不服者如周之中微楚貢包茅不入非獨楚也中國之諸侯亦無有助祭者春秋書天王使石尚來歸脤未嘗書其助則是諸侯無有助祭者也今武丁中興諸侯莫不助祭於京師則以武丁之威可畏也自此以下又叙武丁為政之先後也王畿千里乃斯民之所止也先正王畿然後正四海王畿者四海之本也王畿不正其如四海何惟其王畿先正然後能正四海之疆域四海之疆域既正矣莫不來至於京師其來至也則祁祁然而衆多河者所都之地也如盤庚作惟涉河以民遷即此河也景貟維河則以諸侯輻湊而至于河也景大也貟均也言諸侯大來於京師也其所以如此者則以殷受命莫不得其所宜負荷其福禄也殷武之詩言商邑翼翼四方之極今此言邦畿千里維民所止肈域彼四海則髙宗之為政可謂有先後之序矣惟其得先後之序則諸侯之來助祭故詩人因其助祭推本而言之耳長發大禘也濬哲維商長發其祥洪水芒芒禹敷下土方外大國是疆幅隕既長有娀方將帝立子生商𤣥王桓撥本末反受小國是達受大國是達率履不越遂視既發相土烈烈海外有截才結反帝命不違至于湯齊湯降不遲聖敬日躋子兮反昭假古雅反又音格遲遲上帝是祗朱時反帝命式于九圍受小球大球為下國綴張衞反旒何天之休不競不絿不剛不柔敷政優優百禄是遒子由反受小共音弓大共為下國駿厖莫邦反何天之龍敷奏其勇不震不動不戁奴版反不竦百禄是緫子孔反武王載斾蒲貝反有䖍秉鉞音曰如火烈烈則莫我敢曷苞有三蘖五葛反莫遂莫達九有九截韋顧既伐昆吾夏桀昔在中葉有震且業允也天子降予卿士實維阿衡實左右商王李曰長發大禘也雍之詩言禘太祖長發之詩言大禘或言禘或言大禘鄭氏云大禘郊祭天也禮記曰王者禘其祖之所自出以其祖配之是也孔氏遂釋之曰祭之名禘者多矣而此大禘為郊祭天者又非圜丘之禘也又非宗廟夏禘也又非五年殷祭之禘也其說皆不然郊自是郊禘自是禘趙氏之於春秋言之詳矣豈有禘祭而為郊祭邪鄭氏所以為說者蓋泥於祭統之說不知其由也雍之詩言禘太祖長發之詩言大禘皆是禘其祖之所自出也豈有雍之謂禘乃為祭宗廟長發之謂禘乃為郊天之祭邪惟王氏之說雍序以為禘太祖周無四時之禘故也今曰大禘則商有四時之禘故也四時之禘為小則禘其祖之所自出為大矣此說得之周之四時之祭禴祠烝嘗是無四時之禘也商之四時之祭禴禘烝嘗是有四時之禘也四時之祭其中亦謂之禘則禘其祖之所自出亦謂之禘故於禘其祖之所自出者謂之大禘所以别其非夏祭之禘也濬哲維商濬深也哲明也蘇氏言商之受命深逺不如毛氏鄭氏王氏皆以為商之徳此濬哲正猶書所謂濬哲文明也惟其徳之深故不溺於褊淺惟其徳之明故不至於昬塞然王氏但以濬哲主契而言惟先儒之說以謂商家深智不獨指斥一人也此說為長商之先世皆有深智之徳其祥之發見也久矣自堯之時已然矣堯之時洪水滔天汜汜而天使禹敷治下土自京師之外大國於是畫其疆界使中國廣大均平而長逺也幅廣也隕均也是時有娀氏之女簡狄方大故帝為之立其子而生契說文曰髙辛氏之妃契母也自濬哲維商而下總言商之先祖𤣥王桓撥以下遂一一言之也𤣥王契也國語云𤣥王勤商十四世而興則𤣥王為契明甚契之時未嘗稱王迨成湯始即天子之位契未為天子而乃稱王者孔氏云國語云昔我先王后稷又曰我先王不窋商頌亦以契為𤣥王是其為王之祖故呼為王非追號為王也然謂之𤣥王者歐陽公言𤣥深微之稱也老子曰𤣥之又𤣥此說得之鄭氏以謂承黒帝而立子故謂契為𤣥王其說為不經矣桓如桓桓武王之桓同撥治也言契之威武善治故受小國亦達受大國亦達也蓋善治其國故國無大小皆能達其政令所謂可使南面者也惟能如此故使國之民循其規矩而無有踰越乃徧省觀之而政教之行無有壅蔽之患矣契既然矣傳而至於相土而相土之為人烈烈而有威武而海内截然而整齊所以畏其威也以此見相土能紹契之業如此商之先祖其於上帝之命奉承而不違至於成湯乃與天心合焉齊合也以此見商之先祖及其子孫皆上當天之意也自此以下遂言成湯之徳言湯能下賢甚疾而不遲故聖敬之徳日以升進人之欲進徳者但觀其用心而已使其敏於下賢則徳之進日以急遲於下賢則徳之進日以緩惟湯降己不遲故徳之所以日進也以湯之降己也則敏至於明假於天則遲遲以此見成湯惟求其在我而不在於求天下也惟不求於天下乃其所以上承天心故上帝親之命之以式於九圍式法也使之為法於天下也自此遂言湯受福禄之由也小球謂尺二寸之鎮圭大球謂長三尺之珽受此二玉所以為天子也為天子所以紀綱其諸侯而諸侯之於王室如旌旗之綴旒皆服屬於我此所以負荷其天之福也非獨然也又且不爭競不絿急不失之太剛不失之太柔其布政也則優優然而和此百禄是聚也受小共大共蘇氏謂共珙通合珙之玉也受此合珙之玉則以下國大厚也惟其大厚天下故何天之龍焉為龍為光之龍同非獨此也又陳進其勇不可震不可動不戁恐不竦懼毅然以天下自任無有恐懼之心此百福所以聚緫而歸之也百禄是遒百禄是緫皆言禄耳不必分别也武王言湯也𤣥鳥之詩言武王乃武丁也此詩言武王乃成湯也隨其詩而觀之耳成湯親載其斾固執其鉞如火之烈烈莫有禦遏之者漢書刑法志舉此詩句顔師古注云成湯興師本於仁義雖秉鉞以欽為先此詩所言親執其鉞不必說以欽為先也苞有三蘖毛公云苞本也蘖餘也此說得其本者則為苞少者則為蘖本則夏桀也蘖則韋顧昆吾也前漢云三蘖之興注云木斫復生曰蘖當成湯之時桀與三蘖湯皆征之莫能遂莫能達故能九有有截鄭氏以為天豐大先三正之後非也湯之征三國其征之也則有先後之序故先伐韋也顧也而後及於昆吾夏桀焉昔在中葉此則太甲也鄭氏謂中世乃相土此則失先後之序矣此詩先言契與相土後言成湯後言太甲若以相土繼成湯為言則先後不倫矣當指太甲為是太甲之不明湯之天下震而且危也信也天之子商故降予卿士是乃阿衡左右太甲故卒免於欹傾之患也商之興也天既為之立其子又為之降其臣自古至治之世君明臣良無非天所以錫之也非如吞鳦卵而生契孕昴宿而生蕭何蓋有是君有是臣君臣俱賢則是天之所錫矣然此詩言禘其祖之所自出而末言實維阿衡蘇氏云阿衡亦與禘祭意或然也蘇氏解雍之詩言宣哲維人以為文武之臣亦與祭此其為說未可信此章言阿衡與祭宜可信也殷武祀髙宗也撻他達反彼殷武奮伐荆楚罙面規反入其阻荘吕反裒蒲侯反荆之旅有截其所湯孫之緒維女荆楚居國南鄉昔有成湯自彼氐羌莫敢不來享莫敢不來王曰商是常天命多辟音璧設都于禹之績嵗事來辟勿予禍適直革反稼穡匪解音懈天命降監下民有嚴不僭不濫不敢怠遑命于下國封建厥福商邑翼翼四方之極赫赫厥聲濯濯厥靈夀考且寧以保我後生陟彼景山松柏丸丸是斷音短是遷方斲陟角反是䖍松桷音角有梴丑連反旅楹有閑寢成孔安李曰殷武祀髙宗也毛氏云撻疾意也殷武殷王武丁也非言撻然而疾乃殷武也以其殷武奮伐荆楚之國又深入險阻之地聚其國之衆而俘虜之使荆國之地莫不截然齊一此乃湯孫之功也鄭氏以湯孫為太甲非也即髙宗也荆楚在商周之時為夷狄之國世亂則先叛世治則後服當湯之時必不敢抗衡中國及商室中微往往世世為中國患此髙宗所以討之也文武之時亦未聞為中國患至厲王之後然後大邦為讎此宣王所以伐之也夫髙宗所以伐之者豈自恃其威武哉蓋以其為中國之患不得不討之也則深入其阻豈得已哉此商所以中興也維女荆楚此則責荆楚之辭言女荆楚居中國之南鄉鄉者方也蓋荆楚正荆州之地也昔者成湯之時西方之氐羌莫敢不來享於王莫敢不來朝於王其所以修貢職者以其為商之常禮也夫荆楚之國以氐羌較之氐羌尤為逺也氐羌之逺猶且修貢職況荆楚乎此則謂成湯之時自逺近無有不服為子孫者豈可不念哉亦必使逺方無所不服然後可以繼乃祖也不然則忝厥祖矣惟成湯之時如此此髙宗所以奮伐荆楚所以為湯孫之緒也鄭氏以二章至五章皆責楚之辭惟王氏獨以二章為責楚之辭自二章而下皆述髙宗之事王氏之說為優王氏此篇說之當矣言髙宗能治夷狄故天下無有不服天命諸侯凡設都于禹之績者皆來朝于王也禹貢甸服之外每百里為差今立都于禹所治之功以嵗時來朝覲于王以見諸侯無不服也凡諸侯之所以朝于天子者勿使禍責之惟當以勸民稼穡而無有解倦則可以免禍責矣古者天子之於諸侯訓以農事視其農事或修或否以為賞罰也孟子所載天子廵狩惟以入其疆土地闢田野治則有慶入其疆土地荒蕪則有讓而養老尊賢獨居其下誠以農事為最先也成王戒諸侯亦以維莫之春亦又何求與夫庤乃錢鎛奄觀銍艾之類無所不備則以農事乃諸侯之急務也諸侯茍能勤於稼穡則可免禍責矣上章言夷狄率服則是天下無事其所先者農事耳故於此繼而言之也天命降監鄭氏於此章乃謂命湯使由七十里王天下又非也二章既言湯之時氐羌之逺莫不來享莫不來王則湯之為天子也久矣不應至此方由七十里王天下也故此章當從王氏之說言天命諸侯各朝于天子又命天子降而監之諸侯為下民所嚴敬者賞不僭也刑不濫也不敢怠遑者則命于下國封殖之以福所以賞之以其黜陟諸侯各得其當故能以商邑翼翼為四方之取正赫赫其聲濯濯其靈者大也非獨此也至於身又享其夀考豈獨身享其夀考安寧之福至於子孫又䝉其利焉書之所載嘉靖殷邦至于小大無時或怨肆髙宗之享國五十有九年非夀考且寧而何商之子孫緜緜不絶延祚六百非保我後生而何上章既言夷狄之服矣又言諸侯之朝天子天子又能賞諸侯則是天下安寧矣此章遂言修宫室蓋天下無事然後可以興大工矣升彼景山之上有松柏丸丸然易直於是斷斬之遷徙之又從而斲削之凡此工匠之事無不致其䖍敬以松為桷梴然而長衆楹又閑閑而大故能成其寢廟可以甚安也爾雅曰桷謂之榱楹謂之梲范文正公曰先天下之憂而憂後天下之樂而樂先於憂勤終於逸樂今此商家能討夷狄之難又能使諸侯各朝於天子然後可以成其寢焉不然欲一日之安豈可得乎閟宫之詩言淮夷來同莫不率從末章復言徂徠之松新甫之柏是斷是度是尋是尺松桷有舄路寢孔碩新廟奕奕蓋内既無事然後可以從事於此雖僖公未必能如此然其論先後之序及夫始憂勤終逸樂之意與此詩同也如宣王之興亦必先南征北伐然後考室茍天下未安而從事於宫室其能獨安乎秦始皇為宫室之麗起咸陽而西至雍離宫三百至於後世不得聚廬而託處焉為馳道之麗東窮燕齊南極吴楚隱以金椎植以青松至於後世不得邪徑而托足焉夫以天下未安已獨以為安吾未見其能安也王氏所得於此篇多矣而獨以此章為取譬陟彼景山則髙宗登遐於人君之道之譬也松柏九九則君子之才出於大道則實以圓譬之也至於是斷是遷方斲是䖍則莫不皆有取譬其説委曲獨此章為不足信也毛詩集解卷四十二
