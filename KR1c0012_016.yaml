body:
  text: 毛詩集解卷十六宋李樗黃櫄撰株陟朱反林刺靈公也淫乎夏姬驅馳而往朝夕不休息焉胡為乎株林從夏南匪適株林從夏南駕我乘去聲馬說音稅于株野乘我乘駒音車朝食于株李曰夏姬鄭穆公之女靈公之妹也嫁於陳大夫公子夏御叔也生徵舒字子南夲姬姓故以姬為氏為夏氏之婦故曰夏姬此言靈公與其大夫孔寧儀行父通於夏姬驅馳其車馬而往自朝至夕未嘗有休息之期焉胡為乎株林株林毛氏曰夏氏邑曰株林王氏以為株林邑也邑外曰郊郊外曰牧牧外曰野野外曰林據詩中曰株林又曰株野又曰株王氏之言是也此詩上章鄭氏以為陳人責靈公言君何為之株林從夏氏子南之母為淫泆之行下章則以為君親乘君乘馬乘君乘駒變易其車乘以至株林此說不如王肅曰言非欲適株林從夏南之母反覆言之疾之也孫育亦以王肅之說為長蓋此說當從之陳人病其君而相告語曰君胡為而往株林乎將以從夏南也非是適株林也將以從夏南爾蓋靈公之適株林也託他事以往故有匪適之言孔氏曰邑在國外夏姬在邑故適邑而從夏姬也夏南即徵舒也實從夏南之母言從夏南者婦人夫死從子夏南為其家主故以夏南言之按左氏傳楚莊王縣陳討於少西氏西氏而謂之夏姬者孫繫於祖也夏姬謂之夏南者母繫於子故也駕我乘馬乘我乘駒此言君乘此一乘之馬朝則說於株林乘此一乘之駒朝則食於株以見其朝夕不休息也毛氏則以謂大夫乘駒然大夫乘駒於經無明文唐孔氏雖引皇皇者華言大夫出使經曰我馬維駒為證其義亦不甚明白以乘馬為君以乘駒為臣雖曰靈公之荒淫然不必以乘馬乘駒而分也齊襄公淫於齊姜而載驅薄薄陳靈公淫於夏姬而駕我乘馬其無恥可謂甚矣陳靈公與孔寧儀行父衷衵服戲於朝則非特適於株林而為淫亂也故其後卒死於夏姬之禍蓋父而不父必有子禍君而不君必有臣禍天理之必至齊襄公淫於齊姜雖未必死於文姜而其後不免有無知之禍天網恢恢疏而不漏可不戒哉夏姬其夫曰御叔御叔早死故夏姬淫恣黃講闕澤陂彼皮反刺時也言靈公君臣淫於其國男女相說憂思去聲感傷焉彼澤之陂有蒲與荷有美一人傷如之何寤寐無為涕他弟反泗音四滂普光反沱徒何反彼澤之陂有蒲與蕑古顔反有美一人碩大且卷寤寐無為中心悁悁烏𤣥反彼澤之陂有蒲菡户感反萏大感反有美一人碩大且儼寤寐無為輾張輦反轉伏枕李曰靈公君臣淫於其國正所謂靈公與孔寧儀行父等共通夏姬魯宣公十年惟其君臣為淫佚之行則國內之人從而化之男女第相悅愛久而不見而致其憂思感傷焉彼澤之陂陂者許慎說文曰陂陂也澤畔漳水之岸也蒲者似莞而褊有脊滑柔而溫荷者芙蕖其莖茄其葉蕸其夲蔤其花菡萏其實蓮其根藕其中的的中薏凡此數名其實一也未發則為菡萏既發則為芙蕖蕑者蘭草也鄭氏以為蓮字彼徒見上文言荷下文言菡萏皆是蓮之類故以蕑為蓮鄭氏好改字多類此蒲之滑柔蕑之芬芳荷與菡萏數者之美是取喻男女之相悅也鄭氏以蒲喻男以荷喻女陂中之物喻淫風由同姓王氏則以澤為君以陂為臣此皆鑿說也此詩男女相悅自靈公化之然詩中夲無說靈公之事王鄭於此詩徒求其君臣淫亂之事遂為之說是求之太過也以澤陂為君臣以蒲荷喻男女其文又安得相貫惟其男女相悅故有美一人則其情感傷如之何而得見之或寤或寐但涕泗滂沱而已自目曰涕自鼻曰泗毛氏以為傷無禮也使君子果傷其無禮則下文不應曰涕泗滂沱也碩大且卷卷美也盧令曰其人美且鬈字雖不同其義則一儼者儼然容貌也悁悁憂貌也輾轉伏枕言寐之不熟思之如此王氏曰東門之枌宛丘之應也澤陂株林之應也此說是也至於言苟以至誠為之則未必無應苟無其應則是誠之未至爾此不知道者之言也人之為善有安而行之有利而行之人之至誠則能為善為惡則安得謂之誠不誠人固有詐善者也不聞有詐惡者也楊龜山曰惟天下之至誠為能化非聖人不足以與此未有至誠而為惡者為惡者則失性矣尚何至誠之有此實至當之論黃講同檜羔裘詁訓傳第十三國風羔裘大夫以道去其君也國小而迫君不用道好潔其衣服逍遙遊燕而不能自強於政治故作是詩也羔裘逍遙狐裘以朝直遙反豈不爾思勞心忉忉羔裘翶翔狐裘在堂豈不爾思我心憂傷羔裘如膏古報反日出有曜豈不爾思中心是悼李曰檜乃少昊之後為鄭所并國小而迫近於大國君不能用人君之道以理國家而徒修潔其衣服逍遙而自樂遊燕而無度政事不勉大夫去其君故作是詩也羔裘逍遙鄭氏以為諸侯之朝服緇衣羔裘大蠟而息民則有黃衣狐裘鄭氏之意謂羔裘朝服也今乃宴而用之狐裘祭服今乃朝而用之其好潔衣服如此不如蘇氏之說謂羔裘諸侯之朝服也狐裘朝天子之服也羔裘朝服宜其朝也今乃以宴而用之狐裘朝天子之服宜其朝天子也今乃一國之朝亦用之以見其好潔衣服如此孔氏又以為玉藻云君衣狐白裘錦衣以裼之既有狐白裘又曰君子狐青裘豹褎𤣥綃衣以裼之則禮又有狐青裘矣此經直言狐裘可知非狐白狐青而必知是黃衣狐裘者以諸侯之服狐白裘惟在天子之朝爾在國視朝之服則素衣麑裘無狐白裘矣若檜君用狐白以朝則違禮僭上若以狐裘為僭上則非也狐裘乃諸侯朝天子之服使果為僭上則非是好潔也以朝天子之服而朝於一國不過言其好修潔如此孔氏之說非也羔裘翶翔至中心是悼翶翔猶逍遙也在堂謂正寢人君日出視朝乃退適路寢以聽政今乃衣狐裘以聽政於正寢故曰在堂如膏者言所服羔裘之色潤澤如脂膏然日出有光照耀之時觀其裘色如脂膏也言其鮮潔如此此詩上二句則言其好潔衣服下二句則言豈不爾思但言大夫之去國也大夫非不愛其君而至於勞心忉忉則去國豈得已哉中心是悼亦憂思也鄭氏謂以道去其君者三諫不從待放而去亦不如蘇氏之說謂以朝服而遊燕以朝天子之服而朝夫君之為是也則過矣然而非大惡也而大夫以是去之何哉孔子之去魯為女樂故也而曰燔肉不至蓋諱其大惡而以微罪行檜大夫之羔裘則孔子之燔肉也此所謂以道去其君者此言是也論曰古之君臣相待之以禮相接之以恩君之於臣惟盡其待之之道及其有罪則愛臣之心亦不替焉臣之於君惟盡其事之之道及其得罪則愛君之心亦不替焉古者大臣有罪而陷於不亷者不謂之不亷而謂之簠簋不飾有陷於汚穢者不謂之汚穢而謂之帷薄不修有罷軟不勝任者不謂之罷軟而謂之下官不職此賈誼傳遷就而為之諱不忍暴白其過至於大臣愛君則亦以微罪而行不替其愛君之心夫以人君尚不忍暴白其臣之過則為之臣者又安肯暴白其君之過乎大抵古者風俗淳厚君臣之分雖分而其親愛之心常若無間及至後世君疑其臣臣疑其君較之於古殆不可同日而語今檜國大夫以微罪行既似孔子之去魯及其去國豈不爾思又似孟子之出晝其人可謂賢矣惜乎名氏之不見於世也黃曰觀羔裘一詩見臣子愛君之心未嘗一日忘雖去國矣而不敢無憂國之念君雖不用道矣而不敢言其君之過託其意於羔裘而寓其情於憂傷邶之君子不能奮飛孟子之三宿出晝皆此意也鄭氏謂好潔其衣服亦非大惡而大夫以是去之何哉孔子之去魯為女樂也而曰燔肉不至蓋欲以微罪行檜君之好潔衣服必有大不可正救者不止於此大夫不忍言其君之過而特曰逍遙遊燕此其微意也作序者謂大夫以道去其君可謂深於詩矣素冠刺不能三年也庶見素冠兮棘人欒欒力端反兮勞心慱慱徒丹反兮庶見素衣兮我心傷悲兮聊與子同歸兮庶見素韠兮我心藴於粉反結兮聊與子如一兮李曰喪禮子為父斬衰三年父卒為母齊衰三年當是之時天下俗薄此禮廢而不行詩人所以刺之也素冠毛氏曰練冠也故孔氏曰此冠練布使熟其色益白是以謂之素三年之喪十有三月而練則此素冠是十有三月而練服也至於素衣毛氏則曰素冠故素衣也其意以謂冠既練則衣亦練也自練之後當服此衣冠至於祥也鄭氏謂素冠則曰喪禮既祥祭而縞冠素紕孔氏曰鄭氏以練冠者練布為之而經傳之言素者皆謂白絹未有以布為素者則知素冠非練也黑經白緯曰縞其冠用縞以素為紕故謂之素冠也至於素衣則曰除成喪者其祭也朝服縞冠朝服緇衣素裳然則此言素衣者謂素裳也故孔氏曰裳而言衣衣是大名鄭氏之意以素冠素衣為既祥之服此二說不同至於素韠則毛氏無傳而鄭氏曰祥祭朝服素韠者韠從裳色孔氏曰素服終始皆無韠矣韠從裳色素韠是大祥祭服之韠然則毛氏意亦以謂思大祥之人也然毛氏素韠無傳而孔氏遂謂思見祥祭之服恐不然也毛氏傳於上章謂練冠而下章素韠無傳則是韠者皆蒙上章素冠素衣之意毛氏既以素冠為練冠則是素韠亦以為練韠故無傳毛氏之意恐如此韠即茀也喪服謂之茀朝服謂之韠然此詩刺不能三年故詩人思夫行三年之喪而服既祥之服者而見之毛氏謂思見練服練服是十二月之服未足以見其不能三年也不如鄭氏之說為有據玉藻云縞冠素紕既祥之冠也喪服小記曰除成喪者其祭也朝服縞冠士冠禮主人𤣥冠朝服緇帶素韠則知鄭氏以素冠為祥服皆夲於禮非出於己意其說長於毛氏故王肅孫育王蘇皆從鄭說棘人者毛氏以為急鄭氏以為急於哀戚之人蘇氏說尤為詳明蘇氏謂君子之居喪皇皇若無所容者此所謂棘人也欒欒棘貌也慱慱說文作慱字因舉此詩曰棘人欒欒慱慱憂也詩人既刺不能三年故君子思是服既祥之素冠棘人形貌之欒欒者今無此人此心所以慱慱而憂也庶見素衣兮我心傷悲兮聊與子同歸兮此其言庶幾欲見服既祥之素衣者今無此人故我心之傷悲也如有其人則我且與之同歸也我心藴結兮藴結者言其心之不解也聊與子如一兮毛氏曰三年之喪賢者之所輕不肖者之所勉此說非也鄭氏則以謂且欲與之居處觀其行也其意以謂欲與之聚居而觀其所行謂之共處則與上章同歸為一意當從鄭氏說記曰三年之喪人道之至大者也未有知其所由來也三年之喪皆出於人情之所同然聖人因人情而為之節文三日則不食既殯則食粥既虞卒哭不食菜果朞而小祥則食菜果又朞而大祥則食醯醬中月而禫則飲醴酒練祥與􅎭之衣食皆有隆殺如此豈聖人為此以強人哉蓋未知其所由來也滕文公居定公之喪問於孟子欲行三年之喪父兄百官皆不欲行文公斷然行之五月居廬未有命戒當其始也父兄百官謂吾先君不能行則是此禮之廢久矣一旦行之前日之所不悅者今乃大悅豈非三年之喪出於人情之所同然者乎惟其出於人情之所同然故檜國不能行三年之喪而君子刺之思見其人而欲與之同歸不見其人則勞心而慱慱也然自檜國不能行三年之喪逮至春秋此禮廢壞有居喪而行昏姻之禮者亦有居喪而行侵伐㑹盟之事者素冠素衣不復可見矣及至漢文乃下遺詔戒民重服以傷生此豈一朝一夕之故哉其所由來者漸矣喪禮至此大壞而不可復振矣黃曰天下俗薄父子恩絶而三年之喪廢而不行詩人傷今而思古故思夫行三年之喪服既祥之服者願見之也夫人子生三年然後免於父母之懷為人子而可無三年之愛於其父母乎先王制禮皆以其合於人情天理而後行之則三年之喪自天子而達於庶人其貴賤不同而此理不容或異者以子之於父母均也宰我問三年之喪期已久矣君子三年不為禮禮必壞三年不為樂樂必崩舊榖既沒新榖既升鑽燧改火期可已矣孔子不暇與之深辨而特曰食夫稻衣夫錦於汝安乎蓋使之揆於人情而自知其可不可也滕文公居定公之喪問於孟子欲行三年之喪而父兄百官皆不欲曰吾宗國魯先君莫之行吾先君亦莫之行也則知此禮之廢久矣然文公斷然行之及至葬顔色之戚哭泣之哀弔者大悅夫始以為不可行而終也為之大悅則三年之喪其果合於人情否耶後世學禮者當以人情觀之隰有萇丈羊反楚疾恣也國人疾其君之淫恣而思無情欲者也隰有萇楚猗於可反儺乃可反其枝夭之沃沃嗚毒反樂子之無知隰有萇楚猗儺其華夭之沃沃樂子之無家隰有萇楚猗儺其實夭之沃沃樂子之無室李曰檜國之人疾其君之淫泆縱恣而無人君之度故思無情欲者也蓋無情欲則不至於淫泆也必矣隰有萇楚爾雅云萇楚一名銚芅陸氏曰今羊桃是也葉長而狹花紫赤色其枝莖弱過一尺引蔓於草上今人以為汲灌重而善沒不如楊栁也近下根刀切其皮著熱灰中脫之可韜筆管郭氏曰葉如桃華白子如小麥亦如桃猗儺者柔順也言隰中有萇楚之草其始生則正直及其長大則猗儺然枝條柔順不妄尋蔓草木喻人於少小之時能不失其正及其長大必不至於淫欲者也夭者少也與桃之夭夭之夭同沃沃毛氏以為壯佼王氏以為鮮明蘇氏以為柔和雖則不同大抵言其少小時之性也知者鄭氏以為匹樂其無妃匹之意王氏雖不以為匹而謂含隂陽之性豈可以無知此又以知為知識之知其說亦不盡禮記曰人生而靜天之性也感物而動性之欲也物至知知然後好惡形焉好惡無節於內知誘於外不能反躬天理滅矣注曰知猶欲也則此知字與此同言樂其子之無情欲也言人之於少小之時能不失其正性則其能純素朴直外物不能遷之樂子之無家無室者無室家之情則是無情欲也孔子曰少之時血氣未定戒之在色孟子曰知好色則慕少艾人之生也孰無天地之正性哉少小之時不能養其正性則其心外馳放而不知求至於血氣未定也則不知所戒不知所戒而使夫慕少艾之心縱而無制則驕奢淫泆無所不至矣惟先於血氣未定之時而為之戒所聞必正言所見必正行不使諂諛之言淫於耳放僻之行淫於目淳厚朴素不為物遷此無知之可樂也孟子曰大人不失赤子之心惟無欲則不失赤子之心矣黃曰此詩言人之喜怒未萌則私欲未動及其私欲一熾則天理滅矣故思以反其初而樂其未知好色之時也男女之有室家人倫之大者也此曰樂子之無室無家者蓋疾其淫恣而思無情欲者也故過言也匪風思周道也國小政亂憂及禍難而思周道焉匪風發兮匪車偈起竭反兮顧瞻周道中心怛都達反兮匪風飄兮匪車嘌匹遙反兮顧瞻周道中心弔兮誰能亨普庚反魚溉古愛反之釡符甫反鬵音尋誰將西歸懷之好音李曰此詩言檜國既小而政教又荒亂而不修君子之人憂其將及於禍難而思周道也蓋當周明盛之時則政教修而民各安其所豈有禍患之憂哉匪風發兮至中心怛兮毛氏曰發發飄風非有道之風偈偈疾驅非有道之車其意蓋謂今之風非有道之風故飄飄而暴疾今之車非有道之車故偈偈然而疾驅非有道之風者以其政教失而感動天地非時風也非有道之車者以時之無道車之遲速無有節度也漢王吉亦嘗引此詩而曰匪風發兮是非古之風也發發者匪車偈兮是非古之車也偈偈者其說亦與毛氏同據此但言匪風匪車而毛氏以為非有道之風非有道之車是強增有道二字非詩人之夲意王氏曰上之所以動而化之非其道故曰匪風發兮匪風飄兮下之所以載而行之非其道故曰匪車偈兮匪車嘌兮其謂風以喻上之動而化車以喻下之載而行固與毛氏異然謂非其道則亦毛氏之曲說程氏曰匪風不和之風也匪車不法度之車也風者天之動以興上之政車者人所為以興民俗其意以為上政之亂如風之不和民俗之僻如車之無法其說與王氏無以異是強以上下而分别之則其取譬為勞而不甚簡徑至以匪風為不和之風匪車為非法度之車亦是強增不和無法等字也歐陽曰我顧瞻嚮周之道欲往告以所憂而不得往者非是為風之飄發非是為車之嘌偈而不安我中心自有所傷怛而不寧也據此說是又以周道之道為道路之道字據此詩以國小而思周道則周道不應為道路之道也惟蘇氏曰非風也而乃至發發非車也而乃至偈偈是以顧瞻周道怛然傷之也此說為勝蓋言風則發發今非風也而發發車則偈偈今非車也而偈偈甚言其政之亂也其解匪風匪車二字方為簡徑至於取喻又得詩人之意飄飄者爾雅曰回風為飄嘌說文曰疾也車陷聲因舉此詩匪風嘌兮顧者回首也言周道既衰故回顧盼視之怛然也中心弔兮弔亦傷也溉亦滌也毛氏曰鬵釡屬說文曰大釡也孔氏則引釋器云䰝謂之鬵鬵鉹也孫炎曰關東謂甑為鬵涼州謂䰝為鉹郭氏引此詩曰溉之釡鬵然則鬵是甑非釡類亨魚用釡不用甑雙舉者以其俱是食器故連言耳毛鄭之說以謂周道既衰思得人以輔之言誰能烹魚者乎有能烹魚者我則滌其釡鬵以與之誰能西歸而輔周以治民者乎有能輔周以治民者我則以周舊政令之好音而懷之耳據詩但言西歸者非在得人以輔周之事此詩乃指檜之國小政亂而思周道也烹魚煩則碎治民煩則亂誰能烹魚者乎烹魚者惟滌其釡鬵而已無所事於煩碎也治民者當以治民為心不在於煩文也誰將西歸懷之好音言誰將思西周者乎有能思周則將以好音而懷我耳檜在滎陽周都在豐鎬周在西故言西也西歸言其復周道也好音猶所謂聲教也言周之為政無非是聲教爾能復周道則亦將懷之以聲教也論曰觀漢承秦暴虐之後重以項氏之殘賊斯民高祖舉之於塗炭之中而措之於衽席之上文景因之專務以德化民風俗淳厚禁網疏闊致治有成康之美而其深仁厚澤可謂入人也深矣故雖元成之孱弱王氏因之肆其暴虐殘糾而斯民思漢猶飢之於食渴之於飲光武因之而中興焉況以周之文武深仁厚澤洽於民心又豈漢之比哉是以周道既喪而人思之如此其切故曰顧瞻周道中心怛兮然以漢之遺澤光武尚賴之以恢復西京以周之遺澤而其後莫能中興焉蓋自平王以降庸暗孱弱莫能以有為者故也孟子曰雖有智慧不如乘勢雖有鎡基不如待時時勢之可為如此而平王以下之君皆無可為之才此所以不能中興也雖斯民思之之切亦何所為哉是必有斯民愛慕之心而又有光武撥亂之才而後可以能有為也黃曰匪風發兮匪車偈兮諸家之說皆未安豫以為猶匪兕匪虎率彼曠野之意也風則發今非風也而發車則偈今非車也而偈蓋言其政之亂而人之不安也嘗觀此詩至此乃知周之先王其所以得民之心者至矣方周家之衰而諸侯之政亂當是時疑天下之不知有周矣而人猶思周道於周室將亡之時惓惓念慕之意不能自已嗚呼欲觀周之所以得民者當於此詩觀之漢自髙祖約法三章繼以文景務在養民當其盛時猶未見其養民之效也元成之後漢祚中絶天下非劉氏有矣光武一起而三輔吏民見之者歡喜不自勝老吏或至埀涕曰不圖今日復見漢官威儀噫周既衰矣人益思周漢既亡矣人益思漢為天下者其可不厚得於民心乎曹蜉蝣詁訓傳第十四國風蜉蝣刺奢也昭公國小而迫無法以自守好奢而任小人將無所依焉蜉蝣之羽衣裳楚楚心之憂矣於我歸處蜉蝣之翼采采衣服心之憂矣於我歸息蜉蝣掘求勿反閲麻衣如雪心之憂矣於我歸說音稅李曰言昭公國既小弱而又迫於大國之間使其有法則雖小而迫猶可以自守今既國小而迫而又無法以自守好為奢侈而任用小人國之危亡可立而待故將無所依倚也君子之事君則必引君以節儉小人之事君則必逢君以奢侈君既奢侈驕恣則舉其國將惟我所為此小人之志也是以好奢者其所任必小人其勢然也蜉蝣之羽云云爾雅曰蜉蝣渠略也郭氏曰似蛣蜣身狹而長有角黃黑色聚生糞土中朝生暮死猪好啖之陸氏曰蜉蝣方土語也通謂之渠略似甲蟲有角大如指長三四寸甲下有翅能飛夏月隂雨時地中出今人燒炙噉之美如蟬也樊光謂之糞中蝎蟲隨隂雨時為之朝生而暮死是知以蜉蝣為喻者蓋言昭公無法以自守將無所依任用小人而好奢美其衣裳猶蜉蝣雖有羽翼之鮮潔將不能久生昭公有衣裳采采楚楚亦不能長久也毛氏曰蜉蝣猶有羽翼以自修飾則是昭公不如蜉蝣歐陽以為當從鄭氏說鄭曰昭公徒整飾其衣裳不知國之將迫脅君臣死亡無日如蜉蝣然王氏則曰曹公之有小人如蜉蝣之有羽翼然不足恃以長也以羽翼喻小人不如以羽翼喻衣裳方為切當毛氏曰采采衆多也不如程氏以為華飾也見其好奢也掘閲毛氏曰容閲也鄭氏曰掘地解閲謂其始生時也言其始生而掘地以見昭公好奢也管子曰掘地得生則是言其始生也說文於掘字作從土因舉此詩是亦言其掘地而生也麻衣深衣也用十五升布而為之出雜記上諸侯之朝朝服夕則深衣如雪者言其鮮潔以見其好奢也蓋言其生不能久以喻昭公將無所依也鄭氏則以喻君臣朝夕變易衣服王氏則謂蜉蝣掘地以自閲言小而迫也皆是求之太過也我者指其君也惟其好奢故我心憂其君何所歸處乎言其將無所依也於我歸息於我歸說亦是上章意息止也說舍也論曰觀賈山論秦奢侈之弊曰秦為宫室之麗起咸陽而西至雍離宫三百鐘鼓帷帳不移而具而後世曽不得聚廬而託處焉為馳道之麗東窮燕齊南極吳楚隱以金椎樹以青松而其後世曽不得斜徑而託足焉為葬埋之侈被以珠玉飾以翡翠中成觀遊上成山林而其後世不得蓬顆蔽塜而託葬焉夫以秦之強盛吞二周而亡諸侯履至尊而制六合自以金城千里子孫帝王萬世之業而乃二世而亡子孫無所託足者以其好奢過也蓋自古奢侈之甚者莫如秦而其滅亡之速也亦莫如秦夫以曹之與秦其強弱之勢固不可同日語秦猶若此況於曹乎然自古人君所以為長久之計以遺子孫以為萬世無疆之休者豈舍儉所能致哉書曰慎乃儉德惟懷永圖是未必不由於儉也儉德乃懷永圖好奢則將無所依無非自取之也禹湯文武之君以儉約為急先務故其國綿延有若箕翼厯世數十厯年數百則其世可謂長矣秦以奢侈為尚故至於二世而亡人君之於奢儉可不慎所擇哉黃曰人君惟其萌一奢侈之心則其所任用皆小人矣好奢而任小人蓋一事也漢武帝萌一侈心則𢎞羊張湯之徒進明皇萌一侈心則李林甫楊國忠之徒進好奢而復任小人雖大國且不可保而況曹之小國乎是促其亡而不自知也秦人拱視於殽函之上恣珠玉翡翠之飾自以為樂而不知投耒而起者已滿於山之西江之東劉氏一呼關門不守秦氏子孫曽不得聚廬而託處焉可不戒哉候人刺近小人也共公遠去聲君子而好近小人焉彼候人兮何戈與祋彼其之子三百赤芾維鵜徒低反在梁不濡其翼彼其之子不稱去聲其服維鵜在梁不濡其咮彼其之子不遂其媾古豆反薈烏㑹反兮蔚於貴反兮南山朝隮婉兮孌兮季女斯飢李曰候人官名也蓋夏官之屬道路送迎賔客者周官候人之職上士六人下士十有二人史六人徒百有二十人故孔氏謂此詩以賢者為候人乃身荷戈祋謂作候人之徒屬非謂候人之官長也若居候人之職則不宜身荷戈祋也彼候人兮何戈與祋云云祋說文曰殳也何者揭也芾與韠祭服謂之芾朝服謂之韠玉藻記韠之制曰一命緼芾􅉳珩再命赤芾􅉳珩三命赤芾葱珩經傳都不言芾之制如何但以玉藻說韠之制如此則芾亦如此也周官侯伯之士則一命大夫則再命卿則三命赤芾者卿大夫所當服而曹國小人皆服赤芾至於三百之多此蓋言共公之遠君子君子之人乃使為候人之徒屬而何戈祋於道路之上而小人之服赤芾為卿大夫者乃至於三百人之多也左傳僖公二十八年晉文公入曹數之以其不用僖負羈而乘軒者三百人晉文公之入曹正是共公之世亦此詩所刺共公也以詩所謂三百赤芾而左氏所謂乘軒者三百人則是當時共公遠君子近小人也如左傳閔公二年齊桓遺衛大夫以乘軒杜預注云軒大夫車也則亦是遠君子而近小人也夫候人小人之所當為也乃以君子為之而且何戈與祋小人當何戈與祋而今乃三百赤芾以見倒置如此歐陽王氏皆從毛氏之說謂君子何戈與祋共其賤役小人則赤芾而為卿大夫以見其遠君子近小人也若此說方為得詩人之意至於程蘇之說則謂候人者欲其守疆埸而已而共公既寵之乃使服卿大夫之服至於三百之多其說不當如此候人微官而已以微官而有三百則他官為何如此說非也程氏亦知其說之不通乃曰三百者言其多如三百廛三百囷曹國之小豈容有三百之多夫謂曹國之小豈容有三百之多則是也蓋曹國固無如是之多也三百特言其人多若謂指候人而言其多則過矣不如指候人為君子也鵜爾雅曰鴮鸅也郭氏曰今之鵜鶘也好羣飛沉水食魚故名汙澤俗呼之為淘河陸氏曰鵜水鳥形如鶚而極大喙長尺餘直而廣口中正赤頷下胡大如數升囊若小澤中有魚便羣其抒水滿其胡而弃之令水竭盡魚在陸地乃共食之故曰淘河以鵜是食魚之鳥故知梁是水中之梁謂魚梁也維鵜在梁不濡其翼者言鳥之取魚宜其翼與咮皆沾濡也今取飽於梁而其翼與咮皆不沾濡譬小人無德而在位也言小人服赤芾之服而無德以稱之亦如鵜之在梁也咮喙也媾毛氏曰厚也遂鄭氏曰久也不久其厚終將薄於君也歐陽破之以謂遍考前世詁訓無久厚之訓訓釋既乖則失之遠矣然歐氏之說則以為昏媾之義貴賤匹耦各以其類彼在朝小人不下從羣小居卑賤而越高位是處非其宜而失其類也其說不通蘇氏則以遂為達與小人為昏媾未有達者也是亦毛鄭之意其說如此則與上章不稱其服分為二說據詩言不遂其媾不稱其服只是一意故張程之說為勝張氏曰不遂其媾遂猶稱也今人謂遂意為稱意言不稱其寵待也程氏曰鵜在梁不濡其咮以興無功而受祿不稱其章服之美待遇之禮若如此說者是則與上章不稱其服為一意也薈蔚雲興貌南山曹之南山也隮升雲也婉孌少好之貌也鄭氏曰薈蔚之小雲朝升於南山不能為大雨以喻小人雖見任於君終不能成其德教歐氏則以此言為是至以謂天無大雨則嵗不熟而幼弱者飢猶國無政令則下民困病歐氏則以此言為非據此詩言無大雨之意歐氏非之可也至謂雲興則不能為大雨詩但言薈兮蔚兮南山朝隮無天不為雨之意婉兮孌兮季女斯飢歐氏則曰彼小人者婉孌然佼好可愛至使之任事則材力不強敏如少子弱女之飢之者按漢楊震傳曰惟陛下絶婉孌之私割不忍之心歐陽解婉孌固與此同然以飢喻其不強敏則非也以季女喻不強敏可也何必以飢為譬哉王氏之說固無大旱嵗饑之意然謂其膏澤不下於民民不被其澤是亦毛鄭之意惟蘇氏謂薈蔚雲興貌小人朋黨相援並進於朝如南山之升雲薈蔚而升莫之能止君子守道困窮於下如幼弱之女雖有飢寒之患而婉孌自保不妄從人季女者無求於人而人之所當求也此說是也蓋雲之薈蔚所以喻小人之服赤芾而為卿大夫也季女之飢所以喻君子之為候人以供其賤役也蓋古者多以女自守而喻君子也程氏曰薈蔚草木之盛鬱茂之狀朝隮於南山者以草木之盛有可取也飢渴乎季女者為其有婉孌之容貌也今小人而無德義可取何為而近之乎此亦强說也然皆不如蘇氏之說賈誼為賦以弔屈原曰鸞鳳伏竄兮鴟梟翶翔謂隨夷溷兮謂跖蹻廉莫耶為鈍兮鉛刀為銛其取喻皆言君子宜在高位而乃困窮不通小人宜遠斥草野而乃斷然得志也曹之小人宜其為候人之徒屬以供賤役而乃服赤芾之服君子宜其服赤芾之服而在位在職而乃供其賤役其冠履倒置如此然君子小人更為消長泰之時君子道長小人道消否之時小人道長君子道消未有君子小人能共立於朝也曹之君既悅小人則君子雖有危言讜論豈能聽之哉使其能任君子小人讒諂之說豈一日而居於朝廷之上乎惟其所好者專在於小人其服赤芾至於三百之多則是以小人而服君子之服亦猶猿狙衣周公之服也以猿狙衣周公之服雖曰不稱其服猶無後災也以小人而衣君子之服則惡加萬民豈國家之福哉當漢之時貂蟬盈坐郎官填階都騎塞市拾遺補闕車載斗量夫貂蟬上位也郎官都騎皆達官也拾遺補闕皆清人也而其濫若此是亦赤芾三百之濫也夫一君子用事則有君子之福雖至於三百不足為多也一小人用事則有小人之禍雖一猶不可況於三百乎曹之壤地褊小而小人用事之多其不亡也幸矣黃曰賈誼既已謫去意不自得及渡湘水為賦以弔屈原因以自喻其辭曰鸞鳳伏竄兮鴟梟翶翔闒茸尊顯兮讒諛得志皆言君子小人倒置無辨至於如此衛之賢者以仕伶官曹之君子以為候人候人者候官之屬道路送迎賔客者也君子困於賤職而小人尊顯於朝廷之上至於三百赤芾以見小人盈朝而服大夫之服也如漢之時小人濫受官爵貂蟬盈坐郎官填階都騎塞市拾遺補闕車載斗量是亦三百赤芾之意夫君子小人若冰炭然其勢不能兩立小人盛則君子不得志也必矣鳲鳩刺不一也在位無君子用心之不一也鳲鳩在桑其子七兮淑人君子其儀一兮其儀一兮心如結兮鳲鳩在桑其子在梅淑人君子其帶伊絲其帶伊絲其辨伊騏鳲鳩在桑其子在棘淑人君子其儀不忒他得反其儀不忒正是四國鳲鳩在桑其子在榛淑人君子正是國人正是國人胡不萬年李曰孔氏以謂在人君之位無君子之人也孔氏以在位為人君之位徒見經之所言正是四國正是國人遂以為諸侯之事不知所謂在位正猶俊傑在位是也在位無君子則在位者皆小人矣君子在位固可以正是四國正是國人豈必以為諸侯之事哉鳲鳩爾雅以為鴶鵴方言以為戴勝今乃鴝鵒也鳲鳩在桑其子七兮孔氏以為生子之數毛氏以鳲鳩養其子朝從上下暮從下上平均如一孔氏以謂朝從上而下暮從下而上其於子也平均如一蓋相傳為然然無正文蓋以上下之說無所據說者但謂鳲鳩之於子使之各得其養無使偏而已不必以為朝從上而下暮從下而上也孔氏以鳲鳩在桑其子在梅在棘在榛為得長大而飛去然經非有長大飛去之文蘇氏以為鳲鳩則在桑而已其子則不可常也此得一之要也此說為盡王氏之說亦與蘇氏同然不如蘇氏說暢然明白也蓋鳲鳩在桑其子或在梅在棘在榛母常居處子不可以常居處母無常處則其子不知所在以見其用心之一也然此序云在位無君子用心之不一所以刺在位毛氏之說遂以為鳲鳩之養其子平均如一是與序相反也謂鳲鳩之養其子朝從上而下暮從下而上則用心之不一鳲鳩在桑其子或飛在梅在棘在榛是亦用心之不一要不必如此詩之所見但取其溫柔敦厚辭不迫切故有因理之所同然以刺今之不然者亦有古之人能如是而刺今人之不然者如盧令無衣皆言古人如是以刺今人不然豈必於詩顯然而刺之然後見刺之之意哉淑人君子其儀一兮言善人君子有可象之儀而常如一則其心亦一也結者心如結一而不散也其帶伊絲毛氏以為大帶用素玉藻云天子素帶朱裏終辟諸侯素帶終辟大夫素帶辟垂士練帶率下辟是大夫以上大帶用素故知其帶伊絲謂大帶用素絲故言絲也騏者毛氏以為騏文謂色如騏馬顧命云四人騏辨執戈注曰青黑曰騏鄭氏則以騏當作綦以玉為之其說以周禮辨師云王之皮辨㑹五采玉􅋒注云皮辨之縫中每貫結五采玉以為飾謂之􅋒二說不同要之詩人之意但言衣服之一如此或以為青黑或以為玉非夲意之所在也辨者毛氏以為皮辨詩人但言辨或曰韋辨或曰皮辨皆可也辨法天辨星為之其狀似今氊帽騏綦也綦貫玉為辨其儀不忒正是四國鄭氏以為四國之長言任為侯伯此非也此但言儀之一如此故可以為四國之矜式正是國人胡不萬年言皆祝其壽考也此詩言其帶伊絲其辨伊騏衣服之一如此正猶都人士言古者長民衣服不二從容有常以齊其民則民德一如子臧之鷸冠見僖二十四年楚子玉瓊辨玉纓見僖二十八年是亦衣服之不一也古之君子能使國人視之為矜式而祝頌之又使四方之逺瞻之仰之豈徒見於衣服之間不二而可使從之哉以其儀之不忒其心之如結也使其心之不一則雖有可象之儀民亦不可欺而從也惟其心之既一而見於外又有可象之儀內外如一則四方之逺猶且觀而象之况國內之人安能不祝而頌之乎黃曰天下之動貞夫一也言所以正天下之不一也古之人君在我者一於仁而天下之求我者雖不一而各得其所焉苟在我者不一則吾之愛必有所及有所不及故堯舜不能遍愛而能執中執中堯舜之一而不遍者所以為遍也鳲鳩之子有七至不一也或在梅在棘在榛又至不一也而鳲鳩之在桑未嘗有異處此正得其所謂至一者乎故詩人取之以喻古之在位者其用心之一而衣服之有常故亦能使民德之歸一而正天下之不正思是之人今不復見也則又歎曰正是國人胡不萬年以見其愛之之切而思之至也毛詩集解卷十六
