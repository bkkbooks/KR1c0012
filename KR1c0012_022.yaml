body:
  text: 毛詩集解卷二十二宋李樗黃櫄撰吉日美宣王田也能慎微接下無不自盡以奉其上焉言日維戊既伯既禱田車既好四牡孔阜升彼大阜從其羣醜吉日庚午既差我馬獸之所同麀音憂鹿麌麌漆沮之從天子之所瞻彼中原其祁孔有儦儦表驕反俟俟或羣或友悉率左右以燕天子既張我弓既挾我矢發彼小豝殪於計反此大兕徐履反以御賓客且以酌醴李曰周宣王既慎於細微之事又能以禮接於臣下莫不備盡其誠心以奉上也此皆據此詩中而言如吉日維戊既伯既禱吉日庚午既差我馬慎微也以御賓客且以酌醴接下也漆沮之從天子之所悉率左右以燕天子無不自盡以奉其上也戊者剛日也日之吉也外事用剛故選以剛日之吉孔氏曰日有剛柔馬有牝牡將乘牡馬故選用剛日故言維戊也此説非也既伯既禱爾雅曰既伯既禱馬祭也故毛氏亦以伯為馬祖周禮春祭馬祖夏祭先牧秋祭馬社冬祭馬步注曰馬祖天駟而孝經説曰房為龍馬孫炎曰龍為天馬蓋房星是天駟則馬祖者是房星也既伯既禱者言於馬祖之處而祈禱焉宣王之田獵用馬之力以田獵故禱於馬祖以求馬之壯健焉皆所謂慎微也其田獵之車既好矣其四牡又盛大矣王於是乘之升彼大陵之上以從逐其羣醜也鄭氏以為醜衆也蘇氏以為類亦是衆之意爾雅曰槐棘醜喬桑栁醜條椒榝醜莍桃李醜核皆是以醜為類此言從其羣醜以見其禱馬之效也吉日庚午既選戊午之剛日以禱馬又選庚午以擇馬差擇也獸之所同同聚也言獸之所聚則有麀鹿之麌麌衆多也麀説文爾雅以為鹿之牝也麌麌毛氏曰衆多也鄭氏曰麕牡曰麌麌復麌言多也鄭氏所謂麕牡曰麌亦本於爾雅蘇氏則從毛氏之説王氏則從鄭氏之言然按其文勢當從毛氏之説説文於此作從口從虞言相聚也其字雖不同其意與毛氏同漆沮之從天子之所言此獸乃自漆沮之水驅之以至天子之所也漆沮水名也禹貢所謂導渭自鳥鼠同穴東會于涇又東過漆沮即此漆沮是也故孔氏正義以明漆沮在涇水之東一名洛水與詩古公自土沮漆者别也此漆沮正周禮職方氏所謂雍州其浸渭洛雍州之地又非河南之洛也瞻彼中原其祁孔有言視彼中原之地禽獸大而且有孔氏於漆沮之從云上言乘車升大阜下言獸在中原此言驅之漆沮皆見獸之所在驅逐之事以相發明也儦儦説文曰行貌俟俟説文曰大也言其行而儦儦又且大而俟俟也或羣或友言其或三而成羣或兩而成友於是從禽獸者悉皆率之以進或左或右以燕天子也乃與駟驖之詩所謂奉時辰牡之意同既逐獸矣於是張弓挾矢而射之發矢而中彼小豝又殺此大兕殪一發而死兕爾雅曰似半一角青色重千斤此獲禽獸者且以御賓客而酌醴也饗醴天子之飲酒也左氏曰王享醴命之宥享之有醴是天子之飲酒也夫田獵一曰乾豆二曰賓客三曰充君之庖二曰賓客即此所謂以御賓客且以酌醴也三曰充君之庖即車攻所謂大庖不盈也天子之務一日二日萬幾其事之多如此而乃留意於祭馬祖者疑若區區於細務也蓋事之小者猶能如此則其大事可知也宣王中興當是時如命相如擇賢錫諸侯如遣使者皆國家大事無所不盡其善蓋事之小者猶如此則事之大於禱馬者冝其無所不慎矣及其末年則籍田之禮可行而不行料民之舉不可行而行如白駒黃鳥之詩言賢者退而窮處不得其所事之大者猶如此則其細事可知矣人之勤怠不同如此方其勤於始也兢兢業業雖小事而必慎及其怠則心驕而意侈雖大事亦有所不暇焉故以吉日之詩觀之則可以見宣王之勤於治故詩人作此吉日之詩蓋以見宣王之慎微也如翼奉之説曰南方之情惡也惡行亷貞寅午主之西方之情喜也喜行寬大己酉主之二陽並行是以王者吉午酉也詩曰吉日庚午以其説徇於隂陽既迃且陋遂使詩人之意寖失可勝歎也黃曰細行之不矜則足以為大德之纍小物之不勤則不足以為修德之至故小毖言嗣王求助而注曰天下之事謹其小夫觀人者當於其微者觀之宣王能謹微接下則無所不謹也吾於謹微之二字而見宣王之小心如文王使其能謹終猶始則尚安得有白駒黃鳥之刺也哉然謹微接下質於今日之詩而無所見説者乃以為將用馬力而先為之禱祭馬祖又為擇其吉日此謹微也以御賓客且以酌醴此接下也夫卜吉日祭馬祖皆田獵之常事宣王所以謹微者豈獨此一事乎作詩者述其一時之事而作序者原其平日之所為豫以為此序如天保之序天保下報上之詩也而曰君能下下以成其政吉日羣臣從宣王田獵之詩也而曰謹微接下學者當於言外之意求之鴻鴈之什詁訓傳第十八小雅鴻鴈美宣王也萬民離散不安其居而能勞力報反來力代反還定安集之至于矜古頑反寡無不得其所焉鴻鴈于飛肅肅其羽之子于征劬勞于野爰及矜人哀此鰥寡鴻鴈于飛集于中澤之子于垣音袁百堵皆作雖則劬勞其究安宅鴻鴈于飛哀鳴嗸嗸五刀反維此哲人謂我劬勞維彼愚人謂我宣驕李曰厲王之世政荒民散民皆不得其所宣王中興始能勞之來之還定之安集之至于矜寡無不得其所則足以見天下之無窮民也詩云哿矣富人哀此煢獨蓋言衰亂之世富者猶可而貧者尤可哀故為政必本於此如文王之發政施仁必先於鰥寡孤獨之四者則宣王之中興亦豈外是哉伊尹之相湯也思天下之民匹夫匹婦不被其澤若推而納之溝中匹夫匹婦無不被其澤然後為之至故鰥寡無不得其所然後可以為中興之盛也大曰鴻小曰鴈鄭曰鴻鴈知避隂陽寒暑興者喻民知去無道而就有道歐陽公不從其説以為上下文不相貫遂謂遣使奔走於外如鴻鴈之飛其羽聲肅肅然而勞其體也王氏亦以鴻鴈比使臣其説比於鄭氏為優此章蓋言使臣巡行於邦國如鴻鴈之飛集於野以見恩意及此可憐之人則以鰥寡為甚哀也鴻鴈于飛集于中澤此言使臣既至招還流民為之興築其垣墉而百堵皆同時而起言趨事也堵者五版為堵也雖則劬勞其究安宅計為民興築也民固勞病而其終又有安居究窮也鴻鴈于飛哀鳴嗸嗸歐陽公以哀鳴嗸嗸為使臣之自訴其自訴云哲人知我者謂我以君命安集流民而不憚劬勞矣愚人不知我者謂我好興役動衆而為驕奢也孟子曰以佚道使民雖勞不怨以生道殺民雖死不怨殺者人之所甚憚者有二曰土功也曰征役也先王之世乃能使斯民樂趨於土功若靈臺之詩樂趨乎征役若出車之詩者蓋知上之人勞我以土功之事者乃其所以安我也驅我於干戈之事者乃其所以生我也故曰雖則劬勞其究安宅自其始之勞民而言冝若使臣宣驕自其終之安宅而言則謂使臣如是之劬勞而其終乃安蓋用人者當求其後效也後世之使臣朝辭禁門情態即異暮宿州縣威福便行驅迫郵傳折辱守宰公私煩擾民不聊生如此之類然後可以謂之宣驕鴻鴈使臣奚有是哉黃曰孟子曰老而無妻曰鰥老而無夫曰寡老而無子曰獨幼而無父曰孤此四者天下之窮民而無告者也文王發政施仁必先斯四者故堯之治必至於不虐無告不廢困窮而後為極治伊尹之相湯必欲匹夫匹婦無不被其澤而後為無愧宣王安離散之民而至於鰥寡無不得所詩人所以深美歟鴻鴈一詩蓋美宣王勞來其民而流離散徙者今得其所居也先儒皆以為宣王遣使奔走於外故以鴻鴈之疾飛比使臣之勞苦夫此詩之序最為詳悉而初不言遣使臣之事則先儒之説無乃費辭乎陳少南謂鴻鴈隨陽轉徙初無定居飛集之勞無如鴻鴈者故詩人以為鴻鴈不安其所而飛也其羽急疾民之不安其居而征行也其力劬勞宣王矜此可矜之人而哀此可哀之矜寡鴻鴈之飛而集乎中澤則為得地民之歸而作室則為得所書曰彭蠡既瀦陽鳥攸居是鴻鴈集于中澤之時也其末章則見宣王以逸道使民雖勞不怨此章以為維此哲人命我以劬勞而成安居之業若彼愚人之不恤我者則命我以宫室臺榭淫侈之事而已豫請從少南説嘗觀大王遷𡵨而斯民從之以營宫室之事百堵皆興而鼛鼓弗勝衛為狄所滅之後文公徙居楚丘始建城市而營宫室可謂勞矣而斯民皆樂為用蓋以為彼之勞我者所以安我也鴻鴈卒章亦是此意庭燎美宣王也因以針止今反之夜如何其夜未央於良反庭燎之光君子至止鸞聲將將七羊反夜如何其夜未艾庭燎晣晣之世反君子至止鸞聲噦噦呼會反夜如何其夜鄉許亮反晨庭燎有輝君子至止言觀其旗音祈李曰夫宣王勤於政事又以針其太過故此詩美宣王又曰因以針之也針以救王之失如醫者之治疾也嘗觀於詩如氓之詩曰刺淫佚又曰美反正是刺之中又有美也此詩既言美宣王又曰因以針之是美之中又有針也蓋詩之不可一體而求如終南之詩美襄公又曰因以勸戒之常武之詩既曰美宣王又曰因以為戒是美之中又有戒也正此之類夜如何其夜未央此一章美宣王之甚勤然終不可以久也故二章則曰夜未艾言已不能於夜未艾之時而設庭燎也至於末章又曰夜鄉晨言又不能於夜鄉晨之時而設庭燎也夜如何其夜未央宣王之始也其聽朝之時則問曰夜如何其當夜未央之時而已設庭燎則其勤可知也未艾毛氏曰久也王氏則以為夜未及盡也蘇氏則以為將盡程氏則以為向盡如王氏蘇氏則又為艾字按左傳昭元年秦后子曰何為一世無道國未艾也注曰絶也則艾為盡意當從王蘇程之説夜未央未艾皆言其尚早也庭燎之光言夜未央之時已設庭燎而有光矣庭燎者設百燎於庭待諸侯也周禮司烜氏曰邦之大事供墳燭庭燎注云樹於門外曰大燭樹於門內曰庭燎郊特牲曰庭燎之百由齊桓公始注云僭天子也惟其齊桓公庭燎之百為僭天子之禮則知古者之設庭燎用百蓋天子之制如此將將鸞鈴之聲君子指諸侯也言設庭燎之時諸侯皆至故聞其將將之鸞聲也晣晣明也噦噦毛氏曰徐行有節也此蓋言宣王之勤待諸侯皆至故聞其噦噦之聲如此然終不可久也於其終向晨而期焉晨曉也向晨而朝禮之正也輝光也言觀其旗則天既曉矣故見其旗也向者夜未央之時而視朝諸侯之至但聞其鸞聲而不見其旗今則既曉而朝故可以見其旗矣論曰孔子曰君昧爽夙興而正其衣冠平旦視朝視朝必在於平旦之時也未旦之時而朝其志可謂勤矣然不可以為常也晉靈公將使鋤麑殺趙盾晨往寢門闢矣盛服將朝尚早坐而假寐麑退而歎曰不忘恭敬民之主也夫盛服而朝雖早不失為恭敬之至則於未央之時而設庭燎亦不害其為勤也何者蓋猶愈於日晏視朝也然常人之情多鋭於始而怠於終走者之疾不二里而止行者之遲千里而不止其進鋭者其退速此常人所不能免也今宣王不能用視朝之常禮鋭意太過而其終必不能守常而將怠矣然則君子之所行當以守常為貴黃曰周公思兼三王而坐以待旦孔子好學而終夜不寢宵衣旰食人君所難而早朝晏罷者惟勤於政事者能之晉靈公使鋤麑殺趙盾盾盛服將朝尚早坐而假寐麑退而歎曰不忘恭敬民之主也然則宣王之勤美之可也而又奚針曰慮其有始而無終也天下之理其進鋭者其退速而過於勤者必繼以怠詩人愛君之深而全君於無過之地故曰美而針之始曰未央中曰未艾終曰鄉晨其意微矣沔水規宣王也沔彼流水朝宗于海鴥彼飛隼載飛載止嗟我兄弟邦人諸友莫肯念亂誰無父母沔彼流水其流湯湯彼飛隼載飛載揚念彼不迹載起載行心之憂矣不可弭忘鴥彼飛隼率彼中陵民之訛言寧莫之懲我友敬矣讒言其興李曰規者正員之器作此詩以救正其君亦猶規之正員也沔毛氏曰水流滿也鴥疾也此皆詩人之取喻言沔焉流滿之水當盡朝於海喻天下之諸侯當盡朝於天子今則不然如鴥彼之飛隼載飛載止飛以喻其來止以喻其不來其來不來如此則以見諸侯有離散者嗟我兄弟兄弟謂同姓之諸侯也邦人諸友謂異姓之諸侯也鄭氏曰我同姓異姓之諸侯汝自恣聽不朝無肯念此於禮法為亂者汝誰無父母乎言皆生於父母也歐陽公不取其説以謂序言沔水規宣王也則是規正宣王之過失今考詩文及箋傳乃是刺諸侯驕恣不朝及妄相侵伐等事了不及宣王也蓋箋注未得詩人之本義爾如蘇氏説亦是歸罪於諸侯故當從歐氏之説言此同姓異姓之諸侯雖不念王室之亂然誰非父母所生謂人人皆知親親之恩又規王若以恩德懷之則皆親附矣沔彼流水其流湯湯毛氏曰放縱無所入也王氏以湯湯為無所歸皆未得見詩人之本意孔氏曰水非徒不入於海又不注大川亦傅會其説恐非也蓋其流湯湯亦是其流赴海之意與上章同載飛載揚亦是無所止也迹循也言念諸侯不循我之法度我心憂之載起載行言其起居之不忘也弭止也鄭氏以載起載行為諸侯妄興師出兵非也不可弭忘言心之憂而不可忘也此亦是作詩者憂之歐陽以為諸侯不循王之法度王念之載起載行而不安居不可弭忘者又規王以不忘懷來之也此亦非也鴥彼飛隼率彼中陵竊以此詩而詳觀之蓋是當時諸侯有朝有不朝者如第二章言念彼不迹則是不朝也如此言鴥彼飛隼率彼中陵則是朝王也言諸侯之循法度亦猶飛隼之率中陵也不可以讒之故而遂疏之民之訛言寧莫之懲言當懲之也我友敬矣讒言其興言諸侯敬王如此讒言其興可信乎論曰如車攻之詩曰復會諸侯於東都則是厲王之世不能會諸侯而宣王中興乃能會之也宣王之始會諸侯必有以致之也至於此乃不能會之雖諸侯不至之罪必有以致之者宣王當以始之時而思之始也能朝諸侯而終也不能必有以也如齊威王嘗率諸侯以朝周威烈王崩齊後往周王怒之是時諸侯不朝而齊獨朝之周乃怒之則不朝者得以為辭矣今朝宣王者既困於讒言則不朝亦有辭矣此所以不可不規之也黃曰禹會諸侯於塗山執玉帛者萬國武王之興諸侯之會者千八百國諸侯之於君豈有不朝之理哉水之必朝於海猶諸侯之必朝於君厲王無道而諸侯不朝宣王中興而諸侯又執玉帛而至矣竊意宣王鋭於責治以法律御下而洪人之度有所未優故詩人作詩以正之焉如漢景帝時七國反不得已而殺朝錯至武帝時大臣議者多寃朝錯之策務摧抑諸侯中山王來朝上置酒王聞樂聲而泣上問其故具以吏所侵聞於是乃厚諸侯之禮加親親之恩焉詩人之意亦欲宣王無念前日諸侯不朝之罪而遽責之也盍亦自反而已鶴鳴誨宣王也鶴鳴于九臯聲聞于野魚潛在淵或在于渚樂彼之園爰有樹檀其下維蘀它山之石可以為錯鶴鳴于九臯聲聞于天魚在于渚或潛在淵樂彼之園爰有樹檀其下維榖它山之石可以攻玉李曰正義曰規謂正其已失誨謂教其所未知孔氏此言蓋以見規誨之義然以求賢為教所未知則不可宣王之始固嘗任賢使能矣至其末年寖不克終故好賢之心少怠宣王非不能求賢也特其心己弛矣詩人之意蓋以宣王之心不能慎終如始日復一日恐入於大患故針之未已而又規之規之未已而又誨之誨之者教之也不必以教其所未知為言也詩之體不一有以首章一句皆以鳥獸草木取興而其下便序已意者如鴻鴈于飛肅肅其羽之子于征劬勞于野先言鴻鴈于飛取興也後言之子于征序已意也如此之類可以易求詩人之意有連四句皆以鳥獸草木取興如沔彼流水朝宗于海鴥彼飛隼載飛載止前既言沔彼流水次又言鴥彼飛隼而其意以流水喻諸侯之朝王以飛隼喻諸侯之不來則其詩意似難曉矣然其詩皆言朝王之事故可以知其為朝王之説也至於鶴鳴之二章十八句皆是取興殊無一句推序已意故其詩最為難曉其詩者正如淳于髠與騶忌子之相與答問其問曰狶膏棘軸所以為滑也然而不能運方穿則答之以為何如又問曰弓膠漆幹所以為合也然而不能傅合疏罅則答之以為何如又問狐裘雖敝不可以補英狗之皮則答之以為何如則古人之詩而欲以私意求之千載之下可謂難矣觀諸儒之説此詩毛鄭則專以求賢之事王氏則謂既誨王以修身又誨王以致人又誨王以尚賢辨不肖又誨王取於人以為善一詩之中分為四意今此詩既不明序已意難以斷其是非今且從毛氏之説也臯澤也鶴鳴于九臯聲聞于野譬賢者之野處而聲譽振於中外也王者無謂隱而難求也蓋物無隱而不彰事無微而不著有其實者名必隨之谷口鄭子真不屈其志耕於巖石之下名振於京師古之君子身雖隱矣而名未有不著者若以其身之隱遂不求而棄之則版築之下不可以求傅説莘野之中不可以求伊尹爾魚潛在淵或在于渚此言魚之性無常寒則藏於淵溫則見於渚譬如賢者在治則見在亂則隱惟在人君之如何耳不可不知之也樂彼之園爰有樹檀蓋言人之樂於園者謂其上有檀而下有蘀木小大各當其任譬人君之用才大才則大用之而待之以不次之位小才則小用之而以次遷之焉言無所不用也它山之石至賤而可以為錯也錯説文曰礪石也言石之至賤而可以攻玉世未有無用之物也人才亦猶是也漢王符曰攻玉以石洗金以鹽濯錦以魚浣衣以灰夫物固有以賤理貴以醜化好者矣智者棄短取長以致其力正此詩之謂也下章之意亦與上意同榖楮木也黃曰鶴鳴一詩説者不一蓋其序特言誨宣王而不言所以誨宣王之事是以説者無所底止或曰誨其用賢也或曰誨其修身也豫以為詩人責宣王之用賢而因誨之以修身之説二者一説也古者非惟君擇臣臣亦擇君君不能修身以格物審好惡以表俗暗室屋漏之際或失一節而賢者不為之用檜之君臣逍遙遊燕而大夫去之昭公好奢而君子去之孔子之行非為燔肉也為女樂也故詩人以鶴鳴于九臯聲聞于天戒宣王謂天下之理未有隱而不顯微而不彰者君子居其室出其言善則千里之外應之不善則千里之外違之吾君勿謂宫闈之祕門掖之阻而田野之間不聞知也此亦如鼓鐘于宫聲聞于外之意其下則言賢者之去就視其君之賢否故復以如魚之潛躍園之有草木者以為喻至其終則曰它山之石可以為錯它山之石可以攻玉此詩人自謂也它山之石可以錯利器可以攻美玉則吾之言豈不足以為君之誨乎嘗觀中庸之書必始於謹獨之學親親尊賢之道自修身始然後知此詩修身用賢同意也祈父音甫刺宣王也祈父豫王之爪牙胡轉豫于恤靡所止居祈父豫王之爪士胡轉豫于恤靡所底止祈父亶不聰胡轉豫于恤有母之尸饔李曰毛氏曰祈父司馬也鄭氏遂引尚書曰若疇圻父按左傳襄十六年穆叔見中行獻子賦圻父其字用酒誥若疇圻父之圻字則知鄭氏之説有據謂之祈父者掌封圻甲兵也昭公十二年祭公謀父作祈招之詩杜元凱注曰謀父周卿士祈父周司馬世掌甲兵之職則祈父周司馬明矣此詩蓋言六軍之士深怨宣王之時司馬不得其人以至於敗故責司馬之辭曰祈父我乃王之爪牙之士何為貽我憂恤使我無所止居乎爪士爪牙之士也蓋此皆是王者宿衛之士也底止也左氏曰天祚明德有所底止亦是有所止也亶誠也祈父亶不聰言祈父誠不聰慧矣使我轉於憂恤之地不得以養其父母乃令其母為父陳饌食之具自傷不孝於親也論曰此詩之意正如魯人敗於狐駘國人誦之曰臧之狐裘敗我於狐駘我君小子侏儒是使侏儒侏儒使我敗於邾敗於邾而責臧紇則此敗而責祈父明矣按國語曰三十九年宣王戰於千畝敗于薑氏之墟先儒引此以證是詩夫敗于薑氏之墟者宣王之罪詩人乃以責祈父者蓋謂祈父不稱其職固為可罪而任用祈父者亦不能無罪正如敗於邾者侏儒之罪而侏儒是使者亦不能無罪故詩中責祈父而序以為刺宣王也黃講闕白駒大夫刺宣王也皎皎白駒食我場苗縶陟立反之維之以永今朝所謂伊人於焉逍遙皎皎白駒食我場藿火郭反縶之維之以永今夕所謂伊人於焉嘉客皎皎白駒賁彼義反然來思爾公爾侯逸豫無期慎爾優遊勉爾遁思皎皎白駒在彼空谷生芻楚俱反一束其人如玉毋音無金玉爾音而有遐心李曰馬五尺以上為駒皎皎潔白也縶説文曰絆馬也維繫也毛氏曰宣王之末不能用賢賢者有乘白駒而去者以白駒為賢人之所乘恐未必然王氏曰皎皎白駒以況其潔白之賢人此言為當但其下繼之曰馬臣道也為其未縶維也故稱駒焉此則鑿矣蓋言宣王之時賢者有不得志而去國人欲留之曰皎皎白駒食我場中之苗我當縶維而留之且以永今朝也言賢者苟肯食君之祿我當留之且以延朝夕也賢者之用於朝其所施設便可以慰國人之望如孔子為政七日而誅少正卯其功大矣然亦必用賢可致治則所謂以永今朝者果何補哉蓋國人欲留之而不可得故其辭如此所謂伊人於焉逍遙鄭氏曰今於何遊息乎此説於焉逍遙則可下章於焉嘉客則此説為難行蘇氏曰逍遙不事事也雖逍遙猶愈於去耳此説亦非詩人之意但欲賢者逍遙於此而已藿亦苗也夕亦朝也此皆是上章之意嘉客上客也亦欲為嘉客於此而已賁毛氏以為飾鄭氏以為黃白色王氏以為賁奔程氏以為賁然光彩貌當從程氏之説皎皎白駒欲其賁然光彩而來也爾公爾侯毛氏曰爾公邪爾侯邪何為逸樂無期以反也其意以為公侯之尊可得逸豫若非公侯無逸豫之理此説為陋王氏曰言我遇賢人之紓也亦未必然詩人之意蓋謂賢者為公侯以其有王佐之才也才者逸樂於山野之中而無還期也慎爾優遊蓋言賢者不肯留乃相戒以優遊逍遙也上章則欲其逍遙此章則以優遊為戒也勉爾遁思思者助語也程氏以遁思為思其肥遁皆過為之説也蓋賢者相勉以遁去於山野中也自愛之辭也蓋上章既言留賢者此章則言賢者不可得而留也皎皎白駒至而有遐心上章既言賢者不可得而留無可奈何但欲其無惜音信耳言賢者如皎皎之白駒不肯食場苗在彼空谷甘於生芻然其人乃如玉之潔也蓋言賢者雖貧賤而其德可寶也既不可留猶欲聞其音問故告之曰無惜爾音信當有音信通其好而無逺我之心也論曰黃魯直太史嘗曰飛黃騄耳之駒一秣千里御良而志得食君場苗蹇驢長軒其在空谷生芻一束不知場榖之美也賢者豈不知芻不美於場苗哉然甘心於貧賤者必不得已也太公辟紂往居東海之濱聞文王作興曰盍歸乎來伯夷辟紂居北海之濱聞文王作興曰盍歸乎來夫賢者之仕非不汲汲也聞有道之主則相率而自來何待於縶維之哉惟其遇不逢時則翕然而去國人雖欲留之不可得也接淅而行猶以為緩也況欲留之哉遵大路之詩摻執子之手摻執子之裾摻執子之袂猶且不能留賢者非固拒之也是必有大不恱者不能奪其情也故人君不可不慎也黃鳥刺宣王也黃鳥黃鳥無集于榖無啄我粟此邦之人不我肯榖言旋言歸復我邦族黃鳥黃鳥無集于桑無啄我粱此邦之人不可與明言旋言歸復我諸兄黃鳥黃鳥無集于栩況甫反無啄我黍此邦之人不可與處言旋言歸復我諸父李曰黃鳥之詩無序故説者不同毛氏則以為室家相去之詩王氏蘇氏則以為賢者不得志而去之詩今考其文王蘇之説為優當從其説集説集榖而啄粟者黃鳥之所欲也亦猶仕於王朝而食君之祿賢者之所欲也今告之曰黃鳥黃鳥不得集我榖而啄我粟亦猶告賢者曰不得立王之朝而食君之祿則其訑訑然聲音顔色拒人於千里之外可見矣故賢者亦逺遁而去之以為此邦之人不我肯榖也榖祿也與邦有道榖之榖同言不肯待我以爵祿也既不以爵祿待我則當必有去志矣故不逺言歸而復反國之族焉黃鳥黃鳥無集于桑無啄我粱亦同上意不可與明言其不可與之明言也不可與處言其不可與之同處也夫賢者難進易退上既有拒我之心其道且如方枘圎鑿之不相入安能講明國事而同處哉論曰孟子曰尊賢使能俊傑在位則天下之士皆願立於王之朝矣宣王之始也任賢使能如申伯如山甫如韓侯或為將相或為諸侯如方叔如吉甫如召虎或征蠻荆或伐玁狁或平淮夷至其晚年怠心一生好賢之心寖懈如山甫虢文公之徒諫既不行言既不聽則小人乘間而用事矣故觀祈父之詩則司馬非其人矣小人既在位則賢者必不得志矣故白駒之詩留賢者而不肯留黃鳥之詩處賢者而不可與處則宣王之晚節較其昔日用賢之時固己霄壤矣唐明皇即位之初姚崇宋璟用事一時人才藹然而至及其晚節未路李林甫用事而在朝者乃庸回闒茸之徒無復有賢者矣以是觀之宣王明皇所為考其始而較其終其不同如此則知中興之君其處心不可不謹也我行其野刺宣王也我行其野蔽芾方未反其樗敕書反昏姻之故言就爾居爾不我畜復我邦家我行其野言采其蓫敕六反昏姻之故言就爾宿爾不我畜言歸斯復我行其野言采其葍音福不思舊姻求爾新特成不以富亦只以異李曰我行其野之詩亦無序不言其刺之之由故説者亦不同鄭氏則以為棄其舊姻相怨之詩蘇氏則以為甥舅諸侯求為卿士而不獲之詩王氏則以為民不安居而適異邦從其昏姻而不見恤之詩然以詩中文意反覆而考之鄭氏之説為長詩曰不思舊姻求爾新特則舍其舊而新是謀其義明甚鄭曰樗之蔽芾始生謂仲春之月嫁娶之時甘棠詩曰蔽芾甘棠以甘棠之木而召伯舍其下則非小木也其曰蔽芾乃大樹之蔽芾能蔽風日也此言蔽芾其樗亦是樗木蔽芾然可以蔽風日非始生也樗者不才之木也莊子曰吾有大樹人謂之樗其大枝擁腫不中繩墨其小枝卷曲不中規矩立之路傍匠者不顧則樗乃惡木也蓋言我行於郊野之中雖得惡木然其蔽芾亦可休息今也乃棄於夫家如此則惡木之不如也蓫惡菜也陸元恪曰今人謂之羊蹄葍亦惡菜也以惡菜猶可采而食而今夫家棄我如此則惡菜之不如也孔氏曰有人言我行適於野采可食之菜惟得蔽芾然樗之惡木據下章言采其蓫方是采可食之菜上章言蔽芾其樗則非取可采為義王氏曰樗惡木也尚可庇而息此説為長昏姻之故言就爾宿蓋言本以昏姻之故是以就爾居而為室家今也乃不我畜必當復反之於邦家而已新特毛氏曰外昏也鄭氏曰新外昏特來之女也徐氏特言其寡與蘇氏曰特匹也大臣君之匹也徐氏之説固不足取蘇氏以為匹字得之矣而曰大臣君之匹則非詩人之本意鄭氏以為新外昏特來之女則又失之矣今當從蘇氏之訓而兼用鄭氏之義柏舟曰髧彼兩髦實維我特特匹也言共伯乃共薑之匹與此詩求爾新匹之匹同則是舍其舊而圗其新失夫婦之道可知成不以富成當作誠字誠信之誠論語舉此詩其字作誠則知成字當從言也求爾新特蓋其當時必棄其舊姻之貧惟富者之求雖曰求其新特誠不足以為富適足以為異也論曰漢光武嘗欲以湖陽公主妻宋𢎞後召見𢎞帝令公主坐屏風後因謂𢎞曰諺言貴易交富易妻人情乎𢎞曰臣聞貧賤之交不可忘糟粳之妻不下堂使人人而知糟粳之妻不下堂則何以富為哉況其富者又不足以為富而乃安然為之蓋亦未之思也詩人之作如文武成康之詩有美詩而無刺詩幽厲之詩有刺詩而無美詩惟宣王之詩美刺兼備蓋其始勤終怠一人之身所為若二人故美刺之詩兼備焉讀六月嵩髙雲漢之詩觀其愛民之心惟恐其不至用賢之志惟恐其不及雖未及文武成康之盛蓋亦庶幾焉及其此心一怠至於王化寖微賢者退處王師傷敗如兔爰之詩乃兔爰之時也而宣王祈父之詩類之賢能退處如遵大路之詩乃遵大路之時也而宣王白駒黃鳥之詩類之室家相棄如谷風之詩乃谷風之時也而宣王我行其野之詩類之此皆衰世之所當然而中興之主乃爾然後知人君之用心不可一日而自懈自棄也黃講闕毛詩集解卷二十二
