body:
  text: 毛詩集解卷二十七宋李樗黃櫄撰楚茨刺幽王也政煩賦重田萊多荒饑饉降喪民卒流亡祭祀不饗故君子思古焉楚楚者茨言抽其棘自昔何為我藝黍稷我黍與與我稷翼翼我倉既盈我庾維億以為酒食以享以祀以妥以侑以介景福濟濟蹌蹌潔爾牛羊以往蒸嘗或剝或享或肆或將祝祭于祊祀事孔明先祖是皇神保是饗孝孫有慶報以介福萬壽無疆執爨踖踖為俎孔碩或燔或炙君婦莫莫為豆孔庶為賔為客獻酬交錯禮儀卒度笑語卒獲神保是格報以介福萬壽攸酢我孔熯矣式禮莫愆工祝致告徂賚孝孫苾芬孝祀神嗜飲食卜爾百福如幾如式既齊既稷既匡既勑永錫爾極時萬時億禮儀既備鍾鼓既戒孝孫徂位工祝致告神具醉止皇尸載起鼓鍾送尸神保聿歸諸宰君婦廢徹不遲諸父兄弟備言燕私樂具入奏以綏後祿爾殽既將莫怨具慶既醉既飽小大稽首神嗜飲食使君夀考孔惠孔時維其盡之子子孫孫勿替引之李曰此詩言幽王政令之煩賦斂之重至於田萊多荒而又天降饑饉使民皆流散逃亡故祭祀神弗歆饗此言其序也惟其政煩賦重傷民之財奪民之力民不得從事於田畝此田萊所以為多荒田萊多荒則是饑饉之災降喪民無所食遂流亡散徙於四方此民所以流亡民既流亡則其祭祀而神亦不歆饗古者先成民而後致力於神人民者鬼神之所依也今民人流亡則是神失其依矣雖豐其粢盛亦何補哉故祭祀不饗也萊者廢田也廢田謂之多荒者周官遂人田百畝萊五十畝萊者必欲治之今萊不治遂致於多荒此詩所以刺之也楚楚者茨楚楚茨棘貌抽除也鄭氏云茨蒺藜也茨言楚楚棘言抽互辭也蓋言茨之楚楚則亦知棘之楚楚矣言棘抽者則亦知茨之抽矣此章言民之去草芟夷藴崇之而百穀以茂百穀以茂則可以置之倉廪以供祭祀也王氏則以為傷今之意言楚楚者茨則茨生衆也王氏之意以為傷今而作然觀楚茨一篇乃是思古人之意如信南山甫田大田全篇盡是思古人之詩全無一句及於刺幽王楚茨之詩亦然也然古人之所以去草者果何為哉所以藝黍稷也惟其既去草以藝黍稷故其黍則與與其稷則翼翼豐茂盛大以致豐年之祥而倉庾則又充盈露積曰庾國語云野有庾積注云庾露積禾也於倉言盈於庾言億亦是盈辭也以為酒食享祀於神祗又迎尸於室以拜安之乃設食以進為尸嫌不飽祝以主人之辭侑勸之惟其有以安之又有以勸之後能助其大福也此章於豐年詩大抵相類豐年多黍多稌亦有高廪萬億及秭為酒為醴蒸畀祖妣以洽百禮即此所謂以為酒食以享以祀以妥以侑是也降福孔皆即此詩以介景福是也豐年全篇只是楚茨一章自可以備見也古者先成民而後致力於神故奉牲以告曰博碩肥腯謂民力之普存也謂其畜之碩大蕃滋也謂其不疾瘯蠡也謂其備腯咸有也奉盛以告曰潔粢豐盛謂其三時不害而民和年豐也奉酒醴以告曰嘉栗㫖酒謂其上下皆有嘉德而無違心也所謂馨香無讒慝也謂其三時不害為時和嵗豐則見倉廩之實可以為酒食以饗祀於神此古之時如此至幽王之時則不然矣自此以下皆言祭祀之事濟濟蹌蹌則言其禮儀之備潔爾牛羊則言其牲牷之備濟濟蹌蹌則內備禮潔爾牛羊則外備物內備禮外備物其誠可謂至矣不可以有加矣故以之共蒸嘗之祭有解剝其皮者有煮熟之者有肆其骨體於俎者有奉將以進之者祝祭於祊祊門內也孝子不知神之所在或在此或在彼故使祝求之於門內之旁其祀事則下治矣孔明下治也惟其祀事孔明故先祖是大神必安而饗之報以大福使孝子饗其慶至於萬年無窮也執爨饔爨廩爨也饗爨在門東南此上廩爨在饔爨之北是二爨者也踖踖有容也俎者從獻之俎也方其既獻酒矣於是以燔炙而置之於俎其為俎也則博大其俎之中又有燔炙二者燔燔肉也炙炙肝也孔氏云燔者火燒之名炙者遠火之稱以難熟者近火易熟者逺之故肝炙而肉燔也君婦謂后也莫莫言清靜而敬至也凡祭祀后夫人主共籩豆其籩豆則甚庶然所設之物亦猶在於祭祀而祭祀之事以將為燕飲故曰為賔為客其大待客也始主人酌賔為獻賔既酢主人主人必自飲酌賔曰酬自旅而爵其禮交錯如此而禮儀終合於法度其笑語至於卒不亂宜乎神安而饗之報以大福萬壽至於攸酢也酢報也楚茨詩言神保是饗孝孫有慶報以介福萬壽無疆又言神保是格報以介福萬壽攸酢其辭重復如此亦猶天保之詩言福祿無不重復蓋以見受福之多也熯毛氏以為敬不如蘇氏以為竭言我行禮以筋力既竭然其禮樂未嘗或愆此以見周旋中禮也工者善其事曰工蓋善於為祝故告於主人也告於主人使受嘏既而以嘏之物往豫主人孝孫也爾之孝孫主人有苾芬馨香之祀故鬼神嗜飲食今所以豫汝百種之福其來如有期矣多少如有法矣幾期也式法也其福所以如此之多也則奉其祭祀齊整稷疾誠正慎固錫爾中和之福至於時萬時億之多也禮儀既備此章則又言送神之意上章則言祭祀之意今此則言送神也言禮儀既畢備矣鍾鼓之聲既告戒矣擊鍾鼓以告戒言祭畢也孝孫往位堂下西面位祝於是致孝孫之意又從而告之以神將歸也神既皆醉而尸則起乃鳴鍾鼓而送尸以其安然而歸於天也尸已出矣而諸宰及君婦徹去俎豆皆不遲祭祀畢歸賔客之俎其諸父兄弟留之以備燕飲所以盡親親之義也樂具入奏此章則言燕兄弟也其燕兄第而具樂入奏以安後祿鄭氏謂後日之福祿不如蘇氏以謂祭之餘福也爾之殽則將行矣其同姓之人莫有怨者言皆相慶既醉於酒又飽於德其小大長幼皆稽首而相慶以謂今日之祭神嗜其飲食使君得夀考之福以君能順其禮甚得其時至矣盡矣不可以有加矣惟願君之子孫世世長行而勿替也楚茨五章皆以祭祀之事惟一章則獨言藝黍稷以供祭祀蓋一章言其大槩二章而下則析而言之詩之體如此多矣信南山刺幽王也不能修成王之業疆理天下以奉禹功故君子思古焉信彼南山維禹甸之畇畇原隰曾孫田之我疆我理南東其畝上天同雲雨雪氛氛益之以霡霂既優既渥既霑既足生我百穀疆埸翼翼黍稷彧彧曾孫之穡以為酒食畀我尸賔壽考萬年中田有廬疆埸有瓜是剝是菹獻之皇祖曾孫壽考受天之祜祭以清酒從以騂牡享于祖考執其鸞刀以啓其毛取其血膋是蒸是享苾苾芬芬祀事孔明先祖是皇報以介福萬壽無疆李曰此言成王之時能疆理天下以繼禹功幽王之時則不能繼其祖之業所以思古而傷今不然也孟子曰仁政必自經界始經界不正井地不均穀祿不平是故暴君汚吏必慢其經界經界既正分田制祿可坐而定惟成王之為政獨以經界為本故疆理天下見於詩見於周官見於詩則如信南山甫田大田是也見於周官則如大司徒井牧田野是也至於幽王之時田萊既多荒矣又豈能疆理天下哉是所謂暴君汚吏慢其經界者也此信南山詩所以作也信彼南山甸丘甸也信乎南山之地乃禹所以致丘甸之法也夫禹平水土之後其功見於天下者豈獨一南山而已哉而曰信彼南山維禹甸之者孔氏云作者指一處而表之其意通及天下也故序言疆理天下此說是也韓奕詩亦曰奕奕梁山維禹甸之禹所甸豈一梁山而已哉蓋方言韓之地故言梁山謂之信南山者亦如是也四井為邑四邑為丘四丘為甸甸方八里六十四井也然井田之法實見於周而乃以為丘甸之法已見於夏后氏之世何也孔氏云禮運言大道既隱繼而曰以立田里則是三王之初而有井甸田里之法也論語說禹盡力乎溝洫與匠人井間有溝成間有洫同也益稷濬畎澮距川與匠人同間有澮專達於川同也是丘甸之法禹之所為左傳言少康之在虞思有田一成有衆一旅則是十里為成非周之賦法也而老蘇亦以為井田之興非始於唐虞之世則周之世無以成井田唐虞啓之以至夏商稍稍葺治至周而大備蘇氏之說與孔氏合觀孟子曰夏后氏五十而貢殷人七十而助周人百畝而徹其實皆什一也以貢助徹皆本於什一若非丘甸之法何以能行什一之法也故於丘甸之法已見於夏后氏之時也惟禹成丘甸之法而成王能繼禹之功故畇畇原隰曾孫田之曾孫指成王我疆言畫其疆界也我里言分其土宜也畫其疆界則如周官所謂四丘為甸是也分其土宜則如周官所謂其穀宜黍之類是也南東其畝言或東或南順田畝之宜也左傳成公二年曰先王疆理天下物土之宜故舉詩曰我疆我理南東其畝所謂南東其畝者亦猶或縱或橫皆順其土之宜上天同雲此章又言天之潤澤如此在上天同起雲故雨雪紛紛然而積天既下雪又益之以小雨說文曰霡霂小雨也既雨雪矣又雨之既已饒渥既已霑潤陸農師曰三農之事雪則欲盛而遍故於雪言氛氛雨欲小而潤故於雨言霡霂雨雪氛氛言雪之盛也益以霡霂言雨之小也老杜亦云潤物細無聲亦是小雨也農師之言既得之矣而既優既渥又以為雪既霑既足又以為雪此則不當無分别也第一章所言地利也二章所言天時也地既利矣天既時矣此所以為豐年之報而生我百穀也其疆埸之上翼翼然讓畔黍稷則彧彧然而茂盛成王則斂而收之為酒食以祭祀以燕賔客而獲壽考之報也中田有廬古者宅在都邑田於外野農時則出而在廬秋冬則去春夏在廬所以暫居於此也疆埸之上則種瓜焉此見地無遺利矣又入其稅天子剝削淹漬以為菹貴四時之異物於是以此瓜獻之於皇祖故成王壽考受天之福也夫成王之時非獨黍稷之茂而疆埸有瓜則萬物皆以成熟況於黍稷乎至幽王之時田萊多荒黍稷尚且不熟況於瓜者乎但以疆埸有瓜求之於是以見古今之異也清謂𤣥酒也酒鬱鬯五齊三酒也祭禮先以鬱鬯降神然後迎牲以獻祖考謂之騂牡者周人尚赤故也鸞刀刀下有鈴也刀下有鈴則其聲中節郊特牲云割刀之用而鸞刀之貴貴其義也聲和而後斷也是中節也以啓其毛取其血膋郊特牲曰血毛告幽全之物貴純之道也楚國語亦曰毛以示物執其鸞刀以開其毛取其血膋以燒之血以告殺膋以升臭膋脂膏也燒其膋膏以升其臭氣蓋以此脂膏合之黍稷置之蕭乃以火燒之合其馨香之氣是升臭也惟其祭祀既盡其誠故於此而進獻之所以獻之物則芬芬苾苾然而香逺聞祀事於是乎甚明先祖則從而皇大之故報以大福萬壽無疆也楚茨之詩先言我黍與與我稷翼翼我倉既盈我庾維億自是乃言祭祀之事其後則繼之以神嗜飲食使君壽考今此信南山先既言疆埸翼翼黍稷彧彧於是言祭祀之事其終亦言先祖是皇報以介福萬壽無疆以至甫田大田其始皆言曾孫勸農之道甚篤其後則言祭祀之事其終曰報以景福萬壽無疆是數詩辭雖不同其意一也是皆言福祿之報本於祭祀而祭祀又本於黍稷也張文濳曰受莫大之福而其君有安寧壽考之樂此天下之至美極治之際也而其本出於食廩之盈原隰之治田廬之修雨雪之時而後乃及於祭祀禮樂之事也蓋衣食不足於下則禮樂不備於上禮樂廢則亂隨之而起惟田事備則衣食豐衣食豐而禮樂備禮樂備而和平興和平興而人君有福祿壽考之盛此詩人深探其本要其終而言之序如此也此言盡矣甫田之什詁訓傳第二十一小雅甫田刺幽王也君子傷今而思古焉倬彼甫田嵗取十千我取其陳食我農人自古有年今適南畝或耘或耔黍稷薿薿攸介攸止蒸我髦士以我齊明與我犧羊以社以方我田既臧農夫之慶琴瑟擊鼓以御田祖以祈甘雨以介我稷黍以穀我士女曾孫來止以其婦子饁彼南畝田畯至喜攘其左右嘗其㫖否禾易長畝終善且有曾孫不怒農夫克敏曾孫之稼如茨如梁曽孫之庾如坻如京乃求千斯食乃求萬斯箱黍稷稻粱農夫之慶報以介福萬壽無疆李曰此詩所以為君子傷今而思古則是此詩之中幽王皆不能然也如曰我取其陳食我農人刺幽王之世民人困乏必不能然也如禾易長畝終善且有刺幽王之世田萊多荒必不能然也以此觀之則此詩一篇之中皆如是也倬明也甫大也鄭氏曰甫之言大夫也不如毛氏甫田謂天下田也言明乎彼大古之時天下之田則一嵗而取十千之數也其曰倬彼甫田正猶所謂信彼南山也十千毛氏曰言多也鄭氏則以謂一成之數毛氏之意謂當言田畝之賦多田畝之賦既言十千則其他可知也不如鄭氏之言為有依據九夫為井井稅一夫其田百畝井十為通通稅十夫其田千畝通十為成成方十里成稅百夫其田萬畝此所謂十千也按漢書食貨志曰六尺為步步百為畝畝百為夫夫三為屋屋三為井井方一里是為九夫八家共之各授私田百畝公田十畝是為八十畝餘二十畝以為廬舍信如此說則是一成之內嵗之所取者八千畝也安得有十千也故孔氏破其說以為井九百畝其中為公田則中央百畝共為公田不得家取十畝也又言八家皆私百畝則百畝皆屬公矣何得復以二十畝為廬舍也言同飬公田是八家共理公事何得家分十畝自治之也若家取十畝各自治之安得謂之同飬也若二十畝為廬舍則家别二畝半亦入私矣家别私有百二畝半何得謂八家皆私百畝也孔氏此說甚善我取其陳毛氏曰尊者食新農夫食陳如此說則是古之農者皆食陳矣鄭氏曰倉廪有餘民得賖貰取食之所以紓官之蓄滯亦使民愛存新穀此與毛氏之說亦不甚相逺惟蘇氏曰一成之田而嵗取萬畝以為國用又將取其陳積以時發斂以助農夫之困乏此說為善漢志曰太倉之粟陳陳相因若無道之世倉廩困乏安得陳陳故我取其陳粟以食農人乃自古豐年之法也惟我取其陳食我農人為自古有豐年之法故我今適南畝視其耘耔而黍稷至於薿薿然而盛耘除草也耔糞本也攸介攸止毛氏曰治田得穀俊士以進漢食貨志曰春令民畢出在野冬則畢入於邑冬民既入則是餘子亦在於序室八嵗入小學學六甲五方書計之事始知室家長幼之節十五入大學學先聖禮樂而知朝廷君臣之禮其有秀異者移鄉學于庠序庠序之異者移國學于少學諸侯嵗貢少學之異者于天子學于大學命曰造士行同能偶則别之以射然後爵命焉此先王制士處民富而教之之大略也鄭氏之說蓋本於此然不如蘇氏之說曰是以親適南畝而視其耘耔助其勤力止其怠惰進其髦俊庶幾有年以遵古之成法所謂進其髦俊者如漢寵力田之類歟此說為善以我齊明毛氏曰實器曰齊則以此齊為齍字讀音咨王氏曰以我齊明內致其志也則以齊為齊字讀仄皆反按禮記曰齊者精明之志也則齊明亦可以為齊戒然齊明二字對犧羊為文則當從毛氏之說以為實器曰齊也蓋言以我明潔之齊與夫純色之羊以祭社稷以祭四方以報之也蓋上章既言豐年之事故此章則修其告戒之禮也我田既臧言我田既善矣故於孟冬之日其農夫之人各受其賜慶賜也既而於孟春既郊而始耕則又擊其琴瑟與鼓以迎田祖先嗇之神而祭之所以求甘雨以助我黍稷以養我士女也穀飬也蓋圖終則有始也周官曰凡祈年於田祖吹豳雅擊土鼓以樂田畯即此是矣曾孫來止王氏曰勞來曰來曾孫以婦子饁彼南畝而勞其來此孟子所謂省耕是也田畯至喜於是田畯之官至而喜之攘却其左右嘗其㫖否民知成王之勤於農事則盡力於治禾遍竟畝中終善且有於是成王不怒其農夫之克敏也如此成王以萬乘之尊而親臨於畎畝之中生於深宫而知稼穡之艱難田畯安得不奉成王之意乎田畯既已如此民安得不奉田畯之意乎曾孫之稼稼禾也謂有藁者也庾露積榖也茨積也梁車梁也坻水中之高地也京高丘也言成王所得之稼則如屋茨如車梁所得之庾則如水中之坻如高丘言其多如此鄭氏曰上古之稅法近者納逺者納粟米曾孫之稼如茨如梁此近者納也曾孫之庾如坻如京此逺者納粟米也惟其禾之多如此故乃求千倉以處之求萬車以載之箱車也既有黍稷又有稻粱言其無所不有也故於孟冬之日農夫之人各受其慶其將何以報之哉惟報之以介福祝之以萬壽無有疆竟而已大田刺幽王也言矜寡不能自存焉大田多稼既種既戒既備乃事以我覃耜俶載南畝播厥百穀既庭且碩曾孫是若既方既皂既堅既好不稂不莠去其螟螣及其蟊賊無害我田稚田祖有神秉畀炎火有淹萋萋興雨祁祁雨我公田遂及我私彼有不獲稚此有不斂穧彼有遺秉此有滯穗伊寡婦之利曾孫來止以其婦子饁彼南畝田畯至喜來方禋祀以其騂黑與其黍稷以享以祀以介景福李曰論人君之盛治必以鰥寡孤獨莫不得其所為治而有一夫不得其所不足以為盛治也孟子曰老而無妻曰鰥老而無夫曰寡老而無子曰獨幼而無父曰孤此四者天下之窮民而無告者也文王發政施仁必先斯四者則天下可使無窮民如堯舜之時矣觀文王之仁政耕者九一仕者世祿關市譏而不征澤梁無禁罪人不孥此周文王之仁政也然必先以鰥寡孤獨各得其所然後可以見文王之世於斯為盛不可以有加矣成王遵文王之法故鰥寡能以自存至幽王之時則文王之道於是乎廢大田之詩所以作也大田多稼惟大田然後多稼既是大田則當預備其種戒田器記季冬之月令告民出五種命農計耦耕事修耒耜具田器此之謂既種既戒惟其既種既戒則田事無不備矣然後以我之利器始有事於南畝於是百穀之生既庭而直又碩而大凡民之所以勤於農功如是者則以曾孫是若故也言民皆順曾孫之意王氏以謂不違農時毛氏之意亦然不如蘇氏以為順成王之所欲也既方既皂言百穀之生也方房也以其孚甲盡生房矣盡成實矣皂者成實也則雖成實而未堅也既而又堅又好稂童粱也莠似苖也國語注云莠似稷而無實所以亂苖也故孔子曰惡莠之亂苖而不稂不莠非其種也除而去之則嘉榖於是乎長矣去其螟螣及其蟊賊毛氏曰食心曰螟食葉曰螣食根曰蟊食節曰賊其說本於爾雅說文以謂吏胥犯法則為蟊謂抵取民財則曰賊去螟螣蟊賊皆本於王者之政自古賢太守之治猶能使蝗不入境況王者之治人事既盡則天應於上宜其螟螣蟊賊不生也無害我田稚稚幼稼也言禾之小者螟螣之害幼稼為甚故曰無害我田稚當是時也無螟螣之害故民以謂田祖之神其有靈如此持付炎火之中使自消亡也其實非田祖付之炎火之中民見其無蝗蟲之害遂歸功於田祖至唐明皇之時天下大旱蝗姚崇為相遂遣捕蝗使乃引此以為說其實與此詩異也古者無蝗蟲之災以此之功歸於田祖言田祖秉付炎火之中明皇既遭蝗蟲為宰相者宜勤其修德乃區區於捕蝗是從事於末也昧詩人之意遂為姚元崇之捕蝗況託儒者為姦乎有淹萋萋陸農師曰淹雨雲傳曰雨雲水氣也毛氏曰雲興貌惟其雲萋萋故雨祁祁王氏曰雲欲盛盛則雨雨欲徐徐則入土也雨我公田遂及我私此見民愛上心也惟天之降雨豈有先公而後私哉但以民之愛其上故欲其先公田而後私也故曰雨我公田遂及我私上之人又愛其民也則曰駿發爾私終三十里君民之情相愛如此安得不享豐年之樂也天之降雨既欲其先公後私則知其趨事於南畝先公後私可知也彼有不獲稚彼處有不獲刈之稚禾此處有不收斂之穧束又彼處有遺餘之秉把此處有滯漏之禾穗蓋田主不暇收取所以遺寡婦之利也序言矜寡不能以自存惟其如此矜寡所以自存也左傳曰或取一秉秆焉與周禮地官云門關之委積以飬老孤王制云鰥寡孤獨天民之窮而無告者也皆有常餼在上則有常餼在下則有遺秉滯穗此所以各得其所也曾孫來止以其婦子饁彼南畝田畯至喜甫田亦有此語所以省耕也此詩所言所以省斂也孟子曰春省耕而補不足秋省斂而助不給省耕斂二事皆當及其時古人所謂刈禾如寇盜之至故人君於秋成之時而省斂欲其及時也來方禋祀成王之來也四方各致其禋祀與其騂色之牛及其黍稷各隨其方而祀之周禮大宗伯皆有牲幣各放其器之色惟其享祀如此故能助萬福焉蘇氏以謂騂黑但言其略也王氏則謂來方禋祀則禋祀四方而已以享以祀以遍於羣神亦不必如此分别也瞻彼洛矣刺幽王也思古明王能爵命諸侯賞善罰惡焉瞻彼洛矣維水泱泱君子至止福祿如茨韎韐有奭以作六師瞻彼洛矣維水泱泱君子至止鞞琫有珌君子萬年保其家室瞻彼洛矣維水泱泱君子至止福祿既同君子萬年保其家邦李曰幽王之時不能正其賞罰以勸懲諸侯故君子思古之明王能如此則刺當時之不能也詩之所言只言爵命諸侯初無賞罰之事而序乃以謂賞善罰惡者此特其文勢相連爾如大田之詩言寡婦而序詩者便以為矜寡詩人之言類如此者多矣洛水有二其一在宗周其一在東都在宗周則周官職方氏所謂河西曰雍州其浸渭洛是也在東都則書康誥所謂周公初基作新大邑于東國洛是也故瞻彼洛矣鄭氏以謂在宗周王氏以謂在東都此說皆通蓋宗周者諸侯所㑹之地而東都者宣王亦㑹諸侯於此亦是諸侯所㑹之地此二說所以皆通也至其義則不然鄭氏曰我視彼洛水灌溉以時其澤浸潤以成嘉穀王氏則曰泱泱適中之水也水善利萬物然非適中則或為害而蘇氏之說尤為支離其說曰洛之水泱泱而無窮使洛愛其水無所澤萬物於洛無加也而物失其利洛惟不愛其水故無損於洛而物蒙其益此皆就洛水求義不如陳少南之說為簡徑少南曰漆沮之水流入洛宗周在焉蓋此只言諸侯之朝指洛水所在之處以見所經歷之地也君子至止福祿如茨言君子之至於此也王則錫之以福祿其多如蓋室之茨也韎韐有奭以作六師鄭氏則以諸侯世子除三年之喪服士服而來未遇爵命之時時有征伐之事天子以其賢任為軍將使代卿士將六軍而出韎韐者茅搜染也茅搜韎韐聲也韎韐祭服之韠合韋為之其服爵辨服䊷衣纁裳也而王氏則謂使服韎韋之韐而作六師則以討有罪故也使君子討有罪則所謂能罰惡也周官凡有兵事韋辨服先儒以為左傳所謂韎韋之跗注是也惟古人以韎韐之服為征伐之服則此下文曰以作六師而其上文曰韎韐有奭則其為征伐之服無疑矣毛鄭則以為祭服不如王氏之說為長夫諸侯之朝於天子天子則使之服韎韐之服以作六師則其寵任之志可知矣奭赤貌也鞞容刀鞞也古之言鞞猶今之言鞘也琫上飾桓公二年藻率鞞鞛杜預注以謂鞞佩刀鞘上飾鞛下飾與此不同要之此二物者皆是佩刀鞘之飾而其上下則不可得而知也鞞琫有珌此王者所以錫諸侯也王者既以錫諸侯諸侯得事則可以萬年保其家室也福祿既同蘇氏曰言與諸侯共之也王氏則曰惟能賞善則善者衆善者衆則莫或為惡故福祿既同亦並受其福之意王氏之說不如蘇氏之說為明白君子萬年保其家邦亦上章之意也裳裳者華刺幽王也古之仕者世祿小人在位則讒諂並進弃賢者之類絶功臣之世焉裳裳者華其葉湑兮我覯之子我心寫兮我心寫兮是以有譽處兮裳裳者華藝其黃矣我覯之子維其有章矣維其有章矣是以有慶矣裳裳者華或黃或白我覯之子乘其四駱乘其四駱六轡沃若左之左之君子宜之右之右之君子有之維其有之是以似之李曰昔者文王之治岐也仕者世祿則知古者世官為可信也然武王數紂之罪則曰官人以世春秋書尹氏卒譏世卿者也蓋古者世祿不世官世祿者但指其功臣而言之世官則無賢不肖皆以官寵之恐為民害也此世祿世官之所以不同也楚令尹子文之子針尹克黃使於齊王思子文之治楚國也曰子文無後何以勸善使復其所改命曰生晉叔向之弚獲罪祈奚曰叔向社稷之衛將十世宥之以勸能者古者重功臣之世如此而幽王弃之可乎裳裳猶堂堂也湑葉盛貌鄭氏曰華堂堂於上喻君也葉湑然於下喻臣也按此詩只說賢者之類而乃以華喻君其說為不類此但言賢者之類昌盛如此故我見此子則傾寫其心以與之傾寫其心以與之是以其國有美譽而得其安處矣藝黃亦所以喻賢者之類惟賢者之昌盛如此故我見此子則粲粲然有文以接之有文以接之是以有慶賜也或黃或白既以黃為喻賢者之昌盛則白者乃其見弃也惟賢者不當見弃故我見之則有四馬六轡之文沃然而美左之右之此末章則言賢者之德以左之則無所不宜以右之則又君子之所當有蓋以見置之左右無所不可也惟其如此則似之續之永永而不絶乃其宜也今幽王乃以讒言而弃之可乎桑扈刺幽王也君臣上下動無禮文焉交交桑扈有鶯其羽君子樂胥受天之袩交交桑扈有鶯其領君子樂胥萬邦之屏之屏之翰百辟為憲不戢不難受福不那兕觥其觩㫖酒思柔彼交匪敖萬福來求李曰幽王之時君臣之舉措皆無禮文故詩人陳古之有禮文者以刺之如大田甫田瞻彼洛矣等詩皆是陳古以刺今也然以此詩觀之徒見稱美古人之德安知其為刺詩乎故李祭酒曰楚茨大田之什並陳成王德之善行露汝墳之篇皆述紂時德之惡汝墳為王者之風楚茨為刺過之雅太師曉其作意知其本情故也此說為善蓋詩之辭雖善而以音雅推之則知其為刺詩詩之辭雖不善而以音雅推之則知其為美詩此所以審聲以知音審音以知樂審樂以知政不然季札之觀周樂也何以知古人之盛衰列國之興亡哉交交桑扈有鶯其羽桑扈有二種如爾雅曰桑扈竊脂鳭鷯剖葦此一種也桑扈竊脂棘扈竊丹此一種也對剖葦言之則竊脂者竊其肉也對竊丹言之則竊脂者竊其色也爾雅有竊毛皆謂淺毛竊脂淺白也交交桑扈有鶯其羽者正以其色之竊脂者言之此則陸農師之說也交交往來也言桑扈之往來鶯然而有文也鳥之有文章正猶人之有禮文也人而無禮文則桑扈之不如也君子樂胥受天之祜毛氏曰胥皆也鄭氏曰有才知之名也鄭氏之說為曲賈誼亦曰君子樂胥胥相也樂民之樂者民亦樂其樂憂民之憂者民亦憂其憂賈誼以胥為相正與王氏同王氏曰君子所以相樂者以其有粲然之文以相接文以相接則逺於暴亂豈特人所善哉天祜之矣王氏之說亦如毛氏之說今當用之惟君子能與臣下相樂則天祜之矣故曰受天之祜夫所謂樂者豈其任情而行流連而忘返哉蓋有法度存於其間也觀其末章則可以見其和樂而不流矣領頸也君子樂胥萬邦之屏君子能和樂則可以屏蔽萬邦矣惟其能屏蔽萬邦為國楨幹則四方諸侯亦當法其所為故曰之屏之翰百辟為憲原其所以至此者則其禮法自戢斂自畏難也如不戢斂不畏難安能受福如此之多邪故曰不戢不難受福不那那多也兕觥其觩兕觥罰爵也古之王者致罰爵以罰其失禮今也君臣上下動有禮文則雖有罰爵亦觩然而不用其所以不用者以其㫖酒而思和柔也夫㫖酒禹之所以惡者以其能亂人也今也以㫖酒而思柔則足以見其不為酒所亂也惟其如此是以交際之間無有傲慢故我雖無求於福而福自求於我也觀幽王之時如賔之初筵之詩見其君臣於宴飲之間傲慢失禮無所不至如賔既醉止載號載呶亂我籩豆屢舞僛僛觀此四句想其樽豆之間傲慢輕侮無所忌憚則雖有罰爵亦不勝其罰矣此桑扈之詩所以刺之也若夫先王之時則禮教素行如湛露之詩燕同姓之詩也而皆恭儉無有失禮如曰莫不令德則無有失德者矣如曰莫不令儀則無有失儀者矣燕同姓如此則燕羣臣可知矣故以湛露觀之則知桑扈之思古以賔之初筵觀之則知桑扈之傷今也毛詩集解卷二十七
