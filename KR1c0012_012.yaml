body:
  text: 毛詩集觧卷十二宋李樗黃櫄撰魏葛屨詁訓傳第九國風葛屨刺褊也魏地陿音洽隘於解反其民機巧趨利其君儉嗇𥚹急而無徳以將之糾糾葛屨可以履霜摻摻女手可以縫裳要之襋之好人服之好人提提宛然左辟佩其象揥維是褊心是以爲刺李曰此詩蓋言魏地窄狹故其耕作無所衣食不足其民巧於趨利其君儉嗇而吝於財褊急而至於躁不能以徳化民所以風俗之敗如此也糾糾葛屨可以履霜糾糾毛氏曰猶繚繚也王氏曰糾糾者糾之又糾而不棄也程氏言其固也程說與王相似當從毛氏禮夏葛屨冬皮屨履霜冬月之時也冬月當用皮屨今乃以葛屨而履霜蓋以見其非時也葛屨非所以履霜非嗇而何摻摻之女手而縫男子之下服摻摻猶纎纎也說文作㩥言好手貌裳男子之下服也以摻摻之女手而縫男子之下服非所以當然也禮婦人始嫁三月廟見然後執婦功今女子始嫁而趨婦功可謂趨利矣要之襋之好人服之蓋言婦人之事也士䘮禮曰左執領右執要蓋衣之要也說文曰襋衣領也皆是衣之上也有好人之所事而乃使之縫裳非其宜矣提毛氏云安諦也爾雅曰提提安也言好人之容貌安徐也宛辟貌始至門夫揖而入讓而辟者必左不敢當尊故宛然左辟也象揥摘髮也佩其象揥所以爲飾也此言其威儀如此使之非禮也所以使之者惟是君之褊心不能以徳敎使之耳故時人刺之也蘇曰君子之爲國致隆而極廣焉故其降也猶可以不陷今葛屨而以履霜及其暑將安用之乎婦人之未廟見也而使之縫裳及其成爲婦也將安使之乎此言爲善論曰衛人逆新婦婦上車問驂馬何馬也御曰借之新婦謂僕曰拊驂無笞服將下車戒送母曰滅竈將失火入室見臼曰徙之牖下妨徃來者主人笑之婦人始至而出言如此況始嫁而使之縫裳非所當然者奢者則不計財之有無而用之僭上有所不當爲而爲之也儉則計厚薄失之偪下有所當爲而不爲之也奢儉雖殊而過中則一此所以刺之也黃日天下之事惟其中節而已苟不中節則美猶惡也仁非不美而流於姑息則不足以爲仁敬非不美而流於足恭則不足以爲敬智非不美而流於鑿則不足以爲智信非不美而流於固則不足以爲信孔子曰與其奢也寧儉則儉非不美也然儉而流於嗇則不中節矣禹惡衣服而致美乎黻冕菲飲食而致孝乎鬼神禹之儉儉而中節者也以葛屨而履霜以女子而縫裳豈不過甚矣哉蘇潁濵曰葛屨而履霜及其暑也將安用之乎婦人之未廟見而使之縫裳及其爲婦也將安使之乎此言得之也汾扶云反沮子預反洳刺儉也其君儉以能勤刺不得禮也彼汾沮洳言采其莫彼其之子美無度美無度殊異乎公路彼汾一方言采其桑彼其之子美如英美如英殊異乎公行彼汾一曲言采其藚彼其之子美如玉美如玉殊異乎公族李曰此詩言其君能節儉而且勤勤且儉非可刺也但刺其勤儉之過不中乎禮故曰刺不得禮也彼汾沮洳言采其莫汾說文曰汾出乎太原晉陽縣西南入河沮洳潤濕之地也莫菜也草木䟽曰莖大如箸赤節節一葉似柳葉厚而長有毛刺始生可以爲羮言采其莫言我也言於彼潤濕之地采其莫以爲菜也程氏曰汾沮洳所謂下濕之地雖有生物衆人亦棄之不采其君采之言其儉嗇太過此說是也彼其之子美無度言是子也其美徳信無度無度者言不可以尺寸量也但殊異乎公路而已程氏云衆人棄之如此而彼其之子反美愛之無度亦不必如此說公路當從注家說下章言公行公族皆是晉官名宣公二年左傳曰初驪姬之亂詛無畜羣公子自是晉無公族及成公即位乃宦卿之適子而爲之田以爲公族又宦其餘子亦爲餘子其庶子爲公行晉於是有公族餘子公行以公族公行觀之則公路亦是官名也王氏以公路爲道以公行爲人君之行程氏亦與王氏相似但其說公族不同耳以此知公路當從注家說言公路公族公行尚不爲此則君之不爲亦可知矣今乃爲公路公族公行之所不爲者其陋可知一方一曲王氏謂沮洳則以託言其卑一方則以託言其逺一曲則以託言其不正皆鑿說也美如英萬人爲英言其美如萬人之英也藚菜也水蕮也孔氏則别爾雅以爲牛脣草木䟽曰今澤瀉也陳翥注本草舄藚菜生於水中故謂之水蕮且澤瀉與此異疑非澤瀉也美如玉言其美徳如玉也此詩言美無度美如英美如玉言勤儉之徳非不美也但不可過中也書稱禹之徳曰克勤于邦克儉于家禹固嘗勤儉書以爲美魏君之勤儉而詩乃以爲刺者蓋孔子曰禹吾無間然矣菲飲食而致孝乎鬼神惡衣服而致美乎黻冕卑宫室而盡力乎溝洫菲飲食惡衣服卑宫室所謂儉也致孝乎鬼神致美乎黻冕盡力乎溝洫所謂儉而中禮也使魏君如禹之勤儉中禮無汾沮洳之刺矣墨氏之學本於禹者也其曰昔者禹之堙洪水決江河而通四夷九州也名川三百支川三千小者無數禹親自操築臿而決濬天下之川甽股無胈脛無毛沐甚雨櫛疾風置萬國禹大聖人也而形勞天下也如此使後世墨者以喪褐爲衣以跋蹻爲服日夜不休以自苦爲極曰不能如是非禹之道也不足謂墨墨氏之言如此以喪褐爲衣是其儉也日夜不休是其勤也然徒能從禹之勤儉而不知儉不中禮此墨氏所以爲異端之學知墨氏所以爲異端之學則知魏君之可刺也林放問禮之本孔子曰大哉問禮與其奢也寧儉喪與其易也寧戚夫奢則不遜儉則固是儉猶愈於奢也則知魏之儉猶勝於曹奢然自古奢侈而亡國者多矣魏君雖儉亦未免於國削以是知奢儉之名雖有差殊槩之以聖人之道皆非也黃講同園有桃刺時也大夫憂其君國小而迫而儉以嗇不能用其民而無徳敎日以侵削故作是詩也園有桃其實之殽心之憂矣我歌且謡不知我者謂我士也驕彼人是哉子曰何其心之憂矣其誰知之其誰知之蓋亦勿思園有棘其實之食心之憂矣聊以行國不知我者謂我士也罔極彼人是哉子曰何其心之憂矣其誰知之其誰知之蓋亦勿思李曰國小而迫而儉以嗇亦猶葛屨魏地狹隘其民機巧趨利其君儉嗇褊急是也人君儉嗇而不能用其民又不施徳使國家日以侵削故大夫憂之而作是詩也園有桃其實之殽鄭氏謂魏君薄公稅省國用不取於民食園桃而已王氏曰資園桃以爲殽賴園棘以爲食非特儉嗇而已又不能用其民歐曰桃非終歳常食之物於理不通以歐氏觀之則知王鄭之說爲不足取矣蘇氏曰園有桃則食桃非其園之所有則不食矣此說終不如毛氏之說爲安毛氏曰興也園有桃其實之殽謂國有民得其力毛氏之意蓋謂園有桃可取以食國有民反不能使之以道至使過爲儉嗇乎下言園有棘其實之食亦是此意心之憂矣我歌且謡言大夫之憂歌謡以寫其憂曲合樂爲歌徒歌爲謡聊以行國亦是駕言出遊之意說者謂歌謡以告人豈有君過而以告人乎聊以行國謂觀侵地之多少亦是附㑹國小而迫而爲之說爾不知我者謂我士也驕言不知我者則以我爲驕也王氏曰儉而非之則疑於驕此說是也鄭氏以士爲事業之事言我於君事驕逸亦不必如此說我士指憂國者彼人是哉以我士爲驕而以彼人君所爲爲是也子曰何其子之所謂何哉疑大夫之辭也故傷其世旣以彼人君爲是莫知我之憂也我心之憂世之莫知我者蓋亦勿思也蘇氏曰人之不知其非也蓋亦喜其可喜而未思其不可也思之則其不可見矣此說是也鄭氏曰無知我憂所爲者則冝無復思念之以自止也此說不如蘇氏爲優罔極不中也言反以我爲不中也孟子曰輕於堯舜之道者大貊小貊也重於堯舜之道者大桀小桀也夫賦稅之法雖堯舜而不能免也惟夷貊之國無城郭宫室宗廟祭祀之禮無諸侯幣帛饔飱無百官有司故其稅賦爲輕也若然者豈堯舜之愛民不如夷貊乎當深求其所以然也魏國之君不能以先王之道取民乃過自儉嗇其大貊小貊乎儉不能取於民是所謂過乎中者也其儉則必有類於墨氏則其取於民則必有類於大貊小貊此非先王之中道也許行之與民並耕而食原其意非不美也而孟子乃闢之者亦非先王之中道也周室衰先王之道不明矣故不失之厚則失之薄如園有桃詩則是大貊小貊也如碩鼠之詩則是大桀小桀也其輕重失中如此皆是堯舜之罪人也黃曰陳相見孟子道許行之言曰滕君則誠賢君也雖然未聞道也賢者與民並耕而食饔飱而治今也滕有倉廩府庫則是厲民以自養也烏得賢觀此則知魏君之治近於許行而欲爲大貊小貊也樊遲請學稼學圃孔子曰小人哉樊須也上好禮則民莫敢不敬上好義則民莫敢不服上好信則民莫敢不用情爲魏君者其亦知此理哉陟岵孝子行役思念父母也國迫而數侵削役乎大國父母兄弟離散而作是詩也陟彼岵兮瞻望父兮父曰嗟予子行役夙夜無已上愼旃哉猶來無止陟彼屺兮瞻望母兮母曰嗟予季行役夙夜無寐上愼旃哉猶來無弃陟彼岡兮瞻望兄兮兄曰嗟予弟行役夙夜必偕上愼旃哉猶來無死李曰此詩言魏侵於大國是以日削又爲大國所役故其民之父母兄弟妻子莫不離散故作此詩以序其思念之情陟彼岵兮山無草木曰岵瞻望父兮言登彼岵山以遥望其父所居之處也父曰嗟予子之行役蘇曰孝子登髙山以望其父而不見則思其將行之戒以自慰此說是也夙夜無已尚愼旃哉猶來無止者父之告戒其子以謂汝當勤行王事夙夜無有休息又當戒愼故曰夙夜無已尚愼旃哉猶來無止旃之也上即與尚父之尚字同言尚愼之哉庶幾再來而無止也孔氏曰可往來乃來無止軍事而來若止軍事當有刑誅故深戒之非也按左傳莊九年師及齊師戰于乾時我師敗績公喪戎路傳乗而歸秦子梁子以公旗避于下道是以皆止僖十五年晉侯及秦伯戰于韓原梁由靡御韓簡虢射爲右輅秦伯將止之是古者見獲於敵皆謂之止此言猶來無止者冀其來歸無爲敵所獲也陟彼屺兮瞻望母兮山有草木曰屺言陟彼屺山以望其母而念其將行之戒故曰母曰嗟予季行役夙夜無寐尚愼旃哉猶來無弃者母之戒其子嗟予季子之行役言夙夜無寐尚戒之哉庶幾其歸而無自弃也陟彼岡兮山脊曰岡夙夜必偕者毛氏曰偕俱也言夙夜必與事俱也亦是勤於王事之意蘇氏曰必偕必與同役者偕無獨行也此說非也無死亦是上章無止無弃之意爾雅曰山多草木曰岵無草木曰屺毛氏則謂山無草木曰岵有草木曰屺王氏則從爾雅之說以謂初曰陟彼岵兮以草木蔽障害於瞻望父兄也故中曰陟彼屺兮以屺瞻望有所不見也卒曰陟岡今且從爾雅之說蓋所思漸極則所登漸髙期於瞻望可及也夫孝子者一出言不敢忘父母一舉足不敢忘父母父母在不逺遊遊必有方夫逺遊猶且不可又況從於征役之間乎然其事出於不得已者故其思念之情深切如此唐狄仁傑授邠州法曹親在河陽仁傑登太行山顔見白雲飛謂左右曰吾親舎其下瞻悵久之雲移方得去則知登山之望親者古人之情也況於征役之時而其歸未可知則思望之情猶爲可哀也黃曰孝子一出言不敢忘父母一舉足不敢忘父母故雖在征役之中而思念父母之情不能自已登髙望逺思其敎戒之勤而自謹其身其孝何如哉狄仁傑登太行山而望白雲亦陟岵之意也仁傑惟能孝於事親故能忠於事君學者於詩而三復之則知其所以爲人子爲人弟爲人臣矣十畝之間刺時也言其國削小民無所居焉十畝之間兮桑者閑閑兮行與子還兮十畝之外兮桑者泄泄以世反兮行與子逝兮李曰此詩言小民無所居孔氏曰土地陿隘不足耕墾以居生非謂無居宅也古者一夫皆百畝孟子曰耕者之所獲一夫百畝司馬曰百畝爲夫是一夫皆百畝也今也土地日削一夫百畝百歩爲畝十畝千歩也其陿隘如此詩人所以刺之也十畝之間桑者閑閑毛氏謂男女無别往來之貌泄泄毛氏以謂多人之貌然未見有所據也蘇氏則以謂十畝之間桑者閑閑其可樂也泄泄閒貌王氏則以閑閑爲暇而不遽以泄泄爲舒而不迫則是閑閑泄泄又以爲閒暇之貌然以此詩觀之當從王蘇之說十畝之間兮桑者閑閑兮言十畝之間民無所桑但閒暇而已行與子還兮孔氏曰行與子俱迴還兮雖則異家得往來俱行此說非也據下章言行與子逝兮是與逝而之他也則還亦是逝意還歸也言與子歸他邦也言十畝之間桑者無所桑徒然閒暇故欲適之他邦來寛閒之地以居爾蘇氏曰國削則民逝矣未有地亡而民存者也且雖小國豈有一夫十畝尚可以爲民者哉遂以此詩爲君子不樂仕於其朝之詩也觀詩者當觀其大意若泥於文字之間則拘矣如詩中言其多則曰則百斯男豈文王果有百男乎言其少則曰周餘黎民靡有孑遺豈周果無遺民乎言其廣則曰日辟國百里豈有一日而能闢百里乎言其窄則曰誰謂河廣一葦杭之豈有如是之窄乎一夫十畝亦是此類孟子曰以意逆志是爲得之蓋謂此也黃曰說者謂古者一夫百畝今十畝之間往來者閑閑然削小之甚然此詩之意但言其國之侵削耳非謂其果止十畝不然則周餘黎民靡有孑遺是果無遺民矣學者當於言外之意求之伐檀刺貪也在位貪鄙無功而受禄君子不得進仕爾坎坎伐檀兮寘之河之干兮河水淸且漣猗不稼不穡胡取禾三百廛兮不狩不獵胡瞻爾庭有縣貆音桓兮彼君子兮不素䬸兮坎坎伐輻兮寘之河之側兮河水淸且直猗不稼不穡胡取禾三百億兮不狩不獵胡瞻爾庭有縣特兮彼君子兮不素食兮坎坎伐輪兮寘之河之漘兮河水淸且淪猗不稼不穡胡取禾三百囷兮不狩不獵胡瞻爾庭有縣鶉兮彼君子兮不素飱兮李曰此詩言坎坎伐檀之聲也河干干涯也風行吹水成文不絶曰漣猗歎辭也此言伐檀以爲車寘於河之涯河非置車之所是言其難也然河水本不淸今乃俟其河之淸是又其難也但此詩之意言君子進仕爲尤難也歐陽氏曰詩初無俟淸之意河水雖淸漣然檀不得其用且河水本不淸當從毛氏說伐輻伐輪亦只是伐木爲車而寘於河之側河之漘漘亦是水涯也淸且直淪爾雅曰直波為徑小波為淪淸且直是直波也淸且淪是小波也不稼不穡胡取禾三百廛兮不狩不獵胡瞻爾庭有縣貆兮蓋言君子之仕進如是其難而至於小人則其易如此不稼不穡而有禾三百廛不狩不獵胡瞻爾庭則其所縣者乃貆也種之曰稼斂之曰穡廛一夫所居曰廛三百廛是三百夫之廛舎也冬獵曰狩宵田曰獵貆是貉子也三百億十萬曰億特獸三歳曰特三百囷圓倉曰囷鶉鳥名也彼君子兮不素䬸兮彼小人無功而受禄如此言君子之仕未嘗素䬸而譏小人之素䬸也熟食曰䬸公孫丑問曰詩云不素餐兮君子之不耕而食何也孟子曰君子居是國也其君用之則安富尊榮其子弟從之則孝悌忠信不素䬸兮孰大於是言君子之居是國也其食禄也豈必稼穡而後取禾豈必狩獵而後有縣貆哉蓋以其君旣有安富尊榮之效其子弟又有孝悌忠信之風則雖未嘗耕獵而不爲素䬸也小人之於國也其食禄也無補於事而乃害國亡家坐享收取禾貆特鶉之富此詩人所以譏之衞懿公好鶴有乘軒者夫軒君子所乘也而使鶴乘之所以有滅亡之禍曹共公即位而乘軒者三百人晉文公責之奏狀蔑如也遂有見執之辱見僖二十八年奏狀本作獻狀此二者類也以無功小人而使之乘軒其爲禄則一也由此觀之人君用人其可不愼擇之哉黃曰食君之禄不任君之事者謂之素䬸非不耕而徒食也此詩所謂不稼不穡不狩不獵者特言其無功而食人之禄耳故此詩言君子有其功而無其禄小人有其禄而無其功因取物理之倒置者言之坎坎伐檀反寘之河之干而不稼不穡不狩不獵反有禾貆特鶉之富其文意詳復而易明不必以艱深而求之也舉公孫丑問見李講碩䑕刺重斂也國人刺其君重斂蠶食於民不修其政貪而畏人若大䑕也碩䑕碩䑕無食我黍三歳貫女莫我肯顧逝將去女適彼樂土樂土樂土爰得我所碩䑕碩䑕無食我麥三歳貫女莫我肯徳逝將去女適彼樂國樂國樂國爰得我直碩䑕碩䑕無食我苗三歳貫女莫我肯勞逝將去女適彼樂郊樂郊樂郊誰之永號李曰此詩言蠶食於民者孔氏曰蠶食者蠶之食桑漸漸以食使桑盡也蓋言魏君重斂而漸漸以賦斂苦其民也左傳曰抑君似䑕夫䑕晝伏夜動性貪而畏人故晝伏而夜動魏君之貪如此其行虐政也惟恐斯民之不從故漸漸爲之食今國人刺之詩序旣以蠶食又以䑕畏人形容其政遐想當時之民蓋不勝其困矣碩䑕碩䑕無食我黍碩䑕大䑕也即序所謂若大䑕或者以謂爾雅釋獸鼠屬有鼫䑕其文從䑕從石陸氏曰今河東有大䑕能人立交前兩脚於頸上跳舞善鳴食人禾逐之則入樹空中故孔氏以爲碩䑕非爾雅所謂鼫䑕當如陸氏言也碩䑕碩䑕無食我黍者猶言魏君魏君無重斂我財也貫毛曰我事女三歳矣古者三年大比民或於是遷徙此說非也豈有魏國之民方事君三歳乎或者又謂三歳貫女以貫當作户貫之貫此說亦非也如此則民之來親魏國方得三年乎貫作習貫之貫言魏國重斂三歳矣貫習女之虐政未嘗有恩澤莫我肯顧莫我肯徳言未嘗有徳於我也莫我肯勞言禾嘗勞徠我也逝將去女逝徃也言我徃舎女而適彼安樂之土爰得我所言舎此重斂之國而適彼有道之邦我旣適彼有道之邦則得我所冝矣故曰爰得我所爰得我直是亦適有道之邦而得其正道也誰之永號永注家作詠字只當作永字讀其意蓋言旣徃適彼樂國之郊誰復徃而長號乎蘇氏曰欲適樂郊而不可得故曰誰爲樂郊可長號而求之哉亦不必如此說論曰古人嘗謂人皆知重斂之可以得民財而不知輕斂之得民財也重斂則民貧民貧則舎而之他則國愈貧矣輕斂則民富民富則逺方之民皆竭蹷而歸之民歸之多則國愈富矣是以爲人君者當以人民爲一家君如父民如子未嘗有子富而父貧者君民之分旣如父子則安有飜然而去也今也君旣不恤其民而重斂之剥民之肌膚竭民之骨髓民方且指其君以爲碩鼠尚何以使民愛戴其上哉然而指其君以爲碩鼠似亦太過孔子刪詩乃不去而存之者蓋以爲萬世之勸戒也師曠侍於晉侯晉侯曰衞人出其君不亦甚乎對曰或者其君實甚良君將賞善而刑淫養民如子蓋之如天容之如地民奉其君愛之如父母仰之如日月敬之如神明畏之如雷霆其可出乎夫君神之主而民之望也若困民之主匱神乏祀百姓絶望社稷無主將安用之弗去何爲見襄公十四年而師曠之言乃如此蓋所以勸戒其君也碩鼠之詩正得此意學者當深思之黃講同黃氏緫論曰魏詩七篇言其君儉嗇褊急其君儉以能勤大夫憂其君皆莫知其爲何君也蓋下序必本於上序上序特言其褊而不言其何君之褊特言刺儉而不言其何君之儉特言刺時而不言何君之時則下序亦莫得而知直曰其君而已夫以國人而目其君以碩鼠可乎君雖重斂猶吾君也而國人以碩鼠喻之是無君也孔子刪詩而不言何哉意者伐檀一詩刺在位貪鄙則碩鼠一詩亦未必非刺在位要之在位者如此而民至於無告訴則其君可知孔子存之以爲後世戒昔師曠侍晉侯云云見李講夫衞人出其君雖衞君之罪而國人亦不能無罪師曠之意特因以爲戒耳孔子刪詩而以碩鼠附於魏風之末所以爲後世戒哉唐蟋蟀詁訓傳第十國風蟋蟀刺晉僖公也儉不中禮故作是詩以閔之欲其及時以禮自虞樂也此晉也而謂之唐本其風俗憂深思遠儉而用禮乃有堯之遺風焉蟋蟀在堂歳聿其莫今我不樂日月其除無已大康職思其居好樂無荒良士瞿瞿俱具反蟋蟀在堂歳聿其逝今我不樂日月其邁無已大康職思其外好樂無荒良士蹶蹶俱衞反蟋蟀在堂役車其休今我不樂日月其慆吐刀反無已大康職思其憂好樂無荒良士休休李曰此詩蓋言僖公過儉而不中禮欲其及時即詩所謂蟠蟀在堂是也以禮自虞樂即詩所謂好樂無荒是也此晉信公之詩而序以謂唐者帝堯舊都之地也鄭曰太原晉陽是堯姑居後乃遷河東平陽成王封母弟叔虞于堯之故墟曰唐侯南有晉水至於子燮改爲晉侯按漢地理志云中山國唐縣張晏曰堯爲唐侯國於此河東郡平陽縣應劭曰堯都也太原晉陽縣注云詩唐國周成王滅唐封弟叔虞臣瓉曰所謂唐今河庾永安是也地去晉四百里頗師古曰瓚說是也本其風俗所憂之事逺儉而中禮有堯之遺風是以謂之唐國風也後左傳季札觀周樂歌唐風曰思深哉其有陶唐氏之遺民乎不然何憂之逺也非令徳之後誰能若是班孟堅曰河東之民有先王遺敎君子深思小人儉陿故唐詩蟋蟀山有樞葛生之詩皆思奢儉之中念死生之慮皆謂此也說文曰蟋蟀恭也今之促織也春初生至夏鳴歳寒則入蟋蟀在堂則歳又將莫矣我不爲樂恐日月過亦可惜也故曰蟋蟀在堂歳聿云莫今我不樂日月其除逝徃也邁行也役車其休亦是歳莫之時也慆過也無已太康職思其居鄭謂君雖當自樂亦無甚太樂欲其用禮爲節也此說非也詩人之意但謂無自太康亦當思其所居之事然而好樂苟能無荒雖曰好樂夫何不可瞿瞿顧禮義也良士瞿瞿言當如良士瞿瞿然顧禮義也職思其外當職思其國外之事也職思其憂當職思其所憂之事也蹶蹶敏休美也皆言好樂苟能無荒所以爲良士之敏也好樂無荒鄭以此詩多以爲農功畢十二月當復命農訃耦耕事觀此詩本無農功意歐亦非之矣今不復云李斯曰堯之有天下也堂髙三尺采椽不斲茅茨不剪雖逆旅之宿不勤於此矣冬日鹿裘夏日葛衣粢糲之食藜藿之羮飯土匭啜土鉶雖監門之養不觳於此矣凡此皆是過言堯之儉使果如此則是不得禮矣豈有遺風猶能用禮而堯乃過儉乎柳子厚作晉問曰三河古帝王之更都焉而平陽堯之所理也有茅茨土鉶采椽之度故人至於今儉嗇有温菾克遜之徳故人至於今善遜此蓋未嘗深攷此詩而過信李斯之言也楊龜山曰國君儉不中禮而國之風俗乃能用禮歟所謂一國之事繫一人之本不亦異乎夫晉之爲晉久矣風俗之成非一日之積蟋蟀之詩蓋風之變也國人閔其君欲其及時以禮自虞樂而卒告之以好樂無荒可謂有禮矣昭公政荒民散四鄰謀取其國家而不知則作詩刺之可謂憂深思逺矣當是時風雖變堯之遺風未亡也及曲沃强盛國人將叛而歸之則不復有禮矣蓋風俗之成壞皆非一日之積所謂繫一人之本者其有見於斯歟此說得之矣黃講同山有樞刺晉昭公也不能修道以正其國有財不能用有鍾皷不能以自樂有朝廷不能洒埽政荒民散將以危亡四鄰謀取其國家而不知國人作是詩以刺之也山有樞隰有榆子有衣裳弗曳弗婁力俱反子有車馬弗馳弗驅宛其死矣他人是愉山有栲隰有杻子有廷内弗洒弗埽子有鐘皷弗鼓弗考宛其死矣他人是保山有漆隰有栗子有酒食何不日鼓瑟且以喜樂且以永日宛其死矣他人入室李曰人君所以正其國者惟修道而已能修道以正其國則何求而不得何爲而不成哉惟其不能所以有財不能用有鐘皷不能自樂有朝廷不能洒埽有財不能用即詩所謂衣裳車馬酒食之類是也有鐘皷不能自樂即詩所謂子有鍾皷弗鼓弗考是也有朝廷不能洒埽即詩所謂子有廷内弗洒弗埽是也有財不能用有鐘皷不能自樂有朝廷不能洒埽則政荒可知矣政之荒此民所以散而終以危亡也危亡之兆旣見而四鄰謀取其國家而不自知以見其偷生苟安也自古爲國者深謀逺慮雖當治安之時有危亡之戒其有危亡之機未嘗不知也晉昭公之偷生苟安如此故四鄰謀取其國家而不知此詩所以刺之也四鄰即桓叔謀伐晉是也山有樞隰有榆爾雅曰樞荎也郭璞曰今之刺榆也榆白枌也類有十種葉皆相似毛氏謂國君有貨財而不能用如山隰不能自用其財不必如此說詩人之意只言山之有草木猶人君之有衣裳車馬子有衣裳弗曳弗婁孔氏曰曳者衣裳在身行必曳之婁亦猶曳也弗曳弗婁猶無衣裳同也子有車馬弗馳弗驅亦猶無車馬同蘇氏以謂人君有衣服車馬鐘皷飲食不能用譬猶山木之不采終亦腐敗摧折歸於無用而已王氏則謂山隰有樞榆栲杻漆栗以自庇飾爲美者而人所資賴今也有衣裳弗能曳婁有車馬弗能馳驅有朝廷弗能洒埽有鐘皷弗能鼓考有酒食弗能爲樂曽山隰之不如也蘇氏以爲歸於無用王氏以爲人所資賴然詩中皆無此意爾雅曰栲名山樗郭璞曰栲似樗色小而白生山中因名云亦類漆樹陸璣䟽曰山栲與下田樗略無異葉似差狹耳吳人以其葉爲茗方俗無名此爲栲者似誤也今此云栲者葉似櫟木皮厚數寸可爲車輻或謂栲櫟杻檍也檍材可爲弓弩榦也栲杻漆栗皆是上章意王氏曰樞榆栲杻宫室器械之材而漆則可以飾器械栗則可食也曳婁其衣裳驅馳其車馬洒埽其廷内考擊其鐘皷則所以修其政故以樞榆栲杻刺之亦不必如此分别此但詩人便於押韻爾何必一一爲之說宛死貌愉樂也言有衣裳則弗曳弗婁有車馬則弗馳弗驅一旦宛然而死則衣服車馬將爲他人之所樂也考擊也保安也子有酒食何不日鼓瑟者言子有酒食何不日鼓瑟而飲食也且得以喜樂已身且可以永長此日蓋君子無故不徹琴瑟故也且以永日正如詩所謂以永今朝孔氏曰人而無事則長日難度若飲食作樂則忘憂愁可以永長此日此言是也入室者言苟不喜樂則他人將入我室以爲樂也抑詩曰洒埽廷内惟民之章晉昭公有朝廷不能洒埽不足以爲民章刺之可也至於有衣裳弗曳弗婁有車馬弗馳弗驅有鐘皷弗鼔弗考未爲太過而詩人乃刺之者蘇氏曰富貴安逸者天下之所同好也然而君子獨享焉享之而安天下以爲當然者何也天下知其所以富貴安逸者凡以庇覆我也貧賤勞苦者天下之所同惡也而小人獨居焉居之而安天下以爲當然者何也天下知其所以貧賤勞苦者凡以生全我也夫然後獨享天下之大利而不憂使天下爲已勞苦而不怍人君治其民必先樂民之樂而後自樂其樂今晉昭公有衣裳車馬鐘皷不能自樂其樂也夫自樂其樂尚且不能又何望其樂民之樂哉此詩所以刺之也然學詩當求其大意不可泥於章句文字之末如大夫夙退無使君勞信斯言也則惑於嬖妾以廢朝政不爲過矣今者不樂逝者其亡宛其死矣他人是愉信斯言也則肆其耽樂爲長夜之飲不爲子孫計者不爲過矣故曰以意逆志是爲得之黃曰齊宣王見孟子於雪宫曰賢者亦有此樂乎孟子曰賢者而後樂此不賢者雖有此不樂也人君苟能修道以正其國則雖役民以築臺而猶子來以勸趨植羽以從田而猶欣欣乎有喜有材而能用有鐘皷而能自樂有朝廷而能洒埽曰能云者有道以用也揚之水刺晉昭公也昭公分國以封沃沃盛彊昭公微弱國人將叛而歸沃焉揚之水白石鑿鑿素衣朱襮音博從子于沃旣見君子云何不樂揚之水白石皓皓素衣朱繡從子于鵠旣見君子云何其憂揚之水白石粼粼我聞有命不敢以告人李曰左傳桓二年初晉穆侯之夫人姜氏以條之役生太子命之曰仇其弟以千畝之戰生命之曰成師師服曰異哉君之名子也嘉偶曰妃怨偶曰仇古之命也今君命太子曰仇弟曰成師始兆亂矣兄其替乎惠公二十四年晉始亂故封桓叔於曲沃師服曰吾聞國家之立也本大而末小是以能固故天子建國諸侯立家今晉甸侯也而建國其能久乎惠之三十年晉潘父弑昭侯而納桓叔不克正所謂昭公分國以封沃沃盛彊昭公微弱國人將叛而歸沃之事也仇文侯也昭公文侯之子也沃者成師桓叔也晉雖封之乃所以爲禍也鄭曰激揚之水波流湍疾洗去垢濁使白石鑿鑿然興者喻桓叔彊盛除民所惡民得以有禮義也是以水喻桓叔以石喻民其取譬爲不倫歐陽已非之矣當從王蘇之說以水喻昭公以石喻桓叔言昭公微弱不能制桓叔使之得時以成其彊盛亦猶水之揚不能流白石衹以益其鑿鑿耳鑿鑿鮮明貌與傳所謂粢食不鑿是也皓皓㓗白也粼粼說文曰水生涯石間曰粼粼亦是上文意素衣朱襮爾雅曰黼領謂之襮孫炎曰繡刺黼文以褗領郊特牲云繡黼丹朱中衣大夫之僭禮也大夫服之則爲僭知諸侯當服之也中衣者朝服祭服之裏衣也其制如深衣此所謂素衣朱襮素衣朱繡即郊特牲所謂繡黼丹朱中衣是也民以桓叔不得自立故具此服從桓叔於曲沃欲其幷晉國以爲諸侯也子指桓叔也王氏則以朱襮朱繡爲大夫之僭禮而謂亂生於衣服之間其說爲桓叔僭爲此服旣是以桓叔爲僭則下文從子于沃不相貫沃即曲沃桓叔所封之地也漢地理志云河東聞喜縣故曲沃漢武帝元鼎六年行過更名應劭曰武帝於此聞喜越破改曰聞喜九域志今隆州有曲沃城鵠曲沃别邑也君子指桓叔也旣見君子云何不樂以見其得衆心也我聞有命不敢以告人亦是言得衆心也張横渠曰民愛桓叔聞有叛逆之命不敢以告人以見民心之愛桓叔其深如此夫君子之名豈易得哉桓叔之於晉蓋將肆其篡逆之志是后羿寒浞之流也晉人善之以爲君子雖有叛逆之命猶不敢以告人桓叔何施而得此名古者不軌之臣欲行其志必先揚美事以邀衆譽施小惠以收衆情然後民翕然從之田氏之於齊亦猶桓叔之於晉田氏以家量貸民而以公量收之國人愛之如父母亦猶晉民以桓叔爲君子也其後廢太子荼召公子陽生於魯而立之公子陽生夜至於齊國人知之而皆不言所謂我聞有命不敢以告人也夫田氏桓叔所以至此者惟其齊晉之君敎化不行禮義不明無得民心之道民旣無所歸而有田氏桓叔安得而不歸之哉使齊晉之君能以義正衆使衆知義雖有不軌之臣亦莫之從也尚肯以君子之名而歸之哉叔于田鄭以叔段爲仁人詩不刺叔段而詩序刺鄭伯晉人以桓叔爲君子詩不刺桓叔而詩序刺昭公豈叔段果爲仁而桓叔果爲君子而無可刺之迹哉蓋桓叔叔段之罪易見鄭伯昭公之惡難知故詩推本其禍之所由起而譏之也昭公鄭伯且刺之矣況於桓叔叔段乎黃講同毛詩集解卷十二
