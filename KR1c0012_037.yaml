body:
  text: 毛詩集解卷三十七宋李樗黃櫄撰三頌黃曰詩之有頌何也盛德不居成功不有以告天地以報祖宗豈直大其事俊其辭以誇當年耀來世而為是美觀哉周之有頌人以為作於成周太和之時而不知其始於文武積纍之日自文武積纍而至成王自風極而至於頌其所由來者逺矣魯頌之作曰頌僖公非告神明也曰居常與許復周公之宇皆願之之辭非成功也聖人思西周之盛而不可得幸而有僖公之賢而魯人尊之聖人之心若曰魯周公之後也而其所以得人心者又如此吾又何貶焉故春秋謂之魯春秋而詩亦有魯頌所以尊周而存商頌所以仁前代此三頌之説也而亦聖人之意也清廟之什詁訓傳第二十六周頌清廟祀文王也周公既成洛邑朝諸侯率以祀文王焉於穆清廟肅雍顯相濟濟多士秉文之德對越在天駿奔走在廟不顯不承無射於人斯李曰周公之營洛邑見於召誥洛誥按書召誥曰越三日庚戌太保乃以庶殷攻位於洛汭越五日甲寅位成若翼日乙卯周公朝至于洛則逹觀于新邑營越三日丁巳用牲于郊越翼日戊午乃社于新邑越七日甲子周公乃朝用書命庶殷侯甸男邦伯則是周公營洛邑之時諸侯皆在也至於成洛邑以朝諸侯則於書無所見按車攻之序曰宣王能內修政事外攘夷狄復會諸侯於東都焉東都即洛邑也宣王中興復於東都之地以朝諸侯則是成洛邑以朝諸侯雖其書無所見而車攻之序言復會諸侯於東都亦可以見也鄭氏曰成洛邑居攝五年時孔氏推廣之曰周公成洛邑在居攝五年其朝諸侯在六年明堂位言踐天子之位以治天下言六年朝諸侯於明堂即此時也愚竊以為不然按書云在十有二月惟周公誕保文武受命惟七年則是周公成洛邑在於七年非在於五年周公成洛邑之時諸侯皆在遂因而朝諸侯非成洛邑在於五年朝諸侯在於六年明堂位之言不足信也其曰周公踐天子之位朝諸侯於明堂亦非也夫周公特攝其位而已曷嘗踐天子之位乎周公所以朝諸侯者特相成王以朝諸侯而已周公非自居南靣而受諸侯之朝也朝諸侯率以祀文王者洛誥所謂王在新邑蒸祭嵗文王騂牛一武王騂牛一此所以謂祀文王也孝經曰昔者明王之以孝治天下也不敢遺小國之臣而况於公侯伯子男乎故得萬國之歡心以事其先王治國者不敢侮於鰥寡而况於士民乎故得百姓之歡心以事其先君治家者不敢失於臣妾而况於妻子乎故得人之歡心以事其親自天子至於卿大夫尊卑雖不同而必以盡其所有合其歡心以事其親然後為孝故為天子者必合天下之歡心為諸侯者必合一國之歡心為大夫者必合一家之歡心然後見其事先君之孝必盡其所有以祭也周公成洛邑朝諸侯率以祀文王則是能合四海之歡心也故孔子以為郊祀后稷以配天宗祀文王於明堂以配上帝是以四海之內各以其職來祭觀此則知周公之孝於穆清廟清廟鄭氏以為天德清明文王象焉其意以為文王與天合其德故以為天德清明文王象焉王氏從而推廣其説以謂湯之伐桀衆以為我后不恤我衆而割正夏而湯誥云夏德若兹今朕必往則是聖人之任也文王三分天下有其二以服事殷此聖人之清也不如蘇氏以為清廟肅然清靜按左傳曰清廟茅屋大路越席大羮不致粢食不鑿昭其儉也清廟之中但以茅飾屋所以著其儉杜元凱注曰清廟肅然清靜之稱也蘇氏之説蓋本諸此張文濳又謂治人之道尚明故施政之堂曰明堂事神之道尚潔故文王之廟曰清廟禦侮之道尚肅故宫室之牆曰蕭牆明不蔽也清不汚也肅不亂也王氏以為周公穆穆而帥諸侯則諸侯以肅雍而應周公其説雖善然以於穆為欽和古人之辭疑不如是不如毛氏以為於乎美哉周公之祭文王之清廟乎穆美也鄭氏以肅雍顯相謂周公祭清廟其禮儀敬且和又諸侯有光明著見之德者來助祭一句之中上二字以為周公下二字以為諸侯不可以從也故於穆清廟當從毛氏之説肅雍顯相當從王氏之説言於乎美哉周公之祭清廟也諸侯之來助祭者敬而且和也敬之與和祭祀之所貴雍之詩亦曰有來雍雍至止肅肅惟其肅肅則是其心之敬惟其雍雍則是其貌之和心敬而貌和而其祭可謂誠矣肅雍顯相以見諸侯之助祭也如此雖不言周公所以帥之而帥之之意自見亦猶何彼襛矣言曷不肅雍王姬之車人之望見王姬之來曷不肅雍乎此乃王姬之車也此雖不言王姬肅雍而王姬之意自見今此不言所以帥之而諸侯能如此亦見周公所以帥之也濟濟衆多之士也孔氏謂序言朝諸侯帥以祀文王者止率諸侯耳多士亦助祭而序不言帥之者王朝之臣助祭為常非所當率故不須言雖以濟濟多士為王朝之臣然亦不必專指王朝之臣孝經曰不敢遺小國之臣而況於公侯伯子男乎以諸侯之臣皆與之豈必王朝之士乎故凡王朝之臣與夫諸侯之臣皆與其中焉濟濟多士皆秉文王之德而祀文王在天之神洋洋然如在其上如在其左右固足以配祀文王矣而在廟又皆奔走以助其祭夫對越在天則內以盡其德駿奔走在廟則外以盡其力內盡其德外盡其力則其所以助祭也可謂至矣盡矣以見文王既沒其德在人者不可忘文王之德豈不顯乎豈不奉承於人乎信乎無有厭斁於人也文王之生諸侯奉之未足以見其德之盛文王既沒天下之人奉承之如是之久然後可以見其德之盛周公以四海之內各以其職來祭則是聖人之德無以加於此周公之孝於此可見然序但言美文王者以清廟所祭者乃文王故專歸美於文王也黃曰清廟之詩乃洛邑既成諸侯四朝周公相成王率諸侯以祀文王如斯而已今鄭氏孔氏之説皆以為周公踐天子之位以治天下朝諸侯於明堂豫竊以為不然夫書曰周公位冢宰正百官又曰召公為保周公為師相成王為左右又曰周公曰王若曰則是周公未嘗踐天子位無疑也洛誥之書言王在新邑蒸祭嵗文王騂牛一武王騂牛一則祀文王之時而王在新邑周公率諸侯以朝之又無疑也孔子曰郊祀后稷以配天宗祀文王於明堂以配上帝則周公其人也曰周公其人云者言周公必如是而後可以無愧使周公果踐位稱王則孔子奚取哉豫敢詳為之辨文王之廟謂之清廟何也或曰鳴條之役有今朕必往之辭此聖人之任也文王三分天下有其二以服事殷此聖人之清也夫孔子形容文王之德曰至德而詩人形容之曰之德之純中庸形容之曰天之所以為天文王之所以為文王也是皆形容不盡之意也而清之一字果足以盡文王之德云乎哉左氏曰清廟茅屋大路越席昭其儉也杜元凱注曰清廟肅然清靜之稱近世張右史曰治人之道以明為貴故施政之堂謂之眀堂事神之道以潔為貴故文王之廟謂之清廟此説盡之嗚呼吾觀清廟一詩而嘆文王之德何其在人心耶夫德足以感人心於一時不若足以感人心於後世頌美文王之德其所以在人心者不泯也故在當時曰濟濟多士文王以寧後世則曰濟濟多士秉文之德故清廟一詩形容清廟之美相祀之誠而其所以形容之微意則在於秉文之德一句蓋見王姬之車者自有曷不肅雍之辭入文王之廟者自有肅雍無射之心文王之神無所不在而祭者之心以為如在對越其所以在天與奔走其所以在廟祭者之心無所不盡其極也曰不顯不承者此又推其不祭之時文王之德亦能使人之無厭射如此也噫雍雍在宫肅肅在廟此文王之德也今曰肅雍顯相非秉文之德乎不顯亦臨無射亦保此文王之德也今曰不顯不承無射於人斯非秉文之德乎吾觀思齊之詩而得清廟之遺意也維天之命大平告文王也維天之命於穆不已於乎不顯文王之德之純假以溢我我其收之駿惠我文王曾孫篤之李曰文王受命作周未盡得天下而沒至成王時始致大平遂歸功於文王而告廟焉自古人君能成其治功則必明歸功於祖廟而不敢以為己有也武王得天下也曰惟我文考若日月之照臨光于四方顯于西土惟我有周誕受多方豫克受非豫武惟朕文考無罪受克豫非朕文考有罪惟豫小子無良是歸功於文王也故成王致太平亦曰假以溢我我其收之亦是歸功於文王也中庸舉此詩以謂維天之命於穆不已蓋曰天之所以為天也於乎不顯文王之德之純蓋曰文王之所以為文也純亦不已中庸之書其言詩也亦是斷章取義此詩之意言天命周家無有窮已故始也命文王以及成王也中庸之説則以文王之德之純對於穆不已以相對為説觀此詩所言大概以謂天之命周家如此之厚故先言於穆不已下句遂解此天命不已之意言天命文王至於成王也命者天之命周家也鄭氏云命猶道也此亦出於中庸之説王氏則以於穆為敬和亦曲説也於乎不顯言於乎美哉文王之德豈不光顯乎蓋其德純一既見於文王之身而其後又洋溢以及於成王也而成王假之以致大平後世常大順文王厚而行之則可以保大平之業也駿大也惠順也篤厚也歐陽曰此詩不言武王主於祭文王也其説甚善鄭氏曰大順我文王之意謂為周禮六官之職此皆附會之説不足信也黃曰行而後説動而後敬言而後信此可見之效也而猶未離乎人也未行而説不動而敬不言而信篤恭而天下平非與天同德者孰能致之故曰上天之載無聲無臭儀刑文王萬邦作孚此告大平之詩所以言天之所以為天與文王之所以為文王也噫維天為大惟堯則之此堯之所以為堯也天德而出寧日月照而四時行此舜之所以為舜者也若夫時雍太和之治特其緒餘耳此一詩惟中庸形容之盡而諸家之説皆不足考其曰中庸斷章取義何其謬歟維清奏象舞也維清緝熙文王之典肇禋迄用有成維周之禎李曰象舞文王之舞也春秋襄公二十九年吳季子聘於魯觀周樂見舞象簫南籥者曰美哉猶有憾則是象舞乃文王之舞也橫渠先生曰周樂有象武勺三者象是武王為文王廟所作武功本於文王故武王歸功於文王以作此樂象文王也大武必是武王既死國人所奏之樂奏於武王之廟勺是周公七年之後制禮作樂時大武有所增益也故勺言告成大武此乃據序為説則是象舞者乃文王之舞武舞者乃武王之舞故將奏象舞則必歌維清之詩將奏武舞則必歌大武之詩有其舞必有其歌舜之樂歌於堂有九德之歌九韶之舞自古然也鄭氏之説乃以謂象舞象用兵殺伐之舞武王制焉蘇氏則以為文王之舞蓋文舞也一則以為文舞一則以為武舞無所考證難以參訂然觀詩之所言但言文王之典足以知其為文舞也武之詩言勝殷遏劉耆定爾功酌之詩言於鑠王師遵養時晦此二詩猶疑是武舞也其詩篇之名雖不言文舞武舞觀詩之意自可見也禮記曰十有三年學樂誦詩舞勺成童舞象明堂祭統亦皆謂升歌清廟下管象朱干玉戚以舞大武説者皆以象為武王之舞象舞既是文王之舞又為武王必不然也清明也緝繼也熙廣也天下之所以清明無事其後世又能繼而廣之皆是文王典法所致也文王造周未得天下而沒天下之治也已見於文王故祭天之禮皆自文王始也自今已後迄有成功原其周之禎祥則在於文王也禮記曰國家將興必有禎祥國家將亡必有妖孽文受命作周至武王則得天下成王致太平之治其禎必在於文王時也毛鄭則以文王受命始祭天而征伐孔氏遂謂文王祭天必在受命之後未知其何年郊祭二家之説皆因文王受命遂為此辭使文王而祭天則是受命稱王僭偽不臣文王不免有罪也生民之詩曰后稷肇祀庶無罪悔以迄于今説者遂謂后稷祭天嗚呼使后稷而祭天則不足為后稷使文王而祭天則不足為文王以諸侯而祭天此乃暴秦之君無所忌憚者所為而謂后稷文王亦為之乎詩人之言非不明甚但學者不詳味之生民之詩曰后稷肇祀乃是歸功於后稷言祭天之禮所以行於今者自后稷之致也此詩言肇禋亦是歸功於文王言祭天之禮所以用於後世者乃自文王所致也詩人之言學者自亂之耳文王有君民之大德有事君之小心使紂之在日而文王設為祭天之禮安在其為事君之小心哉黃曰吾觀維清之頌而見文王之純乎天也古之聖人迫之而後動求之而後應者吾於湯武見之迫之而愈不動求之而愈不可得徽柔懿恭而不忘乎民小心翼翼而不忘乎君感而遂通而不失其為寂然不動與民同患而能退藏於密無然畔援無然歆羡文王之心天知之矣雖則如燬父母孔邇文王之心非特天知之而汝墳之婦人亦化之故曰有君民之大德有事君之小心吁兹文王之所以純乎天也哉是故成湯之心見於濩舞武王之心見於武舞文王之心見於象舞濩舞之樂季子知其猶慚武舞之樂孔子嘆其未盡善聖人之心茍有不足於中者無隱也維清之頌其文王象舞之樂章乎其辭簡而明直而大文王純德之所著見乎季子見舞象簫南籥者曰美哉猶有憾杜元凱注云文王恨已不及致大平嗚呼吾觀維清之頌象舞之樂見其廣大熙熙而二子所謂憾且恨果何見也鄭氏之説又謂象舞象用兵時刺伐之舞夫詩但言文王之典則非象其殺伐之事可知如奏大武之詩言勝殷遏劉耆定爾功則其為武舞亦可知也維清緝熙文王之典其説不過曰文王之心不可以形容而文王之典著見於天下清明而廣大一豪之人偽不容於其中兹其所以為文王之典也而諸家之説則以為天下之所以清明而無事者乃文王有征伐之法故也夫詩但言文王之典烏在其為征伐之典也哉肇禋迄用有成維周之禎要其説不過曰祀帝之禮推所自來實文王基之也然則後世之所以享成功而成大業者其禎祥已見於文王之時乎此詩人推本而言之也而諸家之説則以為文王受命為王有征伐之功而行祭天之禮嗚呼學者不知聖人之心其亦深得罪於聖人矣使文王名為事紂而實稱王未嘗為王而行祭天之禮則是與後世僭偽不臣者無以異也而謂文王為之乎生民之詩曰后稷肇祀以迄于今而此詩曰肇禋迄用有成蓋周人郊祀后稷以配天宗祀文王於明堂以配上帝故生民所謂肇祀者言祭天之禮而歸功於后稷此詩所謂肇禋者言祀帝之禮而歸功於文王如所謂大王肇基王迹皆推本之論也豫故詳為之辨烈文成王即政諸侯助祭也烈文辟公錫兹祉福惠我無疆子孫保之無封靡于爾邦維王其崇之念兹戎功繼序其皇之無競維人四方其訓之不顯維德百辟其刑之於乎前王不忘李曰孔氏云周公居攝七年致政成王乃以明年嵗首即此為君之政於是用朝享之禮祭於祖考有諸侯助王之祭既祭因而戒之蓋成王即位之初年方幼沖故周公攝政既而周公復辟成王始親政事亦猶漢宣帝始立霍光既死宣帝始親政事也烈光也文章也此蓋言當時諸侯助祭既畢成王因以戒之光大文章之諸侯我周之文武錫汝諸侯之福而為周家之屏翰文武之所以綏惠諸侯者無有窮已但爾之子孫必思有以保之也毛鄭説此詩不同毛氏則以為文王錫之福鄭氏則以為天錫之福王氏則以為錫周之祉福王氏之説固非矣鄭氏之説亦未為善也此詩言諸侯助祭助祭既畢因而告之以烈文辟公錫兹祉福乃文王錫之福文王所以惠我諸侯至於惠我無疆爾諸侯尚不能保之則亦不能長享富貴也凡諸侯不能保之者非文王不能惠我無疆也乃爾之諸侯不能盡保之之道也自此以下則言保之之道封殖也靡侈也人君已自封殖則必有害及斯民害及斯民則國必至於亡自古好利好奢亡其國者多矣惟其好利則掊克百姓之財惟其好奢則必掊克百姓之利以充一已之欲至於人民愁怨帑藏空虛莫之恤也孔子曰在上不驕髙而不危制節謹度滿而不溢髙而不危所以常守貴也滿而不溢所以長守富也惟能不殖爾邦則可以長守富貴而天子所以尊崇之也戎大也爾宗之有大功爾子孫當纘其功則繼其序而增大之也莫強於得人得人則四方順服矣孔子用於魯則齊人歸其侵疆段干木用於魏而秦人不敢加兵是以賢人在朝四方其有不服乎莫光顯者修德也不顯申伯王之元舅文武是憲百辟其有不為法乎凡此所言文武所以告諸侯者未嘗少忘成王即位之初其敢忘之乎成王以能奉其祖考之意所以戒諸侯者為必備諸侯又能繼其祖宗之業所以承天子者為甚謹君臣之間永保無疆之祿豈不美哉黃曰告人以所當為不若勉人以其所欲為天下之理凡其所當然者皆人之所當為也知其所當為而或不能為者無以動其欲為之心也是故告人以當為之事而使人有欲為之心者惟明於人情者能之成王當即位之初四方諸侯奔走而聽命成王因諸侯之助祭而作烈文之詩以勸戒之其辭溫柔和易使聽之者有躍然不能自己之意何其明於人情也夫受福而遺其子孫人情之所同欲也子孫世世保民諸侯之願孰不在此成王謂爾諸侯之有功烈有文章者吾固錫之福矣然是特一時之福而非無窮之福也爾能屏翰王室尊君愛民無一豪自用之心而常盡其所以惠我之實則億萬斯年與國同休子孫其保之矣人情樂於子孫之保也其敢萌一慢心乎位愈隆而爵愈尊尤人情之所同欲也得君之榮加爵之寵諸侯之願孰不在此成王謂爾無封殖以漁民利無侈靡以傷民財不萌一豪自縱之心而常盡其節用愛民之實則豫一人汝尊維王其崇之矣人情樂於君之榮我也其敢萌一侈心乎至於告之以念前人之功則勉之以大前人之業皆困其所欲為之心而喻其所當為之理人所當用也告之用人而曰無競維人四方其訓之人情孰不欲強其國也孰不欲為四方之訓也則用人之説其可忘乎德所當修也告之以修德而曰不顯維德百辟其刑之人情孰不欲顯其身也孰不欲為百辟之法也則修德之説其可忽乎昔魯用孔子而歸其疆秦用孟明而霸其國齊用黔夫而燕人祭北門趙人祭西門則人雖若無競而實為競也隨侯修德而楚不敢伐晉君修德而楚不敢兵秦人增修國政而趙成子言於諸大夫曰秦念德不怠其可敵乎則德雖若不顯而實顯也繼之曰於乎前王不忘此又成王感發諸侯不盡之意前輩謂無逸一篇其要在於七嗚呼三不敢字上愚謂烈文一詩其要在於乎前王不忘之一句學詩者試深思之天作祀先王先公也天作髙山大王荒之彼作矣文王康之彼徂矣岐有夷之行子孫保之李曰鄭氏以先王謂大王以下先公諸盩至不窋諸盩至不窋固是周之先公也周之祭豈能盡及先公而若謂合祭則毁廟之主皆與在焉則諸盩不窋亦在所當祭也然序不言合祭何由而知之若曰四時之祭則所祭者但七世至先公則三人而已天保之詩曰禴祠蒸嘗于公先王禴祠蒸嘗乃四時之祭也四時之祭及於先公不過一二人而已天保之詩言于公先王先言公而後言王今此先言王而後言公蓋天保之所以先言公而後言王者先後之序也此先言王者蓋此詩所言王迹之所自起故序先言先王也昊天有成命郊祀天地而詩之所言但言天而不言地此詩所言但言先王而不及先公其意一也曰天作髙山鄭氏謂天生此髙山使興雲雨以利萬物大王自豳遷焉則能尊大之廣其德澤鄭氏以天生此髙山使興雲雨乃衍説也詩之所言但言大王遷於岐矣以天生此髙山使興雲雨詩無是意也鄭氏之説雖非猶以髙山為岐山至於王氏乃謂后稷以功德有國則髙山之譬也其後失職自竄伏於戎狄則嘗荒矣至於大王而後復治則是以髙山喻后稷功德其取喻逺矣詩言髙山乃岐山也公劉遷于豳故詩人言豳居允荒大王遷於岐故詩人言天作髙山大王荒之荒之治之也天作髙山大王既荒治之而作興矣至文王而後康之大王所以荒之則未必康之也文王康之然後足以見周家之盛矣彼徂矣鄭氏則以謂彼萬民也徂往行道也彼萬民之居岐邦者皆築作宫室以為常居文王則能安之後之往者又以岐邦之君有佼易之道故也王氏則以徂為天徂而從之惟蘇氏則以徂為逝當從之大王作而興矣文王康之文王既康之今又逝矣然自大王治岐皆有簡易之行子孫所以守之而勿替也頌之所言多先言祖先之事業而末以子孫繼之為言維天之命曰駿惠我文王曾孫篤之我將之詩曰我其夙夜畏天之威于時保之其於末章皆言子孫持守之道其實一也黃曰天下之事固未嘗不本於天而所以為天者未嘗不本於人聖人不恃其在天之或然者而嘗盡其在人之當然者蓋聖人之心與天默契凡天理之自然者皆聖人之心以為當然也然聖人盡其心於天理當然之先而常人推其效於天理既定之後上帝臨汝天何心哉帝謂文王天何言哉天固不能諄諄乎命乎人而聖人亦豈屑屑然求合於天不言傳而已傳不識不知不求合而自合以是論之則天未嘗有心於聖人而聖人亦未嘗有心於天聖人知盡其在我者而天命之所在則不容毫髮於其間也嗚呼遷岐之役果大王之心乎狄人不侵大王何心於去豳事以珠玉幣帛而得免大王何心於遷岐狄人欲吾土地大王不忍以其所欲而害人去豳而遷岐大王之心亦安之天而已而豈有心於天之我豫也而詩人之言必曰帝省其山曰帝遷眀德曰帝作邦作對而此詩又曰天作髙山大王荒之夫大王之遷非得已不已也而詩人必以天言之其意似以為岐可以興周而天固使大王之都岐也吁知天而不知人者常人之論耳吾何取於雅頌哉蓋詩人之所謂天者非獨曰天而已矣詳觀天作一詩始言天作髙山似不知有人之説也然其一篇之意則在於大王之荒文王之康子孫之保而不獨歸之天也西周之地能興能衰關中之地可王可亡此君子是以有所謂人之説也太王遷岐豳人曰仁人也不可失也從之者如歸市當此之時周雖未興而人心已有在矣此岐之所以大也故曰大王荒之繼之以文王徽柔懿恭以保民也不遑暇食以和民也周雖舊邦其命維新當此之時人心愈固而天命愈不可易矣此岐之所以安也故曰文王康之大王大其基文王安其業推而極於岐山之民皆歸於大中至正之域則化益深矣遵王之道遵王之路而黨偏反側無有也周道如砥其直如矢君子小人皆化也故曰岐有夷之行成王之心以為積於前者如此其至繼於後者其敢有忽心哉曰子孫保之此自然之辭也夫始也歸其功於前人終也勉其效於後世是豈獨歸於天而已乎諸儒講解見詩以天作名篇而皇矣之詩又有帝作邦之詩則皆曰岐以天立周以岐興而不知岐非以天立也以大王文王而立也周非以岐興以大王文王而興也此愚之臆見不敢以為詩人之意昊天有成命郊祀天地也昊天有成命二后受之成王不敢康夙夜基命宥密於緝熙單厥心肆其靖之黃曰此詩蓋郊祀天地之樂章也孔氏謂於南郊祀所感之天神於北郊祭神州之地祗蘇黃門亦以謂冬至之日祀天於圜丘夏至之日祀地於方澤皆是據周禮以為説竊嘗以序觀之則郊祀天地又疑是合祭也李君弼先生專據此詩為言郊祀天地以合祭天地為無疑而不信南北郊之説東坡亦曰古者杞上帝則并祀地祗何以明之詩之序曰昊天有成命郊祀天地也此乃合祭天地經之明文若二公者可謂篤於自信而不惑於衆人之説也然説者乃以比之豐年秋冬報也謂秋冬各報而皆歌豐年則天地各祀而皆歌昊天有成命東坡言之詳矣豐年之詩曰豐年多黍多稌亦有髙廩萬億及秭為酒為醴蒸卑祖妣以洽百禮降福孔皆此詩歌於秋冬可也至於此詩專言天而不言地合祭之日則可歌尊天也若祭地於北郊歌天而不歌地烏有是理哉昊天蓋因天之號而為文也王氏謂萬物皆相見而帝亦於是與萬物相見楊龜山破之曰若謂萬物相見於南方郊祀當因於萬物相見之時而用冬至之日何也此説甚善孔氏惑於鄭氏之説以為感生帝其惑益甚矣此詩蓋言昊天有成命文武受之故成王業則不遑安寧夙興夜寐必為受命之基而行寬大之政所以答天之命也成王者成王業也自國語為此説至賈誼則以為成王武王之子也以成王不敢康為武王之子可也若如此説則下文之説不行矣故成王當以為成王業為後世子孫者當繼而廣大之而大盡其心庶幾能保大平之基業也文武以奉天為心為子孫者當以文武之心為心然後相須以成大平之業也於緝熙或者以為文武夫於緝熙當以為成王鄭氏雖以為成王而以緝熙謂如學有緝熙光明若以緝熙為光明則文不相接黃曰昊天有成命一詩謂郊祀天地而作也郊祀之詩意者必言郊丘之位豆登之儀牲牷之肥腯今考之詩無一辭以及此而特言文武以上天之心為心後人當以文武之心為心天之命周已成而不可易文武之受天命益勤而不敢忽飲食人所嗜也而不暇盤遊人所樂也而不敢王業之所以成者皆自不敢康之心以成之也不顯亦臨不容有欺心陟降庭止不敢有慢心天命之所基者皆自宥密之心而基也文王之所以成王業基天命者如此則後人之所以繼而廣之者當如何哉亦惟盡此心而已無愧於文武之心而後能安文武之天下無負於天命無愧於文武此成王郊祀天地之心也成王之祀在心而不在物故此詩之作不言物而言心昔孔子嘗援是詩以為無聲之樂夫樂而至於無聲豈言語之所可及而形迹之所可見哉文武成王吾知其同此心之運而非言語形迹之所可盡也我將祀文王於明堂也我將我享維羊維牛維天其右之儀式刑文王之典日靖四方伊嘏文王既右饗之我其夙夜畏天之威于時保之李曰蘇黃門云詩之頌祭天地有三一曰昊天有成命以郊祀天地記所謂禘嚳祀昊天於圜丘而以嚳配之其二曰我將祀文王於明堂以配上帝其三曰思文后稷配天此所謂郊祀禘其祖之所自出而以其祖配之竊嘗謂蘇黃門之説蓋信康成之誤昊天有成命之詩但言郊祀矣未嘗言禘也亦未嘗言禘嚳也郊自為郊禘自為禘不可混而為一也禮記曰周人禘嚳而郊稷祖文王而宗武王則是郊也禘也祖也宗也四者各有一祭豈可為一哉趙先生曰鄭玄云禘謂配祭昊天上帝於圜丘蓋見祭統所説文在郊上謂為郊之最大者故為此説祭統所論禘郊祖宗者謂六世之外永世不絶者有此四種耳豈關配祭哉禘者其所及者最逺故在郊之上趙先生此言可謂中康成之病耳而蘇黃門猶信之何邪竊嘗以思文之詩言后稷配天即孝經所謂郊祀后稷以配天也如此詩所謂祀文王於明堂即孝經所謂宗祀文王於眀堂以配上帝也至於昊天有成命之詩此固是郊祀上帝其中未嘗配以后稷則當闕之且如孝經言郊祀后稷以配天宗祀文王於明堂以配上帝天與帝似不同而説亦異同至有言感生帝赤熛怒含樞紐白招拒靈威仰皆以讖緯之言惑聖人之經不足信也惟伊川以為郊祀后稷以配天宗祀文王於明堂以配上帝天與帝即一也冬至郊祀天地以物始生之時故以祖為配季秋享明堂以秋物成之時故祀於明堂而以禰為配或尊之或親之也我將毛氏以為大不如鄭氏以為奉我之將奉者薦享者維羊維牛也天之所以右我者則以我能儀式刑文王之典日靖四方非為牛羊故也天若福我文王則必享吾之祭矣杜鄴云行穢登豐猶不蒙佑德修薦薄吉必大來言天之右我者非為牛羊之故惟能儀式刑文王之典故耳此典乃文王所作也文王既作此典為天之福我能奉行文王之典則天豈有不福哉天福文王則必享吾之祭矣雖曰享吾之祭亦豈可蕩然自滿而忘畏天之心哉故當夙興夜寐亹亹怵惕畏天之威然後可以保太平之業也儀則也式象也刑法也鄭氏謂受福於文王不如蘇氏天不遺文王而福之黃曰此宗祀文王於明堂以配上帝之詩也冬至郊祀天地以物始生之時故以后稷為配季秋大享於明堂以物已成之時故以文王為配天猶帝也帝猶君也郊天而配以后稷尊之也明堂而曰帝配以文王親之也非成王周公孰能與於此哉我將我享維羊維牛説者以為備物之祭非也成王以為我之所以將其誠以享上帝者維羊維牛而已物至簡也而天之所以佑助我國家者豈以是物哉法文王之典以安文王之天下天若福我文王則必享我之祭矣天既享我之祭則我亦當盡其畏天之心夙興夜寐栗栗危懼而不忘於畏天之威然後大平之業可得而保也天下者天與文王之天下也吾能無愧於文王無愧於上帝則奉祀之誠孰加於此乎成王之郊祀天地則曰單厥心肆其靖之祀文王於明堂則曰儀式刑文王之典日靖四方當是時天下已安矣而猶曰日靖云者成王當已治之時而常持之以未治之心不敢以天下之已安而吾心遂蕩然而自滿也時邁巡守告祭柴望也時邁其邦昊天其子之實右序有周薄言震之莫不震疊懷柔百神及河喬嶽允王維后明昭有周式序在位載戢干戈載櫜弓矢我求懿德肆于時夏允王保之李曰宣公十二年左氏曰式王克商作頌曰載戢干戈載櫜弓矢我求懿德肆于時夏允王保之則是時邁乃武王之詩國語又稱周公之頌曰載戢干戈載櫜弓矢則是時邁乃周公所作也故韋昭注云武王既伐紂周公作此詩也禮記曰嵗二月東巡守至於岱宗柴望祀于山川柴者祭天而告至也自古人君之巡守所至方嶽之下則柴望以告祭故舜巡守望秩於山川遍于羣神武王巡守亦必然矣鄭康成曰巡守告祭者天子巡守行邦國至於方嶽之下而封禪也此説非矣范內翰髙平公嘗謂古者天子巡守至于方嶽以柴望告祭所以尊天而懷柔百神也後世議禮者失之諸儒阿諛者以希世主謂之封禪蓋始於秦古無有也此説盡之矣古之人君其巡守也但有告祭柴望之禮初未嘗有封禪也如史記所言舜柴望而為封禪是皆飾六經之言以文姦言也自秦漢以來時君世主貪心侈意必為封禪以告大平欲顯已大平之功遂行封禪之禮而臣之諂諛者亦曰封禪古所有也必以六經之言似於封禪者遂從而惑於人主以謂古之人既行之矣今之世何憚而不行邪漢武帝議封禪諸儒莫得其制遂采王制虞書射牛之事夫所謂虞書者謂望秩於山川也凡此之類皆假諸書以説人主其罪豈不重哉秦皇漢武之時固然矣而文帝之時亦命諸儒議封禪而諸儒亦采六經王制以為封禪夫封禪之禮求六經之外則有之矣六經之中古人無是也必采六經以為封禪是特附會其言而已孔氏曰巡守不必封禪封禪必待太平則武王之時未封禪也此詩述武王之事鄭氏言至於方嶽之下而封禪者廣解巡守所為之事言封禪者亦因巡守為之非武王自封禪也孔氏之意以武王之時未致太平故不為封禪然武王不封禪亦何害其為武王哉齊桓公欲封禪管仲曰古者封太山禪梁父七十二家而夷吾所記者十有二焉數十二於周故惟言成王夫武王既不封禪矣成王亦豈為哉此管仲之言亦不足信邁行也言式王巡守諸侯之邦昊天以武王能答天之意遂子愛之而錫福使之各得其序諸侯莫不畏威而震疊百神莫不懷柔而及河喬嶽此言天之福武王如此夫天之福武王以諸侯則莫不畏威以百神則莫不懷柔人神各得其所詩人推美之曰信乎王能盡為君之道也故曰允王維后鄭氏謂右序有周乃天祐助次序其事謂多生賢智使為之臣也所謂實右序有周者豈必是生賢智以為臣哉歐陽公已辨之矣其於薄言震之又謂其兵所征伐甫動之以威則莫不動懼而服者言其威武又見畏也夫武王所巡守者非是以兵而征伐也下文曰載戢干戈載櫜弓矢則是武王伐紂之後寢兵不用豈欲以兵而征伐哉凡諸侯所以畏之者非必以甲兵而後畏之也古之人君其巡守也不過以諸侯之有功與過而後賞罰之孟子所載巡守之事曰入其疆土地闢田野治養老尊賢俊傑在位則有慶慶以地入其疆土地荒蕪遺老失賢掊克在位則有讓如王制所言山川神祗有不舉者為不敬不敬者君削以地宗廟有不順者為不孝不孝者君黜以爵變禮易樂者為不從不從者君流革制度衣服者為畔畔者君封有功德於民者加地進律凡此之類皆所以按諸侯之功罪而升黜之故諸侯聞王者之來莫不震疊之武王既巡守昭明有周之典序諸侯之在位者所謂序者即考其功罪而升黜之也武王既能升黜諸侯又能寢兵不用但求懿德以施之中國則能保天下也自古人君之於天下取之非難保之尤難始皇非不能取天下也然至於二世而亡者以不能保之也秦皇以兵取之既得天下之後宜與天下息肩矣而好兵之志未已此其所以亡也文猶膏粱武猶藥石膏粱可以養生而不可以治病藥石可以治病而不可以養生武王向者既伐紂以取天下今也必求文德以及中國然後可以保天下也書之所言歸馬於華山之陽放牛于桃林之野禮記所言包干戈於虎皮此以見武王能止武也鄭氏之説則謂武王求有美德之士而任用之所謂懿德者非必美德之士也但求文德而施之則可以保天下也時夏亦不必謂樂歌但是陳之中國也我將之詩曰維天其右之則是天享之矣然不可以天享我而自滿故末章言于時保之今此言昊天其子之則是天愛之矣然不可以天愛我而自滿故末章言允王保之詩人之體類皆如此黃曰堯舜之揖遜湯武之征伐皆時也聖人不能違天故不能違時要以事或不同而此心之無愧於天不怍於人者千萬世而一轍也然聖人之舉事不特曰吾可以無愧而止而亦必使天下匹夫匹婦皆曉然知吾心之無愧者然後有以大慰於其心而亦有以深服於天下舜受天下於堯類于上帝禋于六宗望于山川遍于羣神覲四嶽羣牧班瑞于羣后二月東巡守至于岱宗柴望秩于山川肆覲東后五月而南八月而西十有一月而北皆如之舜豈欲廣祭祀以求福而媚羣神以干譽哉其心以為吾如是而君天下典神人人民我有宗廟我享社稷我保吾固無愧於此也而亦必使山川鬼神人民百姓皆知吾之所以得天下者如此其無愧也吾明告之明言之而使天下明知之則豫一人之心始安此時邁之所由作也鄭康成之徒不知聖人之心而謂巡守告祭者天子巡守至於方嶽之下而封禪焉世之儒者樂諂諛以希世主往往附會其説以為封禪之禮始於舜之時而備於文王之世司馬遷大儒也而亦為是説豈不厚誣聖人也哉時邁之作要以見武王所以得天下與其所以保天下者皆無愧也竊嘗論之武王巡守之事詩有時邁書有武成時邁告祭之樂章也武成識其政事以示天下來世也丁未祀于周廟越三日庚戌柴望大告武成此告巡守祭柴望之實也告于皇天后土名山大川此懷柔百神及河喬嶽之實也華夏蠻貊罔不率俾此莫不震疊之實也庶邦冢君暨百工受命於周此式序在位之實也偃武修文歸馬放牛此非戢干戈櫜弓矢之意乎釋箕子之囚式商容之閭建官惟其賢位事惟其能至於垂拱而天下治此非求懿德以保天下之意乎嗚呼吾觀詩書而見聖人之所以取守者有道也秦皇以兵取天下天下已定而兵不休漢武以兵伐胸奴胸奴已臣而兵不息徹稻榖飫藥石其亦適以自斃也光武存黃石苞桑之戒却臧宫馬武之請聘卓茂禮嚴光而以柔道理天下其亦庶幾於三代取守之道矣愚故表而出之以為天下後世戒執競祀武王也執競武王無競維烈不顯成康上帝是皇自彼成康奄有四方斤斤其明鍾鼓喤喤磬管將將降福穰穰降福簡簡威儀反反既醉既飽福祿來反李曰此詩祀武王之樂歌也清廟之詩祀文王之詩故其詩之所言者無非歸美於文王執競之詩祀武王之詩故其詩之所言者無非歸美於武王蓋子孫所以保有令緒奉承基業故宗廟祭祀得以時而奉行之者皆緣上世之君豐功盛德有以遺之故其祭也播之聲詩而歌之也清廟之詩祀文王乃因周公帥諸侯而為之執競之詩雖曰祀武王而其所以祀之之由則不可得而見也競強也易曰天行健君子以自強不息天穹窿而位乎上隂陽日月迭運推移以其健故也人君法天亦當自強然後可以成功武王能於自強之心執而勿失造次顛沛未嘗敢捨則其功烈所以莫強也武王伐紂而得天下拱揖指揮雖強暴之國莫不趨使一戎衣而天下大定則其功烈為莫強矣然其所以致功烈之莫強者則由執競之所致也其曰無競維烈蓋言執競之效如此不顯成康毛氏則謂不顯乎其成大功而安之也鄭氏則以為不顯乎其成安祖考之道鄭氏之説不如毛氏為優言武王以一戎衣而天下定其成功而安之豈不顯明乎言其顯明也惟能如此故上帝美之所以集大命而有天下也皇美也自毛氏以為用言用彼成安之道王氏以為由言由彼成康之道不如蘇氏以為周之興也逺矣至於武王成而安之然後能奄有四方使其明無所不至蓋周自后稷以來雖積功纍行而世有顯德公劉克篤前烈大王肇基王迹王季其勤王家不過奄有一國而已至於文上雖受命作周三分天下有其二以服事殷然亦未能奄有天下也至武王之時則自西自東自南自北無思不服於周故奄有四方惟武王之時然後如此武王所以能奄有四方者以其成而安之也斤斤爾雅曰察也言照臨四方無所不察也歐陽公曰昊天有成命曰成王不敢康夙夜基命宥密則成王者成王也當是康王已後之詩而毛鄭之説以頌皆是成王時作遂以成王為成此王功不敢康執競之詩曰自彼成康奄有四方則成康者乃成王康王也當是昭王已後之詩而毛氏以為成大功而安之鄭氏以為成安祖考之道夫所謂成王乃成王也成康者乃成王康王也豈不簡而直哉觀毛鄭之説雖不如歐陽之簡直然觀諸詩亦有窒礙而不通者成王之時但持盈守成而已不可以為基命也今曰基命則非持盈守成也執競之祀武王如果是成康則是祀武王之詩其言成康之文如此其屢言武王無幾矣豈古人祀先祖之意乎不當以成王康王為説書曰自成湯至于帝乙成王畏相又曰惟助成王德商頌亦曰武王靡不勝書之所言必不是周之成王頌之所言必不是周之武王若使詩書皆載周之王則必以為周之成王武王矣詩之中不可失之太泥也鍾鼓喤喤蘇黃門曰凡今所以能備其禮樂修其祭祀以受多福者皆武王之德所致也此説是也鄭氏乃以武王既定天下祭祖考之廟而神與之福其説非也喤喤和也將將集也穰穰多也簡簡大也反反毛氏以為難鄭氏以為順習之貌觀賔之初筵詩曰威儀反反毛氏以為重慎之辭辭雖不同其意則一也既醉既飽與楚茨既醉既飽同蓋祭終而飲酒故耳言其祭祀之時鍾鼓管磬之樂皆和故神降之福也祭終而飲酒威儀備具此福祿所以反覆日至方興而未艾也堂上堂下之樂非不多也而此詩特言鍾鼓管磬之樂者蓋詩頌言祭祀之時則或言樂器或言羽飾言其大槩耳如不能以意逆志則是祀武王之詩但有管磬之樂其它樂未必舉也或以它樂雖奏惟鍾鼓獨得其和無是理也黃曰舜執兩端兩端所以用其中也湯執中執中所以建中也武王執競執競所以無競也觀牧野之戰武王以三千之臣而敵商受億萬之衆然商之師旅罔有敵于我師前徒倒戈攻于後以北則武王蓋有不戰而自勝者此所謂無競維烈也武王之所以無競者以應天順人之舉在武王則武王固能執其競矣天下所以無競在武王武王所以執者在仁義武王雖有成王業康天下之功而未嘗有矜耀之心而猶皇皇然惟天命之是敬天周之興也逺矣至武王成而安之然後能奄有四方而東西南北無思不服其盛德無所不及其照臨無所不至凡今之所以能備其禮樂修其祭祀以受多福者皆武王之德所致也威儀反反與賔之初筵同言其反覆而不已也既醉既飽與楚茨既醉既飽同言其祭終而飲福也威儀備於祭祀之餘而醉飽見於飲福之際則福祿之來其有窮已邪此詩蓋祀武王之樂章故言武王以福後人者如此思文后稷配天也思文后稷克配彼天立我蒸民莫匪爾極貽我來牟帝命率育無此疆爾界陳常于時夏李曰此詩祀后稷之樂歌也國語云周文公之為頌曰思文后稷克配彼天則是此詩亦周公作與時邁之詩同也然頌之所作非是思文與時邁乃是周公所作而其餘詩乃他人所作也蓋以國語所稱者惟此二詩知其周公所作其餘不可得而知之也古之祭者必以其祖配之公羊宣公三年曰郊則曷為必祭稷王者必以其祖配自內出者無匹不行自外至者無主不止則后稷所以配天蓋所以尊祖也生民之詩尊祖也后稷生於薑嫄文武之功起於后稷故推以配天焉觀生民之詩則可以見思文之詩矣言我之所思祖宗有文德者乃后稷也至其德乃可以配天其所以配天者以其立我蒸民莫匪爾極也立毛氏但以為如字鄭氏則以立為粒益稷之篇曰暨稷播奏庶艱食鮮食蒸民乃粒萬邦作乂以書所謂蒸民乃粒正詩所謂立我蒸民也二説皆通毛氏則以為存立者則以后稷教民稼穡而民賴以存立也鄭氏所以為立者乃以后稷教民稼穡而蒸民賴以粒食也惟其教民稼穡故立我蒸民莫不於爾而各得其中后稷之所建極固天下之人所以取中也貽我來牟毛氏曰牟麥也是毛氏但以牟為麥耳鄭氏曰武王渡孟津白魚躍入王舟出涘以燎後五日火流為烏五至以榖俱來此其説不經歐陽公曰自秦焚書之後至漢興伏生口傳尚書先出泰誓三篇得於河內女子其書有白魚赤烏之事其後魯共王壞孔子宅乃得古文尚書其泰誓三篇初無怪異之説由是河內女子泰誓知其非真棄而不用先儒謂之偽泰誓然則白魚赤烏之書甚為誕妄其説得之矣然猶有未盡者泰誓三篇乃是武王誓孟津之時也此貽我來牟乃后稷教民之事以武王之事乃以為后稷稼穡之言其説不待辨而自破矣所謂貽我來牟即所謂誕降嘉種也生民之詩愚嘗辨之矣稼穡之事其來尚矣但以洪水之害民苦於昏墊猶未暇為至后稷教民稼穡利及於民而始有嘉種故詩人推美之以為天誘其𠂻如親貽之以嘉種者也貽我來牟即天之所命以遍養四方之民者也故孟子曰牟麥播種而耰之趙岐曰牟麥大麥也孟子之所謂牟從麥從牟此之所言則不從麥省文也説文周所謂受瑞麥來牟一麥二夆象芒刺之形天所來也説文以牟為麥可也以為天所來則似鄭氏之説此則非也廣雅又以為來小麥牟大麥也以來牟為二種不知有何所據而云劉向云來牟麥也始自天降劉向以牟為麥可也以為始自天降則誤矣貽我來牟此乃天命后稷率育斯民而后稷能奉天之意無以此為我之疆無以彼為爾之界無有內外之殊則后稷當陳其常道于時夏也后稷視民之飢由己飢之既無彼己之心則豈有內外之殊哉説者以時夏為九夏之樂孔穎達則以為此詩與時邁皆周公所作俱云時夏則以此二者為大功故以樂為大歌孔氏徒見國語云周文公所作故其詩亦同時邁之詩言時夏夫思文言時夏者但言中國而已必不是樂歌也后稷教民稼穡但養之而已未及教之也如舜命契敬敷五教在寬則教之者乃契之事也思文之詩惟美后稷乃以陳常于時夏言者蓋無常産而有常心者惟士為能若民無常産而因無常心茍無常心放僻邪侈無不為已倉廪實而知禮義府庫充而知榮辱使當洪水之後后稷不能教民以稼穡則天下之民必蕪常産矣既無常産則何常心之有惟其教民稼穡此其所以言陳常于時夏也黃曰此郊祀后稷以配天之詩也生民之詩言后稷生於薑嫄文武之功起於后稷故推以配天焉然后稷配天特一事也在生民則為雅在思文則為頌蓋生民特言其事而思文則祀后稷之樂章也生民為敘事之辭思文為告事之辭此雅頌之所以異與民之所以生者天也而其所以全上天生育之功者后稷也故曰思文后稷克配彼天立我蒸民莫匪爾極鄭氏以立為粒蓋本於益稷篇蒸民乃粒之句然輕改經文豫所不取不若毛氏以為后稷教民稼穡而民賴以存立此説為當然詩不言民之所以存立者本於后稷以稼穡育民而乃以為后稷以中道化民何也蓋六府所以養民身三事所以養民心二者常相因而不能以相無孟子所謂民無常産因無常心放僻邪侈無不為已惟后稷能教民稼穡所以教民以中道也貽我來牟來牟者麥之類也孟子曰牟麥播種而耰之趙歧曰牟麥大麥也鄭氏謂天降來牟之種以與后稷然后稷以前地無五榖而民不粒食乎其無是理明矣至於白魚赤烏之説尤為怪誕此鄭氏之蔽也生民言誕降嘉種言后稷降之於民也此詩所謂貽我來牟亦言后稷貽之於我民也后稷思天下之飢者猶已飢之仁心之發初無限量又安有此疆爾界二其心哉陳常于時夏或者以時夏為樂名然時邁言我求懿德肆于時夏則時夏者中國之稱也后稷之於民也富而教之孟子所謂八口之家可以無飢繼之以申之以孝悌之義此王道之始而文武之功所以起於后稷也毛詩集解卷三十七
