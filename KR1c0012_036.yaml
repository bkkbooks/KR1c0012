body:
  text: 毛詩集解卷三十六宋李樗黄櫄撰江漢尹吉甫美宣王也能興衰撥亂命召公平淮夷江漢浮浮武夫滔滔匪安匪逰淮夷來求既出我車既設我旟匪安匪舒淮夷來鋪江漢湯湯武夫洸洸經營四方告成于王四方既平王國庶定時靡有爭王心載寕江漢之滸王命召虎式辟四方徹我疆土匪疚匪棘王國來極于疆于理至于南海王命召虎來旬來宣文武受命召公維翰無曰予小子召公是似肇敏戎公用錫爾祉釐爾圭瓚秬鬯一卣告于文人錫山土田于周受命自召祖命虎拜稽首天子萬年虎拜稽首對揚王休作召公考天子萬夀明明天子令聞不已矢其文徳洽此四國李曰厲王之時小雅盡廢四夷交侵遥想是時淮水之夷必侵中國宣王能興衰撥亂然後命召公平之也孔氏曰命将在江漢之上葢今廬江左右也召公伐淮夷當在淮水之南魯僖公所伐淮夷當在淮水之北淮之南北皆有夷也陳少南亦曰以地勢考之江漢之滸王命召虎者是淮南之夷也若在淮北則是江漢非所由入之路也曰率彼淮浦省此徐土者是淮北之夷也若在淮南則徐土非聫接之地矣以此觀之則此所謂淮夷者指淮南之夷也常武魯頌所謂淮夷者淮北之夷也江漢浮浮蘇氏云水盛貌滔滔蘇氏云順流貌江漢之水浮浮而盛所往淮夷之武夫順流而下非敢安也非敢遊也惟求服淮夷而已以見三軍用命如此王氏則以江漢浮浮譬廣而流行非也夫江漢浮浮者非是取譬葢因武夫渡淮故以為言也亦猶新臺之詩曰新臺有泚河水瀰瀰是因宣公築臺故以河水瀰瀰為言非是以河水取譬也武夫所以出征伐之車又張師帥之旗非敢自安也非敢自寛舒也但以淮夷未服為病耳鋪病也武夫之所征伐渉江漢之上匪安匪遊匪安匪舒其與髙克之将兵河上乎翶翔河上乎逍遥異矣江漢湯湯者大也洸洸武貌有洸有潰是亦武貎江漢之大而武夫皆壮勇經營四方其有不服者則從而伐之伐之既服矣然後以其成功而告于王鄭氏以召公既受命伐淮夷服之復經營四方之叛國從而伐之蘇氏以淮夷既平遂經營傍國告成功于王王氏之説亦類此竊以三説為不然所謂經營四方但是經營淮夷下云式辟四方是亦經營夷狄乃云四方者亦如後世征伐夷狄則曰有事於四方夷狄耳四方當以淮夷為言四方既平則王國必定矣王國既定則於是無有戰爭之心而宣王之心亦可以安寕矣觀此則知宣王之心在於安天下其戰爭誠出於不得已亦可以見召伯能奉王之心而能盡其職位也貞觀中伐龜兹克之帝謂羣臣曰夫樂有幾朕嘗言之上城竹馬童兒樂也飾金翠羅紈婦人樂也貿遷有無商賈樂也髙官厚秩士大夫樂也戰無前敵將帥樂也四海寧一帝王樂也朕今樂矣太宗所謂四海寕一帝王樂也其何以異於宣王之心載寕哉然太宗好名故其戰也爭區區之名非有意於安天下也宣王之心其戰爭出於不得已四方既平王國庶定時靡有爭然後王心載寕則宣王之心異於太宗之心也江漢之滸鄭氏曰王於江漢之水上命召公使以王法征伐四方夫所謂江漢之滸非是宣王親渡江漢也但因上文言江漢故曰江漢之滸亦猶伐木之詩言伐木于阪特因上文而言故也召虎乃王親命之以開闢四方遂定我疆土行周人之法我以兵伐淮夷非病之也亦非急之也但欲王國來至也召公之用兵非欲其病非欲其急其仁義之師乎疆土既平矣於是于疆于理至于南海此以見復文武之境土也吉甫之伐玁狁至于太原召公之于疆于理至于南海文武境土恢復可知也王命召虎來旬來宣旬説文曰徧也十日為旬則旬訓徧明甚宣王命召虎徧宣其政教不徒使之從事於武功也因言康公之事而訓告之昔我文王武王受命爾之祖召康公實為藩翰之臣爾今無以我為小子不足與有為汝當繼汝召康公之功也有文武之君必有文武之臣我之徳雖不及於文武爾當繼爾祖之功此乃宣王之謙辭也爾當開敏其功我則錫予之福人君之命臣多言祖考之事以戒之宣王命韓侯既告之纘戎祖考今命召公亦以祖考訓之葢欲世其家也釐爾圭瓚釐錫也秬鬯黑黍酒也卣樽也未祭則以秬鬯納於卣中既祭之時則以秬鬯納於彝中此錫命者則未祭之時納於卣中言王命召虎錫之以圭瓚又錫之以酒以告爾之先祖爾之先祖乃文徳之人也猶以為未又錫之山川土田爾祖自文武受爵自召康公以來已如此乆矣召虎拜手稽首以受其恩無以為報但曰天子萬年葢祝君以夀自古人臣之常情也虎拜稽首以稱揚王之休美為召康公對成王命之言告宣王曰天子享萬年之夀又言天子之所以明明而稱譽無窮者由是施文徳以和洽四國也宣王命召虎以為無曰予小子召公是似又告之以于周受命自召祖命是使其繼召公之業也召虎乃拜手稽首作召公考是能知繼其召公也明明天子令聞不已矢其文徳洽此四國此乃召康公之所以能輔其君而召虎因宣王命遂舉召康公之言以尊宣王也自古人君有戰功則嚻然有自滿之心而謂天下莫己若秦皇漢武是也大臣之有戰功則志滿意得遂有玩忽之意若臧宫馬武是也宣王之命召虎乃曰來旬來宣是不以武功為事矣而召公則告宣王曰矢其文徳洽此四國其臣不以黷武為事矣君臣相勉如此其視臯陶之賡歌不相逺矣黄曰江漢一詩乃召公還師奏凱之日論功行封之時所作也初則整師而往非為邀功特以淮夷作患不能自安耳次則淮夷之患除而其功成次則安民之政舉而其功廣次則即功而論賞次則論定而賞行次則人臣報塞之義也若夫淮南淮北之辨先儒論之詳矣常武召穆公美宣王也有常徳以立武事因以為戒然赫赫明明王命卿士南仲大祖大師皇父整我六師以脩我戎既敬既戒惠此南國王謂尹氏命程伯休父左右陳行戒我師旅率彼淮浦省此徐土不留不處三事就緒赫赫業業有嚴天子王舒保作匪紹匪遊徐方繹騷震驚徐方如雷如霆徐方震驚王奮厥武如震如怒進厥虎臣闞如虓虎鋪敦淮濆仍執醜虜截彼淮浦王師之所王旅嘽嘽如飛如翰如江如漢如山之苞如川之流緜緜翼翼不測不克濯征徐國王猶允塞徐方既來徐方既同天子之功四方既平徐方來庭徐方不囘王曰還歸李曰常武之詩詩中本無常武二字詩序乃名常武亦猶雨無正般賚之詩皆無其字乃以為詩名也序詩者因釋其所以命名之㫖其曰常者有常徳也武者立武事也常徳者本也立武者末也苟能盡其本則其心在於愛民有愛民之心則見於征伐無非愛民也茍無其本則窮兵黷武無所不至其禍有不可勝言者矣夫序此詩者最有功焉若不以是而訓釋之是使後世窮兵黷武必以常武為口實如秦皇之窮兵黷武是以戰為常也其徳不常也湯武非不用兵也宼亂既平則休兵解甲不復以武功為事是以徳為常非以武為常也召穆公以宣王能討平四方乃作此詩以美之又因以為戒恐宣王驕心一生用兵不已故爾所謂戒者亦猶庭燎之詩因以箴之終南之詩戒襄公也方宣王之命召虎也召虎告之以矢其文徳洽此四國其所以告其君者以其矢文徳而其為此詩又曰有常徳以立武事則召公之戒君可謂深矣赫赫明明赫赫盛也明明著也言赫赫明明王命卿士南仲大祖以其官則大師以其人則皇父此皇父異於十月之交所謂皇父也然十月之交曰皇父卿士此詩曰王命卿士下文曰大師皇父均為卿士疑為一人也然十月之交所言者乃皇父姦邪此詩所言者乃皇父之得人也非是一人也王命南仲薄伐玁狁今詩人稱之曰王命卿士南仲大祖大師皇父是能繼南仲之功矣則是世其家也十月之交所稱皇父疑是此詩皇父之後也十月之交皇父不能繼其祖業矣今皇父既受宣王之命則整我六師脩其兵戎敬之而不敢慢戒之而不敢忘則以肅肅王命不敢失墜故耳然所以奉王命者則欲惠此南國也夫興師以伐人之國則當推之以仁愛之道易之師象曰地中有水師君子以容民畜衆夫興師者疑若害民而乃容民疑若暴衆而乃畜衆皇父所以推恩於南國者以其仁義之師也王謂尹氏命程伯休父上章既命南仲為元帥矣此章則又命程伯休父為司馬也楚語云重黎世叙天地其在周程伯休父其後也當宣王之時失其官守而為司馬氏則是程伯休父嘗為司馬也孔氏云若大師則掌其戒令此言戒我師旅則是司馬之事也王謂尹氏則是使尹氏命程伯休父為司馬也宣王之時姓尹者必是尹吉甫既使程伯休父為司馬其六師之左右則陳其行列而又戒勅其師旅循彼淮浦之傍省視此徐之土其有叛逆則從而誅之又戒之不久留也不久處也當使三農就緒恐久留於此則三農不得就緒也毛氏以為立三有事之臣葢以十月之交擇三有事故以三事為三卿不如鄭氏以為三農周官太宰九職一曰三農生九榖注云三農平地山澤也三事者乃三農之事也湯之伐桀也耕者不變然後可以見其仁義之師今宣王命程伯休父為司馬使之三事就緒亦可以見仁義之師也當春秋之時諸侯交戰爭地惟欲芟夷我農功而已鄭祭足帥師取温之麥秋又取成周之禾鄅人藉稻如此之類惟恐農功之不傷也較之宣王命程伯休父安能無愧乎赫赫業業王師之行赫赫然而盛業業然而動其有威嚴乎乃天子也以見天子之軍可畏也如此然後王之軍安而行日行三十里保安也作行也言其徐行也紹説文曰緊糾也非急也非緩也王之軍徐行非急非緩徐方已絡繹相繼而騷動矣江漢之詩曰匪安匪遊此詩乃曰匪紹匪遊葢江漢匪安匪遊者以言将士用命也此詩言匪紹匪遊者言王師但是徐行而徐方已震驚其言各有所主徐方震驚如雷之發聲如霆之奮怒而敵人無不驚怖也此詩先言淮浦又言徐土此章則先言徐方既而又言淮濆又言徐國則知宣王出師先征淮夷後征徐國也此章但言徐方則知宣王之兵及淮而未及徐方而徐方已震驚也王師之至如破竹之勢迎刃而解之宣王之征淮夷而徐方震驚此以見先聲也次章則言征淮五章則言征徐末章則言徐方之服其次序皆可考也宣王之奮威武如天之震雷如人之勃怒又命召虎進而前行望之者如虓虎之威説文曰闞望也淮夷之人望如虓虎則已足以破敵人之膽矣以兵而屯於淮水之旁而執其醜虜淮夷舊所侵略之地今則截而正之此乃王師之所在也王旅嘽嘽如飛如翰嘽嘽盛也王師之盛如鳥之飛如鷙之翰如江漢之不可犯也如山之苞而不可動也如川之流而不可遏也緜緜不可得而絶翼翼不可得而亂王師之至敵人皆不可得而測既不可得而測又安能克之哉大征徐國而戰必勝矣此足以見善形容王師之强如此帝王之兵以全取勝宣王以至仁伐不仁以至義伐不義是有必勝之道焉而又王師之强如此焉往而不勝哉以武王伐紂之罪宜其無不勝也又有太公之鷹揚豈有師之不勝者乎今宣王之伐淮夷所以問淮夷之罪而又王奮厥武如震如怒王旅嘽嘽如飛如翰如江如漢宜其師之必勝也王猶允塞猶謀也允信也塞實也王之謀猷皆本於信實非譎詐之兵也如晉文公之伐原非無信也所謂信者出於勉强而已城濮之役未免用詐謀以勝楚觀其晉師偽遁則知其尚詐也推宣王之用兵謀本於信實非譎詐之兵此淮夷徐方之所以無不服也上章言赫赫業業有嚴天子是王師從天而下以來徐方也今者但言徐方既來則是未嘗經戰陳而徐方自服也古人所謂善戰者不陳其在於此徐方既服矣此言宣王之功宣王命南仲為元帥程伯休父為司馬其所取勝雖曰南仲之功原其所本乃天子之功也魏文侯命樂羊将而攻中山三年而㧞之反而論功文侯示之謗書一篋樂羊再拜曰此非臣之功乃君之功也夫軍将克敵者雖曰将臣之功其所以任将者又在於天子之功也四方皆無事矣而徐方又皆來寕來王徐方之人無有囘邪王於是班師振旅而歸也宣王所以征徐方者以其不服故也今徐方既服宣王乃班師振旅而歸使宣王必欲犂其庭埽其穴然後有以快其志安在其為仁義之師邪故徐方不囘王曰還歸足以見宣王無黷武之心也莊公之時師次于郎以俟陳人蔡人甲午治兵秋師還春秋書秋還則是譏其師久而後歸也今徐方不囘王曰還歸足見宣王與春秋所書異矣黄曰将順正救臣子之大義也而二者之辭不可以併致曷為而不可以併致也葢美之之辭幾乎溢戒之之辭幾乎訐美之之辭不可以為戒猶戒之不可以為美也吁為是説者是未可言於明良際遇之朝精神㑹聚之日惟夫君臣同心一孚一契言之者以意逹聽之者以心㑹固知其美中之戒戒中之美在臣無費辭在君無虚受茲穆公常武之作所以因美而有戒於宣王焉且穆公曷為而美宣王也復土宇於交侵之餘振威徳於衰陵之後茲而不美則失夫将順之義矣又曷為而有戒也席既勝之勢者未嘗無恃勝之心居莫大之功者不能無好大之患茲而不戒則失夫正救之義矣二者不可偏廢則合二意於一詩之中進六章於冕旒之下使吾君且慰且警且喜且愕弛張闔闢之妙盡於四十八言之中言之者無罪聞之者足以戒穆公常武之義盡之矣故既敬既戒而惠民之意已形使宣王味斯言也則前日平淮之師非喜功也所以惠民也今日其可忘夫惠民之徳而不以黷武為戒乎不留不處而息民之意已寓使宣王詠此言也則前日平淮之師非黷武也所以息民也今日其可忘夫息民之徳而不以喜功為戒乎其曰徐方來同其又曰王曰還歸則一詩之義又顯矣是知所謂常徳者惠民息民不窮兵之謂也武事之所由立也所謂可戒者反是而美之者則為敗徳也吁穆公之意微矣若夫三章四章五章以言其徳威之著而徐方為之震攝以言其軍陣之鋭而徐方無所取侮茲又詩人推美之辭以形容其武事之備云耳誠非張其氣以啓其無厭之心也學者當以意逆之瞻卬凡伯刺幽王大壞也瞻卬昊天則不我惠孔填不寕降此大厲邦靡有定士民其瘵蟊賊蟊疾靡有夷届罪罟不收靡有夷瘳人有土田女反有之人有民人女覆奪之此宜無罪女反收之彼宜有罪女覆説之哲夫成城哲婦傾城懿厥哲婦為梟為鴟婦有長舌維厲之階亂匪降自天生自婦人匪教匪誨時維婦寺鞫人忮忒譖始竟背豈曰不極伊胡為慝如賈三倍君子是識婦無公事休其蠶織天何以刺何神不富舎爾介狄維予胥忌不弔不祥威儀不類人之云亡邦國殄瘁天之降罔維其優矣人之云亡心之憂矣天之降罔維其幾矣人之云亡心之悲矣觱沸檻泉維其深矣心之憂矣寕自今矣不自我先不自我後藐藐昊天無不克鞏無忝皇祖式救爾後李曰文武之業至厲王大壞故蕩之詩召穆公傷周室之大壞宣王中興則文武之業復修矣至幽王而復大壞此瞻卬之詩凡伯所以刺幽王大壞也顔真卿嘗曰朝廷豈可再破壞邪今厲王既壞之於前而幽王復壞之於後則文武之業所存者無幾矣可不痛哉毛鄭皆以昊天為斥王其説多如此如板之詩曰上帝板板蕩之詩曰蕩蕩上帝皆是言天毛鄭皆以為言王經之説本不如是毛鄭自生風波也詩人之意謂仰視昊天胡不愛我民也民之不安其居甚久矣天猶降大厲以禍之邦國靡有安定而士民又皆疲瘵貪吏肆行如蟊賊之害苗無有極止禁網之設如網罟之罩而無有瘳愈夷平也届極也瘳愈也凡此皆幽王自為之也而民乃告之於天者葢民之怨幽王無所告訴故但歸於天也人有土田女反有之此章則言幽王取予無常維婦言是用也人之有土田非所當有而有之而幽王則有之人之有民人非所當奪而女覆奪之而幽王則奪之夫非所當有而有之盗也今幽王不當有而有之不當奪而奪之其所以異於宼攘盗賊者幾希無罪者則當脱之而乃收之有罪者則當收之而乃脱之刑罰倒置一至於此正小雅所謂舎彼有罪既伏其辜若此無罪淪胥以鋪是也哲夫成城哲婦傾城者謂士大夫有才智者則可以興國家也故謂之成城婦人之有才智者則為國家之害故謂之傾城如唐之李勣賢於長城遠矣則是其人可以為國家之藩翰所以謂之成城也至於婦人則無用於才智苟有才智則必為國家之害如紂之妲己周之襃姒漢之吕后唐之武后皆婦人中才智之過人者也而反為國家之害凡幽王之所以有人之土田奪人之民人舎此有罪而收無罪者皆信用婦人之言也觀幽王之寵襃姒也襃姒不好笑幽王欲其笑多方故不笑為舉烽燧諸侯至而無宼襃姒乃大笑其後數舉烽燧諸侯不信當幽王之時舉烽燧則諸侯皆至一為襃姒所惑數舉烽燧而諸侯不至卒為犬戎所殺幽王之於襃姒惟欲其笑如此則其它可知矣懿厥哲婦鄭氏以懿為有所傷痛之聲不如漢谷永亦舉此顔師古註曰懿美也言幽王以哲婦為美此説勝於鄭氏幽王但以哲婦為美而不知反為惡鴟惡聲鳥也婦人之多言乃為禍亂之階其禍亂之作非天降之也乃生於婦人而已幽王之為人其教之誨之則藐然不聽其所聽者惟婦人寺人而已誨爾諄諄聽我藐藐匪用為教覆用為虐葢其所為教誨也則反以為虐至於婦人寺人之言豈復有愛國之心哉幽王乃從而聽之必其中有所惑也以齊桓公之賢而聽於寺人貂之謀况幽王乎鞫人忮忒忮害也忒變也婦人之窮其忮忒始也譖是人其終也又從而背之葢其好惡予奪惟其口之出而已言婦人所為如此乃其不得中也而自言則曰豈曰不得中乎使其果得中胡為而惡如此之極哉葢小人之當國也敗國亡家亦必以為非己之罪桑柔之詩曰雖曰匪予既作爾歌幽王信用哲婦亦自謂非已之不中也是皆歸其過於他人而不知致此禍者果誰生之邪論商賈三倍之利則小人之所覬覦也豈君子之覬覦哉君子喻於義小人喻於利惟其深喻是以篤好為君子者無與於商賈之事亦如婦人無與於公家之事婦人惟蠶織之事而已公家之事吾何與焉君子之所喻者惟義而已義之外何所與焉休其蠶織而與公家之事是如君子之言及於商賈之事也卷耳之詩曰后妃輔佐君子求賢審官知臣下之勤勞内有進賢之志而無險陂私謁之心朝夕思念至於憂勤也夫求賢審官乃闑外之事也后妃之事乃闑内之事也后妃有進賢之志豈以是與公事乎葢但有其志耳公事非所與焉故序詩者以為后妃之志也今婦人所與者非如卷耳所言不過共用小人以誤國耳天何以刺何神不富言天何以責王乎神何其不福王乎禍亂之來王何不推其所由哉戎狄之被甲為害當念而不念君子則不當忌而忌王之好惡可知矣天下念我周家降於不祥王不能恐懼修省以答天意王之所以為威儀者乃為不善何以轉禍為福哉十月之交言日有食之則為災甚矣又云􅏎􅏎震電百川沸騰山冢崒崩髙岸為谷深谷為陵所謂不祥莫甚於此自幽王觀之無復有畏懼之心此其所以至於亡也幽王不畏天變故賢者皆逃亡而去賢者既去則邦國殄瘁矣天之降罔維其優矣優毛氏以為渥葢天之降災罔其優渥如此言其多也賢者又逃亡而去此心之所以憂也維其幾矣幾近也言天之降災罔将及我矣而賢者又去此心安得不悲乎觱沸檻泉維其深矣觱沸泉出貎檻泉湧出也泉之出也必有其源禍亂之來亦必有自我心之憂其來久矣非一朝一夕之故也因自嘆曰不自我先不自我後葢皆傷已之遭亂不能免也王氏曰昊天之明視人藐藐無所私親言天之甚逺而難親人君所以奉天者必思有以鞏固其位今幽王不能鞏固其位是不能奉天也爾之所為茍無忝於祖宗則乃救於爾之子孫也人君茍能側身修行上焉有以繼其祖宗下焉有以救其子孫幽王何憚不為乎召旻凡伯刺幽王大壞也旻閔也閔天下無如召公之臣也旻天疾威天篤降喪瘨我饑饉民卒流亡我居圉卒荒天降罪罟蟊賊内訌昬椓靡共潰潰囘遹實靖夷我邦臯臯訿訿曽不知其玷兢兢業業孔填不寕我位孔貶如彼嵗旱草不潰茂如彼棲苴我相此邦無不潰止維昔之富不如時維今之疚不如兹彼䟽斯粺胡不自替職兄斯引池之竭矣不云自頻泉之竭矣不云自中溥斯害矣職兄斯𢎞不烖我躬昔先王受命有如召公日辟國百里今也日蹙國百里於乎哀哉維今之人不尚有舊李曰此詩謂之召旻者毛氏以為旻閔也閔天下無如召公之臣也蘇黃門以為首章言旻天卒章言召公故謂之召旻召旻特别於小旻耳毛氏以為旻閔也閔天下無如召公之臣葢衍説也其論為當旻天疾威天篤降喪天之威急矣而厚降喪亡之禍病民以饑饉使民盡至於流亡我居中國也圉邊陲也皆廢而不治以見普天之下無不受其禍也小旻之詩亦曰旻天疾威鄭氏則以旻天疾王者以刑罰威恐萬民此之言旻天疾威而鄭氏亦以旻天為王言幽王之為政急行暴虐夫所謂旻天疾威者均是言天之威耳豈以小旻之言則謂之天疾王者而此詩所言則以天為王邪豈以小旻之詩則謂疾其以刑罰威恐萬民此則謂之急行暴虐邪此皆鄭氏之失也言天降此罪以網羅天下而小人皆如蟊賊之害用事於内自訌潰也天降罪罟即上篇所謂罪罟不收也蟊賊内訌即上篇所謂蟊賊蟊疾靡有夷届也天降罪罟遂使小人用事於内昬㭬閹人也無肯恭敬於職事而皆潰潰然囘邪謀亂我國家也靖謀也夷亂也前詩言匪教匪誨時維婦寺此詩又曰昬㭬靡共則是幽王以閹人用事可知矣孔氏曰閹者防守門閤親近人主凡庸之君昬於善惡以其少小慣習朝夕給使顧訪無猜憚之心恩狎有可悦之色且其人久處宫掖頗曉舊章常近床第探知主意或乃色和貌厚挾術懷姦或乃㨗對敏才飾巧亂實於是邪正並行情貌相越遂迷罔視聽因惑愚主謂其智足匡時忠能輔國信而使之親而任之國之滅亡多由乎此故詩人責王逺賢而近刑閹之人也孔氏之言亦可謂盡小人之情状矣孔氏又曰原其本心不欲滅國但所謀不當滅國之道也此言則非也以閹宦之徒豈有愛國之心哉謂原其本心不欲滅國則非也凡閹宦用事即是天降其罪罟如十月之交曰下民之孽匪降自天瞻卬之詩曰維厲之階亂匪降自天生自婦人今此言天降罪罟亦以小人用事惟是幽王之失無可奈何故歸之於天也臯臯訿訿臯臯毛氏以謂頑不知道訿訿謂窳不供事言小人如此也小人肆行自不知其玷夫以婦人用事則不自以為不中小人用事則不自知其過正所謂皇父孔聖也為君子者則兢兢業業而恐懼其不寕甚久而其所以如此者以我将退而難保其位也自古亂亡之國君子多至於恐懼小人則惟安其危而利其災樂其所以亡也如彼嵗旱此則言危亂之甚如此如大旱之嵗草木不得潰茂又如水中之浮草泛泛乗流不知其所止故我相視此邦無不潰亂則知是其必亂之道故也維昔之富不如時維今之疚不如兹此二句説者多異同大抵言昔之富不如今時今之病不如昔時所謂兹者安可以為昔邪竊嘗語此二句但是言昔者富實未有如是今之困病亦未有如是也夫不如古之富實亦未有如今之困病古者盛時萬民無不富足無有困乏故曰古之富未有如是今則自中國以至夷狄無有不受其禍故曰今之病亦未有如此小人當食𬞞而乃食精粺以見小人而食君子之禄也小人而食君子之禄小人胡不自避而退而使賢者得進而乃復主禍亂之事而日滋日長也引者長也如所謂日引月長是也池之竭矣不云自頻頻水之涯也池之竭矣則外無所入泉之所竭則内無所出以譬幽王外而夷狄内而中國内外皆受其禍其害大矣其禍甚大而小人又主此禍亂之事日以洪大豈不災及我躬乎昔先王受命此章言土地之削也節南山之詩曰駕彼四牡四牡項領我瞻四方蹙蹙靡所騁則其土地日削可知也故言文武之世如召公者日開國百里今也日反蹙國百里向者日闢國百里今也日蹙國百里則是古之土地比今之土地不啻數倍於乎哀哉維今之人不尚有舊者不能尚舊徳之臣以見當時非無賢臣但幽王不能信而用之耳自古至亂之世未嘗無賢如秦之末豈天下無賢哉使天下無才則蕭何何以佐漢而興邪隋之末豈天下無賢哉使天下無才則房杜何以佐唐而興邪但患人君不能用賢耳故此詩所以追思先王之時有如召公日闢國百里今之人雖有舊臣而幽王不能自用也蘇氏曰闢國以禮蹙國亦以禮皆非用兵之謂也近世小人欲以干戈侵擾四鄰求拓土之功者率以召公藉口此楚靈齊湣之事桓文之所不為而以誣召公嗚呼殆哉此言得之矣所謂日闢國百里非用其兵甲也周公用於周奠枕于京孔子用於魯齊人歸其侵疆所謂闢國者初無事於甲兵也如必以甲兵而闢國則王翦之徒皆能之矣何必召公後代之人多假詩書以為姦不可不辨也黄曰瞻卬召旻之詩李迃仲之説當矣毛詩集解卷三十六
