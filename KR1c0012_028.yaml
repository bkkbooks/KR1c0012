body:
  text: 毛詩集解卷二十八宋李樗黃櫄撰鴛鴦刺幽王也思古明王交於萬物有道自奉養有節焉鴛鴦于飛畢之羅之君子萬年福祿宜之鴛鴦在梁戢其左翼君子萬年宜其遐福乘馬在廄摧之秣之君子萬年福祿艾之乘馬在廄秣之摧之君子萬年福祿綏之李曰交於萬物有道所謂畢之羅之是也自奉養有節所謂秣之摧之是也鴛鴦匹鳥也孔氏曰自古太平之時交於萬物有道欲取鴛鴦之鳥必待其長大於其能飛乃畢掩而羅取之不於幼小而暴夭之也王氏曰於其飛然後畢之羅之則不取其卵弋不射宿故也孔氏則專以謂不取其幼小王氏則兼以謂弋不射宿二說皆通然一章則曰畢之羅之二章則曰鴛鴦在梁戢其左翼故歐氏曰鄭氏謂明王之時人不驚駭而自若無恐懼然則人不驚駭與遭畢羅二章義正相反而鄭皆謂明王之時理豈得通此亦不然夫明王之世必俟其飛而後取之故其在梁者則戢翼而安此章正與上章文意相承安得謂之相反者哉必曰戢其左翼者陸農師曰凡鳥左顧則怒作右眄則喜生飛而起則仰左翼飛而下則仰右翼故今鷙鳥下擊皆先側左翅也乘馬在廄摧之秣之言馬之在牧者不用其力則委之以摧馬之在廄者則用之則加之以秣此亦見君子愛國用如此也摧是將生芻以飬馬秣是將粟以養馬鄭氏曰齊而後三舉設盛饌恆日則減焉此之謂有節也惟古之明王交於萬物有道自奉飬有節故君子享萬年而受其福祿也甚宜蘇氏曰艾老也言以福祿終其身也王氏曰此詩三言福祿而於鴛鴦在梁戢其左翼獨曰遐福者君子之於物取有時用有節所以宜其祿而福之遐尤在乎使萬物得其性也此則鑿說矣歐氏曰馬無事則委之以莝有事則豫之以穀此前世中才常主之所能為不足當詩人思古而詠歎此亦不然也詩人但以秣馬之事觸類而長之則見其愛國用皆然也不可泥摧秣以為說也善學者當通倫類如弋不射宿此何足以見孔子之仁哉自弋不射宿而觀之則其實可知矣故子與人歌而善必使反之而後和之此只是歌者之善孔子何為而與之哉歌者尚如此則足以見夫子與人為善也且如此詩只言鴛鴦而序詩者便以為明王交萬物有道但以鴛鴦而觸類則見其交萬物有道皆然也此學詩者之法也頍辨諸公刺幽王也暴戾無親不能宴樂同姓親睦九族孤危將亡故作是詩也有頍者辨實維伊何爾酒既㫖爾殽既嘉豈伊異人兄弟匪他蔦與女蘿施于松柏未見君子憂心奕奕既見君子庶幾說懌有頍者辨實維何期爾酒既㫖爾殽既時豈伊異人兄弟具來蔦與女蘿施于松上未見君子憂心怲怲既見君子庶幾有臧有頍者辨實維在首爾酒既㫖爾殽既阜豈伊異人兄弟甥舅如彼雨雪先集維霰死喪無日無幾相見樂酒今夕君子維宴李曰諸公謂同姓之親也幽王不能親其同姓則同姓之人亦莫肯親於幽王此所以知其孤危將亡也頍辨貌說文曰舉頭貌鄭氏曰幽王服是皮辨之冠是維何為乎言其宜以宴而不為也蘇氏曰彼所謂辨者實何物哉徒以人加之首而貴之耳今王豈謂我自貴而忽兄弟哉蘇氏則以此為譬喻鄭氏則以為王服皮辨之服不如從鄭氏之言為簡徑蓋言幽王既服皮辨之服而又有酒之清有殽之美何為不與兄弟而宴樂之哉其所宴非有疏逺之人也惟兄弟而已非有他人也何為不與之宴哉王氏曰豈伊異人兄弟匪他者非異人而兄弟也而兄弟又非有他則宜與之宴樂矣有他謂若周之管蔡然王雖欲與之宴樂不得也今匪有他而不能與之宴樂則其咎在王矣此蓋强為之說也此但言兄弟非有他人者也不過如此而已蔦與女蘿蔦寄生也女蘿菟絲松蘿也此二物者皆在於松柏之上松柏存則托之以固松柏隕亦隨以亡亦猶吾之兄弟托王以存亡故我見王則可以恱懌不見王則心之憂奕奕然而不安王何為而不顧我哉何期鄭氏曰猶伊何也時善也具來言其皆來也而其意與上章同有頍者辨實維在首阜多也兄弟甥舅也如彼雨雪先集維霰雨雪說文曰稷雪也陸農師以為米雪言雪散亦如米所謂稷雪義蓋如此鄭氏曰喻幽王不親九族亦有漸自微至甚如先霰而後大雪鄭氏以為不然其說曰考詩之意非謂不親九族有漸所謂其危亡有漸也國家亡必先離其九族如雪將下必先下霰下霰必知雪見九族離必知國亡必然之理也今當用之惟知其將亡故曰死喪無日能復幾何得見乎茍今夕有酒則當以相宴不恤其他也此皆是旦不保暮之辭也如伐木之詩曰伐木許許釃酒有藇既有肥羜以速諸父寧適不來微我弗顧則其燕諸父可謂厚矣又曰於餐灑掃陳饋八簋既有肥牡以速諸舅寧適不來微我有咎則其燕諸舅亦可謂厚矣夫周之先世其所以燕甥舅也如此惟恐其獲戾於諸舅也又如此則其親親之意可知矣今幽王不能繼文武之業王之同姓諸侯所以望王者如此之切而王乃以路人待之則其與文武之心何其相逺也宋華亥與寺人柳比而逐合比代其右師左師曰女夫也必亡女喪而宗室於人何有人亦於女何有周之盛也封建親戚以藩屏周故同姓親之今幽王之所親者既不之親則王之宗族孰有親於王哉蓋國家之亡必先自於九族之離孟子曰多助之至天下順之寡助之至親戚叛之紂之亡也其親莫如微子且親抱祭器而入周項羽之亡其親莫如項伯而泄其謀以助漢此所謂親戚叛之也夫親戚所以叛之者亦必有以致之耳不能親睦九族則其孤危將亡也必矣車舝大夫刺幽王也褒姒嫉妒無道並進讒巧敗國德澤不加於民周人思得賢女以配君子故作是詩也間關車之舝兮思孌季女逝兮匪飢匪渴德音來括雖無好友式燕且喜依彼平林有集維鷮辰彼碩女令德來教式燕且譽好爾無射雖無㫖酒式飲庶幾雖無嘉殽式食庶幾雖無德與女式歌且舞陟彼高岡析其柞薪析其柞薪其葉湑兮鮮我覯爾我心寫兮高山仰止景行行止四牡騑騑六轡如琴覯爾新昏以慰我心李曰褒姒嫉妒無道並進於十月之交可以見皇父為卿士畨維為司徒家伯為宰仲允膳夫棸子內史楀維師氏豔妻煽方處蓋褒姒既已用事則小人得以並進故無道之徒得以羣聚於朝肆為讒巧敗其國家而民受其禍故周人思得賢女以配王欲其改過而作是詩漢王莽傳曰間關漸臺顔師古注曰門關猶崎嶇展轉也然以此詩觀之則與王莽傳又不同故此多從毛氏之說曰間關設舝也言設此車舝之門關而思得孌然之季女乘之往來我之思也非謂飢而思食渴而思飲也其所欲者乃思賢女以德音來㑹於此也王氏曰舝之在車間以固之關以通之然後足以與行賢女之配君子貞以固之順以通之如舝之在車故因興焉此則強為之說也雖無好友式燕且喜蘇氏曰雖無好友以事王姑以奉王燕喜之樂猶愈於小人也此說是也歐氏曰彼所思之女雖無衆妾與相好友祇得一人亦足以承王燕喜也此亦是一說今當且從蘇氏之說依彼平林有集惟鷮鷮雉也依茂木貌言平林之木依然而茂則雉必先集於下時有賢女以為后則衆妾之有令德者皆來化其善行以與王燕樂則我心愛之而思無厭斁也雖無㫖酒式飲庶幾歐氏曰此思賢女而不可得之辭也蓋言雖無㫖酒但得飲可也雖無嘉殽但得食可也雖無賢女以德及汝但得與王宴樂之猶勝於嬖后也陟彼高岡言我陟彼高山之脊析去其柞薪其所以析薪者以其葉之盛也亦猶褒姒在王之側所以蔽王之耳目也必當去之可也今王能去之使可得見則我憂心得寫也鮮之為言善也言善乎我得見之矣高山仰止此章則歎賢女之行也景大也大行之可行亦猶高山之可仰也其為人所歎慕如此故我欲具此四牡之馬騑騑然而調其六轡之如琴然為王聘此女以為王之新昏我得見之則可以慰我心也嘗觀此詩正與東門之池詩同意東門之池可以漚麻彼美淑姬可與晤歌蓋言以賢女而配君子亦猶以水而漚麻自然薰陶漸漬以使王為善也蓋自古國家之亂必自內寵始內寵既已用事則小人乘利而進故有褒姒則有皇父之徒有楊妃則有李林甫之徒內寵用事而加以小人欲其國之不亡不可得也賢妃在內而君子在朝欲國之不興亦不可得也周南召南之詩皆文王之治有以刑于寡妻如文王之德雖不待於內助可也然猶賴后妃以成關雎之治況下於文王者乎青蠅大夫刺幽王也營營青蠅止于樊豈弟君子無信讒言營營青蠅止于棘讒人罔極交亂四國營營青蠅止于榛讒人罔極構我二人李曰歐陽公云青蠅之汚黑白不獨鄭氏之說前世儒者亦多見於文字今之青蠅所污甚小以黑㸃白猶或有之至於變白為黑青蠅則未嘗有之遂以鄭氏汚白為黑汚黑使白為非而其說則曰如齊風雞鳴之篇古人取其飛聲之衆可以亂聽猶今所謂聚蚊成雷也然此二說皆通青蠅能變白為黑亦可譬讒人之言能變亂是非但去其汚黑使白之說亦無害也段灰曰青蠅糞猶足敗物雖玉猶不免所謂青蠅㸃玉也若以青蠅能亂人之聽亦可譬讒人之能亂君之耳目也其曰營營者毛氏則曰往來貌說文則曰小聲二說皆通止于樊鄭氏曰欲外之令逺物也蓋欲止于藩籬之外而使不得入也其曰榛曰棘者皆所以為藩也王氏曰以譬其入之有漸此蓋強為之說也惟青蠅欲其止于藩籬之外又告之以樂易君子不可以讒言為惑也人君苟信之則讒言日至交亂四方而無所不至也構我二人唐孔氏曰二人者人君與見讒之人也幽王之時讒人用事可謂衆矣豈獨構我二人哉如小辨之詩則太子之傷於讒也巧言之詩則大夫之傷於讒也巷伯之詩則寺人之傷於讒也當是時小人得志凡曰賢者無不被讒矣而獨曰構我二人者蓋主見讒者而言也賔之初筵衛武公刺時也幽王荒廢媟近小人飲酒無度天下化之君臣上下沈湎淫液武公既入而作是詩也賔之初筵左右秩秩籩豆有楚殽核維旅酒既和㫖飲酒孔偕鍾鼓既設舉酬逸逸大侯既抗弓矢斯張射夫既同獻爾發功發彼有的以祈爾爵籥舞笙鼓樂既和奏蒸衎烈祖以洽百禮百禮既至有壬有林錫爾純嘏子孫其湛其湛曰樂各奏爾能賔載手仇室人入又酌彼康爵以奏爾時賔之初筵溫溫其恭其未醉止威儀反反曰既醉止威儀幡幡舍其坐遷屢舞仙仙其未醉止威儀抑抑曰既醉止威儀怭怭是曰既醉不知其秩賔既醉止載號載呶亂我籩豆屢舞僛僛是曰既醉不知其郵側辨之俄屢舞傞傞既醉而出並受其福醉而不出是謂伐德飲酒孔嘉維其令儀凡此飲酒或醉或否既立之監或佐之史彼醉不臧不醉反恥式勿從謂無俾太怠匪言勿言匪由勿語由醉之言俾出童羖三爵不識矧敢多又李曰此詩言幽王荒廢其政教親近小人日夜為荒恣之行朝廷之上既如此故天下化之君臣上下並為沈湎淫液蓋上有所好下必有甚焉者武公始相見其如此故作是詩以刺之幽王之時則衛武公入相平王之時鄭武公入相淇奧之詩曰有文章又能聽其規諌以禮自防故能入相於周則知衛武公之入相也必有興周家之治也緇衣之詩曰父子並為周司徒善於其職國人宜之以明有國善善之功焉則鄭武公之入相必有興周家之治也然幽王則有驪山之禍平王東遷卒不能復文武之舊者非二公罪也蓋上之人不能聽其言爾觀此衛武公之詩則幽王不能聽言可知矣衛武公如此則鄭武公可知矣此篇鄭氏蘇氏毛氏王氏皆以為先王將祭必大射以擇士將射必先行燕禮歐陽則以為不然以謂若如鄭氏之說則是一日之內朝為得禮之賢君暮為淫液之昏主此豈近於人情哉遂以此詩上二章略陳昔之人君與其臣下飲酒必賔主秩秩然肅恭下二章遂刺王之上下飲酒既失威儀又號呶雜亂籩豆亦無次序當從歐氏之說蓋此篇首既曰賔之初筵三章又曰賔之初筵首章言賔之初筵者古之飲酒其禮如此而飲酒之後亦如此也三章言賔之初筵者言幽王之飲酒其禮如此而飲酒之後不如此也言古之人君其飲酒也賔主分為左右秩秩然而有序其籩豆之屬則楚然而陳列殽豆實也核加籩桃梅之屬也籩以竹為之豆以木為之籩貯桃梅豆貯殽饌旅陳也殽核維旅言以殽核之屬陳於籩豆之中也其主人之酒則調和而㫖矣而飲酒之人又偕齊順禮無有喧譁之失禮矣而其飲酒之時則設鍾鼓以為樂古之宴飲又有金奏者左傳所謂金奏作於下是也鍾鼓既設矣而舉其相酬之爵逸逸然往來有次序也然其君臣不獨飲酒而已又將或射周旋揖遜因其勝負以相爵大侯王所射之侯也射張皮謂之侯二尺作中四尺者曰鵠鵠中二尺曰正正中四寸曰質或謂之的也抗舉也王氏曰大侯抗則餘侯從之矣大侯既抗弓矢斯張而其衆射之夫同登而射齊獻爾發矢中的之功彼射者之發的也凡以求爾爵而已的質也爵射爵也籥舞笙鼓此章言古人飲酒或因祭先祖而飲也詩曰左手執籥者所執而舞也秉籥而舞與笙鼓相應樂既和而具奏以蒸進而衎樂其先祖於是洽其百禮之人也百禮謂助祭之人也助祭之人所至有壬者任事也鄭氏謂任卿大夫也林國君也然以任為卿大夫以林為國君其說難通不如以壬為大也林為盛也言其禮之盛大如此神於是賜以大福使其子孫皆如今日之樂也祭既畢矣則歸賔客之爼留同姓以與之宴樂故祭樂皆入各奏其能其燕賔皆取其匹主人皆入而與之共射則酌其爵以安之而奏其時物也手取也仇匹也室人主人也三章則言幽王之飲酒不如古矣方其初也非不溫然而恭也蓋方其未醉也則反反重而愼至旅酬之時及其既醉也則幡幡然而失其所已無復昔之威儀矣至於舍其坐而遷徙數數起舞仙仙然而失禮此言其醉中之狀也方其未醉也則威儀抑抑然而愼密及其既醉也則怭怭然而媟嫚蓋其既醉則不如其常也此皆言其昏亂也賔既醉止載號載呶錯亂我籩豆之列則數數起舞僛僛然而不正異乎前章之所謂籩豆有楚殽核維旅蓋其既醉則不自知其過尤也其醉中之狀方且傾側其辨數數起舞傞傞然而不止於是武公作此詩以數之既醉而出以下者皆是武公誨之之辭也言既醉而出則可以受福言得禮也醉而不出則是誅伐其德也王若飲酒而盡善則可為令儀矣王何不為哉凡此飲酒此言凡人之飲酒豈盡皆醉哉有醉者有不醉者王則立其監以督之又立史以佐之蓋欲罰其不飲而使之皆醉也昔日以醉為不善今日則以不醉為恥言臣下化之也古者設兕觥以罰其醉而失禮者今則立監佐史獨罰其不醉者則其相去也逺矣今亦勿從而謂之無俾其怠慢於此不可言則不當言無所從來則勿語苟不能如此而由醉中出言則是使出童羖也童無角也羖未有無角者今曰童羖者醉中之言以無為有也夫人三爵之後已昏然無所識矣況又多乎哉言其不可過也論曰蘇黃門曰飬生之人深自覆護擁閉無戰鬬急亡之患而卒至於不壽者何邪是酒奪之也力田之人倉廩富矣而俄至於飢寒者何邪是酒困之也服食之人乳藥餌石無風雨暴露之苦而常至於不寧者何邪是酒病之也修身之人帶鈞蹈矩不敢妄行而常至於失德者何邪是酒亂之也夫修身之人一為酒之所亂則迷然不恭忘其所以修身者故古人謂酒不敢過恐其亂德也昔齊敬仲飲桓公酒公樂曰以火繼之對曰臣卜其晝未卜其夜不敢君子曰酒以成禮不繼以淫義也夫以齊桓春秋之時猶如此古之人自可知也昔武王數紂之罪亦曰沈湎肆虐臣下化之朋家作仇脅權相滅蓋言紂為長夜之飲沈湎於酒而臣下化之也至於厲王沈湎於酒厥愆爾止至於如蜩如螳如沸如羮小大近喪人尚乎由行則天下化之也故蕩之詩每章則以咨爾殷商為言厲王之惡與紂同也今幽王之所為又與厲王同出於覆車之轍觀此三君皆以酒而臣下化之則後之人君可不戒哉魚藻之什詁訓傳第二十二小雅魚藻刺幽王也言萬物失其性王居鎬京將不能以自樂故君子思古之武王焉魚在在藻有頒其首王在在鎬豈樂飲酒魚在在藻有莘其尾王在在鎬飲酒樂豈魚在在藻依于其蒲王在在鎬有那其居李曰萬物得其性則人君亦得共享其樂萬物失其性則人君欲以自樂有所不能也故詩言魚在在藻有頒其首言萬物之得其性也而繼之以王在在鎬豈樂飲酒言王得以共享其樂也今幽王則不然此詩人所以思古而作詩也言魚何在乎在乎水中之藻遂得肥大故其首則頒然而大其尾則莘然而長又依于其蒲者則是萬物各得其性矣萬物得其性天下無事則王何在乎在乎鎬京之地而豈樂飲酒也豈樂樂易也飲酒樂豈但倒其文以便於韻爾有那其居那然而安也王蓋指武王也論曰賔之初筵之詩言幽王之飲酒也此詩言武王之飲酒也夫其飲酒之一也而其美刺之不同也孟子曰文王以民力為臺為沼而民歡樂之也謂其臺曰靈臺謂其沼曰靈沼樂其有麋鹿魚鱉鳥獸也古之人與民偕樂故能樂也湯誓曰時日曷喪豫及女偕亡民欲與之偕亡雖有臺池鳥獸豈能獨樂武王之飲酒乃文王之為臺為沼也幽王之飲酒乃桀之不能同樂也人君以一身託於士民之上天下安則人君亦得而樂之天下危則人君特一匹夫耳雖欲歡樂豈能獨哉觀幽王者有驪山之禍則當時不能同樂也采菽刺幽王也侮慢諸侯諸侯來朝不能錫命以禮數徴㑹之而無信義君子見微而思古焉采菽采菽筐之筥之君子來朝何錫豫之雖無豫之路車乘馬又何豫之𤣥衮及黼觱沸檻泉言采其芹君子來朝言觀其旗其旗淠淠鸞聲嘒嘒載驂載駟君子所届赤芾在股邪幅在下彼交匪紓天子所豫樂只君子天子命之樂只君子福祿申之維柞之枝其葉蓬蓬樂只君子殿天子之邦樂只君子萬福攸同平平左右亦是率從泛泛楊舟紼纚維之樂只君子天子葵之樂只君子福祿膍之優哉游哉亦是戾矣李曰史記褒姒不好笑幽王欲其笑多方故不笑幽王為烽燧有寇至則舉燧火諸侯悉至至而無寇褒姒乃大笑其後數舉烽燧諸侯一不至觀此一事則幽王好侮慢諸侯數徴㑹之而無信義則安得如王者錫命以禮哉鄭氏謂采菽以待諸侯此說雖無害然不如蘇說為得詩人之㫖蘇氏曰采菽以為藿物至微而用至薄矣然猶設筐筥以待之況諸侯乎故古者諸侯之來朝也則曰何錫豫之亦當以路車乘馬豫之也然其心猶以為未也則又曰何以豫之乎則曰𤣥衮及黼豫之也𤣥衮謂𤣥衣而卷龍也黼白黑雜也雖無豫之路車乘馬錫之以車馬也又何以豫之乎𤣥衮及黼錫之以衣服也古者天子錫諸侯多以車馬衣服如舜之車服以庸是也陳少南曰上公九章其服用衮古之諸侯豈皆上公而有是賜哉蓋古者諸侯之朝有上公而被其賜故詩人取其賜豫之至厚者以刺幽王也此說是也觱沸泉出貌檻泉正出之泉也觱沸檻泉言采其芹鄭氏謂采芹以待君子不如蘇氏之說言觱沸之清泉吾將采其芹來朝之君子吾將觀其旗其旗淠淠鄭氏謂觀其衣服車乘之威儀所以為敬且省禍福也其曰觀其衣服車乘之威儀則是其曰以省禍福則非也歐陽公已辨之矣言我也既觀其旗則淠淠然而徐也又聽其鸞聲之嘒嘒然而和也又觀其馬之盛如此則是諸侯之至矣届至也蘇氏曰駕既服而三之曰驂四之曰駟是也鄭氏曰諸侯來朝王使人迎之此則非也蓋上文既言其旗淠淠鸞聲嘒嘒故以言驂駟以見其諸侯之至此也赤芾在股赤芾即左氏所謂衮冕黼珽是也邪幅即左氏所謂帶裳幅舄是也赤芾蔽膝也幅幅逼也所以自逼束也惟諸侯既服此服而來朝以交於天子無有舒緩固天子之所以豫也故天子既加之錫命而又申之以福祿也維柞之枝言維柞之木日蓬蓬然而盛況諸侯能鎮天子之邦安得不如是之盛乎故其來朝也王乃錫之以福祿則諸侯不可以不答報天子也故諸侯亦辨治其國左右王室以順從天子之命此所以曰平平左右亦是率從平平辨治也左右猶佐佑也泛泛楊舟言楊舟之泛泛然浮於水必有紼纚以維之亦猶諸侯之無常有道則來朝無道則離散王亦思有以揆之也厚與之福祿使之優游室家則諸侯孰不至乎膍厚也蘇氏曰今幽王安於逸樂而忽遺之則是亦戾王而已無復懷者矣按此全篇皆是思古人不應以此兩句為刺幽王也角弓父兄刺幽王也不親九族而好讒佞骨肉相怨故作是詩也騂騂角弓翩其反矣兄弟昏姻無胥逺矣爾之逺矣民胥然矣爾之教矣民胥效矣此令兄弟綽綽有裕不令兄弟交相為愈民之無良相怨一方受爵不讓至于己斯亡老馬反為駒不顧其後如食宜飫如酌孔取毋教猱升木如塗塗附君子有徽猷小人與屬雨雪瀌瀌見睍曰消莫肯下遺式居婁驕雨雪浮浮見睍曰流如蠻如髦我是用憂李曰頍辨之詩既刺王暴戾無親不能宴樂同姓親睦九族孤危將亡而此詩又刺幽王不親九族而好讒佞骨肉相怨則幽王親親之心亦可知也已中庸曰凡為天下國家有九經曰修身也尊賢也親親也又曰親親則諸父昆弟不怨幽王既不能親親安得而不怨乎古者親親之道尊其位重其祿同其好惡也尊其位者親之欲其貴也重其祿者愛之欲其富也同其好惡者所欲與之聚所惡勿施也幽王於是三者不能盡安得不取怨於人乎不親九族是所當親而不親之也而好讒佞是所不當好而好之也中庸九經尊賢在於親親之上者人主惟能尊賢乃能親親如堯之克明俊德以親九族是也幽王不能親親以不能尊賢故也自古不親九族未有不因好讒佞之故晉獻公信驪姬而不畜羣公子楚懷王信上官之譖而逐屈氏單獻公所以弃其親者以好用霸故也周簡公所以弃其子弟者以其好用逺人故也此數公者所好如此安得不禍乎左氏曰庸勳親親昵近尊賢德之大者也即聾從昧與頑用嚚姦之大者也弃德崇姦禍之大者也惟其不親九族是弃德者也而好讒佞是崇姦者也驪山之禍在此可卜其曰骨肉者唐孔氏曰以其父祖上世同稟血氣而生如骨肉之相附也騂騂便利也翩其反矣言角弓之體往來挽則內向弛則翩然而反亦猶九族我若親之則彼皆內附我若疏之則彼皆離散亦如角弓翩然而反且以武王成王之世同姓諸侯莫不內附非其九族皆賢也武王成王有以親之也多助之至天下順之武王成王是也天下猶順之而況於親戚乎幽王之世九族皆離散非其宗族皆不賢也幽王有以離之也寡助之至親戚叛之幽王是也親戚猶叛之而況於天下乎蓋勢之合則仇讐可使為骨肉勢之離則骨肉可使為仇讐自古然也爾之逺矣此章又教王之所為如此則天下將效之孔子曰君子篤於親則民興於仁故堯親九族九族既睦然後協和萬邦黎民於變時雍周之文武親親以睦然後民德歸厚矣蓋上有所好下必有甚焉兄弟昏姻王苟逺之則民亦皆然矣王苟以此教民則民亦將效之矣此令兄弟三章四章皆言民效王之所為亦猶伐木之卒章是也綽綽寬也言兄弟相善則綽綽然有餘裕若其不善則交相為病矣象之於舜可謂傲矣而舜不藏怒焉不宿怨焉在舜則誠為愈矣然非舜之罪也惟其兄不兄弟不弟是以有吕産吕祿之輩交相為惡無所不至也然民之所以至此者皆幽王有以教之也故至於民之無良相怨一方也言其不能反於其身而責於他人也是以舜之事瞽瞍信有罪矣而舜未嘗以罪而責於父故卒至於瞽瞍底豫然兄弟之道亦當如此今也無良兄之不友不自責其不友乃責其弟之不弟弟之不弟不自責其不弟乃責其兄之不友此其所以相怨也張文濳嘗冇詩曰蝎能毒人不能斃人能捕蝎殘其類世人競惡蝎為蝎人蝎相殘竟誰致不參彼已相怨方自古詩人以為刺我疑人酷蝎所羞何暇區區論蝎罪觀此詩則相怨一方豈不相怨乎惟其相怨故分爭受爵無有不讓貪求不已以至於亡其身也老馬反為駒此言幽王聽讒佞之言也毛鄭皆以為王侮慢老人如食老者則宜令之飽如飲老者則當度其所勝之多少歐氏以為不然其說曰五章六章則刺王所以不親九族者由好讒佞而被離間也因近讒佞之人其變易是非善惡乃以老馬為駒不顧人之在後而辨其非也謂其肆為讒佞傍若無人也此說是也蓋老馬之於駒其别白為甚易而乃混淆正如趙髙之指鹿為馬德儒之指野鳥為鸞自古姦佞類皆如此以老馬為駒曾不顧人之在後有以辨之有以見其直情徑行旁若無人如此正如貪飲食之人務為醉飽適其意而已毋教猱升木此章則言王之所為益長姦佞之惡也猱之升木不待教而能亦猶小人為惡不待教而能幽王從而教之則長惡不悛讒佞之人既如塗泥王又加塗而附之所貴乎王者以其有善道故小人皆屬附於王不敢離間其兄弟矣雨雪瀌瀌此亦當從歐陽之說言雨雪見日而濳消亦猶九族見弃而亡無日矣瀌瀌雨雪貌晛日氣也莫肯下遺式居婁驕言王不以恩意下及九族而自為驕傲矣如蠻如髦言王之所為無禮義如此此我之所憂也蠻南蠻也髦夷髦也王之所為比之夷狄蓋痛責之也夫夷狄無禮義所貴於中國者以其異於夷狄也今幽王以中國之君而無禮義乃與夷狄同是又將何以治中國乎菀柳刺幽王也暴虐無親而刑罰不中諸侯皆不欲朝言王者之不可朝事也有菀者柳不尚息焉上帝甚蹈無自昵焉俾豫靖之後豫極焉有菀者柳不尚愒焉上帝甚蹈無自療焉俾豫靖之後豫邁焉有鳥高飛亦傅于天彼人之心于何其臻曷豫靖之居以凶矜李曰孔氏以上二章次二句為暴虐下二章及卒章下二句為刑罰不中分章析句之弊一至於此此詩但言諸侯不肯朝王則暴虐無親刑罰不中其意自可見不必於詩中求之也如葛覃之序言化天下以婦道而詩中未嘗說及化天下婦道卷耳之詩言無險詖私謁之心詩中亦未嘗及此學詩者觀其意之如何知其意則其序曉然明白此學詩者之法也菀然之柳行路之人見之豈不庶幾而止息乎今幽王之為君而諸侯乃以為不可朝曽菀柳之不如也尚者庶幾也不尚尚也上帝甚蹈無自昵焉者此章當如歐陽公之說鄭氏以為蹈讀曰悼上帝者訴之也然以上帝為一意言幽王之暴虐不可以朝事甚使我心悼病歐氏以為蹈動也言今天驚動我使我無自昵近之又使我安之以待其極夫以甚蹈為驚動我則以一句為一意然歐氏之說又不如陳少南之說以極為至言上帝警動之矣我無自親近之天且俾我安之以待其改惡從善而後我始可以往也瘵病也邁往也言王苟能遷善改過而後可往也無自瘵焉言苟朝王適所以自病也鳥飛雖高亦必傅于天而後止人心所至無畔岸曽鳥之不如也蓋人心險於山川以見幽王之心無常不知其所止者也禮記曰為人君止於仁為人臣止於敬蓋言人君之心有所止然後來相朝惟幽王之心未必有所止故曰于何其臻曷豫靖之言何以使豫安之者蓋居於此適所以取凶危之地也曰凶矜者以其凶可矜憐也夫諸侯之不朝固諸侯之罪幽王有以致之也宣王之時諸侯之朝猶曰我友敬矣讒言其興以朝王如此猶有讒言今幽王暴虐如此則諸侯之朝其速禍也宜矣毛詩集解卷二十八
