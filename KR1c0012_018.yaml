body:
  text: 毛詩集解卷十八宋李樗黃櫄撰鴟梟周公救亂也成王未知周公之志公乃為詩以遺王名之曰鴟梟焉鴟梟鴟梟既取我子無毁我室恩斯勤斯鬻由六反子之閔斯逮天之未隂雨徹彼桑土音杜綢直留反繆莫侯反牖戶今女下民或敢侮豫豫手拮音吉据音居豫所捋力活反荼音徒豫所蓄租豫口卒瘏曰豫未有室家豫羽譙譙在消反豫尾翛翛素雕反豫室翹翹祈消反風雨所漂匹遙反搖豫維音嘵嘵呼堯反李曰鴟梟武王既崩周公攝政管蔡流言以毁周公又挾武庚與淮夷叛周公既相成王東征而滅之然而成王猶有疑周公之心而尚未知惟其不知周公之志而猶有疑周公之心則是其亂猶未已也故周公所以作此詩以遺王孔氏謂周公東征而滅之以救周室之亂然鴟梟之詩言救亂不得專指三監言之成王信管蔡而疑周公於其所不當信而信之於其所不當疑而疑之不當信而信不當疑而疑則周公之志無由而明三監雖平然猶可以為亂也周公作此詩以明己之志所以攝政專禮樂刑賞之權與夫興兵以討三監之叛然三監之叛尤不可宥者蓋以先王造業艱難如此豈可毁之哉周公冀成王庶幾幡然而起故作此詩以遺王也鴟梟毛氏以為鸋鴂也則從爾雅之文陸氏以為鴟梟似黃雀而小其喙尖如錐取茅莠為巢以麻紩之如刺襪然縣著樹枝或一房或二房幽州人謂之鸋鴂或曰巧婦毛鄭之說則以謂鴟梟鸋鴂也既取我子無毁我室言鴟梟之志愛其子尤惜其巢也既謂既取我子志愛其子則不得以為鴟梟若以愛其子猶惜其巢則文不相貫歐陽氏以為諸儒從爾雅之文然以爾雅非聖人之全書不能無失又謂鸋鴂為巧婦失之愈逺今鴟鳥多攫鳥子而食鴟梟類也此說為當陸農師曰先儒以鴟梟為巧婦郭璞注爾雅云鴟類則璞與先儒異意余以爾雅觀之宜如璞義蓋爾雅言鴟梟鸋鴂繼言狂茅鴟梟亦鴟類賈誼所謂鳳皇伏竄鴟梟翺翔是也詩曰鴟梟鴟梟以戒鴟梟之辭非自道之也鴟梟鴟梟既取我子無毁我室此言鳥之有巢者呼鴟梟而告之曰爾既取我子無毁其巢非鴟梟之自道也諸家多以室為周室無足疑者鄭氏以喻此諸臣乃世臣之子孫其父祖以勤勞有此官位土地今若誅殺之無絶其位奪其土地鄭氏以管蔡流言周公居東二年而罪人斯得成王多得周公官屬而誅之故周公告之謂既誅殺則無絶其位奪其土地蓋以官屬世臣之子孫以父祖之勤勞方有官位土地亦猶鴟梟之愛其巢王肅破之曰按經傳內外周公之黨俱存成王無所誅殺橫造此言其非一也設有所誅不救其無罪之死而請其官位土地緩其大而急其小其非二也設已有誅不得云無罪其非三也歐陽亦破之室者周室也鄭氏以為官屬之世家非也則知無毁我室又當以喻周室也既取我子歐陽毛氏皆言管蔡則以子為民言三監取吾民以叛蘇氏則以為周公言管蔡流言既出周公王又不信而誅周公周公誅則王室亦壞也此諸家不如程氏說鴟梟鴟梟既取我子無毁我室此但言惜巢之甚不必指管蔡亦不必指以為周公蓋言鳥之有巢者指鴟梟而告之爾既取我子無毁我室吾之於子非不愛也而惜巢為尤甚於愛子焉此但詩設為此辭非有所取喻惟其既取我子無毁我室故下文曰恩斯勤斯鬻子之閔斯吾之於子非不恩愛非不勤勞而護惜子又當哀閔之言其護惜此巢也亦如王室之創造艱難如此管蔡流言成王豈當信其所不當信疑其所不當疑而毁壞之哉逮及也徹剝也不如毛氏以為桑土桑根也綢繆纏綿也鳥之營巢方未隂雨之時則取彼桑根而纏綿其戶牖今女下民乃敢侮慢而毁壞之亦猶先王於未患難之時積德纍功以成王室非不勤勞今管蔡流言以譖周公又挾武庚及淮夷叛以壞我王室也拮据說文曰橶持橶挶謂以手爪挶持草也荼毛氏曰萑苕也孔氏曰薍為萑苕謂薍之秀穗也如出其東門之詩鄭氏曰荼茅秀然則茅薍之秀其物相類故皆名荼也租毛氏以為聚不如韓氏以為積蘇氏曰豫手之捋荼而至於拮据豫口之蓄租而至於卒瘏口手勤勞而不辭者曰豫未有室家故也此說盡之矣言豫手橶挶其草豫所取者是荼之草也豫口之所蓄積而至於盡病所以如此其勤勞者曰豫未有室家爾夫鳥之營巢至於手口盡病而乃曰豫未有室家略之可也如司馬所謂𤣥黃牝牡不必詳其說詩人但借以喻勤勞耳未有室家詩人但借以喻先王未得天下如此王氏以謂周公之時未得為有室家而為之說以為文武之受命矣而未有室家者天下未集則亦不得言有室家也王氏以先王未有天下之時而為之故其說如此譙殺也翛敝也翹危也言非獨口手盡病又至於羽之譙譙然而殺之尾之翛翛然而敝之其勞如此而其室又翹翹然而危以風雨之所搖蕩故其音嘵嘵而懼也喻先王之造王室其積纍艱難如此今為三監之所搖蕩而周公作詩其音亦嘵嘵然而懼也夫鳥之營巢也口手盡病而又羽之殺尾之敝至於未隂雨之時徹彼桑土纏綿其戶牖其勞甚矣及巢之已成也則為鴟梟之所毁又為巢下之民所侵侮風雨之所搖蕩三者交至則其守巢也豈不難哉周之王業后稷創始大王王季勤勞王家文王大勳未集至武王有天下可謂難矣其後管蔡流言以壞我王室又挾三監為叛則其守巢也豈不難哉為成王者亦思其保守王室可也今乃聽管蔡之言此周公所以懼也成王信管蔡之言周公作為此詩諄諄告戒非不切成王之疑尚猶未釋猶有誚公之志自非周公當厄難之際而不失其聖則何以使王悔過幡然而改哉此亦如太甲不明伊尹放諸桐使其悔過自艾蓋不如是不足以見忠之至也黃曰此則周公所作之詩也故曰公乃為詩以遺王周公之陳七月以告成王而為鴟梟以遺成王意此詩乃周公避流言於東而作詩以遺王也夫流言四出而成王未悟此人之所不堪而事之最難處者也而周公乃雍容不迫託於詠歌陳祖宗艱難之業而言其憂國勤勞之志微諷其君而使之自悟未嘗有拂然之辭也前輩謂之君臣之分譬如父子若子遭讒被譴惟有恭順謹畏三諫號泣起敬起孝而冀其父兄之自悔此其知周公之心也先儒謂救亂者乃周公被流言之變振兵而誅流言之黨夫成王方疑周公而周公遽握兵以出是益滋四國之謗也亦豈臣子所當為乎金縢言我之弗辟我無以告我先王陸德明以辟字為扶亦切周公以法治流言之罪此說最害理不如鄭氏以辟為避蓋周公攝政羣叔乃流言以為公將不利於孺子周公不得不居東以避罪耳天動威而成王悟金縢啓而衮衣歸出郊之迎已見於金縢之末而伐三監之事乃方見於大誥之書則流言之罪當在成王既悔之後非周公方被流言而遂專握兵而往也嗚呼武庚懷不逞之謀而發於管蔡失道之隙則三監之叛非叛周公也乃叛周也周公慮成王之不知而為逆臣之所誤故作鴟梟之詩以喻之使之知王業之艱難祖宗之憂勤而三監乃欲取王室已成之業而毁之豈不甚可懼哉故作詩以鴟梟為喻鴟梟惡鳥故破羣鳥之巢而食其子鳥之護其巢者呼鴟梟而告之曰汝既先取我子矣無更破我之巢也我養子之勤營巢之勞其所積纍盤聚纏綿固蒂者非一日矣而汝其毁我之成巢乎其意謂周自后稷開基公劉篤烈大王肇基王迹王季勤勞王家文武經營內外之治武庚既逞其姦於管蔡而復欲并王室而毁之鴟梟者指武庚也子者指管蔡也我室者謂王室也使成王而知此則庶乎亂可止矣故曰救亂也噫成王一疑周公而禾盡偃成王悔過自悟而禾盡起天之所以眷眷於周家者所以不庸釋於我周也三監安得而毁之哉周公雍容曲折風喻其君其亦知天意之所在哉東山周公東征也周公東征三年而歸勞歸士大夫美之故作是詩也一章言其完也二章言其思也三章言其室家之望女也四章樂男女之得及時也君子之於人序其情而閔其勞所以說也說以使民民忘其死其唯東山乎我徂東山慆慆徒刀反不歸我來自東零雨其濛莫紅反我東曰歸我心西悲制彼裳衣勿士行戶剛反枚莫柸反蜎蜎者蠋蒸在桑野敦音堆彼獨宿亦在車下我徂東山慆慆不歸我來自東零雨其濛果裸力果反之實亦施羊䜴反于宇伊威在室蠨音消蛸所交反在戶町他頂反畽他短反鹿場熠耀宵行不可畏也伊可懷也我徂東山慆慆不歸我來自東零雨其濛鸛古玩反鳴于垤田節反婦歎于室灑掃穹窒我征聿至有敦音團瓜苦蒸在栗薪自我不見于今三年我徂東山慆慆不歸我來自東零雨其濛倉庚于飛熠耀其羽之子于歸皇駁邦角反其馬親結其縭九十其儀其新孔嘉其舊如之何李曰東征管蔡挾三監叛周公帥師東征周在豐鎬其地在西管蔡與商其地在王室之東周公自東而征之則是自西而東故謂之東征三年而得罪人因其罪之輕重而行法至於歸周則三年矣其歸周則遂勞其歸士大夫美之故作此詩詩四章雖皆言勞歸士分而言之則四章之辭蓋有不同一章則言其師徒之全無流離散死之患二章則言女人之獨處思其夫也三章則言征伐之久其夫將至婦人思望之也男以女為室女以男為家然亦有以婦人為室家者如殷其雷之大夫勸家室以義四章則言征伐而歸其未有室家者及時行昏姻之禮凡四章所言足以見至誠慘怛之志序其情之所以然而閔其勤勞此人所以欣然而有喜色也夫有功見知則悅不見知則其心鬱結而無聊惟能序其情而閔其勞雖捐首領暴骨原野猶忘其死況於古之能知者其惟周公乎夫序其情閔其勞先王之時莫不皆然而以謂其惟周公者蓋當危疑之時役軍士以三年之久而能盡此道者其惟東山之詩為然此詩序言周公東征三年而歸勞歸士大夫美之則是一篇之義亦盡矣下文又言四章之辭各異其言周公序其情閔其勞其言甚詳比之他篇不如是之詳也嘗以謂詩序非一人之作蓋謂是也如載馳之詩以許穆夫人作此詩故曰閔其宗國顛覆而不能救也衛懿公為狄人所滅其下文序當時之事逮有狐之詩以衛人作此詩故曰衛之男女失時喪其妃偶下文又言古人之事蓋與此詩雖是一篇之序實非一人所作也我徂東山三監淮夷在周之東故曰東山慆慆言久也零落也濛雨貌也東山東征之地言我徂東山征伐久而不歸將歸而遇零雨濛濛夫以在軍之士久不得歸既歸而遇雨亦言其勞苦也今此詩所言亦足以見其勞苦但周公所以勞之之辭與漸漸之石異耳我東曰歸我心西悲者言我在東山之時未嘗不曰歸罪人未得則不得歸惟其未得歸則我心向西而悲西者室家所在也毛氏以謂公族有辟公親素服不舉樂為之變如其倫之喪毛氏之意謂管蔡有罪不得不誅周公既誅兄弟故見文武之廟心向西而益傷悲然觀上文言征夫之道遇雨濛濛而下言制彼裳衣不得以此為周公之西悲間於其中也我心西悲止言軍士之西悲也制彼裳衣鄭氏謂婦人制彼裳衣而來然下文又言勿士行枚亦不得以為婦人不如程氏以為備歸裝也士與政事之事同行陳也枚銜枚也周禮大司馬陳大閲之禮教戰之法遂鼓行徒銜枚而進注云枚如箸銜之於口為繣結於頂中軍法用此所以止喧譁也如此言軍士未得歸向西而悲及其歸裝而征役三年之久未嘗從事於行陳銜枚之間而見周公之征戰不舉刃而敵自服蓋師徒之全也如此蜎蜎蠋貌蠋桑蟲也爾雅云蚅烏蠋郭璞云大蟲如指似蠶韓子云蟲似蠋言在桑野知是桑蟲蒸毛氏謂置鄭氏謂蒸置也其音訓久言久在桑野也謂久處桑野有似勞苦然蟲之在桑何足以為勞苦故程氏以為蠋在桑葉之中居如士卒之獨處自保其身敦然獨宿於車下也蓋軍士獨處自保其身以見一章言其完也敦獨車之貌也果螺栝樓也李巡曰栝樓子名也孫炎曰齊人謂之天瓜本草云栝樓葉似木瓜葉形兩兩相值蔓衍青黑色六月華七月實如瓜瓣是也惟其蔓衍而生所以施於宇也伊威陸璣云一名委黍一名鼠􅣁在壁根下甕底土中生似白魚蠨蛸名長踦小蜘蛛長腳者俗呼為喜子町畽者踐處曰町畽程氏謂町畽廬傍畦隴為麋鹿之場熠耀螢火也一名夜光宵行夜行凡此五物蓋家中無人方見此五物不可畏也伊可懷也言家中有五物非可畏但起人懷思之情也鸛水鳥也似鴻而大長頸赤喙白身黑尾翅樹上作巢大如車輪卵如三升杯垤蟻冢也孟子曰泰山之於丘垤注云垤蟻封也蟻處土為冢以避濕鸛鳴于垤則是天之將雨婦人乃歎于室諸家多以為征夫於隂雨尤苦婦念之則歎于室不如陸農師以為婦者征夫之婦恐不如期鸛鳴于垤是天之將雨婦人歎于室恐不如期又恐其將歸穹窮窒塞其鼠穴而又灑掃以為征夫之將至也栗鄭氏以為析也軍士久在析薪之役然苦瓜在栗薪非其軍士在析薪之役程氏謂瓜之苦者延蔓於栗薪之上栗薪堅木以其苦人所不食則常在其所施於堅木言繫之固如此以比君子久役留滯而不還如瓜苦而繫堅木也惟其軍士留滯如此下文又言不見其夫之久于今三年今已將歸此所以望之也倉庚仲春而鳴其羽毛則熠耀而明諸家皆謂仲春嫁娶之時蘇黃門以謂倉庚飛而熠耀其羽以譬禮儀之盛二說皆然歸者婦人之嫁也黃白曰皇駵白曰駁既皇駁其馬又親結其縭縭者爾雅曰婦人之褘謂之縭縭緌也孫炎曰褘帨巾也郭璞曰即今之香纓也此女子既嫁所著示繫屬於人也毛氏謂縭婦人之褘也母戒女施襟結帨是從孫炎之說而與郭璞異意親結其縭者蓋以士昏禮云父送女命之曰戒之敬之夙夜無違宫事送女之時有以戒之也九十其儀言禮儀之多如此之善其舊如之何言征伐三年之久思而望之不為不切今則將歸其情如之何諸家之說多以為追序舊時昏姻蓋上文既言室家望女則是其歸也追序其舊情序四章言男女之及時則不得為追序此但言既有室家者則感其舊情未有室家者則及時昏姻故曰其新孔嘉其舊如之何此詩周公所以勞歸士也考之於詩則但言懷想之情而所以勞來之言則未之見而序言序其情而閔其勞所以說也說以使民民忘其死何哉蓋其夫婦懷抱之情盡載之於詩是其情周公已知之矣周公知其情則是勞之也楚子圍蕭蕭潰申公巫臣曰師人多寒王巡三軍拊而勉之三軍之士皆如挾纊夫師人寒王從而拊之則是知其寒矣知其寒而拊之則安得不悅乎周公能序其情而閔其勞此民之所以悅而忘其死采薇之詩遣戍役之詩也出車之詩勞還帥之詩也其詩中皆言其勞苦亦未嘗言其勞來之意正此類也大抵詩序之作如甫田大田刺幽王也詩中但言曽孫之事蕩之詩刺厲王詩中但言紂之事不必詩中有此然後見其所刺之意也古人有言梅止於酸鹽止於鹹飲食不可以無鹽梅而味常在於鹽梅之外詩人之意亦如是也黃講同破斧美周公也周大夫以惡四國焉既破我斧又缺我斨七羊反周公東征四國是皇哀我人斯亦孔之將既破我斧又缺我錡巨冝反周公東征四國是吪五何反哀我人斯亦孔之嘉既破我斧又缺我銶音求周公東征四國是遒在羞反哀我人斯亦孔之休李曰破斧毛氏以為管蔡商奄按書大誥序武王崩三監及淮夷叛逸書序成王東伐淮夷遂踐奄作成王政則是三監及淮夷為亂於周公攝政之時其後成王即政奄國又叛也而毛氏以為四國以立蒲姑則是奄國亦於周公攝政之時而為亂故孔安國注書大誥云三監商淮夷徐奄之屬皆叛周孔安國又引書傳曰武王殺紂繼公子祿父及管蔡流言奄君蒲姑謂祿父曰武王已死成王幼周公見疑矣此百世之時也則是奄淮夷為亂於周公攝政之時矣既謂管叔蔡叔武庚淮夷奄國則是五國安得謂四國是管蔡商奄知不數淮夷者淮夷在淮水之上東方之夷也此言四國諸夏之國故知不數之也然考之書序曰成王既踐奄將遷其君於蒲姑孔安國謂已滅奄而徙其君於蒲姑蒲姑齊地近中國教化則是奄者遠於中國亦不得為諸夏之國也蓋淮本即奄也合而言之則是為淮夷分而言之則為奄淮夷如春秋書赤狄是也奄如春秋書伊雒之戎是也奄乃淮夷之種落耳若以淮夷與奄分而為二則書之所謂東伐淮夷遂踐奄但不過伐淮夷而從之於奄安得以淮夷與奄分而為二乎此詩所謂管蔡流言挾武庚淮夷以叛故周公帥師而討之諸大夫所以美之也既破我斧斧隋銎曰斧方銎曰斨錡毛氏以為鑿屬韓詩以為木屬銶毛氏以為木屬韓詩以為鑿屬既破我斧又缺我斨毛氏曰斧斨民之用也禮義國家之用也其意謂有人既破我家之斧又缺我家之斨損其斧斨是廢其國家則其人為大罪以喻四國之君廢其禮義壞其國用是其君為大罪歐陽破之以為詩人之所惡者本以四國流言毁傷周公耳況今考詩經文無禮義之說詩人引類比物以斧斨為禮義其事不類鄭氏以謂四國流言既破毁我周公又損傷我成王以斧比周公以斨比成王則其取喻都無義類歐氏以為斧斨刑戮征伐之用也此說得之矣然謂四國為亂周公征討之凡三年至於斧破斨缺然後克之其難如此則亦未敢以為然觀東山詩曰勿士行枚則是東征未嘗從於行陳之間安得為難惟張橫渠以謂四國首亂烏能有為徒缺破我斨斧而已而言四國征誅皆自取也惟其為亂而不能有為故徒破我斧缺我斨周公東征以正四國者但哀其民陷於塗炭之中故從而征之則周公之德可謂大矣皇正也吪者化其惡而使之為善也嘉者言德之甚善也遒聚也言聚其民使無離心也休美也范內翰嘗有言曰象日以殺舜為事舜為天子也則封之管蔡啓商以叛周公公之為相也則誅之其迹不同其道則一也蓋象之禍及於舜故舜封之管蔡流言將危於周公以間王室得罪於天下故周公誅之非周公誅之天下所當誅也周公豈得而私之哉夫以武庚淮夷之為亂滅之可也管蔡乃周公之懿親亦不免於誅戮者蓋使周公顧兄弟之小嫌不能正四國以哀國人則何以與周之衰而安其社稷哉惟其正四國哀我人為念則雖管蔡之懿親安得宥之哉且以臣伐君事之至逆也而湯武征伐而不辭者則以其民墜於塗炭之中雖欲辭之而不可得也成湯曰夏氏有罪豫畏上帝不敢不正武王曰商罪貫盈天命誅之豫不順天厥罪惟均知湯武之征伐則知周公之誅管蔡有可伐之道周公不伐之則是周公安坐而視斯民之困是亦管蔡也後之人不能全其兄弟以周公而藉口此則不可也伐柯美周公也周大夫刺朝廷之不知也伐柯如何匪斧不克取七喻反妻如何匪媒不得伐柯伐柯其則不遠我覯之子籩豆有踐李曰伐柯四國流言周公帥師而征之罪人斯得然而成王之意猶未釋也周公作鴟梟以開喻於王非不切至然金縢未啓而致疑之心猶自若也此周大夫所以刺朝廷之不知鄭氏乃謂朝廷羣臣惑於管蔡之言不知周公之聖德疑於王迎之禮歐陽已辨之矣柯斧柄也毛氏謂禮義者治國之柄媒者所以用禮夫伐柯之用斧取妻之用媒其事一也毛氏於伐柯用斧則以喻周公能執禮義於取妻用媒則以喻用禮其說亦繁矣鄭氏謂伐柯之道惟斧能之此以類求其類以喻成王欲迎周公當使賢者先往媒者能通二姓之言定人室家之道以喻王欲迎周公當先使曉王與周公之意者又先往而孫育破之曰周公之思歸患成王之未悟耳王出郊而大雨反風禾則盡起精神感天況於人乎何須賢者之先往也周公至聖見於未形非如讎敵尚相疑阻何須用人重相曉喻乎此說是也王氏則以謂以仁致剛者柯也以順致其正者媒也周公之事如此而已致其仁而後柯可伐通其志而後妻可取此說迂曲不甚分明惟蘇氏以斧之與妻皆以取譬周公程氏以伐柯皆有其道今欲周公之歸亦必有其道終不如歐氏之說為詳明謂譬彼伐柯者不知以何物伐之乃問云如何可伐而答者曰必以斧伐也以斧伐柯易知之事而猶問之是謂不知也取妻必以媒其義亦然此說可謂盡之矣亦得夫序之所謂刺朝廷之不知也言周公之大聖最為易明猶不知之以見朝廷不知周公之甚也伐柯伐柯其則不遠歐陽亦以謂所伐之柯即手執之柯是也亦謂其易知而不知以譬周公近親而有聖德成王君臣皆不能知也蘇氏則以謂人乃取法之王氏則謂由恕及人程氏謂欲反周公而取則於周公皆強為之說我覯之子籩豆有踐歐陽以謂欲見之子非難事第列籩豆為相見之禮可見矣其如王之不知公使久居於外而不召何此章皆從歐陽之說自古朝廷有賢臣不見知雖讒諂肆行賢不肖混殽為難辨矣苟反而思之而有所用心則若難而易苟無所用心如衛之賢者日之方中在前上處夫日之方中至明而易見之時在前上處至近而易察之地惟其不能知而不用之使彼賢者仕於伶官則若易而難傅說在胥靡之時知而用之可謂難矣然高宗能求諸野而立以為相則若難而易周公之聖德又為成王之近親其欲知之可謂易然而困於流言朝廷不知則若易而難周大夫所以刺朝廷之不知者蓋以成王之惑於流言而不能信之乃反疑之則易反為難及啓金縢之後成王遂迎周公反而居攝周大夫乃作此詩反覆言之則知用周公亦甚易矣黃講同九罭于逼反美周公也周大夫刺朝廷之不知也九罭之魚鱒才損反魴音房我覯之子衮古本反衣繡裳鴻飛遵渚公歸無所於女信處鴻飛遵陸公歸不復於女信宿是以有袞衣兮無以我公歸兮無使我心悲兮李曰此詩與伐柯之詩皆以謂大夫刺朝廷之不知者蓋以周公居東之時成王猶信管蔡之言故周公留滯而不得歸此周大夫所以刺朝廷之不知周公之忠信如此詩與伐柯破斧之詩皆是言美周公然破斧先言美周公後言周大夫以惡四國焉此詩與伐柯先言美周公繼之以刺朝廷之不知蓋四國流言而有譖周公之心朝廷皆不知其聖而疑周公疑之則不足以明周公之聖德之美也九罭爾雅曰緵罟謂之九罭魚網也孫炎曰九罭謂魚之所入有九囊也郭氏曰緵今之百囊網也從孫炎以為魚之所入有九囊則是九罭為小網矣從郭氏以為緵今之百囊網則是九罭為大網矣毛鄭亦有二說毛氏以謂九罭緵罟小魚之網鱒魴言大魚而處小網非其宜也以喻周公聖人而乃留滯於東方非其冝也鄭氏謂九罭之罟乃得鱒魴之魚言取物各有器以喻周公聖德當以袞衣往迎之二說皆以鱒魴為大魚而獨以九罭小大之不同歐陽取毛氏之說而以爾雅云緵罟而謂之九罭者謬也當言緵罟謂之罭九罭之罟小網也鱒魴大魚也爾雅云鮅鱒魴魾鄭氏以謂鱒似鯶子赤眼者江東人呼魴為鯿魚鱒魴大魚處小網之中非其所冝故周公不得其所亦如之覯見也衮衣九章一曰龍二曰山三曰華蟲四曰火五曰宗彞此畫於衣六曰藻七曰粉米八曰黼九曰黻繡於裳上公則有衮衣繡裳我見此周公上公之服冝在朝廷不當留滯於東方也鴻者鴈之屬大曰鴻小曰鴈鴻之飛宜其髙也今乃遵循於渚非其宜也以喻周公留滯東方非其宜也惟周公處東方如鴻遵渚非其宜矣故西人告東人曰言公歸朝廷無所乎則當於汝東方信處矣言公歸當復位此則西人告東人之辭公歸不復於女信宿者言西人告東人曰公歸不復其位於女信宿乎宿猶處也西人告東人以為公必歸而東人又告西人曰言有袞衣之服冝在朝廷不當留滯於此無使我公歸而使我心傷悲此又東人愛周公之意也王氏以謂周公之道可謂在彼無惡在此無斁矣然而朝廷不知此大夫所以刺之也此實名言也蓋以周公居於東而西人乃欲其歸西人既欲其歸使周公留滯於東方而不歸則是成王未悟成王未悟則是天下之事未可知也惟其朝廷迎而歸之則社稷宗廟可得而安而恩澤豈不遠暨於東人哉東人所以欲其留者此以見詩人之言周公之德其為東人之所愛也詩人之言甚言周公之得民心亦以見不知者可謂智不足以知周公矣以周公與召公盛德大業股肱王室民之戴其德者未有少忘愛之者無彼疆此界之殊彼時此時之異甘棠之詩則知召公之德民愛之也不易世而忘九罭之詩則知周公之德民愛之也無東人西人之異成王之於周召二人各分陜而治豈不盛哉黃講同狼跋蒲末反美周公也周公攝政遠則四國流言近則王不知周大夫美其不失其聖也狼跋其胡載疐其尾公孫碩膚赤舄几几狼疐其尾載跋其胡公孫碩膚德音不瑕李曰狼跋周公攝政之始也成王幼沖未可親政事故攝政焉而管蔡流言以為公將不利孺子成王之心亦信管蔡之言以為公將不利於己公之進退其難如此卒能討平四國以扶持周室周大夫所以美其不失其聖也狼之老者頷下有胡老狼垂胡毛鄭及諸家之說皆以謂老狼有胡進則躐其胡退則跲其尾進退有難然亦不失其猛其說是也不如蘇黃門之說尤詳明狼之垂胡其進也如將躐其胡其退也如將跲其尾然而胡尾終不能為狼之纍以喻周公之輔王室亦多故也外則管蔡流言以病於外內則成王不知以憂於內天下視周公亦如視狼焉進則憂跋其胡退則憂跲其尾周公從容自得而二患自釋此言盡之矣公周公也孫順也碩大也膚當從歐陽以為膚革之充盈几几安也復下曰舄襌下曰屨復下襌下故有舄屨之名周公當患難之時順而受之其膚革常充盈也從容自得無遑遽之色故赤舄几几也其德音不瑕者公之進退處之以道無有瑕疵也夫以管蔡流言者自常人觀之必以管蔡流言是毁己也是為己而討之而周公乃不顧小嫌率三軍以討之以平僭亂以安諸夏為己任管蔡疑周公之攝政自常人觀之必以為管蔡所以疑之者以周公之攝政也周公乃於金縢既啓之後而又攝政七年欲以輔成王之德以致太平為己任則周公之德大過於人雖居危難之中處之自若可謂為人所不能矣昔桓溫將移晉祚呼謝安王坦之將殺之坦之流汗沾衣倒執手板謝安從容就席笑語移日賢於坦之遠矣及苻堅率衆百萬次於淮淝而安為大都督夷然而無懼色既而兄子𤣥破苻堅有驛書至安方與客圍棊了無喜色客問之徐曰小兒輩遂已破賊罷還內過戶限心喜不覺屐齒之折以折屐觀之則知所謂從容就席笑語移日與夫無喜懼之色皆有驕侈之心所以不如周公也然周公性之也謝安假之也黃講同毛詩集解卷十八
