body:
  text: 毛詩集觧卷五宋李樗黄櫄撰雄雉刺衛宣公也淫亂不恤國事軍旅數色角反起大夫久役男女怨曠國人患之而作是詩雄雉于飛泄泄移世反其羽我之懷矣自詒伊阻雄雉于飛下上時掌反其音展矣君子實勞我心瞻彼日月悠悠我思道之云逺曷云能來百爾君子不知德行下孟反不忮之䜴反不求何用不臧李曰宣公上烝夷姜下納宣姜恣為淫亂之事惟其淫亂於聲色故國事不暇恤軍旅數起大夫久役於外而男女怨曠故國人患之也孟子曰昔者大王好色愛厥妃詩云古公亶父來朝走馬率西水滸至於岐下爰及姜女聿來胥宇當是時也内無怨女外無曠夫宣公之淫亂異於大王之好色故内有怨女外有曠夫宜若古先聖人處宮室則欲民之無流離立妃嬪則欲民之無怨曠是其好色與人同也宣公淫亂而不恤國事男女怨曠而不自知此詩人之所以作也王氏曰雉善鬬雖飛不分域而其交也有時言軍旅數起大夫久役男女怨曠曽雉之不如也蘇氏曰宣公之好用兵如雄雉之勇於鬭蓋王氏則以男女怨曠言之蘇氏則以軍旅數起言之詳考此詩雄雉則有求雌之意蓋以刺其淫亂如匏有苦葉詩曰雉鳴求其牡亦刺其淫亂小弁詩曰雉之朝雊尚求其雌此謂求雌之意當從毛鄭之說可也泄泄其羽鄭氏謂宣公整其衣服而起奮迅其狀貎志在婦人而已鄭氏多以羽毛喻人之衣服如燕燕于飛差池其羽亦以興戴媯將歸而舒張其羽翼其說不然泄泄自得也言宣公淫亂而不知也下上其音者鄭氏以謂興宣公大小其聲以說婦人其說亦如燕燕之詩下上其音亦以謂戴媯將歸言語感激聲有小大其說皆不通下上者下上其音以求其雌我大夫也阻難也懷安也鄭氏曰君之行如是我安其朝而不去今從軍旅久役不得歸此自遺以患難此說是也展誠也君子指古之君子動必合於禮法故人受其賜我思古之君子不可得見也此心之所以勞也王氏以謂男女怨曠之辭曠於外者君子也勞於内者女也此說與上下不相合瞻彼日月悠悠我思大夫久役不得歸悠悠然我思之長也道之云逺曷云能來者何時而能來思歸而不可得之辭也百爾君子不知徳行不忮不求何用不臧百爾君子言凢百君子是也言百君子之多我不知其徳行如何惟不忮不求無所徃而不為善也言古者傷古之如是哀今之不然也忮忿也求欲也不忮能懲忿不求能窒慾惟不忮則不至於軍旅數起不求則不至於淫亂不恤國事矣宣公之所以然者以其忮求也此詩所以思君子而不得之辭也孔子曰衣敝緼􅂁與衣狐貉者立而不恥者其由也歟不忮不求何用不臧子路終身誦之子曰是道也何足以臧世之人徒見夫子謂不忮不求何用不臧易事也殊不知夫子抑揚反覆自有深意子路既能不忮不求而終身誦之無日新之功故夫子進之人苟未至於不忮不求之地則不忮不求豈易也哉善學者當不溺於言語也夫子以何用不臧為何足以臧則是不溺於言語之間知此則可與言詩矣黄曰說此詩者謂詩人以雄雉喻宣公夫以禽獸喻其君非作詩者之意此詩大夫久役男女怨曠作此詩者自歎其雄雉之不若如詩言士如歸妻而先曰雉鳴求其牡言心之憂矣而曰雉之朝雊尚求其雌此是喻昬姻之意牧犢子七十無妻韓愈作雉朝飛操曰嗟我雖人曽不如彼雉雞生身七十年無一妻與妃是亦此詩怨曠之意也古者處宫室則欲民之無流離立嬪妃則欲民之無怨曠如大王好色愛厥妃則必使内無怨女外無曠夫今宣公淫亂而使男女怨曠此詩人之所以刺歟唐鄭仁基息女美而才皇后建請為充華典冊具或言己許聘魏徴諫曰陛下處臺榭則欲民有棟宇食膏粱則欲民有飽適顧嬪御則欲民有室家今鄭氏已約昬陛下取之豈為民父母意邪乃止今宣公淫亂而至於使男女怨曠意者其亦無如徴之臣哉匏有苦葉刺衛宣公也公與夫人並為淫亂飽有苦葉濟有深渉深則厲淺則揭苦例反有瀰彌爾反濟盈有鷕以小反雉鳴濟盈不濡軌雉鳴求其牡雝雝鳴鴈旭許玉反日始旦士如歸妻迨氷未泮招招舟子人渉卬否人渉卬否卬須我友李曰毛氏謂夫人為夷姜歐陽氏觧之曰夷姜宣公之父妾也宣姜宣公子伋之婦也皆稱夫人此說得之故詩之言宣姜皆未可知也故曰公與夫人並為淫亂毛氏言匏謂之瓠陸農師曰細而合上曰匏頸短大腹曰瓠毛氏之說非也蓋言匏瓠非一物也鄭氏謂匏葉苦而渡處深謂八月之時隂陽交㑹始可以為昬禮納采問名歐陽非之而王氏之說又曰匏之葉有可食之道其不可者苦也濟之渉有可揭厲之道其不可者深也男女有相與之道其不可者非其匹也當如王氏之說則兩句分為兩意惟歐陽本於左𫝊叔孫穆子賦匏有苦葉鄭叔向曰苦飽不材供濟於人而已韋昭注云不材言不可食供濟而已腰匏可以渡水也此言匏有苦葉濟有深渉者是腰苦匏而濟渉不問深淺皆欲渡之也深則厲淺則揭韓詩曰以至心為厲厲者帶而上為厲孫炎曰揭者褰裳也凢人渡水則以舟淺則褰裳今也深則厲淺則揭言其不擇淺深也以興宣公之淫亂不待可否惟意所適不知有没溺之患瀰深水盈滿也鷕雌雉聲也由輈以上謂之軌言有瀰濟盈濟盈不濡軌者言宣公淫亂不自覺也有鷕雉鳴雉鳴求其牡者興夫人不顧禮義而從公猶禽鳥之相求也惟知雌雄之為正而無親踈父子之别此說是也鄭氏之説則曰渡深水者必濡其軌言不濡者喻夫人犯禮而不自知而王氏又謂濟盈不濡軌以言其淫雉鳴求其牡以言其亂二說皆不足取而鄭氏又釋牝牡飛曰雌雄走曰牝牡而歐陽非之曰牝雞無晨豈是走獸邪此說是也雝雝鳴鴈聲之和也旭日始旦日始出也迨及也泮散也古者士之親迎則必及乎冰术泮之時而迎女故家語曰霜降而嵗功成則嫁娶可以行矣冰泮而農事起則昬禮於焉可殺苟卿亦曰霜降娶妻冰泮殺止皆言嫁娶之禮必得時也今宣公安於淫亂曽庻士之不如也非特庶士之不如又行道之人不如也故下文繼之曰招招舟子人渉卬否人渉卬否卬須我友卬我也見於爾雅招招者號召之聲王逸曰以手曰招以言曰召舟人之子招我而渡衆人皆渡而我獨不渡者我待我之友也王氏曰徒渉而已猶須其友而後往而况於夫婦乎歐陽亦曰行路之人衆皆渉矣有招之而獨不渉者以待同行不忘其友以刺夫人忘己所當從而隨人所誘曽行路之人不如也二說皆通論曰夫詩人之載淫亂者多矣在上之淫亂者如匏有苦葉牆有茨雄雉是也在下之淫亂者如氓桑中蝃蝀是也淫亂之風非美事也而孔子删詩不去而存之者蓋所以示監戒於天下也正如春秋簒弑之事亂臣賊子一一書之亦所以示其監也而唐太子𢎞授左𫝊至於楚世子商臣殺其君頵而更授他書是不知聖人垂戒之意也亦如詩述淫亂之事亦所以示其監戒而近世有建言者講筵不進國風是亦不知埀戒之意也夫男女之别國之大禮也禮記曰鸚鵡能言不離飛鳥猩猩能言不離禽獸今人無禮雖能言不亦禽獸之心乎夫惟禽獸無禮故父子聚麀是故聖人作為禮以教人使自别於禽獸今宣公好為淫亂是去禽獸蓋無㡬矣故聖人列之於詩以為後世之戒使後世能監宣公之失則男女以正男女以正然後教化行教化行然後人倫美其效豈淺淺哉此聖人録國風㫖也黄講同谷風刺夫婦失道也衛人化其上淫於新昬而棄其舊室夫婦離絶國俗傷敗焉習習谷風以隂以雨黽莫尹反勉同心不宜有怒采葑采菲非鬼反無以下體德音莫違及爾同死行道遲遲中心有違不逺伊邇薄送我畿音祈誰謂荼音徒苦其甘如薺齊禮反宴爾新昬如兄如弟涇以渭音謂濁湜湜音殖其沚音止宴爾新昬不我屑素節反以母逝我梁母發我笱古口反我躬不閱遑恤我後就其深矣方之舟之就其淺矣泳之游之何有何亡黽勉求之凢民有喪匍音蒲匐蒲北反救之不我能慉反以我為讎既阻我德賈音古用不售市敇反昔育恐育鞫及爾顚覆芳服反旣生旣育比予于毎我有㫖蓄亦以御冬宴爾新昬以我御窮有洸音光有潰既詒我肄以世反不念昔者伊余來墍李曰孟子曰上有好者下必有甚焉者矣一周南之風在上之人既正其家室在下之人亦從而化之如行露汝墳野有死麕是也變風既作上之人不能正其室家故下之人亦從而化之如谷風氓之詩是也故曰衛人化其上淫於新昬棄其舊室夫人之越法犯分惟其好色而已人君好色於上則下之人靡然而從之至於華落色衰故夫婦離絶所以國俗傷敗也爾雅曰東風謂之谷風孫炎曰谷之為言榖榖生也谷風者生長之風也習習和舒貎程氏曰習習和也隂陽交和則感隂而成雨其感也隂其成也雨此蓋言猶夫婦和而家道肥故繼之以黽勉同心不宜有怒言夫婦當黽勉同心不可有怒也采葑采菲無以下體毛氏曰葑須也釋草曰須葑蓯孫炎曰須一名葑蓯坊記注云葑蔓菁也陳宋之間謂之葑陸璣云葑蕪青幽州或謂之芥方言云蘴蕘蕪菁也陳椘謂之葑齊魯謂蕘關西謂蕪菁趙魏謂大芥孔氏云葑與蘴字雖異其音同也即葑也須也蕪菁也蔓菁也葑蓯也蕘也芥也七者一物也菲芴也其說得於釋草云郭璞曰土𤓰也孫炎曰葍𩔖也程氏曰采葑采菲者以其有下體也無以以也此說不若鄭氏之說為善鄭氏曰此二菜上下可食然而其根有美時有惡時采之者不可以根惡時并棄其葉喻夫婦以禮義合顔色相親亦不可以顔色衰而棄其相與之禮此說是也按左𫝊僖公三十三年曰季曰采葑采菲無以下體君取節焉可也杜氏釋之曰葑菲之菜上善下惡食之者不可以其惡而棄其善此喻夫婦之道不可以宴新昬而棄其相與之禮也德音好音也言始為夫婦之時與爾好音而不相違將期偕老以同死歎今之不然也行道遲遲程氏謂我行道而遲遲不能進者中心念其有違乎此也不逺伊邇者謂此道不逺而近何莫置我當其分乎此說迃曲不如先儒之說為善先儒曰行於道路之人至將離别尚遲其行中心猶有乖離之志不忍相别况己與君子猶是夫婦今棄已訣别之時送我不逺惟近爾薄送我於門内而已畿門内也是恩義不如行道之人此說是也荼毒苦菜也青者謂之蓼紫者謂之荼薺菜之甘也鄭氏云荼誠苦也而君子於己之苦毒又甚於荼此說不如程氏為善程氏曰荼至苦也乃以為甘新昬非禮之至也反好之如兄弟其說與下文相屬合為一意鏌鋣本銛鉛刀本鈍愚者皆知之賈誼則曰鏌鋣為鈍鉛刀為銛千鈞本重鴻毛本輕愚者皆知之屈原則曰千鈞為輕蟬翼為重凡以是非紊亂故也此言先儒之說為尤長也其意與賈誼云鏌鋣為鈍鉛刀為銛隨夷為溷跖蹻為亷其㫖一也言荼為至苦矣乃以為甘如薺新昬為非禮矣彼宴之如兄弟非所當安而安也涇水濁渭水清漢書溝洫志涇水一石其泥數斗潘岳西征賦云清渭濁涇由是觀之則涇水濁渭水清可見矣先儒則以謂涇水以有渭故見涇濁喻君子得新昬故謂己惡也其說與下文湜湜其沚不相屬此蓋言渭清而涇濁今反以渭為濁而其沚則皎然而湜湜湜湜說文曰水清而見底沚小渚也言此以紊亂清濁迷惑之甚也屑潔也言宴爾新昬不以我為屑潔而用為室家也石絶水曰梁周禮注曰梁者堰也堰水以為梁笱捕魚之器無逝我梁無發我笱言淫於新昏而奪我室家之道也而歐陽以謂古之人於其資生之具者尤所顧惜常不欲他人輙至於其所於詩屢見之無逝我梁無發我笱小弁有之胡逝我梁於何人斯見之此說為善然歐陽氏但指梁與笱而言亦是發喻新昬奪室家之道也我躬不閲遑恤我後鄭氏謂我身尚不能自容何暇恤我所生子孫乎歐陽氏以為我尚不能自容何暇恤其後嗣乎程氏又以謂我身所為且不能省何暇恤我既去之後乎三說皆通而程氏以閲為省閲比之二說此為長也就其深矣此言昔日勤勞治室家之事也方泭也泳潜行也言不擇深淺皆盡心而為之也何有何亡言治家也何所有乎何所亡乎不擇有亡皆黽勉而求之也凢民有喪匍匐救之程氏以謂不特如是治其家而已又周睦其鄰里郷黨莫不盡其道此說不如鄭氏為長鄭氏曰凢於民有凶禍之事鄰里尚盡力救之况我於君子家事之難易乎固當黽勉以䟽踰親也此說為善慉飬也既不能慉我而反以我為仇讎夫婦之愛至於仇讎此易所謂夫妻反目也既阻我徳賈用不售鄭氏言阻難也既難却我而隱蔽我之善徳今我更修婦道以事之覬其察己猶見䟽外如賈物之不售此說為善程氏曰唯其心既阻絶我之善故雖有勤勞如是而不見取如賈之不售也凢人所以憎而不知其善者由其心阻絶其善故也此說尤善昔育恐育鞫及爾顛覆鄭氏云昔㓜稚之時恐至長老窮匱故與女顚覆盡力於衆事難易無所辭然以育之一字分為兩義不若程氏之說曰昔惟恐生飬之道困窮及爾以至於顛覆今既遂其生育饒息矣乃比我荼毒蓋言昔之飬生則盡心力而為之今既生既育之後乃比我於荼毒言其惡己之甚也此正小雅谷風所謂將恐將懼惟予與女將安將樂汝轉棄予是也㫖美也言我有美菜蓄之亦以禦冬月窮乏之時如冬月美菜春日則棄之今乃安於新昬而但以我為禦窮困之時有洸有潰既詒我肄洸者武也潰者怒也江漢之詩曰武夫洸洸亦言其武韓詩云潰不善之貎鄭氏曰洸洸潰潰然無温潤之色而盡遺我以勞苦之事窮困我然上既言方之舟之泳之游之等事以言其勤勞矣至於下文不復言其勤勞之事也程氏曰肄習也言詔我以武暴憤怒習以為常矣此說是也墍息也言君子忘舊不念往昔年我始來之時安息我也欲其不忘舊也夫妻者齊也一與之齊則終身不改豈有淫其新昬者一為好色所移則棄舊而圗新哉古之人於戰國䇿中有前魚之誓謂釣魚者既得後魚而棄其前魚司馬相如為陳皇后嘗作長門賦哀陳皇后之見棄及其惑於嬖妾而文君又有白頭吟之歎躬自蹈之好色之事其惑於人者如此其在於易歸妹之象曰澤上有雷歸妹君子以永終知敝則戒懼之不至於離散也知歸妹之象則知谷風之刺後漢宋𢎞𫝊云帝姊湖陽公主新寡帝與共論朝臣㣲觀其意公主曰宋公威容徳器羣臣莫及帝曰方且圖之後𢎞被引見帝令公主坐屏風後因謂𢎞曰諺云貴易交富易妻人情乎𢎞曰臣聞貧賤之交不可忘糟糠之妻不下堂顧謂主曰事不諧矣若宋公者所謂不忘貧賤矣使當時人人如宋公則谷風之詩無自而作黄曰上之所好下必有甚焉人君正身以正朝廷正朝廷以正百官正百官以正萬民其可已哉有文武之君則有二南之風化有宣公之君則夫婦失道也固宜易歸妹曰澤上有雷歸妹君子以永終知敝蓋以戒其如谷風之詩而已後漢光武時帝姊湖陽公主新寡欲歸宋𢎞帝謂𢎞曰貴易交富易妻人情乎𢎞曰貧賤之交不可忘糟糠之妻不下堂古有釣後得魚棄前魚之句司馬相如為陳皇后作長門賦哀其見棄及其惑於嬖妾文君又有白頭吟之歎風俗之瓌至此極矣式㣲黎侯寓于衛其臣勸以歸也式㣲式微胡不歸微君之故胡為乎中露式微式微胡不歸微君之躬胡為乎泥中李曰黎國也春秋宣十五年晉滅潞氏伯宗數潞氏之罪曰棄仲章而奪黎氏地三也杜氏曰黎氏黎侯國上黨壺關縣有黎亭所謂黎即黎氏之國也但言為狄人所迫逐不知狄果赤狄否其地近於夷狄蓋後世之黎陽也寓者寄也𫝊曰寄公者何失地之君也言黎侯以失地寓乎衛衛無救難之志故其臣勸之以歸也毛氏曰式用也言君用在此而益微襄二十九年榮成伯賦式㣲乃歸服䖍云言君用中國之道微亦以式為用此二說皆不通蘇氏曰君子之所以觀其人者於其㣲耳是以試之於微而不可則止今君之寓於衛久矣而衛不勤吾其不吾納者可見矣胡為而不自歸乎然不若鄭氏之說為長鄭氏云式𤼵聲也式微式微者微乎微者也以君被逐既微而又見卑賤是至㣲也若從蘇氏之說以求詩意亦可通然下文微君之故微君之躬說者以謂非君之躬則我羣臣胡為而在此也其說不然胡文定曰以事下人不有其事是謂微君之故以躬下人而人不有其躬是謂微君之躬微為不有也文定之意言以微視黎侯如無有也其說與下文為一意故可從也胡為乎中露胡為乎泥中鄭氏曰泥中中露皆衛地也其說無所據王氏曰中露言有沾濡之辱而不見庇覆泥中言有䧟溺之憂而不見拯救也蘇氏曰言其暴露而無覆藉之者也其說皆通故凢人之失國有多曰越在草莾又曰卑賤者辱在泥塗其𩔖多如此先王建國使小大相維有患相救衛不救黎非惟失睦乃四鄰之道抑亦脣亡齒寒矣其後衛為狄所滅齊侯以管敬仲之言而救之觀木𤓰之詩衛之德齊也為最深則知黎之怨衛也為最切使齊之於衛如衛之於黎則衛不血食久矣黄曰木瓜美齊衛人作也故其詩不得為齊猗嗟刺魯齊人作也故其詩不得為魯式微旄丘皆黎臣子所作而乃為衛者黎蓋衛附庸之國也春秋宣十五年晋滅潞氏伯宗數狄之罪曰棄仲章而奪黎氏地三也杜氏曰黎氏黎侯國上黨壺關縣有黎亭是也寓寄也喪服𫝊曰寄公者何失地之君也黎侯以失地寓于衛衛無救難之志故其臣勸以歸式微言其君被逐又為衛人卑賤其微已甚何為而不歸乎胡先生曰以事下人而人不有其事是謂微君之故以躬下人而人不有其躬是謂微君之躬言衛人以微視黎侯如無有也中露泥中說者以為二邑無所經見觀詩人之意但以為衛既輕君矣何為尚暴露而不歸乎何為處泥塗而不歸乎如曰越在草莾是也嗚呼先王建國欲使患難相救欽恤四鄰今黎寓于衛而衛不恤豈先王建國之意乎其後衛為狄所滅而齊救之使衛如齊則式微不作使齊如衛則木瓜不作旄丘責衛伯也狄人迫逐黎侯黎侯寓于衛衛不能修方伯連率音帥之職黎之臣子以責於衛也旄丘之葛兮何誕之節兮叔兮伯兮何多日也何其處也必有與也何其久也必有以也狐裘䝉戎匪車不東叔兮伯兮靡所與同瑣素果反兮尾兮流離之子叔兮伯兮褎如充耳李曰王制曰五國以為屬屬有長十國以為連連有帥三十國以為卒卒有正二百一十國以為州州有伯又曰千里之外設方伯所謂衛伯即方伯也蘓黄門曰以史記云衛頃侯厚賂周夷王始建爵為侯伯康叔在成王時已稱孟侯又稱衛侯則是康叔已稱侯矣以伯為方伯故其世世子孫皆稱伯猶詩以召公為召伯而非伯爵也至於眞伯以下故但稱其本爵不復稱伯故以本爵稱今詩言衛伯者蓋罪其不能修先祖之職以救黎侯之難也晉文公與楚人戰於城濮能服强楚王命晉侯為方伯其後悼公㑹諸侯于蕭魚此其所以復伯使衛而能救黎國之患則亦將復伯矣晉自悼公已後楚人滅陳滅蔡晉荀吳謂韓宣子曰不能救陳又不能救蔡物以無親晋之不能亦可知也為盟主而不恤亡國將焉用之則衛之不能救黎亦可知矣旄丘之葛兮何誕之節兮叔兮伯兮何多日也何其處也必有與也何其久也必有以也旄丘爾雅云前高後卑下也李廵注云前髙後卑王氏曰前髙後低譬衛之於黎有始而無終也王氏好逐句生義如南有樛木則曰南明方也旄丘之葛則曰有始無終詩人之意但云旄丘之地有此葛其意取譬於葛非取於旄丘葛節本延蔓相屬今則胡為濶誕其節諸侯本患難相救今則胡為不同患難也言此正如日居月諸胡迭而㣲為一意言本不微今何為而微也叔兮伯兮何多日也鄭氏云呼衛之諸臣叔與伯也與汝期迎我君而復之可來而不來汝日數何其多也王氏曰并責其君臣叔伯言其臣也二說不如蘇氏之說為善叔兮伯兮同姓之國也然叔伯又不必異姓如言叔父伯父叔舅伯舅是也何多日也何其多日而不我救也何其處也必有與也言我何其處於衛意必有相與而我救也望衛之救難今則不然也下文云何其久也必有以也只是一意鄭氏以謂我君何以處於此乎必以衛有仁義之道故也無是理也狐裘䝉戎毛氏云大夫狐蒼裘䝉戎以言亂也是以狐裘為大夫服也鄭氏云刺衛諸臣形貎如䝉戎然但為昏亂之行王氏言狐裘以居而息民蓋狐疑而不果之物其義利以止不利以有為衛不果於救黎故以狐裘刺之蘇氏曰䝉戎亂貎也久留於衛裘已敝矣此三說皆未通當以左氏之言為證僖五年士蒍之言曰狐裘尨茸一國三公吾誰適從杜氏釋之曰亂貎也蓋狐裘䝉茸喻國之亂叔伯不與同無所適從也今也諸臣䝉戎而無救患之志非車不東也匪車不東者言非車不能東而衛不我救也東黎國本在衛西而所寓在東也瑣兮尾兮毛氏云瑣尾少好之貎也流離鳥子也其說本於爾雅釋鳥云鳥少美長醜為鶹鷅陸璣注云流離梟也孔氏從而為之說曰黎之臣子責衛諸臣言瑣兮而少者尾兮而好者乃流離之子也少而美好長即醜惡以興衛之諸臣始而愉樂終而㣲弱言無德自將不能常為樂也毛氏之意以謂衛之諸臣始而愉樂終而微弱殆非詩人之本意不若從王氏之說為優王氏瑣細也尾末也黎侯之子流離失職故瑣尾也蓋詩人之意謂黎侯窮困於此瑣細而尾末矣流離而失職矣而衛之諸臣不能救之蓋責之深也叔兮伯兮褎如充耳褎盛服也王氏曰徒盛其服而不能聼其告愬此說是也論曰孟子曰諸侯失國而後託於諸侯禮也黎侯失國而寓之於衛使衛修方伯連帥之職事可也今衛不能修其職反無救患之志豈禮也哉古先王建國使之内外相比小大相維患難相救故有患難而求救又禮所當然也苟為安視其難而不救亦猶越人視秦人之肥瘠不惟不能睦乃四鄰以至脣亡齒寒而國亦不保矣昔狄人伐邢管敬仲言於齊侯曰戎狄豺狼不可厭也諸夏親暱不可棄也詩曰豈不懐歸畏此簡書簡書同惡相恤之謂也請救邢以從簡書齊人救邢桓公特假仁義而託國救災恤鄰誠不可多得也今衛之不能救黎其不及桓公逺矣觀衛有狄人之難齊桓公攘夷狄而封之木𤓰之詩是也則知衛人之德桓公者深矣觀此詩則黎人之惡衛伯也亦深矣子曰己所不欲勿施於人衛國有狄人之難可謂己所不欲矣其可施於人哉黄曰葛節本延蔓相屬今何為濶誕其節諸侯本患難相濟今何為而不同患難也叔兮伯兮不斥言衛君而微責之狐裘䝉茸攷左氏僖五年士蒍曰狐裘尨茸一國三公吾誰適從杜氏釋之曰茸亂貎也匪車不東非車不能東而衛之不我救也瑣兮尾兮言其細弱之甚而流離無所歸矣何衛之君臣若不聞也褎如充耳言衛侯褎如服充耳而不聞也淇澳詩云充耳琇瑩蓋充耳者瑱也天子以玉諸侯以石褎然盛服之貎古者諸侯小大相維患難相救狄人伐邢管敬仲言於齊侯曰戎狄豺狼不可厭也諸夏親暱不可棄也請救邢以從簡書於是齊人救邢衛伯其亦不知簡書也哉衛失國而齊救之黎失國而衛不救是非惟黎之㣲弱衛之㣲弱亦萌於此矣簡兮刺不用賢也衛之賢者仕於伶官皆可以承事上者也簡兮簡兮方將萬舞日之方中在前上處碩人俁俁疑矩反公庭萬舞有力如虎執轡如組音祖左手執籥于若反右手秉翟亭歴反赫如渥於角反赭音者公言錫爵山有榛仄巾反隰有苓音零云誰之思西方美人彼美人兮西方之人兮李曰伶官樂官也伶氏世掌樂官而善焉故後世多號樂官為伶官是以黄帝則有伶倫氏周景王時則有伶州鳩皆世其官也伶官者賤職耳昔戴逵善鼓琴晉武陵王晞召之而逵破其琴曰吾不能為王伶人今以賢人乃為衛之伶官正猶君子陽陽之詩序言君子遭亂相招為禄仕全身逺害而其詩曰君子陽陽左執簧右招我由房君子陶陶左執翿右招我由敖正猶此詩言君子仕於伶官其詩亦曰左手執籥右手秉翟蓋言其生不遇時屈於賤役也皆可以承事王者言賢者有王佐之才不得大用而困於伶官以見賢者之不遇而衛君之不知人也簡兮簡兮方將萬舞簡之一字說者不一毛氏曰簡大也言其為大徳也張横渠云簡略也衛之君雖不用賢而賢者不免有太簡之譏二說不通皆不如鄭氏之說鄭氏曰簡擇也方毛氏曰四方也將行也亦不如鄭氏之說以謂將且也擇兮擇兮者為且祭祀當萬舞也王氏以干羽為萬舞非也鄭氏云萬舞者干舞也此說亦是按春秋左𫝊云萬入去籥之别公羊曰萬者何干舞也籥者何籥舞也見宣八年何休釋之曰干楯也萬舞名也故知萬舞者指干舞而言也此言衛君簡擇以充萬舞徒知盡心於此而不知有他使其能以是心擇賢有將才者使之為將有相才者使之為相則衛興有日矣奈何古之庸君暗主多盡心而為之殊不知以此心擇賢者則才亦不可勝用也日之方中在前上處毛氏云教國子弟以日中為期鄭氏亦從此說據鄭氏之意以謂明而始行事不當至於日中之時遂生此教國子之說毛氏言方將萬舞既言用之於四方於公庭萬舞又言其親在宗廟公庭豈於詩中有教國子弟之事蓋此但為擇人又求日中而習之在前上處言居於舞列之上也碩人俁俁公庭萬舞碩大也俁俁説文曰壮大也公庭鄭氏親在宗廟公庭論語八佾言孔子謂季氏八佾舞於庭䟽曰季氏庭也由此觀之則公庭者乃宗廟之庭蓋言俁俁之人不宜舞而今居於舞列之前也王氏曰日之方中至明而易見之時也在前上處者至近而易察之地也於時不能察而用之此其所以刺之也此說甚善夫碩德之人心廣體胖其生色也睟然見於面盎於背施於四體四體不言而喻今也居日中易見之時在前列易察之地而衛君猶不見察况在側微之間而望君之見察乎蓋好賢之主雖賢者隱於側㣲之中而必欲知之如髙宗之於傳說初無一日之素而髙宗用賢至意雖不見其狀貎猶且於夢中得之苟棄才之主雖賢者日接於前而莫知如唐明皇末安禄山竊發河北盡䧟獨顏真卿為平原堅守不下乃使司兵李平馳奏朝廷𤣥宗曰我不識眞卿何如人乃能如是然顔眞卿嘗為監察御史密邇天子之光久矣而𤣥宗乃不見察若𤣥宗者所謂棄才之主矣此碩人處於前列而衛君不見察亦猶是也有力如虎者言力可以禦難也賢者而稱其有力王氏云羔裘之詩曰羔裘豹飾孔武有力所謂有力者非賁育之謂若羔裘所稱此說是也春秋襄十年狄虒彌魯人也建大車之輪而䝉之以甲以為櫓左執之右拔㦸以成一隊孟獻子曰詩所謂有力如虎者也蓋古人多於斷章取義不當拘此詩之言蓋言其賢人才力如此非謂猛暴如虎者也若闞如虓虎亦言其力也豈是果若虎乎如股肱之寄在忠力是乃此詩所謂力也蓋非如所謂羿善射奡盪舟之力尚力而不尚德也此章言執轡如組者王氏云此言藝也程氏亦以謂藝也蘇氏之說尤為明白其說曰組者織組也織組者緫織於此而成文於彼蓋御者執轡於上而馬調於下如織組也言有力而善御者可以禦侮也而使之執籥秉翟二說皆通蓋言衛之賢者多材多藝無用不可而乃使之執籥秉翟籥者周禮籥師掌教國樂郭璞曰籥如笛三孔而短小是也鄭氏謂碩人多材多藝又能籥舞言文武道備而歐陽以為不然左手執籥非賢者之所宜也豈可以為能哉矧能籥舞豈是為文武之道偹此說是也赫如渥赭赫赤色也渥厚漬也言碩人容色如厚傅丹君徒錫其一爵而已爵散也乃所以待賤也程氏云必言其顔色之美以見其赭之容貎易見而不見知也此說是也山有榛隰有苓榛栗也苓大苦也爾雅以為甘草沈存中以為非亦未可知然也蓋言榛之在山苓之在隰皆得其所而碩人乃不得其所曾榛苓之不若也云誰之思鄭氏云我誰思乎思周室之賢者以其宜薦碩人與在王位蘇氏云賢者仕於諸侯而不得志則思愬之天子此說皆未盡詩人之意蓋言我思周之美人周在西也所以思者蓋美人宜為西方之人可在天朝而今乃失其所故序曰皆可以承事王者是故人君之用才當以不次用之伊尹一耕夫耳成湯用之以為相傅説一胥靡耳髙宗用之以為輔是皆王佐之才用之小任之輕則不足以稱其才也今也有王佐之才不得仕於王朝而反事於衛國已為失所矣况又為伶官乎孔子嘗為乘田矣曰牛羊茁壯長而已矣嘗為委吏矣曰㑹計當而已矣夫孔子以聖人之才足以當伊尹傅說之任其不遇如此以是知春秋之時賢士不遇可勝歎哉黄曰自黄帝使伶倫氏取竹斷兩節間而吹之為黄鍾之管周景王鑄無射問於伶州鳩故後世呼樂官為伶官此卑賤之職而衛乃以賢者為之晉戴逵破其琴曰吾不為王伶人蓋惡其職之賤也日之方中易見之時在前上處易察之地而衛君猶不見察况側㣲之間乎公羊曰籥者何文舞也萬者何武舞也則萬舞指干舞而言之有力如虎正猶言股肱之寄在忠力其足以衛國家也執轡如組言其進退有法足以御衆也有賢如此而乃使執籥秉翟猶君子陽陽之詩言左執簧右招我由房也赫如渥赭猶言顔如渥丹其君也哉見其容貎之温粹有賢如此而公但言賜之以飲爵而已西方美人蓋言如此賢者當在王朝以為王者之佐如序所言皆可以承事王者也嗚呼為衛之賢者何不去乎曰為乗田為委吏不害為孔子而後世之責當有所歸也賢者又何嫌焉周之士也貴秦之士也賤貴賤在周秦而不在士賢者之仕伶官非特為賢之耻而實衛之耻泉水衛女思歸也嫁于諸侯父母終思歸寧而不得故作是詩以自見也毖卑位反彼泉水亦流于淇有懷于衛靡日不思孌力轉反彼諸姬聊與之謀出宿于泲子禮反飲餞音賤于禰乃禮反女子有行逺于萬反父母兄弟問我諸姑遂及伯姊出宿于干飲餞于言載脂載牽胡瞎反還車言邁遄市専反臻于衛不瑕有害我思肥泉茲之永歎思須與漕我心悠悠駕言出逰以寫我憂李曰古者諸侯女嫁於敵國父母在則有歸寧之禮父母終則使大夫歸寧其兄弟所以逺嫌也今衛女嫁於諸侯父母終思歸寧而不得蓋知其非禮遂輟而不行是能以禮自克故詩人取之毖彼泉水毛氏曰泉水始出毖然流也而說文則又言毖字從水從必然治經者不欲輕改其字以從己説且從毛氏之說淇水名也淇衛地水出衛州共城縣北山東至黎陽入河言泉亦流至淇而我獨不得歸反泉水之不若也懷念也言我有念於衛無一日不思也孌彼諸姬聊與之謀孌婉也諸姬同姓之女我思於衛欲略與之謀婦人之禮觀其志意親親之恩也出宿于泲鄭氏云泲禰者所嫁國適衛之道所經故思宿餞而王氏又謂出泲禰蓋父母之國地名干與言嫁之國也四地皆無所經據然始嫁時别於此而之夫家猶可說也下文女子有行逺父母兄弟殊不相屬不若且從毛鄭之說言婦女思歸適衛所由之道以父母没不得歸故言女子生而有適人之道逺於父母兄弟之親故禮緣人情使得歸寧也問我諸姑遂及伯姊言欲歸徧問於諸姑而及伯姊也出宿于干此亦思歸我將出宿亦是所由之道非實出此蓋擬議而後言之也載脂載牽脂膏也車不駕則脱其牽言我脂牽其車而歸衛遄疾也言欲疾至於衛非有瑕疵也而何為不可也害何也害與害澣害否之意同我思肥泉鄭氏云自衛而來所渡水故思此而長歎亦如下文思須與漕也須漕二邑衛在須邶在漕思則悠長也此但是思衛之事自毖彼泉水至於我心悠悠可謂思之切矣終能以禮自克故但出遊以寫我憂也雖欲思歸而終不得其意與竹竿同也夫女子父母在則歸寧父母終則使大夫歸寧禮也今父母終不得歸寧則眷眷而懐之人情之所不免也然終不歸者禮當然也禮者天下之大防示禍之所由生殆猶防水之至人而知禮一舉足不敢妄動故歸寧父母雖未有害而禮不敢徃也故泉水載馳之詩聖人皆著於經以示後世也苟為不顧禮法如隄防一决則瀰漫無所不至而不能救如齊之文姜是也桓公十八年書夫人姜氏遂如齊莊元年又書夫人姜氏遜於齊二年又㑹齊侯于禚四年又享齊侯于祝丘五年又如齊師七年又㑹齊侯于防穀其無所忌憚故聖人於春秋一一而譏之知春秋之書文姜則知泉水之美衛女黄曰泉水非衛國之詩也而亦列之於衛蓋其所思者衛國所歌者衛音所言者衛地則列之於衞風宜也泉水尚流而至於淇已不得復歸於衛故因以起興出宿于泲飲餞于禰至于干于言皆非果有是也但思之之辭思而不可得則亦悠悠而永歎出遊以忘懐而已夫父母既沒於禮不可歸泉水之女可謂思而止於禮者也苟為不顧禮法如齊之文姜則不容於詩不數於春秋矣毛詩集觧卷五
