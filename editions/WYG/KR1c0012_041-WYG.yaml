body:
  text: 毛詩集解卷四十一宋李樗黄櫄撰閟筆位反宫頌僖公能復周公之宇也閟宫有侐況域反實實枚枚赫赫姜嫄音元其德不回上帝是依無災無害彌月不遲是生后稷降之百福黍稷重直容反穋音六稙徹力反稺菽麥奄有下國俾民稼穡有稷有黍有稻有秬奄有下土纉禹之緒后稷之孫實維大王居岐之陽實始翦子踐反商至于文武纉大王之緒致天之屇音戒于牧之野無貳無虞上帝臨女敦古回反商之旅克咸厥功王曰叔父建爾元子俾侯于魯大啟爾宇為周室輔乃命魯公俾侯于東錫之山川土田附庸周公之孫荘公之子龍旂承祀六轡耳耳春秋匪解享祀不忒皇皇后帝皇祖后稷享以騂犧許宜反是饗是宜降福既多周公皇祖亦其福女秋而載嘗夏而楅衡白牡騂剛犧尊將將七羊反毛炰蒲包反胾側吏反羮籩豆大房萬舞洋洋孝孫有慶俾爾熾而昌俾爾夀而臧保彼東方魯邦是常不虧不崩不震不騰三夀作朋如岡如陵公車千乗成正反朱英緑縢徒登反二矛重弓直龍反公徒三萬貝胄直又反朱綅息炎反烝之升反徒増増戎狄是膺荆舒是懲則莫我敢承俾爾昌而熾尺志反俾爾夀而富黄髮台背夀胥與試俾爾昌而大俾爾耆而艾五蓋反萬有千歳眉夀無有害泰山巖巖魯邦所詹奄有龜蒙遂荒大東至于海邦淮夷來同莫不率從魯侯之功保有鳧繹音亦遂荒徐宅至于海邦淮夷蠻貃武伯反及彼南夷莫不率從莫敢不諾魯侯是若天錫公純嘏古雅反眉夀保魯居常與許復周公之宇魯侯燕喜令妻夀母宜大夫庶士邦國是有既多受祉黄髮兒齒徂徠之松新甫之柏是斷音短是度待洛反是尋是尺松桷音角有舄音錫路寢孔碩新廟奕奕音亦奚斯所作孔曼音萬且碩萬民是若李曰閟宫頌僖公能復周公之宇也魯頌四詩惟閟宫獨為可疑如駉之詩言牧馬之事有駜之詩言君臣宴飲泮水言其修泮宫服淮夷雖其事僖公未能盡之然所襃之事猶為可襃也至於閟宫之詩則所襃者非可襃之事也毁譽失真莫此為甚且如閟宫之詩言祀姜嫄后稷至於文武大王與夫郊天之祭魯以諸侯之國而祀姜嫄后稷周之先王不可也郊天之祭亦不可也此詩人乃盛稱祭廟與郊天之祭以示誇耀不亦過乎此詩序美僖公能復周公之宇也亦不可信詩序徒見詩中言居常與許復周公之宇故附㑹以為復周公之宇殊不知詩人所言乃祝頌之辭也如曰天錫公純嘏眉夀保魯與夫萬有千歳眉夀無有害皆是祝頌之辭若以萬有千歳眉夀蕪有害果為非祝頌之辭則是僖公果有萬有千歳乎故此序言復周公之宇亦為可疑也閟宫毛氏以為閟閉也鄭氏以為閟神也雖有詁訓不同或以為姜嫄之廟或以為周之廟非魯之廟也果為周廟何為頌僖公乎觀此詩言閟宫遂歴言姜嫄后稷文武大王之事其後遂言新廟奕奕則所謂閟宫乃魯之廟也閟宫有侐侐清淨也實實廣大也枚枚礱密也閟宫如此其所祭者則姜嫄之類也故先述姜嫄之徳言赫赫然顯著之姜嫄其徳則正而不邪依賴上帝故生后稷而無有災害也無災無害即生民所謂不坼不副也滿十月而不為遲晚彌月不遲即生民所謂誕彌厥月是也是生后稷則天降之福其后稷教民稼穡則有黍也稷也先種後熟曰重後種先熟曰穋先種之稙後種之穉及大豆與麥凡所種所奄之地使民因此而為稼穡也以此數種教民稼穡則有黍有稷有稻有秬奄有下土遂可繼禹之功焉當是時也洪水汜濫禹治洪水后稷教民稼穡此云纉禹之緒者蓋非禹之治洪水則雖后稷教民何自而施其功非后稷教民稼穡則雖禹治水民何自而食哉惟其禹施功於前后稷施功於後故此言纉禹之緒也蓋禹之治水后稷之教民稼穡其事雖不同其實相終始亦如契敷五教臯陶明刑其職固不同其實相為表裏也后稷之孫實維大王此遂言周家之興本於大王居岐山而翦商夫翦商在武王之時而乃以為大王者蓋大王肇基王迹王迹既係大王肇始則翦商亦自大王始也至文王武王繼大王之業是時商紂暴虐天欲誅之武王乃致天之意屇于牧之野無有貳心無有憂虞上帝臨視女必克勝也致天之屇言武王至于牧野乃天之所致也觀下文言上帝臨女則致天之屇可知也故能治商之師旅其功無有不咸也咸皆也言功無不成也自赫赫姜嫄至於纉禹之緒其言與生民之詩相類自后稷之孫至於克咸厥功其言與大明緜之詩相類然魯以諸侯之國乃祀姜嫄后稷大王文武之廟則僭天子之禮明甚禮記曰大夫不得僭諸侯諸侯不得僭天子則魯豈可立姜嫄之廟邪左氏宋祖帝乙鄭祖厲王宋二王之後祖帝乙猶可也鄭以諸侯而祖厲王可乎鄭立厲王之廟猶魯立姜嫄之廟也使鄭出於宣王之命則宣王為有罪也使魯出於成王之命則成王亦有罪也惟魯以諸侯之國而僭天子之禮如此故魯之三桓皆立桓公之廟蓋諸侯既立天子之廟則大夫亦立諸侯之廟出乎爾者反乎爾者也鄭氏注禮記但謂魯立文王廟以此詩觀之則非獨文王廟也至於姜嫄后稷大王之廟魯皆立之其僭如此詩人乃以為美何邪王曰叔父叔父周公也元子伯禽也古者長子為元子如所謂殷王元子是也成王告周公立爾元子使侯歸於魯國大啟其疆土為周家藩衛翰屏之臣成王封伯禽於魯其餘則凡蔣邢茅胙祭焉既以此告周公矣遂命伯禽侯于東方既錫之以山川又錫之以附庸蓋錫之厚也附庸者不能五十里者謂之附庸以附屬於諸侯使諸侯統之也論語曰顓㬰昔者先王以為東蒙主是社稷之臣顓㬰亦魯之附庸也春秋之時有邾國亦魯之附庸也鄭氏謂封以七百里欲其強於衆國鄭氏之說據明堂位以為說明堂位曰成王以周公為有勲勞於天下是以封周公於曲阜地方七百里竊嘗疑其說以為不然周公之封於魯為方百里地非不足也而儉於百里太公封於齊亦為方百里地非不足也而儉於百里則是魯之方百里也安在其為七百里邪詩人言大啟爾宇不過謂公侯方百里伯七十里子男五十里其三等雖不同惟公侯皆方百里居上等焉詩人之言非謂方七百里而言也或者謂并附庸之國而言之則未可知也周公之孫莊公之子謂僖公也言僖公以交龍為旂而承其祭祀其所乗之馬則六轡耳耳然而至盛其春秋之祭祀未嘗懈怠言四時祭祀無不致其敬謹故享祀無有差忒皇皇后帝此言祭天也皇大也皇皇大之至也皇祖后稷此又言后稷以配天也所謂郊祀后稷以配天是也其所享則用赤色之牛天亦享之宜之故其降福孔多也孔氏云魯不得徧祭五帝故直言謂天謂祭周所感生蒼帝也孔氏以帝稱謂感生帝此則泥六天之說禮記明堂位曰成王命魯祀周公以天子之禮樂是以魯君孟春乗大輅載弧韣旂十有二旒日月之章祀帝于郊配以后稷天子之禮也祭統亦曰昔者周公旦有勲勞於天下周公既没成王康王追念周公之所以勲勞者而欲尊魯故錫以重祭外祭則郊社是也内祭則大嘗禘是也明堂位祭統皆漢儒所作故其所言皆未可信也魯諸侯之國也豈可賜周公以天子之禮樂哉豈得行天子之郊祭哉禮運又曰魯之郊禘非禮也周公其衰矣禮記之書如禮運以謂魯不當祭禘如明堂位祭統以為魯當郊禘其異同如此當從禮運之說明堂位祭統之言不可信也伊川嘗謂說者以為周公能為人臣所不能為之功故得用人臣不得用之禮夫人臣豈有不能為之功哉使功業過於周公人臣亦當為之天下之事非人臣為之誰為之邪此言可謂中諸儒之病矣以此觀之則知賜魯之禮樂者非成王為之使成王為之則不足以為成王也春秋書郊多矣大抵譏其僭春秋以為僭而詩乃以為美則知所美非美也漢末羣臣坐視社稷之亡不以為恤乃作受禪碑紀其姓名以為榮耀與此詩所陳以僭侈為美何異左氏曰皇皇后帝皇祖后稷君子曰禮謂先帝而后稷也夫先天而后稷固足以為禮然不知諸侯而用郊禘果足以為禮乎所謂不能三年之喪而緦小功之察放飯流歠而問無齒決也然詩人所言者僖公未必能如是僖公四月四卜郊不從乃免牲夫以四月之時而卜郊足以見非禮也卜至於四尤以見其非禮安在其為春秋匪解也哉安在其為享祀不忒也哉詩人之言大抵失之誇也周公皇祖此又言祭宗廟也上言皇皇后帝皇祖后稷則是天與后稷以福之矣又言周公皇祖亦其福女以見其福之多也秋而載嘗言秋將祭則夏而楅衡以見其預備也周禮封人凡祭祀飾其牛牲設其楅衡注云楅設於角衡設於鼻說文曰楅木有所逼束防牛觸横大木其角則是楅設其角未嘗加於鼻也與周禮注不同楅衡毛氏與說文同毛氏以為楅衡設牛角以楅之也當且從毛氏說白牡騂剛公羊傳曰魯祭周公何以為牲周公用白牡魯公用騂剛羣公不毛蓋魯之後世欲别周公之有勲勞故為此紛紛之别也犧尊之字春官司尊􅂜作獻尊鄭司農云獻讀為犧犧尊飾以翡翠王肅云大和中魯郡於地中得齊大夫子尾送女器有犧尊以犧牛為尊一則以為飾以翡翠一則以為犧牛為尊其說不同然鄭司農之說則以犧讀為娑字王肅之說但以為犧尊王肅之議為優將將盛美也毛炰者周禮封人祭祀有毛炰之豚注云爓去其毛而炰之也胾謂切肉羮謂大羮鉶羮也大羮煮肉汁不和貴其質也鉶羮肉汁之有菜和者鉶其所盛之器籩則以竹為之豆則以木為之房謂足下跗也上下兩間有似於堂房然是俎之房也既備此器以祀周公又設萬舞洋洋然而衆多明堂位所謂朱干玉戚冕而舞大武也故孝孫得享其福祭祀既得其時犧牲既潔器用既備禮儀無忒故神降之福俾爾熾而昌俾爾夀而臧俾爾熾盛而昌大俾爾長夀而臧善安彼東方之國俾使魯邦常如山之堅固不虧損不崩落如川之安静不震動不騰湧為君既享如此之福又有三卿作朋友亦享其福如岡如陵以見其君臣並受其福如此之盛也所謂不虧不崩不震不騰未必常如此三夀作朋未必其臣如此蓋自不虧不崩至如岡如陵皆是祝頌之辭國人之祝其君皆願其君之夀考如言萬夀無疆未必其享無疆之夀也如言天子萬年未必享萬年之夀也蓋所謂萬夀無疆天子萬年皆是祝頌之辭未必其有是夀而祝之以為如此固未為害若君無徳而溢美之如此頌之所陳者不當如此也上章既美其祭祀此又美其用兵也公車有千乗之富兵車之法左人持弓右人持矛弓矛之飾則有朱英緑縢朱英者矛之飾也緑縢者弓之飾也朱英則言以朱為飾緑縢則言以緑為飾而以縢繩之弓矛之飾如此又有二矛重弓所以備折壊也凡此皆言器械之備也器械既備而公徒之衆又至於三萬皆以貝飾其胄其甲以朱繩綴之烝者進也衆之進則增增然而多凡此皆言其強也惟其器械之備車徒之衆則可以當戎狄而荆舒之國莫不懲艾無有敢乗我者以此見魯之強大也明堂位曰封周公於曲阜地方七百里革車千乗地方七百里固不可信至革車千乗則大國之制實當然也然按司馬法六尺為歩歩百為畝畝百為夫夫三為屋屋三為井井十為通通十為成成出革車一乗則千乗其地方三百一十六里有竒若以孟子所言周公封於魯地方百里則無縁有千乗也若以明堂位所言封周公於曲阜地方七百里則又不啻有千乗司馬法之言既不合於孟子又不合於禮記不足信也當從包氏注論語以謂古者井田方里為井一井為乗百里之國通有千乗也惟百里之國通有千乗則魯地方百里當有車千乗矣雖然千乗之國有七萬五千人古者兵車一乗甲士三人歩卒七十二人故計千乘有七萬五千人今也公車千乘而公徒三萬者蘇氏曰大國之賦適滿千乗茍盡用之是舉國而行也故其用之也大國三軍次國二軍而已此說是也天子之國不啻有六軍所用者惟三萬而已使舉國之人而盡用之則但可以一役苟不幸而敗則安得人人而復用之哉此天子之國所以止用六軍大國所以止用三軍也以春秋考之則僖公無三軍襄十一年經書作三軍明已前無三軍故也昭五年又書舍中軍若僖公有三軍則作之當書也自文至襄復減為二則舍亦當書也考僖公之世無作舍之文決知當時無三軍也蘇氏遂以僖公之時已有三軍蓋萬二千五百人為軍二軍則有二萬五千人而但言三萬者舉大數也此說不然萬二千五百人為軍大國三軍合三萬七千五百人但言三萬者數之成也若夫襄公作三軍則又不如此魯自僖公以前固有三軍也自伯禽以來已有三軍僖公興其國所以公徒三萬觀詩曰大啟爾宇既謂之大啟爾宇此安得無三軍邪伯禽以來已有三軍襄公所以作三軍者則以魯國三卿專魯國之權分三軍以為已之賦故作三軍非是自襄公以來方有三軍也鄭氏孔氏言戎狄是膺荆舒是懲其說亦不然鄭氏曰僖公與齊桓公舉義兵北當戎狄南艾荆及羣舒天下無敢禦之孔氏遂以為僖公之時齊桓為覇故知桓公舉義兵僖公之世用兵於戎狄荆舒者惟有僖公耳公㑹諸侯侵蔡蔡潰遂伐楚楚一名荆舒又是楚之與國故連言荆舒其伐戎狄則無文惟十年經書齊侯許男伐北戎其時蓋魯使人助之其說皆非也魯僖征伐見於春秋者惟敗莒耳滅項耳伐邾耳其齊侯許男伐北戎僖公不與焉孔氏以為魯使人助之是増春秋之所無也至於伐楚盟于召陵此則齊桓公之功齊桓公之功而魯以為功是貪他人之功以為已有豈其然乎詩人之言但云僖公可以膺戎狄懲荆舒如其不然則其言妄𤼵之也正如泮水之詩美僖公能服淮夷皆無是事而美之則膺戎狄而懲荆舒未必不如其服淮夷也此下文言羣臣祝頌之辭俾爾昌大而熾盛俾爾長夀而且富也其髮黄色之髪其背有台文之背祝其君之夀矣又欲得其臣之有夀考者相與講試其才力上文祝之以俾爾昌而熾俾爾夀而富又祝之曰俾爾昌盛而且大俾爾夀而艾八十九十曰耆艾非獨享耆艾也且至於萬有千歳秀眉而夀無有患害此皆祝之之辭也上文言三夀作朋又曰夀胥與試既曰俾爾熾而昌俾爾夀而臧又曰俾爾昌而熾俾爾夀而富俾爾昌而大俾爾耆而艾其辭如是之重復者蓋祝之之辭不得不如是夫天保之詩言福禄曰以莫不増以莫不興以莫不庶其辭亦如此之重復者蓋祝頌之辭其例如此也泰山巖巖言泰山巖巖而髙也自此又言拓地之廣也泰山之髙魯邦乃至其地泰山魯之望也禹貢海岱及淮惟徐州徐州之地泰山乃其境焉禮器曰齊人將有事於泰山必先有事於配林是齊人亦祭泰山也鄭康成注禮記曰魯祭泰山晉祭河則魯亦祭泰山也泰山廣大故齊魯之境皆得祭之也龜蒙二山也觀春秋所書齊人來歸鄆讙龜隂之田則龜者魯地也論語曰昔者先王以為東蒙主則蒙者亦魯地也故奄二山遂荒有而大其地至於大東東之極東海近海之邦也以至於淮夷之國皆來同盟而莫不率從於魯此乃魯侯之功也非獨此也又保有鳧繹之二山禹貢徐州嶧陽孤桐此繹即禹貢之所謂嶧陽也既保有此二山遂荒有徐方之居至於海邦之國與夫淮夷蠻貃及彼南方之夷無敢不率從於魯莫敢不應諾於魯惟魯侯之意是順也泰山巖巖魯邦所詹則魯之地因是至於泰山矣奄有龜蒙保有鳧繹則魯之地因是保有四山矣淮夷來同莫不率從僖公果能至是邪淮夷蠻貃及彼南夷莫不率從僖公果能至是邪孔氏之說則以謂僖公之世東方淮夷小國見於盟㑹惟邾莒滕杞而已其餘小國及淮夷同盟不見於經蓋主㑹者不列之耳其於淮夷蠻貃及彼南夷莫不率從則曰僖公從齊桓伐楚而服之故言淮夷此皆附㑹其說正所謂癡人前說夢是也以僖公之事考之十五年楚人伐徐師于婁林則是徐為楚所服豈徐為僖公所服乎十六年公㑹齊侯宋公陳侯衛侯鄭伯許男邢侯曹伯于淮㑹于淮乃齊桓公救鄭也非是淮夷從僖公也凡此考之經傳皆無是事則詩之所稱良可知也此下文又祝君以夀考也天錫僖公以大福矣又使有秀眉之夀以保有魯國居常與許復周公之宇常許必是二邑為鄰所侵故僖公從而興復之也左氏載鄭伯以璧假許田則許田本屬魯國也常者說者謂六國時齊有孟嘗君食邑於薛疑本是魯邑也復周公之宇而魯侯乃宴飲於内則令善其妻夀其母以至於大夫庶士無有不得其宜故能使邦國保而有之而受此多福且至於黃髮兒齒兒齒言夀徵也夫祝其君既享眉夀矣而又内而善其妻夀其母外而庶士大夫無不得其宜故其祝君可謂至矣盡矣不可復加矣自此又言既享眉夀於是復修新廟也其修新廟則有徂徠之松新甫之柏於是斷斬之度量之其量之也有八尺之尋十寸之尺既量其材乃用松為桷有舄然而大作為君之正寢而且碩大新廟則又奕奕然而壯新廟或以為姜嫄之廟或以為閔公之廟然則所謂新廟者不必專指其人但言修其舊廟而作之也奚斯公子魚也閔二年慶父出奔莒左傳曰以賂求共仲於莒莒人歸之及密使公子魚請不許哭而往共仲曰奚斯之聲也乃縊是奚斯乃公子魚也觀奚斯作者監䕶其功也其新廟之成甚長而且大萬民是若蓋言僖公之修泮水新廟不徇於意其順斯民之意也文公之時大室壞伯禽之大廟而至於屋壞足以見文公之不能盡孝道也今僖公之修新廟至於孔曼且碩以見僖公之孝也然觀是詩大抵其辭夸王氏曰周頌之辭約約所以為嚴所美盛徳故也魯頌之辭侈侈所以為誇徳不足故也此說盡之矣夫魯頌所以為誇蓋其所謂誇者不以其事所當誇而誇之也自古人君常患徳之不足不患名之不揚使無其徳而求其名則雖為美辭以誇示天下天下後世其誰信之乎如秦始皇刻石為頌以彰徳意其辭甚美有曰功蓋五帝澤及牛馬始皇之功果可以蓋五帝乎始皇之徳果可以及牛馬乎不過誇為此辭以榮耀後世而後世誰以始皇之功為蓋五帝而誰以始皇之澤為及牛馬也則是自欺其心也天下後世其可欺乎黄曰先儒於此詩皆不能無疑而予獨於此詩見魯人之所以愛僖公而尊之者何其切且至也歐陽公疑之故闕之陳少南疑之故去之李迃仲疑之故辨之此數公不可謂不深於詩而不能無疑者不以詩論詩而以春秋論詩是以其心不能以自安也夫詩者所以曲盡人情而已故春秋多責備之辭而詩人有祈望之意事之未然者皆人情愛之而願其如是也不明乎人之情而與之言詩必有泥而不通者矣且以春秋考之僖公在位三十三年其伐邾者四敗莒滅項者一此魯之自用兵也其四年伐楚侵陳六年伐鄭是時齊桓公方稱伯主兵率諸侯之師而魯亦與焉春秋所記凡魯之自主兵者皆莒邾項之小國至其所伐大國皆齊晉主兵則膺戎狄懲荆舒奄龜蒙荒大東荒徐宅至于海邦淮夷蠻貃及彼南夷莫不率從在僖公果有是乎無是事而詩人言之則為誣不合於春秋而孔子取之又何其去取之自戾也吁以春秋而論詩豈我夫子之意哉夫子之意蓋曰僖公之得民心如此魯人之愛僖公如此則雖未有是事而詩人言之亦人情之所願欲也公人情之所願欲則夫子安得而不取凡人情之所在愛之之深者惟恐其尊之未至而尊之至者惟恐其言之不大愚觀此詩而嘆魯人之所以愛僖公而尊之者何如此其不能自己也其一章則推原乎乃祖始生之祥𤼵明乎後葉成功之本謂后稷出於姜嫄文武之功起於后稷故自武王文王大王推而上之至於后稷又自后稷推而上之至於姜嫄以見周之所以興者其積累如此之逺也夫頌魯而言周者何也魯周同姓之國而僖公乃周公之孫也故其次章言周公有大功於王室而成王封伯禽於魯錫之以山川土田附庸以崇徳報功親親尊賢也惟周公之徳不可忘而其子孫蕃衍盛大又有如僖公之賢侯者嗣之故其次章又言僖公儉而處已而致孝乎鬼神其奉祭祀無所不盡其得人心無所不至故詩人願之曰俾爾熾而昌夀而富俾爾昌而大耆而艾皆愛之不能已故言之不能盡既曰三夀作朋如岡如陵又曰萬有千歳眉夀無有害又曰天錫公純嘏眉夀保魯言有盡而意無窮一倡而三嘆之以見魯人之所以愛僖公而尊之者如此其切且至也雖然詩人之意猶以為未足故又祈之以居常與許復周公之宇而盛言其威徳之所加土地之所闢此皆願之辭而欲其如是也孔子曰道千乗之國節用而愛人使民以時僖公之治魯其㡬是乎大學曰道盛徳至善民弗能忘也魯人之尊僖公其謂是乎黄曰商頌與夫小雅國風中數篇皆先儒講說詳且明矣茲不重復學者當以意逆之那詁訓𫝊第三十商頌那祀成湯也微子至于戴公其間禮樂廢壞有正考甫者得商頌十二篇於周之大師以那為首猗音伊與那與置我鞉鼓奏鼓簡簡衎我烈祖湯孫奏假音格綏我思成鞉鼓淵淵嘒嘒管聲既和且平依我磬聲於赫湯孫穆穆厥聲庸鼓有斁音亦萬舞有奕我有嘉客亦不夷懌自古在昔先民有作温恭朝夕執事有恪顧予烝嘗湯孫之將李曰那祀成湯也微子為商之後故商之禮樂皆存於宋至於七世傳之戴公其間禮樂廢壊亦非戴公之罪自戴公而上微子而下其所由來者漸矣有正考甫者得商頌之十二篇於周之大師宋之禮樂雖為廢壞然正考甫得商頌於周之大師是商之禮樂雖失之於宋而得之於周也孔氏曰周用六代之樂樂章固當有之故得有商頌也此說是也然商頌十二篇得之於周大師而今之商頌乃五篇者則是刪詩時又已亡其七篇矣孔子嘗曰夏禮吾能言之杞不足徵也商禮吾能言之宋不足徵也文獻不足故也足則吾能徵之矣以商頌觀之非獨禮不足徵樂亦不足徵矣以本國之詩乃存之於魯豈非樂不足徵乎宋之國有用天子之禮樂者宋天子之後故得用天子之禮樂宋用之可也魯用之則非也襄公十年宋公享晉侯於楚丘請以桑林荀罃辭荀偃士匄曰諸侯宋魯於是觀禮魯有禘樂賔祭用之宋以桑林享君不亦可乎舞師題以旌夏則是以宋與魯皆當用天子之禮樂竊嘗以其說為不然夫魯僭用天子之禮樂乃當時習熟所聞不知魯之不當用與宋不同也況宋之所謂商頌者自湯以來祭祀商之君而作非頌宋之君也以魯頌頌僖公之徳猶為不可豈可與宋並乎然宋與魯皆有頌而無變風鄭氏云宋王者之後也魯聖人之後也是以天子廵守不陳其詩蓋所以禮之也夫宋為王者之後有頌也魯聖人之後是不過為諸侯之國而已豈可與宋並哉宋魯之無變風是適然耳善乎蘇黄門之說曰周之盛時千八百國雖後世陵遲力强相吞而春秋所見猶百有七十餘國變風之作先於春秋數世矣而詩之載於大師者獨十三國其不見於詩者豈復皆有說哉意者列國不皆有詩其有詩者雖檜曹之小邶鄘衛之亡而有不能已其無詩者雖燕蔡之成國宋魯之禮樂而有不能作事有適然而無足疑者此實至當之論蘓黄門具論風雅之前後愚嘗以其說為失之鑿若此之類則不足疑也猗與那與毛氏以為嘆辭蘇氏以為美辭猗嗟之詩毛氏注云猗嘆辭也則是以為嘆辭漢武帝紀云猗與偉與注云猗美也則是以猗為美故蘇黄門以猗為美猗與那與那者多也嘆其功之多也美其功之多也二說皆無害言成湯功之多故奏此樂以享之也鄭氏以置為植言植我鞉鼓蓋以夏后氏足鼓殷人置鼓周人縣鼓成湯改夏之制植我殷家之樂歐陽以為但當言置不當言植也鼔之小者持其柄摇之旁耳還自擊則其鞉不在於植也鞉鼔非植而乃謂之植則其說不攻而自破矣鄭氏之說以為鞉鼔不植貫而摇之亦植之類此皆強為之說也其奏鼓則簡簡然而和樂我烈祖祖乃成湯也湯孫則以此樂而升薦之故烈祖安我思成之人禮記曰思其居處思其笑語思其志意思其所樂是也毛氏以烈祖為湯有功烈之祖則是以為契冥相土之屬觀此序言祀成湯所謂烈祖者但成湯耳不當以為契冥相土之屬也鄭氏雖以烈祖為成湯而以湯孫為太甲觀頌之言湯孫者多矣豈可專以為太甲哉歐陽曰太甲至紂皆是也但不知所斥者何人也蓋當時之王主祭後世不知其誰也既以樂奏而烈祖来享矣其奏鞉鼓則又淵淵而和簫管之聲則嘒嘒而細其聲皆和平不相奪倫又依我玉磬之聲玉磬即書所謂鳴球是也樂之備奏如此必由赫赫之湯孫能使樂聲之和也大鍾曰鏞鏞鼔則斁然而盛至於萬舞則又奕奕而閑有瞽之詩言設業設虡崇牙樹羽應田懸鼔鞉磬柷敔凡樂器之名未嘗再舉那之詩既言置我鞉鼔又言奏鼔簡簡又言鞉鼔淵淵又言庸鼔有斁蓋作詩者非一體此詩再三言樂之和故其言如此嘉客嘉賔也王者之後來助祭莫不和恱非獨此也乃自昔先王亦如此在昔先民亦如此莫不温恭其色朝夕匪懈其執事薦饌則又恪然而敬虞賔在位周之時我客戾止則是古者祭祀作樂必以賔客助祭為盛事也惟其如此故烈祖來顧我烝嘗之祭其所以享我如此者則以湯孫能將其祭祀也舜之作樂則自戛擊鳴球以下周之作樂則自設業設虡以下其樂器可謂多矣而那之詩樂器但止於此非商之時樂器不備也蓋言此數者則其他可知也故觀詩者以意逆志是為得之也毛詩集解卷四十一
