body:
  text: 毛詩集解卷三十五宋李樗黄櫄撰雲漢仍叔美宣王也宣王承厲王之烈内有撥亂之志遇烖而懼側身修行欲銷去之天下喜於王化復行百姓見憂故作是詩也倬彼雲漢昭囘于天王曰於乎何辜今之人天降喪亂饑饉薦臻靡神不舉靡愛斯牲圭璧既卒寕莫我聴旱既大甚藴隆蟲蟲不殄禋祀自郊徂宫上下奠瘞靡神不宗后稷不克上帝不臨秏斁下土寕丁我躬旱既大甚則不可推兢兢業業如霆如雷周餘黎民靡有孑遺昊天上帝則不我遺胡不相畏先祖于摧旱既大甚則不可沮赫赫炎炎云我無所大命近止靡瞻靡顧羣公先正則不我助父母先祖胡寕忍予旱既大甚滌滌山川旱魃為虐如惔如焚我心憚暑憂心如熏羣公先正則不我聞昊天上帝寕俾我遯旱既大甚黽勉畏去胡寕瘨我以旱憯不知其故祈年孔夙方社不莫昊天上帝則不我虞敬恭明神宜無悔怒旱既大甚散無友紀鞫哉庶正疚哉冢宰趣馬師氏膳夫左右靡人不周無不能止瞻卬昊天云如何里瞻卬昊天有嘒其星大夫君子昭假無贏大命近止無棄爾成何求為我以戾庶正瞻卬昊天曷惠其寕李曰此詩言宣王承厲王板蕩之餘而有撥亂之志遇旱烖如此而欲以修行而去之天下之民見其如此故喜於王化復行故作此詩以美宣王以見憂民之深也水旱之烖自庸君觀之則必以為天數之所不能免耳而已無與焉自賢君觀之則必以為負罪引慝自己致之且以成湯之世以六事而禱旱所謂六事者豈有是哉湯果無是而必引以自責非湯之過為謙遜也葢天烖之來而不以為己之致則非所謂畏天也所謂無所不用其至也如宣王之時焦勞甚矣而天烖如此是亦湯之遇旱也成湯無過者也而猶以過自責此其所以為成湯宣王之行修矣而猶以為未嘗修此其所以為宣王惟其修行則不患乎天之不悔禍也春秋之時宋大水魯侯弔焉曰孤實不敬天降之烖又以為君愛拜命之辱既而聞之曰公子御説之辭也臧孫逹曰是宜為君有恤民之心夫宋之所對者特數語耳而臧孫逹便知其有恤民之心况宣王憂民之心如此如之何而不中興乎但觀此詩則可以知宣王之必中興也倬彼雲漢天河也倬明也囘轉也言宣王遭旱遂夜視天而望雨乃見天河精光運轉未有雨徴乃曰今人何罪也今天降此喪亂而饑饉之烖又重重而至葢旱烖不已則饑饉必至矣宣王以遇旱之故無有神而不舉祭之也其所祭者未嘗愛其犧牲而祀神之圭璧今則盡矣曽莫之聽而旱猶自若也古者國有凶荒則索鬼神而祭之其祭之者非所以祈福也孔氏曰烖旱不熟必至於死人君為人之父母不可忽觀窮厄固當責己求天禱神罄忠誠之心為百姓請命聖人縁人之情而作為此禮非言祈禱必能止烖也徒以民命可矜不得不為之禱禱而無雨不得不訴於神耳此説是也後世遇烖固有祈禱而無應者葢徒禱於神而無惻怛之誠心也宣王遇烖而誠心惻怛於此可見此其所以可嘉也旱既大甚藴蘇氏曰結也隆盛也此章言旱之氣結而盛至於蟲蟲也説文曰蟲蟲旱氣也我之禋祀不絶郊以祭天宫以祭宗廟或上或下奠其禮瘞其物天地之神靡不宗敬之而后稷不能佑我上天不臨助我宣王為之言曰秏斁下土寕丁我躬言毁敗於下土寕使我身當之也若宣王此言可謂仁人之言矣宋之時熒惑守心景公憂之司馬子韋曰可移於相景公曰相吾之股肱可移於民公曰君者恃民曰可移於嵗公曰嵗饑民困吾誰為君景公之愛民可謂切矣不肯以其烖移於民而獨以身當之薄於己而厚於民宣王之心何以異此宋朝仁宗皇帝大旱欲降詔楊察進草仁宗曰未合朕畏天之意乃更其辭曰朕不敏於徳不明於政俾茲祥眚下逮黎庶與其降疾於人孰若移災於朕是亦雲漢之意也旱既大甚推而不去也宣王兢兢業業而如雷如霆葢雷霆之震而人必畏懼此人之常情也易曰洊雷震君子以恐懼修省亦如聞雷霆之時也周餘黎民靡有孑遺言周餘黎民靡有孑遺矣豈周無遺民哉宣王之恐民失其所故以為周餘黎民靡有孑遺亦如民未嘗傷也文王視之常如傷以見愛民之甚也民無孑遺則上天不我遺乎葢無民則無君矣何不相畏先祖之業至此摧敗矣毛氏以摧為至其説為迂鄭氏以摧當作催鄭氏好改字不可從也旱既大甚則不可沮旱之既不可止又且炎熱於我無所逃天命不逺無有瞻顧之者羣公先正之長官則不我相助也父母先祖則安然忍為此哉宣王遇旱告於上天又告於父母先祖又告於百官以見情之切念之深也滌滌蘇氏以為山川草木皆盡如滌去也此説是也旱魃旱神也旱神之為虐草木之焦枯如火之惔燒如火之焚燎我心之憂暑如為火所熏灼於身焉羣公先正之長官則不我聞亦上文之意昊天上帝寕使我避位而去也不敢有其身又不敢居其位以見畏天之至也五代唐明宗之時天下紛亂嘗謂天不早生聖人明宗願天生聖人宣王欲避其位皆其恐懼之甚也旱既大甚黽勉畏去蘇氏以謂始以旱故欲遯去既又以棄位非人主之義非也黽勉謂勞苦也言我盡其勞苦而畏去天猶病我以旱曽不知其故何也我之祈年甚早矣祭社稷又不晚矣上天曽不度我心也言我之於神明無不恭敬之宜其神無悔怒也今也神猶悔怒其故何哉旱既大甚散無友紀王氏謂人道相友則吉凶弔慶有紀以合之旱大甚且久財不足以為禮則無友紀而人散矣此説是也庶官之長於此乎窮也冢宰之職於此乎病也趣馬師氏膳夫左右凡百官無不盡其勤勞當此旱之時以見宣王之朝為百官者勤於職事皆以旱為憂也靡人不周未嘗以不能之故而不敬也瞻卬上天於我何居哉十月之交曰皇父卿士畨維司徒家伯維宰仲允膳夫棸子内史蹶維趣馬楀維師氏言其天變如此而羣臣皆莫以為憂非獨幽王也今宣王之時鞫哉庶正疚哉冢宰趣馬師氏膳夫左右靡人不周無不能止則知是時羣臣皆有憂旱之心非獨宣王為然也瞻卬昊天有嘒其星言宣王之視天則惟見嘒然之衆星也亦猶所謂倬彼雲漢昭囘于天也大夫君子昭假無贏自此以下又是勉羣臣也昭明也假至也汝百官既明其至誠之意無有餘矣我之大命不逺但為爾惜無棄其成功爾之百官何必以為我乎但能正其庶官則可矣戾定也百官既勤職事則衆官之長可定也瞻卬昊天何時惠我安寕乎自漢以來人君凡遇天之災異則必歸咎於臣下今宣王遇旱惟歸過於己其視漢之君相去逺矣詳觀此一詩如親聞宣王自責之辭而作詩者可謂能發明宣王之意黄日嘗論之矣不可掩者一人之誠意不可欺者天下之民心此意一誠雖紀綱未及振法度未及修内難未及熄外患未及平天下之民已若躋登於熈然之境宣王承厲王之烈民勞諸詩既作天下被亂極矣望治之情不啻飢之念食渇之念飲也宣王踐祚未見其有大設施以慰民望而天下喜治之情已決於遇災之日何宣王先得此於民心而民心信宣王之決哉葢内志既立其誠心實意隨遇而顯所謂遇災修行者固非飾非干譽奉行故事者比也觀其祀神禱旱罪已矜民救荒薄奉雖後世人君所未嘗無而其誠意有出於形迹之外者非可以事為論也茲天下所以喜其王化復行而仍叔所以美之也不然移民移粟非不勤也而民不加多是誠可見天下之不可欺矣崧髙尹吉甫美宣王也天下復平能建國親諸侯襃賞申伯焉崧髙維嶽駿極于天維嶽降神生甫及申維申及甫維周之翰四國于蕃四方于宣亹亹申伯王纘之事于邑于謝南國是式王命召伯定申伯之宅登是南邦世執其功王命申伯式是南邦因是謝人以作爾庸王命召伯徹申伯土田王命傅御遷其私人申伯之功召伯是營有俶其城寝廟既成既成藐藐王錫申伯四牡蹻蹻鉤膺濯濯王遣申伯路車乗馬我圖爾居莫如南土錫爾介圭以作爾寶徃近王舅南土是保申伯信邁王餞于郿申伯還南謝于誠歸王命召伯徹申伯土疆以峙其粻式遄其行申伯畨畨既入于謝徒御嘽嘽周邦咸喜戎有良翰不顯申伯王之元舅文武是憲申伯之徳柔惠且直揉此萬邦聞于四國吉甫作誦其詩孔碩其風肆好以贈申伯李曰尹吉甫即六月之詩所謂文武吉甫萬邦為憲是也楊子雲曰正考甫嘗睎尹吉甫矣公子奚斯嘗睎正考甫矣公子奚斯之所以睎正考甫者以得商頌十二篇也正考甫所以睎尹吉甫者以其作崧髙烝民韓奕之詩也烝民之詩曰天生烝民有物有則民之秉􅂜好是懿徳孔子曰為此詩者其知道乎尹吉甫者可謂知道矣烝民之詩四句孔子便以為知道則此三篇之文學者不可不念也崧髙之詩言宣王復興文武之業故天下復平遂建國親諸侯所以襃賞申伯之功也王氏曰王命召伯定申伯之宅徹其土田營其城邑寝廟及申伯入謝則周邦咸喜戎有良翰此之謂能建國王命傅御遷其私人錫之以四牡蹻蹻鉤膺濯濯遣之以路車乗馬告之以我圖爾居莫如南土又錫之以介圭以作爾寶又餞于郿且命召伯以峙其粻以遄其行此之謂能親諸侯易曰地上有水比先王以建萬國親諸侯葢既立萬國又在乎有以親之今宣王能建國親諸侯以襃賞申伯之功此崧髙所以美之也崧髙維嶽毛氏以崧為髙貌山大而髙曰崧嶽四嶽也東曰岱山南曰衡山西曰華山北曰恒山毛氏以為髙貌山大而髙曰崧者葢據爾雅之説也郭璞注爾雅曰今中嶽崧髙山葢依此名是也釋者又曰泰山為東嶽華山為西嶽衡山為南嶽恒山為北嶽崧髙為中嶽則是又以崧髙為中嶽之山許慎説文又以為崧與從山從髙之字通用豈詩所謂崧髙者但指中嶽乎曰非也其文曰山大而髙曰崧則知是凡大而髙者皆可名之曰崧非専指中嶽也後世以崧髙為中嶽者但見詩中有此文遂指以為中嶽觀此詩所言申甫之事則是申甫乃四嶽之後也既是四嶽之後安得専指為中嶽邪郭璞注云今中嶽崧髙山葢依此名其意可見帝堯之時姜氏掌四嶽之祀率諸侯之職維稱神靈之意故嶽神佑而生甫及申按史記言太公望其先祖掌四嶽佐禹有功虞夏之際或封於吕或封之申周語曰齊許申吕皆姜姓也至於甫侯即穆王時訓夏贖刑者是也葢共出於四嶽之後故連言之言崧髙之山其大極矣在穆王之時則生甫侯在宣王時則生申伯是二人者皆為周室之屏翰四國則皆頼之為蕃衛四方又頼之以宣布恩澤王氏曰蕃言扞蔽宣言敷播扞蔽則宜有界域故言四國敷播則宜無此疆彼界故言四方皆强生分别也亹亹申伯亹亹勉也言申伯勉勉而王纘繼之以事則知申伯之賢也北門之大夫曰王事適我政事一埤益我是亦王纘之事也然北門大夫之勤勞不免終窶且貧則衛之不知其賢也今申伯之亹亹王纘之以事則是既知其賢而又于邑于謝此所以為襃賞申伯也言此改邑于謝地而為南方之法式鄭氏曰改大其邑使為侯伯意或然也按史記周本紀云申侯與西戎共攻幽王則是申者乃侯爵也以其為方伯故謂申伯亦猶召公稱公而謂之召伯者以其為方伯也申伯既舊有申國矣復邑于謝以見改邑于謝所以酬其功也國語云謝西之九州何如注云謝申伯之國也今在南陽蘇氏云南陽有申城申伯國也王命召伯定功作所居之處登升其功使世世子孫傳其社稷申伯之國必命召伯者欲以尊大申伯也王命申伯此章又言王所以告申伯封建之意言我之所以命爾為式於南國者因是謝邑之人而作爾土功也又命召伯定其土田之税徹什一之法也公劉遷于豳邑而徹田為糧今申伯之改邑乎謝亦必徹其土田蓋遷其地者必先定其井牧均其税賦王又命傅御之臣傅御者貳王治事之臣也遷申伯之私人往於謝邑私人者申伯之家臣也申伯之功言城謝之事乃召伯所營其所營之地則始作其城既作其城又作其寝廟寝廟既成則其形藐藐然而美也觀詩曰肅肅謝功召伯成之召伯其於營城邑之事為可嘉矣王氏云所以命召伯者亦以能治其土功之事也王賜申伯而遣之行則四牡蹻蹻然而壮鉤膺又濯濯然而光明鉤者馬婁頷之鉤膺者馬之膺前有飾即周官所謂樊纓也按周官巾車金輅鉤樊纓九就同姓以封申伯異姓而乃以此錫之者孔氏云以其命為侯伯故得車如上公也王遣申伯既錫申伯以四牡鉤膺今又遣之而有大路之車乗駟之馬則其禮可謂有加而無己也且又告之曰我圖謀爾之居莫如謝邑之最善又賜之以大圭以為爾之寶也鄭氏曰圭長尺二寸謂之介故以為寶賜之以介圭所謂賜之以夏后氏之璜封父之繁弱以為魯國之寶也自古分寶玉於伯叔之國故其建國多錫之以寶玉近己也徃己王舅其保安南土乎申伯信邁言申伯信行矣於是王餞送於郿地申伯還於南則誠歸於謝王氏曰王之數留疑於行不果也此説是也行之不果者謂今之行邁則是信邁也今之歸則是誠歸也又告之以召伯徹土田之時所至峙其糧粻所以速申伯之行也則知王之為申伯謀者至矣盡矣不可以有加矣申伯畨畨畨畨有功也言申伯既入于謝邑則徒行者御車者皆嘽嘽然莫不欣喜説文嘽嘽一曰喜也徧國之人莫不喜曰女有良翰矣申伯為四國之蕃故其所至之國莫不喜其有良翰也申伯之徳不亦顯乎此乃王之元舅也文武皆備而可以為表式文武吉甫萬邦為憲以見宣王之時其人才皆文武之全也申伯之徳又柔惠而且直葢柔而不直則儒直而不惠則訐書曰直而温葢温多失之不直惟直而且温然後為全徳申伯既有文武之全才今又柔惠且直此以見徳之全盡也揉服此萬邦其聲聞逹於四方吉甫作詩誦之其為詩甚美其風味又極其好以贈申伯矣夫所謂其詩孔碩者非謂作詩之美以其所陳之辭甚美也以贈申伯者以其辭之甚美若非申伯不足以當此也王氏曰吉甫作此詩以贈申伯而序以為美宣王宣王之美於是乎在葢唐史臣嘗贊裴度曰非度破賊之難也任度之為難也申伯信賢矣任申伯者豈不賢乎黄曰建國封侯襃徳賞功茲乃有周之家法帝王之常典春秋常事不書夫何詩人區區以是為宣王美也大抵名生於不足譽起於絶無自文武成康之紀綱文章蕩壞於厲王之手蓼蕭湛露彤弓廢熄而不用封建襃賞之政不行久矣宣王中興舉而用之宜君子所以不能忘情是以宣王諸詩序者多加以能之一字則皆是意耳雖然此詩之作美申伯而已曷為以美宣王也葢申伯有徳宣王建之美申伯亦所以美宣王故為宣王詩也吁為是説者恐未足以盡詩人之意人之常情意得志滿之時易以自驕除患享利之日易以忘人茍操是心則亂階基矣句踐之於范蠡徳宗之於陸贄豈能於天下復平之後行封賞哉宣王不忘前日排患之心所以建賢者與之共守茲宣王所以益賢也茲又詩人之深意也夫申甫者皆宣王時賢諸侯甫雖不見於經以文考之葢當如此鄭氏乃遠取訓夏贖刑之甫侯恐非也至於維嶽降神此乃詩人之辭以見上天興周之意不必泥其有無也餘章皆襃賞意不解烝民尹吉甫美宣王也任賢使能周室中興焉李曰孔氏曰崧髙之詩皆襃賞申伯指斥其人此不言任用山甫者以見王之所使任者非獨一人故言賢能以廣之韓奕之序不言錫命韓侯理亦然也孔氏之説大抵流入於鑿通詩者以意逆之故能興於詩比較前後輕重没世窮生不免為腐儒也黄日觀烝民之詩美仲山甫之賢序詩者宜曰美仲山甫也而乃曰美宣王何哉竊嘗論之二老之歸豈維文王之善養老也棫樸之盛豈維文王之能官人邪天下非患乎無賢而患乎棄賢雖春秋戰國之際而猶有賢人君子隱乎其間惟人君所用者非賢而賢者之功業遂不見於世唐天寶之末有一顔真卿而明皇初不之識也然則仲山甫雖賢非宣王能用之雖百山甫猶無山甫故詩美仲山甫而序言美宣王吾益嘆作序者之深於詩也豈後世泥章句學者之所可及哉天生烝民有物有則民之秉􅂜好是懿徳李曰孟子曰天之生此民也有物必有則民之秉􅂜故好是懿徳孟子解詩於天生烝民有物有則但加一必字民之秉􅂜好是懿徳但加一故字而詩之意自明孟子説詩所謂不費辭矣嘗聞前輩讀詩但以詩之本文改一二字而使學者自曉今日與諸君言無乃譊譊乎楊龜山曰近取諸身百骸九竅逹之於君臣父子夫婦朋友長幼無非物也而各有則視聴言動必由禮焉此一身之則也為人君者止於仁為人臣者止於敬為人子者止於孝為人父者止於慈此君臣父子之則也朋友有信夫婦有别長幼有序此朋友夫婦長幼之則也龜山之言不亦明乎天之生此民有物必有則天理之常也民之秉􅂜不失其常道故好是懿徳所謂賢者能勿喪爾也黄曰責人之辭嚴頌人之辭侈今尹吉甫之美山甫也未言山甫之為賢為能而乃先言烝民之有物有則學者於此尤當深致思也詳味此數句其意深其㫖微愚於此非特知山甫之賢亦知吉甫之不可及也孟子曰形色天性也人之一身形色具存形色之中天性不外此物則之説也凡厥有生耳目心志莫不固有此謂有物視聴言動皆必有司循而行之無非天理故曰有則故孟子曰天之生此民也有物必有則必之一字物則之説昭然矣人具形色之用而不循形色之天失其常心而賊其天性故有生之初具物則者均有生之後好懿徳者鮮葢放僻邪侈者皆無常心之民而賢者所以異於衆人者以其能勿喪耳故孟子曰民之秉􅂜故好是懿徳故之一字好徳之説昭然矣前輩謂孟子論詩止於本文上加二字義理自分明信乎孟子之二字足以盡詩人之四句也噫尹吉甫之美仲山甫而先及此者以見山甫之出乎類㧞乎萃也曰好是懿徳云者非於物則之外有所謂懿也學者當㑹此理於吾心天監有周昭假于下保茲天子生仲山甫李曰天監有周言天之視有周之徳昭明于下用保茲天子而生仲山甫仲山甫之為人葢有徳之人也夫天之祐有周乃生此仲山甫者葢天祐人君莫大於生賢佐而為人君之佐助也國之祥瑞如芝草之類皆不足以為祥瑞而國之生賢乃國之大祥瑞也宣王之時維嶽降神生甫及申天監有周生仲山甫則知嶽之降神天之生山甫其為祥瑞也大矣仲舒曰宣王明文武之功業周道粲然復興詩人美之而作是詩上天祐之為生賢佐後世稱頌至今不絶葢謂此也黄曰自前章言天之生民均具物則不為堯有不為桀亡至於賢者之所以異於人者則在於秉􅂜之復非天之降材爾殊也今日天監有周而生山甫然則天之生山甫也其亦有以異於烝民之生而非人之所可及乎葢賢之所以為賢固由於秉彝之復然天之生賢也亦豈茍云乎哉申伯自嶽降傅説為列星故愛人君者天心也則賢佐之生亦天心也周家之澤未泯而上天之心未忘其黙相於我周家隂隲於我下民而為之生仲山甫焉保茲天子生仲山甫此天意也任賢使能周室中興宣王所以承天意也仲舒曰宣王明文武之功業周道粲然復興上天祐之為生賢佐後世稱頌至今不絶仲舒之言其此詩之證歟噫天為君而生賢君奉天而用賢有賢而不能用與用之而非賢是皆違天意者也違天意而能治天下吾未之見也仲山甫之徳柔嘉維則令儀令色小心翼翼李曰仲山甫之徳此一章則總言山甫之徳也其柔和嘉美而可為法則也下文曰令儀令色小心翼翼則其柔和嘉美又可見矣其容儀顔色無不令善而其心翼翼而恭敬或内或外無不盡善此山甫所以為山甫也曽子曰君子所貴乎道者三動容貌斯逺暴慢矣正顔色斯近信矣出辭氣斯逺鄙倍矣仲山甫之有令儀則所謂動容貌者也有令色則所謂正顔色者也黄曰剛毅木訥近仁巧言令色鮮仁剛毅木訥因性而行是仁之資也故曰近仁巧言令色彼将以濟其不仁耳故曰鮮矣仁今詩之稱山甫曰柔曰嘉曰令色柔嘉非剛毅令色非至仁詩人何取於此哉孔子曰色厲而内荏其猶穿窬之盗與曰猶穿窬云者言其無諸中而偽諸外也詩人稱山甫之柔嘉必曰維則稱山甫之令色必曰小心翼翼柔嘉本於天性而令色發於誠心此有諸中形諸外者也遐想山甫之為人粹然其和翼然其恭逺之則有望近之則不厭蓋涵養之所充至誠之所𤼵見者固如此也故嘗謂令儀令色有如山甫而聖人乃斷然曰非仁者葢慮夫色厲而内荏者之誤天下後世也前輩嘗云周公恐懼流言日王莽謙恭下士時假使當時身便死一生真偽有誰知吁此知人所以難而吾夫子所以嚴巧言令色之戒歟古訓是式威儀是力天子是若明命使賦李曰其為人也又式古人之典訓故能威儀是力威儀是力故能天子是若葢能法古人之典訓則其修身者必能威儀是力能修於己者既盡矣則推之以事君者必能天子是若天子是若則以明其教令而使布施於外此以見天子是若也孔子曰色厲而内荏其猶穿窬之盗與自小人觀之非無令儀也非無令色也無諸内而强於外故見於外者雖曰顔色之美而其心不然矣此所謂穿窬之盗巧言令色鮮矣仁也山甫外則有令儀令色内則小心翼翼表裏如一此其所以為賢也黄曰伊川嘗云仲尼元氣也顔子景星慶雲也孟子有泰山巖巖氣象張子韶謂伊川之學自踐履中入故能深識聖賢氣象如此愚嘗因前輩之餘論而得君子小人之氣象竊妄為之説曰君子氣象如春生小人氣象如秋殺嘗讀書見臯陶稷契伊尹周公之徒其氣象粹然如春風和氣中至讀戰國策及諸史𫝊見蘇秦張儀商鞅李斯之徒其氣象變詐暴戾使人觀之如在秋霜中吁君子小人之氣象信乎不可誣也烝民之詩形容仲山甫之為人其言詳其喻廣愚讀此詩四句見山甫之氣象粹然其和翼然其恭真臯陶稷契伊尹周公之徒也自古訓是式一句觀之可以想仲山甫無一豪自用之心凡云為設施之際必則古昔稱先王其與好自用自専者大異矣以是而致君必能格人君之非心以是而為民必能道人君之徳意其若天子敷明命自其至誠之心推之也雖然世固有學古而昧今通古訓而不通世務者而曰吾惟古訓是式也世又有飾惡以逢其君殘民以奉其君者而曰吾惟天子是若也詩人稱仲山甫以古訓是式天子是若而終之曰明命使賦吾見其學古而不至於泥古順君而不至於逢君此非其涵養之所充至誠之所至者能如是乎王命仲山甫式是百辟纉戎祖考王躬是保出納王命王之喉舌賦政于外四方爰發李曰王命仲山甫宣王以山甫之賢又告之曰我以汝為百官之長而繼汝之祖考而保我王躬觀此則知山甫之祖考常居是官矣為山甫者乃世其家也仲山甫出納王命為王喉舌凡王之所言者出而宣之所為者納而白之惟能為王之喉舌故其政教發於四方而四方皆應之也𤼵者應也出其言善則千里之外應之山甫為王喉舌而賦政于外四方其有不應乎黄曰天子之職論一相宰相之職統百官相賢邪則百官有司皆得其人相非其人百官有司将何取則哉舜不相禹而相驩兜吾恐有鯀之徒相與都俞於虞朝成王不相周公而相管蔡吾恐武庚之徒相與扳援於周行治亂之機甚可畏也惟舜相禹以為百辟之式故九官濟濟以相遜惟成王相周公以為百辟之式故多士濟濟而秉徳吁其可忽哉竊嘗觀宣王承厲王板蕩之後一時賢者能者畢立於朝廷之上文武之吉甫孝友之張仲式南國則有申伯奄北國則有韓侯平淮夷則有召虎是何得人之盛如此哉非宣王能盡得天下之賢而用之葢得仲山甫以為百辟之式焉爾繼之曰纘戎祖考云者言其先祖父皆有大功於前聖今爾其可不思所以繼之乎此宣王命之之意也竊嘗因此而論之立賢無方固不可以閥閲論人然賢者之後其子孫尤多賢者其後可不思繼祖考哉魯侯之賢周公之孫也召虎之賢召公之孫也故宣王命韓侯曰纘戎祖考命山甫曰纘戎祖考皆以其祖父之功而望之也繼之曰王躬是保葢使之以其孝於祖父者而忠於其君又繼之曰出納王命王之喉舌賦政于外四方爰發葢使之以其忠於君者而推是意以及於民喉舌云者欲其宣人君之命於天下也自其輔翼於君佐佑於民而言之則謂之股肱自其出納王命而言之則謂之喉舌惟其當出納之職而能任順民之責故敷于外而四方應之非如後世之所謂徒掛牆壁而已吁内有以輔其君外有以惠於民想其在朝廷則有以得君之心在邦國則足以得民之心遠之則有望近之則不厭如周公所謂東方之人欲其留西方之人欲其歸吁賢哉肅肅王命仲山甫将之邦國若否仲山甫明之李曰肅肅王命王之命肅肅然而嚴仲山甫将而行之諸侯之有賢否者山甫則辨而明之言山甫宣王命於諸侯之國諸侯之賢者則知其賢諸侯之不賢者則知其不賢如是則可以将王命不然則徒以虚文掛牆壁而已何所補哉黄曰邦國若否仲山甫明之説者皆曰仲山甫将命於外諸侯之或賢或否皆能察之如所謂旌别淑慝是也愚竊以為不然夫人臣不難於能奉君之命而難於盡愛君之實王命之嚴吾能将而行之然知有君命而不知有民情國家之利害有所不知生民之休戚有所不察豈吾所謂愛君之實乎固不可如後世之奉使者朝辭禁門情態即異暮宿州縣威福便行驅廹郵𫝊折辱守宰公私煩擾民不聊生如此而曰吾能将天子之命也豈足道哉仲山甫能以王命而宣於外而能以民情而告於君王命之肅仲山甫既能将之矣至於民情之違順仲山甫又能明之以見其推愛君之心以愛民而非阿順以媚其君也此愚之臆説未必果詩人之意既明且哲以保其身夙夜匪解以事一人李曰既明且哲以保其身此則内以保其身也夙夜匪解以事一人此則外以致其君也宣王之命山甫纘戎祖考王躬是保惟其夙夜匪解以事一人則可以見其保王躬矣夫惟明哲保身而不能保其君則是阿諛諂媚之人矣茍能保其君而不能保其身則又非遠禍之道也説者乃以謂宣王撥亂之君山甫乃中興之臣千載一遇宜其密勿而無間也明哲保身之道又何足言且以髙祖之於蕭何猶有械繫之辱光武之於鄧禹猶有褫龍章之辱是二者非不千載一遇而猶不免於此然後知人臣明哲保身之難也黄曰此一章説者類曰明哲保身君子全身遠害之道也昔楚元王為穆生設醴後王戊忘設焉穆生曰可以逝矣不去楚人将鉗我於市此明哲保身之君子也是故以蕭何之功而不免械繫之辱以韓信之功而不免鍾室之誅兔死狗烹鳥盡弓藏之誚皆為不能明哲保身之戒愚竊以為不然夫魏鄭公願為良臣不願為忠臣良與忠不可分而言也然而臣子之心安可求忠之名於天下後世邪吾有忠之名則天下後世得以議吾君故凡以龍逄比干自期者非人臣之得已也然則立人之朝必以明哲保身之説自期其心将曰吾君非堯舜也非禹湯文武也全身遠害之道不可不知也推是心以徃則諂媚求容無所不至知為身慮而不知為國慮此豈仁人君子之用心邪况以宣王之明君仲山甫之賢臣其君臣之相得當密勿而無閒明哲保身之道又何足言而詩人又何屑屑以是而美之也昔臯陶以智為帝陳謨箕子以智為武王陳洪範夫知人安民之書彝倫攸叙之書皆天下之常理而必以智稱何邪孟子曰所惡於智者為其鑿也今詩人稱仲山甫之既明且哲而特曰以保其身葢修身謹行而俾無一豪玷闕者皆知之大也斯言之玷非所以保其身也仰媿俯怍非所以保其身也言滿天下無口過行滿天下無怨惡故曽子有疾召門弟子曰戰戰兢兢如臨深淵如履薄冰而今而後吾知免夫小子所謂明哲保身如此而已推此心以事君則必為事君之小心故夙夜匪解以事一人愚嘗觀詩人之稱仲山甫既曰以保其身又曰王躬是保吁能保其身又能保其君此孟子所謂惟大人能格君心之非者也如今全身遠害之説則豈足以知王躬之是保哉愚故詳為之辨人亦有言柔則茹之剛則吐之維仲山甫柔亦不茹剛亦不吐不侮矜寡不畏彊禦李曰人亦有言柔懦者則茹而食之剛强者則吐而出之維仲山甫雖柔者不茹而食雖剛者不吐而出惟其柔而不茹故能不侮矜寡惟其剛而不吐故能不畏彊禦書曰無虐煢獨而畏髙明煢獨者人之所易侮也故其勢日以弱髙明者人之所甚憚也故其勢日以恣仲山甫之於寡弱則以為最可矜故從而恤之使各得其所至於人之所甚憚者則不畏之使之有所懲夫常人之所謂剛者但施於煢獨之人而已所謂柔者但施於髙明之人而已山甫之剛柔與常人異此剛柔所以得中也黄曰此一章説者類曰柔亦不茹不侮矜寡之喻也剛亦不吐不畏彊禦之説也愚之説則曰柔亦不茹所以不畏彊禦也剛亦不吐所以不侮矜寡也葢此所謂剛柔者仲山甫一身之剛柔非天下剛柔之人凡物之性有失之過柔者有失之過剛者杞柳之可以為桮棬此柔之可茹者也金石之不可得而食此剛之可吐者也是皆剛柔之偏也仲山甫之柔不至於可茹則柔非懦也剛而不至於可吐則剛而非暴也至寛而有所謂至嚴至察而有所謂至容温而厲威而不猛此中和之徳也全中和之徳於一身散中和之用於天下推吾不茹之柔則柔之中有不可犯者存彊禦者吾奚畏推吾不吐之剛則剛之中有至不忍者存矜寡者吾奚侮葢矜寡者吾所當恤而彊禦者吾之所當治如洪範所謂彊弗友剛克燮友柔克是也竊嘗論之天下之困窮艱苦者莫甚於矜寡之民而肆毒於田野横行於州閭者皆彊禦之徙也堯之所謂不虐無告不廢困窮而文王之發政施仁亦曰必先斯四者古人之治其於矜寡之窮民尤所盡心焉故書曰無虐煢獨而畏髙明葢煢獨者人情之所忽而髙明者人情之所憚也嗟夫矜寡之民其勢固弱矣强胥猾吏又從而重擾之則其弱甚矣上之人苟從而抑之侮之則彼将何所告邪是以後世之民其彊禦者日以縱而矜寡者日以甚豪民猾吏肆其姦横而莫敢誰何使夫細民戰戰兢兢而猶懼不免於罪吁安得如仲山甫之賢者以治民邪天生山甫以興周之治宣王用山甫以福周之民吁周之民一何幸哉人亦有言徳輶如毛民鮮克舉之我儀圖之維仲山甫舉之愛莫助之李曰人亦有言徳輶如毛民鮮克舉之我欲與儀匹共圖之然獨山甫能舉而行之惜乎莫有能助之也有人於此力不能勝一匹雛則為無力人矣今曰舉百鈞則為有力人矣然則舉烏獲之任是亦烏獲而已夫人豈以不勝為患哉弗為耳况徳輕如鴻毛豈有不能舉之哉但人不舉之耳山甫能不以世人之所忽而忽之故能舉如毛之徳也然觀宣王之時其賢臣非不多也而山甫乃能獨舉如毛之徳是當時惟山甫一人而已自山甫之外無有能舉之者此葢詩人甚言山甫之賢故曰徳輶如毛民鮮克舉之我儀圖之維仲山甫舉之愛莫助之如所謂周餘黎民靡有孑遺豈周真無遺民哉維仲山甫一人舉之豈山甫之外果無一人能舉之哉當以意逆志然後為得也王氏曰是時吉甫張仲申伯之徒皆見於詩而曰愛莫助之則以方宣王莫不好徳賢臣衆多之時為莫助耳此所謂癡人前説夢也黄曰嘗觀孟子之告齊王今有人力足以舉百鈞而不足以舉一羽既而又言一羽不舉為不用力焉吁孟子者可謂巧於喻其君矣今觀尹吉甫之美山甫也亦何其巧於形容歟徳輶如毛至輕而易舉也而民鮮有能舉之者擬之於其倫度之於其衆然後知能舉者惟仲山甫一人而已夫徳之輕喻於鴻毛似易舉而民鮮克舉之則又似於難舉夫人豈以不勝為患哉患不為耳天下之事惟不忽於小故能成其大卷石之積可以至於華嶽撮土之多可以極於持載舜之為舜固不可及也而聞一善言見一善行則若决江河莫之能禦夫一言行之善徳之至微也而舜有不能自已者是以中庸稱舜之大智而必曰好察邇言夫邇言者常人之所甚忽也而舜必察之茲舜之所以為大也是故細行之不矜則大徳之累也小善之不為則衆美之銷也忽乎其小者則安能成其大者哉如毛之徳非不易舉而民不能舉之其患葢生於有所忽也仲山甫維不忽人之所共忽故能舉人之所不能舉此尹吉甫所以工其辭以形容之歟繼之曰愛莫助之此詩人自言之辭也説者謂詩人言仲山甫之賢如此惜乎莫有能助之者此其説為不通愚以為人情之於人既愛之則必有以助之故助其所不足以成其所至足此所以見其愛之之深也詩人言仲山甫之賢能舉人之所不能舉則其徳無所不足矣無所不足何助之有故吾於仲山甫惟能愛之而莫能助之非必助之難雖欲助之而莫容助也夫助者生於有所不足彼善戰而吾濟之以文彼善諫而吾濟之以直此有待於助者也孔子作春秋游夏不能措一辭此不容於助者也知此則知愛莫助之之説衮職有闕維仲山甫補之李曰衮職人君也人君之衣衮冕故言人君也言君之有過維仲山甫能補之蘇黄門曰有過天下莫敢言山甫獨能補之此以見山甫能舉徳也黄曰此二句葢得微而顯隱而彰之義夫兖冕天子之服也此章但言宣王有過維山甫能補之然不曰宣王而曰衮職此微辭也葢證父之過不足以為直揚君之過不足以為忠美山甫之賢而斥宣王之有過吾於詩人奚取哉此尹吉甫所以微其辭於衮職而隱其意於有闕之言也嗚呼仲山甫者葢孟子所謂能格君心之非者也人臣之事君當有以格其心術之微人君茍有一念之過吾當有以正之於未萌以全於無過之地不待其過之已彰而後言之也故曰維仲山甫補之補之云者補其闕而使之無闕也易曰无咎者善補過也夫无咎者無所過失之謂也既曰無過而又曰善補過豈非善補乃所以無過歟此仲山甫之所以為仲山甫而孟子所謂格君心之非者也宣王之時在朝之賢臣非不多而能格君心之非者維仲山甫一人而已想其庭燎之箴已諄諄於宣王方勤之時鶴鳴之誨尤致意於任賢使能之際嗚呼當其未有之時而已思以箴之誨之此所以能補其闕而使之無闕也為人臣者如仲山甫可以無媿仲山甫出祖四牡業業征夫㨗㨗每懷靡及四牡彭彭八鸞鏘鏘王命仲山甫城彼東方四牡騤騤八鸞喈喈仲山甫徂齊式遄其歸李曰仲山甫出祖言仲山甫受王命将欲適齊出於國門而為祖道之祭故其所乗之馬則業業然而髙大所從之征夫則㨗㨗然而敏速既有業業之四牡又有㨗㨗之征夫宜其不以不及於事為憂山甫之心猶恐無所及於事山甫之為國可知矣山甫徂齊如此足以知其奉使以将王命其所以盡心者未嘗不盡其忠也山甫既行而四牡彭彭然而行八鸞之聲又鏘鏘然而鳴所以為此行乃王命山甫往築城於東方之國也山甫徃城彼東方其所乗之馬又騤騤然而壮健八鸞之聲又喈喈然而和鳴山甫乗此馬而徂齊而周人則欲其速歸也昔周公之居東東方之人則欲其留西方之人則欲其歸今山甫之徂齊而周人則欲其速歸其亦庶幾於周公矣黄曰禮以義起詩以情起禮之詳於義物者辨其名詩之詳於義物者寓其意故其樂是人之賢也則亦樂稱其車馬之盛衣服之美重複而不厭今觀詩人之稱山甫既曰四牡業業征夫㨗㨗又曰四牡彭彭八鸞鏘鏘又曰四牡騤騤八鸞喈喈一意而三及之一辭而三嘆之夫豈有異義葢曰仲山甫之適齊也将行而為祖道之祭其四牡之馬如是其盛征夫之衆如是其敏八鸞之聲如是其和則仲山甫之所以為山甫者可知矣雖然是亦未足以形容山甫之賢而詩人之意亦不止於是也愚謂先一章之意不在於四牡征夫而在於每懷靡及之一句其次章之意不在於四牡彭彭八鸞鏘鏘而在於城彼東方之一句末章之意不在於四牡騤騤八鸞喈喈而在於式遄其歸之一句諸儒講解徒紛紛於四牡八鸞之説彭彭業業鏘鏘喈喈之辨而詩人之意則反畧之焉愚故詳及之夫每懷靡及云者言仲山甫之賢愈不自足也人之常情位髙者好自矜徳盛者好自大如毛之徳維仲山甫舉之衮職有闕維山甫補之山甫之賢非人之所可及而山甫之心常慊焉若有所不及焉則其涵養之所至為何如此詩人之所以樂稱之而不已也昔文王作皇皇者華之詩以遣使臣而切切然為每懷靡及之戒若山甫者非特無媿於宣王之責抑亦無媿於遣使之意矣城彼東方云者先儒以為築城於齊以禦東夷此説非也國有人焉則金城不足喻人茍賢焉則金城不足比仲山甫之徳足以蕃宣其國扞芘其民故仲山甫徂齊所以為衛齊此詩人所以深美其徳之盛也昔文王作出車之詩以命南仲而惓惓於城彼朔方之言若仲山甫者非特無負於宣王之命而亦無媿於文王命南仲之意矣式遄其歸云者此又見當時之人其所以愛仲山甫者深矣遠之有望近之不厭者所以為盛徳之至也在彼無惡在此無斁者所以為微子之賢也人之所為有以得乎人之心而使人皆有愛之不能自已之意則其為人也可想而見之仲山甫之将徂齊而人有城彼東方之喜仲山甫之既徂齊而人有式遄其歸之望是人也居則人愛之去則人思之如周公居東而當時之人皆曰無以我公歸兮無使我心悲兮東方之人欲其留西方之人欲其歸吁是果何以得此於人哉仲山甫之所以為仲山甫者吾於周公見之吉甫作誦穆如清風仲山甫永懷以慰其心李曰吉甫作詩而誦之其詩感人之情性和穆如清風而仲山甫多所思故作此詩以少安其心也穆如清風所以慰其心也謝道韞嘗謂此四句為最佳不可不詳味之蘇黄門以為山甫之徳詩人之言有曰柔嘉維則令儀令色小心翼翼古訓是式威儀是力此與胡廣趙戒何異終則曰人亦有言柔則茹之剛則吐之維仲山甫柔亦不茹剛亦不吐此與汲黯朱雲何異趙戒胡廣則陷於諂汲黯朱雲則陷於狂山甫之為人内剛外柔非諂非狂所以為王者之佐剛柔具備亦如申伯文武之是憲不如是不足為全徳也黄曰古今之作詩未嘗自著其名也自言其名者或有之未嘗自夸其美也如曰是用作歌之類豈自誇其名乎如曰家父作頌以究王酗而已豈自誇其美乎愚讀崧髙烝民二詩末章而獨有疑焉夫吉甫作詩以美申伯至其末章曰吉甫作誦其風肆好詩人以美仲山甫至其末章曰吉甫作誦穆如清風夫自著其名自誇其美吉甫果何為哉文武吉甫萬邦為憲吉甫之用心豈若是其淺邪天下之事言者無媿則公言之受者無愧則安受之故作詩以美人者其言易以誇以仲山甫之賢而吉甫作詩以形容之吉甫言之而無過辭山甫當之而無愧色雖暴之天下後世有不可得而議者此所以自言而無所隱也六月之詩其末章形容吉甫飲御諸友而曰侯誰在矣張仲孝友夫明曰張仲孝友云者所以見其一時朋儕皆當世賢者故此詩明曰吉甫作誦曰仲山甫永懷以慰其心其意微矣故詳及之韓奕尹吉甫美宣王也能錫命諸侯李曰孔氏云錫謂賜之以物二章是也命謂授之以政一章是也是以錫命分為二也觀春秋書錫命者三皆曰來錫公命不當分為二也此詩言錫命者葢宣王錫韓侯以命耳所謂能者葢錫之者非妄予而得之者非妄受故謂能錫命諸侯春秋書錫命者三荘公元年王使榮叔來錫桓公命文元年天王使毛伯來錫公命成八年秋七月天王使召伯來錫公命錫之者皆妄予而得之者皆妄受何以為能錫命乎黄曰人君之於天下予奪自我賞罰自我錫命諸侯人君之職春秋之際王室既微矣荘公元年王使榮叔來錫桓公命文公元年天王使毛伯來錫公命成公八年秋七月天王使召伯來錫公命當王室衰微之際天子擁虚器於上而猶能錫命諸侯今詩獨以是美宣王此而可美則春秋書錫命三亦皆可美邪是不然詩人美宣王之錫命而必曰能云者其微意有在也春秋之所書者皆譏也譏者何譏其錫之非人予之非禮而非所謂能也棫樸之詩曰文王能官人也夫人主以官人為能則官人者固人主之職而何獨於文王稱之書曰知人則哲能官人葢惟其有知人之明而後官人不失其為能予之者公天下而予之受之者公天下而受之予之者無慊受之者無愧夫是之謂能采菽之刺幽王曰諸侯來朝不能錫命以禮幽王非不能錫命也錫命而非禮則猶不能錫命也故瞻彼洛矣之詩亦曰思古明王能爵命諸侯賞善罰惡焉吁詩人之意亦明矣爵命諸侯人君所同也賞非其善罰非其惡則亦何足為人君之能事哉韓奕之詩序言宣王能錫命諸侯而其詩乃曰王錫韓侯曰韓侯受命葢以其所錫者韓侯非妄錫也上之人非妄錫下之人非妄受其曰能也固宜不然威烈王二十三年初命晉大夫魏斯趙籍韓䖍為諸侯是亦錫命諸侯也而奚獨宣王能之此一字之㫖序詩者之意存奕奕梁山維禹甸之有倬其道韓侯受命王親命之纘戎祖考無廢朕命夙夜匪解䖍共爾位朕命不易榦不庭方以佐戎辟四牡奕奕孔脩且張韓侯入覲以其介圭入覲于王王錫韓侯淑旂綏章簟茀錯衡𤣥衮赤舄鉤膺鏤錫鞹鞃淺幭鞗革金厄韓侯出祖出宿于屠顯父餞之清酒百壺其殽維何炰鼈鮮魚其蓛維何維筍及蒲其贈維何乗馬路車籩豆有且侯氏燕胥韓侯取妻汾王之甥蹶父之子韓侯迎止于蹶之里百兩彭彭八鸞鏘鏘不顯其光諸娣從之祁祁如雲韓侯顧之爛其盈門蹶父孔武靡國不到為韓姞相攸莫如韓樂孔樂韓土川澤訏訏魴鱮甫甫麀鹿噳噳有熊有羆有貓有虎慶既令居韓姞燕譽溥彼韓城燕師所完以先祖受命因時百蠻王錫韓侯其追其貊奄受北國因以其伯實墉實壑實畝實藉獻其貔皮赤豹黄羆李曰奕奕梁山韓之鎮也禹貢治梁及岐今在同州彭城縣其後屬晉春秋時梁山崩乃晉望也爾雅曰梁山晉望也孫炎注曰晉國所望祭則是韓滅之後故以為晉之望此所謂韓者非韓趙魏之韓乃武王之後左氏所謂邘晉應韓也其後為晉所滅焉奕奕大也梁山之地其髙大如此自洪水既平之後惟禹以丘甸之法而為貢賦則禹之功可謂大矣其後韓侯能顯明其道以繼禹之功則韓侯之功亦大矣有倬其道言顯其道也禹自洪水既平之後九州之地無不甸之獨曰奕奕梁山維禹甸之者亦如信南山信彼南山維禹甸之主南山而言也有倬其道韓侯受命亦猶信南山所謂畇畇原隰曽孫田之是也王氏則以謂奕奕梁山維禹甸之有倬其道為一意韓侯受命王親命之纘戎祖考為一意當且從毛鄭之説夫韓侯受命䖍固恭敬爾之位朕命不可改易矣然當征不庭之方以佐汝君也宣王命仲山甫曰纘戎祖考今命韓侯亦曰纘戎祖考豈宣王之時官人以世邪但以山甫之徳足以繼其祖考韓侯之功亦足以繼其祖考故宣王命之世其位非是宣王官人以世也四牡奕奕上章既言宣王命韓侯為伯矣此章則又言宣王所錫之禮盡其厚也四牡之馬其形甚長而髙大韓侯乗之以朝於王既至於京師則進其國之所有而入覲于王按覲禮侯氏入門右坐奠圭四享皆束帛加璧庭實惟國之所有故韓侯獻之以介圭以其國之所有也鄭康成曰黒水西河其進璆琳琅玕介圭者韓侯所有也王錫韓侯以旂之善者又有大綏以為表章以方文漆簟為車之蔽錯置文彩為車之衡所以養其目也又錫身之所服以𤣥為衣而畫以衮龍足之所履配以赤色之舄鉤膺即上文鉤膺濯濯也馬則有金鉤之飾其膺又有美飾又以鏤金加馬面之鍚鞹革也虎豹之鞹猶犬羊之鞹也鞃軾中也以皮革施於軾中以為幭淺虎皮淺毛也幭覆其軾鞗皮為轡首之革夫以韓侯入覲盡其諸侯述職之道宣王錫之以命又盡乎天子賞功之道如春秋書錫命者皆非諸侯親至京師而天子錫之皆其遣使以錫也其遣使以錫之固非禮矣而又所錫者皆不當其功何足以為錫命乎王使召伯廖賜齊桓公命齊桓公雖曰有功亦未嘗朝於京師故遣使以錫之也晉文公于踐土召王而天王錫文公命雖曰朝王亦非朝于京師也惟朝于京師而錫之以命然後為得禮之正也韓侯出祖此則言既朝于京師而韓侯出京師之門而為祖道之祭及出宿于屠而王又使卿士送之以酒百壺其殽則有火熟之鼈中膾鮮魚其菜則有筍蒲而所乗之馬則又有大路之車籩豆行列且然而甚多凡諸侯之在京師者皆來相與燕所以待韓侯也方韓侯之來也王有以錫之而錫之如此之厚及其去也又有以餞之而餞之又如此之厚則宣王之所以待韓侯者可謂至矣韓侯取妻此則言韓侯之取妻又有可美之事也康成曰汾王厲王也厲王流于彘在汾水之上故時人因以號之故詩曰汾王之甥蹶父之子卿士之子言其族尊貴也亦猶碩人之詩曰齊侯之子衛侯之妻東宫之妹邢侯之姨皆言族之大也韓侯既親迎於蹶父之里其百兩則彭彭其八鸞則鏘鏘而其禮豈不光明乎諸娣從之古者諸侯一娶九女二國以女媵之而其他國諸娣從之祁祁然如雲之衆多韓侯因而觀之見其燦爛盈於蹶里之門也鵲巢之詩曰之子于歸百兩御之今韓侯之取妻百兩彭彭亦如鵲巢所謂百兩御之也鵲巢又曰維鵲有巢維鳩居之居之者則是諸娣從之也今此諸娣從之爛其盈門是亦所謂維鳩居之也然韓侯之取妻未必受命之後方可取妻葢詩人言其可美之事故兼言之耳蹶父孔武此章則言蹶父為韓侯擇對既得韓侯之賢又得韓國之善地也言蹶父之為人甚武健為王之使其車轍馬跡環轍天下為韓姞相其居莫如韓國之最樂者則以川澤則訏訏然而大魴鱮則甫甫然而大麀鹿則噳噳然而至衆又有熊羆貓虎此言韓國之富饒如此蹶父善韓之地如此故使韓姞嫁而居之韓姞則安之而又有譽焉以見韓姞之盡其婦道也溥彼韓城此一章大抵言韓侯得賢女為助益見其光顯也王氏云韓侯取妻何預於王政而詩言此葢言汾王之時為諸侯之所卑侮則王甥亦安能相攸而擇樂國之顯君哉雖其辭之多而其實曲説也言韓城之大燕安之時衆民之所築完其來久矣以韓侯先祖受命為侯伯者則因是百蠻故命其祖為侯伯今又命韓侯為侯伯因是追貃其追其貃即上文因是百蠻之意統理北方之國因而為伯焉觀上文言王親命之纘戎祖考則所謂先祖受命因時百蠻王錫韓侯其追其貊奄受北國因以為伯即纘戎祖考也髙築其城浚深其壑畝以定其田藉以定其税蠻夷之逺則又各獻其所有之物貔皮與夫赤豹黄羆皆四夷所獻之物也説文曰貔豹屬出於蠻國宣王之時式是南邦則有申伯焉奄受北國則有韓侯焉是南方之國以申為侯北方之國以韓為侯則方國可謂得人矣韓侯為方伯而使戎狄之人獻其所有此豈有力以强服之哉其視齊桓公召陵之盟晉文公城濮之戰不足道也黄曰詩人之美是人也或言其事以實之或言其地以記之太山魯之望也故頌魯者曰太山巖巖魯邦所瞻南山周之原也故歌周王者曰信彼南山維禹甸之梁山韓之鎮也故美韓侯者曰奕奕梁山維禹甸之書言禹治梁及岐春秋時梁山崩則梁山亦天下之望山也而其地在於韓今同州彭城縣之地也詩人言梁山之地奕奕然其大也維禹甸之六十四井為甸甸方八里居一成之中成方十里出兵車一秉以為賦禹之功可謂著矣昔者禹之功著於此今也韓侯之功著於此故繼之曰有倬其道韓侯受命王氏以奕奕梁山維禹甸之有倬其道為一意以韓侯受命屬下文為一意愚恐不然自王親命之至於此以佐戎辟皆形容宣王命之之辭也宣王之待韓侯也至而望韓侯也亦至方其命之也必親及其責之也必詳曰王親命之以見其眷之之深且至也曰纘戎祖考無廢朕命夙夜匪解䖍共爾位言其先祖父皆有大功於王室今爾其可不思所以繼之乎爾欲繼乃祖乃父之業當無廢朕之命也韓侯而聞斯言固當不忘其祖尤當不忘其君其敢有自怠自忽之心哉盡乃心勤乃職韓侯之所當然也茍有一豪自怠自忽之心非惟有負於其君亦有戾於乃祖乃父矣繼之曰朕命不易榦不庭方以佐戎辟噫王之命韓侯也示之以不貳之心而勉其不己之意葢君之於臣任之不専信之不篤則彼亦将茍且以自安持禄保位以自全孰肯以愛君憂國為心哉宣王之命韓侯以為朕之命既不易矣乃當盡乃心勉乃力四方之有不順軌者爾當正之以佐爾君也吁以宣王之明以韓侯之賢其君臣之情相得而無間周道粲然復興葢有自來矣故曰任賢使能周室中興焉毛詩集解卷三十五
