body:
  text: 毛詩集解卷三宋李樗黄櫄􅁧召南鵲巢詁訓𫝊第二國風鵲巢夫人之德也國君積行下孟反累功以致爵位夫人起家而居有之德如鳲鳩乃可以配焉李曰有國家者成之甚難壞之甚易百年成之而不足一日毁之而有餘譬如作室經營之功非一日而成至於傾毁則不待數日焉其所以成之者以其積累之難也其所以壊之者以其不知積累之難也故序以為國君積行累功以致爵位夫人起家而居有之言國君積累之難也如此而夫人安而有之不可以其安而有之遂忘積累之難也其曰德如鳲鳩者歐陽以為鳩之種𩔖最多居鵲之巢鳩諸家或以為布穀或以為戴勝與鳩大異此序詩者之誤也黄曰此一篇諸家之説皆未盡其意謂國君積行累功以致爵位如鵲之有巢夫人起家而居有之如鵲巢而鳩居歐陽公李迃仲陳少南亦謂鳩最拙不能營巢而居鵲之成巢然以物理推之鳲鳩無居鵲巢之理詩人止是取二物以為比喻言惟國君積行累功故能致爵位惟賢女有夫人之德故可配國君維鵲有巢維鳩居之之子于歸百兩御之維鵲有巢維鳩方之之子于歸百兩將之維鵲有巢維鳩盈之之子于歸百兩成之李曰維鵲有巢以譬國君之積行累功以致爵位也維鳩居之以譬夫人起家而居有之也言鳩居鵲之成巢亦如夫人起家處夫人之位也方有之也盈鄭氏云盈滿也盈者衆媵姪娣之多也百兩御之御迎也書曰武王戎車三百兩皆以一乗為一兩謂之兩者風俗通云以為車有兩輪馬有四匹故車稱兩馬稱匹也百兩御之言夫家以百兩迎之也百兩將之言父母之家以百兩送之也百兩成之言成之為夫人也孔氏云是子有鳲鳩之德其往嫁之時則夫家以百兩之車往迎之言夫人有德禮儀具備謂有鳲鳩之德其説固非矣其曰禮儀具備雖為無害亦未得詩人之意歐陽以謂禮之盛亦未為當夫詩人言之子于歸者蓋言婦人歸時其夫既以夫人百兩之禮迎之矣父母又以百兩之禮送之矣其嫁之時又以夫人之禮成之矣是所謂起家而有之也孝經曰在上不驕髙而不危所以長守貴也髙而不危滿而不溢所以長守富也為諸侯者必其不危不溢然後能保其富貴國君雖能之矣亦由夫人不危不溢然後能保其富貴則知内助之不可無也如此非獨天子然也黄曰於是形容之曰維鵲有巢維鳩居之意不在於鵲巢鳩居但以為維鵲能有巢維鳩能居巢鵲善營而鳩善守故也詩人之辭未必有是事也而姑寓其意者當不以辭害意也曰維鵲維鳩其意自可見曰百兩御之是願以百乗之車迎之其樂得賢女以配國君之意如此諸家以為女子之嫁而夫家以百兩之禮迎之女子之家以百兩之禮送之將送也及至其家又以夫人之禮成之予以為不然將只是將其厚意之將是皆詩人欲盛其車服以待之以見其樂之之心云耳咏味鵲巢一詩葢與關雎之義同關雎之詩未嘗言后妃之德而言詩人欲以琴瑟友之欲以鍾鼓樂之則后妃之德可知鵲巢之詩未嘗言夫人之德而但言詩人以百兩御之成之將之則夫人之德可知后妃之德宜如關雎夫人之德宜如鵲巢二詩為二南之首聖人之意深矣采蘩夫人不失職也夫人可以奉祭祀則不失職矣于以采蘩于沼于沚于以用之公侯之事于以采蘩于澗之中于以用之公侯之宫被之僮僮音同夙夜在公被之祁祁薄言還歸李曰夫人不失職言夫人之職在於奉祭祀也禮記載國君取夫人之辭曰請君之玉女與寡人共有敝邑事宗廟社稷此求助之本也又載國君出夫人之辭曰寡君不敏不能從而事社稷宗廟使臣某敢告執事觀其取夫人則以祀宗廟社稷為辭其出夫人則以不能事宗廟社稷為辭則知夫人之職惟在於奉祭祀矣惟能奉祭祀則稱其職故以為不失職也蘩爾雅孫炎云白蒿也然則非水菜此言沼沚者謂于旁采之也下文于澗之中亦謂於曲内非水中也言采此蘩用之以備公侯之事事者祭祀之事也如春秋書有事於太廟皆言祭祀也公侯之宫宫廟也如春秋書立武宫者此說非也左傳曰澗溪沼沚之毛蘋蘩蕰藻之菜可薦於鬼神可羞於王公故采蘩所以用之於公侯之宫以備祭祀之事鄭氏謂執蘩菜者以豆薦蘩􅉁被首飾也鄭氏按少牢禮云主婦髲鬄少牢作被裼注云被裼讀為髲髴古者或剔賤者刑者之髮以被婦人之紒為飾因名髲鬄焉左氏以為吕姜髢是也方其為首飾也則僮僮而竦敬所以夙夜在公葢當視濯溉饎爨之事無不敬也及祭祀既畢則服首飾祁祁然而舒遲故薄言還歸鄉黨之篇載夫子之禮儀曰攝齊升堂鞠躬如也屏氣似不息者出降一等則逞顔色怡怡如也方其升堂則屏氣似不息及其降等則逞顔色而怡怡夫子動容周旋無不中禮以為盛德之至今夫人當祭祀之時則服首飾而竦敬及其祭祀既畢則服首飾而舒遲亦以見動容周旋中禮也若夫人者可謂賢矣王氏之說以為荇之為物其下出乎水其上出乎水由法度之中而法度之所不能制以喻后妃也蘋之為物能出乎水上而不能出乎水下藻之為物能出乎水下而不能出乎水上制於法度而不該其本末以喻大夫之妻也至於蘩則非制乎水而有制節之道以喻夫人也于沼于沚于澗之中則可以為河洲之𩔖而皆未及乎河洲之大蓋謂夫人之詩則言采蘩于沼沚之中后妃之詩則言采荇于河之洲必有髙下之辨是數者皆穿鑿之學也哀公問社於宰我宰我對曰夏后氏以松殷人以柏周人以栗曰使民戰栗夫社者以其所宜木為之故夏后氏以松殷人以柏周人以栗不過隨所宜耳其曰使民戰栗此以見穿鑿之學也今此言采荇采蘋采蘩之𩔖皆言祭祀之物于沼于沚于澗之中在河之洲亦不過指物之所在耳初無他義也而王氏有荇蘋蘩藻沼沚澗洲之别是其穿鑿無異於宰予也黃曰禮記載國君取夫人之辭曰請君之玉女與寡人共有敝邑事宗廟社稷則知奉祭祀者國君夫人之職也而必曰可以奉祭祀何哉人惟無愧於心而後無愧於祭祭不在物而在心心苟誠焉二簋可以為享心苟不誠殺牛不如禴祭且蘩生於沼沚不待賢夫人而後能采之蓋蘩生於蠲潔之中而夫人能有蠲潔之德惟無愧於蘩而後可以采蘩夫祭祀非難而可以奉祭祀者為難也觀采蘩一詩其辭簡其意直采蘩于沼沚而用於諸侯之祀事采蘩在澗中而用於諸侯之宫廟采之於彼用之於此而不可以少紊曰于沼于沚知所謂于豆于豋其辭雍容和緩而不廹切則夫蠲潔之德亦可想而見之也被之僮僮夙夜在公被者婦人之首飾僮僮者竦敬之貎當將祭之時而夙夜在公至於視濯溉省饎爨之時無不盡其齋莊之德又可想而見之也被之祁祁薄言還歸祁祁者舒遲之貎既祭之後而言歸祁祁其和易之德又可想見詠味此詩見夫人動静周旋無不中禮非盛德之至安能及此哉嘗觀鄉黨一篇見夫子衣服有常節飲食有常度攝齊升堂則鞠躬如也出降一等則怡怡如也及觀此詩見夫人采蘩有常處奉祀有常禮將祭則僮僮而敬將歸則祁祁而和此豈勉强所能致乎作序者曰可以奉祭祀則不失職可以云者是亦以夫人之德言之歟噫事親必若曽子而後可奉祭祀必若采蘩之夫人而後可左傳言可以薦鬼神可以羞王公此詩言可以奉祭祀皆有深意學者當自求之草蟲大夫妻能以禮自防也喓喓於遥反草蟲趯趯託歴反阜螽未見君子憂心忡忡敕中反亦既見止亦既覯止我心則降戸江反陟彼南山言采其蕨未見君子憂心惙惙張劣反亦既見止亦既覯止我心則說陟彼南山言采其薇未見君子我心傷悲亦既見止亦既覯止我心則夷李曰言召南大夫出行役而其妻能以禮自防蓋其大夫在家而能以禮自防未足為賢惟其大夫不在家而猶能以禮自守此其所以可尚也草蟲爾雅曰草蟲負蠜郭璞云常羊也陸璣云小大長短如蝗竒音青色好在茅草中爾雅云阜螽蠜李廵曰蝗子也許慎云蝗螽也觀春秋所書螽即此螽也而本草拾遺則以為阜螽江東呼為蚱蜢陳氏破之阜螽與蚱蜢異蚱蜢所常有也阜螽遇災旱有之喓喓聲也趯趯躍也忡忡惙惙皆是憂也覯見也止辭也降下也言采其蕨舍人曰蕨一名鼈郭璞云初生無葉可食薇者山菜也陸璣云莖葉皆似小豆蔓生其味亦如小豆藿可作羮亦可生食伯夷所采者即此是古云草蟲鳴而阜螽躍以見其𩔖相從也歐陽公則以謂生於陵阜者曰阜螽生於草間曰草蟲形色不同種𩔖亦異故以阜草别之凡蟲鳴皆於種𩔖同者相匹偶惟此二物異𩔖而相合其所不當合故詩人引以比男女之不當合而合爾非也蓋以𩔖相從者如雲從龍風從虎者也豈必專是一物哉如鵲巢之詩維鵲有巢維鳩居之鵲則喻諸侯鳩則喻夫人此亦是二物也而以為取喻夫人諸侯為匹偶詩人之所興不如是之泥也爾雅曰草蟲鳴於上風阜螽鳴於下風而風化足以見其𩔖相從矣未見君子憂心忡忡孔氏以謂婦人行嫁在塗未見君子之時父母憂之恐其見棄已亦恐不當君子無以寧父母之意故憂心忡忡然亦既見君子與之同牢而食亦既遇君子與之卧息於寢歐陽公以為不然蓋以毛鄭之徒皆以為未嫁之婦人觀此序言大夫妻能以禮自防則是指婦人既嫁而言不可指未嫁而言也言召南大夫妻能以禮自防不為淫風所染故未見君子則惟恐失於禮既見君子則其心可以降下也如出車之詩亦曰喓喓草蟲趯趯阜螽未見君子憂心忡忡亦既見止亦既覯止我心則降是詩亦是行役之詩則知此詩皆是其夫不在故其憂如此婦人以夫不在則不為容如伯兮之詩曰豈無膏沐誰適為容夫既歸則其心必降下矣鄭氏謂求於夫者薄程氏謂陟彼南山謂適於夫家言采其蕨以喻其求合於禮是皆以在途為言惟歐陽公以為婦人之見時物之變新感其君子久出而思得見之故其采蕨采薇所以感其時物之新以思其夫欲其歸也此詩惟歐陽公為得詩人之意惟是以阜螽草蟲為非匹𩔖此固不可從其餘說當從歐陽公可也黃曰詩人之情不可以言語求亦當近於人情以推之而已草蟲之詩說者不同生於草者曰草蟲生於山者曰阜螽諸家以為草蟲喓喓而鳴阜螽趯趯而從異𩔖而合非其所當合故詩人取之以為戒或以為未嫁之時見物有以異𩔖相從者日夜自懼惟恐不能以禮自全夫序曰大夫妻而說者以為未嫁之女已失其㫖矣或以為大夫妻以其大夫之行役而惟恐為淫風所染因取此物以自警焉古今皆從此說予獨以為非也夫不為淫風所化者在我而已何至於以禽蟲自喻哉且以喓喓草蟲趯趯阜螽未見君子憂心忡忡為懼感於異𩔖而憂念不已則其二章云言采其薇而我心傷悲言采其蕨而憂心惙惙是亦恐為異𩔖所感乎則其說不通矣詳觀詩文但直言喓喓草蟲趯趯阜螽未嘗言草蟲鳴而阜螽從之也詩人言此二物者記時候之變耳采薇采蕨其義亦然大夫行役之久而室家思念之切物情景態得於耳目之所接而傷時感嗟動乎心之所思草蟲鳴矣阜螽趯矣而室家思念之心於此動也如鸛鳴于垤婦歎于室蓋亦因物而感之耳曰陟彼南山言采其薇是因見采薇而動其憂念之心也曰陟彼南山言采其蕨是因見采蕨而動其憂念之心也隨其所感動其所思日月之變屢至而大夫之役未還室家憂念之情其可已乎噫日月之陽女心之傷卉木之萋女心之悲此情之所不能已也未見君子而其憂念之情如此則既見君子安得不樂不喜而不自慰哉或曰所謂以禮自防者安在曰以禮自防非謂懼為淫風所染而以禮制之也人情思極則易至於怨怨極則易至於叛召南之大夫妻雖憂念其大夫而不敢怨其上此無他畏文王之禮義而不敢為非而以禮自防爾汝墳之婦人能勉以正殷其靁之室家能勸以義草蟲之大夫妻能以禮自防文王之風化至此深矣采蘋大夫妻能循法度也能循法度則可以承先祖共音恭祭祀矣于以采蘋南澗之濵于以采藻于彼行潦音老于以盛音成之維筐及筥居吕反于以湘之維錡宜綺反及釡符甫反于以奠之宗室牖下誰其尸之有齊仄皆反季女李曰大夫妻能循法度鄭氏云女子十年不出姆敎婉娩聽從觀於祭祀納酒漿籩豆􅉁醢禮相助奠今既嫁為大夫妻能循其為女之時所學所觀之事以為法度也蘋爾雅云蘋萍之大者郭璞云今水上之浮萍也江東人謂之薸左傳云蘋蘩蕰藻之菜陸璣云藻水草也生水底有二種其一種葉如雞蘇莖大如箸長四五尺其一種莖大如釵股葉如蓬蒿行潦者道上流行之水說文曰潦雨水也方曰筐圓曰筥湘烹也錡釡屬有足曰錡無足曰釡奠置也宗室大宗之廟也禮記曰古者婦人先嫁三月祖廟未毁敎于公宫祖廟既毁敎于宗室敎以婦德婦言婦容婦功敎成祭之牲用魚芼之以蘋藻所以成婦順也觀禮記之所謂芼用蘋藻即此詩所謂采蘋采藻也禮記所謂敎於宗室者即此所謂宗室牖下也方其采蘋於南澗之中采藻於行潦之水既得之矣遂盛之以筐筥之器既盛之以筐筥之器又烹之錡釡之中既烹之矣遂置之於大宗廟戸牖之下而祭也其主此祭者誰乎乃有齊季女也王氏以為女既嫁然既嫁為大夫之妻安得稱女則知季女乃未嫁之女也然祭禮主婦設羮豈有齊季女而主祭設羮乎孔氏以謂成其婦禮非也詩人言婦人敎成之祭主於此祭者何人也乃有齊敬之季女也敎成之祭設此祭也惟其未嫁之時如此則其既嫁乃能循法度也蘇黄門曰未嫁而習之既嫁為大夫妻則終身行之所謂能循法度孝經曰非先王之法服不敢服非先王之法言不敢道非先王之徳行不敢行此卿大夫之孝也惟卿大夫之孝在於循法度故其妻亦當循法度禮記曰卿大夫以采蘋為節采蘋以其能循法度也以此觀之則卿大夫與其妻亦當循法度無違於禮也黃曰此一篇諸家之說皆非而陳少南之說為當鄭氏云女子十年不出姆敎婉娩聽從觀於祭祀納酒漿籩豆􅉁醢禮相助奠今既嫁為大夫妻而能循其為女時所學所觀之法度故曰能循法度也女子先嫁三月敎之於公宫公室敎之已成牲用魚芼用蘋藻所以成婦順故其詩曰于以采蘋于以采藻于以奠之宗室牖下蘇黄門亦謂未嫁而習既嫁為大夫妻則終身行之李迃仲亦從此說夫序者以為大夫妻說者以為未嫁之女序者特言能循法度而說者以為能循在家之法度何其費辭也蓋其說以為已嫁之婦則不當謂之季女不知女者婦人之通稱季者詩人之美辭曰季女云者猶所謂淑女也諸家既信淑女采荇采藻以供祭祀而不疑則又何疑於季女之采蘋采藻以供祭祀乎蓋其求於詩不見其循法度之意故以在家學禮之時為說竊嘗詠味此詩見大夫妻動循法度不可紊亂采蘋於澗濵采藻於行潦盛之以筐筥煮之以錡釡奠之於宗廟之明處主之以齊敬之誠心陳少南謂采之有常地承之煮之有常器奠之有常室主之有常敬故謂之能循法度可謂得詩人之㫖矣竊嘗論之人惟能不失節於屋漏暗室之中而後能不失節於十手十目之地平居不能以恭敬自養而欲一旦無失節於禮儀方行之時雖勉强莊肅而未有不進退失度者也今采蘋之大夫妻奉祀之禮不差豪􅁵非能循法度而然乎此詩與采蘩之詩其義亦皆然采蘩所以為夫人之主者特其用於公侯之宫耳左傳襄公二十八年言濟澤之阿行潦之蘋藻寘諸宗室季蘭尸之敬也隱公三年周鄭交質君子曰信不由中質無益也苟有明信澗溪沼沚之毛蘋蘩蕰藻之菜筐筥錡釡之器潢汙行潦之水可薦於鬼神可羞於王公昭忠信也二者皆取此篇之義曰敬也曰昭忠信也是皆循法度之意甘棠美召時照反伯也召伯之敎明於南國蔽芾非貴反甘棠勿翦勿伐召伯所茇蒲末反蔽芾甘棠勿翦勿敗召伯所憩起例反蔽芾甘棠勿翦勿拜召伯所說李曰爾雅曰杜甘棠郭璞曰今之杜棃爾雅又曰杜赤棠白者棠舍人注曰杜赤色名赤棠白者亦名棠以此觀之則知白者為棠其赤者為杕杜詩之所謂杕杜即赤棠也此甘棠乃白棠蔽芾毛氏以為小貎歐陽破之曰召公本以不欲勞煩人故舍息於棠下棠可容人舎其下則非小樹也蔽者謂蔽風日也芾茂盛貌觀我行其野之詩曰蔽芾其樗毛氏亦以為始生之木非也言此甘棠之下召伯聽訟之所南國之人相戒曰此木勿翦勿伐勿翦勿敗皆是斬伐之意則知拜者亦是不敢殘害也說舎也善政得民財善敎得民心善政不如善敎之得民深矣以召公之於南國其所舎之木而民相戒之以勿翦勿伐此豈有刑法驅之使然哉蓋民之愛召伯也深雖其茇舎之地而人猶不忍翦而去之則奉其敎無有不致其敬也孔子曰吾於甘棠見宗廟之欽也思其人猶愛其樹尊其人猶欽其位道也然觀召公之於南國於所舎之地民猶不忍去之至於孔子乃伐木於宋豈孔子不如召公哉盖以召公之得志天下皆知其賢故愛其甘棠而不忍伐孔子不得志天下之人莫知其聖雖木猶且伐之此不可以常理論也黃曰竊意此詩作於武王分陜之後如何彼禯矣亦在於武王之時也何彼襛矣言齊侯之子則是侯國之事不得為雅甘棠言召伯之敎則以併附之召南且甘棠之詩言召伯所茇召伯所憩召伯所說在文王時文王方為西伯而召公亦稱召伯豈有是理按燕世家云召公奭與周同姓皇甫謐以為文王庶子則決非為伯於文王時也此一篇大抵形容斯民思召伯之深而愛其所舍之木非愛其木也愛其人也愛其人則亦愛其木也召伯之敎明於南國而南國之人不忍忘之及召伯既去而思其所舍之木相與思念相與告戒曰勿翦勿伐而毁傷之也是召伯之所舍也三歎三詠不能自已則尸而祝之社而稷之遽敢加忍而毁傷之乎想其遺黎故老指甘棠以告其若子若孫而誦召伯所敎使之世守而勿忘也據此只言是召伯聽男女之訟不忍重傷其民而舎於甘棠之下故國人說而思之云耳而作序者發明之曰召伯之敎明於南國蓋謂斯民之所以思召伯者非止於不勞民力一事也善政得民財善敎得民心善政不如善敎之得民也吾觀召伯之敎不惟當時之不能忘而後世亦有所不能忘召旻之序曰旻閔也閔天下無如召公之臣也觀後世之所思則知當時之所愛也矣昭公二年晉侯使韓宣子來聘公享之有嘉樹焉宣子譽之武子曰宿敢不封植此樹遂賦甘棠宣子曰起不堪也無以及召公若宣子者亦可謂自知也定公九年鄭駟歂殺鄧析而用其竹刑君子因舉是詩以責之以為思其人猶愛其樹況用其道而不恤其人乎君子之以責駟歂者是矣然以竹刑比召伯之甘棠者則過也雖然召公所舎之木人猶不忍去之孔子大聖人也而伐木於宋葢宋人能伐其木而不能廢萬世之俎豆南國思召伯甘棠於一時而學者思孔子杏壇於萬世孰謂吾夫子之不幸行露召伯聽訟也衰亂之俗㣲貞信之敎興彊暴之男不能侵陵貞女也厭於葉反浥於及反行露豈不夙夜謂行多露誰謂雀無角何以穿我屋誰謂女音汝無家何以速我獄雖速我獄室家不足誰謂鼠無牙何以穿我墉誰謂女無家何以速我訟雖速我訟亦不女從李曰衰亂之俗紂之俗也文王之敎既興則紂之俗可以革貞信之敎興則雖有彊很暴虐之男不能侵陵貞潔之女男雖侵陵貞女而女終不肯從惟其不能侵陵貞女此召公之所以聽訟而決斷之也按禮記曰一成而北出再成而滅商三成而南四成而南國是疆五成而分周公左召公右則召公之為伯乃是武王之時而此甘棠之詩與行露之詩皆稱為伯者亦當追稱之耳厭浥行露毛氏謂濕意也鄭氏謂仲春之月令㑹男女之無夫家者言我豈不知當早夜成昬禮謂道中之露大多故不行爾歐陽以為不然男女淫奔豈更須仲春合禮之月遂以行露為非取喻言有露之時不欲早行以其多露不敢行豈有為淫奔之行哉此說未善詩之大意行露乃是喻耳王氏雖以為取喻乃以謂露之為物犯之則濡而天之所以成物也禮之為物犯之則汚亦人之所以成物也故詩人以露比禮行多露則人雖有夙夜之心而莫敢犯者為其濡故也國多禮則人雖有昬姻之心而莫肯犯者為其汚故也行於露中則濡固然矣行於禮安有所為汚邪犯非禮則汚矣惟蘇氏以為我非不欲早行以其多露故不敢行女子非不欲為室家以其强暴有所不可此說得之矣惟女子之自守如此故下文繼之曰云云此以見强暴之男而不敢侵陵貞女也王氏以謂雀穿屋以角而雀實無角而誣易見䑕穿墉以牙而䑕有牙其誣難知此說不然龜山以為䑕無牡齒誰謂鼠無牙謂無牡齒耳說文曰牙牡齒也則知龜山為信陸農師又以謂雀有咮而無角䑕有齒而無牙誰謂雀無角所以得穿我屋者非以角乃以咮也誰謂䑕無牙所以得穿我墉者非以牙乃以齒也故取喻以為女非無室家之道若謂無室家之道則何以速我於訟當時男子誣女子嘗有室家之約故雖召我獄其實誣之也惟召公能決其獄則誣罔者可以自明矣以男子雖召伐獄而室家之道終不足以言不與汝為夫婦也大學曰聽訟吾猶人也必也使無訟乎無情者不得盡其辭大畏民志蓋不善聽訟者則巧辭者得以逞其姦木訥者無以訴其冤矣惟善聽訟者則無情者不得逞其志盡其辭無情者既不得盡其辭則有情者皆得盡其辭矣如所謂雖速我獄室家不足是所謂有情者得以盡其辭也按易之訟其初六曰不永所事小有言終吉象曰不永所事訟不可長也雖小有言其辨明也女子之訟正得訟卦之初六陰柔之卦今也女子為强暴之男侵陵而女子不從以速我於獄今召伯聽訟終為之斷其情豈非其辨明乎說者以文王之化徒及於正信之女而不能以善而化之乃使至於訟夫聽訟吾猶人也必也使無訟乎聽訟固未能至於無訟然其風化自文王即位之始安能變紂之淫風而遽至於無訟乎為是說者不足以病文王也黃曰此詩雖在召公甘棠之後而乃在於文王之時或問曰子既以前一詩為武王時作而乃復以後一詩為文王之時可乎曰前後次第之失倫則後世之罪非作詩者之罪也且此兩詩之意甚明特學者習而勿察耳據前一詩乃是召伯聽訟之時不忍重傷其民而舎於甘棠之下故南國之民思之而作甘棠而此一詩乃是為召伯聽訟而作是行露作於召伯聽訟之日而甘棠作於召伯已去之後則予謂此詩為文王之時作不亦順乎曰子既以召公在文王時未嘗稱伯則此詩言召伯聽訟何也曰前詩言召伯所茇乃是詩人之辭此詩所謂召伯聽訟是乃作序者之辭如詩言文王則是武王成王時詩序言文王則是文王時詩亦無害也或者又曰文王時未嘗分陜而又有召伯聽訟之句何也曰分陜則無之而聽訟則有何不可詳觀此詩乃是女子自訴之辭謂予豈不早夜而行之哉恐多露之汚吾衣耳女子貞潔雖衣服猶恐沾汚如淫奔之詩曰無感我帨兮恐其汚我之帨也女子之貞潔如此而强暴之男乃欲侵陵之然事固有出於横逆之所加而不可以意曉者而惟明者能辨之雀有咮而無角固也然雀無角而能穿屋誰信雀之無角乎䑕有齒而無牙固也然䑕無牙而能穿墉誰信䑕之無牙乎貞潔之女與强暴之男固無室家之道也然今乃速我於獄訟誰信無室家之道乎是其不可以意曉而惟召伯能明之故繼之曰雖速我訟亦不女從以見召伯聽訟之明也易之訟初六曰不永所事小有言終吉象曰雖小有言其辨明也行露之訟正得訟之初六之意歟蓋陰柔之卦乃初六也猶善柔之女為强暴之男所廹以召伯之聽訟而强暴之男不能侵陵正女非其辨明乎或問曰當文王之時關雎鵲巢之化行而猶有强暴之男淫奔之風何也曰當是時周家正信之敎方興而商人衰亂之俗未殄此如一陽來復之時陽雖有當盛之勢而五陰猶未却以遜陽則草木之摧敗猶所不免自二南極而至於王道之盛則自復而臨自臨而泰之時也孔子曰片言可以折獄者其由也歟又曰聽訟吾猶人也必也使無訟乎人能片言折獄則巧辯者無所施其姦木訥者得以盡其辭然能聽訟而未能使之無訟則亦未足為風化之至故自大車之序而觀之則行露之詩固已為召伯能聽訟之事自虞芮質成文王蹶生之詩觀之則召伯之聽訟又不若文王之使無訟也羔羊鵲巢之功致也召南之國化文王之政在位皆節儉正直德如羔羊也羔羊之皮素絲五紽徒何反退食自公委於危反蛇音移委蛇羔羊之革素絲五緎音域委蛇委蛇自公退食羔羊之縫符龍反素絲五緫子公反委蛇委蛇退食自公李曰此詩言文王之化召南之國凡在位者皆節儉正直王氏云所謂文王之政者非獨躬行之敎則亦有慶賞刑威存焉王氏之說以周南為聖人之風召南為諸侯之風故其說經與周南而下召南觀孔子之言曰政者正也子帥以正孰敢不正則其所謂政者不務躬行之敎不可也又嘗曰為政以德為政必本於德則政專在慶賞刑威不可也德如羔羊者言其在位之有德如羔羊之詩所言也亦知所謂麟趾之時也孔氏曰衣服多矣何以獨羔羊為裘按宗伯注云羔取其羣而不失其𩔖士相見注云羔取其羣而不黨公羊傳何休云羔取其贄之不鳴殺之不號乳必跪而受之亦如今言大夫之能羣而不失𩔖行不阿黨然觀此詩言羔羊之皮素絲五紽言其節儉也下文言退食自公委蛇委蛇言其正直也以羔羊為裘而五緫可以見其節儉非謂如羔羊之節儉也使羔羊果能節儉正直以為德如羔羊猶可而羔羊未必耳何孔氏云爾者是求其說而不可得故為是說也羔羊毛氏曰小曰羔大曰羊是特辨其名爾詩之意蓋言以羔為裘如羔裘晏兮亦是以羔為裘故也羔亦名其為羊也革毛氏以為猶皮也說文曰獸皮治去其毛曰革故周禮掌皮秋斂皮冬斂革固不同𩔖毛氏以革為皮故孔氏以為對文言之則異散文則皮革通也緎爾雅曰羔裘之縫也以為五緎既為縫則五紽五緫亦為縫也諸家之說五紽五緫皆未甚分明故予竊以私意求之蓋謂五次縫之以羔裘之或綻或弊五次縫之可以見其節儉也退者自朝之辭禮記曰朝廷曰退是也惟退為自朝之辭則知自公門也鄭氏謂退食為減膳從公為正直順於事其說不通矣委蛇委蛇韓詩作逶迤毛氏則以為行可蹤迹鄭氏則以為自得之貌按左氏襄七年衞孫文子來聘且拜武子之言而尋孫桓子之盟公登亦登穆叔曰孫子必亡為臣而君過而不悛亡之本也詩曰退食自公委蛇委蛇謂從者也衡而委蛇必折委蛇者順於道則可逆於道則必折之左氏之意謂委蛇為自得也言召南之在位其心無邪故能雍容自得蓋人能平其心則無入而不自得其心不平矣安能雍容自得也詩言退食自公委蛇委蛇雖不言其正直而正直之意自見此以見詩人可謂善形容者矣下文委蛇委蛇自公退食委蛇委蛇退食自公其意一同但便其韻也黃曰詳觀此詩乃知二南皆是文王之風化初無淺深之辨序者曰鵲巢之功致蓋大其始於閨門而後及於在位此人倫既正朝廷既治之效也曰鵲巢之功致亦如桃夭言后妃之所致為之於此而自化於彼豈有刑法之所驅哉德如羔羊先儒以為取其羣而不失其𩔖公羊傳何休云取其贄之不鳴殺之不號乳必跪而受之故詩人取而形容其在位者之德然觀此詩言羔羊之皮素絲五紽特言以羔為裘而以素絲組之初非以羔羊比在位之德也其曰德如羔羊謂如羔羊之詩所言耳如關雎樂得淑女是關雎之詩樂得淑女也仁如騶虞是仁如騶虞之詩所陳者也則德知羔羊其義亦然鄭詩言羔裘如濡洵直且侯唐詩言羔裘豹袪自我人居居孔子鄉黨言緇衣羔裘則是古者以羔為裘亦在位者之服今召南之在位者之服化文王之政躬自節儉不事華侈一羔裘而五縫之不惡其敝也鄭氏又以退食自公為減膳委蛇為自得夫以委蛇為自得則近之以退食為減膳則非也詩人但言在位者退朝之時其出公門入私門有和緩之容無私交之行以見其正直之德耳蓋人惟心無欺故其進退無愧而容止可觀詩人不形容其節儉正直之事而特形容其自得之意則其德自可見左氏襄公七年衞孫文子來聘公登亦登而穆叔知其必亡因舉退食自公委蛇委蛇之句以譏之蓋衞孫文子素無正直之心故其進退自無和易之容也吁文王躬行於閨門而化及於在位禮義之感人何其速歟楊綰清儉一旦為相而郭子儀為之減坐中聲樂五分之四京兆尹黎幹騶從甚盛即日首之止存十騎中丞崔寛第舎宏侈亟毁撤之若楊綰何足以語文王之化而亦足以見禮義之感人動物如此之亟哉殷其靁勸以義也召南之大夫逺行從政不遑寧處其室家能閔其勤勞勸以義也李曰召南之大夫逺行從政不遑寧處言奉使施命於天下不遑寧居其室家能閔其勤勞勸以義也男曰室女曰家召南大夫之妻而乃曰室家者說詩者不可泥於一字之間也毛氏以召南之大夫為召伯之屬孔氏云文王未稱王召伯為諸侯之臣其下不得有大夫所謂召南之大夫非必召伯之臣也自陜而西而南方之國皆召南之大夫也黃曰召南之大夫說者以為召伯之屬然文王之時召公尚未分陜文王未嘗稱王召公為諸侯之臣而其下安得有大夫或者問曰詩序言召南之國召南之大夫何也曰此特别其非周南之詩爾豈謂在文王之時召公已有其國已有其大夫哉曰召南之國召南之大夫是後世作序者之辭而非當時作詩者之辭也故周南之汝墳召南之殷其靁皆婦人被文王之化而知君臣之分閔其夫之勤勞而復以君臣之大義勉之則文王之化深矣殷其靁在南山之陽何斯違斯莫敢或遑振振音眞君子歸哉歸哉殷其靁在南山之側何斯違斯莫敢遑息振振君子歸哉歸哉殷其靁在南山之下何斯違斯莫或遑處上聲振振君子歸哉歸哉李曰殷雷之聲也南山之陽山南曰陽也側者山之左右也下者山之足也違者去也遑者暇也振振信厚也鄭氏謂雷以喻號令揚子曰鼓舞萬民者其惟號令乎鼓舞萬物者其惟雷風乎雷不一風不再是以雷而喻號令也蘇氏以雷在南山之陽不可得而見亦猶召南之大夫逺行從政其妻思見之而不可得其說不如鄭氏至王氏雖以雷喻號令而以南山之陽謂宣明君之號令以南山之陽取喻明君其說不通王氏以謂在南山之陽謂明君之號令則在南山之足将明而晦矣此其說可以攻王氏之膏肓也上既言殷其雷在南山之陽既而在山之側既而又在南山之下此言雷之在此復在彼以見召南之大夫逺行從政在彼又在此以見勤於王事也下文繼之曰何斯違斯斯此也王氏以上斯為君子下斯為此不如鄭氏皆為此也言何以為在此今又去此也以見不遑暇處之意奉使未嘗遑暇既在此又在彼其勤勞如此其妻又勸之以義曰信厚君子未可以歸見其妻賢也其室家能閔其勤勞即汝墳所謂婦人能閔其君子勸以義即汝墳所謂猶勉之以正也王氏則以為此詩未若汝墳之盛故繫之召南王氏之說多生分别謂周南周公也故其詩乃聖人之事召南召公也故其詩乃賢人之事遂以摽有梅不若桃夭小星之詩不若樛木殷其雷之詩不若汝墳者皆分别錙銖之輕重豈知詩人之意哉夫汝墳之勉以正殷其雷之勸以義盖其義同其辭則異耳黃曰殷其雷在南山之陽鄭氏以為雷喻號令蘇氏以為在南山之陽不可得見亦猶召南之大夫逺行從政其妻思見之而不可得李迃仲以雷在南山之陽既而又在南山之側既而又在南山之下以喻大夫逺行從政既在彼又在此以見勤於王事然詳味此詩乃是興也非比也夫行者遇雨則思居者之安居者遇雨則思行者之勞此人情之所同然也召南之大夫妻聞雷聲在南山之陽因念其夫行役之勞曰何日至此南山之陽乎抑其已違此乎想其不敢遑暇而少息於此也因聞雷之聲而動其思念之情南山之側南山之下皆是一意但便其韻以協聲耳不必求其異義也振振信厚也既以情閔之復以義勸之曰振振君子歸哉歸哉勉其以信厚之德而絶其思歸之念也夫君雖以虐遇我而不敢萌一怨心者惟信厚君子能之若大夫妻可謂能以義勸其君子矣大夫不均我從事獨賢我入自外室人交徧摧我皆怨望之辭也國人則矜其車甲婦人能閔其君子知閔其勤勞而不知勸以義也召南之大夫妻可謂不以家忘國不以情廢義不以私害公此實人之所難也而婦人有能之者昔王陵在漢母在楚漢使至其母泣告之曰願為妾語陵善事漢王無以妾故持二心遂伏劔而死吁有若是婦人也哉摽婢小反有梅男女及時也召南之國被文王之化男女得以及時也摽有梅其實七兮求我庶士迨其吉兮摽有梅其實三兮求我庶士迨其今兮摽有梅頃音傾筐塈許既反之求我庶士迨其謂之李曰商紂之世風化既衰男女淫奔故嫁娶多失時至被文王之化衰亂之俗微正信之敎興故男女各得及時而嫁娶也桃夭之詩則言周南之國男女各得其時此詩則言召南之國男女各得其時以見文王之化所及者逺矣摽落也迨及也塈取也梅之落也始見其實之多其見在者有七已而其實之少其見在者有三既而則盡落矣故頃筐取之於地毛鄭之說以迨其吉兮謂女子之嫁宜及其善時善時謂年二十雖夏未大衰迨其今兮謂其急辭迨其謂之謂男女之相奔不禁按詩序曰召南之國被文王之化男女得以及時若以為雖夏未大衰則是既失男女之時矣況所謂男女相奔而不禁文王之化既被召南則無有淫奔之俗矣今尚相奔而不禁何足以為文王之化哉毛氏以為男女相奔而不禁蓋泥於周禮媒氏之云媒氏相奔不禁蓋禁下文若無故而不用令者罰之而言之說者徒見媒氏相奔不禁之文謂成周之政相奔者不禁是不詳考周禮之文也今此詩所言者當從歐陽之說謂梅之盛時其實落者少而在者七已而落者多而在者三已而遂盡落矣詩人之意以摽有梅為戒言盛年難久當及時求庶士以相合也桃夭之詩盡言男女及時如桃之少壯此詩言男女及時則以梅落為言則是以梅為戒也吉歐陽以為宜言取其宜為㛰姻者而求之也今歐陽以為時今不必謂時但言可嫁娶則行也謂歐陽以為遣媒妁相語以求之也王氏乃以為梅實於仲春之時則宜嫁娶今梅實摽落已失㛰姻之時也其說與毛鄭不甚相逺是皆不詳考之於詩故其說至於此也黃曰此一篇與桃夭之詩同義桃夭以桃為喻摽有梅以梅為喻皆取其及時之詩耳王氏曲為之說且謂梅實於仲春則宜嫁娶今梅摽落則已失㛰姻之時果知是說則豈男女得以及時之義乎迃仲謂詩人之意以梅為戒言盛時之難久常如此是亦非詩人形容文王風化之意予以為其實七兮自七而三自三而至於頃筐塈之猶女子自少年及於盛年而至於將嫁之時求我庶士迨其吉兮諸家多以為取其時之吉予以為衆士之求我而必擇其吉士以從之迨其今兮毛鄭以為急辭予以為當其時也迨其謂之毛鄭以為男女之相奔不禁固已害理少南謂此時可以言許也亦未為盡予以為男女固欲及時而亦必以正雖盛年之當嫁亦必待父母之命媒妁之言也然桃夭言㛰姻及時而此詩言得以及時云者謂僅及時也以時云者從容乎其時也二詩之作亦有間矣小星惠及下也夫人無妒忌之行惠及賤妾進御於君知其命有貴賤能盡其心矣李曰鄭氏曰以色曰妒以行曰忌然所謂妒忌者不必分别色與行也如所謂妒賢嫉能者豈是行與色哉序曰夫人無妒忌之行則行亦謂之妒明甚豈可分别行與色哉夫人無妒忌之行故有恩惠及於賤妾使得以進御於君所而賤妾亦知以禮命與夫人貴賤不同此所以能盡其心也夫以恩惠及於衆妾而衆妾能盡其心施報之道王氏乃謂言惠而不及於仁言行而不及於德此召南之事也此皆泥於周南之下若以召南言惠而不及仁則仁如騶虞非仁而何若以為言行而不及德則德如羔羊非德而何此皆王氏之鑿也黃曰江沱之嫡不以其媵備數媵遇勞而無怨則美在嬪妾而罪在夫人莊公之嬖妾上僭莊姜賢而不答則美在夫人而罪在嬖妾是故夫人不能無妒忌是之謂無其德衆妾不能盡其心是之謂不知命小星之夫人惠及賤妾而賤妾雖得進御於君亦知其命有貴賤眞可為萬世閨門之法也嘒呼惠反彼小星三五在東肅肅宵征夙夜在公寔命不同嘒彼小星維參所林反與昴肅肅宵征抱衾與裯直留反寔命不猶李曰毛氏以嘒為微貌王氏以謂小明小星無名之小星也毛氏以為三心五噣四時更見按詩三星在天綢繆束薪三星鄭氏說一則為心星一則為參心列宿之大房心參伐心與參皆三星今此云三五在東焉知其非參心邪其所以為心星者蓋以下文惟參與昴昴六星則五非下章昴也五既非昴則三亦非參也噣星者柳星也元命苞云柳五星爾雅云咮謂之柳天文志云柳為鳥喙則喙者柳星也以其為鳥星之口故謂之喙也參天文志云參白虎宿二星直下有三星元命苞云昴六星小星以譬賤妾也三五以喻夫人也以衆星之小同列於三五參昴之舎以次列見於天亦猶賤妾之卑以次進御於君所也故下文曰肅肅宵征夙夜在公寔命不同此言賤妾進御於君也肅肅疾行也宵征夜行也言衆妾肅肅然夜行或早或夜在於君所或夜來早往或早往夜來不敢當夕者寔禮命之數不得同於夫人也衾被也裯牀帳也諸妾夜行抱被與牀帳進御於君不得當夕者則以禮命不若夫人之尊也蘇氏云肅肅宵征夙夜在公寔命不同此以見衆妾自謂卑賤不敢與夫人齒之辭也夫人能無妒忌之行故衆妾感其恩不敢與夫人齒以見夫人稱其職衆妾報其上也王氏之說則謂三五陽星也夙夜在公陽事也故以陽星況之參昴隂星也抱衾與裯隂事也故以隂星況之然按詩肅肅宵征夙夜在公亦是隂事安得以為陽事王氏之鑿𩔖多如此黃曰嘒彼小星為衆妾之喻三五在東為夫人之喻三心也五噣也衆星隨心噣在天猶衆妾代夫人以御君子宵征即所謂進御也肅肅敬也雖進御於君而不敢忘敬故亦不敢恃恩以慢事此知命之賤而不敢與夫人齒也維參與昴參伐也昴留也亦衆星之所尊者也寔命不猶申言其命之不同也夫惟女子與小人為難養也近之則不孫逺之則怨今衆妾雖得進御於君而益自知命夫人有餘恩而妾有餘敬想其閨門之中和氣所聚其樂可勝言哉故曰閨門萬世之法也江有汜音祀美媵也勤而無怨嫡能悔過也文王之時江沱之間有嫡不以其媵備數媵遇勞而無怨嫡亦自悔也江有汜之子歸不我以不我以其後也悔江有渚之子歸不我與不我與其後也處江有沱徒河反之子歸不我過不我過其嘯也歌李曰古者嫁女以姪娣從謂之媵春秋書齊人來媵晉人來媵公羊曰諸侯一娶九女二國媵之以姪娣從有嫡不以其媵備數媵遇勞而無怨者嫡逸媵勞此理之常媵之遇勞何怨之有詩人以為媵遇勞而無怨者則以其不備數雖遇勞而無怨然後為賢也惟其無怨故嫡自悔過也程氏謂不以媵備嫡妾之數而侍君是也孔氏謂宜為媵而不得行心雖勤勞而不怨於嫡蓋言嫡專寵不得與之偕行其說非矣既不得為媵又豈有勤勞之事孔氏遂以為勤者心企望之企望之而不得所以成勞此說皆非夫人以備數則遇勞而甘心焉今旣不以其備數而遇勞則人之情不能無怨人之所怨而已獨不怨此其所以為賢也江沱按禹貢岷山導江又東别為沱為梁州之域也江沱之間即梁州之界也此詩言江有沱江有渚亦如漢廣之詩言江漢也漢廣之序曰美化行乎江漢之域是知作詩者在江漢之間也故其詩謂漢之廣矣不可泳思江之永矣不可方思故指江漢以為言今此作詩者乃在江沱之間故亦曰江有沱江有渚江有汜皆詩人所見也王氏謂汜之别甚於渚渚之别甚於沱遂以喻夫人專寵益甚程氏則謂汜與沱之小者洲渚之岐則大矣沱之别幾於𩔖矣言水之分流以喻夫人不專寵益甚一則以為夫人專寵益甚一則以為夫人不專寵益甚要之詩人本意不如此詩人之意但以謂江則有汜有渚有沱夫人則有媵今夫人固當有媵也今之子于歸歸者嫁也不我以鄭氏謂與也言夫人不我與也不我與其後也則能悔過處止也言悔過自止也其嘯也歌此為不怒也小星之詩則為夫人者當如此江沱之詩則為媵者當如此夫人欲衆妾之盡其心則必使之進御於君而衆亦自然能知貴賤不同而不敢與夫人齒妾欲夫人之悔過則必遇勞而無怨而夫人自然悔過也大抵不怨者乃是使人悔過之道也以舜之為人子勞而無怨雖其父不肖猶使之底豫況不為瞽瞍者乎學詩者能以此詩推之而知所自反為人子為人臣者皆可為消怨之道不獨媵之於嫡也黃曰嘗誦詩至此蓋喟然而歎曰居上者當如小星之夫人居下者當如江汜之媵妾雖然小星之夫人惠及賤妾而衆妾盡其心此固美事也使夫人不能如小星而如江有汜則衆妾亦將不盡其心乎為人子者必待父之慈而後孝為人弟者必待兄之友而後敬為人臣者必待君之聖而後忠則其為孝為敬為忠亦不足道矣夫人而惠及賤妾則妾媵之心固所當盡夫人而不以媵備數媵妾之心尤不可以不盡故小星之妾能盡其心知命者也江沱之媵勤而不怨亦知命者也江沱按禹貢岷山導江東别為沱是江沱乃岐西之地也居江沱者而以江沱起興亦猶居汝水者以汝墳起興居漢水者以江漢起興謂江有汜有渚有沱猶嫡之必有媵妾也諸侯一娶九女二國媵之以娣姪從之則嫡之於媵其貴賤不同而恩不可以不及故此詩之意謂江尚有沱有渚有汜而夫人之於媵妾乃不我用不我與不我過其不以我備數如此然嫡尊而媵卑嫡逸而媵勞命也我其可有怨心乎在我者惟當盡其心而已惟媵能不怨故嫡亦自悔始雖不我與而終乃與我同其處也始雖不我過而其終乃與我同其歡也嗚呼天下豈有誠而不動之理哉人惟能誠於暫而不能誠於久未為一善而已先責人之不我報則其不能感動人物也固宜江沱之媵妾愈勤而愈不敢怨若將終身焉此非勉也誠也誠之至天理之所感發夫人安得而不自悔乎此至誠悠久之效也舜處父子之難而益盡其孝文王處君臣之難而益盡其敬皆此心也吾以是知此詩不特可以為媵妾之戒凡為人子為人弟為人臣者亦當以是為法野有死麕俱倫反惡烏路反無禮也天下大亂彊暴相陵遂成淫風被文王之化雖當亂世猶惡無禮也野有死麕白茅包之有女懷春吉士誘之林有樸蒲木反樕音速野有死鹿白茅純徒本反束有女如玉舒而脫脫勑外反兮無感我􅍤始銳反兮無使尨美邦反也吠符費反李曰言紂之時彊暴之男侵陵貞女遂為淫亂之俗至被文王之化雖當時風化既衰而人皆知無禮之為可惡也文王之化能變紂之汚俗則衰世之公子宜若難化乃能使之信厚紂之亂世宜若淫奔莫之能革而文王之化乃能使之惡無禮蓋方其從汚俗之中則不知非禮之為可惡也文王躬行於上則民知非禮之可惡則知禮之為可從也齊人以麕為獐則麕者獐也此有三說鄭氏之說則為亂世之民貧而彊暴之男多行無禮故貞女之情欲令人以白茅裹束野中田者所分麕肉為禮而來然按昬禮用鴈幣未聞用麕肉也王氏遂以為昬禮贄不用死今用死則非禮之正也然猶不為無禮其說與下文不相貫惟歐陽公以為紂時男女淫奔以成風俗惟周人被文王之化者為能知亷恥之潔不使為物所汚奈何彼女懷春吉士遂誘而汚以非禮吉士猶然彊暴之男可知矣有女懷春思春以男女相會也吉士誘之毛氏以為誘道也鄭氏以為使媒人道成之王氏以為不能無懷也然吉士誘之豈是美辭哉所以責之之辭也言有女懷春而吉士可以誘之乎吉士猶善人也吉士乃誘人之女何足為吉士哉乃痛責之樸樕小木也歐氏王氏以林有樸樕為一意野有死麕白茅包之為一意歐氏以林有樸樕之木猶可用以為薪王氏則謂林之有樸樕雖小而可免於陵踐夫白茅純束皆是連於林有樸樕之文不可但以為連野有死麕之文邵氏以為樸樕之中及野有死鹿皆可以白茅純束以為禮然觀詩又以謂林有樸樕野有死鹿其文不相對不當言樸樕之中及野有死鹿也惟蘇氏以樸樕小木也將取樸樕死鹿以為用猶知以白茅純束而取之況於有女如玉而可不以禮成之哉然不知當時白茅之束樸樕當何用姑且從蘇氏脫脫舒遲也􅍤佩巾也尨狗也歐陽謂淫奔之俗相戒曰汝無疾走無動我佩無驚我狗吠彼奔未必能動我佩蓋其淫奔恐其見疑也不如鄭氏以為奔走失節動其佩飾非禮相陵則狗吠其說得矣蓋此乃相戒以無犯非禮則其容舒遲其心安閒其與疾行妄動氣息茀茀者異矣孟子曰人能充無欲害人之心而仁不可勝用矣人能充無穿窬之心而義不可勝用矣嘗以謂人能充無感我􅍤之心則禮不可勝用矣黃曰此一篇皆詩人責淫奔之辭而毛鄭之說皆失其義謂野有死麕白茅包之為凶荒則殺禮而多昬故以麕肉為禮有女懷春吉士誘之謂仲春嫁娶之時男子當使媒妁以誘導其女夫麕非昬禮所當用也誘非正禮之所當為也毛鄭之說可知矣歐陽謂吉士且爾彊暴之男可知則是舉召南之國皆淫奔者也安有是理哉無感我􅍤兮無使尨也吠諸家以為奔走失節則動其巾􅍤非禮相陵則見吠於犬此皆誦詩而不可以興者也予以為前一章為責男子之辭次一章為責女子之辭末一章則惡無禮而欲逺之之辭易曰藉用白茅无咎子曰苟錯諸地而可矣藉之用茅何咎之有謹之至也茅之為物薄而用可重也故此言野有死麕之肉人且以其可食之故而包之以白茅之潔惟恐為物所汚況吉士可以誘懷春之女哉此深責男子之辭如氓之詩美反正刺淫泆亦曰士之耽兮蓋以吉士責之而使之知愧耳林有樸樕之薪野有死鹿之肉以其可用可食而束之以白茅況如玉之女其可以不自愛乎此深責女子之辭如蝃蝀止奔之詩曰女子有行蓋以女子責之而使之知愧耳至末章又深惡其無禮而欲逺之曰女無疾行無動我􅍤無驚我犬夫彼之疾行未必能動我佩驚我犬也是特惡之之辭耳如谷風刺夫婦失道之詩言毋逝我梁毋發我笱未必果逝我梁發我笱也惡之之深故亦逺之之深此一篇所以為惡無禮之詩歟或問曰江漢無思犯禮而此復惡無禮何也曰當商之末衰亂之俗猶存文王安能使人之盡知禮哉向也天下大亂彊暴相陵遂成淫風則不知無禮之可惡今被文王之化而羞惡之心不能自已此所謂正信之敎興也如衞人化其上淫於新昬而棄其舊室至文公能以道化其民而淫奔之恥國人不齒此詩所謂猶惡無禮者亦幸之之辭歟毛詩集解卷三
