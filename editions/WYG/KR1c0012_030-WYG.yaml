body:
  text: 毛詩集解卷三十宋李樗黄櫄撰文王之什詁訓傳第二十三大雅文王文王受命作周也文王在上於昭于天周雖舊邦其命維新有周不顯帝命不時文王陟降在帝左右亹亹文王令聞不已陳錫哉周侯文王孫子文王孫子本支百世凡周之士不顯亦世世之不顯厥猶翼翼思皇多士生此王國王國克生維周之楨濟濟多士文王以寧穆穆文王於緝熙敬止假哉天命有商孫子商之孫子其麗不億上帝既命侯于周服侯服于周天命靡常殷士膚敏祼將于京厥作祼將常服黼冔王之藎臣無念爾祖無念爾祖聿修厥徳永言配命自求多福殷之未喪師克配上帝宜鑒于殷駿命不易命之不易無遏爾躬宣昭義問有虞殷自天上天之載無聲無臭儀刑文王萬邦作孚李曰說詩者徒見詩序言文王受命作周遂以為文王受天命而作天子甚矣說詩者之惑也孔子稱文王曰三分天下有其二以服事殷周之徳可謂至矣文王之所以大過人者正在於事商而已使其受命稱王則事紂之心果安在哉孔子之言可謂善尊文王也世之說者是欲尊之而反卑之也自漢劉歆作三統歴始言文王受命九年而崩至於賈逵馬融韋昭王肅皇甫謐之徒皆和其說又益以䜟緯符命之書此固不足辨矣然以其六經之書稱渉疑似者據以為說此則不可不辨也武成曰我文考文王克成厥勲誕膺天命以撫方夏維九年大統未集故受命九年其說多出於此武成所謂誕膺天命即此詩所謂受命作周也其意以謂天之命我周家實肈於文王之時矣周雖舊邦其命維新言周王業始於文王也赫赫宗周襃姒烕之言周業之將亡始於襃姒也若據其實迹而言之則文王未有天下乃武王也襃姒未嘗滅周乃赧王也詩書之中蓋皆歸功於文王爾文王實未嘗自稱王也說者又謂文王世子武王謂文王亦曰西方有九國焉君王其終撫諸其曰君王則是文王生而稱王也此亦非也史記曰嫗乎采芑歸于田成子夫田常之時安知其為成子而稱之禮記之所謂君王史記之所謂田成子也乃後世之追稱也出車之詩曰王命南仲指文王也天子命我指紂也既自天子命我以見文王以天子之命命將帥也而又曰王命南仲出車之詩亦是後人追作其曰王者乃追稱也詩書之中追稱者甚多若一一以為自稱則害理者多矣而小蘇亦曰虞芮質厥成文王伐黎而戡之東北咸集詩商之孫子其麗不億上帝既命侯于周服文王於是受命稱王此亦錯㑹作詩者之意此詩之作乃在於成王之世何以知之詩中言無念爾祖則知其為成王之時無疑矣詩之所引商之孫子者乃戒成王爾非文王之時商之孫子皆在於文王之朝也小蘇之說亦然況其下乎惟蘇東坡游定夫辨之詳矣東坡曰昔漢髙祖擊滅項籍統一四海諸侯大臣相率而帝之終且辭以不徳惟彼陳勝呉廣乃囂囂乎急於自王而謂文王亦且為之邪武王伐商師渡孟津㑹于牧野其所以稱君之命命於諸侯者蓋猶曰文考而已至於武成既以柴望告天百工奔走受命於周而後稱曰我文考文王克成厥勲由是觀之則是武王不敢一日妄尊其先君而況於文王自王乎游定夫曰禮記大傳載牧野之文追王大王亶父王季歴文王昌亦據武成之書以明追王之意出於武王也世之說者因中庸無追王文王之文遂以謂文王自稱王豈未嘗攷泰誓武成之書乎君臣之分猶天地尊卑紂未可去而文王稱王是二天子也當六國之時新垣衍欲帝秦魯仲連以片言折之不敢復出口蓋名分之嚴如此曽謂至徳如文王者反盜虚名而拂天理乎二公之言可謂善為文王觧紛矣由是觀之以文王為自稱王是處文王於漢祖魯仲連之下也前世諸儒謂古之聖人自稱為王者多矣或以伊尹為即位於太甲之七年又以周公為踐天子之位稱王以朝諸侯又以孔子修春秋立素王嗚呼以小人之情而度君子之心則亦何所不至哉此數聖人者其於君臣之間豈不明甚而後世紛紛之議以至於此可勝歎哉言文王之在民上其徳昭于其天故天錫之以造周之命曰周雖舊邦其命維新此特指周之上世而言之也蓋周自后稷以來至於王季其積行累功非一日其邦則舊矣至天命文王始新也此蓋推尊文王之言也大王肈基王迹則王迹肈基於大王矣然至文王之時最為盛故詩人以受命言之君子於是言曰有周之徳豈不顯乎言周之徳顯也天之所以命周者豈不是乎言天之所以命周者是也時是也天之所以命文王者豈私文王哉蓋文王俯仰之間常若在帝之左右以見文王之所為上當天意也中庸曰鬼神之為徳其盛矣乎視之而弗見聽之而不聞體物而不可遺使天下之人齊明盛服以承祭祀洋洋乎如在其左右所謂在帝左右者即中庸所謂如在其左右者是也蓋天人之際雖逺而實相通文王之徳純一而常若帝之臨乎其側故天之命文王亦如影響也亹亹文王亹亹勉勉也國語曰亹怵惕宋丞相以為經典相承作亹勉也說文無此字徐鉉以為字當從女從尾改之驚俗惟文王亹亹故其令聞亦不已蓋有實者必有名也孟子曰原泉混混不舎晝夜盈科而後進有本者如是苟為無本七八月之間雨集溝澮皆盈其涸也可立而待也文王之勉勉正猶原泉之混混也使其勤未幾而怠繼之則其涸可立而待又安能不已乎惟文王之令聞如此故天眷祐周家而錫命之無有窮極也陳久也錫之甚乆至於子孫皆受其福也諸家之說以陳錫為一事以哉周為一事其說難通陳錫哉周蓋言乆錫於周也其言哉者語辭也正如所謂嫗乎采芑歸于田成子之類也天之乆錫周家故文王之子孫嫡為天子庶為諸侯其祚至百世非特文王之子孫也凡周之士亦世世而顯也文王之徳天既錫之以造周之命又及其子孫又及其臣猶以為未也又及其臣之子孫則文王之徳可謂盛矣而天之所以錫文王亦可謂至矣世之不顯此章則言文王得人之盛以致周室之安也言周之臣世有顯徳故其為國謀事翼翼然恭敬故詩人稱賛之遂繼之曰思皇多士生此王國思者語辭也皇美也漢王襃傳嘗引此說顔師古曰思語辭也皇美也言美哉此衆多賢士生此文王之國此說得之毛氏則以皇為天言願天多生賢士於此邦使詩言皇而繼之以天字則可今但言皇之一字而遽以天為觧非也蘇氏則以皇為大言文王思大獲多士以為周之楨榦以皇為大其說固然不如顔師古之簡徑惟王氏之說為甚穿鑿其言曰皇有道之君也王有業之君也皇之多士則有道之士也王之國則有業之國也以有道之士佐有業之國則其興也莫之能禦矣王氏之蔽類多如此惟多士生於王國故可以為國之榦而文王亦資之以安也蓋言文王得人之盛也孟子嘗稱曰伯夷避紂居北海之濵聞文王作興曰盍歸乎來吾聞西伯善養老者太公避紂居東海之濵聞文王作興曰盍歸乎來吾聞西伯善養老者二老者天下之大老也而歸之是天下之父歸之也天下之父歸之其子焉往故當時如閎夭太顛散宜生南宫适之徒皆列於周之庭如詩所載予曰有疏附予曰有先後予曰有奔奏予曰有禦侮凡疏附先後奔奏禦侮之臣皆得其人則文王之時可謂多士矣信乎其以寜也穆穆文王自此以下則皆戒成王之辭也穆穆美也歐氏曰言美哉文王之徳於此當續而廣之敬慎不墜此説是也鄭氏則以為文王能敬其光明之徳蓋鄭氏以緝熙為光明故其説如此歐陽公曰爾雅云緝熙光也爾雅非聖人之書也孔安國傳尚書熙廣也而此熙訓廣近是也緝績也績者接續而成功也緝熙云者接續而増廣之也此說是也但大學嘗引此說以敬止為當敬於其所止此又斷章取義不可從此止字只是語辭假哉天命言大哉天之命乎商之孫子其數不億乎而上帝命之以為周之諸侯昔者天常命文王為殷之臣今又命商之孫子為周之臣以見天命有徳雖其子孫亦將奪之以為周之臣也麗說文曰旅行也鹿見食急則旅行億説文曰億兹也此言不億者王氏曰不億億也亦猶所謂不顯亦世言顯也左傳曰無寧兹許公杜氏注曰無寧寧也古人之注類多如此然商之孫子不必是十萬其曰億者但亦見其多云耳商之孫子而乃歸於周者以見天命之靡常也商王無道則天奪之周王有道則天予之予奪無常惟視君之如何耳成王當以此為戒殷士膚敏言殷士以膚美敏疾之徳而乃助祭行祼鬯之禮於周之京而又服商之服衣黼而冔冠冔商之冠也祼灌鬯也將助也商之孫子而乃助祭於周則所謂靡常也然則成王之進其臣也其可不念爾祖文王之所以得商之孫子而能助祭於周乎苟不念此則成王雖進其臣其臣亦將助祭於他人之廟矣劉向曰孔子論詩至於殷士膚敏祼將于京喟然歎曰大哉天命善不可不傳於子孫是以富貴無常蓋傷㣲子之事周而痛殷之亡也孟子亦嘗引此詩趙臺卿亦以為㣲子蓋㣲子之助祭於京師於詩可見有客有客亦白其馬我客戾至永觀厥成然則所謂膚敏之士乃㣲子之徒也以㣲子殷王元子而又膚敏乃臣於周此豈可以不戒哉魯哀公問於孔子曰寡人生於深宫之中長於婦人之手未嘗知勞未嘗知懼孔子對曰日出聽政至於中昃諸侯子孫往來為賔行禮揖讓慎其威儀君以此思勞則勞可知矣緬然長思出於四門周章逺望覩亡國之墟必將有數焉君以此思懼則懼可知矣夫以諸侯之子孫而在於諸侯之庭當以為戒則知商之子孫而來助祭於周之庭豈可不以為戒乎自古人君之國既冇亡國之子孫又有亡國之墟可為戒哉宜其戒之慎之而不敢少有怠惰然猶至於不知者蓋以不思故也王氏曰乃常服其商之黼冔則周務以徳服其心而已不以力強變其服也此說非也歐陽公曰猶服殷服者見其亡國之故臣也當從之無念爾祖言成王之欲念爾祖則在乎聿修厥徳而已能修徳則可以長配天命而福禄日來矣毛氏以永言配命為成王以自求多福為庶國是妄生分别也孟子曰禍福無不自己求之者商之孫子所以臣服於周者非天實禍之也商自求禍也周之所服商子孫者非天實福之也周自求福也天何容心於其間哉當商之未喪天下也亦嘗克配上帝惟其後人不能遵前王而守之此所以滅亡成王者宜以此為戒知天命之難如此漢翼奉嘗引此詩顔師古曰言殷家自帝乙以上未喪天下之時皆能配天而行至紂荒怠自取敗滅今宜以殷王賢愚為鑒知天之大命甚難也歐陽公曰宜鑒殷之亡知天命之不易而鄭氏以為不可改易非也命之不易無遏爾躬言天命之難如此無使天命但止於爾之身也王當昭宣善問虞度殷之亡皆自天也自上天之載以下又言當刑法文王之所為則是法天也上天之事無聲之可聞無臭之可接惟法乎文王之所為則可以使萬邦信之矣蓋文王之所為與天合其徳也中庸曰惟天之命於穆不已天之所以為天也於乎不顯文王之徳之純文王之所以為文也惟文王之徳與天相似欲求天而不可得惟求之文王而已成王可不念哉黄曰周之積累至文王而成天之命周實自文王始故作序者推本而言曰受命作周此言周家之興則本於太王之時言相天之禮則本於后稷之時皆君子推本之論先儒承訛傳舛以為文王受命稱王此蓋未嘗攷泰誓武成之書也武王未得天下則曰文考而已至天下已得而後追王大王亶父王季歴文王昌於是始有文王之稱夫文王所以與天無間後世不可及者以其有君民之大徳有事君之小心如孔子論湯武之事蓋有闕然不滿之意至論文王事商之心則曰周之徳可謂至徳也已以其心與孔子合也先儒之説固不可不辨而亦有所不必辨豈足為文王加損乎此一詩蓋言文王之大徳以為成王之戒勸而終始以天為說曰文王在上於昭于天此自成王而言之也以為武王雖得天下然由文王在上其徳昭著乎天也曰周雖舊邦其命維新此自后稷公劉以來而言之也以為周之為邦其來舊矣至文王而其民心益歸天命益固也有周不顯先儒以為甚顯然世之不顯亦可以為甚顯乎不顯亦臨亦可以為甚顯乎帝命不時先儒以為甚在是然帝命不違亦可以為甚違乎駿命不易亦可以為甚易乎則先儒之説固不通矣予以為不顯者言周家之君不自顯耀如不矜不伐之意也不時者言天之命無時而窮如萬夀無期之意也文王陟降在帝左右先儒以為進退天下之士而不違於上帝之心予以為文王俯仰之間與天為徒無聲無臭天即文王也不識不知文王即天也天與文王其周旋而無間者歟亹亹文王令聞不已陳錫哉周侯文王孫子文王孫子本支百世此言文王至誠之徳亹亹而不已則發而為令聞亦無有窮已推而及於後世亦無有窮已八百其年三十其世定鼎之期卒過歴皆已基於文王之時矣凡周之士不顯亦世世之不顯厥猶翼翼思皇多士生此王國王國克生維周之楨濟濟多士文王以寧此言文王之徳廣及於天下之士如鳶飛魚躍各遂其性非惟周召尚父閎天太顛散宜生之徒與周相為無窮而不顯之士於世無稱者亦皆世守其爵禄世竭其忠敬以輔周家之子孫曰思皇多士美之辭也曰濟濟多士盛之辭也曰維周之楨言其可以為周之蕃宣也文王以寧此又申言文王之得人如此則為文王者信乎其安也堯舜之世八元八凱相遜濟濟未足為至而極於野無遺賢萬邦咸寧堯舜之盛始於此可見嘗觀仁宗皇帝以仁徳育天下而一時士大夫之賢者俱列於朝廷其大者固已光明俊偉不可企及而其小者亦能靖共正直號愷悌至今田夫野叟有聞遺老之言述當時之事者猶春風時雨沐浴膏澤咸有生意是亦文王所以為文王也穆穆文王於緝熙敬止自此而下則戒成王之辭也穆穆美也於歎辭也言之不足故嗟歎之也言美哉文王之徳後世當續而廣之以敬於其所當止也如所謂欽厥止率乃祖攸行亦是此意自假哉天命以下明言商之孫子無異於周商之得天命無異於周惟其子孫不能修徳故商之天命轉而為周商之子孫反以事周厥鑒不逺甚可畏也為成王者其可萌自忽之心乎進賢臣以自輔念爾祖以修徳當自求福於己而無倖福於天當知其所以在天而無絶於己凡此者皆警之之辭也魯哀公問於孔子曰寡人生於深宫之中長於婦人之手未嘗知勞未嘗知懼孔子對曰諸侯之子孫往來為賔君以此思勞則勞可知緬然長思出於四門周章逺望覩亡國之墟必將有數焉君以此思懼則懼可知是亦以天命之存亡而戒之也成王知此則知天命為可畏而禍福無不自己求之矣既有以警之於前復有以勉之於後謂天之道無聲可聞無臭可接但屏去邪心而以文王為法則天之所以為天者不外是也文王之徳與天同文王之性與天合吾君能順文王而行之則萬邦作孚而天之心可知也先儒以孚為信予以為信不足以盡孚中庸之論孚必極於不言而信不動而敬篤恭而天下平故易言孚必曰中孚信由中出也大元云陽氣潜萌於黄鍾之宫信無不在其中是體也學者當以心體之大明文王有明徳故天復命武王也明明在下赫赫在上天難忱斯不易維王天位殷適使不挾四方摯仲氏任自彼殷商來嫁于周曰嬪于京乃及王季維徳之行大任有身生此文王維此文王小心翼翼昭事上帝聿懐多福厥徳不回以受方國天監在下有命既集文王初載天作之合在洽之陽在渭之涘文王嘉止大邦有子大邦有子俔天之妹文定厥祥親迎于渭造舟為梁不顯其光有命自天命此文王于周于京纉女維莘長子維行篤生武王保右命爾燮伐大商殷商之旅其㑹如林矢于牧野維予侯興上帝臨女無貳爾心牧野洋洋檀車煌煌駟源彭彭維師尚父時維鷹揚涼彼武王肆伐大商㑹朝清明李曰鄭氏云二聖相承其明徳日以廣大故曰大明此鄭氏蓋泥於大明之名而強為之説也殊不知大雅之詩則謂之大明小雅之詩則謂之小明本於雅之有小大非由其徳之有小大也故予嘗屢辯之矣此詩言天命文王以造周由於文王之有明徳其徳則上當天意矣故天申命武王焉此以見周家積徳之深而天命眷顧有周之厚也明明在下赫赫在上天難忱斯天髙其目而下其耳言天雖髙而聽甚卑也人君有明明之徳於下則天赫赫見於上出於此則應於彼猶聲之有響形之有影不可逃也如紂之穢徳彰聞豈紂不能掩其惡哉蓋以徳之穢發見於天也文王之有徳豈因紂然後揚已取名以求知於天哉蓋其徳之明發見於天不期然而然矣天之於人君固難信矣順天者存逆天者亡存亡之間在於君如何耳為君之難也如此紂之所居乃天位也又為殷之正嫡而徳不明然以徳之不明則天使之政令不挾於四方天之難信也如此人君之難信也亦如此説文曰忱信也因舉此詩天難忱斯不易惟王諸儒皆以為不可改易然此乃是難易之易也摯仲氏任言此摯國之中女有任氏自彼殷商之國來歸於王季遂行婦道於周之京乃與王季共行仁義言周之興其所由來者乆矣史記所謂大福將至有開必先是也曰嬪于京則書所謂嬪于虞言其能行婦道也王氏曰天子所都曰京方是時周未有天下其言曰嬪于京則詩人追稱且以為是宜有天下是也大任有身生此文王此章則言文王之有明徳由其母之賢而致之也觀列女所載文王在胎之日大任目不視惡色耳不聽惡聲口不道訛言故文王生而明聖則知大任之於文王其教之也有素矣文王能小心恭慎明事上帝遂能懐來百福蓋其徳不回邪故能朝諸侯受此四方來歸之國也天監在下言天之鑒察美意於下其命之所集既在於周矣載者成也言文王初成人之時則為之作配在於洽之陽渭之涘乃大姒父母之國也說文曰左馮翊洽陽縣因舉此詩曰在洽之陽蓋大姒父母之國莘國也下文纉女維莘是也國語鄭語云前河後莘韋昭注曰莘國也左傳僖公二十八年城濮之戰晉師敗于有莘之墟杜元凱注云莘故國名今此詩曰在洽之陽在渭之涘則是馮翊之間與鄭衛之地全不相干渉當以此詩為證左傳國語闕之可也涘水之涯也文王嘉止王聞大姒之賢而嘉美之以大邦有賢女猶上天之妹也天之妹言徳之可以繼於天也上天之載無聲無臭儀刑文王萬邦作孚則文王之徳可以配天矣夫婦皆可以配天則天命舎周其將焉往文王既以大姒之徳可以配天於是以禮而定其卜吉之祥行親迎之禮以造舟為梁而顯其光也爾雅曰天子造舟諸侯維舟大夫方舟上特舟文王諸侯也而乃用造舟為梁也左氏秦后子造舟為梁見昭元年春秋之時僣竊乃其常也文王豈亦爾邪王氏曰造舟為梁天子之禮也方是時文王未受命也其曰造舟為梁不顯其光則以言文王之徳用天子之禮以顯之然後為宜也使文王果用天子之禮則是文王自稱王不足為文王矣王氏之説不足信也鄭氏曰造舟周制也商時未有定制如出車之詩曰設此旐矣建彼旄矣周禮曰王載大常諸侯載旂軍吏載旗郊野載旐百官載旟此是天子之禮而南仲乃爾者故唐孔氏以為未制禮遂如此是也不然詩人追稱文王故以天子之禮言之亦猶追稱文王也亦如周王于邁六師及之文王未有六師是追稱也有命自天命此文王于周于京又為作配使繼大任於莘國之後乃長女遂適於周而生武王天復保右而命之使之燮伐商紂也陳少南曰燮伐有和順之意燮伐大商言順天命而伐大商也殷商之旅其㑹如林此正書所謂受率其旅若林言紂之師其㑹如林陳于牧野而予乃以諸侯之有徳者興而滅商故曰上帝臨女其克商也必矣不可疑貳其心也陳少南曰鄭氏之言曰天乃與諸侯之有徳者當起為天子且鄭氏於文王在上則箋之以謂文王初為西伯有功於民其徳著見於天故天命之以為王使君天下也使文王果受命則不當謂之侯興鄭氏之説不攻而自破矣此説甚當牧野洋洋一章此蓋言其戰時事也牧野之地則洋洋然而廣大檀車則煌煌然而鮮明駟騵則彭彭然而強盛毛氏曰駵馬白腹曰騵毛氏之鑿如此以周之尚赤故比之駵馬以商尚白故比之白腹今駵馬而白腹是上周而下殷也昔人常闢其非矣又曰尚父可尚可父古人常闢其非矣蓋其説之近於鑿也蓋其時有大公者如鷹之揚佐彼武王使之肆伐大商也涼佐也其曰肆伐者蘇氏曰肆縱也春秋傳曰使勇而無剛者肆之㑹朝清明言合於清明之朝而伐紂也此詩末章正與書牧誓武成篇相類攷之則可以備見矣甲子昧爽正所謂㑹朝清明也清明猶今人所謂清晨也鄭氏曰㑹合也以天時已至兵甲之強師卒之武故今伐商合兵以清明王氏曰㑹朝清明則以朝至牧野㑹時雨止清明而伐也此見王者行師不尚詭詐之意黄曰先儒以為二聖相承其明徳日以廣大故謂之大明此鑿説也小雅有小明大雅謂之大明因此二詩見於二雅故以大小别之耳武王復受天命非文王已嘗受命為天子也武王受命已基於文王之時天之命武王無異於命文王也故大明一詩其大要言商之所以亡周之所以興商之亡天亡之也周之興天興之也天何心於亡商而興周哉明明在下而赫赫在上善惡之不可揜也如此故天未嘗有心於亡商而商之所任使者不合於四方之心則商之亡非一日也天未嘗有心於興周而文王之得天已基於王季文王之時則周之興非一日也詳味此詩自武而言王季以見周家積累之乆言王季而及大任言文王而及大姒以見文王之所以為聖人者以王季為之父以大任為之母也武王之所以為聖人者以文王為之父大姒為之母也中庸之論武王曰無憂者其惟文王乎以王季為父以武王為子父作之子述之武王纉大王王季文王之緒一戎衣而有天下身不失天下之顯名中庸之言正與詩之意合而此詩猶及於大任大姒之賢所以見周人齊家之治如此之乆也緜文王之興本由大王也緜緜𤓰瓞民之初生自土沮漆古公亶父陶復陶穴未有家室古公亶父來朝走馬率西水滸至于岐下爰及姜女聿來胥宇周原膴膴堇荼如飴爰始爰謀爰契我龜曰止曰時築室于兹廼慰廼止廼左廼右廼疆廼理廼宣廼畝自西徂東周爰執事廼召司空廼召司徒俾立室家其繩則直縮版以載作廟翼翼捄之陾陾度之薨薨築之登登削屢馮馮百堵皆興鼛鼔弗勝廼立臯門臯門有伉廼立應門應門將將廼立冢土戎醜攸行肆不殄厥愠亦不隕厥問柞棫拔矣行道兊矣昆夷駾矣維其喙矣虞芮質厥成文王蹶厥生予曰有疏附予曰有先後予曰有奔奏予曰有禦侮李曰緜文王之興本由大王也周家之興本由文王文王之興本由大王大王肈基王迹王季其勤王家我文考克成厥勲惟大王肈基王迹而文王成之故曰周家之興本由大王也蓋以大王始遷于岐民從之如歸市文王繼之而興故此詩上三章則言大王下三章則言文王雖其辭不相接而其意可見蘇黄門以謂詩人不可及也惟杜子美得之蓋以前後之間如連山之勢忽斷而中接非大手筆不能此説是也緜緜𤓰瓞傳曰緜緜生貌杜元凱謂緜緜初生也按此詩言緜緜乃是不絶之意大曰𤓰小曰瓞爾雅曰瓞瓝其紹瓞舎人曰瓞名瓝小𤓰也紹繼謂瓞子漢中小𤓰曰瓞孫炎曰瓞小𤓰子如瓞其本子小紹先嵗之𤓰曰瓞陸農師曰𤓰之近本為紹今近本之𤓰常小大則復大蓋周家之興不絶如𤓰瓞子而復大也亦猶曰開闢以來常㣲矣中㣲以後遂遷于豳是末㣲而復大也故曰緜緜𤓰瓞公劉遷于豳國于漆沮之地土齊詩以為杜漢書地理志亦載之蓋扶風有杜陽杜水南入渭或者以為與周禮土圭之土同二說皆通漆沮之二水非如吉日之所謂漆沮也公劉之時民之初生者蓋以民得公劉始遷于豳故民初得以生也民之初生亦如所謂厥初生民時惟姜嫄是也雖曰民之初生而室家未定故下文又曰未有家室陶復陶穴孔頴達以為復之與穴俱是土室復者地上為之取土於地復築而堅之穴者鑿地為之土無所用直去其息土而已陶者以土為之故謂之陶也孟子嘗曰昔者大王居邠狄人侵之事之以皮幣不得免焉事之以犬馬不得免焉事之以珠玉不得免焉乃屬其耆老而告之曰吾聞之君子不以其所養人者害人狄人所欲者吾土地也二三子何患乎無君我將去之邑於岐山之下居焉莊子曰大王亶父居邠狄人攻之事之以皮帛而不受事之以犬馬而不受事之以珠玉而不受狄人之所求者土地也大王亶父曰與人之兄居而殺其弟與人之父居而殺其子吾不忍也子皆勉居矣為吾臣與狄人臣何以異且吾聞之不以所用害所養因杖䇿而去之民相率而從之遂邑于岐山之下其辭不同其意大槩相類夫以夷狄侵已而以人力報之此人之常情也大王視夷狄之人猶吾民也而不與之挍則其為人者豈不大哉其遷于豳也早朝走馬循水之涯以至于岐山之下爰及其妃姜女聿來胥宇相宅而居也相宅非婦人之事書稱周公來相宅必周公而後可今太王之妃亦能相宅則妃之所為必有大過人者周原膴膴膴美也堇菜也荼苦菜也苦菜甘乃如飴已見周原之美也賈山曰地之磽者雖有善種不能生焉江臯河瀕雖有惡種無不猥大蓋非其地則雖橘之甘亦將化之為枳得其地雖荼之苦其將化之如飴惟其如此故大王始與其民居之又與其下謀之人謀既合又契灼於龜卜筮既吉於是告於人曰可居於是矣止居也時是也故築室于茲焉古之建國必有以相土地之宜土地既善矣然後稽之於卜筮衛文公遷於楚丘始曰升彼虚矣以望楚矣望楚與堂景山與京降觀于桑則是其既有以相土地之宜矣其後曰卜云其吉終焉允臧則是卜筮既從矣其遷于岐也廼慰廼止廼慰者安其民而勞之也廼止者安集而止之也廼左廼右者處之於左右者也廼疆者定其界也廼理者分其土地之宜也廼宣蘇氏以為宣導溝洫王氏以為宣其民使出孔氏以為教其時耕不如蘇氏以為宣導溝洫廼畝者廼度其田畝之廣狹也既定其地於是自西方從之於東皆於周執事孔氏曰岐山在長安西北四百里豳在􅄮山西北四百里是則自西徂東也廼召司空廼召司徒司空之屬有匠人其職有營國廣狹之度社廟朝市之位則是掌營國邑也司徒之屬有小司徒其職云凡用衆庶則掌其政教是司徒役之事也司徒於是使立其家室則以繩正之其繩方正而直矣依此繩直之處起而築之以繩縮束其板板滿築訖則升上於下以相承載如所謂約之閣閣是也用繩束板故謂之縮左傳凡言興土功則言版榦蓋立木兩傍所以障土用之以相承載也作廟翼翼而嚴正也古人建國宗廟為先廏庫為次居室為後所以先鬼神而後已也前言築室于兹此言俾立室家王氏以為向築室則苟全而已今人既集附於是乃始大作以立室家非也向之築室者則以謂卜既吉則可以於此而築室此言立室家則可以為興立室家非是兩次興復也捄之陾陾捄説文以為盛土於器蓋左氏言畚築之事亦嘗聞畚築之聲畚亦是盛土之器也築之登登者既以此盛土於器乃投之於板中既投之矣則築之登登既已築之矣則削之從上而下曰削陾陾衆也凡此皆是形容築牆之意亦猶所謂約之閣閣築之橐橐約之閣閣是縮板以載也築之橐橐是築之登登也百堵皆興公羊傳定公十二年雉者何五版而堵五堵而雉何休以為堵凡四十尺許慎五經異義戴禮及韓詩説八尺為版五版為堵版廣二尺積髙五版為一丈其説異同姑兩存之鼛鼔弗勝者周禮韗人為臯鼓長一丈二尺大王之時民興土功之事以鼛鼓不能止之使休息以見民之樂於趨事赴功也大王之築室以鼛鼓而止民而民不休息文王之靈臺而經始勿亟庶民子來此豈有力驅使之哉民樂於上雖不待令而趨事赴功者如此大王避狄民人死於干戈宜其憚於勤勞而不堪於土功之事今也下之民從事而不止以其恩之漸漬於民之骨髓不可得已也春秋之時梁伯好土功亟城而弗處民罷而弗堪則曰某寇将至乃溝公宫曰秦將襲我民懼而潰僖公五年以梁伯之於秦豈不若大王之避狄哉大王之避狄而從之者如歸市及其築室以鼛鼓止民而民不肯止梁伯之溝公宫而民乃潰散則知仁之與暴非一日之積其所由來者漸矣乃立臯門臯門曽南豐嘗曰天子諸侯之門制見於經不明學禮者以謂諸侯之制有臯應門天子之門加庫雉見於春秋者魯有庫門有雉門見於家語者衛有庫門或以為襃周公康叔非諸侯常制其果然歟蓋莫得而考也在雅之緜古公亶父徙宅于岐作為宫室門牖得宜應禮後世原本推功述而歌之曽南豐之意以大王為得禮而以魯衛為可疑也愚竊謂魯衛為僣也明堂位曰太廟天子明堂庫門天子臯門雉門天子應門此皆漢儒傳記之言也因魯之有雉庫之門遂附㑹而為說若如明堂位之言則是太王所立者無乃僣天子之禮乎今此但當以詩為證伉言其髙也將將言其嚴正也髙而且嚴豈固厲其民而示威哉蓋諸侯之制所當然也戎大也醜衆也古者處大事動大衆必先有事乎社而後出故曰乃立冢土肆不殄厥愠此章或以為大王或以為文王陳少南云孟子借之以説文王鄭氏遂踵之為文王之事竊謂孟子之於梁惠王篇又曰文王事昆夷則知此為文王之事不獨見於盡心篇而又見於此當且從孟氏之説肆不殄厥愠未嘗絶其愠怒之道也亦不隕厥問亦不廢其聘問之禮也司馬温公曰外不失和内不失備肆不殄厥愠外不失和也亦不隕厥問内不失備也吾之勢未可與之較故與之和然不可以和之故懈怠而自恣故不隕其問也故孟子以大王事獯鬻為小事大文王事昆夷為大事小大事小者樂天者也小事大者畏天者也樂天者保天下畏天者保其國樂天畏天其事雖殊而承天之心則一此文王所以能繼大王之徳也自文王即位之初不絶大王愠怒夷狄之道不廢大王聘問夷狄之禮迨其國家既成柞棫之木拔而生葉行道之處兊而成蹊矣疆理整整如此則雖以夷狄之強將不待較而自服矣故曰昆夷駾矣維其喙矣駾突也謂奔突而走也喙喘也虞芮質厥成質獄成也虞芮之國來質其獄於文王有以動之使其禮義之心生鄭氏曰虞芮之質平而文王動其緜緜民初生之道王氏謂與易觀我生同義皆不如蘇氏之説謂使其禮義亷恥之心油然而生蓋生如孟子所謂樂則生矣之生同虞芮之爭田來質於文王入其境則耕者遜畔行者遜路入其邑男女異路班白不提挈入其朝士遜為大夫大夫遜為卿二國之君遂痛自切責而讓其所爭之田始也爭而終也遜此豈以勢力而使之哉蓋有以發其愧恥之心耳方文王之興也昆夷之強不敢與之爭又其盛也他國之爭者亦莫之爭外而夷狄柔服内而諸侯向化則文王之徳可謂至矣不可以有加矣自他人觀之必將偃然自肆以為天下莫已若也文王方且歸於臣止曰我有疏附之臣有先後之臣有奔走之臣有禦侮之臣此四臣所以能成功業如此之盛文王之謙徳又見於此率下親上曰疏附相道前後曰先後喻徳宣譽曰奔走武臣折衝曰禦侮黄曰周之得天自文王之得民始民心之歸周自大王之得民始故序言文王之興本自大王而此一詩之意大要主民以為言也周自后稷播種而封邰至公劉厚民而遷豳其有功於民大矣然當是時猶未見民之歸周也至大王為狄人所侵事以珠玉皮幣而不得免大王不忍以土地之故鬬民於鋒鏑之下乃屬其耆老而告之曰狄人之所欲者吾土地也吾聞之君子不以其所以養人害人二三子何患乎無君去豳踰梁山邑于岐山之下居焉豳人曰仁人也不可失也從之者如歸市民心之依大王如赤子之慕慈母頃刻不可舎去一日不見號泣而不能自已皇皇然而若無所容周雖未興而民心有在焉至文王而民始附人心之歸周益不可拔而周之王業至是而始成矣觀此詩言大王之遷岐而豳人從之歡然而來翕然而聚自陶復陶穴未有家室而至於臯門有伉應門將將以見斯民樂為之室家築垣牆百堵皆興鼛鼓弗勝休之而愈作止之而愈力又為之立冢土以為他日戎醜之行而大王之心終不忍以區區之忿逞怒於夷狄以勞吾民也彼或愠怒以侵我而我不殄彼或聘問以求我而我不隕大王此心與天地同量而豈肯以夷狄介其心哉柞棫之拔行道之兊而昆夷自爾駾亦非大王之有心也柞棫之拔豈大王嚴立其蔽障以為勝敵之地乎耕者皆願耕於其野行者皆欲出於其塗商賈皆欲藏於其市而行道自爾悦也至於昆夷之所以服者蓋其感發之機自爾然也如文徳敷而有苖格舜豈以敷文徳為格有苖之具哉越王困於夫差而行成於呉此不免為霸者之用心而不可以此論大王也孟子舉是以為文王之事特斷章取義耳自虞芮質成以下乃文王事也詩人將言文王之得民心也故先詳及於大王之事遷岐以見周之得民自大王始夫虞芮之所以感文王之化者非遽能爾也方其相謂曰西伯仁人也盍往質焉則私欲已去天理已萌及至其境而和遜之風接乎目禮義之心動乎内樂則生生則烏可已足未履文王之庭而心已感文王之化感發之機若此其至哉予曰有疏附以下四句説者以為文王自謙之辭予以虞芮之君感其所以化而虞芮之民不知其所以感相與而測度之或以為文王有疏附之臣而致此也或以為文王有先後之臣而致此也或以為文王有奔走禦侮之臣而致此也文王之化與天地同其運與神同其妙而天下之人知其化而不知其所以化盛矣哉棫樸文王能官人也芃芃棫樸薪之槱之濟濟辟王左右趣之濟濟辟王左右奉璋奉璋峨峨髦士攸宜淠彼涇舟烝徒楫之周王于邁六師及之倬彼雲漢為章于天周王夀考遐不作人追琢其章金玉其相勉勉我王綱紀四方李曰棫樸文王能官人荀子曰文王以官人為能左傳曰官人國之急也官使人才正人君之急務文王之世多士濟濟既有疏附之臣又有奔奏之臣又有先後禦侮之臣豈非文王之所以官使人才者有其道故也芃芃棫樸芃芃木盛貌也樸枹木也棫小木也以至小之木枹然叢生似乎無所用矣然猶可以為薪槱積之則天下無不可用之材矣以譬天下無不可用之才在人君之所以官之如何耳惟文王之能官人如此故曰濟濟辟王左右趣之臣皆趣而從事無不得其宜也左右奉璋半圭曰璋奉璋所以助祭也文王祭祀則左右之臣助祭奉其半圭皆峨峨然而盛壯此髦俊之臣所宜為也淠彼泉流涇水之舟所以順流而行者以有衆徒以楫櫂之故也譬文王之治其國所以至於壯盛者蓋得賢人以共佐也惟文王之得人如此則周王有所征行則六師皆在也以見其治軍旅之得人也歐氏曰以見文王所官人入宗廟居軍旅皆可用言文王之人才各任其事也王氏曰奉璋文事卿大夫之職濟難武事將帥之職也此説皆是孔子嘗言衛靈公之無道季康子曰奚而不喪子曰仲叔圉治賔客祝鮀治宗廟王孫賈治軍旅以靈公之時治宗廟軍旅猶得其人而況於文王乎倬彼雲漢為章于天周王夀考遐不作人此四句諸家之説甚多惟歐公之説簡徑而明也夫以雲漢為上天之文章以周王之夀考豈不能逺作人乎作人者鼓之舞之也成公八年嘗引此二句杜元凱注曰言文王能逺用善人不語助是也追琢其章鄭氏説此二句但述為政殊無官人之意王氏則曰文王作人外則使有備成之文内則使其有可貴之質周官追師掌追衡笄追猶治也冇金而不琢則不成器有其文而追琢之無其質則與朽木糞土等矣故必二者備而後可也文王之得人成就如此文王又何為哉勉勉我王以執其紀綱而已王氏以為或曰辟王或曰我王或曰周王王氏皆為之辨必求其義而為之説此正分章析句之學不足辨也黄講同毛詩集解卷三十
