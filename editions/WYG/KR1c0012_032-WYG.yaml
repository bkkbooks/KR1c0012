body:
  text: 毛詩集解卷三十二宋李樗黄櫄撰生民之什詁訓𫝊第二十四大雅生民尊祖也后稷生於姜嫄文武之功起於后稷故推以配天焉厥初生民時維姜嫄生民如何克禋克祀以弗無子履帝武敏歆攸介攸止載震載夙載生載育時維后稷誕彌厥月先生如達不坼不副無菑無害以赫厥靈上帝不寧不康禋祀居然生子誕寘之隘巷牛羊腓字之誕寘之平林㑹伐平林誕寘之寒氷鳥覆翼之鳥乃去矣后稷􅈱矣實覃實訏厥聲載路誕實匍匐克􅄮克嶷以就口食蓺之荏菽荏菽斾斾禾役穟穟麻麥幪幪𤓰瓞唪唪誕后稷之穡有相之道茀厥豐草種之黄茂實方實苞實種實褎實𤼵實秀實堅實好實穎實栗即有邰家室誕降嘉種維秬維秠維穈維芑􅁪之秬秠是穫是􅅿􅁪之穈芑是任是負以歸肈祀誕我祀如何或舂或揄或簸或蹂釋之叟叟烝之浮浮載謀載惟取蕭祭脂取羝以軷載燔載烈以興嗣歳卬盛于豆于豆于豋其香始升上帝居歆胡臭亶時后稷肈祀庶無罪悔以迄于今李曰祖謂后稷也文王雖得天下而其積累乃自於后稷始故推后稷之功以配焉孝經曰郊祀后稷以配天萬物本乎天人本乎祖惟推其所由本此后稷之所以配天也世之好怪誕者皆以稷契無父而生契生於卵稷生於巨跡問其所自始則曰詩所載也天命𤣥鳥降而生商此契生於卵也履帝武敏歆攸介攸止載震載夙載生載育時維后稷此稷生於巨跡也嗚呼孔子不語怪力亂神夫子所以不語怪者以其惑世也豈以六經垂訓於後世而乃載神怪之事哉彼以契生於卵稷生於巨跡者乃引經疑似之言以惑世也詩本無有也詩之所言特載二妃當𤣥鳥至之時踐帝之跡以祈髙禖神之祥是生稷契如是而已而好怪者遂引此詩疑似之言附㑹其說學者遂翕然而從之甚矣世之易惑也惟毛氏以為非生於卵與巨人之跡其說為近而後之諸儒猶未之信歐陽遂因其言而闢之曰秦漢之間學者喜為異說謂髙辛氏之妃陳鋒氏之女感赤龍精而生堯簡狄吞鳦卵而生契姜嫄履大人跡而生后稷髙辛四妃其三妃皆以神異而生子盖堯有盛徳稷契後世皆王天下數百年學者喜為之稱述欲神其事故務為其說至帝摯無所稱故獨無其說此則怪異之說不足信明矣而洪駒父亦曰堯舜與人同耳血氣之類父施母生耳聴目視二足而行是聖智愚不肖之所同也何必有恢詭譎怪之觀然後為聖且神哉此二說可以中諸儒之病然毛氏之說後世所以不信之者盖亦有由焉毛氏以稷契為帝嚳子後世諸儒以世次考之契十四世而為湯稷十六世而為武王則是湯與王季為兄弟武王與太甲亦兄弟也而其相去者乃六百年而乃為兄弟之列無是理也而或者又以為必非帝嚳之子但其苗裔也而附㑹毛氏之說者又以稷者帝嚳遺腹子皆是臆說無所考據要之世代綿逺無可得而見也如孔氏左𫝊正義亦曰大戴禮五帝徳司馬遷五帝紀皆言顓頊帝嚳代别又春秋緯命厯序顓頊𫝊九世帝嚳𫝊八世典籍敗亡無所取正要之二帝之子孫舜時始用必非帝之親子以某觀之詩言履帝武敏歆以帝言之則是髙辛之親子但恐后稷至于武王不止十六世也豈其自契至湯十四世又自湯至於紂十七世而自稷至於武王乃十六世豈其然乎史家失其世次不可得而見也其謂二帝子孫至舜時始用則以左𫝊云堯不能舉舜臣堯舉之杜元凱則以為史克激稱以辯宣公之惑釋行父之志故其言美惡有過辭盖事冝也非是堯於稷契實未嘗用也而孔氏之疏亦曰稷至文王為十五世訃虞及夏商尚千二百歳每世在位皆八十許年乃可充其數耳命之長短古今一也而使十五世君在位皆八十許載子必將老始生不近人情之甚以理而推實難據信惟其契生於卵稷生於巨人之跡決不可信耳若其見棄之由則亦有二說毛氏以為天生后稷異之於人鄭氏則以為無人道而生子固不足信如毛氏之說則又涉於誕無故而棄之此豈近於人情哉且以天子之子而棄於遐逺之地雖其甚忍者亦不忍為之而況於姜嫄乎縱姜嫄忍為之髙辛亦忍為之邪陳少南又以謂婦以承夫為樂有子次之姜嫄無子從帝嚳而禱子禱祠無福而姜嫄有子婦人之志方急於帝嚳而不志於有子故有隘巷平林寒冰之事然此亦是臆說未敢必信要之稷名曰棄但不知其見棄之由闕之可也厥初生民毛氏曰本后稷也后稷而謂之民者本其初生而未有貴位生與民同故以民言之故云生民此說非也此所謂生民即綿詩所謂民之初生是也王氏曰綿所謂民之初生則本其由大王而興今此所謂則本其由后稷而起也此說是也民自后稷而生則生民二字俱指庶民而言之非以后稷為民也民由后稷以生而后稷之生本於姜嫄而又言其姜嫄生后稷之初盖姜嫄因禋祀郊禖神之時以祓去無子之疾遂踐帝履之足跡繼帝之後而行甚敏疾故為天所歆享因介之以大福而安止之也震有身也左𫝊曰邑姜方震太叔又曰后緡方震正此類也夙者王氏曰言其疾而不遲也既震夙矣遂生育焉而其所生育者乃后稷也誕彌厥月云云誕大也彌終也言姜嫄於后稷終其孕育而生后稷如達之易達羊子也羊子易生無留難者晉語曰大任娠文王不變少􅘞於豕牢而得文王不加病焉與此同意先生者以后稷是姜嫄首生之子也唐孔氏曰人之生子先生者多難此后稷是姜嫄之子最先生者應難而今易故言先生以美之不坼不副言不坼剖不副裂故其母無災害常人之生母必坼剖必副裂而姜嫄則不然是天欲以此顯明其靈也是乃上天降福以安之也不寧者言上帝不安之乎而姜嫄之身亦豈不安於禋祀乎言上帝安之已先見禋祀之時故姜嫄安然無病而生子也誕寘之隘巷此則言后稷見棄其始寘之隘巷牛羊則避而愛之又移而寘之於平林又會有人伐平林者收之又移而寘之於寒冰又有鳥以羽覆之以翼藉之夫寘隘巷冝其為牛羊所踐而乃腓字之寘之平林冝其為鳥獸所害而乃會伐平林又寘之寒冰冝其為寒氣所薄而乃鳥覆翼之於是乎知后稷必非凡兒遂往而收之及鳥既飛去后稷乃􅈱􅈱如啓􅈱􅈱而泣是也實覃實訏前既言收后稷歸而養之矣此則言長大之事覃長也訏大也路亦大也言后稷之生其體長且大矣其口出音聲則又大矣於匍匐以就口食其形岐岐嶷嶷然􅄮毛氏曰知意也嶷毛氏曰識也說文曰小而有知也既岐嶷矣又能取食於口而啗之及其長也又能知稼穡之事荏菽大豆也其蓺大豆則斾斾然而長大役禾之末也說文曰禾末也當從之禾之末則穟穟然而好其麻麥則幪幪然而盛其𤓰瓞則唪唪然而實言其樹蓺五穀皆出於天性此其所以為后稷教民稼穡也誕后稷之穡言后稷教民稼穡乃所以相天也王氏曰天降生民固使之粒食后稷敎以農事則有相之道后稷之所以相天者所以助天養育斯民也此說是也惟后稷之相天故推其功以配天何為而不冝乎郊祀后稷以配天也鄭氏以為后稷之掌稼穡有見助之道謂若神助之力此說亦通自此以下則言后稷稼穡之事爾雅曰茀治也盖草不耘則苗不盛左𫝊曰農夫之務去草絶其本根勿使能殖故草既除之此種之所以黄且茂也實方者毛氏曰極畝也不如王氏曰方者房也與大田所謂既方既皁同意言其孚甲始生也實苞者茂也如斯干所謂如竹苞矣之苞同種者王氏曰雜種也不如鄭氏種生不雜言各隨其種也褎者禾長之貌𤼵者言其苗始𤼵也秀者言其苗秀也實堅實好者言其結實堅而且好穎者言其禾穗之穎也謂禾穗之挺書曰異畝同穎是也栗者成就之貌左𫝊曰嘉栗㫖酒與此栗同觀此詩言稼穡之美如此則后稷之功所及者大故堯舜以其功封於邰也許愼說文曰邰炎帝之後姜姓所封后稷外家所生之國今扶風邰縣是也毛氏亦曰堯見天因邰而生后稷故國后稷於邰許氏之說正與毛氏同然邰既為后稷之母家不應絶其母家而封后稷也孔氏曰此邰為后稷之母家其國當自有君所以得封后稷者或時君絶或遷之他所也此皆臆度之說無所考據今據此詩言封后稷於邰其言明白但以邰為姜嫄父母之國則未之敢信也誕降嘉種毛氏曰天降嘉種是也王氏則以為后稷擇嘉種而誕降之非也此所謂誕降嘉種正閟宫所謂是生后稷降之百福黍稷重穋稙穉菽麥乃是天降之也所謂天降嘉種非實是天降種也孔氏曰美大后稷以種之必獲歸功於天非實天下之也此說為得詩人之本意歐陽公曰稱后稷播時百穀者盖其為舜敎民耕植以足食爾如後世有勸農之官也非謂堯舜以前地無百穀而民不粒食天降種與后稷而後冇也然則百穀草木其有固已久矣安知四穀之種為后稷而降也使天有顯然之迹特為后稷降此四穀其降在於何地詩無明文但云誕降則毛鄭何據而云天為后稷降種而已歐陽公此言亦失之泥也所謂天降者正如書言天乃錫禹洪範九疇非是實有物以錫之也只是禹能順五行之序便是天錫之也誕降嘉種非是天自上而降下也只是稷能稼穡便是天降之也頌所謂貽我來牟亦是此意孔叢子曰魏王問子慎曰往者中山之地無故有穀乃云天雨反以亡國何也如必以天降嘉種與中山之穀相似則其誣偽可見非儒者所稱道詩人必不然也秬黑黍也秠一稃二米也穈赤苗也芑白苗也既得此嘉種遂徧種之也􅁪徧也既種之遂穫之而計之於田畝遂負任之以歸其國而祭祀也誕我祀如何言我之祭祀其禮如何則先以所種之穀或使人舂之或使人就臼而抒之毛氏及說文皆曰揄抒臼也或使人簸揚其糠粃或使人蹂踐之既釋之矣而其聲叟叟然釋如孟子所謂接淅是也叟叟聲也既釋之矣乃烝之而其氣浮浮然說文曰烝火氣上行也觀此四句可以見詩人善體物處既治其穀矣故謀惟其祭祀之事欲其無所不謹無所不備也取蕭祭脂王氏曰宗廟之祭升臭也郊特牲曰蕭合黍稷臭達牆屋故既奠然後焫蕭合羶薌既取蕭祭脂矣則又取羝羊之體以為祀軷之祭祀軷行神之祭也於是又以羝羊之體而燔之炙之以為尸之羞言其祭祀如此以興嗣嵗則毛氏所謂興來繼往是也此章大槩言既得嘉種從而備物以享百福也卬盛于豆于豆于豋此章言後世以后稷配天也而序所謂配天是也卬我也我以所祭之物盛于豆豋木曰豆瓦曰豋其馨香之氣上升於天天安而歆享之則郊天之祭也胡臭亶時言其何臭之誠而得其時乎言祭得其時也儀禮士冠禮曰飲酒既清嘉薦亶時正與此胡臭亶時同於是因郊天之祭而念后稷之始得百穀以肈祀故使我子孫無有罪悔至於今而有天下也此詩末三句當止従王氏之說以后稷之肈祀為祭宗廟以末句之祭為配則后稷之祭不為僣矣而毛鄭則以謂郊祀是誣后稷也詳先儒之意以為堯封稷於邰使稷歸而祭天必無是理也觀成王賜魯以天子之禮樂成王之賜非也使魯用之而合於禮春秋何為書之乎成王之賜伯禽之受皆非合禮也而謂堯與后稷亦然則豈不厚誣堯與稷乎考之經𫝊初無稷祭天之事惟毛鄭於此詩言之殊不知深考末章之意則后稷未嘗祭天可考而見而蘇氏之說又以謂洚水之後民方阻飢后稷敎之播種於是民獲粒食天實祐之而錫之嘉種及周公遭流言之變成王疑之天大雷電以風禾偃木拔及成王為啓金縢之書知其以周公故也將逆周公為之出郊而天乃雨反風禾則盡起盖二公之徳上昭於天天之所以祐之者如此故堯與成王因天之意而使之祭天此書生之論也郊祀所係君臣之大分豈有其徳上昭於天可使僣行郊祀哉如此則伊尹格于皇天凡此之類皆可僣行天子之祭也自古惟秦無道擅行郊祀之禮秦之無道又何足責魯既不幸如此又指后稷之事以為然夫稷之於秦逺矣豈其如是而不知君臣之大義乎必不然也黄曰生民之詩其可疑者三其二失之誣其一失之僣此皆先儒之曲說而誣與僣之患所由生也歐陽公陳少南李迃仲亦嘗疑之而至於寘之隘巷平林寒冰之說則欲闕其所未詳予以為此皆詩人之設辭而不必實求是事也如孟子與萬章所言焚廩浚井之事皆設為之辭耳此不可不辨者一也詩曰誕降嘉種維秬維秠維穈維芑而先儒之說則曰天顯后稷之靈而為之下嘉種也信此說則后稷以前民皆無黍稷之食乎予以為后稷以前未嘗無黍稷之種也特未别其維秬維秠維穈維芑耳后稷敎民稼穡而為之别其類以時其耕種也故曰誕降嘉種言后稷降之於民也非天降之於后稷也有相之道茀厥豐草鄭氏以為后稷掌稼穡之事若有神助之而李迃仲亦以為后稷相天之功以全其生育之理予以為后稷之所謂有相之道者在於茀厥豐草也去草而絶其根則嘉穀自殖此相之之道不然則是宋人揠苗助長矣此不可不辨者二也詩言是任是負以歸肈祀后稷肈祀庶無罪悔以迄于今先儒之說則曰肈祀郊祀也后稷有人臣所無有之功故得用天子之禮樂又舉周公封於魯而得用郊天之禮以為證夫魯之郊春秋皆譏之譏之者何譏其僣也成王不當賜伯禽不當受前輩嘗論之盖臣之事君而盡其忠子之事父而盡其孝孝之大如舜功之大如后稷周公皆分内事也以人臣所當盡之事而賜以人臣所無有之禮其可乎予以為祭祀之禮自后稷敎民稼穡始而周之所以有天下者自后稷育民之功始故周人行祀天之禮而推原其所以肈祀之由肈祀者如所謂肈基王迹之意也安得以為后稷行大祀之禮哉此不可不辨者三也三者辨而一詩之意皆明竊嘗觀此詩其大要乃詩人尊后稷以配天而又言后稷之所以配天者以文王之功起於后稷也既言文武起於后稷又言后稷生於姜嫄以為后稷不生則天不能人人不能天民不得而粒則敎不得而敷以天之不可無后稷故以為雖寘之隘巷平林寒冰而無如之何也天之欲喪斯民也則后稷可以不生天之未喪斯民也隘巷平林寒冰其如之何故凡此者皆詩人之設辭矣不以文害辭不以辭害志是為得之行葦忠厚也周家忠厚仁及草木故能内睦九族外尊事黄耇養老乞言以成其福禄焉敦彼行葦牛羊勿踐履方苞方體維葉泥泥戚戚兄弟莫逺具爾或肆之筵或授之几肆筵設席授几有緝御或獻或酢洗爵奠斝醓醢以薦或燔或炙嘉殽脾臄或歌或咢敦弓既堅四鍭既鈞舎矢既均序賓以賢敦弓既句既挾四鍭四鍭如樹序賓以不侮曽孫維主酒醴維醹酌以大斗以祈黄耇黄耇台背以引以翼壽考維祺以介景福李曰言周家世世以忠厚為心其仁恩則及於草木故能内睦九族外尊事黄耇焉孟子曰親親而仁民仁民而愛物推親親之心然後及於仁民推仁民之心然後及於愛物此其先後之序也今此先言仁及草木然後言内睦九族外尊事黄耇者盖作序之意惟以詩中首章言行葦故先言仁及草木二章四章言燕兄弟五章言養老故繼之以内睦九族外尊事黄耇也夫一草木之㣲如行葦者猶且愛惜之則九族黄耇當何如也古之王者方其仁化之盛也匹夫匹婦無有不被其澤又其盛也雖草木之㣲亦無不被其澤夫以天下之廣匹夫匹婦未受其賜亦未足以害仁民之政而行葦之㣲未及其仁亦未足以害其愛物之政然不如是不足以為盛治也觀虞氏之恩被動植虞氏之仁政如此則於親九族尊事黄耇則必優為之也夏禹之治山川鬼神亦莫不寧暨鳥獸魚鼈咸若禹之仁政如此則於親九族尊事黄耇必優為之也盖未有仁及草木而不親九族尊事黄耇也大學曰其所厚者薄而其所薄者厚未之有也使九族之不親黄耇之不事則是所厚者薄而仁徒及於草木則是所薄者厚矣未有薄其所厚而能有為者也齊宣王恩足以及禽獸而功不至於百姓者惟其不能推此心故也苟能推此心以往以之及草木以之親九族以之尊事黄耇者皆此心也孔氏曰三王養老必就乞言故序因而及之於經無所據者非也觀詩中言以祈黄耇是則序之所謂乞言也夫老成人歴事為甚多故其言可從觀後周之時保定中天子以于謹為三老天子北面訪道乃寘几席天子遂問云朕當天子重任自惟不才不知政府之要何以誨之三老乃告之以忠信従諫與夫紀綱賞罰武帝拜而受之如曹㕘得盖公之一言以之治齊以之治天下是老成人之言其可重如此古人之乞言良有以也漢明帝幸辟廱行養老之禮以李躬為三老以桓榮為五更執醤而饋執爵而酳其所以待之之禮可謂至矣然方其禮畢乃正坐自講諸儒執經問難於前則非所謂乞言之意也夫所貴乎養老者以其乞言也然明帝正坐自講其意則驕矣乃知其養老隆虚名而無實效果何補哉惟其養老乞言則福禄歸之矣末章言壽考維祺以介景福是也敦毛氏以為聚貌王氏以為厚今且從毛氏言敦彼行葦勿使牛羊踐履而傷之者以此葦方苞而茂方體而成形其葉又泥泥然而美好以其將為人用故可愛惜也又孰忍傷之哉此周家忠厚之至也戚戚兄弟此則言其宴九族也戚戚親之也兄弟之屬我從而親之無有逺棄具在於此逺與伐木所謂兄弟無逺同意其至也則或肆之筵或授之几以見其親親之恩厚也非特肆筵又且設加之以重席非特授几又且有緝御而待之設席者即周官司几筵所謂設莞筵加繅席設蒲筵加莞席是也緝御即周禮所謂更僕是也斝爵也主人獻賓賓酢主人主人復洗爵酬客客受而奠之酬酢之禮既如此而又薦之醓醢燔炙脾臄之類醓醢肉汁也燔肉也炙肝也說文曰口上曰臄口下曰又曰口裏重肉也嘉殽脾臄臄也脾臄所以謂為嘉殽也前言洗爵奠斝則所以飲之者無不至也醓醢以薦或燔或炙嘉殽脾臄則所以食之者無不至也飲食之具既至而又思所以樂之歌比於琴瑟徒擊鼓曰咢凡此皆見親親之誠無不用其極也棠棣之詩曰儐爾籩豆飲酒之飫兄弟既翕和樂且耽伐木詩曰籩豆有踐兄弟無逺而此詩又述周王所以待兄弟如此則周家忠厚如此其至盖其所及者雖草木猶有仁恩以及之豈於天屬而不親之乎如幽王者暴戾無親不能宴樂同姓孤危將亡親且如此則草木之㣲可知也敦弓既堅此則言行射禮也古者養老必先射以擇賓也漢明帝亦行射禮但不乞言耳敦弓畫弓也荀子曰天子彫弓諸侯彤弓大夫黒弓而何休公羊注亦曰天子彫弓諸侯彤弓大夫嬰弓士盧弓此言敦弓即荀子所謂天子彫弓也天子所射者敦弓敦弓既堅固矣四鍭之矢既均平矣其舎放此四矢則既均而必中矣遂以此序賓皆賢者也鍭者說文曰矢金鏃翦羽謂之鍭必以射序賓者古者以射而見能否如此孔子射於矍相之圃可以見其得賓也其敦弓既鉤挽其弦而句之矣既挾此四鍭矣乃徧釋之其鍭皆中的遂以此序賓皆不侮不侮盡其恭敬者也曽孫維主曽孫成王也成王之為主人而酒醴皆厚矣遂酌之以大斗以祈求黄耇而乞言也說文曰醹厚酒也以大斗酌而嘗之大斗其柄長三尺故謂之大斗台鮐也大老則背有鮐文故曰鮐背也老人者在前曰引在傍曰翼使人引導而輔翼之翼者扶持也惟其能養老如此故壽考維祺而受其福也祺吉也夫以尊事黄耇而受其福如此則知商紂之播棄黎老安得而不受其禍也黄曰行葦之詩古今說者既差其時世故亦失其次序既失其序矣則文理顛倒而不明於是強為之說而詩之意益不明矣中庸言盡已之性而後盡人之性盡人之性而後盡物之性孟子亦言先親親而後仁民仁民而後愛物此定序也今行葦之序則曰周家忠厚仁及草木故能内睦九族外尊事黄耇養老乞言以成其福禄焉是仁及草木而後能睦族敬老豈不紊其序乎鄭氏曰周之成王於物且愛之況於人乎李迃仲亦言此詩先言敦彼行葦次言戚戚兄弟而末章言黄耇台背其意盖以一草木之㣲猶且愛惜則九族黄耇當何如也如舜之恩被動植禹之仁及山川鬼神鳥獸魚鼈於睦族敬老皆所優為凡此者皆強為之說也予嘗深思之以為周家忠厚仁及草木乃合言周家之君而非謂成王也自故能以下則言成王因其祖宗之忠厚而能以忠厚繼之也曰周家云者則自后稷以來而言豈專為一時乎曰故能云者盖因彼而能此之辭豈皆言成王乎即序詩者之意而深求於一言一字之間則詩之意明矣周自后稷育民公劉厚民大王仁民積而至於王季文王之時其忠厚之風積累之乆凡天地之間無一物非周家之仁也庶類之蕃殖萬物之盛多行道之葦方其始生則牧人有不忍傷之心而戒牛羊之勿踐其仁及草木為何如哉惟周家之君世積忠厚則成王之所以耳聞目見者皆忠厚之事也薫陶漸漬者皆忠厚之風也其所躬行其所𤼵見者豈能外此而為治乎内睦九族而燕飲盡其歡外尊事黄耇養老乞言而此心盡其敬此皆忠厚之遺餘也前王以忠厚積之而福禄以生後王以忠厚繼之而福禄益成此序詩者因成王睦族敬老之義而推周家所以及草木之仁以見其積累之乆而忠厚之至也嘗觀伐木之詩文武燕兄弟故舊之詩也親親以睦友賢不棄則民徳歸厚則周家忠厚之已久成王所謂睦族敬老者豈非得文武親親友賢之意邪旱麓之詩受祖之詩也周之先祖世修后稷公劉之業而大王王季申以百福干禄則周家之福禄已有其基成王之所謂成其福禄者豈非成大王王季所申之福禄而學者以此求之則一詩之意了然矣既醉告太平也醉酒飽徳人有士君子之行焉李曰序謂之太平者自古君臣相與宴樂多矣桀為酒池敗於南巢紂為酒池敗於牧野周幽王居鎬京飲酒宴樂而卒有驪山之禍此三君者方其獨樂之時則自以為天下之樂無以加於此及其敗也雖欲獨樂一日有不可得盖方其獨樂之時則其民愁嘆之聲充塞乎天地之間又安能長享其樂哉惟成王之時君臣上下莫不相敬田野之間歡欣歌舞無乖爭陵犯之變於斯時也宴飲酬酢君臣之樂至矣又相與稱而頌之欲其享萬年之壽又欲其子孫之繁衍又欲其福禄之盛多豈無所自而然哉賈􅁩曰主上遇其大臣如遇犬馬彼將犬馬自為也如遇官徒彼將官徒自為也今也成王飲酒其所以待臣下者至矣則臣之於君當何如哉揚子雲曰周之士也貴秦之士也賤周士非必自貴亦上之人貴之也秦之士非必自賤亦上之人賤之也揚子雲又曰聖人陶成天下之化使人有士君子之器成王之治天下養育人才至於飲酒之際如此立政動化可得而知也黄曰竊嘗讀詩之賓之初筵見其有沈湎淫液之刺盖喟然而嘆曰吾民飢寒之不恤而君臣宴飲之是娛冝武公之不樂於此也及觀既醉之詩而見其有太平之稱益不能無疑焉夫太平之詩必言法度彰禮樂著人民樂而後可今也君臣従事於宴飲之樂而曰太平太平之事如此而已乎及即詩人之意而求詳於作序者之言然後知太平之盛捨此詩則無以見之也夫天下未治吾民未安嘆息愁恨之聲滿於田野而君臣相與醉樂於朝廷之上君子謂之獨樂惟人君因天下太平之盛而宴羣臣於饗祭之後人臣樂得其君待遇之厚而益自謹於既醉之時非太平之盛何以至此故夫既醉以酒未足以見太平醉酒飽徳而人有士君子之行乃所以見其風化之美而為太平之效也噫公子而信厚然後見關雎之化騶虞而知仁然後見王道之成醉酒者而能飽徳然後見太平之盛此詩人之㣲意也既醉以酒既飽以徳君子萬年介爾景福李曰既醉以酒言既醉之以酒矣又於飲酒之中接之以禮樂以見其飽之以徳也厲王之飲酒至於荒湛有曰如沸如羮如蜩如螗小大近喪人尚乎由行醉以酒矣徳安在哉幽王之飲酒至於屢舞僊僊至於載號載呶至於沈湎淫泆醉以酒矣徳安在哉惟成王之時羣臣既醉之以酒而於飲酒之中又接之以禮樂是謂飽徳也孔子曰吾食於少施氏而飽少施氏食吾以禮吾祭作而辭曰疏食不足祭也吾䬸作而辭曰疏食也不敢以傷吾子孔子之所以飽者以待已有禮故謂之飽徳也至於季氏則不然矣孔子食於季氏不食肉而飽其待已不以禮安得不謂之飽哉所謂飽者非在於樽俎之間也特以徳如何耳成王之待羣臣既醉之以酒而飲酒之中又飽之以徳想其揖遜之際容止可觀則為臣者其所以報上冝其祝之以億萬斯年而介爾景福也自古人臣之荅其君者惟兾其受福之多也天保之詩報上之詩也而其所以報之者不過欲其受遐福至於如月之恒如日之升如南山之壽如松柏之茂而已故成王之羣臣其所以荅其君者亦曰萬年也黄曰嘗聞醉酒之能敗徳未聞醉酒之能飽徳書有徳將之戒詩有伐徳之刺禹之所以惡周公之所以禁以其能敗徳故也今曰既醉以酒既飽以徳酒可醉也徳如之何而可飽哉孔子曰吾食於少施氏而飽少施氏食吾以禮乃所以為飽成王之待羣臣既醉之以酒又飽之以徳則其所以待羣臣之禮至矣是以羣臣皆祈之以億萬斯年之永而天介助之以景福介者助也景者大也皆臣子愛君之辭也噫君焉盡禮以待夫臣臣焉歸美以報之君太平之盛可於此而見既醉以酒爾殽既將君子萬年介爾昭明李曰爾殽既將將大也言其俎實之多也既醉之以酒而其殽實又大惟成王之待臣下如此故欲其君有萬年之壽又且助之以昭明之道昭明者錫之以為明君也黄曰前章既言醉之以酒飽之以徳而次章又言既醉以酒爾殽既將先儒以為將大也言其俎實之多也予以為將者將其厚意之謂也成王之待羣臣禮愈至而意愈加既醉之以酒而又飽之以徳猶以為未足以盡吾待之之誠也而又致其俎實以將其厚意所以見其待臣下之禮有加無已如此也惟成王之待羣臣有不已之誠故羣臣之報成王亦有不盡之意既曰介爾景福又曰介爾昭明明者言其徳也成王之徳既昭明矣天如之何而助之盖所謂介爾昭明明者所謂錫王勇智之意也要之皆臣子愛君之辭而形容不盡之意也如天保之詩既曰俾爾多益又曰俾爾戩穀又曰降爾遐福維日不足其形容不盡之意固如此耳昭明有融髙朗令終令終有俶公尸嘉告其告維何籩豆靜嘉朋友攸攝攝以威儀李曰融毛氏曰長也不如蘇氏以為和俶始也如漢明帝唐徳宗非不明也然其失之太察今也既錫之以昭明矣又錫之以和則盡善盡美明皇憲宗是非不明也而其終也為小人所惑今也天錫之以髙朗之徳而又終而有始蘇氏曰昭明而能融髙朗而能終終而復始福無窮也惟受福如此故公尸以善言而告之公尸者鄭氏曰諸侯有功徳者入為天子卿大夫故云公尸公君也其公尸所告者則曰籩豆肅清之善而已陳少南曰尸傳嘏辭以告主人言福所以致於王者謂其籩豆靜嘉且𫝊所謂馨香而無䜛慝之意也然其所以静嘉者則以王之朋友共祭之人攝佐之以威儀無有不謹者此皆是接上文也此詩與下武之詩又是一體如後世飲馬長城窟之類青青河畔草悠悠生逺道逺道不可思宿昔夢見之夢見在我傍忽覺在他鄉他鄉谷異縣輾轉不可見是皆接上文而為言也黄曰前章既言介爾昭明而此又繼之以昭明有融注云融長也愚謂不如蘇黄門以為和也夫昭明則近於太察故必貴於有融髙朗令終朗乃明也令終有始有卒之謂也昭明則欲其有融髙朗則欲其令終而令終則又欲其有俶俶者始也終而復始徳無窮也漢明帝唐徳宗亦可謂明矣然其失也至於太察昭明而不能有融也明皇憲宗亦可謂髙朗矣然終為小人所惑髙朗而不能善其終也夫詩人既以景福期其君又以懿徳望其君以景福期其君臣子愛君之情也以懿徳望其君尤臣子之至情也公尸嘉告者盖古者之祭必立尸尸者所以象神也祝傳尸辭以嘏主人所以致嘉告也有祝辭有嘏辭祝以孝告嘏以慈告公尸嘉告先儒以為奉牲以告之意愚以為公尸嘉告者非祝辭也嘏辭也宗祝𫝊尸之辭以告主人謂其籩豆之靜嘉所以見其神之來饗也夫其籩豆所以嚴潔者固成王之誠亦相祀者之敬故曰朋友攸攝攝以威儀言相祀之人佐以威儀而無一人之不敬者夫祭不在物而在誠誠之所可見寓於威儀之間威儀一或不謹則有不足觀者矣此成王之祭所以先致嚴於威儀也遐想其宗廟之中來者雍雍至者肅肅駿奔走執籩豆者無敢不敬其威儀之嚴可即此詩而見盛矣哉威儀孔時君子有孝子孝子不匱永錫爾類李曰威儀孔時上之威儀甚得其時者則以君子有孝子之行故也君子能盡孝子之道而無有匱極也惟能親親故能化天下以為孝禮祭義曰小孝用力中孝用勞大孝不匱惟不匱故為大孝焉潁考叔為潁谷封人莊公賜之食食舍肉公問其故對曰小人有母皆嘗小人之食未嘗君之羮請以遺之遂使公感悟而其母子如初君子曰潁考叔純孝也愛其母施及莊公夫潁考叔封人也猶能使其君不孝之心移而為孝況為人君者豈不能推其孝以化天下乎上之人盡其孝道如此故天錫之以善也類善也黄曰忠孝一理也臣子一心也以是事親亦以是事君事親則為孝事君則為忠人臣平生大節可於閨門之中見之盖平居不敢忘其親則他日必不肯後其君平居不敢犯其兄則他日必不肯犯其長故臯夔稷契之徒居家以孝聞在國以忠顯而古人所謂求忠臣於孝子之門者信乎忠孝無異理臣子無異心也王致祀於其先其一時宗廟之中駿奔走執籩豆之人無非忠臣也而詩人之形容不曰吾君之有忠臣如此而乃曰吾君之有孝子如此可謂善形容矣又繼之曰孝子不匱永錫爾類此又詩人推廣之意也不匱云者此盖記禮者之所謂大孝也孝之為道始焉盡之於心行之於身施之於家而終焉推之於國達之於天下又安有所窮極焉故曰孝子不匱惟其孝之不匱也所以轉相敎化而永錫爾類也永錫爾類一句先儒之說曰類者善也錫者天錫之也言其能盡不匱之孝則天永錫之而以善道也愚竊以為不然洪範之書所謂錫厥庶民錫汝保極者是人君以中道錫之民也則所謂錫者何必曰天孟子所謂聖人之於民亦類也而書所謂别生分類者何必曰善如潁考叔愛其母而能化莊公之心君子稱之曰潁考叔純孝也愛其母施及莊公而因舉詩孝子不匱永錫爾類二句美之然則所謂永錫爾類者亦如潁考叔愛其母施及莊公如斯而已詩人之意盖以為相祀之人有孝子之行而又能轉相敎化以錫其朋類也此又愚人之臆說也其類維何室家之壼君子萬年永錫祚𦙍李曰言錫之以善者則自於室家之壼也壼廣也國語曰壼廣喻人民之衆也言既及室家遂及民也盖天子之孝愛敬盡於事親而徳敎加於百姓自家以之國非有二道也永錫祚𦙍言又錫之以祚𦙍也錫之祚𦙍者言天錫之福逺至於子孫無有窮也黄曰前章既言永錫爾類而此章又繼之以其類維何室家之壼先儒之說曰壼廣也喻人民之衆也如是則是詩人以室家二字形容其室家而又截壼之一字形容其人民一句而分二說非特其意不通而古人之句法亦必不然據壼說文云宫中道也則是室家之壼猶言室家之中也詩人之言以為人子之孝自其家始能盡其孝於身而後能化其家能化其家而後能化其人民所謂先及其寡妻兄弟而後能及家邦也君子萬年永錫祚𦙍先儒以為永錫祚𦙍者言天錫之逺及其子孫無有窮已也愚謂錫其祚𦙍者亦不必言天錫之以福要之以此孝道治其子孫而已故錫云者皆不必以為天錫也君子不能以福及其子孫而能以善錫其子孫以善錫其子孫乃所以福及其子孫也要之此亦是詩人愛其君而及其子孫云耳其𦙍維何天被爾禄君子萬年景命有僕其僕維何釐爾女士釐爾女士従以孫子李曰其所以錫之以福者言天被之福禄使之景命有屬而不絶其命不絶者言天錫之以女士也女士者言女子有士君子之行也都人士所謂彼君子女是也惟女子有士君子之行故子孫無有不賢者矣如所謂文王初載天作之合在洽之陽在渭之涘則是大姒之賢既配於文王矣故其生武王也復有聖徳此所謂従以孫子是也先儒以此詩備五福君子萬年壽也天被爾禄富也室家之壼康寧也昭明有融攸好徳也髙朗令終景命有僕考終命也以某觀之非特五福也方且至於子孫綿綿延延似續而不絶豈特五福而已哉觀既醉之詩民之祝之也至矣則其愛之也必深矣夫人君能使人祝之也至愛之也深夫豈勉強而使之然哉必有由矣黄曰天下無可必之事而有可必之理春秋之時諸侯多用卜筮之法而知其後世子孫之昌盛愚嘗疑其誣而未之敢信何者君子以理卜而不以龜卜孔子所謂積善之家必有餘慶積不善之家必有餘殃皆立為斷然之辭者以為此理之必然而無疑者也如中庸之稱舜稱武王皆曰徳為聖人尊為天子富有四海之内宗廟饗之子孫保之夫宗廟饗之子孫保之是安可必哉以其徳為聖人也則知其宗廟之必饗子孫之必保也此理也詩人之意無異於此其前章言君子以孝道永錫其祚𦙍而此章則言其𦙍維何天被爾禄盖以為吾君能以孝道錫其子孫則其子孫將何如哉天被之以福禄而使之景命有僕僕屬也言其景命之無窮也夫在天雖無可必之福而在人有可必之理天被爾禄景命有僕吾非能必之於天也吾能必之於吾君也吾君能以孝道錫其祚𦙍則其子孫必賢而天固有不容釋者矣此以理卜也非以龜卜也詩人之言非若左氏之誣也竊嘗讀既醉之詩而至此一章尤嘆詩人之善望其君也人知以福禄望其君孰知以其所以基福禄者望其君人知以其後世子孫昌盛望其君孰知以其子孫所從以昌盛者望其君既醉之詩始以介爾景福望其君中以天被爾禄望其君而終乃以景命有僕釐爾女士望其君噫詩人惓惓之意末章尤加詳焉竊嘗觀古今治亂之由未有不始於女士者也周之興也内則有大姒之賢外則有多士之濟濟及其衰也内則有襃姒之嫉妒外則有巧言之盈庭唐明皇時楊妃得寵於内故在外用事者則有楊國忠之徒肅宗時張后用事故在外用事者則有程元振之徒吁古今之治亂未有不由此者也詩人之愛其君而望其君以無窮之福非惟祈天之福於吾君而且祈天之福於吾君之女士女士之賢而子孫從之詩人之愛其君也至而望其君也逺鳧鷖守成也太平之君子能持盈守成神祇祖考安樂之也李曰物極則反治之極必至於亂安之極必至於危泰者通也物不可以終通故受之以否豐者大也窮大者必失其居故受之以旅此事之必至理有固然日中則􅉴月盈則虧理之有不能逃者雖然是則然矣惟聖人為能知進退存亡之義故常以為戒治不可以為常吾能執而守之則不至於亂安不可以為常吾能執而守之則不至於危此太平君子能持盈守成詩人所以美之也盈者如物之盈滿也物之盈者易覆茍持之而不失故能常盈成者言事之成遂也苟守之而不失故其成勿壊惟能持盈守成神祇祖考安樂之者盖鬼神之所享者非在於粢盛玉帛之間也人君能持盈守成則是得其事神之道矣鬼神聦明正直依人而行人茍不安神何所依惟能持盈守成神祇亦得所安矣隨之粢盛豐潔虞之享祀豐潔其所以祭神之物非不備也而鬼神之不饗者則以鬼神之所依者不在於物也觀此詩大槩言福禄之多未嘗言持盈守成王者但能持盈守成則為神祇祖考安樂之道也通詩者當求言意之表不可泥於章句也黄曰有可恃之資必有自恃之心當至足之時必有自足之志此人之情也可恃而不自恃愈足而若不足此非知進退存亡之理者能之乎天下之理極則必反盛則必衰日之中也􅉴月之盈也虧其時極其數窮也聖人知進之必有退存之必有亡是以無虞焉而儆無難焉而畏苞桑之繫常戒於無事之時薄冰之履常謹於安強之後天下之治已休休而聖人之心愈兢兢此非故為是矯激之行也聖人之心若曰我祖我父夙夜憂懼不敢康寧基天命於宥密成王業於艱難則盈成之功豈一朝一夕之所能致哉既盈矣子不能持既成矣子不能守豈我祖我父之心哉豈天地神人之心哉人皆以盈成為可喜而聖人以盈成為可懼盖盈者傾之幾而成者敗之漸也故天下雖有泰山之安而聖人常以累卵為心不敢驕也懼其驕而不能持也不敢怠也懼其怠而不能守也持守之誠盡於吾心之中而神祇祖考安樂於冥冥之際盖幽明一理也神人一心也冥冥之中雖不可知然以理推之以心求之其安樂也必矣豈待備物而後享哉髙而不危滿而不溢聖人所以為諸侯之孝則盈而能持成而能守豈非天子之孝歟聖人以孝祭非以物祭神明非享其物享其心神祇祖考安樂之說冝求於此鳧鷖在涇公尸來燕來寧爾酒既清爾殽既馨公尸燕飲福禄來成鳧鷖在沙公尸來燕來冝爾酒既多爾殽既嘉公尸燕飲福禄來為鳧鷖在渚公尸來燕來處爾酒既湑爾殽伊脯公尸燕飲福禄來下鳧鷖在潨公尸來燕來宗既燕于宗福禄攸降公尸燕飲福禄來崇鳧鷖在亹公尸來止熏熏㫖酒欣欣燔炙芬芬公尸燕飲無有後艱李曰鳧鷖在涇鳧水鳥也鷖鳧屬一名鷗涇水名也沙水傍也潨水會也亹山絶水也說文則以小水入大水曰潨公尸來燕來寧古者祭必有尸水鳥之在水猶尸之在宗廟也公尸來燕來寧言公尸來燕飲而安寧則是神祇祖考可知矣酒之清殽之馨乃與公尸燕飲以樂之也古者祭祀既畢明日用飲公尸所以成其福禄也來冝得其冝也來處得其所止也來宗居其尊位也宗尊也熏熏和恱也說文以為從酒從熏今且從此本爾酒既湑然而沛爾殽則脯也既與公尸燕飲矣冝其福禄來助也為助攸降即來下也崇厚也既與公尸燕飲則福禄之厚矣酒之美則欣欣然而樂薦燔炙之羞屬則馨香而美既與公尸燕飲則自此以後無有艱難者矣此詩多言公尸燕飲故說詩者多以此詩之首而求合乎序所謂神祇祖考安樂意如鄭氏於鳧鷖在涇則謂猶人為公尸之在宗廟也鳧鷖在沙則謂喻祭四方萬物之尸也鳧鷖在渚則謂喻祭天地之尸也鳧鷖在潨則謂喻祭社稷山川之尸也鳧鷖在亹則謂燕七祀之尸於門户之外此則以鳧鷖為說陸農師則以為福禄來成祖也來為考也來下天神也盖天神者自上來下也來崇地祇也盖地祇者自卑而髙也皆是妄為之說歐陽則破之曰此詩序言持盈守成神祇祖考安樂之不過言神人安樂而已鄭氏曲為分别譬在宗廟數處皆臆說也此言甚善此詩盖言水鳥或在涇或在沙各得其所神祇祖考安樂亦如此而已王氏又以在涇在沙在潨在渚在亹皆一一以為喻其說與陸鄭不甚相逺皆曲說也黄曰六經之中惟詩之講解為最難何者書也禮也易也春秋也一言一字必有㣲意是以講者有理而聴者不斁惟詩也託物以取況互辭以成章有四五章而不出一意者有重複其譬而不離一物者若章章句句而求為異說則失之鑿而非詩人歌詠之意若直而解之則近於無說而不足以𤼵明詩人之工今以鳧鷖一篇而論之五章中皆鳧鷖為說以公尸為義以福禄為美一鳧鷖耳一則曰在涇二則曰在沙三則曰在渚四則曰在潨五則曰在亹一公尸耳一則曰來寧二則曰來冝三則曰來處四則曰來宗五則曰來止熏熏一福禄耳一則曰來成二則曰來為三則曰來下四則曰來崇五則曰無有後艱儒者隨章而求為異說鄭氏則以為在涇喻公尸之在宗廟也在沙喻祭四方之尸也在渚喻祭天地之尸也在潨喻祭山川社稷之尸也在亹喻祭七祀之尸於門外也陸農師則以為來成祖也來為考也來下天神也盖天神自上而下也來崇地祇也盖地祇自卑而髙也以至來寧來止之類莫不皆為之說亦可謂用心於詩矣然用心愈勤而詩人之意愈逺則亦未免為曲說也詩人之意烏有若是紛紛哉故愚皆欲直而解之然恐近於膚淺而無說要以不失詩人之意而已說文云鳧鷖水禽也涇水名也沙水傍也渚沚也潨水會也亹岸也詩人見成王能持盈守成而神祇祖考安樂之故託鳧鷖之安於水而樂於得其所者以為況成王以孝祭而神明以心感詩人以為神之安樂可知也而神之格思不可度思或在天或在廟或在上下而或在左右此不可知也是以廣託之在涇在沙在渚在潨在亹以為況所以見神之無所不至而祭者之心以為如此也祭必立尸禮也尸既安樂而後神得以燕饗而降之福故來燕來寧來冝來處來宗來止無非形容公尸燕飲之樂也說文曰來寧安於饗也來冝得其冝也來處得其止也來宗居尊位也來止安燕而和恱也以成王之持守而可以知神心之安樂以公尸之燕享而可以知神之降福於吾君故福禄來成福禄來為福禄來下福禄來崇無非形容天神之降福於吾君如此其厚也形容其福禄而不能盡則又以無有後艱而形容之以見其非止一身之福而子孫無疆之福也易曰有大者不可以盈故受之以謙有大而能謙必豫故受之以豫夫有大者必盈而成王則能持守而不敢盈有大而能謙必豫則無有後艱之患固成王持守之所致也夫神祇祖考之安樂與其所以降福於吾君者皆自成王持盈守成之心而推之則詩人何暇盛述其酒殽之豐潔哉而詩人乃必稱其酒之清而殽之馨酒之多而殽之嘉酒之有醑而殽之有脯㫖酒之欣欣而燔炙之芬芬盖物不足以盡誠而誠實寓於物黍稷非馨而非黍稷亦無以為祭詩人亦安得而略之邪噫詳觀鳧鷖之詩初無持盈守成之說而作序者乃斷然以成王能持盈守成之語而𤼵明之吾不知其何自而得此意者作序之意盖曰成王豈以區區之物為足以享神祇而神祇祖考豈以徒享其區區之物而遂降之福禄邪求夫神祇祖考所以安樂之意而推夫成王所以致福禄之由未有不自持盈守成而得之也神祇祖考之安樂不在於奉祀之日而平時固己安樂之矣福禄之來不在於享神之後其平時固己有以得之矣詩人述其一時享祭之盛而作序者推其平日持守之心非深於詩者能之乎後世儒者皆守紙上語而不能自得於詩人言意之外愚於此益嘆作序者之深於詩假樂嘉成王也李曰左𫝊云公賦嘉樂則以為嘉則是嘉與假樂相通序詩者所以謂嘉成王也黄曰詩三百皆詩人之真情其惡是人也則刺之雖可惡而猶可改也則戒之誨之規之箴之其喜是人也則美之美盛徳之形容而告之於神明也則頌之故夫詩人之為詩無出於此獨假樂一篇為嘉成王而作或曰嘉者愛也言斯民嘉愛其君也然而古人有所謂嘉命者冇所謂嘉徳者則嘉猶美也不曰美而曰嘉非作序之故異其辭也嘗觀芣苢之詩不曰美后妃而曰后妃之美也盖形容其美而不能盡爾然則曰嘉成王要之亦形容其嘉徳而不能盡也成王有嘉徳之可嘉而詩人嘉之故曰嘉成王假樂君子顯顯令徳冝民冝人受禄于天保右命之自天申之李曰民之所以嘉愛於成王者則以成王有顯顯之今徳也所謂顯然之令徳果何自而知哉觀其民人無所不冝則可以見人君之冇顯然令徳也民無所不冝故受禄于天天之降災降福無不視於民天視自我民視天聴自我民聴桀紂之亡湯武之興皆在於民心之冝不冝今成王能冝民冝人冝其受禄于天也保安右助也天既安助而命之又從而申重之申重反覆無有厭斁也福兮禍所倚禍兮福所伏自古之禍福相為倚伏未有能常享其福者成王之徳上當天心故天保安而右助命之又従而申重之也黄曰詩人之稱成王曰大平君子曰豈弟君子而此曰假樂君子說者皆曰成王有顯顯之令徳而斯民嘉樂之故曰假樂君子愚竊以為不然夫成王之徳固可樂也然而以假樂為嘉樂則似若非詩人之意據假字釋文云音暇與閒暇之意通則所謂假樂君子猶大平君子豈弟君子之稱也嘗觀詩人稱其君以豈弟而記禮者以樂易形容之則假樂者豈非樂易君子之意歟雖然詩人以假樂名篇而見於左𫝊者則謂之嘉樂盖斷章取義類多如此不必求為異說也噫親民之道自明徳始得天之效自得人始成王當假樂之際而有顯顯之令徳惟是而民人冝之上天右之盖令徳既顯則民人必冝得乎民人而不得乎天未之有也夫天下民人之衆其喜怒之情不可知也而可於吾君之徳知之上天之命其從違之際不可測也而可於吾民之情知之堯舜禹湯文武之為君也民歸之天命之有不容釋者豈其為君者有求於民而為天者有私於君歟君有是徳民有是情天有是理夫是三者常相因而不相戾未有徳明而民不歸民從而天不與也詩人稱其君有顯顯之令徳而極其效於冝民冝人稱其民人之冝而極其效於受禄于天既曰冝民又曰冝人者異其辭也形容其得民之深如此耳既曰受禄于天又曰保右命之自天申之非贅其辭也形容其得天之深如此耳世之說者或曰冝民冝安民也冝人冝官人也愚以為不必如此其鑿又曰受禄者得天之始保右者得天之終也愚以為不必如此分别祗以為鑿耳噫衛武公善於其職而國人冝之人君之為天下而至於所謂冝民冝人吾見其君臣之間相愛如父子相信如兄弟而無一毫扞格於其間也由是而得乎天焉豈天之私哉自求多福在我而已故曰自天申之干禄百福子孫千億穆穆皇皇冝君冝王不愆不忘率由舊章李曰干禄求禄也天之所以保助之者是成王能自求多福也成王能自求多福故其享百福之盛而且至子孫千億以見其福禄之多也説詩者多以此章為成王子孫其嫡者則天子也其庶者則諸侯也觀上文言不愆不忘率由舊章下文威儀抑抑徳音秩秩皆是相通之辭則當論以為成王之徳如此言成王之垂拱無為但用舊章而已穆穆皇皇冝君冝王言成王端拱於一堂之上雍容無事優游無為其容止如此則冝其為君也冝其為王也冝君冝王亦如所謂克長克君既言克長又言克君皆詩人重美之辭也無有過愆無有遺失但且率循舊章而已黄曰守簡冊之辭者多疑學泥章句之末者多異說夫論經而折衷於聖人非不美也然而泥而不通則適以為贅而蠧夫經而為聖人之病増其惡而起其求異之意吁可怪也昔者子張有學干禄之請而夫子非之後世學者執夫子之說而求之於詩見其冇干禄百福之稱則曰是何夫子之所非而詩人之所美也遂以干禄百福為子孫百福夫求合於夫子之說而遂至於輕變經文吁亦固矣夫干禄豈聖人之所惡哉子張不能自求多福而有干禄之學不求乎我而求乎彼其心術之陋已可見矣是以非之烏可執其一說而盡疑夫干禄之非也盍亦觀其所以求之者如何耳成王以明徳而得民故其受禄于天有不可辭者詩人以為天無私也人不能以私干天也上天之福可以自求而不可以幸得成王之受禄于天豈天私之哉在成王之所以求之者固有道也故曰干禄百福夫智可以欺王公而不可以欺豚魚力可以得天下而不可以得匹夫匹婦之心是以人君不能必夫天之福於吾之子孫而能必夫民之心不能忘乎吾之子孫民心之不能忘在天可知矣成王之受禄于天吾不求之於天也而求之於民何者成王之令徳有以冝夫民而民樂其福乃歌詠而祈之曰天之降福於吾君豈如此而已哉將見其子孫千億之多穆穆皇皇之盛皆冝為君也冝為王也無過無失也而盡循乎典章之舊也是雖千萬年而天下可使如一日也噫成王何以得此於民也哉成王有冝民冝人之徳故斯民有冝君冝王之願吾今而後知福不在天而在民不在民而在君君有不可忘之徳而民有不能忘之情民有不能忘之情則天有不容釋之意世之人君皆知以盛大之業貽其子孫而不知以吾民之情以貽子孫豈知福禄之所本哉說者曰天子穆穆諸侯皇皇盖成王之子孫其本為天子而穆穆其支為諸侯而皇皇予以為不然穆穆皇皇冝君冝王皆詩人形容其子孫之盛而樂其有天下耳如詩所謂於皇時周於皇武王則皇皇之稱豈必曰諸侯如詩人之稱王季既曰克長又曰克君而其稱宣王子孫之盛則亦曰室家君王則所謂冝君冝王者豈容有異說邪予以為詩人之情皆在於冝之之意而初無如此紛紛也學詩而泥於一言一字之末則何足以得詩之㣲意威儀抑抑徳音秩秩無怨無惡率由羣匹李曰其威儀又抑抑而美其徳音又秩秩而有常則其所以待臣下者無有怨惡矣故能率用羣臣也成王不恃其聦明既率由舊章又率用其羣臣此成王所以致垂拱之治矣黄曰竊觀天保之序曰君能下下以成其政臣能歸美以報其上而鹿鳴之序亦曰既飲食之又實幣帛筐篚以將其厚意然後忠臣嘉賔得盡其心矣至於吉日之序亦曰宣王能謹㣲接下無不自盡以奉其上焉盖嘗疑之曰人臣之事君當如人子之事親善則稱親過則稱己人臣之當然也幹蠱服勞不敢怠不敢慢亦人子之當然也吾知盡吾子職之當然而已豈必曰吾親之所以待吾者何如而後報之如此為人臣而事其君歸美以報其上盡心以奉其上皆人臣當然之事也今曰君能下下而後人臣歸美以報之焉君能接下而後人臣自盡以奉之焉君有以將其厚意而後人臣得以盡其心焉設若為君者之或不然則為人臣亦將不歸美不盡其心不奉其上乎是必有大不然者矣及讀假樂之詩至此一章然後知人臣之事君固當盡其心而人君之待其臣亦當盡其禮禮不盡則情不通君臣之間而萌一疑心焉怨惡之患吾不知其所止也成王之待羣臣威儀之抑抑非過於自卑也徳音之秩秩非過於自明也盖所以使其君臣之間歡欣和穆各不相怨各不相惡率由其匹偶而守職也昔鄭武公莊公為平上卿士王貳于虢鄭伯怨王王曰無之故周鄭交質夫用鄭伯而復貳于虢其威儀之不抑抑可知矣隂貳于虢而陽曰無之其徳音之不秩秩可知矣故至於鄭伯怨王而終於周鄭交惡君臣之情兩不相安而至於怨惡豈所謂無怨無惡而率由羣匹哉雖然在平王則陋矣然為臣而如鄭伯天所不覆地所不載也噫為君當如成王無如平王為臣當如成王之臣無如鄭伯受福無疆四方之綱之綱之紀燕及朋友李曰既率用其羣臣於是無為在上受福而但執其紀綱四方雖逺皆我為之緫制矣紀綱既正則與臣下燕飲而樂之故之綱之紀燕及朋友也黄曰論人君之福與論常人之福不同也夫常人之所謂福者曰慶賞曰玉帛而人君者慶賞自我出玉帛自我與是豈足以為人君之福哉是必有大於此者矣夫國之所以存者不在乎強與弱也歴數之所以長短者不在乎富與貧亦觀其所以紀綱天下者如何耳故元氣不存雖壯且盛不足以為一身之福紀綱不存雖強且富不足以為人君之福周之既衰諸侯作而戰伐日行以周之地則不大於滕曹以周之民則不衆於邾莒然而歴數百年宗主天下雖以晉楚齊秦之強不敢加兵者何哉紀綱存焉耳秦以山西鏖六國欲帝萬世劉氏一呼而闗門不守武夫健將賣降恐後何哉紀綱亡焉耳然則詩人以無疆之福願其君而特曰四方之綱之綱之紀其意不亦淵乎雖然綱紀立而君臣之分嚴分嚴而情不通亦非人君之福也何者尊卑闊絶而上下之情疎禮儀繁多而君臣之義薄是以古之賢君至嚴而有所謂至寛至察而有所謂至容天下之紀綱有不可不舉者而其所以待其臣者推之以至誠御之以無威談笑議論無所不至飲酒宴樂無所不及不責之以臣下之分而待之以朋友之禮故文武之所謂嘉賓成王之所謂朋友皆所以通其至嚴之分而共享其無疆之福也竊聞仁宗皇帝盛時天人和同上下歡心才智不用而道徳有餘功業難名而福禄無窮内而朝廷外而四海其紀綱素舉肅然有不可犯者而其君臣之間歡欣和恱相得而無間當此之時若父若子若内若外莫不歌詠盛徳而樂至仁泰和氣象如成周時盛矣哉百辟卿士媚于天子不解于位民之攸塈李曰以上之人待臣下如此則為臣者將何以報君哉於是百辟卿士皆愛天子而無有懈怠於位而所以致民於休息凡此皆所以報其上也或曰羣匹或曰朋友或曰百辟卿士其職不同皆羣臣矣黄曰古人以民媚君後世亦以民媚君古人愛民以媚君後世殘民以媚君故夫稷契伊周之徒為民以奉上而秦商君漢桑𢎞羊唐楊國忠之徒傷民以奉上其媚于天子同也其所以媚于天子者吾不忍同日談焉噫愛民以媚君非媚也忠也殘民以媚君非忠也欺也夫君猶父母也民猶赤子也臣猶保傅也為保傅而欲媚其君莫若愛其赤子不知赤子之為愛而曰吾忠於君也天下庸有此理哉然則詩人論百辟之媚于天子而特曰不解于位民之攸塈而已其言亦可見矣不特此詩為然卷阿詩前一章曰媚于天子後章曰媚于庶人夫稱媚于天子於前而稱媚庶人於後何也盖所以見其媚于天子之道特在於媚庶人而已噫外而百辟内而卿士欲媚於君當媚於民欲安於民當勤於位外而百辟有百辟之事内而卿士有卿士之責一職廢則一事廢民不勝其病矣豈愛君之道哉惟各職其職各事其事不侵官以生事不慢事以廢職職舉而事治事治而民安媚君之實莫大焉故嘗謂天下之未治吾民之未安皆不足憂也人臣知有己而不知有君知媚君而不知媚民是大可憂也上不負天子下不負所學愚切惓惓於斯言毛詩集解卷三十二
