body:
  text: 毛詩集解卷十九宋李樗黃櫄撰鹿鳴之什詁訓傳第十六小雅鹿鳴燕羣臣嘉賔也既飲於朕反食音似之又實幣帛筐篚以將其厚意然後忠臣嘉賔得盡其心矣呦呦音幽鹿鳴食野之苹我有嘉賔鼔瑟吹笙吹笙鼓簧承筐是將人之好我示我周行呦呦鹿鳴食野之蒿呼毛反我有嘉賔德音孔昭示民不恌他彫反君子是則是傚我有旨酒嘉賔式燕以敖呦呦鹿鳴食野之芩我有嘉賔鼓瑟鼔琴鼔瑟鼔琴和樂且湛我有旨酒以燕樂音洛上同嘉賔之心李曰人君之於羣臣嘉賔既有酒飲饌食之又實幣帛於筐篚之中以將厚意然後忠臣嘉賔莫不效忠以報上之恩德而得盡其心矣實幣帛於筐篚者鄭氏云飲之而有幣酬幣也食之而有幣侑幣也按聘禮云君不親食使大夫朝服致之以侑幣又曰致饗以酬幣既有侑幣又有酬幣侑幣所以勸飽也酬幣所以送酒也此詩言羣臣嘉賔序則兼言羣臣嘉賔而詩中皆以嘉賔而言者孟子曰用下敬上謂之貴貴用上敬下謂之尊賢貴貴尊賢其義一也人君之於臣既有尊賢之義至其燕饗也則謂之賔所以敬下也舜尚見帝帝館甥于貳室亦饗舜迭爲賔主堯之於舜而爲賔主之禮則知古者之於人臣其燕之時皆有賔主之禮也左傳曰饗以訓共儉燕以示慈惠見成十二年杜預云饗有體薦燕有折俎蓋饗者但以其體薦之於俎爵盈而不飲殽乾而不食此之謂訓共儉燕之以時則折俎君臣之間相與醉飽此之謂示慈惠惟其示慈惠故略其君臣之禮盡其賔主之歡上下之情忻然無間則忠臣嘉賔安得不盡其心哉魚麗之序曰文武以天保以上治内采薇以下治外天保以上者自鹿鳴以至天保是也鹿鳴之詩文武所以待其下者如此則當時之臣報其上者亦如此君使臣以禮臣事君以忠故作此詩以宴樂也燕禮小臣納工工四人二瑟工歌鹿鳴四牡皇皇者華笙入立於縣中奏南陔白華華黍乃間歌魚麗笙由庚歌南有嘉魚笙崇丘歌南山有臺笙由儀遂歌鄉樂周南關雎葛覃卷耳召南鵲巢采蘩采蘋大師告於樂正曰正歌備徹俎説屨而行無筭爵無筭樂則是文武以後以此詩爲燕樂羣臣之歌也予嘗觀春秋之時穆叔如晉晉侯享之金奏肆夏之三不拜工歌文王之三又不拜歌鹿鳴之三三拜韓獻子使行人子貟問之曰吾子舎其大而重拜其細敢問何禮也對曰三夏天子所以享元侯也使臣弗敢與聞文王兩君相見之樂也臣不敢及鹿鳴君所以嘉寡君也敢不拜嘉見襄四年夫鹿鳴之詩君所以悦使臣而穆叔拜之則知後世以鹿鳴而燕羣臣推此可見程氏謂自鹿鳴以下二十二詩各賦其事而用之其周公之謂乎左傳曰常棣之華鄂不韡韡凡今之人莫如兄弟穆公亦云則知此詩周公之所作召公乃歌之也蓋周室衰微兄弟道缺故召穆公思周德之不類糾合宗族於成周歌常棣之詩今此以燕羣臣冝歌鹿鳴之詩則小雅之諸詩皆如此詩也苹鄭氏以謂藾蕭毛氏以謂苹蓱據爾雅以謂苹䓑其大者爲蘋是水中之草也鄭氏則據郭璞云今藾蕭也初生亦可食陸璣注云葉青白色莖似箸而輕肥始生香可生食又可蒸食是也孔氏則從鄭氏之説不以爲水中之草謂鹿鳴無由至水而食故不從之王氏則從毛説謂苹爲水草王氏之意以爲鹿鳴而食野之苹以喻當時之君飲食此皆鑿説按草蟲經曰鹿欲食則鳴相召者不忘其羣也此言文王既有酒食以飲食之以燕羣臣亦如鹿鳴得苹而食則呼其朋類而食之也毛氏以爲鹿得苹呦呦然鳴而相呼懇誠發於中歐陽破之以謂豈有禽獸而懇誠發於中哉瑟者包羲氏所作笙者十二簧隨之所作簧者笙中之簧女媧氏所作言得嘉賔而燕樂之既鼓瑟矣又爲之吹笙既吹笙矣又吹笙中之簧以樂之又奉其筐篚實幣帛於中而與之既待羣臣如此之切至則羣臣皆愛其上則冝以此而示周之列位者言既知吾之所以待下者如此彼冝以此而示周之列位也王氏謂周爲忠信之周行道也言示之忠信之道王氏之意謂序云得盡其心故爲此説然序所謂盡其心詩中未必有此意如葛覃之詩曰躬儉節用則可以化天下以婦道亦猶此詩能待臣下如此則羣臣不得不盡其心也孔氏謂忠臣嘉賔得盡其心者序因言君有恩惠可以得臣之心緫美燕樂之事於經無所當也此言得之矣鄭氏謂示當作寘置也言當置於周之列位然此言人臣樂君之燕饗何爲至此方寘於列位也蒿菣也孫炎曰荆楚之間謂蒿爲菣郭氏曰今人呼爲青蒿香中炙啖者爲菣言我得此嘉賔其德音甚明視民則不恌視古示字也但從示邊其德音甚明則可以使民其德不至於偷薄非獨可以視斯民不至於偷薄亦使君子之人取爲法則而效之以見嘉賔之賢可知矣又有旨酒與嘉賔式燕以遊遨芩陸璣注云莖如釵股葉似竹蔓生澤中下地鹹處爲草眞實牛馬亦喜食之湛久也非惟鼓瑟又且鼓琴非惟和樂又且至於湛久程氏曰三章言其樂之長久無斁惟其如此則人君之燕飲必能樂嘉賔之心然後爲能盡其志蓋不能樂其心則如繆公之亟餽鼎肉其待羣臣非不切至而子思以爲犬馬畜伋則何以燕樂嘉賔之心哉惟樂其心然後能盡人君之禮然忠臣嘉賔豈將以口腹累於君哉必待人君飲食之豐幣帛之厚聲樂之歌然後能盡其心者蓋以人君有好賢之誠則人臣皆知人君之能篤好於我孰肯不盡其心惟其有鹿鳴之燕以待其臣下如此然後忠臣嘉賔皆得以盡其心夫人君之好賢有加無已必於燕飲之間見之夫飲食微事爾君臣和協以致太平亦由此焉君臣乖爭以致禍者亦由此焉楚人獻黿於鄭靈公公子宋與子家將見子公之食指動以示子家曰他日我如此必嘗異味及入宰夫將解黿相視而笑公問之子家以告及食大夫黿召子公而弗與也子公怒染指於鼎嘗之而出見宣四年衛獻公戒孫文子寗惠子食皆服而朝日肝不召而射鴻於圃不釋皮冠而與之言二子怒見襄十四年其後鄭靈公卒不免其身衛獻播遷而失國則人君所以待臣下者可不愼哉黄曰孟子曰君之視臣如手足則臣視君如腹心君之視臣如犬馬則臣視君如國人君之視臣如土芥則臣視君如寇讎予嘗讀孟子至此章於我心有大不合者夫臣之事君如子之事父君以禮遇我則事君之心不可以不盡君不以禮遇我則事君之心尤不可以不盡而必曰君以此待我而後我以此待君乎意者孟子之言亦有激云耳及讀詩鹿鳴而其序亦曰既飲食之又實幣帛筐篚以將其厚意然後忠臣嘉賔得盡其心然則爲之君者茍能待之以飲食實之以筐篚則爲之臣者亦可以盡其心邪小星之夫人惠及嬪御而嬪御盡其心江沱之嫡不以媵備數而嬪御亦盡其心況忠臣之事君其義當如何予嘗三復此序始而疑終而悟以爲序者之意在於得盡其心之一句君臣之間開心見誠相好之深相信之篤而後忠臣得以盡其所欲爲茍君臣相與齟齬而不相信上下相顧鰓鰓然而不能以自安而何暇及天下之利害是雖欲盡其心有不可得者文王之待其臣也好之之篤而待之之至禮愈盡而心不能以自足曰我有嘉賔我有旨酒親之之辭也曰鼓瑟吹笙吹笙鼓簧又曰鼔瑟鼔琴樂之之辭也然文王豈以區區之飲食幣帛聲樂爲足以待賢哉繆公之於子思亟問亟餽鼎肉而子思不悦曰今而後知君之犬馬畜伋則旨酒幣帛聲樂亦不足以待賢者矣孟子曰食而弗愛豕交之也愛而不敬獸畜之也恭敬者幣之未將者也恭敬而無實君子不可以虚拘則飲食幣帛所以將其恭敬之心耳故曰承筐是將而序曰以將其厚意文王之待賢既盡恭敬之意而又有以將之想其君臣之間相信如父子相愛如兄弟朝廷之中優游悦懌相得而無間則爲之臣者出身以事君委命於上而無所憂懼故曰和樂且湛而序亦曰忠臣嘉賔得盡其心矣爲臣而爲忠臣爲賔而爲嘉賔則是賢也德與位稱名與實孚足以致君於當道化民以成俗故曰示我周行言能以道示其君也如示我顯德行之意也曰德音孔昭言其令聞之昭著也如秩秩德音之意也曰視民不恌言其視民之不薄也如薄己以厚民之意也曰君子是則是傚言其在位者之法式也如有覺德行四國順之之意也所謂忠臣嘉賔如此則文王安得不厚遇之邪吾觀舜禹之時君臣之相告語如家人父子之唯諾開心平意之際相與終日而不見其隙今文王待羣臣以嘉賔之禮而接之以燕飲之歡其亦舜禹之朝乎其後成王之燕嘉賔見於南有嘉魚之詩亦周人之家法也後之爲君者傲然於上而爲臣者奔走於下藐然而不相及尊卑闊絶而上下之情踈禮節繁多而君臣之義薄此天下之事所以每每擾敗而無所成就也文王經營内治而先燕羣臣嘉賔其亦自培其根者歟王襃作聖主得賢臣頌曰明明在朝穆穆布列聚精㑹神相得益章上下俱欲歡然交忻千載一合論説無疑則曷禁之不止曷令之不行此文王之所以内治而待羣臣嘉賔之意也或曰君臣之分如天尊地卑之不可易而謂之嘉賔不亦過乎蓋自上下之分言之則謂之羣臣自燕飲之義言之則謂之嘉賔堯之饗舜迭爲賔主是天子而友匹夫也孟獻子百乗之家而有友五人焉繆公問子思曰古者千乗之國以友士何如子思不悦曰古之人有言曰事之云乎豈曰友之云乎蓋子思之意以謂若以位則子君也我臣也何敢與君友也以德則子事我者也奚可以與我友千乗之君求與之友而不可得則謂之嘉賔豈爲過哉此子思之意也亦孟子之意也亦堯舜文王所以待其臣之意也四牡勞力報反使所史反臣之來也有功而見知則説音悦矣四牡騑騑芳非反周道倭於危反遲豈不懷歸王事靡盬我心傷悲四牡騑騑嘽嘽他丹反駱馬豈不懷歸王事靡盬不遑啓處翩翩音篇者鵻載飛載下集于苞栩王事靡盬不遑將父翩翩者鵻載飛載止集于苞杞王事靡盬不遑將母駕彼四駱載驟駸駸麤金反豈不懷歸是用作歌將母來諗李曰四牡之詩其言使臣之奉使及其歸也乃作此詩以勞之夫人臣大功惟恐其不見知今四牡五章其所以勞之之辭皆言其勞苦之狀則是深知之矣毛氏乃以爲率諸侯以朝聘之事毛氏之說則以謂文王之遣使者是率諸侯以朝聘之事也然按此詩上則有紂下則有諸侯又有因民事以出者何所據而云朝聘哉使臣之出往使諸侯亦多故矣何必以爲朝聘哉事既久遠又無明文不可從也騑騑行不止也周道毛氏以爲岐周之道倭遲而歴遠惟其道之長遠故行之不止可謂勞矣當此之時使臣豈不思歸但以王事無不堅固方行役以從王事不可歸也惟其不可歸但思父母以悲傷爾所謂王事者公事也不必指爲天子之事此詩猶可說也北門之詩曰王事適我鴇羽之詩曰王事靡盬則當如之何一云靡盬無有幹之者又謙之曰盬字訓壞吾豈不思歸以其不敢壞王事之故駱馬毛氏以爲白馬黑鬛曰駱廣雅以爲白馬朱鬛曰駱陸農師以爲今謂黃馬朱鬛一道通黑如界者爲駱則不拘於朱黑皆可以爲駱也嘽嘽喘息貌程氏謂駱馬禁久陸農師以謂今之駱馬最耐勞苦矣以耐勞苦之馬今則喘息則其勞可知矣言馬之勞則可以見使臣之勞矣詩人言馬以見臣下之勞卷耳之詩曰我馬瘏矣言馬之勞苦甚病足以見使臣之勞今以耐勞之馬而至於喘息則其勞甚矣啓毛氏以爲啓跪其說本於爾雅要之大意爲不暇居處之義受命而行不遑啓處也鵻爾雅曰鵻其鳺鴀舎人曰鵻一名夫不李廵曰夫不一名鵻今楚鳩也左氏曰祝鳩氏司徒祝鳩即鵻其鳺鴀者其性孝故爲司徒陳翥以爲一宿之鳥鄭氏以爲夫不鳥之慤謹也此言鵻之翩翩然或飛或下集於苞栩之上亦猶使臣或行或止皆從王事詩人之意如此蘇氏乃以爲孝子此則泥於祝鳩氏司徒之說也王氏亦以爲況臣之一於事君此則泥於陳氏一宿之鳥也將毛鄭皆以爲將養程氏則以爲事其言雖殊其意則一也言王事無不堅固雖欲事養父母皆不暇矣杞柳也今人則以爲箭非枸杞之杞駸駸疾行貌言駕此四牡至於疾行豈不懷歸乎但不以家事辭王事也故作四牡詩以歌之以其不遑將母之情而告之諗告也毛氏以爲念鄭氏以爲告毛氏本於爾雅然左傳曰辛伯諗周公諗告也當以爲告鄭氏以爲作此詩之歌以養父母之老來告於君非也夫以使臣之勞遂以養其父母之情而來告於君則是君不見知也使君見知於己豈必待來告然後知其勤勞哉程氏以爲告於父母也父則主義母則主恩惟不知義故告於母非也夫君惟知其勤勞故作詩以告之必曰將母而不曰將父者蓋將母連四章之文而言也此詩與東山之詩無以異東山之詩但言征夫暴露之難以爲勞歸士之詩四牡之詩但言使臣道路之勞以爲勞使臣之詩蓋其歴勞苦之乆得人君反覆言其勞苦之狀則是上之人見知於己安得而不恱哉北山之詩曰或燕燕居息或盡瘁事國或息偃在牀或不已于行或不知叫號或慘慘劬勞非不憂其父母也則其勤勞無以異於四牡然北山之所怨怨其君之不見知也君不見知則安得不怨哉故人臣之恱不繫於其勞不勞但繫人君知與不知爾黄曰内不足者急於人知而自信不篤者急於人之我信人臣之於國要其無愧於天無愧於心無愧於天下來世則已矣君不吾知天不吾知乎當世不吾知後世不吾知乎則夫知與不知誠有所不足計輔相之功絶口不言而金縢之書因事自顯方其天威未震嘉禾未偃遠則四國流言近則王不知自常人處之必有憤怒之意而周公赤舄几几綽然有餘裕公之心固曰有功於國者人臣當然之事也而奚必期人之我知邪然四牡之詩人以有功見知則恱者何其汲汲也蓋周公之事必周公爲之而後可以自言四牡之臣將命於外其心之所慮者惟恐夫君之不吾知而吾不能以自安也噫不得乎親不可以爲子不得乎君不可以爲臣況人臣將命而出以適異國可不見知於君哉魏文侯使樂羊將而攻中山三年而拔之反而論功文侯示之謗書一箧羊再拜曰此非臣之功君之功也四牡之使臣以見知而恱非樂夫君之知其功也樂夫君之知其心也故四牡一詩皆序其道路憂勤之狀思念父母之情文王能盡人之情如此則臣安得而不自慰周公東山之歸勞士卒而序其情閔其勞亦文王所以勞使臣之意也東山歸士之所以恱即四牡使臣之所以恱也然四牡之所謂有功而見知者又非東山歸士之比學者當以意求之則詩人之意爲得之矣皇皇者華君遣使臣也送之以禮樂言遠而有光華也李曰此詩言遣使臣也遂歌此詩以遣之送之以禮樂勉之以詢問下民之疾苦利病使君之德意交孚於下四方萬里之遠無不知人君所以撫恤斯民之意如此然後遠而有光華也所謂有光華者每章下句皆是也而其所謂送之以禮樂孔氏云即首章下二句盡卒章是也此謙虚訪落直爲禮耳而兼言樂者以禮樂相將既能以禮敏達則能心樂平易故兼言之夫所謂送之以禮樂者考之詩文之中實無所當孔氏以爲首章下二句盡卒章此乃附會經文以求合詩序其實非也蓋所謂送之以禮樂歌皇華之詩以遣之即是送之以禮樂也皇皇者華于彼原隰駪駪所巾反征夫每懷靡及我馬維駒六轡如濡如朱反載馳載驅周爰咨諏我馬維騏音其六轡如絲載馳載驅周爰咨謀我馬維駱六轡沃烏毒反若載馳載驅周爰咨度我馬維駰六轡既均載馳載驅周爰咨詢李曰皇皇猶煌煌也華草木之華也髙平曰原下溼曰隰言煌煌然光明者乃是草木之華曰原曰隰無不光華亦猶人臣出使至於四方萬里之遠無遠無近無不光華也駪駪衆也征夫使臣之屬也言使臣其屬之多也至於毎懷靡及毛氏以爲懷私罔及鄭氏以爲懷私言使臣之屬既受君命當速行每人懷其私相稽留則於事將無所及皆不如歐陽之說其人以爲毎思惟恐不及王氏以謂毎以無所及事爲懷蘇氏以謂每懷不及事之憂其說與歐陽同言使臣之屬皆以不及事爲憂則使臣可知矣亦猶卷耳言我僕痡矣則言使臣亦可知也濡言潤澤亦猶所謂羔裘如濡也絲言其調忍也沃若潤澤也駰隂白雜毛曰駰均言調一也此詩言使臣所乘之馬唯是駒矣所御之轡則如鮮澤其乘此馬援此轡驅馳則周爰咨諏毛鄭之說皆以忠信爲周其說蓋本左氏内外傳予嘗觀左氏曰訪問於善爲咨咨親爲詢咨禮爲度咨事爲諏咨難爲謀國語亦曰咨才爲諏咨事爲謀咨義爲度咨謀爲詢其序不同其義則一皆以忠信之人往咨而問之毛鄭用其說歐陽破之以爲咨謀咨詢其義不異但變文以協韻爾毛鄭意謂大夫出使見忠信之賢人就而詢問今詩乃曰周爰咨諏是出見忠信之賢人止一周字豈成文理此說是也夫左傳之中其所舉詩人之句多矣皆出於一時之斷章未必盡合詩人之意如必以所舉之詩而解詩則泥矣如皇矣之詩曰維此王季帝度其心貊其德音其德克明克明克類克長克君王此大邦克順克比比於文王其德靡悔則以心能制義爲度德正應和爲貊照臨四方曰明勤施無私曰類教誨不倦曰長賞慶刑威曰君以爲九德皇矣之詩左氏以爲九德亦如皇皇者華之詩左氏以爲五善國語以爲九德皆不可以解詩人之大意也周者但是周徧言使者之奉使周徧其所而詢問之不必以爲忠信之人也周官撢人之職掌誦王志道國之政事以廵天下邦國而語之使萬民和說而正王面則是使臣之職欲其周徧咨謀無所不及也蓋使臣體上之德意告之於下欲下之人無不知上之德意又以下之利病告之於上使上之人無不知下之疾苦則亦欲其無所不問明矣四牡之詩勞使臣之詩也皇華遣使臣之詩也夫去則遣之還則勞之惟先遣而後勞則皇皇者華當在四牡之前今也列之於四牡之後孔氏曰使臣之往反固非其一四牡所勞不必是皇皇者華所遣之使二篇之作又不必一人故以輕重爲先後也夫遣之與勞一也安得以遣爲重以勞爲輕哉蘇黄門以爲鹿鳴之三章施於禮樂不獨用於勞遣故燕禮鄉飲酒歌焉意者以其聲爲先後歟蘇氏之說則據儀禮以爲說然以聲樂爲先後則是一意也孔氏嘗以伐柯九罭破斧東山然後終以狼跋今皆顛倒不次者以爲簡篇脫誤或者次詩不以作詩之先後孔氏之說亦一見也邠詩既是不以作詩先後爲序則皇皇者華之詩以輕重爲先後安知此詩非簡篇脫誤作詩不以先後之序乎蓋三百篇之多本有顛倒者如載馳之詩衞懿之詩乃在於文公之後清人之詩鄭文公之詩乃在於突忽之前葛藟之詩平王之詩乃在於桓王之後皇皇者華君遣使臣之詩乃在於四牡之後而邠風之破斧乃在於東山之前雖其顛倒如此亦非詩之本意也四牡之詩但言人君之勞使臣不可不知其勤勞皇皇者華但言使臣之出使不可不詢其疾苦詩之本意如斯而已如必泥先後之序非詩人之本意也黃講同常棣燕兄弟也閔管蔡之失道故作常棣焉常棣之華鄂不韡韡韋鬼反凡今之人莫如兄弟死喪之威兄弟孔懷原隰衰矣兄弟求矣脊令在原兄弟急難每有良朋況也永嘆吐丹反兄弟鬩許歴反于牆外禦其務毎有良朋烝也無戎喪亂既平既安且寧雖有兄弟不如友生儐賔􅏷反爾籩豆飲酒之飫於慮反兄弟既具和樂且孺妻子好合如鼓瑟琴兄弟既翕和樂且湛荅南反冝爾室家樂爾妻帑是究是圗亶其然乎李曰此詩言燕兄弟之親冝加恩惠以時燕樂之以盡親親之義也閔管蔡之失道者當周公攝政之時其兄管蔡不能同心以蕃王室故流言於國謂公將不利於孺子又挾武庚淮夷以爲亂則是管蔡失道矣周公於是舉兵東向以平􅆫亂以兄弟之親則視如路人豈得已哉蓋以天下誅之不得不然也周公傷己兄弟不睦故作此詩言兄弟不可不親也觀此詩閔管蔡之失道是周公所作無疑矣嘗觀左傳僖二十四年富辰曰召穆公思周德之不類故糾合宗族于成周而作詩曰常棣之華鄂不韡韡凡今之人莫如兄弟其四章曰兄弟鬩于牆外禦其務如是則兄弟雖有小忿不廢懿親周之有懿德也猶曰莫如兄弟故封建之其懷柔天下也猶懼有外侮扞禦侮者莫如親親故以親屏周召穆公亦云杜元凱注云當周公時故言周之有懿德周公作詩召公歌之也國語亦曰周文公之詩曰兄弟鬩于牆外禦其務則知此詩周公所作也魚麗之詩曰文武以天保以上治内采薇以下治外天保以上常棣之詩在其中矣若周公以閔管蔡失道而作此詩則不得以爲文武以上治内之詩也若以常棣爲治内之詩則不得爲周公所作也二序之相矛盾不可以並立也故嘗謂詩序非一人所作蓋謂是也常棣爾雅曰常棣一名棣郭氏云今關西有棣樹子如櫻桃可食陸璣曰白棣樹也如李而小子如櫻桃正白四月熟又有赤棣樹亦似白棣葉如刺榆葉而微圎子正赤如郁李而小五月熟自關西天水隴西多有此常棣與唐棣異何彼穠矣之詩曰唐棣之華與論語所舉唐棣之華偏其反而則爾雅所謂栘棣也此之謂常棣與采薇之詩曰維常之華則爾雅之所謂棣也二者異木也後世多以此常棣讀爲棠棣則是以栘讀爲棣也承華曰鄂韡韡光明也不韡韡鄭氏謂不當作柎鄭氏好改字不得以爲柎歐陽氏以爲不韡韡者韡韡也詩人之辭多如此王氏則以爲不韡韡甚言其韡韡然詩人言不韡韡不應以爲韡韡楊龜山爲國子祭酒嘗論此詩以爲周公閔管蔡之失道言常棣之華鄂不韡韡者蓋言常棣上承而下覆華則覆蕚蕚則承華以喻兄弟之和睦當如此也今也管蔡失道不能親睦和協如常棣之鄂至於不韡如旄丘之詩曰旄丘之葛兮何誕之節兮蓋葛本蔓延也何爲而不蔓延常棣之華鄂本韡韡也何爲而不韡韡則見管蔡之失道也惟其管蔡之失道故告凡今之人不可以不愛其兄弟也故下章言朋友不可恃兄弟不可踈言不可踈其所親而反親其所踈也蓋以兄弟之情至艱難而後見雖死喪之可畏者惟兄弟之親然後甚懷之故裒集于原隰之中惟兄弟之親則求之他人則不與也脊令在原兄弟急難此又託喻以明兄弟之心林回曰彼以利合此以天屬也夫以利合者廹窮禍患害相棄也以天屬者廹窮禍患害相收也惟其天屬之親故急難之際能盡其兄弟之恩以脊令觀之可以見矣脊令雝渠也郭氏曰雀屬也陸璣曰大如鷃雀長脚長尾尖喙背上青灰色腹下白頸下黒如連錢故杜陽人謂之連錢是也蓋脊令飛則鳴行則揺不能自舎以喻兄弟能相求也脊令能相求今也則在原失其常處飛鳴不能自舎猶兄弟之於急難相須而不舎也當此急難之時則雖有良朋況也永嘆而已況長也言朋友之情且嗟嘆之而不能相救也鬩很也務侮也言兄弟或不相得鬩很于牆内外若有他人來侵侮之則不可不外禦也言不可以小忿廢懿親也戎相也烝久也言有急難則雖朋友之久亦不相助以見兄弟之情過於朋友也急難之時兄弟相救如此及喪亂既平無事之日安且寧矣則以一朝之忿一毫之私若反眼不相識遂爲兄弟之鬩乃以謂雖有兄弟不如友生然人豈可以安樂之時則棄其兄弟而於急難之中乃以望其相救詩人設此以爲戒言不可以安寧之時而棄其兄弟而以爲不如友生也惟於安寧之時不可不親其兄弟則於安寧之時當儐陳其籩豆而相爲醉飲飫飽也使兄弟既具集會聚和樂且孺相親屬毛氏以爲九族非也則又與妻子好合歡合如鼓瑟琴之相應然後可使兄弟翕合和樂而湛久兄弟既翕必先妻子者顔之推嘗曰方其幼也父母左提右挈前襟後裾食則同案衣則傳服學則連業逰則共方雖有悖亂之人不能不相愛也及其壯也各妻其妻各子其子雖有篤厚之人不能不少衰也蓋其兄弟之所以乖争者未必不本於此必先於妻子好合然後可以使兄弟和睦也夫人不能合於妻子之好則不能敦兄弟之愛既不能敦兄弟之愛則雖家室妻帑必不能樂之故必妻子好合然後可以和合於兄弟也兄弟之乖爭小則忿鬭之相侵大則干戈之相尋敗國亡家皆由於此故必兄弟既翕和樂且湛然後可以冝爾室家樂爾妻帑也中庸曰天下之達道五曰君臣也父子也夫婦也昆弟也朋友之交也是五者非人之所難行但恐不能反而思之耳故必教之以深思遠圖必信其爲然以見兄弟不可不親也究思也圗謀也司馬温公嘗曰兄弟鬩于牆外禦其務必相救者情也呉越之人不相識一旦遇風波之厄則同舟而濟勢也其情與勢不同其急緩相濟則一也舜之於象可謂怨矣而舜不以爲怨況爲人弟者不及於象乎冝其親愛之心不可少忘也然此詩言兄弟可親則是朋友之義可廢曰非也蓋親踈之義不得不如是也不愛其親而愛他人者謂之悖德不敬其兄而敬他人者謂之悖禮己之兄弟不能愛況於愛他人乎既不能愛人人誰愛己古人有言曰兄弟爲左右手也如人相鬭截其左手而謂人曰我必勝此其可乎己之兄弟不能愛則其於朋友必不能相親也孟子曰今有同室之人鬭者救之雖被髮纓冠而救之可也鄉鄰有鬭者被髮纓冠而往救之則惑矣雖閉戸可也此蓋言親踈之義如此兄弟於急難之際則必盡心力以救之毎有良朋烝也無戎亦以見親踈之義也若必以此詩言不如兄弟遂以爲朋友之義可廢則亦如咸丘蒙舉詩曰普天之下莫非王土率土之濵莫非王臣遂以瞽瞍爲舜之臣可也伐木燕朋友故舊也自天子至於庶人未有不須友以成者親親以睦友賢不棄不遺故舊則民德歸厚矣伐木丁丁鳥鳴嚶嚶於耕反出自幽谷遷于喬木嚶其鳴矣求其友聲相去聲彼鳥矣猶求友聲矧伊人矣不求友生神之聽之終和且平伐木許許釃所冝反酒有藇音湑既有肥羜直吕反以速諸父寧適不來㣲我弗顧於音烏粲灑掃陳饋其位反八簋既有肥牡以速諸舅寧適不來㣲我有咎伐木于阪釃酒有衍籩豆有踐兄弟無遠民之失德乾餱音侯以愆有酒湑思叙反我無酒酤音戸我坎坎鼓我蹲蹲七旬反舞我迨我暇矣飲此湑矣李曰既謂朋友又謂之故舊者亦如鹿鳴之詩既謂之羣臣又謂之嘉賔也不必分别言之孔氏以故舊惟施久遠遂以此詩卒章上句爲燕故舊二章爲燕朋友分章析句其言不通一至於此學者不可不察自天子至於庶人未有不須友以成者蓋上自天子下及庶人之賤皆須朋友切磋琢磨之力以成德也然庶人之於朋友又在上之人率之於上爲上者既能内親其親而至於和睦友其賢者而不棄其故舊者則又不遺則民皆翕然效德歸於淳厚之域而無天下俗薄朋友道絶之患也丁丁毛氏曰伐木聲也嚶嚶毛氏以爲驚懼說文以爲兩鳥鳴此兩說皆通釋訓曰丁丁嚶嚶謂切直也爾雅但見此詩爲朋友之詩遂以丁丁嚶嚶爲切直未必然也鄭氏遂引此說亦非也說詩者但見序言自天子至於庶人遂於詩中而求其庶人求友之義求之而未得之則遂據伐木以爲庶人之求友王氏曰八簋天子之禮也伐木庶人之事也然未始不須友以成也蘇氏曰事之甚小而須友者伐木也物之無知而不忘其羣者鳥也鳥出於谷而遷于木以木爲安而不獨有也故嚶嚶然而鳴以求其友況於事之大於伐木而人之有知者哉此皆是以伐木之人爲庶人之求友竊以爲不然按序所謂自天子至於庶人蓋連下文而云謂天子既須友以成庶人亦須友以成蓋庶人之所爲在天子率之爾庶人之求友當於卒章而求之不可引伐木爲說既以伐木爲庶人之事又以嚶嚶爲鳥之求友則其理不相貫當從歐陽說謂鳥在木上聞伐木之聲則驚鳴而飛飛遷于他木方其驚飛倉卒之時猶不忘其類相呼而去其在人也可不求其友乎蓋此詩言當伐木之時鳥嚶嚶然而鳴出自幽隂之谷遷于喬髙之木其所以嚶然而鳴者求友之聲也鄭氏於此則曰昔日未居位在農之時與友生於山巖伐木爲勤勞之事猶以道德相切正也此說不然使文王未居位之時則當爲世子安得爲農而伐木哉足以見鄭氏之說陋也相視也視彼鳥之嚶嚶而鳴尚能求友況於人也異於鳥獸遠矣可不求友乎人能求友神之聽之終和且平天子求友以治天下而有和平之效庶人求友以治一身而有和平之效鄭氏謂神若聽之使得如志則友終相與和而齊功也以平爲齊功未之敢信伐木許許毛氏云許許柹貌言伐木而有柹貌許愼說文以許許爲所所亦未之敢信聲詩以爲許許且從詩人之言而用毛氏之說釃酒漉酒也藇毛氏云美貌羜未成羊也速召也王氏曰以庶人之窶而伐木之友然猶釃酒有藇以待之又況於既有肥羜以速諸父乎如王氏之意且以伐木之事爲庶人之求友以肥羜爲天子之求友上下既無分别不可如此說觀此詩言伐木丁丁伐木許許伐木于阪其說難明歐陽公曰是詩主以鳥鳴求友爲喻爾至其下章則不及鳥鳴之意但伐木許許伐木于阪便述朋友之事與首章意殊不相類蓋失其本義矣當闕其所未詳以俟深於詩者歐陽公尚且闕之況其下乎竊以爲二句皆是承上章既言伐木丁丁鳥鳴嚶嚶下章但云伐木許許者省文也亦猶四牡詩上章言不遑將母卒章言將母來諗其文不備亦是緫結上章將母之文也既言伐木之時鳥猶求友君子於閒暇之時則有釃酒肥羜召諸父宴樂諸父同姓之朋友也此古人忠厚之情有見於此故寧使召之而自不來無使言我不顧念也我不顧念是我之罪也召而不來非我之罪也夫人所以怨生者本於相責觀此之言是皆責己而不責人此其所以和平也於粲灑掃粲鮮明貌於是粲灑掃其室庭陳飲食有八簋也圎曰簋天子八簋肥牡即肥羜也天子謂同姓諸侯曰伯父諸侯謂同姓大夫亦曰伯父其異姓則曰伯舅如齊姜姓非同姓故左氏以謂伯舅耋老呼齊爲伯舅則魯與衞多稱叔父者以其同姓也咎過也此言既有肥羜以速諸舅寧適不來微我有咎其意與上章同衍者毛氏以爲美蘇氏以爲多當從蘇說籩豆有踐踐陳列也言釃酒之多肥羜之美欲使兄弟無相踈遠也餱食也民之所以失德而見謗訕者以乾餱之食而見過於人爲天子者安可不設酒食而見恨於兄弟乎有酒湑我無酒酤我此則言百姓之求友也湑莤之也左氏𫝊爾貢包茅不入王祭不共無以縮酒酤者毛氏曰一宿之酒也鄭氏曰買也然按説文曰酤一宿酒也又曰沽也是毛鄭之說皆是按論語沽酒市脯不食沽酒即買也今且據論語爲信坎坎鼔聲宛丘之詩曰坎其擊鼔是也蹲蹲舞貌諸家之說皆以卒章爲天子之燕朋友如詩所謂有酒湑我無酒酤我此乃庶人之事安得爲王者乎孔子尚沽酒市脯不食豈得爲王者燕朋友之禮乎然上章既言天子求友此章則言庶人化之而敦朋友之好焉有酒則莤之無酒則沽之又舞我鼓我以相燕樂且述其志而告之曰及我閒暇日而飲此湑以爲燕樂故曰迨我暇矣飲此湑矣論曰孔子曰君子篤於親則民興於仁故舊不遺則民不偷所謂篤於親則民興於仁則於角弓之詩見之矣故舊不遺則民不偷於此詩見之矣如陳勝之既立也故人入見或言客愚無知專妄言輕威勝斬之諸故人皆引去由是無親勝者陳勝之興故人猶且殺之況其踈者乎冝其衆之不附也光武幼與嚴子陵游同學及其即位常引陵入内共偃臥陵以脚加帝腹上明日太史奏客星犯帝座甚急帝笑曰朕故人嚴子陵共臥耳以子陵之傲睨萬乘之尊如此光武不以爲怒則其與陳勝之殺故人爲何如哉觀東漢之風俗感激尚義雖子陵有以激之然其敦於風俗朋友之義在光武不爲無力由是觀之風俗之厚薄皆繫於人君之好惡爲人君者可不戒哉黃講同毛詩集解卷十九
