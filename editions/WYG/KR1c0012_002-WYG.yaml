body:
  text: 毛詩集解卷二宋李樗黄櫄撰葛覃后妃之本也后妃在父母家則志在於女功之事躬儉節用服澣濯之衣尊敬師傅則可以歸安父母化天下以婦道也李曰孔氏謂本者后妃之本性非也所謂本者但務本而已言后妃雖富貴猶且不忘本無事於浮末也后妃在父母之家諸家多以為未嫁之時若以為未嫁之時則其下文何以為歸安父母其文不相接孔氏以謂在父母家本有此性出嫁修而不改婦禮無愆其中增以出嫁修而不改之文未必然也蓋父母家即所謂歸寧也張横渠楊龜山皆以在父母家為歸寧之時言后妃之歸寧也志猶在於女功之事躬儉節用服澣濯之衣尊敬師傅能如是則可以歸安父母如未嫁之時志在於女功之事躬儉節用服澣濯之衣尊敬師傅皆未足以為美惟其既為后妃矣而其所志者猶不忘於舊日然後可以爲美蓋能如此則可以慰安父母之心而化天下以婦道不然驕奢淫佚雖曰歸寧不足以安父母而化天下以婦道也志在女功即二章所謂為絺為綌是也躬儉節用服澣濯之衣即詩中所謂薄汚我私薄澣我衣是也尊敬師傅即詩中所謂言告師氏言告言歸是也歸安父母即詩中所謂歸寧父母是也至於化天下以婦道而詩中獨無文何哉蓋作詩者推言后妃之本如此故因經以見事因事以生義夫以后妃之賢又能志在女功其勤如此天下之為人婦者豈有不勤乎躬儉節用服澣濯之衣其儉如此天下之為人婦者豈有不儉乎尊敬師傅其禮如此則天下之為人婦者豈有不知禮乎以文王之行化於上而后妃又能治内以化乎下此以見内外之無不治也黄曰后妃之本說者以為后妃本性之美如此李迃仲以為務本非本性也然序特曰后妃之本而已安知其為本性又安知其為務本哉陳少南謂本在父母家時此説為當李迃仲謂在父母家若以為未嫁之時其下文何以為歸安父母其文不相接孔氏謂在父母家時本有此性嫁而不改迃仲以為不然夫孔氏之説固羡辭而迃仲之説亦未安蓋迃仲祖龜山横渠之説以為既嫁而歸寧之時猶不敢以富貴自驕而志猶在於躬儉節用尊敬師傅然序特言在父母家而未嘗言既嫁而歸父母家也迃仲以為后妃歸寧之時志猶在於女功之事如此然詩是刈是濩為絺為綌皆是實事豈有后妃歸寧之時而尚采葛以為絺綌乎且序言歸安父母而繼之以化天下以婦道若以為既嫁而歸父母之家則奚遽及此一句也夫婦人謂嫁曰歸方后妃在父母家之時躬女子之職行節儉之事敬師傅之禮故其歸文王也可以安父母之心而化天下以夫婦之道此詩人推本論之也闗雎言后妃風化天下正夫婦故此詩言其所以能化天下以婦道者本其在父母家之時人惟能貧賤不移故富貴不淫人惟能於一家無愧故能於天下無愧序詩之意其以是歟葛之覃兮施以䜴反于中谷維葉萋萋黄鳥于飛集于灌木其鳴喈喈葛之覃兮施于中谷維葉莫莫是刈魚廢反是濩胡郭反為絺恥知反為綌去逆反服之無斁音亦言告師氏言告言歸薄汚我私薄澣我衣害户葛反澣害否歸寧父母李曰葛者所以為絺為綌覃延也萋萋者言叢盛也黃鳥者黃鸝也灌木者叢生之木也喈喈者聲之和也鄭氏以葛之覃兮喻女在父母之家形體浸浸然日長大以維葉萋萋喻容色美盛以黄鳥于飛集于灌木其鳴喈喈興女有嫁於君子之道和聲之逺聞興女有才美之稱達於逺方夫以婦人形體浸浸然日長大何足以為婦人之美乎歐陽公嘗非之矣王氏又以黃鳥于飛以俞后妃集于灌木以喻文王其說與鄭氏亦不甚相逺惟歐陽公以為因時感事當葛之延蔓於谷中其在谷中也則萋萋然茂盛此乃黄鳥飛集灌木其鳴喈喈之時然以黄鳥于飛繼之以施于中谷之下皆是因時感事也莫莫葛之成就也刈者取也濩者煑也精者為絺粗者為綌服之無斁者服之而無有厭斁即序所謂躬儉節用也蓋以葛蔓之時而黄鳥之鳴為后妃者因時感事記其舊日在家之時勤於女功如此於是歸焉故張横渠之詩曰葛蔓春長谷鳥遷女心興念憶歸安是也言告師氏言者與言歸于好之言同説者以為我亦不必然也師者女師也古者不獨男有師傅女亦有師傅教之以婦徳婦言婦容婦功祖廟未毁敎于公宫三月祖廟既毁教于宗室此言在家有師傅如此襄公三十年宋災伯姬存焉傅至母未至逮火而死事見公羊以火災猶告於師傅今后妃歸寧父母亦必告於師氏歸者亦是歸寧諸家多以婦人謂嫁曰歸非也薄汚我私薄澣我衣此則序所謂服澣濯之衣也薄者語辭也私燕衣也頗汚其私其用功則深澣濯其衣其用功則淺隨衣服之所宜者而用功之深用功之淺則私與衣之不同又有不澣者言何所當澣乎何所當否乎以見儉之中禮也惟其能如此則可以歸安父母觀此所言則知后妃可謂賢矣論曰東坡有言常食芻豢矣難與食粟常衣錦繡矣難與衣布既為大者則不屑屑而為小者處富貴而忘貧賤此人之常情也魯公父文伯之母自績紡其子曰以歜之家而主猶績隋鄭善果之母自紡自績善果曰兒封侯開國至五品何苦為此以文伯善果之母居富貴而猶自績紡其子猶以為言况為后妃者當何如唐莊宗時劉皇后與宫中尚閥閲其父劉叟往見之皇后告莊宗曰妾父不幸死於亂兵此乃田舎翁遂不以其父為父而笞於宫門外劉氏如此況能志在女功乎況能躬儉節用服澣濯之衣乎況能尊敬師傅乎以劉氏觀之然後知太姒之為賢也舜居深山之中飯糗茹草若將終身焉及其為天子也被袗衣鼓琴二女果若固有之且舜處貧賤無異於處富貴處富貴無異於處貧賤其心如此此舜之所以為舜也舜乃聖人也處富貴乃能如此后妃婦人耳而其為后妃之時無以異於在父母家之時此其所以為難也明徳皇后身衣大練裙不加緣是亦有后妃之風矣以皇嗣未廣薦達左右惟恐不及既有關雎之風矣及身衣大練裙不加緣又有葛覃之風是則明徳皇后生於三代之後風化既衰猶且如此誠可深嘉而屢歎也黄曰此一詩皆興也倉庚鳴矣而爰求柔桑春日遲遲而采蘩祁祁物情景態接乎其目因時感事動乎其中是故鳴鵙者載績之候也鳴蜩者斂穫之候也心之所念情之所感有不能自已者則身處乎室家之中而志在於女功之事當葛之延蔓於中谷其葉萋萋然而茂盛黃鳥集于叢木之上其聲喈喈然而和鳴則時將夏矣古人詩云麥黄椹熟栗留鳴栗留即黄鳥也灌木即叢木也此記時之將夏也后妃當葛生延蔓之候而感黄鳥和鳴之聲於是乎動其女功之念及其葉莫莫然而成就於是乎躬刈濩之勤刈而取之濩而煑之精者以為絺粗者以為綌發乎至誠而非出乎勉强故能無厭斁之心其躬儉節用於此可見張横渠詩曰葛蔓春長谷鳥遷女心興念憶歸安此則浸失詩人之㫖矣唐人詩云葛葉萋萋黄鳥飛女心悲念欲為絺横渠葢祖此句然謂女心興念憶歸安則是以為后妃既嫁之後非葛覃之意也言告師氏與言歸于好之言同説者以言為我非也師女師也古者女子亦有師傅教之婦言婦徳婦容婦功先嫁三月祖廟未毁教于公宫三月祖廟既毁教于宗室此在父母家時師傅也后妃尊敬師傅歸文王而必告師氏其好禮之篤如此此豈勉强所能至哉薄汚我私薄澣我衣衣者衣服之緫名私者燕私之常服也澣者洗濯之緫名汚者濯之繁多者也薄助辭也汚其私澣其衣各有法也何者當澣何者當否亦各有法也竊於此四句不獨是后妃之節儉而亦見其衣服之微澣濯之事亦皆有法度而不可紊亂以此助人君之内治則其所言所行者皆天理也非私意也況歸於文王豈不足以安父母之心乎竊嘗論之霍后萌一驕侈之心而亡其宗族長孫皇后終身不敢過於用度而數世賴之則躬儉節用以歸安父母誠婦人之所難也況處富貴之極者哉雖然飯糗茹草若將終身焉及其為天子也被袗衣鼔琴若固有之舜惟處貧賤故能處富貴太姒惟在家有躬儉節用之美故能為后妃而無險詖私謁之心詩人形容太姒之徳如此而推本其在家之時其㫖深矣巻眷免反耳后妃之志也又當輔佐君子求賢審官知臣下之勤勞内有進賢之志而無險詖私謁之心朝夕思念至於憂勤也李曰古者天子立后六宫三夫人九嬪二十七世婦八十一御妻以聽天下之内治以明彰天下之婦順故内和而家理天子立六臣三公九卿二十七大夫八十一元士以聽天下之外治以明彰天下之男敎故外和而國治葢闑内之事后妃主之闑外之事天子主之故后妃之職惟在於求衆妾以助内治闗雎之詩是也至於求賢審官知臣下之勤勞此乃天子之職后妃特輔佐之而已此序言后妃之志則是求賢審官知臣下之勤勞但有其志耳夫有進賢之志則無險詖私謁之心有險詖私謁之心則必無進賢之志是二者不可以兩立明矣唐明皇時楊妃得寵於内故在外用事者有李林甫楊國忠之徒肅宗之時張皇后用事故在外用事者則有李輔國程元振之徒是所謂有險詖私謁之心則必無進賢之志也今后妃之為人内既有進賢之志則必無險詖私謁之心所謂險詖私謁者蓋婦人得寵則多挾寵以私薦其親戚如成湯以六事自責有曰女謁盛歟以成湯之聖猶恐女謁之盛行今后妃無險詖私謁之心則可謂賢矣黄曰無攸遂在中饋婦人無外事求賢審官知臣下之勤勞者人君之職也人君不能官人於列位知臣下之勞苦而使后妃為之思念不已則人君之志荒矣蓋又當輔佐君子求賢審官止是一句求賢審官非婦人之事但輔君子之求賢審官而已故曰内有進賢之志進賢亦非后妃所當與但有其志也有進賢之志者必無險詖私謁之心志在於公則必能忘其私志在於國則必能忘其家此所以朝夕思念至於憂勤也噫太姒婦人耳其所以存心者如此之大後世位大臣者不能輔君求賢為國逺慮而志在於附下罔上自植私恩者其視卷耳之詩當如何其愧汗也采采卷耳不盈頃筐嗟我懐人寘彼周行户康反陟彼崔徂回反嵬五回反我馬虺户回反隤徒回反我姑酌彼金罍維以不永懐陟彼髙岡我馬𤣥黄我姑酌彼兕徐履反觥古横反維以不永傷陟彼砠七餘反矣我馬瘏音塗矣我僕痡音敷矣云何吁矣李曰卷耳爾雅云苓耳叢生如盤頃筐韓詩以為欹筐毛氏云畚屬周行鄭氏謂周之列位按襄公十五年曰嗟我懐人寘彼周行能官人也王及侯伯子男采衞大夫各居其列所謂周行也杜元凱曰周徧也則知所謂周行者但周徧於列位非商周之周也采采非一采也荀子曰卷耳易得也頃筐易盈也然而不可以貳周行鄭氏及王氏皆從其説以謂卷耳易得之菜頃筐易盈之器今也采采卷耳非一采而乃至於不盈者以其志在進賢不在於采卷耳也亦猶采綠之詩曰終朝采藍不盈一襜終朝采綠不盈一匊謂其志在於怨曠而不在於采藍采綠也然以后妃之貴而乃至於采卷耳無乃儉不中禮乎如汾沮洳曰彼汾一曲言采其藚彼其之子美如玉美如玉殊異乎公族以公族猶且不當如此而后妃乃至於采卷耳則是儉不中禮也故歐陽以為取喻非是親采卷耳言以卷耳之菜而采之難得亦如賢才之難得也后妃之志在於思得賢才以寘於列位以見后妃有進賢之志也王氏曰於懐人言我内之也於周行言彼外之也然觀下文曰陟彼崔嵬我馬虺隤亦是以彼我為辭若王氏之説則我馬虺隤亦是内之陟彼崔嵬亦是外之其説不通矣陟彼崔嵬我馬虺隤此則言使臣之勤勞也土山戴石曰崔嵬虺隤者馬有勞病之狀山脊曰岡𤣥黄者馬有病黄之色石山戴土曰砠瘏病也痡亦病也凡此皆言使臣之勞也其言馬之𤣥黄其僕之病則使臣之勞可知矣如出車詩曰僕夫況瘁則將帥之勞可知矣王氏則以陟彼崔嵬我馬虺隤為取喻非也上言使臣之勤勞故我酌之以金罍庶幾不長念之也姑且也言其勞如此吾且酌之以金罍爾兕觥者兕似牛一角青色以兕角而為觥乃罰爵也旅酬無筭必有醉而失禮者以觥爵罰之所以為樂也古者宴享之禮必有兕觥左傳成公十四年衞侯享苦成叔寗惠子曰兕觥其觩㫖酒思柔故知享有兕觥也昭元年鄭人宴趙孟穆叔子皮曹大夫興拜舉兕爵曰小國賴子知免於戾矣故知宴有兕觥也方其我馬虺隤則酌之以金罍則是小勞而小飲之也及其馬之𤣥黄則勞之甚矣故酌之以兕觥則是酌之誠有加而無已也及末章則言云何吁矣言勤勞之甚則雖有金罍兕觥猶不足以酬其勞徒知長歎之而已夫以婦人之職在於備飲食故詩曰無非無儀維酒食是議易曰在中饋無攸遂婦人之職既在於掌酒食故后妃因此僃酒食以寓其進賢之志也然其進賢之志其始也酌之以金罍其終也酌之以兕觥猶以為未也又曰云何吁矣以見詩人之言有盡而意無窮也論曰觀棫樸之詩曰遐不作人文王之官人既見於棫樸之詩后妃之進賢以輔佐君子又見於卷耳之詩則是文王之詩濟濟多士文王以寧文王之盛徳皆太姒之助也以文王之臣予曰禦侮予曰疏附予曰先後予曰奔奏其往來廸文王之彛敎可謂勞矣文王既能知臣下之勤勞使有功者見知而悦而后妃又能知臣下之勤勞酌之以金罍酌之以兕觥其終也猶以為未足以盡其意且至於長歎則是當時之臣皆知其勤勞而無有不宣力於王室者此文王之徳所以降於國人三分天下有其二也至幽王之時十月之交刺其小人用事仲允膳夫棸子内史蹶維趣馬楀維師氏繼以􅃩妻煽方處則是羣小用事而皆因􅃩妻以進是所謂有私謁之心故當時賢者雖有勤勞亦莫之知此如北山之大夫以其從事不得養其父母遂作詩曰率土之濱莫非王臣大夫不均我從事獨賢此則異乎卷耳之詩矣宜乎周室之衰不復振矣黄曰此一詩皆興也少南謂后妃不特采荇以供祭祀亦當采卷耳以僃酒醴荀卿之説亦曰卷耳易得頃筐易盈今不盈者以其心之憂思在於求賢而不在於卷耳此説皆不然汾沮洳之詩曰彼汾一曲言采其藚彼其之子美如玉美如玉殊異乎公族以公族而自采其藚詩人猶刺其儉不中禮以后妃而自采卷耳其理不然后妃之意蓋謂求易得之菜而志不在焉尚不能滿易盈之器則求賢才而寘之列位志不在焉而可乎特取之以為興焉耳惟后妃之志思念不已故能知臣下之勤勞而思所以燕勞之謂使臣之出其勞苦萬狀所陟之山則險而崔嵬也所乘之馬則病而虺隤也其勤勞如此則酌之金罍以報其勤酌之兕觥以致其歡此雖未足以盡其思念之懐而亦姑以見其實勞之意庶幾不至於懐念傷歎之極耳髙岡𤣥黄亦崔嵬虺隤之義反復言之見其思念之不已也惟其思念之不已故其言之不足又曰陟彼砠矣我馬瘏矣我僕痡矣云何吁矣是不特馬之病而僕亦病矣金罍兕觥亦不足以盡其思念之志矣此所以𤼵之嗟嘆而託之詠歌也夫詩不言使臣之勞而特言馬之病僕之困非不言也不言所以深言也杕杜之詩言四牡痯痯則征夫可知出車之詩言僕夫況瘁則將帥可知此人之所以説也北山之詩役使不均而且不知其勞或燕燕居息或盡瘁事國或息偃在牀或不已于行之句所以不能無怨刺也楚伐蕭師人多寒王撫而勉之三軍之士皆如挾纊夫師徒之寒王撫而勉之則知其寒矣王知其寒而師徒不知其寒非不知其寒忘其寒耳然處富貴者必不能知人之貧賤處安逸者必不能知人之勞苦后妃處深宫之中而能知臣下之勤勞雖其所歴艱難險阻莫不知之何其賢哉此無他志於求賢而不以險詖私謁亂其心耳嘗觀文王命將遣戍之際而作為詩以相娛樂亦皆言其道路之勤勞風雨之艱窘而人樂為之用耳意者其亦后妃輔佐君子求賢審官之功歟樛木后妃逮下也言能逮下而無嫉妒之心焉李曰婦人有六徳一曰柔順二曰清潔三曰不妒四曰節儉五曰恭敬六曰勤勞自天子至於大夫其媵妾有數惟庶人則但曰匹婦然婦人之性妒寵而負恃爭妍而取憐如楚莊王夫人樊共姬曰妾幸得僃埽除十有一年矣未嘗不私􅂢衣食遣舎人於鄭衞求美人而進之於王也妾所進者九人今賢於妾者二人與妾同列者七人妾知妨妾之愛奪妾之貴也妾豈不欲擅王之愛専王之寵哉不敢以私廢公也蓋以私滅公者易以公滅私者難此樛木之詩所以美之也黄曰孔子曰惟女子與小人為難養也近之則不遜逺之則怨夫惟其能怨與不遜則夫處深宫之中擅寵幸之榮者安能使其心之無嫉妒也蓋女無美惡入宫見妒自古以來莫不皆然人情所在况於婦人女子乎如漢之二趙隋之獨孤唐之武氏亦足以見矣而其禍皆至於亡國則樛木之后妃詩人安得不歌詠其美也南有樛居虬反木葛藟力軌反纍力追反之樂只之氏反君子福履綏之南有樛木葛藟荒之樂只君子福履將之南有樛木葛藟縈烏營反之樂只君子福履成之李曰樛木者木之勾曲也言南方之木樛然而勾曲故使葛也藟也得纍而蔓之亦如后妃逮下無嫉妒之心而衆妾得以上進也曰南者言南方之所生王氏則曰南明方木仁𩔖者蓋南方者喻后妃之明也使南方有木皆是喻其明則漢廣之詩言南有喬木何所取喻乎王氏又曰樛木則葛藟得以附麗葛藟盛則木亦得以自蔽也然詩所言者但言木之勾曲爾非取喻其得以自蔽也荒者奄也縈者旋也皆是喻衆妾得以進御於君也故繼之曰福履綏之履禄也將大也鄭氏曰妃妾以禮義相與和又能以禮樂樂其君子使為福祿所安謂樂只君子以禮樂樂君子非也所謂樂只君子但是衆妾祝願其上之辭歐陽公謂如萬夀無疆之類是也先言纍之後言荒之繼之以縈之先言綏之後言將之繼之以成之詩人之辭多重複也詩中之辭多重複亦有先後之序亦有不可為先後之序如闗雎之詩先言琴瑟友之後言鐘皷樂之此其先後之序也如卷耳之詩先言維以不永懐後言云何吁矣此其先後之序也若此詩則不可為先後之序也言既能逮下無嫉妬之心逮與吕刑羣后之逮在下同天子内則有后妃為之助外則有大臣為之助其揆一也在内者得后妃為助而后妃能逮下則衆妾得以進御於君以成肅雝之治在外者得大臣為助而大臣能逮下則衆才得以咸進於上以成肅雝之治此福祿所以綏之也論曰女無美惡入宫見妒士無賢不肖入朝見疑蓋女子之情皆有嫉妒之心惟女子有嫉妒則凡婦人之進幸者必將忌之如趙飛燕姊妹専寵宫中御幸生子者輙死凡飲藥墮胎者無數此婦人之嫉妒也如大臣之有嫉妒則賢才不得以進如李林甫有妒賢之心公卿不由其門而出輙被罪遷徙附麗者雖小人亦為引重所居堂號偃月堂毎欲排陷大臣則居之若喜而出則其家碎矣此大臣之妒也凡此皆危亂之萌欲致福禄不亦難乎孔子曰惟女子與小人難養也近之則不遜逺之則怨夫以不遜與怨皆嫉妒之所由生也黄曰詩人形容江漢之女無思犯禮則曰南有喬木形容后妃能逮下而無嫉妒之心則曰南有樛木喬木取其不可休息之意樛木取其能逮下之意二詩之意大不相侔而義各有取也樛木勾曲之木也猶卷阿之義惟卷曲之阿故能來自南之風以見成王屈己求賢之意惟勾曲之木下垂故葛藟得以上蔓纍之荒之縈之以見后妃逮下之意興者喻后妃之下逮故衆妾亦得以上進也繼之曰樂只君子福履綏之鄭氏曰妃妾以禮義相和又能以禮樂樂其君子使為福禄所安以樂只為禮樂以福履為福禄皆羡辭也迃仲以為衆妾祝願其上之辭如萬壽無疆之意蓋李本歐陽之説亦未為當以予觀之履云者止是動履之履不必以為禄也嘗妄論之常人室家之中苟有不賢之婦則其閨門不和動履乖矣非一家之福也后妃苟有嫉妒之心則不能無險詖之行險詖一萌私謁從之非人君之福也此詩人形容后妃無嫉妒之心而有逮下之美則亦形容閨門和樂之意謂文王所履者皆福履也福者百順之名言閨門和樂則所履皆順此文王雍雍在宫時也經言妻子好合如鼓瑟琴孔子曰父母其順矣乎亦此詩意也中庸言文王以王季為父武王為子而曰無憂者其惟文王乎此詩言文王有太姒之賢而曰樂只君子福履成之中庸形容其父子之美而此詩形容其閨門之美中庸言其無憂而此詩言其和樂吁此文王所以聖歟螽音終斯后妃子孫衆多也言若螽斯不妒忌則子孫衆多也李曰鄭氏云凡物之有陰陽情慾者無不妒忌惟蚣蝑不爾各得受氣而生子歐陽以謂螽斯不妒忌鄭氏何由知之歐陽之意以為凡蟲生子詩人取其意以比之爾言螽斯之子孫衆多則可言螽斯之不妒忌則不可此序當曰不妒忌則子孫衆多若螽斯也今其文則先言若螽斯後曰不妒忌則是文顚倒耳此詩言不妒忌亦如桃夭言不妒忌言不妒忌皆是承上文而言之也螽斯之詩言不妒忌則是承上文樛木而言之言能不妒忌則子孫衆多耳若螽斯桃夭之詩言能無妒忌則男女以正昬姻以時國無鰥民亦是承上文而言之也黄曰此一篇鄭氏失之歐陽辯之陳少南李迃仲從而推廣之其義詳矣大抵詩人以螽斯比后妃取其子孫衆多也作詩序者既曰言若螽斯又曰不妒忌則子孫衆多言若云者繼上文之辭不妒忌者乃其推本之論蓋子孫衆多者人君之福而不妒忌者婦人之所難也如趙飛燕姊妹爭寵凡有進幸者輙死後宫飲藥墮胎者無數卒之成帝無子皇嗣中絶其視螽斯子孫衆多之詩寧不媿乎漢明德皇后嘗以皇嗣未廣每懷憂歎薦達左右惟恐不及後宫有進幸者多加慰納此宗社之所以隆而本之所以昌也故嘗謂太姒不妒忌而周以興褒姒嫉妒而周以亡思齊言太姒嗣徽音則百斯男此詩言不妒忌則子孫衆多皆是一意螽斯羽詵所巾反詵兮宜爾子孫振音真振兮螽斯羽薨薨兮宜爾子孫繩繩兮螽斯羽揖側立反揖兮宜爾子孫蟄直立反蟄兮李曰七月之詩曰五月斯螽動股或言螽斯或言斯螽其義一也螽斯蝗蟲之𩔖陸璣疏云幽州人謂之舂箕即舂黍蝗𩔖也詵詵衆多也薨薨亦衆多也揖揖㑹聚也上文言振振後又言繩繩又言蟄蟄皆是言子孫之衆多也振振毛氏以為信厚繩繩以為戒慎蟄蟄以為和樂歐陽以為不然振振者羣行也繩繩者齊一也蟄蟄者㑹聚也左氏傳均服振振杜元凱注云振振盛也故歐陽以振振為羣行之貎論曰螽斯蝗蟲之𩔖爾以蝗蟲之微物而乃取喻於后妃疑若不倫然詩人之意但取其意不必以蝗蟲而嫌之耳如狼跋之詩曰狼跋其胡載疐其尾公孫碩膚赤舄几几以周公多才多藝而詩人取喻以為狼無乃比周公為禽獸乎不知詩人亦取其合於徳如何耳如闗雎摯鳥而比於后妃亦取其徳之合也草蟲之詩曰喓喓草蟲趯趯阜螽草蟲蝗蟲之𩔖皆比於婦人詩人取喻𩔖多如此孔子曰小言害道小辯害理闗雎興於鳥君子取其雌雄之有别鹿鳴興於獸君子取其得食之相呼若以鳥獸之名而嫌之則不可行也觀此則可知詩也已黄曰詵詵衆多貎振振毛氏以為信厚亦以詩文無之杜元凱注左傳均服振振云盛也薨薨羣飛之貎繩繩不絶之貎毛氏以繩繩為戒謹亦費辭也揖揖蟄蟄其解釋未詳要之亦見其㑹聚之貎與子孫衆多之意耳此皆先儒之遺論而予之所自得於此詩獨在於宜爾二字夫詩人三章而三歎之曰宜爾云者不言其事而寓其意也作序以不妒忌形容之蓋謂后妃之不妒忌則宜其子孫之衆多也詩人無不妒忌之意但言宜爾則其㫖深矣如宜其室家皆當以此𩔖推桃夭於驕反后妃之所致也不妒忌則男女以正昬姻以時國無鰥民也桃之夭夭灼灼其華之子于歸宜其室家桃之夭夭有蕡浮雲反其實之子于歸宜其家室桃之夭夭其葉蓁側巾反蓁之子于歸宜其家人李曰此詩蓋言男女以正昬姻以時皆后妃風化之所致也以后妃之不妒忌而乃能使天下之人男女以正昬姻以時孟子曰昔者太王好色愛厥妃詩云古公亶父來朝走馬率西水滸至于岐下爰及姜女聿來胥宇當是時也内無怨女外無曠夫以太王之於姜女能盡其為夫婦之道故能使内外皆無怨曠之男女今后妃能盡后妃之道無嫉妒之心故衆妾皆得以進御於君而當時周南之國亦皆化之而無怨女曠夫遂至於昬姻以時也王氏謂禮義明則上下不亂故男女以正政事治則財用不乏故昬姻以時龜山以為不然蓋男女以正昬姻以時此乃是不妒忌之所致非緣政事之治也后妃能躬行於上則周南之國皆聞風而化故周官媒氏㑹男女之無夫家者此乃政事然也越王之時女十五而嫁男二十而娶者此亦政事然也惟其出於風化故有不待政令而人樂從之矣孝經注云丈夫六十無妻曰鰥女人五十無夫曰寡則是六十無妻然後謂之鰥民也孔氏曰鰥寡之名以老為稱其有不得及時為室家者亦曰鰥若舜年三十不娶書曰有鰥在下曰虞舜是也夫舜年三十不娶亦稱鰥則是非六十無妻然後謂之鰥男子自二十一至二十九則為盛年女子自十五至於十九亦為盛年過此則為失昬姻之時矣夭夭毛氏曰少壯也說文云以夭字從􅅘從夭則是為少盛貎桃之少壯則其華灼灼然而盛若非少壯則雖有花不復灼灼矣桃之少壯則其結實必大也若非少壯則雖結實不復大矣桃之少壯則其葉蓁蓁然而盛若非少壯則雖有葉不復蓁蓁矣此言婦人得盛時而嫁也歸者言婦人既嫁曰歸之子于歸則室家皆得其宜也家室亦室家也王氏謂宜其室家先女而後男男下女也宜其家室先男而後女女下男也夫婦正也此非也家人言一家之人盡以為宜也孔氏以家猶夫人猶婦此又不然如大學之言曰宜其家人而後可以教國人則家人為一家之人灼灼其華毛氏以喻女之少壯也此其説得之矣至於有蕡其實則曰方嫁之時非但有華色亦有婦徳雖未得詩人之意亦未為害理若夫言其葉蓁蓁則為婦人形體浸大其説非也夫以婦人形體浸大亦何足以形容婦人之美乎鄭氏於葛覃之詩以葛之覃兮喻婦人之形體浸大毛氏於此又以為婦人形體浸大皆非善形容者矣孔氏以三章上二句為男女以正下二句為昬姻以時然觀此詩男女以正昬姻以時皆緫見於三章之中不必分别也蓋所謂昬姻以時非指春秋之時而言之也不過言男女得盛時而昬姻耳而孔氏謂仲春得昬姻嫁娶之正時王氏以謂桃華於仲春以記昬姻之時若如所言則何彼襛矣之詩曰華如桃李豈是直言桃李之盛時乎孔氏王氏之説非矣黄曰人君之治有出於政事之所及者有出於風化之所及者是以月令與周禮所載農功之事是政事所及也七月豳風所言農桑之事是風化之所及也故周官媒氏㑹男女之無夫家者越王時女十五而嫁男二十而娶是特政事爾后妃不妒忌於深宫之中而天下之男女皆自各得其正各及其時豈為政事之所及乎故作序者曰后妃之所致也致當如致師之致為之於此而彼自至也后妃豈能家至户曉而諄諄喻之哉閨門之躬行而天下之自化非有法令以驅之也孟子述古公亶父愛厥妃至於内無怨女外無曠夫是亦此詩之意歟今桃夭三章不特言其昬姻以時而亦言其男女以正自其及時言之曰桃之夭夭灼灼其華又曰有蕡其實又曰其葉蓁蓁皆只形容其及盛年而嫁耳先儒或以灼灼其華喻婦容有蕡其實喻婦徳其葉蓁蓁喻形體浸大非詩人之意也詩人之辭豈若是其膚淺哉曰之子于歸宜其室家又曰宜其家室又曰宜其家人此則形容其男女以正之義也如不待父母之命媒妁之言則父母國人皆賤之非所謂宜也如氓詩言男女無别遂相奔誘華落色衰復相弃背如古人戒奔詩曰聘者為妻奔則妾不堪主事奉蘋蘩此皆非所謂宜也大學云宜其家人而後可以教國人則知宜之一字亦不輕矣先儒説此一篇只見昬姻以時而不及男女以正之意予故表而出之兔罝子邪反后妃之化也闗雎之化行則莫不好徳賢人衆多也肅肅兔罝椓之丁丁陟耕反赳赳武夫公侯干城肅肅兔罝施于中逵赳赳武夫公侯好仇肅肅兔罝施于中林赳赳武夫公侯腹心李曰言后妃既能盡其徳於上故天下之人莫不好徳賢人衆多也當時兔罝之賤亦皆肅肅而欽此所以見賢人衆多也兔罝微者也故詩人舉微以見著則賢人可知而王氏以謂莫不好徳賢人衆多雖不賢不害好徳所謂賢則賢於人者也則是莫不好徳謂人皆好徳也賢人衆多則是有賢者有不賢者非也豈有好徳之人而不為賢邪爾雅曰兔罟謂之罝李廵曰兔自作徑路張罝捕之也丁丁椓伐木聲也伐木之詩曰伐木丁丁亦是伐木聲也施移也中逵九達之道也郭璞云四道交出復有旁通謂之逵中林則又𨼆矣夫兔罝之人微賤如此為作罝躬自椓木其聲丁丁然以為鄙賤之事而甚能恭敬其亦賢矣中逵人所見之地肅肅可也以中林無人之地猶且恭敬則其人可知矣常人之情有人則作無人則輟小人閒居為不善無所不至見君子而後厭然掩其不善而著其善惟賢者則不然不以有人而作不以無人而輟其處幽顯皆如一致惟其賢也故下文曰赳赳武夫公侯干城赳赳武貎言可以為公侯之干城也可以為公侯和好其仇讎也可以為公侯之腹心也如冀缺耕於野夫婦相待如賓胥臣薦之於文公而用之如郭林宗之危坐遇雨而好學卒為名卿以見肅肅可以為名臣也故上文言肅肅兔罝下文言公侯干城下二章皆然以見肅肅可以為干城可以為好仇可以為腹心也歐陽以謂士有既賢且武又有將帥之大徳可任以固守扞城其民其謀慮深長可以折衝禦難於未然若鄰國有來相侵則可使往而和好以平其患及國有出兵攻伐則有可用為䇿謀之臣人之才智如此則可以為周南賢臣而乃使在田野張罝椓伐則是賢者困於微賤周南之君為可刺矣然詩之意則言賢才之多以見兔罝微賤之人猶見恭敬以為公侯之臣如伊尹起於畎畝之中傅説起於版築之間非有他意也歐陽又以為賢才衆多亦不過有三數人而已此又失之泥也夫所謂賢才衆多亦如堯舜之時比屋可封桀紂之時比屋可誅堯舜之時豈無小人乎桀紂之時豈無君子乎如周餘黎民靡有孑遺亦不當以文害辭以辭害意也歐陽又云椓伐事之小者何用致敬此又不然人之存心出於恭敬則事無小大皆當恭敬豈可以小而忽之哉歐陽公之言未之敢信黄曰此一篇諸家之説皆失其義獨歐陽公出而辨之其辨誠當矣然歐陽之説亦於詩人本義未安也諸家以張罟捕兔為微賤者之事今其人亦能肅肅而敬其椓伐之聲亦能丁丁而和是雖兔罝之夫亦有賢人之徳惟其賢也則可以為公侯干城可以為公侯好仇可以為公侯腹心是肅肅兔罝之人可以為赳赳武夫之用也歐陽公辨之以為士之既賢且武又有將帥之徳可任以固守其國扞城其民又能交鄰國而和好其仇怨且可以為腹心之用有賢如此弃之田野張罟椓伐躬鄙賤之事則周南之君可以刺矣此歐氏之説又曰捕兔之人布其網罟肅然嚴整使兔不能越猶周南之君列其武夫為國守禦而使姦民不可犯此又浸失詩人之意也陳少南從歐陽氏説李迃仲從諸家説迃仲又言冀缺之敬可以為名臣莘野之夫可以享天心於是信兔罝之人可以為干城之用然古人如伊尹如冀缺之賢者寧有幾人周之多賢不如是之遺逸也如迃仲與諸家之説則失賢人衆多之意如歐陽氏少南之説則又終篇無賢人之義竊嘗静觀詩人之辭意最為簡直但學者不察耳詩人欲形容賢人衆多故託於肅肅兔罝赳赳武夫之兩事為證非謂若此可以為此也非謂即此可以喻彼也天下惟至賤者教化所難及至暴者氣質所難變兔罝之術不仁武夫以勇力自持此皆風化之所難至者也今兔罝之人感文王后妃之風化而亦有至誠恭敬之心勇暴之夫感文王后妃之風化而亦有愛民忠君之徳設此兩端以見賢人衆多而風化之所及人者深耳兔罝之人固難乎其敬也今不惟施于中逵而然施于中林亦然豈非兔罝之所難乎武夫之勇固難乎其可用也今也不惟能扞城其民而且能交鄰國之歡以為公侯腹心之臣豈非武夫之所難乎此風化之所及而賢人衆多之效也噫騶虞知仁者衆矣公子信厚者衆矣皆兔罝一詩之意也臆説如此未必能得詩人之意姑存之云芣音浮苢音以后妃之美也和平則婦人樂有子矣采采芣苢薄言采之采采芣苢薄言有之采采芣苢薄言掇都奪反之采采芣苢薄言捋力活反之采采芣苢薄言袺音結之采采芣苢薄言襭户結反之李曰諸家之説多以和平為天下和平惟程氏皆以為室家和平其以和平為天下和平者則以天下未治兵革不息為婦人者我躬不閲奚暇樂有子也然觀周南之詩自闗雎以下其言不妒忌皆是緫上文不妒忌之辭惟其后妃不妒忌故衆妾得以有子為樂天下化之亦以有子為樂也故和平當言室家和平也芣苢王肅引周書王㑹云芣苢如李出於西戎王基駁云王㑹所記雜物竒獸皆四夷逺國各齎土地異物以為貢䞇非周南婦所得采也郭氏云今車前草大葉長穗陸璣云一名馬舄一名車前幽州人謂之牛舌草可煑作茹大滑其子治婦人産難故婦人有子則采之也采采者言采之不一也薄毛氏以為助辭王氏以采采非一采猶言薄言采之者采之無斁也然詩言薄言追之薄言震之如薄澣我衣薄汚我私澣者用功淺謂之薄可也煩撋之功多則何以薄言之乎如薄言旋歸歸豈有厚薄邪有者有此芣苢也采之已得於是掇拾之也孔氏以謂二章言采時之狀或掇拾之或捋取之既捋取芣苢而又袺之襭之袺謂手執之而不扱襭則扱之於帶中也孔氏謂有者已藏之稱於首章先言有之者欲急明婦人樂采而有子也孔氏以為已藏非也所謂薄言有之者但得此芣苢之菜耳觀此詩則知詩人可謂善形容者如桃夭之詩先言桃之夭夭灼灼其華然後言之子于歸摽有梅之詩先言有梅其實而後言求我庶士皆先言桃夭與梅實而後繼之以本意此詩但言采采芣苢而樂有子之意自見可以一唱而三歎也黄曰和平説者以為天下和平迃仲以為不如程氏曰家室之和平予以為始於家室之和平而極於天下之和平二説一説也易曰感人心而天下和平后妃不妒忌於閨門之中而風化及於天下之夫婦豈非有以感人心而然乎和平之效則見於風雨時五穀熟人民富此皆其大者也詩人捨此不言而言婦人樂有子何哉蓋人倫廢政教失則人皆有我躬不閲遑恤我後之辭有鮮民之生不如死之久矣之辭嘗涵詠芣苢一詩見其章句簡短不待形容譬喻之辭而但見其樂采芣苢而已大羮𤣥酒淡乎無味而有遺味朱弦疏越寥乎希聲而有遺音竊嘗三復此詩蓋喟然而歎曰治世之音安以樂其政和尤於此詩而見之也言有盡而意無窮真一唱而三歎歟故序詩者不曰美后妃不曰后妃之化而曰后妃之美是亦形容不盡之意漢廣徳廣所及也文王之道被於南國美化行乎江漢之域無思犯禮求而不可得也李曰漢水出興元府西縣嶓冢山東流漢陽軍觸大别山南入於江江水出茂州岷山東流至蘇州許浦入海禹貢言嶓冢導漾東流為漢又東流為滄浪之水過三澨至于大别南入于江東匯澤為彭蠡大别之東彭蠡之西乃江漢合流之處此章言漢之廣矣不可泳思江之永矣不可方思作詩者已是在江漢合流之處也文王之化及人也深而當時之婦人能守以正無思犯禮夫人之淫恣典刑之所不赦彼畏刑罰而不敢為淫恣之行者然未必無其思惟其被文王之化既深則非獨無犯禮又且不萌犯禮之思論語曰克伐怨欲不行焉可以為仁矣子曰可以為難矣仁則吾不知也克伐怨欲雖曰不行但可以為難然胷中未必無克伐怨欲之思惟其無克伐怨欲之思此可以為仁矣周南之婦人能無犯禮之思足以見文王之化及人之深矣孔氏云美化行乎江漢之域無思犯禮求而不可得此由徳廣所及也據此詩言婦人所守者正潔之行是無思犯禮指婦人而言之也非據男子而言之也説者以謂文王之化徒及於周南之婦人所謂男子未必無犯禮之思遂以為文王之化所及者淺是大不然無思犯禮是因一男子見婦人游於漢上欲從而娶之求之而不得非男子盡然也鄭氏謂紂時淫風徧於天下惟江漢之域先受文王之教化所謂南言化自北而南以見文王之化所及者逺非是南國先受文王之化也黄曰按禹貢江漢在荆州之域嶓冢導漾東流為漢又東為滄浪之水過三澨至于大别南入于江李迃仲謂作此詩在江漢合流之處要之皆荆州之域不必如是説也此正文王風化自北而南之時説者謂芣苢以前之詩皆后妃之風至此則言文王之化者江漢周南之逺地也惟其地之逺者故以文王言之伊川謂文王能行周南之道故取文王之詩繫於周南之末予以為后妃之化即文王之化不必為是區别也居周南者因漢水而起興故作漢廣之詩猶鄭以溱洧名篇陳以宛丘名篇也曰徳曰道曰化亦無異義自文王言之則謂之徳謂之道自其所及者言之則謂之化文王以閨門之風而及於江漢之逺非其徳之廣大安能及此哉鄭氏謂男子犯禮而往女子將不至故曰無思犯禮求而不可得也如此則文王之化止能及婦人而已迃仲謂作詩者是因男子見婦人㳺於江漢欲從而娶之求之而不可得非男女盡然此與鄭之説甚不相逺夫詩人之設辭而説者以為實辭宜其失詩人之意也詩人形容江漢之游女無犯禮之思故設辭以為女子之貞潔雖求而不可得耳豈果有是事哉南有喬木不可休息漢有游女不可求思漢之廣矣不可泳思江之永矣不可方思翹翹錯薪言刈其楚之子于歸言秣其馬漢之廣矣不可泳思江之永矣不可方思翹翹錯薪言刈其蔞力俱反之子于歸言秣其駒漢之廣矣不可泳思江之永矣不可方思李曰休息古本或作休思今當且作休息夫木固有可息之道今不可息者以其喬故也女固有可求之道今不可求者以其正故也其言不可求思程氏謂不可以思求此泥於序所謂無思犯禮也夫思者語辭如所謂神之格思不可度思矧可斁思皆是語辭也泳者潛行為泳鄭氏曰水底行也方論語曰乘桴浮于海即此是也孫炎曰方水中為泭筏也桴編竹木大曰栰小曰桴漢水有可潛行之道而不可泳者以其廣故也江有可乘桴之道而不可方者以其永故也此亦是南有喬木不可休息之意夫漢上游女至易動也又况游行之地非在閨門之内傅姆之側也今也能守貞潔之行而不可求則當時之女可知孔氏云内則云女子居内深宫固門閽寺守之則貴族之女也庶人之女則執筐行饁不得在室故有出游之事此漢上之女也其言甚善惟以女子不可求以喻漢廣之不可泳江永之不可方苟惟犯於非禮則如匏有苦葉之詩曰深則厲淺則揭深厲淺揭惟吾所欲曾不顧禮義之如何耳翹翹薪貌錯雜也楚在雜薪之中吾欲取其翹翹者而刈之楚即薪也蔞爾雅云購蔏蔞郭璞云蔏蔞蔞蒿也於雜薪之中而取其翹翹者以比衆女之中欲取其貞潔者也惟其欲取其貞潔者故我欲得之為室家我則秣馬以聘之矣又思之而不可得也故又繼之曰漢之廣矣不可泳思江之永矣不可方思觀此則知周南之婦人其貞潔如此雖當時男子有翹翹錯薪言刈其楚之子于歸言秣其馬之意以其貞潔不可求而止遥想其貞潔之行使人望而畏之而暴慢之心不可復作觀此詩曰漢之廣矣不可泳思江之永矣不可方思所以想見當時之事也昔尹翁歸為東海太守過辭廷尉于定國定國家在東海欲屬託邑子兩人令坐後堂待見定國與翁歸語終日不敢見其邑子既去定國乃謂其邑子曰此賢將汝不任事也又不可干以私嚴君平在蜀李强欲辟為從事終日言而不敢語是二人者瞻其容望其貌使人無有易慢之心亦士夫所難能也今周南之婦人亦能如此則當時士大夫亦皆有尹翁歸嚴君平之風矣三代之風所以直道而行非後世所可得而髣髴也黄曰南方之木髙而不可休非不可休也見喬木者自無休息之心也漢上之游女正而不可求非不可求也見游女者自無犯禮之意按詩中凡曰思者皆是語辭然亦不可執辭而求詩當隨其篇意而求之也序言無思犯禮而詩人反復言之亦必有説水可泳也見漢之廣者自不復有泳之之思水可方也見江之永者自不復有方之之思釋文曰潛行謂之泳泭筏謂之方此如游女可以禮求不可以非禮犯故復喻之曰衆薪錯雜也我欲得其尤翹翹者如江漢游女我欲得其尤美者繼之曰言秣其駒言秣其馬謂是子若歸於我當以正禮親迎之也於是復陳其不可犯之實歐氏謂秣其駒秣其馬如所謂雖為執鞭猶歆慕焉如此則是已有淫慾之念矣夫人惟其顧禮義也則曰漢之廣矣不可泳思江之永矣不可方思至於不顧禮義則深厲淺揭惟其所欲而尚奚所懼哉文王之時以漢上之游女猶不可犯則其風化之美可知故美化行乎江漢之域噫政令不足以敺人而禮義足以感人王烈之里有盜牛者主得之盜請曰刑戮是甘乞不與王彥方知也故節義清修之士且足以為人之感服不仁者不敢入其門不義者不敢至其廬況文王后妃風化之美則江漢之域無思犯禮豈不宜哉汝墳道化行也文王之化行乎汝墳之國婦人能閔其君子猶勉之以正也李曰汝水出汝州天息山東南至蔡州褒信入淮周南之水也孔氏云汝墳之國皆以汝墳之涯表國所在猶江漢之域非國名也其説得之按爾雅云汝為墳墳大防李廵曰墳謂厓岸狀如墳墓名大防也是知所謂汝墳者乃汝水之側有防也爾雅又云江有沱河有灉汝有濆郭璞云詩云遵彼汝墳則以此汝墳為濆汝所分之地有美地因謂之濆孔氏云伐薪宜於涯岸大防之上不宜在於汝濆之間是知墳字當從土不從水也婦人能閔其君子夫閔其君子婦人之常也如伯兮之詩曰伯也執殳為王前驅非不閔其君子也如小戎之詩曰言念君子溫其如玉在其板屋亂我心曲亦非不閔其君子也惟能閔其君子而勉其夫以正然後為婦人之賢婦人者知有家事而已豈知有王事哉今也婦人於王事不可不勉非賢能如是乎於此可見文王之化其盛如此黄曰有天地則有男女有男女則有夫婦此人倫之所由始也然天尊地卑而君臣之分已定則夫婦之愛豈得加於君臣之分乎是理也惟知道者能知之知室家之可懐而不知君臣之分不可易此婦人之常也如伯兮之詩曰伯也執殳為王前驅小戎之詩曰言念君子温其如玉非不閔其君子而不能勉之以正也文王之化造端於夫婦而極於君臣之際有君人之大徳有事君之小心天理之所感發而化及於汝墳之婦女雖當力役慘酷之時而汝墳之婦人能以君臣之分勉其君子曰猶勉之以正猶云者謂疑非婦人之所能而亦能正之也如以王姬而執婦道則曰猶執婦道以亂世而惡無禮則曰猶惡無禮亦是此意遵彼汝墳伐其條枚未見君子惄乃歴反如調張留反飢遵彼汝墳伐其條肄以自反既見君子不我遐棄魴符方反魚赬敕貞反尾王室如燬音毁雖則如燬父母孔邇李曰枝曰條榦曰枚斬而復生曰肄孔氏云惄之為訓本為思耳如惄焉如擣是也爾雅曰惄飢也不如孔氏以為思調飢王氏曰飢而又飢飢之甚也如王肅則以此為大夫妻肅之説徒見序言婦人能勉其君子既謂之君子遂以為大夫妻然觀詩人之所言伐其條枚是以婦人親伐薪安得以為大夫之妻乎故歐陽公以為周南大夫之妻出見循汝水之墳以伐薪者以知己之君子之勞苦則不可為親伐薪也然觀詩之文往往是親伐薪也惟王氏以為庶人之妻其説得之蓋其婦人稱其夫為君子此其常也今曰君子亦猶稱良人也墦間之妾猶稱夫為良人則庶人之妻以夫為君子有何不可伐其條枚以言己之伐薪之勞足以見夫之勞也未見君子則思其夫而其心如飢言其思君子切也既見君子不我遐棄言幸而得君子之歸不死於征役不逺棄我也魴魚養生經曰魚勞則尾赤人勞則髪白魴魚至於尾赤足以見魚之勞也左傳曰如魚竀尾衡流而方羊見哀十七年杜元凱注魚勞則尾赤喻蒯瞶不得其所説文曰魴赤尾魚字林亦曰赤尾魚晉安海物記曰橘鬛魚猶今之魴魚其尾赤其鬛似橘觀此數説其實言尾之本赤也彼徒見有魴魚赬尾之文遂以為魚尾盡赤而不知魚勞然後尾赤也王室如燬以見紂之淫虐其政如火不可嚮邇也雖紂之威虐亦不可以征伐之故遂避紂之征伐以貽父母之憂矣遂告之曰雖則如燬父母孔邇説者多以父母為文王夫以文王之化行乎汝墳去文王為逺安得以為孔邇乎觀此則知文王之化非獨能使士大夫從於征役以勉於王事亦能使婦人勉其夫以正此足以見文王之化盛也如北門之詩曰室人交徧讁我室人交徧摧我北門大夫之妻固異乎汝墳之婦人矣至於北山之大夫役使不均詩人有曰或燕燕居息或息偃在􅇃或不知呌號此北山之大夫固已懐怨望之心又異乎北門之大夫矣北山之大夫不及於北門之大夫北門大夫之妻不及於汝墳之婦人以此見王化之衰日甚一日可勝歎哉黄曰此一篇説者不同鄭氏謂夫人不宜伐薪而今伐薪賢者不宜處勤勞而今處勤勞然臣之事君勞而不怨今曰不宜勤勞是有怨之之意也豈所謂猶勉之以正之義乎歐陽公又謂周南大夫妻出見汝水之岸以伐薪者為勤勞之事則亦念其君子以國事奔走於外其勤勞亦可知此説亦未盡陳少南則謂合木為薪有昬姻之義故伐其條枚云者因見人之伐條枚而思其昔者在家未嫁之時思見君子如調飢之切伐其條肄云者因見人之伐條肄而歎其已嫁之時初謂之夫不可逺棄如是則亦果有怨之之意也李迃仲又辨以為庶人之妻非大夫之妻予妄以為詩人之意果不在此詩人之言甚近而學者求之於逺宜其不足知詩人之情也蓋此篇之意其所以起興者皆在於條枚條肄之句枝曰條榦曰枚旁之斬而明年復生曰肄託此以見其行役之久也方其夫行役之時見其人之伐其條枚則思念之情己不能自已今又見伐其條肄矣歴時若是之久矣庶幾見其不逺棄我也詩人之意大抵如此黍稷方華意不在於黍稷而在於記其去之時有敦𤓰苦意不在於𤓰而在於言其行役之久伐其條枚伐其條肄蓋言其嵗復嵗而君子行役之未歸也意豈在於伐薪之事哉魴魚赬尾王室如燬歎魴魚之猶得其所而王室之酷烈如焚燬之可畏此皆閔其夫之辭復勉之以正而喻之曰臣之於君猶子之於父父雖不父子不可以不子君雖不君臣不可以不臣勞而不怨何況於敢叛乎故曰父母孔邇以父母甚邇之理而喻之此勉之以正之義諸家以父母為文王鄭氏謂恐害及父母歐陽公以父母之邦當自宣力此數説皆非詩人之意嘗論之婦人之情知有家未必知有國知有夫未必知有君今汝墳之婦人既能閔其夫以盡夫婦之情復勉其夫以全君臣之分文王風化之美至此極矣非以道化民者能如是乎故曰道化行也竊嘗觀見民之欲歸文王愈勤而文王之所以事商者愈至此以見出乎誠然而不欲一豪之偽介乎其間至誠之理可以動金石可以化豚魚而何於汝墳之婦人疑之麟之趾闗雎之應也應對之應闗雎之化行則天下無犯非禮雖衰世之公子皆信厚如麟趾之時也麟之趾振音真振公子于嗟麟兮麟之定都佞反振振公姓于嗟麟兮麟之角振振公族于嗟麟兮李曰劉氏以應為效非為瑞應蓋以闗雎之化行至使衰世之公子皆信厚以此見化行之效也衰世者指紂之世也以紂之世風化既衰矣而公子又生於深宫之中長於婦人之手未嘗知憂未嘗知懼宜其不能信厚今也公子皆能信厚而無驕奢淫泆之行以見天下之人無犯非禮也蓋公子貴驕猶且如此則他可知也詩序言公子皆信厚如麟趾之時也所謂如麟趾之時亦如闗雎樂得淑女以配君子指作詩者而言之也孔氏所謂如古致麟之時觀麟趾非謂致之之時但以麟比興公子非是取麟之祥瑞也趾足也振振信厚也定額也公姓毛氏曰公同姓也麟趾之詩説者不同惟黄太史以謂麟有趾而不踶麟哉麟哉有定而不抵麟哉麟哉有角而不觸麟哉麟哉今之人以一朝之忿觸人滅身辱親嗚呼人中有獸獸中有人趾所以踶之也麟之趾則不踶定所以抵之也麟之定則不抵角所以觸之也麟之角則不觸亦猶公子生於深宫之中長於婦人之手宜其貴不期驕而驕自至富不期侈而侈自生今也染文王之化而乃至於信厚以公子之貴而乃與士大夫貧賤者為比豈非化之盛能如是乎故託喻於麟焉下文繼之曰于嗟麟兮以見公子之如麟也詳觀此説則知黄太史深於詩矣黄曰先儒以麟為瑞應謂闗雎之化行則有麟瑞出而為之應其怪誕不經歐陽公已辨之矣然歐陽公又謂同姓之親有信厚之行足以輔衞公室如麟有足有角有定以輔衞其身夫詩但言公子信厚未嘗有輔衞之意則亦未免失之鑿矣少南謂麟出於上古風俗淳厚之世今公子之信厚如上古有麟之時然詩書稱堯舜文武之盛未嘗稱其致麟之事借或有之則序當曰如麟出之時不當曰如麟趾之時也黄太史曰麟有趾趾不踶麟哉麟哉麟有定定不抵麟哉麟哉麟有角角不觸麟哉麟哉此説得之蓋詩人以為貴不與驕期而驕自生富不與侈期而侈自至以公子之貴而有信厚之行此人之所難也故託麟以為喻言之不足而嗟歎之以見其形容不盡之意云爾然則作序者謂如麟趾之時何歟曰作序者以為欲觀闗雎之化觀於公子信厚如麟趾之時斯可矣時止是言公子信厚之時其文自曉而又何疑於此哉噫公子至難化也衰世之公子尤其難化也今文王能使商之公子從周之信厚故太史編詩而序曰闗雎之應也噫天下之理不誠未有能動而誠之至者為之於此而自應於彼雖非形跡所及而蓋有黙然感通者蛟伏於淵卵化於岸氣相感也鶴鳴在陰其子和之聲相應也后妃和順於深宫之中而能化衰世之公子周南之化至此極矣故編詩者以麟趾之詩繫於周南之末而謂之闗雎之應夫作闗雎麟趾者雖非一人而其所以相應者固自有至理存焉學者當以太史編詩之意觀之毛詩集解卷二
