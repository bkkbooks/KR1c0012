body:
  text: 毛詩集解卷二十一宋李樗黄櫄撰蓼音六蕭澤及四海也蓼彼蕭斯零露湑息敘反兮旣見君子我心寫兮燕笑語兮是以有譽處兮蓼彼蕭斯零露瀼瀼旣見君子為龍為光其德不爽壽考不忘蓼彼蕭斯零露泥泥乃禮反旣見君子孔燕豈開在反弟音悌冝兄冝弟令德壽豈蓼彼蕭斯零露濃濃旣見君子鞗徒彫反革沖沖直弓反和鸞雍雍萬福攸同李曰澤及四海言其恩澤及於四海之諸侯也鄭氏泥於爾雅九夷八狄七戎六蠻謂四海遂以此詩為四夷之長葢此詩統言及天下之諸侯不必分别也蓼毛氏曰長大貌如所謂蓼蓼者莪是也蕭爾雅云似白髙莖麤斜生有香氣湑毛氏曰蕭上露貌說文亦以為露貌鄭氏曰蕭香物之微者喻四海之諸侯亦國君之賤者露者天所以潤萬物喻王者恩澤不為逺國則不及也葢鄭氏旣以四海為四夷故其說以蕭喻諸侯之賤者然詩人之意葢言露之被蓼蕭猶澤之及四海若以蕭為諸侯之賤者而湛露之詩又以豐草比同姓之諸侯則其取譬為不倫矣王氏以蕭香能上達譬諸侯以德善自通於天子此皆強求其義旣見君子我心寫兮言諸侯旣見君子則輸其情意也蘇氏曰其旣見君子也莫不思盡其心之所有以告之亦不必如此說燕笑語兮是以有譽處兮言諸侯旣見天子天子則與之燕而笑語則是以有譽而無間言有處而無失位以譽處為諸侯之事非也據此詩章末句皆是稱賛天子之辭如言壽考不忘是天子之壽考也令德壽豈是天子之壽豈也萬福攸同是天子之萬福也不必作諸侯之事也瀼瀼毛氏曰露蕃貌說文曰露濃貌龍寵也左氏昭公十二年宋華定来聘享之為賦蓼蕭弗知又不答賦昭子曰必亡宴語之不懷寵光之不宣令德之不知同福之不受将何以在宴語之不懷則指第一章寵光之不宣則指第二章令德之不知則指第三章同福之不受則指第四章惟以寵光之不宣指二章則以龍為寵是也如長𤼵之詩曰受天之龍亦是以龍為寵也為龍為光言天子宣寵光被及於己也其德不爽言天子所以待之者其德無有差忒也冝其享壽考之報而斯民常不忘之也泥泥露之沾濡貌孔燕豈弟言恩意之厚故諸侯甚安之而又且樂易也兄弟同姓之諸侯也天子旣以恩意接之則可以冝其同姓之諸侯亦如所謂宜其家人也王氏言諸侯得以外交兄弟之國無所不宜非也毛氏言為兄亦冝為弟亦冝亦非也令德壽豈言天子旣已如是冝其有令善之德而壽又且豈樂也濃毛氏曰厚貌說文曰露多也鞗轡也革轡首也爾雅曰轡首謂之革郭璞云轡靶也馬轡所靶之外有餘而垂之者謂之鞗皮為之沖沖垂飾貌和鸞毛氏曰在軾曰和在鑣曰鸞鄭氏注禮記曰在式曰和在衡曰鸞雍雍鳴之和也此有二說鄭氏則曰諸侯燕見天子天子必乗車迎於門王氏則曰乗馬路車天子所以好諸侯也有車馬則有鞗革和鸞矣此二說皆通萬福攸同言天子能如是冝其萬福聚而至也黃曰成王即位之初諸侯四朝成王以禮享之故曰澤及四海所謂外薄四海咸建五長則澤及四海言成王之恩及四海之長伯也諸侯之朝於天子未得見也於此則有願見之心其旣見也則有自慰之心此人之情也故曰我心寫兮李迃仲以為此詩末一句皆為諸侯稱賛天子之辭此大不然夫是以有譽處兮葢以諸侯之朝而天子與之燕飲而笑語此諸侯之榮而終身有美譽以處其身也是亦為龍為光之意也其德不爽壽考不忘此言人君所以待我諸侯者其德之不差爽如此則我諸侯雖終身不敢忘其德也令德壽豈則非惟不敢忘其德而亦當終身佩服其德也君待我以樂易之德我諸侯其敢不以樂易相與乎萬福攸同言諸侯均受天子之福也昭公十二年宋華定来聘享之為賦蓼蕭弗知又不荅賦昭子曰必亡宴語之不懷寵光之不宣令德之不知同福之不受則知此詩皆諸侯被天子之澤而歡恱之辭也湛露天子燕諸侯也湛湛露斯匪陽不晞厭厭夜飲不醉無歸湛湛露斯在彼豐草厭厭夜飲在宗載考湛湛露斯在彼杞棘顯允君子莫不令德其桐其椅於冝反其實離離豈弟君子莫不令儀李曰湛湛露茂盛貌晞乾也露之沾濡萬物非見日則不乾譬如天子之燕飲諸侯厭厭而至於夜非醉則不歸也厭厭安也夜飲而至於厭厭然而安則其威儀可知也豐草喻諸侯也在宗載考考成也言夜飲之禮在宗室則成之他人則不敢也把棘亦是喻諸侯但變其文耳鄭氏以為露之在物湛湛然使物柯葉􅊠垂喻諸侯受燕爵其儀有似醉之貌歐陽已闢之矣而鄭氏於豐草則又以喻於同姓之諸侯於杞棘則喻庶姓之諸侯於卒章則以桐椅喻二王之後詩本不如此皆是臆說顯允君子莫不令德言明允之君子皆有令善之德以見其醉而未嘗過差也其桐其椅言桐椅之為木其實離離然以垂以譬君子之有威儀也豈弟君子莫不令儀皆是飲酒無失不為酒困也荘子曰以禮飲酒者始乎治卒乎亂夫飲酒而至乎亂非飲酒以禮矣觀湛露之詩正所謂以禮飲酒矣天子燕同姓諸侯不可以不厚旣待之厚則易至於失節今也夜飲醉歸而不至於亂可謂有節者矣左傳曰臣卜其晝未卜其夜夜飲則恐至於無節今也威儀如此非有節而何書曰越庶國飲惟祀又曰德将無醉醉者必至於亂今也威儀如此非有節而何葢非夜飲醉歸則無以見其待之之厚非有令德令儀則無以見其飲之有節晉孫季舒嘗與石崇酣飲慢傲過度石崇欲表免之裴楷謂崇曰足下飲人以狂藥而責人以正禮不亦乖乎崇乃止夫飲酒而不責人以禮是晉人放曠之俗然也若先王盛時豈有飲酒而不能由禮者哉令誦湛露之詩遥想當時諸侯威儀之肅無有喧譁失禮者雖不假劉章之軍令自然無失禮者矣嗚呼休哉黃曰湛露之詩必是成王燕諸侯之樂章也武王之興諸侯之會者千八百國其同力王室功不細矣成王即位之初因諸侯之朝而享之厭厭夜飲以盡其情不醉無歸以極其歡然酒所以成禮而醉則易至於廢禮今曰在宗載考成也言其既醉而終以禮成之也其與所謂載號載呶亂我籩豆者異矣德將無醉則易至於無德今曰莫不令德言其旣醉以酒而飽以德也其與醉而不出是謂伐德者異矣未醉則威儀抑抑醉則威儀怭怭今曰莫不令儀言其雖醉而威儀益善也其與威儀幡幡屢無僊僊者異矣上之所以繩下者愈寛而下之所以自繩者愈嚴君有餘恩臣有餘敬此所以為成王之盛時也鄭氏分為同姓異姓與二王之後先儒已辨之矣彤弓天子錫有功諸侯也彤弓弨尺昭反兮受言藏之我有嘉賓中心貺之鐘皷旣設一朝饗之彤弓弨兮受言載之我有嘉賓中心喜之鐘皷旣設一朝右之彤弓弨兮受言櫜古刀反之我有嘉賓中心好之鐘皷旣設一朝醻市由反之李曰左傳甯武子曰諸侯敵王所愾而獻其功王享禮之於是賜彤弓一彤矢百以覺報宴見文四年杜元凱曰諸侯有四夷之功王賜之弓矢又為歌彤弓以明報功宴樂惟彤弓以覺報宴則知彤弓之賜葢所以報諸侯之功也如周平東遷晉文侯有夾輔之勲故文侯之命曰用賚爾秬鬯一卣彤弓一彤矢百盧弓一盧矢百馬四匹至其後襄王之世晉文公獻楚俘于王王享晉文公命之宥賜之彤弓一彤矢百玈弓矢千周室東遷之後賞罰無章然其弓矢之賜惟及此二人則可謂不妄賜矣以周之衰猶如此則先王盛時可知矣彤弓朱弓也弨說文曰弓反末也謂弛之而體反也受言藏之此有兩說鄭氏曰王賜朱弓必策其功以命之受出藏之乃反入也王氏曰弓成而獻王王受而藏之以待賜也此兩說一則以為諸侯藏之一則以為王藏之然此詩乃是天子賜有功諸侯則當以為諸侯藏之也然鄭氏曰受出藏之乃反入也詩中只言受言藏之不必以出入為言也又有一說藏之家以示子孫亦不必如此詩言以此弓賜諸侯諸侯則受而藏之也言者毛氏以為我鄭氏以為策命以為我則下文言我有嘉賓葢指王者也王者旣稱我諸侯又稱我則其文無别以為策命其言雖有所據則又穿鑿矣要之言者語辭也如左氏𫝊言歸于好正此類也天子之賜諸侯必有享禮出於至誠旣設鐘皷之樂於是早朝而享之也大飲賓曰享謂早朝之時而設此禮也載者載以歸也右毛氏以為勸鄭氏以為主人獻之賓賓受爵奠於薦右經言一朝右之鄭氏以為奠於薦右非經之㫖王氏曰其享也尊而右之也當從王氏之說葢其享之也所以尊之故也櫜韜也醻毛氏以為報也鄭氏以為醻酢也當從毛氏之說葢錫之弓矢又享之所以報其功也左氏曰以覺報宴是也黃曰周平王東遷晉文侯有功焉王賜之以彤弓一彤矢百其後襄王以文公有獻楚俘之功而命之宥亦賜之彤弓一彤矢百夫以周室旣衰賞罰無章而彤弓之賜必待有功者況盛時乎成王之諸侯直曰燕之而已至於錫諸侯則必曰錫有功諸侯吾見成王之錫命固不輕而作序者之一言一字亦不輕也然此詩固錫諸侯之詩無疑矣而必曰天子云者古之盛時諸侯無私會燕諸侯必天子也諸侯無專命錫諸侯必天子也序詩者謹而書之為萬世法焉菁菁子丁反者莪樂育材也君子能長育人材則天下喜樂之矣菁菁者莪在彼中阿旣見君子樂且有儀菁菁者莪在彼中沚旣見君子我心則喜菁菁者莪在彼中陵旣見君子錫我百朋汎汎楊舟載沈載浮旣見君子我心則休李曰天佑下民作之君作之師所謂人君非徒有以養之抑亦有以敎之使為人君者苟能盡君師之道以長育人材則天下之人知夫人君所以養育人材如此其至安有不滿其意而喜樂哉使人君不能養育人材則天下皆有弃材雖欲天下喜樂不可得也詩曰旣見君子我心則喜觀此則知天下喜樂在於養育人材可知矣文王之時詩人稱其於樂辟雍是天下之人以辟雍為可樂也僖公之時思樂泮水是天下之人以泮水為可樂也然則人君能養育人材天下其有不喜樂乎莪草名也生於澤田漸洳之處葉似邪蒿而細科生其莖可食菁菁盛也阿大陵也言君子之長育人材若大陵之長育微草能使之菁菁然盛也旣見君子樂且有儀韓文公曰天下美之之辭也言旣見君子則其人樂易而有威儀也歐陽公乃曰樂易所以容衆有儀所以為人法王氏曰君子之長育人材也有道其可以接耳目者禮樂而已禮履此者也履此故動容周旋中禮樂樂此者也樂此故不知手之舞之足之蹈之也舞之蹈之所謂樂也動容周旋中禮所謂有儀也故曰旣見君子樂且有儀此葢曲說不足取也中沚沚之中也中陵陵之中也中沚中陵亦如中阿也錫我百朋古者以貝為貸五貝為朋言受禄之多也韓文公曰百朋多之辭也言君子旣長育人材又當爵命以錫之厚禄以寵貴之云爾王氏則以此章為材之成就其說曰材成然後官其材禄其功乃所以長育之也此説固無害而繼之阿大陵也始曰中阿矣今曰中陵者長育人材之道以樂且有儀為大錫我百朋為小以樂且有儀為先以錫我百朋為後則鑿矣黃魯直大雅記云竊以為不特讀子美之詩如此王氏之於詩以為陵有小大前後之序則古人之詩無乃委地乎此不可不戒也汎汎楊舟載沈載浮韓文公曰君子之於人材無所不取若舟之於物浮沈皆載之云爾葢君子之於人材其材不可以不取小材則小用之大材則大用之或長於此而短於彼或優於彼而劣於此君子莫不因其材而用之旣言君子如此則我心休而美之也賈山曰地之美者善養禾君之仁者善養士地之美者雖有惡種不能生也地之惡者雖有美種亦不能生也至於江臯湖濱之地雖有惡種無不猥大君子有長育人材之道則貪者可使變而為亷詐者可使變而為直中也養不中材也養不材則天下無有不中不材者矣周之世雖曰得人之盛原其效皆由長養之所致也孟子曰待文王而後興者凡民也若夫豪傑之士雖不待於敎育而亦能成也以此觀之周之時所以藹藹王多吉士藹藹王多吉人要其成莫不皆豪傑之士原其本也必有所自也揚子雲曰周之士也貴秦之士也賤周之士也肆秦之士也拘夫天之生材豈為周而増之豈為秦而損之惟上之人敎育之如何耳黄曰菁莪詩葢天子行禮於學校而宴飲之時則學者歌此詩焉成王樂與賢以持前日之功又樂得賢以為今日之用又樂育材以為後日之用成王好賢之心無有窮已故其尊賢待士之誠亦無有窮己惟成王樂長育人材故天下亦樂與成王此如蕭韶奏而鳳皇儀干羽舞而有苗格心之所感不能自已者文王之辟雍人樂之僖公之泮水人亦樂之故菁莪詩皆喜樂之辭成王之於人材其未成者養之其旣成者禄之小以成小大以成大而人材無有所遺有君如此則人情之喜樂如何邪韓文公舉是詩最為詳備學者當自考之六月宣王北伐也鹿鳴廢則和樂缺矣四牡廢則君臣缺矣皇皇者華廢則忠信缺矣常棣廢則兄弔缺矣伐木廢則朋友缺矣天保廢則福禄缺矣采薇廢則征伐缺矣出車廢則功力缺矣杕杜廢則師衆缺矣魚麗廢則法度缺矣南陔廢則孝友缺矣白華廢則亷恥缺矣華黍廢則蓄積缺矣由庚廢則隂陽失其道理矣南有嘉魚廢則賢者不安下不得其所矣崇丘廢則萬物不遂矣南山有臺廢則為國之基墜矣由儀廢則萬物失其道理矣蓼蕭廢則恩澤乖矣湛露廢則萬國離矣彤弓廢則諸夏衰矣菁菁者莪廢則無禮儀矣小邪盡廢則四夷交侵中國微矣六月棲棲戎車旣飭四牡騤騤載是常服玁狁孔熾我是用急王于出征以匡王國比物四驪閑之維則維此六月旣成我服我服旣成于三十里王于出征以佐天子四牡脩廣其大有顒玉容反薄伐玁狁以奏膚公有嚴有翼共武之服共武之服以定王國玁狁匪茹整居焦穫侵鎬胡老反及方至于涇陽織文鳥章白旆央央元戎十乗以先啓行戎車旣安如輊竹二反如軒四牡旣佶其一反旣佶且閑薄伐玁狁至于大原文武吉甫萬邦為憲吉甫燕喜旣多受祉来歸自鎬我行永乆飲於鴆反御諸友炰白交反鼈卑列反膾鯉侯誰在矣張仲孝友李曰六月之序緫言廢興之由文武成康自鹿鳴之興至於菁菁者莪之詩此周之所以興也至於厲王之世斯道埽地小雅盡廢此周之所以衰也所貴乎中興之主者以其能興衰補弊以振祖宗之業也鹿鳴之詩雖廢苟能敦和樂之誠則鹿鳴其有不興乎皇皇者華之詩雖廢苟能行忠信之風則皇皇者華其有不興乎常棣之詩雖廢苟能充兄弟之愛則常棣其有不興乎自伐木以至於菁菁者莪莫不皆然也中庸曰文武之政布在方策其人存則其政舉其人亡則其政熄以厲王之世非其人則文武之政安得而不息宣王以中興之主承厲王之業而有撥亂之志其人存矣文武之政安得而不興乎故六月之詩因四夷交侵之故而備言也唐孔氏曰由庚以下不言缺者敘者因文起義明與上詩别言見缺者為剛君父之義不言缺者為柔臣子之義以文武之道同故俱言缺周公成王則臣子也故變文焉此皆求馬於牝牡驪黃之間不足以論詩也由庚之詩本在於南山有臺之下今乃列於南有嘉魚南山有臺之間而不依於序者何也唐孔氏曰據六月之序由庚本第在華黍之下其義不備論如此而於崇丘同處者以其是成王之時故下從其類夫詩之見存者其先後不可必其次第如常棣乃周公之詩而列於伐木之前已不可得而知況其亡者又安可得而知之乎姑闕之可也王氏又從而為之說曰序詩者進由庚於南有嘉魚之前而退南山有臺於崇丘之後何也葢其說以為隂陽失其道理則是人君不能用道人君不能用道則賢者亦必不安下亦必不得其所矣萬物不遂則是人君不能成物人君不能成物則必無賢者以立邦家之基矣此葢附會其說以合此序不足取也設若倒其辭曰賢者不安則隂陽失其道理為國之基墜則萬物不遂亦何有不可以此知其說葢出於附㑹不足取也六月之詩毛氏則為宣王自征王氏則以為宣王親伐玁狁出鎬京而還使吉甫追伐迫逐乃至于大原鄭氏則以為獨遣吉甫王不自行此說當從毛氏之說以為自征者葢以下文載是常服為王載太常然常服只是有常之服不必作王之太常也棲棲毛氏曰簡閱貌王氏曰棲棲然而不静蘇氏曰棲棲不安也蘇氏之言為有據此正與論語丘何為是栖栖者同孔氏棲棲猶皇皇也則知棲棲葢言其不安也六月盛暑豈是出征之時今也乃至於興師者以玁狁之難不安故飭其戎車也四牡騤騤然言四牡之盛壮也常服鄭氏曰韋弁服周官曰凡兵事韋弁服葢軍事之常服也熾盛也玁狁之盛我是用急以討之于鄭氏以為于曰也毛氏以經凡言于皆以為徃當從鄭氏之說按左氏欒武子曰楚自克庸以來其君無日不討國人而訓之于民生之不易禍至之無日戒懼之不可以怠其君無日不討軍實而申儆之于勝之不可保紂之百克而卒無後杜元凱以于為曰正與此同此章葢言宣王命吉甫於六月之時出伐玁狁故我是以出師其所出師者豈得已哉以王命之葢将以正王國故爾比物四驪周禮曰凡大事祭祀朝覲㑹同毛馬而頒之注云毛馬齊其色物馬齊其力今乃比物者同力之馬也比此同力之馬不厭其同色也比物四驪言四驪之馬比同其力也閑之維則言其閑習之有法度也馬旣閑矣而我服又成可以出征矣故曰于三十里也古者師行三十里故爾王于出征以佐天子言天子命之出伐葢欲其佐助天子事也四牡修廣修長也廣大也顒毛氏曰大貌說文亦曰大貌則顒為大貌可知惟其四牡如此故可以伐玁狁而奏膚公也膚大也公功也有嚴有翼共武之服此又言将帥之德如此兵事以嚴終固在於嚴也翼敬也旣嚴而又翼敬其慎重如此夫兵凶器也戰危事也子之所慎齊戰疾臨戎之事尤貴於慎重李廣之簡易不如程不識之嚴故以嚴為貴有嚴有翼共武之服言有嚴有翼可以成武事矣武事成則王國安得不定乎茹度也言玁狁不自量度而整居焦穫焦穫地名今在永興軍爾雅曰周有焦穫郭璞曰今扶風池陽縣瓠中也鎬方皆是北方之地名鎬非鎬京也涇陽乃涇水之北織文鳥章鄭氏織徽織也鳥章畫鳥隼之文章於其上白旆繼旐者也央央鮮明貌元大也大車十乗先啓其行以衝突乎其前也此章葢言玁狁不自量度輒敢猖獗焦穫之地安然而居之以侵伐於中國也其猖獗如此則不可以不征之織文鳥章白旆央央言其旗章之盛元戎十乗以先啓行言其車馬之壯惟其車旗旣盛而壯故可以征之也戎車旣安如輊如軒此章又言車馬之盛也戎車旣安矣從後視之則如輊從前視之則如軒言其調也佶壯也言四牡天而又閑習也惟其如此故可以伐玁狁至于大原驅逐之出境而已聖人之於夷狄一視而同仁豈有内外之别哉惟先王之法内中國而外夷狄然夷狄之民皆吾赤子也豈可若秦皇漢武窮兵黷武深入不毛之地開疆拓境以快一時之忿哉此非先王之仁心也先王之於夷狄豈有意而征之其所不得已而征之者葢以吾民迫於禍患不得不征之也惟其如此故於是稱美其将帥之徳文武吉甫萬邦為憲此葢稱美之辭也吉甫之為将文武兼備則可以為萬邦之法必不至於窮兵黷武也吉甫燕喜此又言吉甫之歸宣王與之燕而喜又多受其賞賜也其所以與之燕者以吉甫之為将自鎬而歸其行役之時日月甚乆也然其燕也非特吉甫與焉又有及於諸友也炰鼈膾鯉言其珍饌之多也侯誰在矣言誰與於飲燕之列乃張仲之孝友如此則吉甫之所以與友者無非賢者也觀吉甫之文武張仲之孝友則周家得人之盛可知矣善於父母曰孝善於兄弟曰友司馬法曰冬夏不興師禮記月令曰季夏不可以起兵動衆今宣王乃以六月之時而出師者夫盛暑流金爍石之時無乃毒民乎葢六月而出師非宣王之本心以玁狁之侵伐不得不然如此吾民困於夷狄之患不能自存而為人上者安坐而不救以為冬夏不出師則逺境之民實受其害矣豈人君愛民之心哉故必從權而興師也至於後漢竇憲以六月之詩而伐北狄唐太宗以四月出師至九月而還此豈夷狄之罪葢出於一時之忿驅民於行陣之間委之於鋒鏑之下其不仁如何哉以是知六月而出師有宣王之心則可無宣王之心則虐矣黄曰嘗觀文武所經營之治與成王周公所以守文武之業者具載於小雅此如中庸之九經自修身親親尊賢至於柔逺人懷諸侯終始不可缺一一詩廢則一事廢事事廢則周道衰而為厲王之時此夷狄之所以侵而中國之所以微也夫文武之政布在方策其人存則其政舉其人亡則其政息厲王之時小雅之詩非不存也惟舉是政者無其人耳宣王起而復振之明文武之功業而周道粲然復興六月之詩因宣王北伐之事而備言四夷交侵以明其得失之跡也司馬法冬夏不興師月令曰季夏不可以興師動衆今宣王以六月而北伐以爍石流金之時而驅民於凶器危事之地宜斯民之怨嗟而不樂為之用也今觀此詩而當時之民皆以為當然者予甞論之東山之役以三年之乆而人不怨北伐之詩以六月之時而人樂為用葢致東山之役者非周公之本心也迫於三監之亂而不得己耳速北伐之師者非宣王之本心也迫於玁狁之侵而不得己耳民人知其上之出於不得己雖三年而人不以為乆六月而人不以為暴葢人以為其所以勞我者乃所以安我也噫宣王以厲王大亂之餘而支玁狁之患意其必倉卒不暇為計而今也四驪之馬則閑之維則四牡之馬則旣佶且閑共武服者有其敬先啓行者有其車葢其車馬之修器械之備非一日矣然宣王亦豈恃其車馬器械之盛而示威於夷狄哉于出征于三十里未嘗有速進之心也薄伐玁狁至于大原未嘗為深入之計也非宣王之君吉甫之将能若是乎詩人於末章言吉甫之賢而及於張仲之孝友以見吉甫之所與為友者如此則吉甫之為人可知此形容之至也采芑音起宣王南征也薄言采芑于彼新田于此菑側其反畝方叔涖音利止其車三千師干之試方叔率止乗其四騏四騏翼翼路車有奭許力反簟茀音弗魚服鉤膺鞗音條革薄言采芑于彼新田于此中鄉方叔涖止其車三千旂旐央央方叔率止約軝祈支反錯衡八鸞瑲瑲服其命服朱芾斯皇有瑲葱珩音行鴥惟必反彼飛隼其飛戾天亦集爰止方叔涖止其車三千師干之試方叔率止鉦音征人伐鼓陳師鞠旅顯允方叔伐皷淵淵振旅闐闐徒顛反蠢爾蠻荆大邦為讎方叔元老克壯其猶方叔率止執訊獲醜戎車嘽嘽吐丹反嘽嘽焞焞如霆如雷顯允方叔征伐玁狁蠻荆来威李曰宣王之時北有玁狁之患故北伐矣南有蠻荆之患故南征矣於北言伐於南言征者唐孔氏曰便辭耳此說是也按孟子曰征者上伐下也敵國不相征也以征為上伐下則征伐之義有不必辨焉芑之名有二榖也菜也豐水有芑孔氏則以為菜惟穈惟芑孔以為榖王氏於薄言采芑亦謂之榖按陸璣疏曰芑菜似苦菜也莖青白色摘其葉白汁出脃可生食亦可以蒸為茹則是菜名也爾雅曰芑白苗郭璞曰今白粱粟好榖也則是榖名也王氏皆以為榖不知何也徐安道亦從其說而曰毛氏以薄言采芑為菜豐水有芑為草惟穈惟芑為榖要之三物皆榖爾葢以惟穈惟芑故可為榖也薄言采芑豐水有芑不知果為榖果為菜乎詳觀此詩曰薄言采芑于彼新田則田中所生宜生榖也然未有采之者旣謂之采則不冝謂之榖不如闕之以俟博物君子新田菑畝爾雅曰一嵗曰菑二嵗曰新田三嵗曰畬孫炎註曰菑始災殺其草木也新田新成柔田也畬和也田舒緩也而鄭氏坊記注則又曰二嵗曰畬三嵗曰新田且當以爾雅為證孔氏曰鄭氏謂熾菑南畝為耕田是柔田之耕亦為菑也于此菑畝又在于彼新田之下未必一嵗之田也竊謂不然葢鄭氏好改字以俶載為熾菑故其說如此不可以取信也且如後世江南人多畬音奢田用此畬田之字其音不同劉禹錫詩曰何處好菑田團團漫山腹白樂天詩曰畬田有粟何不啄江南人其法縱火拚蘆灰經雨下種歴三嵗泉脈竭不可復種藝徃徃與周之時畬畝又别也觀此二句其說頗為難曉毛鄭皆謂宣王能新美天下之士然後用之王氏亦以養成人才為說歐陽以毛鄭之意為迂踈而自謂宣王命方叔為將以伐蠻荆取之之易如采芑爾􅉮苦菜也人所常食易得之物于新田亦得之于菑畝亦得之如宣王征伐四夷所徃必獲也此說雖近於南征之意然其意與下文不相應惟蘇氏曰將采芑者於何取之其必在於新田菑畝而後得之方其治田也則勞及其采芑也則逸故宣王之南征亦使方叔治其軍而後用之此說為近葢宣王之命方叔為將而有師旅車馬故以此取喻言新田菑畝之中有此菜亦如宣王之時有此車馬之盛也涖臨也方叔臨而視之則具有三千之乗天子六軍六軍只有千乗今乃有三千鄭氏曰宣王乗亂羨卒盡起此說不然故王氏曰其車三千葢會諸侯之師非特鄉遂之兵而已先儒以為羨卒盡起非也葢宣王承厲王之後能會合諸侯之師而其車有三千乗使其微弱如厲王之世安得復會諸侯之師如是盛乎桓王之時伐鄭王為中軍虢公林父將右軍蔡人衛人屬焉周公黒肩將左軍陳人屬焉其合諸侯之師但能備三軍之數況欲得三千之車乎故毛氏曰言周室之强車服之美也言其强美斯劣矣孔氏則因其說而曰必言其强美者斯劣弱矣老子曰國家昬亂有忠臣六親不和有孝慈明名生於不足詩人所以盛矜宣王强美者斯為宣王承亂劣弱美而言之也此說為善葢以厲王之時不能合諸侯之師故顯言宣王師徒之盛所以明前世之不然也師衆也干毛氏以為扞試用也言其士卒皆有佐帥扞敵之用不如程氏以為師干猶今云甲兵試肄習也方叔率止言方叔率此戎車士卒而行也其率而行則乗此四騏之馬四騏之馬又皆翼翼然而壯此葢言其馬盛也路車有奭此又言其車之盛也言其所乗之路車而有奭奭赤貌又有方文之簟以為車之蔽飾茀蔽也車之所載又有魚皮以為矢服矢服即采薇所謂象弭魚服是也鉤纓盤纓也在膺則有鞶纓之飾又有鞗皮以為轡首之革而垂之言鉤膺則知所謂路車葢金路也故唐孔氏曰巾車金路同姓以封也今方叔乗之者或方叔為同姓也中鄉鄭氏曰美地名交龍為旂龜蛇為旐旂旐央央此言旂物之盛也軝長轂之軝也考工記曰兵車乗車其轂長於田車也是為長轂約者以皮纏之而上加以朱漆也輪人曰容轂必直陳篆必正篆轂約也衡馬飾也錯衡者雜其文采於車之上也約軝錯衡而其車之行則又有八鸞之瑲瑲然而鳴孔氏曰錯衡不知何所用也然按荀子曰前有錯衡以養目和鸞之聲以養耳則知錯衡八鸞者皆以為耳目之歡也服其命服服其所受於王命之服也皇猶煌煌也如所謂皇皇者華葢言其鮮明也斯干之詩曰朱芾斯皇而繼之曰室家君王天子朱芾此言朱芾者葢諸侯之服也故毛氏曰天子純朱諸侯黃朱有瑲葱珩言其所佩又有瑲瑲之聲乃蒼玉之珩也鴥彼飛隼急疾之鳥也陸氏曰隼鷂屬一名雀鷹葢迅疾之鳥戾至也鴥彼飛隼鄭氏以為飛乃至天喻士卒勁勇能深攻入敵也亦集於其所止喻士卒須命乃行也王氏以為鴥彼飛隼其飛戾天者言士卒之猛疾奮厲如此亦集爰止者言士卒之服聽號令如此程氏則以為言将之才士之衆且勇進退得冝趨舍有節隼之疾急亦集於所止以興兵雖强盛用之有節而不過也蘇氏則以為隼之飛而至天甚迅疾矣然必集於所當止而後可用言士雖勇而不敎則不知戰之節亦不可用也此說未敢以為然葢詩人但言士卒之猛如隼之飛而戾天今皆集於此士卒皆有奮厲之力今亦皆集於此而将用之也鉦說文曰鐃也鉦人伐皷者鄭曰鉦也皷也各有人焉言鉦人伐皷互言之爾此說是也陳師者陳列其衆也鞠誓也言誓衆也王氏曰陳欲廣故言師誓欲徧故言旅其意以師旅分衆寡且如陳師鞠旅可以分衆寡則班師振旅亦可以分衆寡乎此但便於辭耳顯允方叔旣明且信之方叔而其伐皷則淵淵闐闐然淵淵伐皷聲也闐闐說文作從門從真葢言其将戰則伐皷以作士氣及其振旅也則闐闐然而氣盛猶有餘勇也蠢動也言蠻荆蠢動而無知以小邦與大邦為讎元大也毛氏曰五官之長出於諸侯日天子之老亦不必如此說但是方叔為一時之大老如趙充國曰無如老臣是也夫将兵而年少摧鋒可也安知大事乎如所謂口尚乳臭則安能禦敵哉故必元老而後可以壯其謀猷也惟能壯其謀猷故其南征也必執其可問者獲其有罪者而其所乗之戎車嘽嘽焞焞然而衆盛其聲之𤼵如霆如雷此皆言有可畏之威如此顯允方叔顯明允信也此末三句言方叔之為人其威聲振動於蠻貊向者嘗伐玁狁而玁狁旣服矣今伐蠻荆而蠻荆安得不畏乎以此見方叔之元老威名素著於夷狄故夷狄之人皆聞風而服也如郭子儀之於囘紇薛仁貴之於突厥聞二公之名固己先破其膽矣安得不服哉黃曰予嘗讀采芑詩知天下不患無兵而患無将宣王當厲王之後兵威之不素振士卒之不素練車馬之不素習若無可以支敵者今也宣王一興而謀臣勇士毛奮鱗集㑹諸侯之師而其車三千有不可勝用者若此如采芑者或取於新田或取於菑畝或取於中鄉雖其所不足之地而皆可獲焉新田者方成新柔之田也菑畝者始殺其草木之地也中鄉者至狹之地也而皆可以采芑特患耕之者無其人耳宣王雖繼亂亡之後而士卒之衆車馬之備者如此以方叔為之将也故此詩言方叔涖止又言方叔率止言顯允方叔又言方叔元老宣王得一吉甫而玁狁自服得一召虎而淮夷自平得一方叔而蠻荆自畏予請以是為擇将之說車攻宣王復古也宣王能内修政事外攘夷狄復文武之竟上修車馬備器械户戒反復㑹諸侯於東都因田獵而選車徒焉我車旣攻我馬旣同四牡龐龐鹿同反駕言徂東田車旣好四牡孔阜東有甫草駕言行狩之子於苗選徒嚻嚻五刀反建旐設旄搏獸于敖駕彼四牡四牡奕奕赤芾金舄音昔會同有繹音亦決拾旣佽音次弓矢旣調射夫旣同助我舉柴子智反四黃旣駕兩驂不猗於寄反不失其馳舍矢如破蕭蕭馬鳴悠悠旆旌徒御不驚大庖不盈之子于征有聞無聲允矣君子展也大成李曰復古者復其祖宗之舊也即下文所謂復文武之竟土復會諸侯於東都是也宣王内修於政事然後外攘於夷狄也柔逺能邇惇徳允元而難任人蠻夷率服此舜所以服四夷之策也儆戒無虞罔失法度罔遊于逸罔淫于樂至於無怠無荒四夷來王此益之所以服四夷之䇿也向使不能内修其政事而欲外攘於夷狄未有不為禍者也如秦皇漢武非不服夷狄也然弊内以事外四夷雖困而吾民已不聊生矣此攘夷狄之策必先於内修政事也此序言内修政事外攘夷狄是按上篇而言亦猶魚麗之序先承上篇而言文武天保以上治内采薇以下治外然後方說本詩之義此序言宣王能内修政事外攘夷狄葢按上篇南征北伐然後方說本詩之義也旣能攘夷狄則境土自復也方其四夷交侵而中國微此境土所以日促也夷狄旣已逺遁不近於中國此境土所以復也武王旣得天下其境土之廣可知矣而乃兼言文王者葢文王三分天下有其二周之境土浸以充斥自文王始也旣能復文武之境土猶能不忘武備以修車馬以備器械為念葢除戎器以戒不虞古之道也不然則如蕭俛消兵其禍豈小哉當時境土纔復而河北未㡬復為賊陷以無武備故也復㑹諸侯於東都當文武成康之盛葢常㑹諸侯於此其後微弱不能率諸侯以會東都之地至宣王中興遂能舉此廢典也東都王城也旣會諸侯遂因而田獵以選車徒焉左氏曰夏啓有鈞臺之享商湯有景亳之命周武有孟津之誓成有􅄮陽之蒐康有酆宫之朝穆有塗山之會此皆合諸侯之事也則知成王之蒐與諸侯共之亦猶宣王之會諸侯而與之田獵也我車旣攻我馬旣同攻堅也同齊也宗廟齊毫尚純也戎事齊力尚强也田獵齊足尚疾也此言同葢謂齊力也龐龐毛氏曰充實也車旣攻矣馬旣齊足矣四牡又充實矣此所以駕而徃東都也王氏曰我車旣攻我馬旣同四牡龐龐三者非修政事不能致也致此三者然後能攘夷狄復文武之境土㑹諸侯於東都按詩序所謂外攘夷狄葢指上文而言其曰復文武之境土而後繼之以修車馬備器械葢謂不忘武備也非謂修車馬備器械以攘夷狄也孔阜程氏曰肥壮也甫草毛鄭之說不同毛氏曰甫大也田者大芟草以為防鄭氏曰甫草甫田之草也鄭有甫田按左氏曰鄭之有原圃猶秦之有具囿則圃者鄭圃之名故爾雅曰鄭有圃田今鄭氏以圃為甫田固非其字又以甫草為甫田之草其說為迂當從毛氏說榖梁亦曰因蒐狩以習武事禮之大者也芟草以為防或舍其中褐纏旃以為門裘纏質以為槸此皆言田之制如此故此言東都之地有廣大之草就而田獵故於是駕而徃狩也之子于苗四時之獵春曰蒐夏曰苗秋曰獮冬曰狩今此詩旣言行狩此又言于苗者孔氏曰此時宣王為夏田也上云駕言行狩狩是獵之緫名但冬獵大於三時故狩為冬獵名爾非宣王𤼵意向東都歴冬夏也此說是也之子程氏曰猶云吾二三子指所任事者也選謂簡車徒也言其軍常静惟選車徒之時則其聲嚻然以見其非選車徒之時則常肅静也敖地名左傳所謂師覆于敖前是也旣選徒矣於是建旐於車又設旄於旐之首遂徃搏獸於敖之下也駕彼四牡此章則言諸侯之來會也駕而来其四牡之馬又奕奕然而閑習赤芾金舄之服而與於朝會之列皆以爵之尊卑而陳列於其位次故以有繹言之繹陳也金舄黃赤色也決拾旣佽此又言其射事之備也呉語曰一人善射百夫決拾決鉤弦也拾遂也決著於右手大指所以鉤弦開體逐著於左臂所以遂弦佽說文曰便利也言當與手指相次比而後射得便利也弓矢旣調鄭氏曰調謂弓强弱與矢輕重相得也射夫旣同蘇氏曰言無不善射故謂之同柴說文曰積也言獲禽之多而積於此也程氏曰衆射夫助舉見其多也四黃旣駕兩驂不猗此言御者之艮駕四黃而兩驂不相依倚也不失其馳舍矢如破言御者之良不失其驅馳之法故射者𤼵矢必中如椎破物也榖梁曰御者不失其馳然後射者能中正謂此也蘇氏曰不善射者為之詭過則獲不然則不能使御者不失其馳而其射者乃能舍矢如破然後為善射也此說為盡然其說亦本於孟子也蕭蕭馬鳴悠悠旆旌此言但聞馬鳴之蕭蕭旆旌之悠悠矣葢軍之肅静而不喧譁也夫軍士惡嚻楚師在陳而嚻合而加嚻識者知其必敗今其静如此則其軍之整肅可知歐陽公詩有曰萬馬不嘶聽號令諸藩無事樂耕耘蘇東坡詩曰令嚴鐘皷三更月野宿貔貅萬竈煙皆是倣此二句而作也驚猶儆戒也徒御不驚言其徒御不儆戒乎大庖不盈言其大庖不充盈乎大庖即禮記所謂充君之庖也有聞無聲毛氏曰有善聞而無喧譁之聲王氏之意亦與此同不如程氏謂師之行不聞其聲當從此說言其軍之静也允矣君子允與顯允方叔之允同言君子之明信故能如此展也大成展誠也言誠哉功業之大成也車攻之詩八章其形容宣王之美可謂備矣旣見其車馬之修又見其器械之備與夫諸侯之服射御之艮此詩人之善形容也如司馬相如上林之賦葢傚此詩而作然其言倍於車攻之詩其長數十倍其所述人君之德比車攻為何如哉揚子雲曰詩人之賦麗以則辭人之賦麗以淫以車攻詩與上林賦觀之則詩人辭人之别煥然矣黃曰予嘗因車攻之詩而為之説曰武帝窮兵於四夷旣服之時蕭俛段文昌銷兵於兩河甫定之初其失均也武帝弊内以事外不治中國而治夷狄夷狄雖困而吾民亦與之俱弊此不知内修政事外攘夷狄之說也蕭俛之徒知幸安而不知逺慮故境土之復未幾而河北已為賊有此不知修車馬備器械因田獵而選車徒之說也宣王之於夷狄彼未服而不忘其在我之自治彼旣服而亦不忘其所以在我之自備修政事以攘夷狄除兵器以戒不虞何宣王之能自治也方是時文武之功業已明於天下文武之境土已入於版圖若可以自逸矣田獵一事宣王必因之選車徒焉則宣王之田獵豈若好田獵畢弋而不修民事者哉嗚呼厲王之時諸侯不朝宣王復興諸侯畢會其中興之功何盛歟韓文公作石鼓之歌曰周綱陵夷四海沸宣王憤起揮天戈大開明堂受朝會諸侯劍佩鳴相磨蒐于􅄮陽騁雄俊萬里禽獸皆遮羅鐫功勒成告萬世鑿石作皷墮嵯峨韓公之歌予請以此證之然以石皷之作為宣王之時則未必可信也毛詩集解卷二十一
