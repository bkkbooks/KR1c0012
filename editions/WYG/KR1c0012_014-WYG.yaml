body:
  text: 毛詩集解卷十四宋李樗黄櫄撰秦車鄰詁訓傳第十一國風車鄰美秦仲也秦仲始大有車馬禮樂侍御之好焉有車鄰鄰有馬白顛都田反未見君子寺人之令力呈反阪音反有漆隰有栗既見君子並坐鼔瑟今者不樂音洛逝者其耊田節反阪有桑隰有楊既見君子並坐鼓簧音黄今者不樂逝者其亡李曰秦之先伯翳之後其裔非子周孝王時召使養馬於汧渭之間始封為附庸邑於秦谷秦仲非子之曽孫自非子以来其國尚小至秦仲國始大焉王子雍曰秦為附庸世處西戎秦仲修徳為宣王大夫遂誅西戎是以始大惟其始大故有車馬禮樂侍御之好也車馬即詩所言有車鄰鄰有馬白顛禮樂即詩所謂並坐鼔簧侍御即詩所謂寺人之令孔氏謂經先寺人而後鼔瑟序先禮樂而後侍御遂信此而為之説其説鑿矣鄰鄰衆車之聲也有馬白顛爾雅曰馰顙白顛舍人曰馰白也顙額也額有白毛今之戴星馬也此言車馬之好如此寺人之令又言其侍御也寺人内小臣閹官或言巷伯君子指秦仲也未見君子言士之未見秦仲若將見之必先得寺人之官告於秦仲然後得見其侍御之好如此阪有漆隰有栗鄭曰喻秦仲之君臣所有各得其宜不如蘇氏之説蘇氏謂人君之有禮樂猶阪之有漆隰之有栗也盖下文言既見君子並坐鼓瑟是言禮樂之盛如此既見君子並坐鼓瑟今者不樂逝者其耊言士之得見秦仲秦仲乃與賢者並樂與之宴飲並坐而鼓瑟且謂之曰今者不與子樂逝者至於老死不復有樂矣言不可不樂也鄭曰逝者謂去仕他國然逝者與蟋蟀所謂歳聿其逝論語曰日月逝矣之逝同是皆言其歳月之往不必為仕他國簧笙竽也黄曰秦以西戎之國而能有禮樂侍御之好此不足美也而詩人美之以昔為附庸今為大夫將為諸侯而秦國始大其周將亡之㡬乎駟鐵美襄公也始命有田狩之事園囿之樂焉駟鐵孔阜六轡在手公之媚眉冀反子從公于狩奉時辰牡辰牡孔碩公曰左之舍音捨拔蒲末反則獲遊于北園四馬既閑輶車鸞鑣彼驕反載獫歇驕李曰襄公秦仲之孫自非子已来世為附庸未得王命及周幽王為西犬戎所敗平王東遷洛邑襄公將兵救周有功平王賜之地始命為諸侯惟其為諸侯故有田獵之事園囿之樂言其田狩於園囿之中而有此樂也孔氏曰有藩曰園有牆曰囿則得之矣然上二章為獵於囿之中下章為調習於園中此則泥矣說文曰馬深黑色為驪月令孟冬之月駕鐵驪注曰言其馬之色如鐵也阜者肥大也六轡在手孔氏曰每馬有二轡四馬當八轡矣諸文皆言六轡者以驂馬内轡納之於觼故在手惟六轡耳四牡孔阜六轡在手盖言襄公乘此駟鐵之馬馬既肥大又良善六轡在手而已更不須提控之也公之媚子從公于狩徐安道曰媚愛也與媚茲一人媚于天子媚于庻人同媚子者媚賢人也襄公能與賢者從公于狩則是與賢者同樂也梁惠王立於沼上顧鴻鴈麋鹿曰賢者亦樂此乎齊宣王見孟子於雪宫曰賢者亦有此樂乎則是以樂驕賢者今襄公能與賢者同樂亦可謂賢者矣奉時辰牡辰牡孔碩時是也辰時也周官獸人冬獻狼夏獻麋春秋獻鹿豕是獸之供各有時也物各有其時所以禽獸各得其所也辰牡孔碩大也惟其辰牡又甚肥大故公曰左之舍拔則獲拔括也矢末也書所謂往省括于度則釋是也公曰左之此盖虞人驅此辰牡以待公射公謂虞者從左而射之其射之也舍拔則獲此則善射如此上文言公善射矣末章又言公之所以善射御者以習之有素也遊于北園四馬既閑閑習也言遊于北園已習四種之馬輶車鸞鑣輶車輕車也鄭氏謂輶車驅逆之車周官田僕掌驅逆之車鄭氏注云驅驅禽使前趨獲逆御還之使不出圍惟其驅逆之車所以從禽故惟尚輕也鸞鑣鄭氏置鸞於鑣異于乘車也鄭氏之意謂乘車則鸞在側輕車則鸞在鑣然按韓詩曰鸞在衡和在軾蓼蕭之詩曰和鸞雝雝毛注曰在軾曰和在鑣曰鸞烈祖之詩曰八鸞鏘鏘鄭曰鸞在鑣則與此言自相違戾徐安道則以鄭説為非載獫歇驕犬名也長喙曰獫短曰歇驕載始也言其始逹摶噬之事也王氏乃謂襄公田狩之事園囿之樂於是乎始然此盖言襄公車馬之所閑習者以其平日遊于北園教之有素也其四馬既閑習又有獫歇驕能逹其搏噬此皆北園之所習也故上章既言田狩之事下章乃言平日之閑習亦如定之方中上章既言建國之事下章又言相土地之初王氏謂襄公田狩之事園囿之樂非也此詩與山有樞之詩美刺雖不同其實同也山有樞之詩以刺昭公是刺詩也此詩以美秦仲是美詩也山有樞之詩大槩以昭公有衣裳車馬鐘皷而不能自樂也則失其為君之道所以刺之也秦仲始大有車馬禮樂侍御之好襄公有田狩之事園囿之樂如此則可以為君故詩人美之不然則春秋之狩于郎蒐于紅皆一一而譏之而詩人美之果何為耶觀詩者當自黙喻矣黄曰狩于郎蒐于紅春秋皆譏之則田狩之事園囿之樂何足為美而詩人美之者以襄公救周有功平王賜之地始命為諸侯時人樂其有功於王室而始受天子之命則雖田狩之事園囿之樂而人亦樂與之也晉昭公有車馬而弗馳驅詩人以為刺秦襄公始命有田狩之事園囿之樂而詩人以為美盖無愧於國則國人願以其所樂而樂之也若畢弋而不修民事百姓苦之則不足美矣噫文王之囿大矣而人以為小齊宣之囿小矣而人以為大田獵一事而蹙頞喜色之不同民情之所在亦可以想見其君賢否也小戎美襄公也備其兵甲以討西戎西戎方彊而征伐不休國人則矜其車甲婦人能閔其君子焉小戎俴錢淺反收五楘音木梁輈涉留反游環脅驅隂靷音𦙍鋈音沃續文茵暢轂音谷駕我騏馵之庶反言念君子温其如玉在其板屋亂我心曲四牡孔阜六轡在乎騏駵音留是中騧古花反驪是驂龍盾之合鋈以觼古穴反軜音納言念君子温其在邑方何為期胡然我念之俴駟孔羣厹音求矛鋈錞徒對反蒙伐有苑虎韔敕亮反鏤魯豆反膺交韔二弓竹閉緄古本反縢直登反言念君子載寢載興厭厭良人秩秩德音李曰按秦本紀周厲王無道西戎叛之滅犬丘大駱之族宣王乃以秦仲為大夫誅西戎西戎殺之仲立二十三年死於戎宣王召其子莊公與兵七千人使伐西戎破之至幽王寵襃姒廢太子西戎與申侯伐周殺幽王驪山下而秦襄公將兵救周有功周東遷洛邑平王封襄公為諸侯賜之岐西之地曰戎為無道奪我岐豐之地秦能攻逐殺戎即有其地襄十二年伐戎至岐而卒其子文公十六年伐戎戎敗走於是文公遂收周餘民有其地至於穆公遂伯西戎秦居西垂與戎為鄰文公而始敗戎穆公始伯戎則其襄公世西戎方據周之地而有之此其所以為强盛也西戎之强若置之而不問則戎狄荐食之心無時而已將有以討之則連兵動衆無時而休其征伐不休則在行陣者必有暴露之苦處室家者不無怨曠之志如雄雉葛生之詩猶不免於多喪婦人怨曠也今也國人之心不以暴露為苦矜其車甲之盛而婦人又無怨曠之志而能閔念其君子此襄公所以為可美也小戎兵車也六月之詩曰元戎十乗以先啓行則先啓行者謂之大戎從後行者謂之小戎收者軫也軫者車之前後兩端之横木也為此軫者所以收歛所載故名收焉考工記云輿人參分車廣去一以為隧注云隧謂車輿深也兵車之隧深四尺四寸兵車從前軫至後軫惟深四尺四寸車人曰大車牝服二柯有參分柯之二注曰大車平地載任之車大車牝服長八尺謂較也大車之軫其深八寸平地載任之車其軫八尺兵車之軫其深四尺四寸此之謂俴故曰俴收與下俴駟孔羣同五楘梁輈五五束也楘厯録也輈者轅也梁輈輈上勾衡也從軫以前稍曲而上至衡則居衡之上而向下勾之衡則横輈下如屋之梁然故謂之梁輈五楘輈之飾也以皮革五處而束所束之地因以為文章其文章厯録然也游環在服馬背上驂馬之外轡貫之游移前却無定處也脅驅者驅當服馬脅游環兩驂馬之外轡貫之引轡為環所束驂馬欲出以此環牽之脅驅以一條皮上繫於衡後繫於軫當服馬之脅驂馬欲入則以此皮約之游環所以制驂馬之外出脅驅所以禦驂馬之内入游環謂之靷環左傳曰如驂之有靳是也隂靷鋈續隂掩軓也軓在軾前輈在輿下三靣材以板木横側車前所以隂映此軓靷者以皮為之繫之於隂板之上今驂馬之所引也車衡之長惟六尺六寸其下只容兩服驂馬之頸不當於衡故分為二靷以引車也左氏曰兩靷將絶是靷有二盖驂馬之所引也鋈者銷白金沃灌靷環也續者靷端也文茵暢轂釋名曰車中所坐也以虎皮為之有文采暢長也轂衆輻所輳謂之轂考工記曰兵車之輪六尺有六寸椁其漆内而中詘之以為之轂長注云六尺六寸之輪漆内六尺四寸是為轂長三尺二寸又車人曰大車轂長半柯注云大車轂徑尺五寸其大車之轂既尺五寸兵車之轂三尺二寸比之大車其轂為長故曰暢轂所謂俴收暢轂皆以兵車比於平地載任之車則兵車之軫為俴其轂為長駕我騏馵騏馬之青黑色説文曰青驪文如博碁馵爾雅曰馬後右足白曰驤後左足白曰馵言念君子君子指其夫也古之君子以玉比徳言此婦人念其夫因思其夫之德溫温如玉無有玷缺今乃在其板屋之中使我心曲思之而亂也心曲謂心中委曲之事因思其夫是不得寜也地理志云天水隴西安定此地山多林木民以板為屋在其板屋言其夫之討西戎在西戎板屋之中也四牡孔阜者言兵車所駕四牡之馬甚肥大也馬既肥大而又良善故執轡在手騏駵是中騧驪是驂中者中服也言以騏駵為中服以騧驪為外驂也鄭曰赤身黑鬛曰駵說文赤馬黑毛其言與鄭氏同爾雅曰馬黒喙騧郭璞曰今之淺黄色毛氏以為黄馬黒喙為騧亦與此同説文曰馬深黒為驪龍盾之合盾者以木為之畫龍於其上合而載之言車馬之事盾則載于車上以為車蔽也鋈以觼軜説文曰觼環之有舌者盖一車四馬四馬則八轡詩但言六轡在手者盖馬之有轡所以制馬之左右令之随逐人意驂馬兩轡則納之於觼言驂馬之欲入則逼於脅驅而不得入内轡不湏牽輓故納驂馬之内轡則繫於軾前所以觼繫之也鋈以白金飾皮故曰鋈以觼軜言念君子温其在邑邑在狄人之邑也方何為期胡然我念之言欲何時而為歸期乎何為使我思之至於此極也俴駟孔羣謂薄金夾介馬也左氏曰不介馬而馳則是戰馬皆被甲以薄金為之清人詩曰駟介旁旁是也孔羣言甚和也不和則不能羣居矣韓詩外傳曰駟馬不著甲曰俴駟厹矛鋈錞厹三隅矛也刃有三角故謂之厹矛錞以白金故謂之鋈錞禮記曰進戈者前其鐏後其刃進矛㦸者前其鐓注曰鋭底曰鐏取其鐏地平底曰鐓取其鐓地蒙伐有苑伐中干也亦是盾之類蒙雜羽於其上苑然而有文也一云蒙伐有苑謂深伐之也苑沙苑在秦之西境戎舊居也虎韔鏤膺韔弓室也說文曰弓衣也以虎皮為之説文曰膺胷也爾雅曰金謂之鏤言馬帶當膺而以金飾之也交韔二弓於韔中顛倒而委置也周禮注曰弓檠曰柲其字從木從必以竹為之言置弓於韔裏然後以繩約之緄繩也言用縢約以備損壊也凡此皆言車馬之盛以此攻戰豈不克乎言念君子載寝載興厭厭良人秩秩徳音厭厭安也秩秩序也良人即君子也婦人謂夫乃安静善人其德音又秩秩然有序今乃從征役而不反我是以載寢載興未嘗不思念也好逸而惡勞人之常情也今小戎之君子雖曰有温温如玉之德其音又秩秩然乃以西戎猖獗之故從事於矢石之間釋其暇逸之安而有裹糧坐甲之勞忘其全生之計而有不保首領之虞非徒不以為勞又且從而矜之非徒行者不以是為勞而居者亦無怨曠之志以見襄公能使其民如此孟子嘗曰田獵與民同樂則百姓欣欣然有喜色而相告不與民同樂則舉疾首蹙頞而相告今秦民在於征役之間雖夫婦不相見欣欣然有矜誇之色詩人安得不美之乎據漢書地理志秦迫近戎狄修習戰備髙上氣力以射獵為先則好戰者秦之風俗然也秦之風俗如此而襄公又有以使之則安得不矜其車馬之盛然當邊隅未静夷狄抗衡之時則可以矜其車馬豈可以為常哉襄公既使其民矜其車馬至於孝公又使民勇於公戰怯於私鬪故孫子曰當誘之以厚賞驅之以刑罰使天下之民要利於此非鬪無由也襄公既以是使民孝公又以是使民自孝公以至始皇所以斥大境土蠶食諸侯以吞二周亦惟以此故爾善乎蘇東坡有言曰秦民好戰亦以戰亡夫始皇雖以墮名城殺豪傑銷鋒鏑而民之好戰之心囂然而未已也是故不可與休息而至於亡夫為國家者豈可使其風俗有好戰之心哉兵凶器也戰危事也爭逆德也先王不得已而用之先王之用兵也盖能使民懐之而忘其勞也曷嘗使斯民矜其車甲哉觀周自后稷以農事開國故其民有愷悌和易之心而其風俗卒歸於忠厚至於大王王季繼之積徳累功至於文武亦惟后稷之舊是務觀國風之詩其言多於耕耨播種之事則可見矣周文武所以能成周家之治者以其后稷有以遺之也始皇所以能混一海内者亦秦襄公有以遺之也觀后稷之稼穡可以知周家卜世卜年之過厯觀襄公之使民矜車甲則可以知秦之傳祚二世而不及其期非一朝一夕之故其所由来者有漸矣黄曰六月元戎十乗以先啓行在先啓行者謂之元戎收者軫也軫者車前後兩端之横木為此軫者所以收歛所載故號為收平地之車其軫深八尺兵車之軫其深四尺四寸比之為淺故曰俴收梁輈者轅也如屋之梁也故曰梁輈五楘者轅上之飾也五五束也楘厯録也以皮革五處束之而所束之處文采厯録然也游環在服馬背上貫驂馬外轡驂馬欲出以此環率之脅驅者服馬之外脅以皮繫於衡轄驂馬欲入則以此皮約之隂者以板横側車前及左右以遮蔽車而為之隂映靷則以皮四條為之鋈續者隂板之環以白金為之茵以虎皮為之有文者為車中所坐之席暢轂長轂也大車之轂尺五寸兵車之轂三尺有二寸故為長也馬青黑色為騏左足白曰馵凡此以見車服之盛如此言念君子以下之四句則國之婦人閔念君子之辭四馬八轡兩驂馬有兩内轡皆繫於觼軜在軾以白金為觼以軜轡故謂之觼軜兩轡繫觼則六轡在手俴駟孔羣者以淺薄之金為馬甲之用欲其輕易於旋習也刃有三角故謂之厹矛錞以白金故謂之鋈錞蒙伐有苑伐中干也亦是盾之類蒙雜羽於上苑然有文也韔弓衣也以虎皮為之鏤膺馬胷前飾也以金為之交二弓於韔中故曰交韔非特有韔又以竹閉秘藏之緄以繩約之國人矜其車甲之善如此而婦人又閔其君子之下從征役焉以此觀之則秦之風俗習於攻戰而狃於干戈非一日也蒹葭刺襄公也未能用周禮將無以固其國焉蒹葭蒼蒼白露為霜所謂伊人在水一方遡音素洄音回從之道阻且長遡游從之宛在水中央蒹葭淒淒白露未晞音希所謂伊人在水之湄遡洄從之道阻且躋遡游從之宛在水中坻宜尸反蒹葭采采白露未已所謂伊人在水之涘遡洄從之道阻且右遡游從之宛在水中沚李曰此詩言襄公受封列於諸侯而乃不能用周禮秦本夷狄之俗今既為周之諸侯宜以周禮漸漬其民而移其風俗今既不能用周禮此詩所以刺之也禮者為國之本不能用周禮則何以固其國哉説此詩者多迃曲難説當從歐陽氏爾雅曰葭華蒹蘆菼薍也説文曰蒹者萑之未秀也葭者葦之未秀也又曰鵻之初生一曰菼以此說觀之蒹也萑也菼也鵻也其實一草葭也華也蘆也葦也其實一草也蒹者萑之未秀者葭者葦之未秀者至於秋堅成然後謂之萑葦蒼蒼盛也歐陽曰蒹葭水草蒼蒼然茂盛必待霜降以成其質然後堅實而可用以此比秦雖强盛必用周禮以變其夷狄之俗然後可以列於諸侯此言是也鄭氏以蒼為强喻衆民之不從襄公政令按詩蒹葭蒼蒼但言水草之盛如秦民之强也白露為霜凝而為霜此其喻禮爾而王氏乃曰仁露義霜也而禮節斯二者襄公為國而不能用禮將無以成物故刺之曰蒹葭蒼蒼白露為霜其説固已迃矣而又謂降而為水升而為露凝而為霜其本一也其升也降也凝也有度數存焉謂之時此天道也畜而為徳散而為仁歛而為義其本一也其畜也歛也散也有度數存焉謂之禮此人道也其言破碎一至於是楊龜山已辨之矣更不復云毛曰淒淒猶蒼蒼也采采毛氏曰猶淒淒也白露未晞言露未乾而為霜也未已則未至於晞矣故詩人刺襄公能用周禮則可以固國如蒹葭然露降而為霜則可用未已未晞則不可用矣王氏以淒淒為成材故於淒淒曰未晞於采采曰未己言成物之易而速有如此者此皆鑿説也逆流而上曰遡洄順流而下曰遡游水草交曰湄躋升也小渚曰沚小沚曰坻涘者涯也右者出其右言迃迴也孔氏曰出其左亦迃迴言右者取其與涘沚為韵尔歐陽謂伊人者斥襄公也謂彼襄公如水旁之人不知所適欲逆流而上則道逺而不能逹欲順流而下則不免困於水中以興襄公雖得列於諸侯而不知所為欲慕中國之禮義既邈不能及退循其舊則又不免為夷狄也此説是也鄭氏乃以伊人為知周禮之賢人乃在大水之一邊盖言其逺也欲求而用之按詩人之意但言不能用周禮今又言不能用賢人本無此意是又畫蛇添足王氏之説尤為苛細暗昧為難通歐陽之説為勝當從之也齊桓公問於仲孫湫曰魯可取乎對曰不可猶秉周禮周禮所以本也臣聞之國將亡本必先顛而後枝葉從之魯不棄周禮未可動也見閔元年則知周禮所繫豈輕也哉故曰禮之可以為國也久矣與天地並未有舍禮而能固其國者亦未有用禮而國不固者秦本夷狄之俗自襄公以前未受封於周而列為諸侯雖未用周禮猶可也人亦不以不用周禮責之也今也列爵封土為周之諸侯所以保其社稷而撫其人民者豈可無禮乎襄公既不能用禮故詩人慮其無以固其國而刺之也襄公既使其民矜其車甲但有好戰之心使能用周禮以固其國猶可以漸進也既不能用周禮則何以為國之本乎譬之耽於酒色之滛而恣無厭之慾乃能用藥石以助之雖非養生之道猶尚可也既耽于酒色之滛又無藥石之助則强悍盛壮未有不亡者也秦能使民有好戰之心又不能用禮以固其國雖强盛之勢不已至始皇有天下亦無救於亡也周自后稷至於文武所厯者數百年而其務農之政猶一日也雖皆以是得天下而其成效則霄壤之不同故秦之有天下不過為漢驅民而已於秦何有哉黄曰蘇子由古史論曰秦起於西垂與夷狄雜居本以强兵富國為先襄公以耕戰自力而不知以禮義成之豈不蒼然盛哉然君子以為未成故其後世狃於利而不知義至商君厲之以法風俗日惡鄙詐暴慢甚於六國卒以此勝天下既勝之後二世而亡其亦有以取之矣歐陽公本義曰襄公以命為諸侯受顯服而不能用周禮變其夷狄之俗故詩人刺之以謂蒹葭水草蒼然而茂盛必待霜降以成其質然後堅實而可用以比秦雖强盛必用周禮以變其俗然後可列於諸侯伊人者斥襄公也謂彼襄公如水旁之人不知所適欲逆流而上則道逺不能逹欲順流而下則不免困于水中以喻襄公雖得列於諸侯而不知其所當為欲慕中國之禮義既邈而不能及退循其舊則又不免為夷狄也夫禮者所以維持而安全之道雖無不可較之形而有不可較之實使人君而知有禮焉則截然有不可犯者齊桓公嘗問於仲孫湫曰魯可取乎對曰不可猶秉周禮周禮所以本也臣聞之國將亡本必先顛而後枝葉從之魯不棄周禮未可動也然則不棄周禮所以存魯未能用周禮所以亡秦也歟終南戒襄公也能取周地始為諸侯受顯服大夫美之故作是詩以戒勸之終南何有有條有梅君子至止錦衣狐裘顔如渥於角反丹其君也哉終南何有有紀有堂君子至止黻音弗衣繡裳佩玉將將七羊反夀考不忘李曰按秦本紀自西戎侵奪岐豐之地周遂東遷雖使秦取岐豐之地而終襄公之世不能取之但十二年伐戎至岐而卒其子文公於是伐戎取其地此詩序所言襄公能取周地是説與史記相戾從史記則此序之言為可廢從此序則史記之言為妄當闕之以俟知者故鄭氏因此序謂秦處周之舊土歐陽以此破之至於始為諸侯其言與史記合矣襄公秦君也君能却西戎之鋒敵王所愾使周室得以束遷洛邑以是封諸侯受顯服大夫恐其志驕意滿怠於修徳故因美之而遂以戒勸也終南周之名山在扶風武功縣東終南山西距鳯翔北距萬年長安左氏謂之中南見昭四年條毛曰條槄孔氏引爾雅槄山榎孫炎注爾雅引此詩有條有梅曰梅柟也郭璞曰似杏實酢孫炎曰荆州曰梅揚州曰柟終南何有有條有梅蘇氏謂襄公既為諸侯受服於周其人尊而説之故曰終南則有草木以自衣被而成其深君子則有服章以自嚴飾而成其尊此説是也鄭氏謂喻人君有盛德乃宜有顯服猶山之木有大小也此之謂勸戒其意謂無盛徳則不宜矣鄭以上二句為勸戒之故其言若此既以上二句為勸戒之則下二句為美之其文不相貫紀毛氏曰基也謂山基也堂爾雅曰畢堂牆郭璞云今終南山道名畢其邊若堂之牆爾雅又曰山有堂郭璞曰山之崖室也然則堂者謂山之道終南何有有紀有堂此言山有紀堂以成其大也錦衣狐裘黻衣繡裳是襄公受命服于天子而来也狐裘諸侯之服玉藻曰君衣狐白裘錦衣以裼之盖以狐白皮為裘其上加錦衣使可裼也渥厚漬也言其色如厚漬之丹而又澤也言其衣服容貌之美如此宜其有人君之道也故曰其君也哉盖言不可以徒服其服也青黒相背謂之黻五色備謂之繡將將佩玉聲也盖言衣服佩玉之美如此宜其有人君之道至於夀考而民不忘也故曰夀考不忘周設司服之官自天子至於大夫之服皆有等差服天子之服則有天子之徳服諸侯之服則有諸侯之徳服大夫之服則有大夫之徳苟徒服其服而無其徳謂之觀美可也豈先王制作之本意乎今襄公始為諸侯而服諸侯之服宜其有諸侯之徳此大夫所以勸戒之也淇奥之詩曰㑹弁如星又曰猗重較兮此皆車服之美也然而衛武公之盛徳至善民不能忘此所以服之無愧色襄公始為諸侯而其大夫能以此戒之可謂引其君以當道也黄曰按秦本紀戎與申侯伐周殺幽王秦襄公將兵救周戰有功遂以兵送周平王平王封襄公為諸侯賜之以岐西之地曰戎無道奪我岐豐之地秦能攻逐戎即有其地襄公於是始國十二年伐戎至岐而卒子文公立十六年以兵伐戎戎敗走遂收周餘民而有其地至岐觀此則是襄公未得岐西而此詩言能取周地何其不同也噫襄公之世已得周地而未必能盡至文公十六年遂終有之也襄公始為諸侯受服於周其人尊而説之故曰終南之山宜有條梅之木紀堂之髙以喻襄公之宜有錦衣狐裘黻衣繡裳也故曰顔如渥丹其君也哉所以勉之以有君子之服必有君子之容而無愧于為君也曰佩玉將將夀考不忘所以勉之以有君子之容必有君子之徳而民之終不能忘也既有以稱之於前復有以勉之於後秦人愛襄公之意深矣黄鳥哀三良也國人刺穆公以人從死而作是詩也交交黄鳥止于棘誰從穆公子車奄息維此奄息百夫之特臨其穴惴惴其慄彼蒼者天殱我良人如可贖兮人百其身交交黄鳥止于桑誰從穆公子車仲行維此仲行百夫之防臨其穴惴惴其慄彼蒼者天殱我良人如可贖兮人百其身交交黄鳥止于楚誰從穆公子車鍼虎維此鍼虎百夫之禦臨其穴惴惴其慄彼蒼者天殱我良人如可贖兮人百其身李曰左傳秦伯任好卒以子車氏之三子奄息仲行鍼虎為殉皆秦之良也國人哀之為之賦黄鳥君子曰秦穆之不為盟主也冝哉死而棄民先王違世猶詒之法而況奪之善人乎今縱無法以遺後嗣而收其良以死難以在上矣君子是以知秦之不復東征也文公六年觀左氏君子之辭則詩人之刺穆公冝矣以人從死者穆公命此三人以從己之死也揚子或問信曰不食其言請人曰秦大夫鑿穆公之側説者以謂三良嘗許穆公以殉死故鑿其壙之側以從之而實其言夫信近於義言可復也三良復言而不近於義安得為信揚子之説非也惟其穆公以三人從死此其所以可哀也秦本紀曰穆公卒葬於雍從死者百七十人而此言三良者不知當時所死甚多惟此三人為良故獨哀之交交黄鳥止于棘交交毛曰小貌桑扈曰交交桑扈鄭曰飛往来貌鄭氏為勝當從之也言交交之黄鳥止于棘木之上而得其所今三良不得其死是黄鳥之不如也鄭氏曰黄鳥止于棘以求安已此固得之至以謂此棘若不安則移是生外意也王氏曰黄鳥聲音顔色之美可愛而又有仁心故以況三良夫黄鳥又安知有仁心楊龜山已辨之矣又始曰止于棘中曰止于桑終曰止于楚則與出自幽谷遷于喬木者異矣以哀三良所止不能進趨髙義而終於死非其所也據詩之上章言三良不得其所不如黄鳥之止于棘為得其所也止于桑楚皆是此意便於押韻耳非有先後優劣之辨也誰從穆公而死乎乃子車氏之子其名奄息以死也惟此奄息之為人乃是百夫之中最為雄特今乃為從人之死秦人哀之故臨壙穴之上則惴惴然而戰慄盖以百夫之特而埋於土中此其所以可懼也既懼矣於是仰蒼天而訴之曰何為盡殺我善人也如其可以他人之身而代之則人雖有百身亦皆願贖之也夫人豈有百身之理哉愛之甚也百夫之防防猶當也言一人可以當百夫百夫之禦禦亦當也然奄息則曰百夫之特仲行則曰百夫之防鍼虎則曰百夫之禦亦是便於押韻尔仲尼曰始作俑者其無後乎為其象人而用之也始也以木為之其終必至於用人既至於用人則其終必至於善人其源流既竭則其末流無所不至也此則作俑者其所以為無後而詩人所以刺穆公也蘇氏曰三良之死穆公之命也康公從其言而不改其亦異于魏顆矣此言得之夫子之於父母東西南北惟命是從然父有不義之命豈可從哉當其生也固當幾諌見志不從又當起敬起孝悦而後諌惟欲置親於無過之地而已及其死也雖有欲諫之志何所施哉故雖以三年無改於父之道為孝而其不善者則改之惟恐其不及也不然何以夫子曰從父之命又焉得為孝乎古之人不特魏顆為然陳乾昔寝疾屬其兄弟而命子尊己曰如我死必大為我棺使我二婢子夾我陳乾昔死其子曰以殉死非正禮也况又同棺乎弗果殺蘇東坡有云為人子之道事死如事生況於將死丁寧之言棄而不用是必有大不忍者奪其情也其尊已之謂乎此又非秦康公之所及也康公之孝似孝而非孝陳尊已之孝似非孝而實孝詩人刺穆公蘇氏以為康公之罪其亦以意逆志者也黄講同晨風刺康公也忘穆公之業始弃其賢臣焉鴥于叔反彼晨風鬱彼北林未見君子憂心欽欽如何如何忘我實多山有苞櫟蘆荻反隰有六駁邦角反未見君子憂心靡樂音洛如何如何忘我實多山有苞棣音悌隰有樹檖音遂未見君子憂心如醉如何如何忘我實多李曰穆公所以成伯業者以其用賢臣康公繼其業弃賢臣而不用是忘父之業也爾雅曰晨風鸇舍人曰晨風一名鸇鸇鷙鳥也郭氏以為鷂屬陸氏以鸇似鷂乃因風而飛説文曰旱天鷂一名晨風鴥説文曰鸇飛貌北林孔氏曰據此詩所作見有此林也盖言此林之木鬱然而茂盛故鸇飛而集亦猶穆公之好賢故未見君子則欽欽而憂惟恐其賢之不能至也今康公何為弃我乎欽欽爾雅曰憂也如何如何忘我實多言康公忘之甚也櫟爾雅曰櫟其實梂陸氏曰秦人謂柞櫟為櫟河内人或以為木蓼陸璣以為此秦詩也宜從其方土以為柞櫟苞者叢生也六駁毛氏以為如馬鋸牙食虎豹是獸名也然上文言山有苞櫟隰有六駁下文言山有苞棣隰有樹檖皆是説早木不應於此獨以駁為獸也當從陸璣之説駁馬梓榆也其樹皮青白駁犖遥視似駁馬故謂之駁馬崔豹古今注云山中有葉似橡皮多蘚駁亦是木名不可以為獸也六者王肅以謂據所見而言也棣毛氏以為唐棣孔氏以為釋木有唐棣有棠棣毛氏以為唐棣未詳聞也徐氏又謂棠棣徒見王氏謂其實可食遂以為棠棣然經文但言苞棣不言唐棣不可指名其名也檖陸璣曰一名赤羅一名山梨今謂之楊檖實如梨但小耳此言山之有草木所以為山之光輝亦猶國之有賢為國之光輝也未見君子憂心靡樂憂心如醉如何如何忘我實多以見其好賢之切也王氏以為北林之有晨風如人君之能黜除小人山有苞櫟山有苞棣謂能庇其國家隰有六駁隰有樹檖謂能養其人民然此四者皆是木之材而王氏取喻其人之如何詩人本無此意不可以為説也黄曰秦穆公不聴蹇叔之言喪師於殽其後悔過自誓而求其所謂一介臣斷斷猗無他技其心休休焉而有容者以保我子孫黎民則其所以求賢臣以保後世者切矣今康公忘穆公之業而至於弃其舊臣始之一字作序者所以深責之也故此詩言穆公求賢而不已康公棄賢而不用其將何以自庇乎然三良之殉非穆公之罪而康公之罪也亦明矣無衣刺用兵也秦人刺其君好攻戰亟欺冀反用兵而不與民同欲焉豈曰無衣與子同袍蒲毛反王于興師修我戈矛與子同仇豈曰無衣與子同澤王于興師修我矛㦸與子偕作豈曰無衣與子同裳王于興師修我甲兵與子偕行李曰秦人刺其君好攻戰亟用兵而不與民同欲秦康公以文公七年立十二年卒按春秋文公七年晉人秦人戰于令狐十年秦伯伐晉又十二年晉人秦人戰于河曲十六年楚人秦人滅庸見於春秋𫝊者如此此足以見其好攻戰也惟其好戰不能與民同欲夫驅民以戰民亦有忘其死者今康公徒然好攻戰不能與民同欲此民之所以怨也豈曰無衣與子同袍袍者毛氏曰袍襺按玉藻云纊為繭緼為袍孔氏以為純用新綿名為襺雜用舊絮名為袍是則襺袍其名雖異其制度則一與子同澤澤者毛氏以為潤澤鄭氏以為澤䙝衣近汙垢説文曰澤袴也是其䙝衣近污垢也論語注云䙝衣袍澤也鄭説固勝於毛氏然終不如程氏以為澤者如今汗衫之類戈長六尺六寸矛長二丈㦸長一丈六尺與子同仇仇方也作者起也行者往也此盖思古之詩言古之人君與民非是以汝無衣之意與子同袍故也此乃與民同欲如此惟其與民同欲至於興師則修我戈矛與子同伐仇方也與民同欲則民亦與君同欲也毛氏謂仇為匹其説固不通非惟如此又謂同􅂁者興也以興上與百姓同欲則百姓樂致其死然此非興也鄭氏雖不以為興其説以謂君豈嘗曰汝無衣我與汝共袍乎鄭氏之説雖勝於毛氏然謂君豈嘗曰汝無衣則非也此詩與晋無衣同意晉無衣曰豈曰無衣六兮不如子之衣安且燠兮非是無衣也但欲同子之禮耳此詩所謂無衣亦非是無衣不過但欲與民同袍耳説者以謂王于興師秦為諸侯之國安得稱王毛氏以謂天下有道則禮樂征伐自天子出鄭氏以謂王法興師王肅以謂疾其好攻戰不由王命王荆公以謂阻王命以厲民程氏謂以王道興師數説皆非也此是思古之詩指古之王者而言也孟子曰君行仁政斯民親其上死其長矣盖言君子之於民能與之共安平則可與之共患難既不與之共安平則民豈肯與之同患難哉昔勾踐之伐吳越國之民矜憐撫奄不啻若其親子弟及其伐吳國人皆以父勉其子兄勉其弟婦勉其夫曰孰是吾君也歟可無死乎是能與之同樂也固能與之同憂也衞則不然衛懿公好鶴鶴有乘軒者及其将戰國人皆曰使鶴鶴實有禄位余焉能戰卒之為狄人所敗于滎澤衞㡬於亡則不能與民同樂又豈能與民同憂哉今康公不能與民同欲欲民之從死必無是理况死者人之所重同袍同澤同裳者君之所輕以輕與民而責其所重苟不施之而欲得其報豈有是理哉黄曰秦為諸侯之國而曰王于興師者何也盖此詩言秦君好攻戰而不與民同欲故詩人思古之王者能與民同安浼故能與民同憂患若平居不能恤民而臨難責其死節其将孰從乎孟子曰君行仁政斯民親其上死其長矣故周公東山之役至於三年之久而民忘其死勾踐伐吳國人皆父勉其子兄勉其弟婦勉其夫曰孰是吾君也歟可無死乎盖其能與民同其好惡則民之視君猶吾身也視國猶吾家也秦人亟用兵而不與民同欲其怨之也宜矣毛詩集解卷十四
