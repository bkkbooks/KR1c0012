body:
  text: 毛詩集解卷二十五宋李樗黄櫄撰小弁步于反刺幽王也太子之傅作焉弁彼鸒音預斯歸飛提提是移反民莫不榖我獨于罹力知反何辜于天我罪伊何心之憂矣云如之何踧踧徒厯反周道鞠為茂草我心憂傷惄焉如𢷬假寐永嘆維憂用老心之憂矣疢如疾首維桑與梓必恭敬止靡瞻匪父靡依匪母不屬音燭于毛不離于裏天之生我我辰安在菀音鬱彼柳斯鳴蜩音條嘒嘒呼惠反有漼于罪反者淵萑葦淠淠孚計反譬彼舟流不知所届心之憂矣不遑假寐鹿斯之奔維足伎伎其冝反雉之朝雊尚求其雌譬彼壞木疾用無枝心之憂矣寧莫之知相彼投兔尚或先之行有死人尚或墐之君子秉心維其忍之心之憂矣涕既隕之君子信讒如或醻市由反之君子不惠不舒究之伐木掎寄彼反矣析薪杝敕以反矣舎彼有罪予之佗吐賀反矣莫髙匪山莫浚匪泉君子無易由言耳屬于垣無逝我梁無發我笱我躬不閱遑恤我後李曰太子冝臼平王也且曰申后之子也幽王既愛襃姒生子伯服遂廢申后以伯服為太子遂逐冝臼左傳曰至于幽王天不弔周王昬不若用愆厥位攜王姦命諸侯黜之而建王嗣用遷郟鄏攜王指伯服也王嗣指冝臼也詳左氏之文則是幽王既死伯服自立故謂之攜王諸侯黜之而立王嗣也此詩平王為太子見弃之時其傅之所作也弁彼鸒斯此章言己之失其所也弁樂也鸒斯鳥名爾雅曰鸒鵯名卑居又名雅烏郭璞曰雅烏小而多羣腹下白江東呼為鵯音匹鳥廣雅曰不反哺者謂之雅其謂之鸒斯者孔氏曰斯者語辭猶蓼彼蕭斯菀彼柳斯孔氏以劉孝標之博學而類苑鳥部立鸒斯之目為不精然揚子雲曰頻頻之黨甚於鸒斯子雲之意豈不因詩中之文而言之提提毛氏以為羣不如王氏以為安好人提提亦是安也榖養也言以鸒斯之鳥乃能弁樂羣飛而且安然今太子不得所安則曽鸒斯之不若也凡民莫不得以相養而我乃獨見弃於父母則凡民之不如也既不如鸒又不如民於是號呼而告之於天曰我有何罪乎又曰我之罪當何如邪惟其無罪見逐故心之憂以為將如之何踧踧周道此章則言周之將亡也踧踧説文曰行平易也以周道之平易而盡鞠為茂草乎見其國之將亡也漢伍被謂淮南王曰臣將見宮中生荆棘露沾衣也周道鞠為茂草正猶王宮生荆棘皆以見其將亡也此詩言鞠為茂草非是當時已如此特預言之耳如赫赫宗周襃姒烕之是以襃姒之寵而知國之將亡也其後黍離大夫過宗周而盡為黍豈太子傅之言為有驗邪自古廢嫡立庶未有國不受其禍秦廢太子扶蘇而立胡亥晉廢愍懷太子而立惠帝隋廢太子勇而立煬帝不旋踵而禍及之幽王所為如此其受禍也必矣此我心之憂傷惄焉如𢷬也惄思也𢷬如以物而𢷬心也不脫衣冠曰假寐如宣公二年趙盾盛服將朝尚早坐而假寐是不脱衣冠也假寐之中長嘆此事維憂其老故其心之憂如夫人之頭痛也詩言其心之憂矣有五其言之重複者以見其憂之甚也維桑與梓范内翰曰此章言冝臼孝敬而幽王之不察也陸農師曰桑梓父兄所植尚或敬之也禮曰見君子几杖則起其類是乎蓋以見君子之几杖則起其敬於君子也可知矣父兄種之木尚加敬止況人之所恃惟母所怙惟父敢不恭敬乎恭敬如此而乃見弃豈我之不屬於毛乎豈我之不離於裏乎屬離皆附麗之辭也夫人之所以見愛於父母者以其受父之皮膚處母之胞胎今我獨不受父之皮膚乎獨不得處母之胞胎乎辰者日月星辰所㑹也言我所生而遭難如此豈其所生之辰不祥邪如韓退之我生之辰月宿南斗惟其所生之辰不祥如此故其所以遭讒謗也冝臼之遭見弃者冝亦生辰之不祥也故曰天之生我我辰安在菀彼柳斯此章言王之不知己也菀然而茂者柳也其上則有鳴蜩之嘒嘒然漼然而深者淵也其傍則有萑葦之淠淠然而茂柳繁則有鳴蜩淵深則有萑葦柳之與淵皆能容物今王為父而不能容其子乃使之如不繫之舟不知所至故我心之憂至不遑假寐也鹿斯之奔此章言王之無恩御其子禽獸之不如也鹿之奔走者冝其疾速今乃伎伎然而舒遲者待其羣也雉之朝時雊然而鳴者求其雌而並飛今幽王弃其子是全無親親之恩弗如鹿之有所待而雉之有所求也王既弃其嫡譬如木之無枝則其勢孤矣此我心之所以憂而曽莫有知之者夫以此詩既言菀彼柳斯有漼者淵以刺王之不能容其子曽柳淵之不如也又言鹿尚待其羣維足伎伎雉之朝雊尚求其雌則是又鹿雉之不如也夫以鹿尚待其羣雉尚求其雌而王乃安然而弃其子是誠何心哉虎狼有父子之仁以虎狼猶愛其子而王乃弃其子是禽獸之不如也相彼投兔相視也視彼掩兔者尚有先驅而走之者道中有死人尚有掩覆之者墐埋藏也左氏曰道墐相望是也夫以特禽獸耳塗之死人又非親戚皆有不忍之心今幽王之存心乃忍為此此我心之所以憂而至於垂淚也文王之葬朽骨當時之人以為文王之仁尚及於死者況生者乎文王之於朽骨非有父子之親猶且愛之則其心可知也幽王之於父子之親猶且如此踈者亦可見也況欲澤及於斯民乎君子信讒范内翰曰此章言王之信讒怒其子而不循理也蓋言幽王之信讒如獻醻之無不受飲而幽王既不愛其子故内讒言更不舒究其為何如也王茍能徐究之則讒言亦不難見也如太子申生歸胙于公公田姬寘諸宮六日公至毒而獻之公祭之地地墳與犬犬斃與小臣小臣亦斃夫寘諸宮六日則其誣譖不亦甚明獻公不能徐而察之此申生所以有新城之禍幽王之誅其子何以異此然申后冝臼之見黜必有讒言交構於其間觀申生楚太子之見黜而驪姬費無極之徒姦言巧辭可謂深矣今申后冝臼之見黜則襃姒之徒其譖之也必有以深訕之特幽王之不察耳伐木者掎其巔而伐之不欲妄踣之也析薪者必觀其理而杝之者蓋隨其理而漸析之不欲妄挫之也今幽王御其子不循理舎彼讒言有罪之人而加罪於我則是妄加人之罪矣佗加也幽王之時若舎有罪既伏其辜若此無罪淪胥以鋪有罪伏辜者猶且舎之況於彼讒人之有罪變白為黑幽王安能辨之邪夫父子天屬之親也今幽王弃天屬之親視之如路人乃以讒言為可信而以其子為不足恤則幽王之不明也甚矣其不仁也亦甚矣莫髙匪山莫浚匪泉髙莫如山也而人則登之浚莫如泉也而人則入之王者勿以九重之邃天子之尊輕易其言而人莫我聽也而人将有屬耳於垣牆而聽之者王茍輕其言而不能愛太子則小人將乘間以離人之父子不可不戒無逝我梁四句與谷風同逝梁發笱譬如褒姒伯服奪其子母之愛今我躬之不容安能恤其後事哉論曰孔子曰詩可以興可以觀可以羣可以怨吾於小弁見之夫父母愛之喜而不忘父母惡之勞而不怨勞之而怨固非理也至於弃之而不怨亦非理也髙子曰小弁小人之詩也髙子徒知勞而不怨之理而不知所當然者故孟子深陳其曲折而闢之曰有人於此越人關弓而射之則已談笑而道之無他䟽之也其兄關弓而射之則已垂涕泣而道之無他戚之也蓋父母弃而不怨則愈䟽舜號泣於天曰父母之不我愛於我何哉舜不見愛於父母則思其所以不見愛之由是怨慕也故公明髙以為孝子之心為不若是恝也小弁之詩曰何辜于天我罪伊何亦是怨慕之意韓文公著履霜操以尹吉甫之子伯竒無罪為後母疾而見逐故著此操注曰追帝舜之事明怨其身之不父母憐也言人之不得於父母者當益親也其辭曰父兮兒寒母兮兒飢兒罪當笞逐兒何為又曰母生衆兒有母憐之獨無母憐兒寧不悲是亦舜怨慕之意爾蓋子而見弃茍或不怨是猶路人相遭一不得意憤怨而去無復介意曽何有恩義哉故孟子曰親之過大而不怨是愈䟽也愈䟽則與路人等爾即此觀之小弁安得為小人之詩邪雖然幽王之黜太子冝臼固非也而太子冝臼之立周已東遷周室自是不復興則平王亦非賢王也幽王黜之詩人乃譏之者蓋嫡庶之分人主所當先務也叔孫通曰太子天下之本也本一摇則天下震動惠帝柔懦之主也髙帝欲廢之而張良之徒為之謀成帝亦昬恣之主也元帝欲廢之而師丹正諌蓋嫡庶之分不正則天下震動其禍兆矣故雖惠帝之柔懦成帝之荒恣不敢廢也冝臼雖非賢主幽王廢之卒致驪山之禍則知天下之本其不可動摇如此巧言刺幽王也大夫傷於讒故作是詩也悠悠昊天曰父母且無罪無辜亂如此憮火吳反昊天已威予慎無罪昊天泰憮予慎無辜亂之初生僭始既涵亂之又生君子信讒君子如怒亂庶遄沮君子如祉亂庶遄已君子屢盟亂是用長君子信盜亂是用暴盜言孔甘亂是用餤音談匪其止共音恭維王之邛奕奕寢廟君子作之秩秩大猷聖人莫之他人有心予忖度之躍躍他厯反毚士咸反遇犬獲之荏染柔木君子樹之往來行言心焉數之蛇蛇碩言出自口矣巧言如簧顔之厚矣彼何人斯居河之麋無拳無勇職為亂階既微且尰爾勇伊何為猶將多爾居徒幾何李曰鄭氏曰悠悠思也其意以謂大夫憂思而訴之於天王氏曰悠悠不疾之意夏曰昊天凡言昊天則望之以其明也天不疾於用明則令已遇讒鄭氏則以為大夫之憂王則以為天不疾於用明王氏之言固失之矣鄭氏之言亦未為得也夫悠悠昊天者只是言天逺大之意言大夫遇讒則呼天曰悠悠昊天乃民之父母也今既無罪無辜而遭此亂如是之大且語辭耳鄭氏以且為茍且之且不惟文義不合詩人之意兼以其字屬於父母之下豈詩人之體乎憮大也鄭氏曰敖也鄭氏之言固有所據如禮記魯令薛令皆曰無憮無敖則憮亦敖也然此詩但言其亂如此之大不當為敖蓋鄭氏以父母為王故以憮為王之敖慢無法度然此詩乃是言天為父母而降此大亂也昊天已威此四句亦上章意言上天降喪亂亦甚威矣然我其實畏謹無罪也天降喪亂亦甚大矣然我其實謹慎無辜也慎毛氏以為誠不如歐蘇以為謹亂之初生涵容也僭鄭氏曰不信也鄭氏以為不信其訓詁則得之矣然其羣臣之言不信與信盡同之不别也詩只言僭不當言信者也此乃言小人之為讒有漸其始也必為不信之言以嘗試君之喜怒人君茍涵容而不拒則其志得矣小人於是無所忌憚而後進讒言人君必信任之此亂之所以又生也子張問明子曰浸潤之譖膚受之愬不行焉可謂明也已矣孔子此言最盡小人之情狀夫以水之浸潤漸於壞物皮膚之受塵漸受塵垢小人之讒如水之浸潤皮膚之受塵亦以其漸人君茍不察則小人得以逞其志必相謂曰吾之言君不我怒矣我何憚而勿為姦哉唐太宗時陳師合上拔士論謂一人不可總衆職微刺諷如晦等太宗曰𤣥齡如晦等不以勲舊進特其才足與有為天下女欲離間我君臣邪遂斥之嶺表使為君者皆如太宗則小人必不敢以嘗試之言入之至於漢元帝優游不斷是以恭顯之徒周堪蕭望之劉更生張猛四人重相辨論其始也元帝不之察其終也蕭望之皆為恭顯所排原其所由則僭始既涵之所致也君子如怒遄疾也沮止也司馬温公嘗舉君子如怒亂庶遄沮君子如祉亂庶遄已此言無所臧否為患大矣蓋幽王無所臧否不能用刑賞以别白善惡以成此亂故詩人教之曰王如能怒以懲姦則亂庶幾遄止矣如能祉以進君子則亂庶幾遄已矣以言幽王之不能然也蘇氏曰君子以為不幸而至此矣若人君一日覺悟大有所誅賞如楚莊齊威之事則亂猶庶幾可止也此實名言先儒以君子為在位者其説固非王氏以如怒為至誠之威以如祉為至公之徳亦非也此但言王如能怒能祉則可以止亂矣君子屢盟夫治世豈有君與臣盟哉使不善之人犯刑誅之可也何至於盟哉考之春秋如伯有之亂鄭伯與其臣下盟蓋盟生於君臣相疑而致也君臣相疑不能察其實而但為盟誓適所以長亂矣盜者指小人也禮曰與其有聚斂之臣寧有盜臣以其害人如盜賊然君子信之此所以用暴也餤進也盜言小人之言也小人之言甚甘人君徒知其甘而不知其禍此亂之所以日進而不已也漢張良曰良藥苦口利於病忠言逆耳利於行君子之言如苦口之藥此所以能治疾小人之言如味之甘者乃所以為毒也書曰有言逆于汝心必求諸道有言遜于汝志必求諸非道遜汝之言即小人之甘言也逆汝之言即君子苦口之言也唐人之言曰鼷鼠之牙食人有其類雖齧盡而不痛俗謂之甘口鼠也魯國之牛鼠食其角矣牛之寢齕有蚊蚋撓其膚毛必致鼓耳摇尾以揮之及鼷鼠食之即不知痛也鼠之一牙豈不甚於蚊蚋之千噆乎以其口甘雖貫心撤骨而不知也況其角乎朝廷之盜亦鼷鼠乎食君之角矣又将貫骨與心也觀此則知孔甘之言安得而不為亂乎匪其止共家語嘗說此句而繼之曰此傷姦臣蔽主為亂也王肅注曰止息也邛病也讒人不知所止息故惟王之病此言不甚分明孔氏曰此小人好為讒佞者非特於其職廢此供奉而己又為王之病害也此言似亦未安王氏曰孔甘之言非止於共適足以病王而已此説是也禮記曰為君止於仁為臣止於敬止共即所謂止於敬也孟子非仁義不敢陳於王前當時無以仁義與王言者豈以仁義為不美其心曰是何足與言仁義也云爾則不敬莫大乎是惟其心主於敬則無如孟子之告齊王堯舜之道也此大人所以能格君心之非也小人不能恭敬以事主肆為讒譖適所以病王也奕奕寢廟奕奕大也秩秩有倫也此四句頗難曉今且從歐氏之説寢也廟也衆工之所成也然規為制度本於君子先王之大道聖人之所謨也意謂聦明之人下通小人之賤事上逹聖人之大道無所不知而至於忖度常人之心則不待聦明者雖予亦能之蓋歎幽王獨不能而為讒邪所惑也躍躍毚遇犬獲之歐氏易其章為第五章今亦當從之毚說文曰狡兔兔之駿者為狡兔以譬狡惡之人王所當誅也荏染柔木以譬善人君子王當樹立之也至於往來行路之人言又烏足數乎焉先儒讀為夷然切當從歐陽讀作於虔切蛇蛇碩言蛇蛇安閒也小人之情不可測安閒而為大言也出自口矣此與好言自口莠言自口同言之好惡惟其口之所出曽無實巧言如簧巧言如笙中之簧以説人出其言曽無愧恥以見其厚貌深中也孔子曰巧言令色鮮矣仁惟其巧言則必嶮峻其心而外貌則安然無所恥此所以鮮矣仁也彼何人斯即讒人也麋水草之交左氏所謂吾賜汝孟諸之麋是也居河之麋指讒人所居爾讒人既無拳力又無勇主為亂階又且疾病爾勇伊何言無所能也爾雅曰骭痬為微腫足為尰説文曰脛氣足腫夫以此人無勇力又有疾病其人信尫羸矣其謀大可畏其人心之險也如此為猶將多爾居徒幾何言其為謀既大而且多爾居徒幾何而能然哉此言為讒譖之謀決非一人能之必衆人道之者何人斯蘇公刺暴公也暴公為卿士而譖蘇公焉故蘇公作是詩以絶之彼何人斯其心孔艱胡逝我梁不入我門伊誰云從維暴之云二人從行誰為此禍胡逝我梁不入唁我始者不如今云不我可彼何人斯胡逝我陳我聞其聲不見其身不愧于人不畏于天彼何人斯其為飄風胡不自北胡不自南胡逝我梁祇攪我心爾之安行亦不遑舎爾之亟行遑脂爾車壹者之來云何其盱爾還而入我心易也還而不入否難知也壹者之來俾我祇也伯氏吹壎仲氏吹篪及爾如貫諒不我知出此三物以詛爾斯為鬼為蜮則不可得有靦面目視人罔極作此好歌以極反側李曰王氏云暴也蘇也皆畿内國名按左傳成公十一年曰昔周克商使諸侯撫封蘇忿生以温為司寇則蘇國在温杜預注云今河内温縣是蘇在王畿之内者也至於暴為畿内國名無所經見豈鄭氏見作序者為卿士則以為在王畿之内邪蘇在春秋則稱子而此稱公者孔氏云蓋子爵而為三公也此説是也正猶祭伯祭公祭之所稱伯者爵也猶此蘇之稱子也祭公之所以稱公者乃三公也猶此蘇之稱公也彼何人斯鄭氏云彼何人乎謂與暴公俱見於王者也疑其與之而未察斥其姓名為太切故言何人歐氏破之以謂下文云伊誰云從維暴之云是直指暴公斥其名也豈於同行之侣未斥其姓名乎從鄭氏之説謂彼何人斯為暴公之侣也從歐氏説則是暴公也上文言彼何人斯下文言維暴之云歐氏以謂聽譖者伊誰乎乃維暴公之言是從則下文二人者其説迃回也當從鄭氏以為暴公之侣鄭氏之説固然矣但不當以為未察斥其姓名為太切鄭氏於巧言何人斯謂愬讒人也賤而惡之故曰何人今此又曰未察斥其姓名為太切其説自相矛盾則下文彼何人斯亦當從讒人賤而惡之其文勢不得不如此經言維暴之云二人從行序但言暴公為卿士者蓋序特言譖之所由其始自暴公始也其心孔艱鄭氏言特其心甚難知不如歐氏以為心傾險而不平易也夫人心險於山川惟其心傾險此其所以為譖也胡逝我梁鄭氏謂魚梁也在蘇國之門外則以魚梁非是譬喻也歐氏破之以為詩前後多言毋逝我梁皆是取喻蓋以魚梁者皆是取喻無足疑者何為逝我魚梁欲利我所有也不入我門者與我絶也其所以不入我門者必其心有愧恥夫以人之譖人不免有所愧恥如象日以殺舜為事而顔厚有忸怩譖者偽心也愧恥者真心也人能充其愧恥之心則無往而不為義矣二人從行二人者謂暴公之侣相從而行我不知誰為此禍何為逝我而不入弔我也始也如是之厚不若今日之薄如今之行不以我為可乎以見後之不如舊也陳堂塗也孫炎注爾雅云堂下至門之徑我聞其聲不見其身以見小人之情狀於此見之矣不愧于人不畏于天歐氏以蘇公自内省無所愧畏然此所謂斥讒人言爾之所為者不愧于人不畏于天亦猶胡不畏天胡不愧人皆是責小人也彼何人斯其為飄風喻小人往來無節如飄風之起胡不自南胡不自北歎已適遭之也其猶不自我先不自我後亦是歎已之所遭胡為而逝我梁祇所以攪亂我心以見不入唁我之意爾若安順而行之則汝何不閒暇而舎息爾若急速而行乎則汝之閒暇脂汝之車何為而不唁我也茍壹者之來則云何其病也爾還而入見我則我安還而不入見我則我心否塞而難知也以壹者之來則俾我祇安也此皆責不入我之家亦以見讒譖之人愧不敢來也伯氏吹壎仲氏吹篪此又言其相應和如伯仲氏之吹壎篪也壎燒土為之大如鴈卯鄭司農云壎六孔爾雅云大壎謂之嘂音叫郭璞云燒土為之如鵞子銳上平底形似稱錘六孔小者如雞子爾雅曰大篪謂之沂李巡云大篪其聲非一也郭璞云以竹為之長尺四寸圍三寸一孔上出徑三分横吹之及爾如貫言如物之在繩索之貫此皆言其相應和也如此爾豈不知我心哉我以為不我知何為而疑我也爾不譖我則出此三物以詛爾三物豕犬雞歐氏以為壎篪貫三物不如鄭氏以豕犬雞之為安也世本云暴辛公作壎蘇成公作篪譙周古史考云幽王之時暴卒公善壎蘇成公善篪二書但見此詩言伯氏吹壎仲氏吹篪遂以為壎乃暴公之所善篪乃蘇公之所善皆求詩之過也為鬼為蜮蜮如鼈三足生於南越南越婦人多淫故其地多蜮淫女惑亂之氣所生也陸璣注云一名射影江淮水皆有之人在岸上影見水中投人影則殺之故曰射影汝所為為鬼為蜮則誠不可得而見汝今乃人爾有靦面目而視人無窮言終必見我胡為而為此國語曰面而靦然注曰而目之貌後世用此句者以為愧恥非也於是作此歌以窮爾反側之心也自古讒人如驪姬之譖太子申生如武后之譖王皇后如李林甫楊國忠之譖張九齡可謂難知矣如此言我聞其聲不見其身其小人之情狀可謂隱然而難知也然以此詩窮小人之情狀反側亦可以見其髣髴云巷伯刺幽王也寺人傷於讒故作是詩也萋兮斐兮成是貝錦彼譖人者亦已大甚哆兮侈兮成是南箕彼譖人者誰適與謀緝緝翩翩謀欲譖人慎爾言也謂爾不信捷捷幡幡謀欲譖言豈不爾受既其女遷驕人好好勞人草草蒼天蒼天視彼驕人矜此勞人彼譖人者誰適與謀取彼譖人投畀豺虎豺虎不食投畀有北有北不受投畀有昊楊園之道猗于畝丘寺人孟子作為此詩凡百君子敬而聽之李曰蘇氏曰巷伯寺人是也鄭氏曰巷伯閹官寺人内小臣也鄭氏之意以讒人譖寺人寺人又傷其將及巷伯故以名篇是以巷伯寺人為二人此說不然據此詩所言巷伯序詩者遂以寺人釋之非二人也鄭氏以何人斯為二人則是以此為二人則非也萋斐文章相錯也説文云萋字從糸今且從經作此萋字貝錦文如貝文也左太沖蜀都賦曰貝錦斐成濯色江波王氏曰錦斐也哆侈皆是張大之意鄭氏之意則以謂箕星之所以成由踵已哆又侈而為舌故也然不如蘇氏之説南箕也因其有是形而命之耳讒人之誣君子亦必因其近似而遂名之斯言是也蓋古之論虚名者多説南箕也維南有箕不可以簸揚維北有斗不可以挹酒漿徒有其名耳上言成是貝錦則以喻讒人織其罪也此言成是南箕因其近似而遂譖之也彼譖人者不亦大甚乎誰適與之謀乎怪其謀之巧也正所謂為猶将多爾居徒幾何是也緝緝翩翩緝緝毛氏曰口舌聲也翩翩毛氏曰往來貌也捷捷猶緝緝幡幡猶翩翩此言讒人之意惟欲譖人爾無他營為也既而告之曰爾無謀欲譖人然亦當慎爾言君亦有時以爾為不信而去之君於爾言豈不受之乎既而亦舎之而遷去也如江充之譖太子其始也雖足以投其志其終也身亦受其禍所謂既其女遷是也驕人好好好好自以得意也驕人讒人也勞人被讒者也草草憂也勞人之憂無可奈何故呼天而告之曰察此驕人之有罪乎閔此勞人之無辜乎取彼譖人投畀豺虎豺虎若不受則投畀於北北方寒凉之地使凍殺之北方若不受則擲還與有昊使制其命蓋言惡之之深也楊園園名也畝丘丘名也鄭氏曰欲之楊園之道當先厯畝丘以言此讒人欲譖大臣故從近小者始孟子寺人之字言我寺人孟子作此詩凡百君子當敬而行之使自防也論曰子曰好賢如緇衣惡惡如巷伯故爵不瀆而民作愿刑不試而民咸服觀投畀豺虎豺虎不食投畀有北有北不受投畀有昊可謂惡之之深矣舜之去四凶流共工于幽州放驩兜于崇山竄三苗于三危殛鯀于羽山舜之所去者惟四凶耳而天下之人莫不咸服惟其惡惡如此巷伯也是以刑不試而咸服如後之君善善而不能用惡惡而不能去者非不知其惡然不能去者以其惡惡之未深此其所以亡也如漢元帝之於恭顯章帝之於竇憲非不知其惡而不能去則非所謂惡惡如巷伯也為人君者詳巧言何人斯之詩則可以為察姦之術觀巷伯之詩可以為去姦之術也谷風之什詁訓傳第二十小雅谷風刺幽王也天下俗薄朋友道絶焉習習谷風維風及雨將恐将懼惟予與女將安將樂女轉弃予習習谷風維風及頽将恐將懼寘予于懐将安將樂弃予如遺習習谷風維山崔嵬無草不死無木不萎忘我大徳思我小怨李曰風俗歸厚則朋友有信雖乆而欽之如伐木之詩是也風俗既衰則日趨於偷薄之域而朋友之道絶矣谷風之詩是也天下俗薄朋友道絶而刺幽王者文武之時親親以睦友賢不弃不遺故舊則民徳歸厚矣故伐木之詩所以述庶人之求友以見土之風俗所致幽王既不能遵文武友賢不弃之道則其民亦從而化之此其所以刺之也習習和貌也東風謂之谷風毛氏曰風雨相感朋友相須蓋言既有風而能又有雨則可以成潤物之功亦猶朋友之相須可以輔仁也朋友之相須既如風之與雨今也當罹患難之時則惟我與女二人同其憂至於安樂之時女反弃予朋友相須之義豈如是乎頽風之焚輪者也風薄相扶而上喻朋友相須而成此詩以風雨為喻者皆是取相須之意王氏以謂相與逹其道以施於下相與致其道以格於上則泥而不通矣將恐将懼寘予于懷言其當恐懼患難之時則致我於懷抱之中不暫忘也及其安樂之時我如遺弃之物無所記念也豈朋友之義所當然乎崔嵬山巅也言谷風之及物維山之髙無所不至則風之徳大矣萎衰落也禮記曰哲人其萎乎亦是言其死王氏曰風之於草木長養成就之則風之徳亦大矣然不能不終以萎死則風有所不能免也孰為此者乎天地也天地尚然而況人乎此説是也蓋天地之功猶有所不足也今也乃忘大徳思我小怨非所以為朋友也論曰周公曰故舊無大過則不弃也則是有大過當弃之矣如酈寄之於吕禄則當絶之矣當是時呂禄之宗族親黨日夜相與思慮計議如何當時國家社稷之勢為如何故不得不弃之今也乃欲以小怨而弃之其可哉大徳可思而不思小怨可忘而不忘風俗安得淳一而敦厚哉大抵朋友之義富貴貧賊患難安危其心當如一與之同安樂而於患難之時則不以為念非也如耳餘之凶終是也與之同貧賤而於富貴之時則忘之亦非也如公孫述是也公孫述與馬援同里閈相善以為既至當握手歡如平生而述盛陳陛衞以延援入立舊友之位述鸞旗警蹕就車磬折而入所謂忘其貧賤之交矣惟光武則不然故交嚴子陵與之共臥以足加於帝腹上不以為怒則其居富貴之時不弃如貧賤之時矣伐木之詩光武足以當之此其所以興也谷風之詩公孫述似之此其所以不終也蓋公孫述之待其舊友如陳勝光武待其故交如盧綰陳勝與張耳始居約時相然信死及據國爭權卒相滅亡回視昔日富貴無相忘之語豈不愧於心乎惟髙祖之於盧綰與之同里同日生綰以太尉嘗以出入臥内衣被飲食羣臣莫敢望雖蕭曹等時以事見禮至其親幸莫及綰者則其待之亦如貧賤之時矣卒之綰亡入匈奴非髙祖之過乃綰自取之爾陳勝不能取天下而髙祖得之公孫述不能服天下而光武得之但見其朋友之間已自有優劣矣況其他大節乎毛詩集解卷二十五
