body:
  text: 毛詩集觧卷三十八宋李樗黄櫄撰臣工之什詁訓傳第二十七周頌臣工諸侯助祭遣於廟也嗟嗟臣工敬爾在公王釐爾成來咨來茹嗟嗟保介維莫之春亦又何求如何新畬於皇來牟將受厥明明昭上帝迄用康年命我衆人庤乃錢鎛奄觀銍艾李曰此詩乃諸侯助祭遣之於廟之樂歌也古者天子之祭祖考四海之内各以其職來祭祭畢而歸必有遣之之禮故因其遣之也則又從而勑戒之焉孔氏曰周公成王之時諸侯以禮春來朝因助天子之祭事畢將歸天子勑戒而遣之於廟孔氏之意蓋謂此詩維莫之春故知其有為春來朝也烈文之詩亦諸侯助祭之詩然觀其所告之辭則曰無封靡于爾邦維王其崇之則告之以長守其富貴至此詩則專言農事諸侯助祭事畢將歸故不可不戒勑之滕文公問為國孟子曰民事不可緩也國之大事莫急於農天子廵守諸侯之國觀其土地開闢則賞之土地荒蕪則黜之諸侯之所以為賢否惟在於土地之或開或荒則知農功者正諸侯之急務也天子可不戒勑之乎舜咨十有二牧曰食哉惟時正此意也嗟嗟臣工嗟嗟戒勑諸侯之辭乃堯典之咨汝羲暨和舜典之咨十有二牧甘誓云嗟爾六事湯誓云嗟爾萬方有衆之類皆是起語之辭臣工者諸侯之臣亦如後世所謂臣僚是也鄭氏謂諸侯也又謂諸官卿大夫也鄭氏以臣工為諸侯卿大夫其説不通王氏以臣工為事君業其官其説亦與鄭氏無異至於保介則謂保民而介其君其説鑿矣鄭氏乃摭月令曰孟春天子親載耒耜措之於參保介之御間保介即車右也介者甲也車右之被甲執兵者也古者天子在右御車在中介車在左乃天子親載耒耜則以耒耜參于御保介之兩間則其保介當據鄭氏月令為説成王所以戒諸侯乃曰嗟嗟臣工嗟嗟保介蓋惟是戒諸侯之臣特借臣工保介以為言也諸侯之臣與於農事告之可也保介者在車之右雖天子以耒耜參于御保介之兩間而農事實無與焉故知所謂嗟嗟臣工嗟嗟保介其實戒勑諸侯故借臣工保介以為言也爾之公事不可不致其謹王者固己錫之以成法矣其有未知者則當謀度之於王未知其意而而臆決之非所謂錫也釐鄭氏以為理王氏以為治不如蘇氏以為賜詩所謂釐爾圭瓉則亦是賜也維莫之春言是時春已莫矣鄭氏曰周之季春於夏為孟春詩云三之日于耜四之日舉趾周之季春正于耜之時也農功方興故可以趨農事若以夏之季春則農事無及矣維莫之春乃周之季春也既至其國果何求哉惟問其新畬之如何觀其土地或闢或荒也田二嵗曰新三嵗曰畬此則泛言治田之事也於美也皇大也於乎美哉乃后稷教民稼穡求得來牟大受其明則本於上帝故周廟至今享此豐年之福為諸侯者其可不戒哉於皇來牟乃后稷以此教民稼穡惟后稷教民以稼穡故功勲由此而著其明則實受於上帝乃天誘其衷也故謂明昭上帝焉后稷教民稼穡而享有年之報為成王者亦以此而戒諸侯使諸侯命我衆人庤乃錢鎛奄觀銍艾庤具也釋詁文曰錢銚古田器世本云垂作銚宋仲子注云銚刈也蓋刈物之器也鎛説文曰田器也釋名曰銍穫禾鐵也説文曰銍穫禾短鎌也言命爾衆人具其鐵鎛所以耨田而奄忽之間觀其刈禾也鄭氏以奄為久不如王氏以奄為忽蓋言其速也書曰若農服田力穡乃亦有秋莊子亦曰耕而鹵莾之亦鹵莾而報予耘而滅裂之亦滅裂而報予來年變齊深其耕而熟耰之其禾繁以滋惟能庤乃錢鎛乃能有銍艾之望也若所謂緫角丱兮未幾見兮突而弁兮自錢鎛至銍艾宜若久也而乃曰奄觀銍艾蓋有其實者必享其效如是之速也黄曰成王即位之初諸侯以職來祭烈文言成王即政諸侯助祭此詩言諸侯助祭遣於廟祭畢而遺其歸之詩也觀成王之戒諸侯勤勤於農夫細民之事其意以為天以父母斯民之任畀于一人而予一人以父母一國之任畀于庻邦冢君其可不以民為念乎臣工鄭氏以為諸侯卿大夫李迃仲以爲諸侯之臣不如蘇黃門以為羣臣百工其説為近曰嗟嗟臣工蓋所以嗟嘆而感𤼵之也如所謂嗟我農夫嗟我兄弟嗟爾萬方有衆之類是也嗟爾羣臣百工爾亦當敬其所在公者乎敬爾在公則不可以家事廢國事不可以己欲奪民欲為民之念不可一日忘也天子廵守諸侯之國土地闢田野治則有慶土地荒蕪人民凍餒則有罰舜咨十有二牧曰食哉惟時則農事者諸侯之所當先也嗟嗟保介者諸侯之車右也月令孟春之月天子親載耒耜措之于參保介之御間保介即車右也成王既戒羣臣百工又戒保介御事其諄諄不已之意無非以農事為念則成王愛民之心亦可想矣曰維莫之春以見民事之不可緩而惟恐農務之或失也曰亦又何求如何新畬以見自農之外無餘事也我周家以農事開國其來牟之貽非一日矣昭上帝之命以成康年之效者此我周家之法也爾諸侯之既至其國則當命我農夫具乃田器庤乃錢鎛以為深耕易耨之資而觀銍艾於乃亦有秋之日此皆吾民所不可緩之事而爾諸侯之所當盡心者也孔子曰道千乘之國敬事而信節用而愛人使民以時而孟子以民事不可緩告之然則成王之告諸侯意其在此噫嘻春夏祈榖于上帝也噫嘻成王既昭假爾率時農夫播厥百榖駿𤼵爾私終三十里亦服爾耕十千維耦李曰左氏傳曰凡祀啟蟄而郊龍見而雩禮記月令孟春元日祈榖于上帝仲夏之月大雩帝用盛樂祈榖實春則因民播種而以啟蟄之時而郊夏則恐旱暵為災而於龍星見之時而雩皆所以祈榖于上帝者也上帝即天也以其體而言之則謂之天以其主宰而言之則謂之帝帝之與天果其有異乎孔氏以郊為祭所感生之帝雩為緫祭五帝是皆惑於六天之説者也噫嘻嗟嘆之辭也歐陽以成王即周之成王然觀噫嘻成王亦是成王業耳言周之王業既成明而且至不可復加矣惟當率時農夫播厥百榖而已百榖之種非一故緫而言之謂之百榖鄭氏以農夫為主田之吏孔氏以田農之夫非王所親率然觀大田之詩曰曾孫來止非親率而何王氏以為王親率之是矣駿𤼵爾私終三十里周禮遂人凡治田野夫間有遂遂上有徑十夫有溝溝上有畛百夫有洫洫上有塗千夫有澮澮上有道萬夫有川川上有路計此萬夫之地方三十三里餘百歩也夫萬夫之地一夫百畝方百歩積萬夫方之是廣長各百夫以百自乘是萬也既廣長各百夫夫有百歩三夫為一里則百夫為三十三里而此章言三十里舉成數而言之也亦猶詩三百五篇而謂之三百也古者耜廣五寸二耜為耦耦如論語所謂長沮桀溺耦而耕是也一川之間有萬夫固有萬耦故曰十千維耦大𤼵爾之私田而終三十里民之服於耕者有十千之耦服如書所謂服田力穡之服同孟子曰八家皆私百畝其中有公田私田者八家之田也榖梁曰私田榖不善則非吏公田榖不善則非民古者治平之世上下相親雨我公田遂及我私此下之戴上也駿𤼵爾私終三十里此上之愛下也為其上者惟恐私田之不熟為其民者惟恐公田之不善上下之情如此此其所以致豐年之報也自宣公初税畝以來公田之外履畝而税之上之人惟恐賦歛之不厚無復有意於私田則民之心豈復有公田之心哉上下之情不能相通此治之所以有愧於古也蘇黄門曰民力盡矣所不足者惟雨耳此説可謂盡詩人之意也噫嘻之詩春夏祈榖于上帝之樂歌也是詩所言者播厥百榖但曰十千維耦其意但言民從事於田畝殊無祈榖之意以為人事於此盡矣故播厥百榖十千維耦此皆人所能為也若夫百榖順成非人之所能為天也故於此而祈榖焉詳觀此詩經有盡而意無窮可以一唱而三嘆也黄曰此祈榖于上帝之樂章聖人重農事之始而尤謹於農功將成之時率農夫之勤而猶慮於民力不及之地故春而農始于耜則為之祈夏而黍稷方華又為之祈以見聖人之心重農如此其不已也月令孟春元日祈榖于上帝仲夏大雩以祈榖實左傳言凡祀啟蟄而郊龍見而雩此春夏祈榖之祀也噫嘻嘆辭也嘆王業之既成治功之既著則惟當率農夫以播百榖此不可緩者也凡治田野夫間有遂遂上有徑十夫有溝溝上有畛百夫有洫洫上有塗千夫有澮澮上有道萬夫有川川上有路計此萬夫之地地方三十三里而特曰終三十里者蓋有餘之數不盡舉也十千維耦者蓋萬夫之耕故曰十千論語所謂長沮桀溺耦而耕即此所謂耦也孟子曰八家皆私百畝同養公田公事畢然後敢治私事今曰駿𤼵爾私以見成王之心惟恐農夫私田之不治也榖梁曰私田榖不善則非吏公田榖不善則非民古者盛時君民相愛如父子之相親為君者則曰駿𤼵爾私終三十里為民者則曰雨我公田遂及我私君之心欲先乎民民之心欲先乎君周家風俗之美可想矣振鷺二王之後來助祭也振鷺于飛于彼西雍我客戻止亦有斯容在彼無惡在此無斁庻幾夙夜以永終譽李曰二王之後夏商之後把也宋也武王伐紂封武庚於紂之故都以奉成湯之祀又求禹之後得東樓公封之於杞以奉夏后氏之祀其後武庚既叛成王復立帝乙之元子紂之庻兄微子於宋以奉成湯之祀書曰成王既黜殷命殺武庚命微子啟作微子之命是也禮記曰武王伐紂既下車封夏后氏之後於把封殷氏之後於宋封宋乃成王之時非武王之時也禮記之言失之矣當以書為證古之王者所以必立二王之後者以其先代之祖肈造區夏奄甸百姓非一朝一夕之故雖後世子孫不克負荷然盛徳必百世祀不可以絶其祀故擇其賢者以繼其後以天子之禮樂而祀其祖考所謂崇徳象賢統承先王修其禮物作賔於王家者是也書曰虞賔在位丹朱堯之子舜之賔也舜之作樂而祖考來格丹朱亦與助祭之列與諸侯以徳相遜以此觀之則是丹朱亦以帝者之後而助祭也故二王之後亦助祭於周焉烈文之詩言諸侯來助祭則知二王之後皆在其中可知矣此詩特言二王之後比他諸侯其禮有加焉左傳曰宋天子之後也於周為客天子有事膰焉有喪拜焉其禮不得不加於他諸侯則其待之不得不如是故特為此詩也振鷺于飛振羣飛貎雍毛鄭皆以為澤其説簡徑王氏以為辟廱辟廱有水鷺所集也文王作豐有辟廱矣武王作鎬又作辟廱則廱有東西矣二王之後國於杞宋其來助祭則皆自東徂西故以于彼西雍為譬詩人之意不必如此詩人但言集于西雍未嘗以西為説杞之地在陳留宋之地在睢陽雖其適周也自東徂西然詩人之意不必如是王氏又謂鷺習水善捕魚其羽潔白可用為儀夫詩取譬於鷺者特言羽毛之似也安在其為習水善捕邪王氏以我客戾止亦有斯容以為我之習禮得民有容之譬夫以習禮之得民則可以譬捕魚也三代得民可以喻捕魚乎龜山辨之詳矣杞宋二王之後來此助祭亦有振鷺之容謂之我客者二王之後不純臣待之故謂之我客如所謂虞賔在位作賔于王家也在彼者在本國則人愛之無有怨惡其在此助祭則周人愛之無有厭斁以見二王之後所至之國皆愛之也孔子曰言忠信行篤敬雖蠻貃之邦行矣言不忠信行不篤敬雖州里行乎哉以見二王之後茍能盡其忠信篤敬之道則雖近而州里逺而蠻貃無適而不可行故二王之後來助祭容止可觀在國則國人愛之在周則周人愛之無適而不愛也蓋能在彼無惡在此無斁則可以有譽矣又從而勉之欲其夙夜匪懈然後徳音不已也觀其所謂以永終譽則可以見在此無斁矣君子之愛人也以徳細人之愛人也以姑息庻幾夙夜以永終譽是所謂愛人以徳也成王告微子曰與國咸休永世無窮又曰俾我有周無斁亦此意也黄曰禮記言武王伐紂既下車封夏氏之後於把商氏之後於宋而書言成王命微子啟代商後者蓋命微子雖成王之時然命武庚以奉商祀者實在於武王得天下之初也然則此詩所謂二王之後者豈非杞與宋歟二王之後來助祭而周人樂之故托振鷺以為之譬曰振鷺于飛于彼西雍雍澤也把之地在陳留宋之地在睢陽其適周也自東徂西故以西雍名之振鷺之來西雍也有毛羽之潔我客之來助祭也有容儀之美曰我客云者如所謂虞賔在位作賔于王家者是也在彼無惡見其在把宋則國人愛之在此無斁以見其來助祭則周人愛之所謂逺之則有望近之則不厭是也成王命微子曰俾我有周無斁信乎其無斁也周公居東東方之人欲其留西方之人欲其歸是亦在彼無惡在此無斁之意夫以二王之後其所可稱者如此而猶曰庶幾夙夜以永終譽愛之至也愛之不已則欲其譽之不已使之與國同休永世無窮而非止一時之名也吁成王待二王之後如此其亦可以見周家忠厚之至歟豐年秋冬報也豐年多黍多稌亦有髙廩萬億及秭為酒為醴烝畀祖妣以洽百禮降福孔皆李曰鄭氏謂報者嘗也烝也蘇黄門謂秋祭四方冬祭八蜡王氏則以謂祭上帝三説不同鄭氏以為烝嘗者則以豐年之詩所言為酒為醴烝畀祖妣以洽百禮故也然載芟之詩春藉而祈社稷其詩亦曰為酒為醴烝畀祖妣使其祈社稷之詩亦曰烝畀祖妣則祈社稷豈亦祭宗廟乎若以豐年之詩為祭宗廟則載芟之詩亦非祈社稷則鄭氏之説不通矣至於謂秋祭四方冬祭八蜡固是報成百穀之祭不如王氏以為祭上帝其説為長徐安道曰祭有祈焉有報焉豐年言報上帝則祈上帝見之矣陳少南曰噫嘻祈之於春夏豐年報之於秋冬是一體之詩也祈曰上帝而報不言者省文也觀載芟良耜之詩則可見矣有載芟則有良耜有噫嘻則有豐年則知所謂秋冬報者乃是報上帝此王氏之説所以為長也天子一嵗之間祭天屢矣春則啓蟄而郊夏則龍見而雩秋則明堂冬則圜丘無非所以祭天也噫嘻之詩言春夏祈榖于上帝而以為郊為雩傳既有明文可以為證至於豐年則但知秋冬之報矣若必臆度而為某祭則不可也黍説文曰禾屬而黏者曰黍稌爾雅曰稌稻郭璞曰今沛國呼稻為稌是也周禮曰牛宜稌鄭司農云稌粳也豐年多黍多稌蓋黍稌無所不熟也王氏則以為利髙燥而宜寒者黍利下濕而宜暑者稌其意以為豐年之時或髙燥而寒或下濕而暑無所不熟故所以為豐年職方氏謂雍冀之地髙燥其榖宜黍荆掦之地下濕其榖宜稌是黍之多者以為利髙燥稌之多者以為利下濕也黍稌無所不熟則以髙廩藏之歐陽公以為助語是也萬億及秭毛氏以為數萬至萬曰億數億至億曰秭黄帝筭法十百為千十千為萬十萬為億十億為兆十兆為京十京為垓十垓為秭為酒為醴言我之所以為此酒醴者所以進予祖考以和洽百禮奉行其祭祀神降其福無所不徧者上帝之力也故所以報之焉皆者徧也蘇黄門曰豐年載芟皆非宗廟之詩而下曰烝畀祖妣何也以其所以能進享先祖者皆方蜡社稷之功也此説得之矣但蘇氏不當以為祭方蜡王氏以為祭上帝其説得之矣然以為社稷之詩下言降福孔皆則惟天為能地道無成以順承天而已矣則不能與於此故社稷之言不及此也此皆失之鑿也黄曰祭有祈焉有報焉載芟春藉田而祈社稷故良耜則以秋報社稷噫嘻春夏祈榖于上帝故豐年則曰秋冬報也陳少南謂噫嘻祈於春夏豐年報於秋冬是一體之詩其説為當鄭氏謂報者嘗也烝也是特詩中有烝畀祖妣之文耳然載芟祈社稷之詩亦言烝畀祖妣以洽百禮則是亦可以為祭宗廟之詩乎吾以是知鄭説之不通也詳觀此篇之意盍言黍稌之多倉廩之富而我得為此酒醴以進享於祖考以徧洽於羣神祀事所以無缺百禮之所以咸備者皆上帝之賜也蘇黄門以為秋祭四方冬祭八蜡亦非詩人之意有瞽始作樂而合乎祖也有瞽有瞽在周之庭設業設虡崇牙樹羽應田縣鼓鞉磬柷圉既備乃奏簫管備舉喤喤厥聲肅雍和鳴先祖是聽我客戾止永觀厥成李曰班孟堅云王者未作樂之時因先王之樂以敎化百姓説樂其俗然後改作以宣功徳昔者黄帝作咸池顓頊作六莖帝嚳作五英堯作大章舜作韶禹作夏湯作濩武王作武周公作象勺皆是舞也觀其舞則可以見其徳也蘇黄門曰始作樂謂周公始成大武也張横渠謂勺是周公七年之後制禮作樂時大武有所増添祖者文王也觀舜典夔曰八音克諧無相奪倫神人以和而夔遂言作樂告神曰戛擊鳴球搏拊琴瑟以詠祖考來假則是韶樂始成而奏祖考故成王之時始作以奏於祖考也瞽者樂官目無所見也周禮上瞽四十人中瞽百人下瞽百六十人注瞽無目者也先王作樂不以人之無目而廢其職如宋之師筏論語之所謂師冕皆是無目者也既無目矣必使視瞭者相之視瞭者凡樂事必相瞽也有瞽有瞽在周之庭業所以飾栒為縣也植者為虡衡者為栒爾雅云木謂之虡郭璞注云懸鍾磬之木植者名虡虡既用木栒亦以木為之虡者立於兩端栒則横入於虡其栒之上加以大板其上刻為崇牙因置五彩之羽以為飾禮記云夏后氏之龍簨虡殷之崇牙注云横曰簨飾之以鱗屬以大板為之謂之業夏后氏但飾之以龍殷又於龍上刻畫之為之崇牙至周又畫繒為翣戴以璧埀五采羽於下樹翣於虡之角上飾彌多則所謂樹羽也應小鼓也爾雅云大鼓謂之鼓小鼔謂之應大射禮應鞞在建鼓東則為應應既是小鼓則田乃大鼓也明堂位云夏后氏之鼓足殷人楹鼓周人縣鼓是周法鼓始在懸也鞉如鼓而小持其柄搖之旁耳還自擊是也柷如漆筩方二尺四寸深一尺八寸今樂工擊此所以小合樂也敔如伏虎背上有二十七鉏敔刻以木長尺櫟之籈者其名也簫大者編二十三管長尺四寸小者十六管長尺二寸管如笛形小併而吹之謂並吹兩管也自業虡而下未必皆非他人之為周禮眡瞭之職掌大師之縣凡樂事相瞽注云大師當縣則為之相謂扶上則知業虡而下皆是他人為之則有瞽者從而奏之也奏之者是非止設業設虡簫管亦已備舉其聲則喤喤而和肅雍和鳴而各得其所無所奪倫也王氏曰肅雍和鳴則其人肅雍而其樂和鳴也以為人肅雍則上文無所屬不當從也惟其樂之和則先祖是聽當是時也二王之後適至於此故觀其成焉鄭氏謂長多其成功非也王氏以為於作樂也二王之後每來助祭其説是也成與簫韶九成之成同成猶終也徧更而奏焉故謂之成以舜之作樂祖考來格而虞賔在位當是時丹朱來助祭故獲聞舜之韶樂今此二王之後來助祭亦獲聞成王之樂其意㫖同黄曰始作樂而合乎祖説者以為始作樂者始成大武之樂也合乎祖者合樂而奏於文王之廟也然此詩特言合乎祖而已安知其合樂於文王之廟乎予以為祭有禘有祫禘者諦也禘其祖之所自出也祫者合也合其先祖而祭之也成王始作備樂以合祭於先祖之庭而歌有瞽之詩有瞽如所謂矇瞍奏公也周禮上瞽四十人中瞽百人下瞽百六十人如論語所謂師冕見者奏樂之工也樂既備而奏矣肅而敬雍而和矣此先祖之所以是聽也周人之尊后稷曰尊祖而祀文王亦曰祖至旱麓之詩言周之先祖世脩后稷公劉之業則所謂祖者又不必止以后稷文王為言也此特曰先祖是聽烏知其止言文王哉其篇終曰我客戾止永觀厥成謂二王之後來助祭而永觀其作樂之成也舜作樂以格祖考而亦曰虞賔在位此亦我客戾止之意也鄭氏以為治功之成非也論語言始作翕如也從之純如也皦如也繹如也以成此所謂永觀厥成者以作樂而言耳潛季冬薦魚春獻鮪也猗與漆沮潛有多魚有鱣有鮪鰷鱨鰋鯉以享以祀以介景福李曰潛季冬薦魚春獻鮪之樂歌也月令季冬乃命漁師始漁天子親徃乃嘗魚先薦寢廟注云此時魚潔美故特薦之周禮天官庖人冬行鱻羽膳膏羶注云魚水涸而性定十月初定則至季冬之時魚始肥美故特薦之也月令季春薦鮪於寢廟注云進時美物天官漁人春薦王鮪則是春之時其鮪始出故獻之也鮪如鱣其味必如鱣至春之時始浮水而北入河西上龍門而入漆沮按河南鞏縣東北崖上山腹有穴自春時始出故於時始得薦之也季冬薦魚則是季冬之時衆魚皆可薦也春薦鮪則所獻者惟鮪而已或曰獻或曰薦孔氏云其義一也王氏則以為薦禮薄獻禮厚不必如此分别也猗與歎美之辭也漆沮水名岐周之水也毛氏云潛摻也爾雅云槮謂之潛注云今之作槮者聚積柴木於水中魚得寒入其裏藏隱因以薄圍捕取之王氏但以為潛藏之隱故言取之深也鱣大魚似鱏而短鼻口在頷下無鱗肉黄大者長二三丈鰷白鰷形狹而長鱨黄鱨魚陸璣曰今黄頰魚似燕頭魚身頰骨黄魚之有力觧飛者鰋者額白魚也鯉者赤鯉魚也漆沮之水有魚之多鱣也鮪也鰷也鱨也鰋也鯉也得魚之多則以祭以祀故神助之以大福夫神之所以降福者豈為魚之多邪蓋其恭敬誠信奉之以物因其時而薦之未嘗敢後此其所以天助之多福也黄曰魚麗言萬物盛多可以告於神明矣而其詩曰魚麗于罶鱨鯊魚麗于罶鰋鯉魚麗于罶魴鱧知魚麗之意則知潛之意矣月令季冬乃命漁師始漁先薦寢廟周禮天官庖人冬行鱻羽膳膏羶此季冬薦魚之事也月令季春薦鮪於寢廟周禮天官䱷人春獻王鮪此春獻鮪之事也王氏謂薦禮薄獻禮厚予以為薦猶獻也詩人之言類多如此而奚必若是之分别要以聖人孝於其親而不敢忘於其親事死如事生事亡如事存薦其時物備其祭祀不敢自享其美而忘其先也如是則景福之助豈在於區區之物哉成王以孝祭而神明以心感也雝禘大祖也有來雝雝至止肅肅相維辟公天子穆穆於薦廣牡相予肆祀假哉皇考綏予孝子宣哲維人文武維后燕及皇天克昌厥後綏我眉壽介以繁祉既右烈考亦右文母李曰鄭氏以為禘大祭也大於四時而小於祫以為大於四時其説固是以為小於祫則非矣禘之祭則大於祫天子之郊有禘有祫有以為四時之祭諸侯之祭則有祫有四時之祭至於郊禘則非所當講也按春秋書大事于太廟大事者必祫也有事于太廟有事者必四時之祭也祫於太廟不言祫而謂國之大事四時之祭則不斥其名而曰有事言其諸侯之事也郊禘非諸侯之祭故特斥其名以見諸侯之僭也觀此則禘大於祫可知矣孔氏以禘大祭天人共之此亦非也孔氏但見鄭氏觧禮記禘祭故以為祭天又見詩言宗廟之事故以為祭天其説非古之制陸淳辨之詳矣兹不復云鄭氏又以大祖為文王然禘者乃禘其祖之所自出周之興自后稷而其祖則帝嚳也禘當及於帝嚳豈止及於文王乎鄭氏徒見詩之中稱文武故以為文王當從王氏以為禘帝嚳也有來雍雍至止肅肅言其來也則雍雍而和及其至也則肅肅而欽為此者誰與乃助祭之諸侯也諸侯之所以助祭者以天子則穆穆想夫在宗廟之中祭祀之時容止可觀也三家者以雍徹子曰相維辟公天子穆穆奚取於三家之堂三家之祭其祭宗廟果有穆穆之天子乎果有助祭之諸侯乎雖歌此詩何足取哉三代之時其祭祀也天子則穆穆諸侯則肅雍觀其容止則其心可見矣至於三家之祭則其心已懷僭竊之謀矣想其容止亦無復三代之時則徒歌其詩何所補哉天子薦進大牡之牲而諸侯之助祭則陳其祭祀之饌言其得四海之歡心如此假哉大祖也父謂之考祖亦謂之皇考綏其子孫使其臣則明哲其君則文武其降福使君臣皆賢可謂至矣既使君臣皆賢則安及皇天無有變異焉故能昌大其後之子孫而安之以壽考則其福之降也至矣盡矣不可復加矣后君也王氏以宣哲維人為在王庭之人以文武維后為繼世諸侯不如蘇氏以為其君臣明哲文武然以為其君臣明哲文武蘇氏又以為大禘之禮先王之臣有與祭者故於是稱宣哲維人要之大祖降福於子孫既及其君又及其臣以見降福無所不備不必以先王之臣與祭為説然其所以降福者非特先祖之力先祖之配亦有力焉文母亦不必以為文王配也陳少南云文母不必是大姒文母乃文徳之母也先儒則以皇考為文王烈考為武王王氏則以皇考為武王烈考為文王皆非也蓋所謂皇考烈考者皆指其祖也言皇考者尊之之辭也言烈考者美之之辭也孔氏之説則以為若此祭文王則於禮當諱而經云克昌厥後者則此詩自是四海之人歌頌之聲本非廟中之事故其辭不為廟諱此言非也使當時果祭文王則亦不為諱雖周人以諱事神亦不如此也自三代以前人君皆稱其名如堯曰咨爾舜則是舜乃其名也而史之書舜乃曰虞舜側微盤庚亦其名也商書之篇名乃曰盤庚則其不諱可知矣自周以前未嘗諱至周之時則諱矣然周人如稱文王則不斥曰文王曰昌如此而已書之所稱惟有道曽孫𤼵但曰元孫某史官不敢斥其名故也若不專指其人則雖紀其字亦為無害如穆王名滿而當時亦有王孫滿襄王名鄭而當時亦為衛侯鄭魯武名敖而後世之臣有公孫敖觀此則知此詩言克昌厥後噫嘻之詩言駿𤼵爾私昌文王之名也𤼵武王之名也皆未嘗諱也孔子作春秋如匡王名班而春秋亦書曹伯班簡王名夷而春秋亦書晉侯夷吾皆未嘗為之諱以此見此説非也黄曰唐陸淳嘗言禘者帝王立始祖之廟猶謂其未盡追逺尊先之義故又推尋其始祖所自出之帝而追祀之祀於始祖之廟而遂以始祖為配然則周人所謂大祖者豈非禘帝嚳乎鄭氏蘇黄門皆以太祖為文王此徒見詩中有烈考文母之辭而不察其所以為禘之義也鄭氏謂禘大於四時而小於祫王肅馬融則謂祫小於禘予以為馬融王肅之説為當而鄭氏之説非也夫禮有郊有禘有祫有時天子兼是四者之祭而諸侯有祫無禘有時無郊春秋書有事于太廟者四時之祭也大事于太廟者祫祭也魯以六月禘周公必書禘者書其僭也所謂魯之郊禘非禮周公其衰矣吾以是知諸侯之可以祫不可以禘則禘之大於祫豈不明哉三家者以雍徹孔子以為奚取於三家之堂蓋傷之也雖然此詩言禘大祖而特及於皇考烈考文母之事何也鄭氏蘇氏以此詩為祀文王其説固非李迃仲以為父謂之考祖亦謂之皇考陳少南亦以文母不必專言大姒皆求為之説而不可得故曲為之辭也予以為禘大祖而言烈考皇考文母之事者猶言文武之功起於后稷也文武之功及於後人如此而所以致文武之功者推所自來蓋基於帝嚳姜嫄之生后稷時也此詩人不盡之意讀者試思之載見諸侯始見乎武王廟也載見辟王曰求厥章龍旂陽陽和鈴央央鞗革有鶬休有烈光率見昭考以孝以享以介眉壽永言保之思皇多祜烈文辟公綏以多福俾緝熙于純嘏李曰諸侯始見武王廟之樂歌也孔氏以為成王即政諸侯來朝於是率之以祭乎武王之廟詩人述其事而為此歌焉蘇氏則以為載見之作成王即政其事皆不得而考姑且闕之諸侯始見乎王也曰求厥章而已載始也鄭氏謂曰求厥章者求車服禮儀之文章制度非也新君即位諸侯來朝求新法度文章也非是求車服禮儀之文章制度也諸侯來朝故其所建交龍之旂則陽陽而明其在軾之和與旂上之鈴則央央而有聲又以鞗皮為轡首之革其末以金為飾有鶬然而美鶬金飾貎新君即位諸侯來朝信乎其有光大也故曰休有烈光惟新君即位因而助之見於武王之廟以致其孝享之意而助其天子之福而又戒之保其多福也王氏則以為思有道之多祜也皇有道者也鄭氏則以為思成王之多福非也思皇與思皇多士同思語辭也皇美也美哉多福之如此也烈文辟公綏以多福上文言思皇多祜是天子享其福也此又言諸侯受其多福光大文章之諸侯又受多福俾繼續廣大其純嘏以見君臣皆受其福也天子得四海之歡心而受其多福諸侯奉天子之意亦受其多福所謂福者果何自而來哉福者順也蓋既順則百福自來矣黄曰孔頴逹謂成王即政諸侯來朝於是率以祀武王焉蘇黄門又謂載見之作成王未即政李迃仲以為其事不可得而知姑且闕之予嘗深考此一篇之義乃知孔氏之説為有據未可輕也夫詩言載見辟王曰求厥章則是始見成王以求其法度典章也又言率見昭考以孝以享則是成王率之以祀武王其説亦明矣成王得四海之歡心以祀其先王則成王有得福之道四海之諸侯各能以職來祭則諸侯亦有得福之道君臣之間並受多福而更相勸戒以保之於無窮盛矣哉有客微子來見祖廟也有客有客亦白其馬有萋有且敦琢其旅有客宿宿有客信信言授之縶以縶其馬薄言追之左右綏之既有滛威降福孔夷李曰成王既黜殷命殺武庚命微子代殷後於是微子來見祖廟振鷺之詩乃助祭之詩有客之詩乃始受命之詩也有客指微子也王氏以為君謂之賔臣謂之客有客有客美微子之臣而已美其臣乃所謂美其君也此説大不然王氏但按周禮而為言周禮大行人掌大賔之禮及大客之儀注云大賔要服已内諸侯大客謂之孤卿王氏按此為説然大賔大客在周禮則然矣詩人未必然也振鷺之詩言我客戾止亦有斯容亦是稱二王之後有瞽之詩言我客戾止永觀厥成亦是稱二王之後而於有客之詩獨以美微子之臣何邪那之詩言我有嘉客亦不夷懌亦豈可以為臣邪按左傳曰宋先代之後於周為客客者但稱其君也禮記曰天子無客禮則諸侯有客禮焉安可以為微子之臣乎商人尚白故微子來朝而乘白馬檀弓曰殷人戎事乘翰翰白色馬也以戎事乘之則微子亦乘白馬也文王之詩曰殷士膚敏祼將于京厥作祼將常服黼冔則是殷人助祭所服之冠也微子助祭故亦乘其白馬蓋其一代之所尚雖己易代矣而其臣猶服其冠乘其馬也鄭氏以為亦武庚也武庚為二王之後乘殷之馬及叛而誅不肖之甚也夫詩人言亦多矣如鳯皇于飛翽翽其羽亦傅于天鄭氏亦以為衆鳥歐陽破之曰有鳥髙飛亦傅于天此詩語辭不必亂生枝葉也言微子來見祖廟則其威儀萋且而敬慎又慎擇其從者之衆以見微子之從者無不賢也敦琢治玉之名言慎擇其衆如人之治玉也一宿曰宿再宿曰信曰信信言其信而又信也宿宿言其宿而又宿也以見其四宿也微子之在周至於四宿周人猶且留之則以縶而絆其馬以見周人愛之如是之至也及微子之去也則又追之追者餞送之也其餞送則左右安之蘇氏以為所以安之無方是也既有滛威降福孔夷此又以見周人愛之之辭也滛大也言微子既有威矣而又有福也既有威者以居其上公之位統承先王之禮物也又有福者言有徳而天降之福也觀此詩既有以見君臣之皆賢又以見周人之賢也微子之威儀敬慎其君之賢如此而又追琢其旅則從者之賢可知矣微子在周四宿周人則縶其馬既歸之矣而又追之則周人之好賢可謂有加而無已也有客與振鷺之詩大抵相類振鷺之所謂亦有斯容者即此詩所謂有萋有且是也此詩所謂言授之縶以縶其馬薄言追之左右綏之即振鷺之詩所謂在此無斁是也以微子之賢周人愛之如此則其治國可知也使武庚能如微子之賢則周人留之追之亦如微子矣豈至見殺哉以微子觀之則見周人所以討武庚者豈得已哉惟其人不肖而已黄曰武王之封武庚所以存商也周公殺之豈武王之意哉吁是不特非武王之意亦非周公之意也殺武庚而命微子則成王周公之心益可見矣武庚之惡周人惡之之深微子之賢周人愛之之厚既破我斧又缺我斨既誅之矣而且疾其破我斧缺我斨惡之之深也有客有客亦白其馬愛其人矣而愛其馬愛之之至也故有客云者喜之之辭也申而言之者不能自己之意亦白其馬説者以為商尚白故以白馬言之予以為詩人之辭不止於此蓋周人之愛微子也則見其所乘之馬亦愛之見其所御之僕亦愛之馬有潔白之色人有萋且之敬旅有追琢之容則周人之於微子無所不愛也一宿曰宿宿宿則宿之非一宿矣再宿曰信信信則信之非一信矣微子之在周如此其乆也而周人之情猶恐其去之之速也縶其馬而留之追其左右而安之則愛之之情豈有窮已邪既有滛威降福孔夷願之之辭也謂微子既承先王之禮物而作賔于王家其威既大矣而天之所以降福者又甚易也夫微子以受命之始而來見祖廟蓋當然之事而周人愛之不能自已則微子之賢為何如邪噫周公成王之殺武庚公天下之所同惡而殺之也其命微子也亦公天下之所同好而命之也武王之封武庚固所以存商而成王周公殺武庚亦所以存商歟毛詩集觧卷三十八
