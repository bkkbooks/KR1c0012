body:
  text: 毛詩集解卷三十四宋李樗黃櫄撰蕩之什詁訓傳第二十五大雅蕩召穆公傷周室大壞也厲王無道天下蕩蕩無綱紀文章故作是詩也蕩蕩上帝下民之辟疾威上帝其命多辟天生蒸民其命匪諶靡不有初鮮克有終文王曰咨咨女殷商曾是強禦曾是掊克曾是在位曾是在服天降滔德女興是力文王曰咨咨女殷商而秉義類強禦多懟流言以對寇攘式內侯作侯祝靡屆靡究文王曰咨咨女殷商女炮烋于中國斂怨以為德不明爾德時無背無側爾德不明以無陪無卿文王曰咨咨女殷商天不湎爾以酒不義從式既愆爾止靡明靡晦式號式呼俾晝作夜文王曰咨咨女殷商如蜩如螳如沸如羮小大近喪人尚乎由行內奰于中國覃及鬼方文王曰咨咨女殷商匪上帝不時殷不用舊雖無老成人尚有典刑曾是莫聽大命以傾文王曰咨咨女殷商人亦有言顛沛之揭枝葉未有害本實先撥殷鑒不逺在夏后之世李曰蕩之序有可疑者詩中言蕩蕩上帝而序乃以謂天下蕩蕩無綱紀文章其意都不相干涉鄭氏以蕩蕩為法度廢壞之貌鄭氏之解詩欲求合於序故不得不以法度廢為説也論語曰大哉堯之為君蕩蕩乎民無能名焉蕩蕩者廣大也使蕩而果為法度廢壞之意則堯亦為厲王矣歐陽曰蕩蕩廣大也謂蕩蕩無限畔也序言天下蕩蕩無綱紀文章者謂天下廣大無綱紀條理以治之也歐陽公雖以蕩蕩為廣大也然畢竟只為作序者求合於詩之句故余謂詩中若此之類誠有可疑也召穆公以厲王之不道遂傷之而言曰蕩蕩然而廣大者上帝也此呼天而告之之辭也天乎今天下之君如厲王者其威虐烈然甚矣其曰上帝者因厲王之疾威又呼天而告之也疾威如此而其命又多邪僻此見厲王之不君甚矣天生民而立之君使司牧之而勿使失乎性今厲王之為君乃肆為威虐而又多邪僻是天立人君乃所以害民也人之勞苦則必呼大遭厲王之暴虐無可奈何遂以歸之於天也天生我民其命信為難諶矣方其初也生賢聖之君以飬斯民及其終也乃生此僻王以殘虐我民夏之興也其始以禹其終以桀商之興也其始以湯其終以紂周之興也既始之以文武又終之以幽厲其難諶如此毛鄭皆以蕩蕩上帝為厲王歐陽公既以為不然而蘇氏又以下民之辟為天之廣大下民之所君又不能無失其曰蕩蕩上帝只是指天下民之辟只是指厲王其文明甚不須曲求其文也召穆公以厲王之惡同於紂故每章引文王數紂之惡以責之強禦強梁悍禦之人也掊克掊斂好勝之人也紂之臣惟是強禦凶逆之人惟是深刻少恩之人在位與在職事者無非此人也夫以紂之凶惡而又濟之以強禦掊克之人則如水之益深火之益熱其亂亡必矣滔漫也如滔天之滔也天降滔德猶言天降喪亂也天之降此喪亂而女又起而助天為虐蓋此怨之之辭也説者多以滔德為強禦掊克之人未必然也紂之所謂秉義類乃是強禦多懟之人也乃是好為讒言之人也乃是寇攘姦宄之人也類善也自古亂亡之君所以委任小人者非以小人為可任也蓋以君子為小人小人為君子也臨亂之君各賢其臣故紂以強禦之懟與夫流言寇攘之人為秉義類則夫秉義類之人必反以為強禦流言寇攘之人也紂之時在朝者飛廉惡來之徒而箕子比干之徒則屏棄之殺戮之囚奴之強禦多懟言強禦之人多怨懟之也流言以對言好為流言以答人主之問如管蔡之徒是也寇攘式內言寇攘之人而反使居內也王氏以強禦為厲王誤矣侯作侯祝靡屆靡究言在朝廷者無有忠信惟是以盟詛相要厲王又不能别白而窮究之則其政可知矣使君臣以盟詛相要皆是忠信之衰也如左傳曰鄭伯使卒出豭行出犬雞以詛射潁考叔者則鄭之刑政可知矣雖然何人斯之詩又何以言出此三物以詛爾斯乎使詛果非嘉事則何人斯之詩當在夫子所刪之列矣蓋觀詩當以意逆志婦人送迎不出門而莊薑乃有逺送于野之言正此類也何人斯之詩但以讒言亂國乃可以為人主之戒不必泥於盟詛之言也炮烋毛氏曰彭亨也鄭氏曰自矜氣健之貌言女炮烋于中國斂斯民之怨以為德蓋以小人為君子則其所用者無非小人也以怨為德則其所行者無非虐政也蓋是非顛倒邪正錯亂以白為黑以妍為醜自古亂世之君類多如此然其所以至此者則無人以輔弼之故也故曰不明爾德時無背無側爾德不明以無陪無卿蘇氏曰左右前後無良臣也陪陪二也天不湎爾以酒言汝之沈湎非天使之也人能深味此一句則凡所為者無不正矣不獨湎于酒也凡昏亂於貨利者豈天使之乎天未嘗使汝為是而爾之所為於不義則從而法之夫不義者豈可以為法哉汝既愆過於容止矣而又且無明無晦飲酒無度必其醉也則叫號歡呼而未嘗視事俾晝作夜言日間不視事也觀酒誥所陳在今後嗣王酣身誕惟淫佚于非彝用喪威儀則既愆爾止可見矣人惟飲酒可以觀禮茍無度必至於威儀怭怭側辨之俄又安得其容止之可觀哉蜩蟬也螳亦蟬之别名言其喧譁之聲如蜩螳之鳴其言語之沓沓如湯之沸如羮之熱但以此二句觀之可以見其喧譁之甚矣酒誥日庶羣自酒以見紂之君臣無不況湎于酒蓋紂之為酒池肉林君臣為長夜之飲其小大已近於喪亡矣而當時之人尚安而行之恬然不以為慮也內奰于中國覃及鬼方言取禍于中國遂及鬼方也鬼方逺方之蠻髙宗所伐者也內而中國外而鬼方無不怒之也時是也言不可歸咎於上帝也酒誥言紂之飲酒以致敗亡之禍曰天非虐惟民自速辜此言紂之飲酒而亦終以匪上帝不時其意一也言上帝豈欲喪之哉爾但不能用舊政耳雖無老成人在於朝廷尚有先王之舊法可舉而行而女曾莫之聽此大命之所以傾也顛沛語曰造次必於是顛沛必於是注曰偃仆也揭拔也人有常言木之偃仆而拔之者其枝葉未有所傷害而其本根實先撥也撥絶也以見商紂之惡四方未受其禍而王室已先顛覆矣其鑒戒不逺其在夏后之世也夏以是亡今紂之所為亦將以是亡不可不戒也書曰與治同道罔不興與亂同事罔不亡與治同事未必興也必在於同道然後可以興若夫與亂同事未有不亡也桀以飲酒亡紂亦以飲酒亡厲王亦以飲酒亡所謂異世而同符也歐陽曰刺者其意淺故其言切而近傷者其意深故其言緩而逺觀此詩所謂優遊和緩而不迫切者不言厲王之惡而專以紂之惡言之惟以末章二句言商之鑒在夏則商為厲王之鑒然後可以見其傷今之意可以一倡而三歎也或者不知乃以謂此詩者是文王刺紂之詩而非厲王之詩固哉其為詩也黃曰蘇氏曰蕩之所以為蕩由詩有蕩蕩上帝序以為天下蕩蕩無綱紀文章則非詩意矣此言是也若夫篇意章指歐陽得之章中訓詁李迃仲詳之不復再出也雖然商紂失道文王咨之厲王知之而不鑒之此所以使穆公復咨後人也不意乃祖所以咨人反以自咨其子孫儻王少自悔悟寧能一刻自安哉穆公言及於此無可救藥茲序詩者所以為傷之也抑衛武公刺厲王亦以自警也李曰按史記衛世家武公乃僖侯之子恭伯之弟以宣王三十六年即位則厲王之時武公未為諸侯安得作詩刺厲王且以自警然某於此詩不能無疑説者以為追刺然詩中所言指其君為小子豈有後代諸侯乃指前王以為小子哉武公必不然且仕於亂君之朝自警可也今先朝之事已往矣自警何為哉則知此詩只是刺幽王然詩無明文未敢以為必然也觀國語所載昔衛武公年九十有五矣猶針警於國曰自卿以下至於師長茍在朝者無謂我髦而舍我於是作懿以自警韋昭注曰懿詩大雅抑之篇也抑讀曰懿如懿詩果是抑詩則是乃武公年老而作不應以刺厲王也但恐别有懿詩韋昭所不見遂附會為抑詩爾雖然以為刺厲王幽王二者皆不可知也學者亦不必泥於此但詳考詩中所言深有補於人君與夫士君子之所以修身者如南容於白圭之玷尚可磨也斯言之玷不可為也第數句耳而能三復之孔子遂以為邦有道不廢邦無道免於刑戮則此詩豈可少忽哉黃曰夏商之禮既無證矣雖孔子有所弗敢議爵祿之制去籍久矣雖孟子有所弗得聞何者以千百載之下而論千百載之上去古逺而聞見殊不闕其所不知而強為之説其不失之鑿也幾希抑之一詩學者疑焉曰考之史記武公之為諸侯蓋宣王時也烏乎刺厲王考之國語武公嘗作懿詩以自警也烏乎而為抑詩學者求之而不得其説則曰謂之刺厲王誤也而當曰刺幽王謂之懿者即今之抑詩也而懿當讀曰抑夫其用心於詩亦勤矣其如失之鑿何信史傳而解聖經吾不知其可然則如之何曰盍亦論武公愛君責己之意而他未暇焉可也觀抑之一詩雖臯陶之所以告君中庸大學之所以立論者不過是也既曰刺厲王又曰亦以自警戒君而不忘於責已愛君而無異於愛身不以厲王望厲王而以堯舜文王之所以正心誠意者望厲王其諄諄之辭至今使人讀之聳然而況於當時聞之者乎吁後之學者能於此詩白圭可磨之言而盡南容三復之意於尚不愧于屋漏之言而盡中庸不可能之義於神之格思之言而盡夫誠之不可掩之説以之修身以之治國平天下以之行乎患難行乎蠻貊無往而不可其於事君親臨大事必有不可奪者烏可忽哉抑抑威儀維德之隅人亦有言靡哲不愚庶人之愚亦職維疾哲人之愚亦維斯戾李曰抑抑威儀維德之隅抑抑密也隅廉隅言威儀維德之廉隅君子之所以為威儀者豈可以聲音笑貌為哉蓋充於內者既顯著則其發於外者言斯可從道斯可樂德義可尊容止可觀作事可法進退可度以臨其民譬如宫室之制內有繩墨外有廉隅但觀其外則可以見其內如孔子誾誾侃侃曲盡於鄉黨朝廷之間勃如襜如翼如躩如從容於進退揖遜之際茍非盛德何以及此人亦有言靡哲不愚歐陽公曰謂哲人不自修德則習陷為昏愚矣如書言惟聖罔念作狂是也蓋言人之行事能愼威儀則斯為哲人忽於威儀則斯為愚人哲愚之分在於愼不愼之間耳茍為自暴自棄無有哲而不為愚者矣彼庶人之愚乃倥侗顓蒙益其疾耳疾如古者民有三疾之疾也若哲人之愚自敗其行而適為罪戾矣説此詩者多立説自為分别以為如何是刺厲王如何是自警非也且如此詩首章言威儀以刺王之不能愼其威儀也然則已亦當愼其威儀矣此詩數章當如此求之不必分别也毛鄭蘇氏皆以哲人之愚為賢者不為容貌毁其威儀佯愚以避患此固無害然下文又告王以敬愼威儀維民之則所以責王者如此豈賢者不當如此耶故哲人之愚亦當如歐陽之説黃曰或云無體之禮禮之大也無文之敬敬之至也倡狂妄行而蹈乎大方者此聖人之事繩趨而尺步矩蹈而規行者禮之末而敬之衰學聖人而未詣者也吁其説過矣天下之理內外一致其外之睟然者皆其內實然者充之而進退無度言語無則者皆其內心不敬者之所形見也孰謂威儀之可忽也哉赤舄几几可以想見周公之所以為周公勃如翼如可以想見孔子之所以為孔子吾固知經禮三百曲禮三千非聖人為是勞且繁也蓋所以制其欲心而發其敬心也故曰抑抑威儀維德之隅昔晉靈公使鉏麑殺趙宣子鉏麑晨往見宣子盛服將朝尚早坐而假寐鉏麑嘆曰不忘恭敬民之主也賊民之主不忠棄君之命不信遂自觸槐而死吁方鉏麑之往惟恐不遇宣子耳遇宣子則殺之必不免也今也盛服而坐雖寐而不敢殺寧自斃其軀而不敢萌賊宣子之心誠之感人至於如此孰謂威儀之可忽邪是故君子於此不敢忘敬也能敬則為哲人不敬則為愚人茍謂威儀之可忽而自慢焉則亦無有哲而不為愚者矣此惟聖罔念作狂之意也故曰人亦有言靡哲不愚吁庶人之愚猶可疾也而況於哲人者亦若是焉是亦自取戾耳豈不深可惜哉故曰庶人之愚亦職維疾哲人之愚亦維斯戾此武公戒厲王之意亦自警之意也雖然明作哲哲之為言大智之謂也安有既哲而復為愚者哉愛君之切者多逺慮自警之深者多過辭無競維人四方其訓之有覺德行四國順之訏謨定命遠猶辰告敬順威儀維民之則李曰無競維人此言治道在於得人也有覺德行此言治道在於修身也競強也莫強於得人茍能得人則四國皆則效之矣覺直也德行而無邪僻則四方皆順從之矣中庸之九經曰先以修身繼以尊賢齊明盛服非禮不動所以修身也去讒遠色賤貨而貴德所以勸賢也人君內而修身外而尊賢左右前後無非正人故能相與協力同心大其謀謨定其命令有逺謀以時乃相戒告而又能敬其威儀則可以為民之則也人君能愼威儀以為民則容止可觀進退可度以臨其民民斯畏而愛之則而象之若乃望之則不似人君就之不見所畏則天下何所取法哉黃曰竊嘗論之力勝而後威兵強而後克天下之言強者莫先焉夫豈知至誠之中有非斧鉞之斧鉞忠信之中有非甲胄之甲胄不誠不信怒愈甚而民愈侮言益多而民益疑何者污其身望人以潔枉其身望人以直天下其孰從之誠之不可掩而民之不可欺也如此先王修德於一身初無心於四方之我訓四國之我順也然及其至也至逺之於夷狄至幽之於鬼神山川草木之無情天地隂陽之不測莫不順而孚安而悅惟吾所向而應之而況於吾民乎故謂誠之不足以感人動物者皆自欺者也不欺之學自言動始是故訏謨當定命逺猶當辰告訏謨大謨也辰告説者謂相告戒非也當早辨之謂也築舍道旁三年不成非定命矣履霜堅冰至非辰告也古人所以謀欲其多斷欲其獨者所以定命也慮欲其逺辨欲其早者所以辰告也斷不獨朝令而夕改雖有大謀其能濟乎辨不早滋蔓而後圖雖有逺猶其可及乎此皆不誠之所致也故又曰敬愼威儀維民之則夫人君之言動天下之所趨向威儀之不謹民又何觀甚矣夫威儀之不可忽也厲王失德蓋亦多矣而武公猶拳拳於威儀之戒蓋威儀之不謹德行之所由虧也古之人君言則左史書之動則右史書之非徒謹於言動之末也蓋其容不改出言有章而後可以為萬民之所望衣服不二從容有常而後可以齊民德以歸一令尹無威儀民無則焉古人所以深憂也而況於人君乎吁言動之不慎威儀之不謹此周之所以衰而極於春秋之變歟其在于今興迷亂于政顛覆厥德荒湛于酒女雖湛樂從弗念厥紹罔敷求先王克共明刑肆皇天弗尚如彼泉流無淪胥以亡李曰其在于今言其在于今之時所興作者皆迷亂于政其德則顛覆惟荒湛于酒則所謂威儀者果何自而慎之哉人惟湛樂于酒則至於如蜩如螳如沸如羮威儀幡幡而錯亂起舞仙仙而輕數亂其籩豆舍其坐遷無所不至也然爾雖湛於逸樂以快一時之樂則可矣胡不思祖考數百年之基業乎其所貪者以一日湛樂而所惜者喪祖考數百年之基業豈不大可惜哉而乃為大淫亂曾不思先王之成法以敬其明刑不敢少有暇逸也共當作如字讀皇天弗尚言王之所為皇天不崇尚之則必降喪亂無辜之人必受其禍矣詩曰國雖靡止或聖或否民雖靡膴或哲或謀或肅或艾如彼泉流無淪胥以敗雖有聖哲之謀肅艾之人亦至於淪胥而共受其禍也豈可不畏哉譬如泉水之流無不潰敗則其他亦將潰散矣故曰如彼泉流無淪胥以亡言如水之淪胥以至於喪亡也黃曰聞之師曰夏之衰也有太康商之微也有祖甲周之敗也有厲王漢之卑也有成帝唐之亂也有穆宗敬宗此六帝王者皆以天下治安朝夕不戒沈湎于酒是以日趨於亡而不自知也愚嘗觀先王盛時飲燕之樂未嘗廢也然天下方盛則以君臣燕飲為美談及其既衰則以荒湛于酒為亂政何也廢事謂之荒無厭謂之湛先王於承祭祀燕臣下之際酒非可廢也然鹿鳴之燕賔必曰修政既醉之醉酒必曰飽德今厲王之興以政則迷亂矣以德則顛覆矣而獨於酒是好焉非荒而何此武公所以傷今思古而不能自己也噫吾王不遊吾何以休吾王不豫吾何以助遊豫非美事也而民樂而詠之者以其為有省耕省斂而非流連之樂荒亡之行也武公荒湛之刺其孟子所謂流連荒亡之意歟賔之初筵之詩言君臣上下沉湎淫泆此正衛武公有荒湛之刺也武公之意以為爾雖有湛樂之從可以為樂矣然適足以為吾君憂不足以為吾君樂也蓋一人之樂天下之患也一日之樂終身之憂也思厥祖父不敢荒寧以成無疆之業爾獨不是之念乎乃祖乃父所以貽厥子孫而維持後世者有典則存焉爾其可不求先王之志而敬其明刑之法乎昔者先王勤於修政勤於明德而天命人心歸之今也厲王惑於荒湛之樂而忘先王之訓則天命去矣人心離矣天下其可保乎嗚呼無淪胥以亡武公思憂之心為何如愚讀詩至此一章見武公愛君憂國之意出於誠心而非為是歌詠也雖然其如厲王藐藐何夙興夜寐灑掃庭內維民之章修爾車馬弓矢戎兵用戒戎作用逖蠻方李曰君子共受其禍故告王以夙興夜寐灑掃庭內維民之章不獨為王計也亦為身計也蓋王受其禍已亦至於受其禍故告王以弭其禍焉言王夙興夜寐修潔於庭內則可以為民之憲章矣堂上不糞則郊草不瞻芟耘朝廷不潔豈可以責民哉歐陽公曰刺王有庭內知日夜灑掃以示人嚴潔而不知飾其身以自潔其容德此非也灑掃庭內只是修潔其朝廷耳修爾車馬弓矢戎兵用戒戎作用逖蠻方又戒之以修武備也以太平之世猶且除戎器以戒不虞況厲王之世可不修武備想其當時沈荒于酒貪目前之樂而忘意外之變則禍亂之來其噬臍無及矣故以修其車馬弓矢以戒戎器動作之處而逖蠻方也歐陽公曰刺王知修武備以防兵亂禦夷狄而乃不知修身逺禍亦非也黃曰茅茨不剪可以章百姓干戈不試可以來逺人今也衛武公告厲王以所以為民之章者特曰灑掃庭內而已告厲王之所以用逖蠻方者特曰修爾車馬弓矢戎兵而已夫身不足以表俗則雖庭內灑掃特美觀耳其何以章百姓也德不足以服逺則雖弓矢之修適賈禍耳其何以逖蠻方也先儒之説皆曰君有庭內不灑不掃其尚如民之治不治何國之武事不講不修其尚如逺人之服不服何歐陽公又為之説曰厲王徒知灑掃庭內而不知修身以章百姓徒知修爾車馬而不知修德以來逺人即二説而詳武公之意竊以為不然孟子曰不以文害辭不以辭害志此讀詩之法也泥於言意之末其何足以知詩人之意哉灑掃庭內愚謂武公之非止於灑掃云耳庭內云者微辭也去讒逺色賤貨貴德豈非灑掃庭內之意乎袵席之上茍有慙德宫闈之邃茍有虧言皆非灑掃庭內者也先之曰夙興夜寐其意亦可見矣修爾車馬弓矢戎兵愚謂武公之意非止於此一言也繼之曰用戒戎作此深意也干戈省厥躬弗戢將自焚豈非用戒之意乎溺於燕安而無備黷於武事而不戒皆非用戒戎作者也若徒泥於修爾車馬弓矢戎兵之一辭則失之矣噫知牆有茨之詩則知灑掃庭內之意知甲胄起戎之言則知用戒戎作之意此愚之臆説未必其然質爾人民謹爾侯度用戒不虞愼爾出話謹爾威儀無不柔嘉白圭之玷尚可磨也斯言之玷不可為也無易由言無日茍矣莫捫朕舌言不可逝矣無言不讐無德不報惠于朋友庶民小子子孫繩繩萬民靡不承李曰質歐陽日定也侯度蘇氏曰天子所以御諸侯之度也蓋天子所恃者內而人民外而諸侯耳茍內而失民心外而失諸侯則禍亂之來必矣故必質爾人民謹爾侯度然後可以戒不虞也然其所以戒不虞者豈有他哉惟愼言語敬威儀耳人君茍不失其言語則言而為天下則茍不失其威儀則動而為天下法天下之所繫者在於言語之間故言語威儀必在於柔嘉也柔善嘉美也其曰柔嘉者非所謂巧言令色也但美其動容耳夫以白圭之玷尚可磨而去之至於斯言一有缺失則不可追矣蓋以一言之非駟馬弗追一言之失駟馬弗及豈可輕哉無易由言言皆不可易女之言而以為茍且雖爾之舌無有捫持之者然其言一出則不可追矣人能知莫捫朕舌之説則其出言之際戒之慎之不敢少忽如古人之三緘其口則其意可見矣人之所以愼其言語者以無言不讐無德不報故也言出乎身加乎民行發乎邇見乎逺出其言善則千里之外應之不善則千里之外違之言行君子之樞機其報施之必然不可掩也王茍能惠于朋友以及庶民小子子孫繩繩然而萬民莫不順承之矣惠之所施子孫且受其福則怨之所積雖子孫亦必受其禍矣報施之理其不可掩如此則為王者豈可輕言恣行而不為子孫計哉黃日天下之風化自朝廷始朝廷之風化自人君始故一言之發有千里之應一節之失貽四海之憂是果可不謹歟古之人君修身以格物審好惡以表俗正心誠意於宫庭之中而風移俗易於四海之逺此蓋有非斧鉞而畏非號令而信者也後之人君不求治本於身而責治效於人夫豈知先後本末之理邪彼其心以為宫庭之內天下莫吾知而不知一言之失取笑於萬世其可掩乎此武公之戒厲王所以欲其質諸人民之風俗謹其諸侯之法度以戒不虞之憂也又從而告之曰謹爾出話敬爾威儀無不柔嘉出話之不謹威儀之不敬似末莭也然玉之有玷猶可磨而去之斯言之玷其可復悔乎吁厲王之聞斯言當何如其自警哉非特厲王也吾儕三復此言其自勉尤當何如邪繼之曰無易由言無曰茍矣莫捫朕舌言不可逝矣此武公諄諄之意也言悖而出亦悖而入故曰無言不讎撫我則后虐我則讎故曰無德不報民之不可欺也如此為人君者茍能以順乎羣臣庶民之心則民之於君雖萬世而不忘故曰子孫繩繩萬民靡不承嘗觀秦之有天下未久也而民之欲亡秦者十戶而八九矣漢室中興三輔之民復見漢官威儀至於感泣不能自已是何惡於秦而忠於漢哉乃知武公之言蓋不易之理也視爾友君子輯柔爾顔不遐有愆相在爾室尚不愧于屋漏無曰不顯莫豫云覯神之格思不可度思矧可射思李曰視爾友君子友親也言王之所親友以為君子者皆是和柔其顔而文飾其外以欺於人其實不能過於人也想爾處所居之室幽隱不明處能無愧怍方可為君子蓋君子小人之不同者以其真偽也人之在室能無愧怍則是誠心於為善然後可以為君子茍徒能巧言令色而文飾其外掩人之不知是乃穿窬之盜也小人於間居既為不善見君子厭然掩其不善而著其善所謂輯柔爾顔色於間居為不善則必有愧于屋漏也惟戒愼乎其所不睹恐懼乎其所不聞莫見乎隱莫顯乎微故君子愼其獨也蓋君子之修身不以有人而作無人而輟茍為因人而作輟則是修身者非所以為己乃所以為人也是必有人亦如是無人亦如是內省不疚無惡於志志茍無惡則屋漏之間必不愧也西北隅謂之屋漏西北隅所以謂之屋漏者廣雅以為招魂之處也詩人之意以為屋漏之中乃無人之地雖曰幽隱然君子之行事有一不當其心必愧也所謂莫見乎隱莫顯乎微是也文子有言曰君子不愧其影亦此意也無以為不顯而莫豫見也然神之格思不可度思矧可射思神之為道其至矣乎視之而弗見聽之而弗聞體物而不可遺洋洋乎如在其上如在其左右人可欺而神不可欺也故神之為道無有方體方其至也人不可測度之況可厭倦於無人之地乎射者厭倦也夫為不善於顯明之中者人得而誅之為不善於冥冥之中者鬼得而誅之人於冥冥之中為不善曾不思鬼得而誅之乎黃曰中庸曰君子戒謹乎其所不睹恐懼乎其所不聞莫見乎隱莫顯乎微故君子謹其獨夫中庸一卷書推其致至於位天地育萬物推其大至於川流敦化推其極至於無聲無臭而其道自謹獨始謹獨者不欺之謂也人惟自欺其心而後欺乎人平居為不善見君子而後著其善此自欺也人惟有一心茍自欺其心矣尚何所不至哉今也厲王出而見君子之人則和其顔退而處宫庭之邃則遂其過失節於暗室之中而矯情於十目之地不知人可欺也心可欺乎故武公戒之曰視爾友君子輯柔爾顔不遐有愆蓋責之之辭也又從而誨之曰相在爾室尚不愧于屋漏無曰不顯莫豫云覯神之格思不可度思矧可射思豫讀至此一章蓋喟然而歎曰武公真中庸謹獨之君子也想其胸中天理甚明一毫之欺不容於心所謂維其有之是以似之茍無是實安能為是言哉竊於是而思之人之所以靈於物者非人之靈也心之靈也一萌於思善與不善莫不知之故至明而神者心之真也飾惡以為善矯其外而偽其中者皆人欲之蔽而非其本心也故心貴於一而戒於二一則明明則視隱而猶顯所謂體物而不可遺也二則偽偽則見顯而不見隱所謂不誠無物也誠者實然之理也實有是理則實有是用如在其上如在其左右神果何在乎非神之在而心以為如在也立則見其參於前在輿則見其倚於衡目果何見也非目之見而心有所見也不顯亦臨詩人知之文王未當自知之也蓋人以為不顯而文王之心則以為未嘗不顯也小人為不善於不顯之地其心以為人之莫豫見也然而吾心知之烏得而不顯哉故曰無曰不顯莫豫云覯蓋人心之不可欺者此所謂神也人可欺而心不可欺故曰神之格思不可度思矧可射思此所謂神者非必求於杳杳冥冥不可見之中而當自察於吾心昭昭不可欺之際故中庸於此而推明之曰微之顯誠之不可掩如此夫是理也堯舜文王孔子之所以聖顔子子思孟軻之所以賢皆由是而入焉武公由是而戒君由是而自警其意深矣噫武公之詩以為厲王訓而聖人取之以為後世訓吾儕當以武公之言而終身誦之則聖賢事業惟在於平日操履之際而非在於多聞多見也前輩有銘云其出門如見賔其入虗如有人其行無愧於影其寐無愧於衾請事斯語無怠厥終吁真學者所當用心之地也不可不勉愚故詳及之辟爾為德俾臧俾嘉淑慎爾止不愆于儀不僣不賊鮮不為則投我以桃報之以李彼童而角實虹小子李曰辟爾為德辟君也言人君之為德必臧善必嘉美在容止之地能淑謹之而不愆於威儀一舉足無有不謹一動作無有不愼至於不僣差不賊害則無有不法之矣詩曰其儀不忒正是四國夫以威儀不忒正是四國者以不僣不賊為民之則故也蓋有其實則民必從而法之譬如投我以木桃報之以木李茍無其實而欲民從之譬如童羊無角自謂有角必自潰亂矣茍為堯舜之所為則必有堯舜之民為文武之所為則必有文武之民所為與堯舜文武異而欲得堯舜文武之民豈不潰亂其心志哉黃曰天生蒸民有物有則民之秉彞好是懿德斯民之在天下其本然之善出於天者固無俟於人而其所以為君子小人之歸未嘗不本於君之善不善何者性雖相近習則相逺是以上天為之作君作師以範儀規表一世斯民視儀聽唱從風而靡一本於君而已故夫陶天下為君子者非民也君也敗天下為小人者非民也亦君也自夫人膠於形骸勢位之間不知夫君民相應之機謂君之善無關於民民之惡無關於君為君者始肆然而莫克自反為民者始茫然而無所適從吁抑孰知夫風行草偃聲震響答之理哉武公謂辟爾為德而民應之以善猶投桃報李之必然者固非虗語茍王為不善而責民以為善亦猶童羊而求其角天下寧有是理哉武公極言君民相應之機必即物理之易見人情之必至者言之公之心可想矣周之民有好善好暴之不同者端於此詩可見荏染柔木言緡之絲溫溫恭人維德之基其維哲人告之話言順德之行其維愚人覆謂我僣民各有心於乎小子未知臧否匪手擕之言示之事匪靣命之言提其耳借曰未知亦既抱子民之靡盈誰夙知而莫成昊天孔昭我生靡樂視爾夢夢我心慘慘誨爾諄諄聽我藐藐匪用為教覆用為虐借曰未知亦聿既耄於乎小子告爾舊止聽用我謀庶無大悔天方艱難曰喪厥國取譬不逺昊天不忒回遹其德俾民大棘李曰荏苒柔木以荏染之柔木則可被之以絲而為弓猶溫溫恭人乃能修德也哲人之所以能修德者能受善言故也愚人之所以不能修德者以其不能受善言也蓋得其人而語之如聚沙而雨之非其人而語之如會聾而鼓之於哲人而告之以話言則順其德而行之至於愚人而告之以話言則反以我為僭也如唐德宗以蕭復為輕已實非輕已也以薑公輔為賣直實非賣直也吾之言非僣而反以為僣民各有心如此不可一槩論也於乎小子或者以小子為君命其臣之言不可以臣斥君也如書曰小子封小子胡之類是君稱臣之辭也然周公稱成王為孺子召公亦曰沖子管蔡稱成王亦曰孺子稱君為小子蓋自古老成人之常也但武公不得指厲王為小子此不能無疑也當時之君懵懵然不辨菽麥不知黑白我非獨擕其手而語之也且取事之已驗者而告之也非徒對靣而命之也且提其耳而誨之也惟告之如此而王卒不能悟焉其愚甚矣古人有不死之藥或人聞之不逺千里而求及其門而人已死猶且悔恨不得其藥人之有不死之藥今已死矣則其不死之藥可謂無驗矣其言不足信也而且有悔恨之心則是愚也今王人告之以已驗之事而不信之者則何異乎求不死之藥乎借曰王未之知然亦既抱子而為父矣何為懵然而不曉乎人民之才有不滿者多是少年便已昏惑誰其早知而莫成者乎使其早知之則其成亦早矣今王之昏亂如此則無知有素矣其曰民者蓋論凡民皆如此則王亦如此也歐陽以抱子為扶持其説曲也昊天孔昭言昊天甚明虧盈福謙栽培覆傾可謂明矣今王昏亂如此則其禍之來可指日而期矣吾生何所樂乎今視王夢夢然而昏亂故我慘慘然而憂慮我之誨王其諄諄然不倦非不切至而王乃聽我藐藐然而不入是王之不以我為教之也不知君子之諫其君其心至忠而或以為僣或以為虐其言何自而入哉借曰王之未知然王既已老矣前曰亦既抱子此又曰亦聿既髦則詩人之意非以為少壯之辭也於乎小子言武公之於厲王其告戒非一日也其來久矣王果能聽用其諫改過自新庶幾無大悔矣天方降艱難以喪國家取譬之不逺也商鑒不逺在夏后之世周鑒不逺在殷王之世昊天之於人無有差忒其禍福之所降惟視人君之德如何耳今王益為邪僻之行俾民大棘無所告訴以見其無忌憚之甚也嗚呼衛武公之畏愼其懼禍如此而王殊無改過之心夫人也亦末如之何也矣黃曰惟白受采惟甘受和自古忠臣賢士未嘗不極口致諫於君有拒之而弗聽者有聽之而弗忘者非進言者有可否聽言者之有賢否耳蓋愚者之於人言如瞽者之於物聵者之於聲雷霆震空而聵者弗聞泰山覆前而瞽者自若惟其弗覩而弗聞雖有致死之危彼弗知也愚者之安危利災不顧人言其類此耳至於智者則不然察利害於未形審禍福於兆眹惟懼危而弗安有而弗聞聞而弗亟耳又焉慮其覆謂我僣以為謗乎又焉用夫耳提靣命而聽之藐藐乎兹三章諄諄反覆無非悼王之蒙蔽禍將及己而忠言不用也至於末章則傷念至於無可奈何猶冀其萬一悔悟以聽用我謀耳噫公之意勤矣切矣純誠之篤不可以有加矣小子之義陳少南以為武公自道庶君臣義分之昭也桑柔芮伯刺厲王也菀彼桑柔其下侯旬埓采其劉瘼此下民不殄心憂倉兄填兮倬彼昊天寧不我矜四牡騤騤旟旐有翩亂生不夷靡國不泯民靡有黎具禍以燼於乎有哀國步斯頻國步蔑資天不我將靡所止疑云徂何往君子實維秉心無競誰生厲階至今為梗憂心殷殷念我土宇我生不辰逢天僤怒自西徂東靡所定處多我覯􅢌孔棘我圉為謀為毖亂况斯削告爾憂恤誨爾序爵誰能執熱逝不以濯其何能淑載胥及溺如彼遡風亦孔之僾民有肅心荓云不逮好是稼穡力民代食稼穡維寶代食維好天降喪亂滅我立王降此蟊賊稼穡卒癢哀恫中國具贅卒荒靡有旅力以念穹蒼維此惠君民人所瞻秉心宣猶考愼其相維彼不順自獨俾臧自有肺腸俾民卒狂瞻彼中林甡甡其鹿朋友已譛不胥以穀人亦有言進退維谷維此聖人瞻言百里維彼愚人覆狂以喜匪言不能胡斯畏忌維此良人弗求弗迪維彼忍心是顧是復民之貪亂寧為荼毒大風有隧有空大谷維此良人作為式穀維彼不順征以中垢大風有隧貪人敗類聽言則對誦言如醉匪用其良覆俾我悖嗟爾朋友豫豈不知而作如彼飛蟲時亦弋獲既之隂女反豫來赫民之罔極職涼善背為民不利如云不克民之回遹職競用力民之未戾職盜為寇涼曰不可覆背善詈雖曰匪豫既作爾歌李曰芮伯畿內諸侯為王朝之卿士也孔氏之序書曰巢伯來朝芮伯作旅巢命武王時也顧命同召六卿芮伯在焉成王時也桓九年王使虢仲芮伯伐曲沃桓王時也此又厲王之時蓋以其芮伯世在王朝常為內卿士也左傳文公元年引芮良夫之詩曰大風有隧貪人敗類則知芮伯字良夫也菀茂貌旬均也劉或曰殺也或曰殘也毛氏則曰爆爍而希也其音訓雖不同皆是桑葉剝落之意殄絶也倉毛氏曰喪也不如蘇氏以為悲王氏以為愴惻滋久其字從心從倉兄滋填久也言桑之茂也枝葉皆盛其下無所不覆及一旦為人所採捋則枝葉皆盡其下不得有所庇也猶周之盛也仁恩德澤饜飫於民雖匹夫匹婦無有不被其澤者及厲王之世肆行不道德澤不加於民如桑之盡而民病矣鄭氏之説以為王有明德天下之民均被其恩而羣臣放恣乃損王之德其取譬為迂曲惟民不得其所庇故芮伯心憂不絶悲愴甚久至於呼天而告曰倬然而大者昊天也胡不我矜憐乎何為而至於此極乎四牡騤騤此章言厲王征役之繁民受其禍也民之所見者惟四牡之馬騤騤然而不息旟旐翩翩然而行禍亂之生不可夷平無有邦國不見泯滅則厲王之暴虐甚矣其虐如此故民靡有黎俱受其禍以至於煨燼故芮伯以為可哀言中國所行之道將見頻促而亡也孟子曰詩云周餘黎民靡有孑遺信斯言也則是周無餘民矣知此則知靡國不泯民靡有黎之旨也國步蔑資國步如此無所資賴是天不我將助矣欲止息於此則無所止欲舍而他之則將何所往四海橫流滔滔皆是無所逃於天地之間也人之遭於亂世其難保如此殊可憂懼正月詩曰不自我先不自我後此詩曰靡所止疑云徂何往觀此四句則知其身無所託蓋如此也疑定也夫君子本無強爭之心也而人何生此禍亂之階至今為人之病則知其必強爭也厲惡也梗病也憂心殷殷言人之憂念土宇之日促自傷所生非其時適逢天之厚怒即所謂不自我先不自我後也自西徂東靡所定處即上章所謂靡所止疑云徂何往之意也然君子之遇困病可謂多矣又且急我以捍禦之事斯民困病無有休息之期也􅢌病也覯遇也棘急也圉捍禦也為謀為毖毖慎也言王之謀慮及其所慎重然亂日滋而國日削也則知王之所謀果非善謀也王之所愼重果非愼重也故芮伯告之以當憂恤之事與夫序爵之事夫爵故自有序上賢則加之以上爵中賢則次之下賢則又次之乃若以小加大淫破義逺間親新間舊則失其序矣能序爵則賢能各以其類進而天下治不能序爵則賢不肖混淆而天下亂誰能執熱而不以水濯其熱乎水則能去熱賢者則能止亂不可不念也言今之君臣其何能善乎相與及於淪胥而已歐氏以謂鄭氏以為治國之道當用賢者不惟取譬踈逺上下大意亦不聮屬竊謂鄭氏非疏逺也非與上下不聮屬歐曰民遭王暴虐思得賢君以紓患如執熱者孰不思往就水以濯滌其煩也此説固無害然與上下文不相貫孟子欲無敵於天下而不以仁是猶執熱而不以濯也孟子因論行仁遂引執熱以為説然可以類推矣此詩謂欲去亂而不序爵是猶執熱而不以濯也如彼遡風遡鄉也僾唈也荓使也此句頗難曉且從鄭氏之説言王之為政見之使人唈然如鄉疾風不能息也民有肅然之心本無怠慢而王乃使之至於不逮民無得以趨於畎畝之間則不逮者非民之罪也王使之也故芮伯告王曰好是稼穡言不敢輕於民力也能好是稼穡之事則民皆趨事於畎畝之間其有功於民者則使之代食蓋以稼穡之寶而有功代食者乃為政之善故也言代食而不言力民者但承上文不可以六字成文也亦猶擊鼓之詩曰從孫子仲平陳與宋不可言公孫文仲也天降喪亂言天為喪亂以滅亡此所立之王而又加之以旱蝗使稼穡皆病哀痛天災如此故我中國之民皆相連屬至於空虛言民無有不受其禍者王之羣臣無有陳力以念天之禍惟芮伯憂之也贅屬也荒虛也維此惠君此言厲王所用非其人而自以為賢也古者順道之君為百姓所瞻仰者以能內則秉持其心外則宣其謀猶於衆已以為然衆人亦以為然故能考察愼擇其相所任之人無非賢者惟彼不順之君自以為善自用其肺腸故所任之人已以為賢天下不以為賢也如此何以為百姓之所瞻仰此民所以狂亂也古人有言曰臨亂之君各賢其臣於此可見但一人為賢矣而天下不以為賢也唯明君則公天下之好惡衆以為可吾亦以為可衆以為惡吾亦以為惡此治亂之所由分也瞻彼中林甡甡衆多也即螽斯詩所謂詵詵是也字異而義同觀彼中林之中其鹿衆多相與羣處而朝廷之君臣乃爭相譛訴不能相善是鹿之不如也雖曰朋友乃靣朋友耳所謂噂沓背憎者也夫所貴於人者為其異於禽獸耳禽獸乃能羣居相與輩耦而行而人乃互相覆擠讒毁猜忌無所不至則亦何貴於人乎進退維谷言進退皆不可也處昏君之朝欲進而在朝固位而不去則必受其禍退而在野又恐得罪於君相進退之間無所恃也雨無正之詩曰亦云可使怨及朋友云不可使得罪于天子以苟容阿媚而云不可使則不可直道而行尚云可使則亦不可進而在朝則不可退而在野亦不可處斯世也蓋亦難矣維此聖人聖人則能逺知禍福於未萌其所瞻視而言者至於百里無逺不察也若夫愚人則反狂惑以為喜所謂抱火措之積薪之下火未及然因謂之安者也觀百里奚知虞之將亡伍子胥知吳之將亡其察於利害亦審矣而時君不容者蓋棄聖人之言而貪目前之安自古昏君之常態也使其不以愚人之言為然則何亡國敗家之有哉非不能言之於王以利害曉之也但以畏忌不敢言耳哀哉不能言匪舌是出惟躬是瘁夫言豈難哉苐以躬之瘁可畏耳維此良人良人乃賢者也王之於賢則不求之不進之至於殘忍暴虐之人則顧念之反覆之同惡相濟如以水投水故其任用之間無非小人惟上之所喜者皆殘忍之徒故民之貪亂者安為荼毒之行以希合上意也大風有隧隧道也大風之起也必有所從來以譬王之為善為惡也亦有所從來大風之起也自於大空谷而來也王之為善也必有人以贊之為不善則自彼不順之人以助之是皆有所從來也惟良人所為皆善則王之所為無適而非善不順之人所行皆中於垢穢則王之所為無適而非不善蓋在王所者長幼卑尊皆薛居州則王誰與為不善在王所者長幼卑尊皆非薛居州則王誰與為善善惡皆有所從來也鄭氏曰大風之行有所從而來喻賢愚之所行各由其性賢者在朝則用其善道不順之人則行暗冥受性於天不可變也此言最害理審如此説則楊子善惡混之説也告子決諸東方則東流西方則西流之説也夫性本善豈有不順之人所行冥暗而乃受性於天者乎大風有隧大風之起也有自亦猶善人之敗也必有所自善人之所以敗者以貪人之任用故也類善也貪人之敗善人此王之所以為惡也則知王之性本善但以貪人敗之故耳故道聽之言則答之誦詩書之言以告之則如醉此所以見王之先入於貪人之言故詩書之言則棄之而不用也厲王既已不用其言反使我為悖逆之行而從貪人之所為也是以知芮伯之自傷不獨不見用於王又為王之所使殊可閔也是豈以芮伯為悖哉此但述王意之使為耳嗟爾朋友此又深責羣臣也嗟爾朋友豫豈不知爾行乎汝雖自恣莫汝誰何然譬飛蟲亦有弋而獲之者故芮伯告之以此所以隂覆之也吾以言隂覆汝而汝反以言來赫我夫處於昏君姦臣之朝告於君則覆為虐告於臣則臣反豫來赫其得罪於君臣之間如此幾何而免於戾乎民之罔極職涼善背鄭氏以為信不如毛氏以為薄言民之罔中由所主者薄德之人善相棄背也穆公戒其臣曰民心罔中惟爾之中則民之罔極非民之罪乃在位者之罪也為民不利如云不克言薄德之人惟在害民之事惟恐其不勝民皆化之為回僻之行則以其所主者力爭故耳民之未戾言民之未定者則以其所主者盜賊之臣為寇亂之行也我薄告之以為不可而汝乃反覆而罵我況敢大言乎是亦上文所謂反豫來赫之意也汝雖自曰此禍非我所致然我既作此歌以諫其惡矣不可欺也自古亂臣之敗國雖自欺以為無罪而欲以欺於人人其可欺乎板之詩曰我雖異事及爾同僚我即爾謀聽我囂囂此詩又曰既之隂女反豫來赫末章又曰涼曰不可覆背善詈則知厲王之世凡伯芮伯皆以此告其朋友而朋友不信乃知厲王之世非無忠信之人特不見用耳黃曰左傳文公元年秦伯引芮良夫之詩曰大風有隧至覆俾我悖則芮伯者字良夫乃畿內諸侯入為王朝卿士也其作詩本厲王之亂在於用小人故於聽任之際屢致意焉其章指當從吕伯恭其訓義少南為優但於十三十四十五章猶有未純不能不少加櫽括餘章文義不録止於兹三章述之耳一章至四章皆極言其亂也五章告以當時被禍各有望治之心六章復告以息民務農而居位食祿者不可不審擇也七章因前章息民務農之言而深嘆喪亂飢饉之可哀也八章言治亂之分蓋其君向背用舍所由異路思古而傷今也九章言君暗於上故譛毁之俗成於下自傷處斯世之難也十章明朝皆小人安其危而利其災欲諫而不敢也十一章言王棄君子而厚小人民不堪命而王不知也十二章言治亂各有所由來治由君子而亂由小人十三章言王之所以疏棄君子者小人之言先入也前章言善惡各有所由來此又言王性本善多由貪人以敗之耳道聽之言則答誦詩書之言以告之則如醉此所以見王先入於貪人之言故也厲王既以不用其良反使我為悖逆之行而從貪人之所為也十四章自此至末章皆託與公卿儕輩言以反覆諷切之也厲王之朝舉無信芮伯言者故告之曰豫豈不知而妄發哉如彼飛蟲時亦弋獲豈無一二或中者乎十五章民之所以貪亂不知止者由此涼薄善覆背之人為民所不利之事如恐不勝而力為之也民之所以邪僻者由此輩競用力而然也回遹邪僻也反覆其辭者所以深惡之也毛詩集解卷三十四
