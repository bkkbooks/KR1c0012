body:
  text: 毛詩集解詩類提要臣等謹案毛詩集解四十二卷不著編録人名氏集宋李樗黃櫄兩家詩解合為一編附以李泳所訂吕氏釋音樗字若林閩縣人嘗領鄉貢著毛詩詳解三十六卷櫄字實夫龍溪人淳熙中以舍選入對升進士兩科調南劍州教授終宣教郎著詩解二十卷總論一卷泳字深卿始末未詳與樗櫄皆閩人疑是書為建陽書肆所合編也樗為林之竒外兄見書録解題又為吕本中門人見何喬逺閩書其學問具有淵源書録解題稱其書博取諸家訓釋名物文義末用己意為論斷今觀櫄解體例亦同似乎相繼而作而稍稍補苴其罅漏不相攻擊亦不相符合如論詩序樗取蘇轍之説以為毛公作而衛宏續櫄則用王安石程子之説以為非聖人不能作所見逈為不同其學雖似少亞於樗而其説實足以相輔編是書者惟音釋取吕祖謙而訓釋之文則置讀詩記而取樗櫄殆亦以二書相續如驂有靳故不欲恭以他説歟乾隆四十五年五月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:d9cd7408baffd73efe6b28bc9d29a3bd15fbd78e39136780e8677168dd832b87
