body:
  text: 毛詩集觧卷十七宋李樗黄櫄撰下泉思治也曹人疾共公侵刻下民不得其所憂而思明王賢伯也洌音列彼下泉浸彼苞稂音郎愾苦蓋反我寤嘆念彼周京洌彼下泉浸彼苞蕭愾我寤嘆念彼京周洌彼下泉浸彼苞蓍音尸愾我寤嘆念彼京師芃芃薄工反黍苗隂雨膏古報反之四國有王邭音荀伯勞力報反之李曰晉文公時曹人疾曹公為暴虐之政剥民之肌膚刻人之骨髓而民不得其所憂而思明王賢伯也古之盛時上有明王以行其仁政而下又有方伯輔佐其君以統理諸侯諸侯方且畏懼不暇其敢以暴虐之政而虐民哉洌彼下泉爾雅曰沃泉縣出下言下出也李廵曰水泉從上溜下出此言下泉謂泉水下流也浸彼苞稂苞本也稂莠也甫田云不稂不莠陸氏草木䟽曰禾莠黍為穗而不成則嶷然謂之童粱今人謂之宿田翁或謂之守田鄭氏以稂字不從禾其字從涼風之涼鄭氏好改字以為涼蓋下文言蕭言蓍皆草木之屬遂以為非田中之草鄭氏於澤陂之詩有蒲與蕑亦改曰蓮葢以上文言荷菡萏皆是蓮類故以蕑改為蓮鄭氏好改字多如此蕭爾雅曰蕭荻郭氏曰即蒿陸氏曰即白蒿葉白莖麤斜生多者至數十莖有香氣故祭祀以脂爇之為香詩曰取蕭祭脂禮曰焫蕭求諸陽是也陸農師曰今俗謂之牛尾苞蓍者蓍草也言稂蕭蓍為下泉之所浸則稂蕭蓍皆病矣喻民為共公所侵虐則民亦病矣惟其民為上所病則愾然於寤寐之中覺而嘆息而念彼周京周京者周室所居之京師也京師者京師所治之周室也公羊曰京師者天子之居也京者何大也師者何衆也天子之居必大衆言之惟其共公以虐政殘民則民欲思京師以見古之明王也上三章言明王矣下一章言思賢伯也芃芃盛貌黍苗所以得盛者以其得隂雨以膏澤之喻四國有從王之事所以得治者由有方伯以勞來之隂雨者謂天油然作雲沛然下雨故謂之隂雨夫泉之與雨皆水也而稂蕭蓍為下泉之所浸則病黍苗得雨以潤之則芃芃而盛亦猶明王賢伯之政皆政事也而曹人為共公之所虐而民苦其虐而無所告訴若得明王賢伯則民被其澤如隂雨之膏黍苗此其所以異也郇侯爵也畢原酆郇文之昭也郇伯者郇伯為方伯也郇國今河中猗氏縣是也古者有東西二伯而每州有一伯公羊曰自陜以東周公主之自陜以西召公主之周公既卒畢公代之是為天下二伯也王制謂二百一十國以為州州有伯是九州之中有九伯也毛氏以為二伯鄭氏以為州伯觀經言郇伯其為二伯不可知也其為州伯亦不可知也鄭氏以為文王之子葢成王時東西二伯周公召公畢公主之周之郇伯不必以為文王之子安知非文王之子繼世而下也其為文王之子不可知也繼世而下亦不可知也論曰古者天子之於諸侯入其疆土地闢田野治養老尊賢俊傑在位則有慶入其疆土地荒蕪遺老失賢掊克在位則有讓天子之於諸侯如此惟恐其不能徧察故分天下為二伯又每州而置一伯則雖諸侯有侵虐之政其可得哉曹共公肆掊克而民不得其所蓋上無天子下無方伯故也惟其無明王賢伯則諸侯侵虐放恣無所不為當時雖無明天子而晉文公為方伯亦可謂賢矣左僖公二十八年晉侯圍曹亦可謂能正共公之罪矣又何必思賢伯哉蓋湯之征葛也四海之内皆曰非富天下也為匹夫匹婦復讐也湯征自葛始十一征而無敵於天下東面而征西夷怨南面而征北狄怨曰奚為後我民之望之若大旱之望雲霓也歸市者不止耕者不變誅其君而弔其民如時雨降民大悦使晉文公以共公之侵虐下民遂以伯主之威而合諸侯之師以正其罪則曹人之望也豈不如黍苗之得隂雨乎今晉文公之伐曹但以其私憾而伐之其意只報其私憾而無意於救民雖曰賢方伯與無方伯何以異此所以思之也黄曰古之盛時上有明王以行其仁政下有方伯以輔其君而推其愛民之意故諸侯不敢虐用其民而民無不得其所今周道既衰王不王矣而齊晉之伯意在於富強其國而不在於為民故國人苦曹共公之侵刻而無所告訴安得不思古之明王賢伯乎念彼周京以見其思西周之盛時也曰四國有王郇伯勞之謂天下惟無王故至此苟四國有王而賢伯述職則諸侯其敢有暴虐者哉按春秋僖公二十八年晉侯圍曹亦可謂能正共公之罪而猶思古之賢伯者葢以晉之圍曹特以報怨而示威於曹爾非所以為民也嗚呼後世遐方逺地守令恣為侵刻朝廷不知監司不問民之欲訴其寃者如訴之於天不得已而謁其所欲者如謁之於鬼神可不為之深歎哉豳七月詁訓傳第十五國風七月陳王業也周公遭變故陳后稷先公風化之所由致王業之艱難也七月流火九月授衣一之日觱音必𤼵二之日栗烈無衣無褐何以卒歳三之日于耜四之日舉趾同我婦子饁炎輒反彼南畝田畯音俊至喜七月流火九月授衣春日載陽有鳴倉庚女執懿筐遵彼㣲行爰求柔桑春日遲遲采蘩祁祁巨之反女心傷悲殆及公子同歸七月流火八月萑户官反葦韋鬼反蠶月條桑取彼斧斨七羊反以伐逺揚猗於宜反彼女桑七月鳴鶪圭覔反八月載績載𤣥載黄我朱孔陽為公子裳四月秀葽於遥反五月鳴蜩徒彫反八月其穫户郭反十月隕蘀音託一之日于貉户各反取彼狐狸力之反為公子裘二之日其同載纉武功言私其豵子公反獻豜古先反于公五月斯螽動股六月莎素和反雞振羽七月在野八月在宇九月在户十月蟋蟀入我牀下穹起弓反窒珍悉反熏吁云反鼠塞向墐音覲户嗟我婦子曰為改歳入此室處六月食鬱及薁於六反七月亨普庚反葵及菽音叔八月剥棗十月穫稻為此春酒以介眉壽七月食𤓰八月斷壺九月叔苴七餘反采荼音徒薪樗勑盡反食音似我農夫九月築場圃十月納禾稼黍稷重穋音六禾麻菽麥嗟我農夫我稼既同上入執宫功晝爾于茅宵爾索綯亟紀力反其乘屋其始播百榖二之日鑿冰沖沖直弓反三之日納于凌力證反隂四之日其蚤音早獻羔祭韭音九九月肅霜十月滌徒厯反場朋酒斯饗曰殺羔羊躋彼公堂稱彼兕觥虢彭反萬壽無疆李曰鄭氏謂今屬右扶風栒邑也杜預云豳在新平漆縣東北九域志云邠州新平縣有豳有都邑公劉后稷之曽孫也此所謂先公公劉也后稷封於邰以服事虞夏及夏之衰棄稷弗務故其子孫用失其官自竄於戎狄之間至於公劉自邰居豳修其稼穡之事勤於民業周之王業自此以興則其積累艱難皆公劉后稷之所致也風俗之所由來者葢公劉敦稼穡之事以化其民敦本去末以從其上之風化此之謂風俗之所由也漢地理志其民有先王遺風好稼穡務本業此所謂風化所由豳地公劉所居也此詩言風化所由而乃復言后稷者葢以后稷自唐虞之時為稷官公劉能修后稷之業以教化故推本而言之爾惟后稷公劉艱難積累非一日而成為後人者豈可不念之哉武王之得天下集大統未幾而沒成王以幼沖之年承前人之基緒周公當國以先王所以致王業者自任是以當國而不辭也比遭二叔流言之變以陳其志孔氏謂周公遭變故陳后稷先公風化之所由縁此致王業艱難之事先公遭難乃能勤行風化及今遭難亦欲勤修徳教所以陳此先公之事將以比序已之志縁此亦足以見周公之志此豳詩雖是言公劉之事其實周公之詩自七月以下皆周公之事而乃列於豳者孔氏曰此乃逺論豳公為諸侯之政周公陳之欲以此序已志不美王業之本不得入周召之正風又非刺美成王不得入成王之正雅周公王朝卿士不得專名一國進退既無所繫因其上陳豳公故為豳之變風蘇氏則以謂是詩則言豳公而已不及於周公故謂之豳而以周公之詩附之夫豳公之詩一國之風也周公之詩一人之事也以為皆非天子之政是故得為風而不得為雅也龜山曰豳風周公之詩也周公居攝政由已出謂之雅則人臣之事而已謂之風則周公非有國也而七月之序陳先公風化之所由故併繫之豳風凡此諸説皆以七月以下之詩不謂之變雅又不謂之周南故為此説七月之詩所言公劉之事故繫之豳風篤公劉之詩亦是言公劉之事説者必謂周公當國召康公所作非出於周公故列之雅歐陽以謂七月本義幸在者吾既得之矣其事有難知者闕之可也又曰經有其文猶有不可知者經無其事吾其可逆意而謂然乎所以治經葢能如此則不至於穿鑿破碎大義矣必欲為之説則楊龜山為勝七月流火大火房星也左傳云火星中而寒暑退見昭公三年服䖍云火大火心星也季冬十二月平旦正中在南方則大寒退季夏六月黄昬火心中大暑退葢大寒極於季冬大暑極於季夏過此則寒暑退矣哀公十二年左傳曰火伏而後蟄者畢今火猶西流司厯過也謂火下為流故曰流六月時火星中大暑退至七月乃流火而下惟火星流而下大暑退故九月授衣九月降霜之候荀子曰霜降而婦功成於是授衣其所以授衣則一之日風寒而觱𤼵二之日栗烈其寒如此故九月授衣所以為冬寒之備也一之日今之十一月也建子之月一陽生故謂之一之日二之日今之十二月二陽生故謂之二之日觱𤼵風寒也栗烈氣寒也褐者毛布賤者之服也三之日今之正月建寅之月也于耜始徃修其耒耜也四之日今之二月建卯之月也舉趾民無不舉足而耕也饁饋也説文曰餉田也田畯毛氏以為田大夫爾雅以為農夫孫炎以為農夫田官郭璞謂今之嗇夫今正月之時始修其耒耜將以為耕及四之日則舉趾而耕壯者則在田婦子幼弱者餉於南畝之中田畯既至於勸農則莫不喜樂而農事益勤矣葢農勤於稼穡安得而不喜惟田畯既至則莫不欣然而有喜也而益勤於農事而鄭氏乃以喜讀為饎饎酒食然亦不必如此説自古丁壯者以耕餉於田者惟婦子而已左氏𫝊曰郤缺耕於野其妻饁之兹是妻餉其夫也孟子云有童子以黍肉餉是子餉其父也惟九月既授衣則蠶月條桑八月載績所以為授衣之具也惟四月之日既舉趾則十月納禾稼所以為田事之成也蘇黄門以為此章陳衣食之始餘章則終之此説是也春日載陽載者則也倉庚即葛覃之詩黄鳥于飛是也陸氏䟽曰黄鳥鸝留也或謂之黄栗留幽州人謂之黄鸎一名倉庚一名黄鵹爾雅謂黄鳥一名商庚一名黄栗留一名黄鸝一名楚雀齊人謂之摶黍當椹熟時來在桑間方言曰自闗而東謂之倉庚自闗而西謂之黄鵹月令仲春之月倉庚鳴故陸農師引韓子曰以鳥鳴春以蟲鳴秋以鳥鳴春若倉庚之類其美鳴春也隂陽推移時至氣動不得不然爾故先王以是候節之至倉庚鳴之時女乃執懿筐也㣲行小徑也柔桑穉桑也蠶始食之時宜以穉桑養之此葢言七月之中大火西流暑退而寒不可以無禦寒之具故當以九月授衣葢衣服至此而卒備也故以陽盛之月倉庚之鳴桑茂而可養蠶則女子執深筐遵循小徑而行以采穉桑既得穉桑以養蠶故九月而後可以授衣也遲遲者日舒遲而暄暖也蘩爾雅曰皤蒿也孫炎曰白蒿也毛氏謂曰蒿所以生蠶孔氏曰今人猶用之陸氏曰農功有早晚蠶食有先後故言求柔桑於前以養蠶之早者采蘩葉於後以養蠶之晚者今洗蠶種尚用蒿則蘩者亦可以養蠶也祁祁毛氏曰衆多也程氏引詩祁祁如雲為衆多之貌女心傷悲毛鄭皆以為春女感陽氣悲傷而思男為有欲嫁之意至於悲傷豈是美事程氏曰女勤蠶事勞且悲也毛鄭亦有此意然女子之於蠶事勞力安得有傷悲乎惟王氏謂女子傷悲則以將嫁思離親也此説為合於人情殆及公子同歸毛氏謂豳公子躬率其民同時出同時歸其意以謂豳公之子躬率其民共適田野今則女子與豳公子同時來歸於家毛氏既以女心傷悲為女子有欲嫁之志然下文又曰與子同歸則其文不相接且民之耕於野也謂豳公子躬率其民同時出同時歸可也至於采桑之女而謂女之同時出同時歸可乎鄭氏謂女子者公之女也與公子同時而嫁故孔氏舉公羊傳説築王姬之館於羣公子之舎則以卑矣是説侯之女稱公子也以公子為公女此説為當程氏皆同此説但不當以悲傷為欲嫁也蘇氏曰古者昬禮於歳之交故女子之處者怨慕悲傷以是時思歸於公子然此詩泛言國人之女安得謂歸於公子乎葢言方春舒長女子采桑以養蠶者衆多之時則女子以是時與公子同歸而嫁故曰傷悲婦人謂嫁曰歸此章則言春日載陽又言春日遲遲者葢將言其出嫁之時又言春日也萑葦即蒹葭也初生曰蒹既成曰萑初生曰葭既成曰葦萑葦可以為曲薄也月令季春言養蠶之事云具曲植筥筐注云曲薄也即此詩所謂萑葦也筐即詩所謂懿筐也條桑落其枝而采其葉曰條桑斧斨者隋銎曰斧方銎曰斨斨即斧也惟銎孔不同爾逺者枝逺也謂其長枝去人逺也揚條揚也謂其長條揚逺也女桑爾雅曰荑桑郭璞曰今俗呼小而長條者謂之女桑逺揚非可以手而取也故可以伐而落之猗毛氏曰角而束之曰猗蘇氏曰取葉存條曰猗則猗束而采也女桑則無條不枝落也但束而采之也鶪者伯勞也左傳郯子曰昔少皥以鳥名命官伯趙氏司空伯趙鶪也杜氏注云伯趙伯勞也以冬至去以夏至來則是伯勞之鳴自夏至冬也績説文曰緝也東門之楊曰不績其麻則績者是績麻也八月絲事畢而麻事起故始績也載𤣥載黄我朱孔陽載𤣥載黄者𤣥者𤣥黒而有赤在緇緅之閒考工記鍾氏云三入為纁五入為緅七入為緇凡染絳者一入謂之縓再入謂之赬三入謂之纁朱則四入也陽者明也言其朱色鮮明也此章言七月流火將寒之候九月授衣而藏之則今歳之禦寒者既備於此則必思來歳之備也既預思來歳之備故當以陽氣之盛月桑無所不取采其枝之逺揚者則以斧斨而伐之其女桑則不可以斧斨而伐之但猗之而已則斧斨亦可以預備也伐逺揚猗女桑既備之矣故至於蠶月其用皆足蠶事可以畢爾故於七月鳴鶪之時而緝麻焉既緝其麻而又以所治之絲而染繒或為𤣥或為黄以朱色之盛而為公子之裳也言裳而不及衣但便其韻爾程氏曰為公子裳獻豜于公皆此義也民之知義如此則美俗成矣葢先王之時風俗粹美教化修明忠厚之風化及於下民故民無不知義雖勤勞於稼穡之事而不自厚則曰雨我公田遂及我私雖勞民於蠶織之事而不自有則曰我朱孔陽為公子裳取彼狐狸為公子裘雖閑於馳逐之事而不自得則曰言私其豵獻豜于公其民之愛君可謂至矣彼先王何修而得此於民哉豈非至誠慘怛之意上以是施之下以是報之乎四月秀葽毛氏曰不榮而實曰秀葽葽草也鄭氏曰夏小正四月王萯秀葽其是乎鄭氏之意則以王為大然以為未必然故曰其是乎秀葽也陳翥則以為幽秀鄭氏之説為誤許慎曰劉向説似味苦者葽也蜩爾雅曰蜩蜋蜩螗蜩舎人云皆蟬方言曰楚謂蟬為蜩宋衛謂之螗蜩陳鄭謂之蜋蜩秦晉謂之蟬是蜩蟬一物方俗異名爾陸農師曰按詩言如蜩如螗則是蜩與螗又非一物也八月其穫穫者禾可穫也嘉榖曰禾説文曰二月始生八月而熟故曰禾隕墜也蘀落也説文曰草木凡皮葉落地為蘀因舉此詩也貉爾雅曰字林貉似貍其子名貆貉之皮可以為裘也秀葽也鳴蜩也其穫也隕蘀也此四者皆是物成則將寒之候雖將寒矣而蠶事麻事無所不備恐其不足以為禦寒之具故於十一月往捕其貉而取皮以為裘又取其狐狸之皮以為公子裘也貉則庶民自以為裘也狐狸則為公子裘也孔氏曰貉是民自用為裘也禮無貉裘之文明貉裘賤故也于貉猶所謂于耜也毛氏曰于貉謂取狐狸皮也據詩但言于貉而毛氏以為取狐狸皮其説不甚明白孔氏曰于貉言往不言取狐狸言取不言往皆是往捕之而取其皮此言葢所以順經文而為毛氏訓釋其義也陸農師以謂祭表裘貉若以農師之説解毛氏則毛氏所謂取狐狸之言方為明白周官言祭表貉乃音禡釋者謂禡師祭也非取貉也則知所謂于貉往取貉而為裘也取狐狸者特取其狐狸之皮以為裘也王氏則以謂秀葽鳴蜩為穫候以隕蘀于貉為取狐狸之候此説亦非葢上章既言蠶事又言麻事故此又言一之日于貉取彼狐狸為公子裘皆是所以禦寒之具也不應於其中而間以于貉為取狐狸之候也自秀葽以至於隕蘀則物漸成十一月鳥獸氄毛故其皮可取以為裘則無事矣十二月之間君與民於是俱出田獵不忘武事以纉武功也然其田也則獵取其獸以充賔客籩豆國君之庖得獸之小者則私而有之得獸之大者則獻于公説文曰豕生三歳曰豜又曰豕一歳曰豵爾雅曰絶有力者曰麕則豜大而豵小貉則賤者之服則自以為裘狐狸之皮則取以為公子裘小獸則私有之大獸則獻于公以見民愛其上也五月斯螽動股斯螽即螽斯也或曰斯螽或曰螽斯孔氏曰文雖顚倒其實斯螽也爾雅曰蚣蝑也陸璣曰幽州謂之蝽箕即蝽􅡂蝗類也青色長角長股股鳴者也或以似蝗而小斑黒其股似瑇瑁又五月中以兩股相切作聲聞數十歩動股者謂至五月股成而奮迅之以股鳴也莎雞爾雅曰螒天雞樊光曰謂小蟲黒身赤頭一名莎雞陸璣曰莎雞如蝗而斑色毛翅數重其翅正赤色或謂之天雞六月中飛而振羽索索作聲幽州人謂之蒲錯馬氏曰一名促織紡緯陳翥曰即今紡緯也其鳴聲切切類紡緯也促織青而長䰅脚其鳴如機急織之聲今紡緯亦青如促織而小則與陸氏之説不同崔豹古今注亦曰莎雞一名紡緯謂其聲如紡緯也促織一名促機謂其鳴如急機也振羽者謂至五月羽成奮迅之以羽鳴也爾雅曰螽醜奮郭氏謂奮迅作聲斯螽莎雞皆蝗之類也故於五月而斯螽動股六月則莎雞振羽股羽始成而奮迅作聲也考工記云有以股鳴者有以翼鳴者謂之小蟲之屬以股鳴者斯螽是也以翼鳴者莎雞是也蟋蟀即所謂促織也爾雅曰蟋蟀蛬陸氏曰似蝗而小善跳正黒有光澤如漆有角翅一名蛬一名促織語曰促織鳴懶婦驚陳翥説促織則與陸氏不同宇者屋四陲也韓詩則曰宇屋霤也説文曰屋邊也户説文曰半門也葢此言蟋蟀七月則在野八月則在宇屋之下九月則在室户之内十月則入我牀下然此先言在野而後言蟋蟀則以在宇在户皆繼於莎雞之下似與上章之文其文勢為不順故程氏謂莎雞斯螽蟋蟀説者雖為三物然攷詩意恐是一物隨時異名則程氏之意則以為一物五月則為斯螽六月則為莎雞十月則為蟋蟀其説固為明白然此三蟲皆螽之類自昔説者皆以為三物未敢以為必然也夫日往月來寒往暑來相推而迭運則其來有漸故建已之月陽氣始盛而一隂生一隂生則積而為大冬建子之月隂氣始盛而一陽生一陽生則積而為大夏無非其來有漸也謂此三物自五月至於十月以言隂之寖長言其有漸非卒然而至也彼其寒暑卒然而來俄然而去則民之疾苦者多矣蟋蟀始而在野既而在宇又既而在户皆是自外而之内自逺而之近既入於牀下則近於人而寒至矣惟其有漸故此三蟲亦隨時而變也穹窮也窒塞也窮塞其室而熏鼠令出也向者牖也毛氏以為北向牖庶人蓽户葢以荆竹為之也墐者塗也言至於十月蟋蟀入我牀下則大寒矣穹窒熏鼠塞其北向之牖墐塗其户使寒氣不得以襲人於是嗟嘆而告其婦子曰我所以為此為將改歳之故當入此室而處也穹窒熏鼠皆十月之事也而曰改歳者陽以十月始生故以十月為始歳也月令孟冬之月命有司曰天氣上騰地氣下降天地閉塞而成冬則以十月為塞向墐户之候也鬱毛氏曰棣屬也孔氏曰是棠棣之類薁蘡薁也晉宫閣名曰華林園中有車下李三百一十四株薁李一株車下李即鬱薁李即薁二者相類而同時熟故言鬱薁也草木䟽云鬱一名雀李一名車下李陸氏曰裳棣薁李也一名雀梅亦曰車下李其花或赤或白六月中熟大如李子可食葵爾雅曰蔠葵蘩露注曰承露也大莖小葉花紫黄色可茹公儀為楚相所拔者即此是也剥者擊也棗須就樹擊之稻説文曰稌也穫之以釀酒也春酒毛氏曰凍醪也眉壽豪眉也人年老必有豪眉秀出者故謂之眉壽六月則采鬱及薁而食七月則亨葵及菽八月則剥棗十月則穫稻所以釀酒以介其眉壽也鄭氏謂以助其養老之具此特言可以助養也非助老之具也王氏謂養氣體焉助之也此説是也壺瓠也古今注曰壺蘆瓠之無柄也陸農師曰似瓠而員曰壺蘆壺性蔓生蔓斬之故曰斷壺苴記注曰麻之有實者也叔苴謂拾此麻實以供食也荼苦菜也陸氏曰苦菜生山田及澤中得霜則甜而美樗者不材之木可以為薪言此自七月食𤓰以下非所以助養但可以食農夫七月食𤓰以下食其農夫六月食鬱及薁以下助其眉壽鄭氏但以十月為養老此非也九月築場圃春夏則為圃秋冬則為場周官載師云以場圃任園地注云圃樹果蓏之屬方未為場之時則樹果蓏季秋則為場也其所以為場者謂十月納禾稼入於倉也説文曰禾之秀實者為稼莖節為禾一曰在野曰稼黍禾屬而黏者也稷粢也百榖之長郭氏曰今江東呼粟曰粢今之所謂粟米是也後熟曰重先熟曰穋麻説文曰麻即萌之緫名菽豈也嗟我農夫我稼既同上入執宫功者上言場事既畢粟既納於倉於是嗟我農夫言稼穡既積聚矣田中無事可以上宫而治其事也毛氏謂入為上出為下葢言由野入都邑故謂之上入執宫功者執宫中之事也爾雅曰堂謂之宫宫謂之室則知作宫室之事而已于者往取也如所謂于貉是也晝則取茅夜則為綯絞索之類李廵曰綯繩之絞也孔氏謂待明年蠶用非也此葢言索綯以亟其乘屋而已鄭氏以謂為急當治野廬之屋按前漢書云在野曰廬在里曰宇既是入都邑之宅上入執宫功則是野中無事遂入都邑既入都矣則不在野廬之邑晝爾于茅宵爾索綯亟其乘屋所謂執宫功也其所以執宫功之意則以非久播百榖矣始播百榖不得緩於執宫功故當時不可不勤也鄭氏以為祈來年百榖于公社也此所以謂播百榖但是播百榖非祈百榖也王氏為築場圃者以無曠土故築場於圃地此之謂地無遺利方其為圃則種果蓏之屬及其納禾稼然後為場焉豈非地無遺利乎又謂冬可以休矣而乘屋其乘屋也又亟此之謂人無遺力稼穡既同則上入執宫功之事而又晝則于茅夜則索綯以亟其乘屋非人無遺力乎前漢志曰冬事既入婦人紡績女子所得日四十五夫所謂得日四十五者葢一月有三十日民皆夜半勤於績紡則一月之中又添得十五日故曰所得日四十五惟其男子宵則索綯女子夜則紡績豈非人無遺力乎上章既言采桑采蘩萑葦斧斨又染𤣥黄之色以為公子裳取狐狸之皮以為裘其所以禦寒者備矣至此又言所以禦寒之備也二之日鑿冰沖沖三之日則納冰於凌室之中四之日則蚤用以開冰獻羔而祭韭周禮凌人正歳十有二月令斬冰三其凌禮記曰季冬之月冰方盛水澤腹堅命取而藏之左傳昭公四年古者日在北陸而藏冰西陸朝覿而出之其藏冰也深山窮谷固隂沍寒於是取之在北陸之中也北陸虚也北方之七宿虚星之中日在北陸則知是在虚室之中也季冬之月日在虚之時而鑿冰沖沖所以宣達陽氣也王氏謂和之至陽氣達也此説是也季冬隂盛之時陽氣不得𤼵泄故於深山窮谷之中而鑿其冰則陽氣得以𤼵泄而不為害也沖沖冰之至和也其蚤孔氏以為早朝不如王程之説程氏以為早用之于獻羔祭韭時夏頒冰是其後用之也王氏則以為羔也韭也必以蚤者謹時也二説皆通杜元凱注所謂獻羔祭韭始開冰室亦可以為早朝也左傳曰獻羔而啟之也禮曰春薦羔登韭乃春所薦之物惟其開冰故用之以祭於寢廟也月令仲春之月天子乃獻羔開冰先薦寢廟是也然左氏所謂西陸朝覿而出之西陸昴星也日在昴乃孟夏之月方始出冰仲春之月開冰者葢左氏言西陸朝覿而出之乃周禮夏頒冰也仲春之月其冰釋是以開之以達陽正陽用事故也季夏則頒之陽氣畢出故也四之日開冰以祭寢廟則始用於公矣及孟夏則凡大夫賔客祭祀於是乎兼用之既藏冰以納於凌室又開冰以祭於寢廟此隂陽所以協和而疫癘所以不作也故申豐以謂七月之卒章藏冰之道也若夫春秋書無冰者三則當時隂陽不協和可知也九月肅霜此章所言則知歳事將畢而以宴樂也肅霜者收縮萬物也月令季秋之月霜始降則百工休乃命有司曰寒氣緫至民力不堪其皆入室霜降者歳晚之候滌者蕩也九月築場圃將以納禾稼既而納之囷窖則蕩滌其場惟歳事既畢則朋酒斯饗毛氏以朋酒為兩樽曰朋然與衆而聚樂飲之則豈止兩樽乎不如徐氏以為衆酒也公堂者學校也會集之所故謂之公堂兕觥罰爵也九月既肅霜十月又滌場則歳事畢皆無事矣於是合衆酒而命享遂殺羔羊以為殽羞升於公堂之上而舉此罰爵以率衆使之無犯非禮至於燕飲之中又祝豳公以萬壽無疆則民之愛君可見矣毛氏乃謂行鄉飲酒鄭氏乃以為享羣臣上文皆言農桑之事既畢而民無事閒暇然後燕飲之則安得為享羣臣若是果行鄉飲則亦無用羔羊乃知此不過合衆人而燕飲也孟子嘗曰五畆之宅樹之以桑五十者可以衣帛矣雞豚狗彘之畜無失其時七十者可以食肉矣百畆之田勿奪其時數口之家可以無飢矣謹庠序之教申之以孝悌之義頒白者不負戴於道路矣七十者衣帛食肉黎民不飢不寒然而不王者未之有也觀此七月之詩言后稷先公致王業之艱難其事皆本於農桑葢王道之始端在於此觀此詩采桑采蘩則其勤於蠶事可謂至矣蠶事既畢又於鳴鶪之候麻事興焉乂而至於染𤣥黄之色以為公子裳取狐狸之皮以為公子裘凡所以助蠶者無不致力也若三之日于耜四之日舉趾則其勤於田事可謂至矣田事既勤至於八月其穫十月納禾稼禾稼納則其田事畢矣至於食鬱及薁亨葵及菽凡所以事田者無不致力也農桑之務其勤如此九月肅霜十月納禾稼則歳事畢而民閒暇矣而又晝爾于茅宵爾索綯二之日鑿冰沖沖田獵而纉武功則終歳勤勤如此曷嘗有休息之期邪惟其無休息之期宜其民皆愁怨而無所不至今乃不以為怨方其勞也未始不愛其上載𤣥載黄為公子裳取彼狐狸為公子裘而又曰獻豜于公飲酒升堂則祝其君以萬壽無疆其愛君如此果何修而得此哉葢上之人所以使民者得其道也孟子曰以佚道使民雖勞不怨葢豳公所以使之者本於佚道故也惟其上以佚道使民則民亦盡力於農桑而無有或怨耳之所聞目之所視無非生養之事雖有非僻之心何自而入之哉故其愛君之誠所以如此其篤也雖然天下之人所以趨事赴功無有或怠者亦由上之人授民時為急也使天下之人趨事赴功非上之人以授民時為急則無由至此觀七月之詩以倉庚為采桑之候以鳴鶪為麻事之候斯螽動股莎雞振羽蟋蟀之鳴以為禦寒之候四月秀葽十月隕蘀為取皮之候上之朝夕思念無非以授民時為急上之人既勤授民時如此下之人又勤本業如此此其所以治也黄曰七月以下之詩皆周公之詩也前不得為周南之正風後不得為成王之正雅而獨繫之豳先儒之説紛紛不一或曰七月詩雖周公所作而所言者豳之風俗故繫之豳而并以周公之詩附之也然則周公作七月召公作公劉皆告成王之詩也皆言豳俗之事也七月繫之豳而公劉繫之雅先儒之説至此而又窮歐陽公謂文有難知者闕之可也李迃仲亦以為然予輒欲妄意以為之説非敢求為異説也葢考之於詩詳之於序求之於周禮而參之於召康公作公劉之意似有可信者試妄論之夫公劉之詩召康公所作也若七月之詩則豳國本有是歌而周公特陳之非周公所作也公劉特言召康公戒成王言公劉之厚於民而亦言篤公劉者六則其為康公所作也明矣七月詩特言豳國之風俗如此當耕而耕當蠶而蠶當作而作當息而息初不言后稷先公如之何而率民也其序亦直言陳王業也直言周公遭變故陳后稷先公風化之所由初不為周公作是詩也亦不為美后稷先公而戒成王也則是豳國本有是歌而周公特陳之而已如箕子之陳洪範九疇天之所以錫禹者也而箕子陳之七月之詩豳俗之所歌者也而周公陳之故周禮春官籥章氏迎寒暑而吹豳風則七月之為豳歌亦明矣且周公者周之大臣也而七月九月者夏之正也周公以周之臣而言夏之正則於理不順於辭不安予以為后稷居邰至公劉而居豳正夏之時也當夏之時而言夏之正其説益明矣先儒以一之日為用周正因謂周公以月記夏以日記周不知夫所謂日者特以一陽之復故以日言之豈謂周正乎如易之臨八月有凶復則言七日來復初豈有異義者哉此予之臆説不敢以為得詩人之意姑存之以俟深於詩者共評焉又曰周自后稷教民稼穡殖藝五榖五榖熟而人民育后稷於是而始封於邰至其曽孫公劉遷邑於邠篤前烈而厚民事徹田為糧豳居允荒而豳之風俗成矣至古公亶父復修后稷公劉之業厯十五世而文始基之十六世而武始定之其積累非一日也成王以幼沖之資當盈成之時知今日享之之易而不知前人致之之難流言一出而朝廷變周公慮其不知先王積累之勞與夫風俗之所本則將豢於燕安而不知王業之所由致惑於聲色之娛而不知民事不可緩所謂百年成之而不足一日壞之而有餘豈不甚可畏哉故周公遭變陳七月之詩使之知稼穡桑麻之事小民艱苦之情託之於吟詠之間而㣲示其感𤼵之意周公愛君憂國之心可想見矣成王安得不惻然而動心乎嘗觀此詩見后稷先公之所以治豳者即堯所以治天下也堯治天下首命羲和考星宿之軌度觀鳥獸之生息以為析因夷隩之候七月一詩以流火為授衣之漸以寒暑為出入之期倉庚者採桑之候鳴鶪者績麻之候也斯螽動股莎雞振羽蟋蟀在牀下禦寒之候也四月秀葽五月鳴蜩十月隕蘀收禾之候也其男耕其女桑其婦饁日月之變接乎其目而農桑之念動乎其中惟恐無衣褐以卒歳也無黍稷以為食也不惟為一已之計而復為公家之計不惟為今歳之計而復為來歳之計春日遲而采蘩者祁冬日促而乘屋者亟將舉趾而先于耜晝于茅而宵索綯絲事畢而麻事起麻事息而染事興至於穹窒熏鼠塞向墐户藏冰取冰之事無不詳密何斯民之勤於趨事如此哉然此猶未見其風俗之美也方田畯之至則欣欣然而喜殆及公子同歸則惻然而悲績以為己裳而染𤣥黄為公子裳貉以為己裘而狐狸以為公子之裘小而豵者私於己大而豜者獻于公亨葵剥棗穫稻為酒以為老者之奉而斷壺叔苴采荼薪樗以為農夫之食君臣之情長幼之義如此其明也禾既穫而納禾稼豈驅之而使納乎稼既同而執宫功豈驅之而使執乎民不敢忘乎君子不敢忘乎親幼不敢忘乎長歡然以相愛粲然以相接皆其風俗之自然而不自知也至於農事之既畢歳功之既成則男釋耒女下機欣然無飢寒之憂相與享朋酒殺羔羊躋公堂稱兕觥而祝其君以萬壽其拳拳愛君之心不能一日忘也噫讀七月一詩而豳之風俗若親見焉竊嘗因此而嘆後世之風俗日不如古此非獨民之罪也上之人為力役以奪民時厚賦斂以爭民利又為暴刻以督責之文書急於星火箠械酷於秋霜民於是去本而逐末舎農而趨賈野無青草室如懸罄而天下之人始忘其歡欣戴君之心而為憤怒怨上之讐王道不行而豳之風俗不復見孟子力救於戰國之世曰五畆之宅樹之以桑則五十者可以衣帛百畆之田勿奪其時八口之家可以無飢謹庠序之教申之以孝悌之義則頒白者不負戴於道路老者衣帛食肉黎民不飢不寒然而不王者未之有也觀七月之陳王業孟子之言王道其事如日其言如丹乃知孟子仁義之學眞有所自來也時君急於功利而以為王道之難行故以孟子之言為迂闊而不可用吁後世之風俗不可以復古矣予嘗於七月之詩孟子之言葢三詠而三嘆毛詩集解卷十七
