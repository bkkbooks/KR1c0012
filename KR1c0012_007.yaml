body:
  text: 毛詩集解卷七宋李樗黃櫄撰定丁佞仄之方中美衞文公也衞為狄所滅東徙渡河野處漕音曹邑齊桓公攘戎狄而封之文公徙居楚丘始建城市而營宫室得其時制百姓説音悦之國家殷富焉定之方中作于楚宫揆之以日作于楚室樹之榛仄巾反栗椅於宜反桐梓漆爰伐琴瑟升彼虚起居反矣以望楚矣望楚與堂景山與京降觀于桑卜云其吉終然允臧靈雨旣零命彼倌音官人星言夙駕説始鋭反于桑田匪直也人秉心塞淵騋音來牝三千李曰此詩言為狄所滅者閔二年衞懿公及狄人戰於滎澤而敗是也東徙渡河者衞之敗宋桓公逆諸河宵濟衞之遺民男女七百有三十人是也桓公益之以共滕之民為五千人立戴公以廬于漕邑戴公一年而卒齊桓公於是率諸侯攘夷狄而城楚丘乃鄘故城也始建城市而營宫室文公於是始建城市而使民得以交易營宫室而使民得以安處得其時而合法度此百姓所以悦之而國家殷富言非特民之富而公家亦富故詩人作詩以美之也定之方中營宫室時之星也爾雅曰營室謂之定左傳曰凡土功水昬正而栽杜氏注云謂今十月定星昬而中於是植板築而興作定之方中作于楚宫蓋定星昬中之時於是而作宫也揆之以日作于楚室者揆度其日之出入以定其東西南北也攷周禮匠人云水地以縣置槷以縣㫝以景為規識日出之景與日入之景晝參諸日中之景夜考之極星以正朝夕此所謂揆之以日也毛氏云度日出日入以知東西南視定北準極以正南北毛氏之意則以謂定星之昬正四方而中取則視之以正其南因準極以正其北作為楚丘之宫也度之以日影度日出之影與日入之影以知東西而作為楚丘之室也其説不然按詩但言得土功之時制不聞有東西南北之别也不如王氏之説曰方其庀徒而作宫則占營室之中及辨内外之位而作室則揆之以日占營室之中者序所謂得其時揆之以日景者序所謂得其制此説是也楚宫者楚丘之宫也僖二年城楚丘杜氏云楚丘衞邑王氏謂作楚宫楚室者緫門序堂室謂之宫宫之中有室鄭氏云楚宫謂宗廟楚室謂居室遂以宫室為二毛氏云室猶宫故知此説當從毛氏若從王鄭分宫室為二則是楚宫而占定星之中至於作楚室獨不然乎作于楚室揆之以日而作于楚宫獨不然乎無是理也曰宫曰室但其文異其實一也樹之榛栗椅桐梓漆爰伐琴瑟爰於也椅梓屬也樹此六木因其長大可伐以為琴瑟用也蘇氏云種木者求用於十年之後而不求近功凡此𩔖矣後漢樊仲初植桐梓人皆嗤之然十年之後人皆賴其用向之嗤者咸求假焉文公之治國正猶樊生之治家也言文公旣作宫室而先種六木而望功於數年之後其不鹵莽而求近功可知矣程氏云一章言建國之事次章方言相度土功屬文之勢然也經文首言其事然後原其功者多矣此理之必然也虚謂漕虚也謂地有故墟左傳晉侯登有莘之墟之𩔖是也堂衞邑也楚丘有堂邑也景山大山也京髙丘也衞文公將徙登漕之墟以望其楚丘審其髙下所依倚然後建國焉慎之至也亦如公劉之治豳必逝彼百泉瞻彼溥原乃陟南岡乃覯于京是也古今之營宫室建都邑必恃其山川土地之宜非直以為觀美蓋將以便民降觀于桑於是乃降觀其地勢可以植桑者也卜云其吉古者建國必卜如太王之爰契我龜周公之卜澗卜瀍是也故此卜焉終焉允臧言人謀旣善而龜筮叶從也靈雨旣零鄭氏云靈善也説文曰靈甘也當從鄭氏為善言好雨零毛氏以為零落説文以為餘雨當從毛為落言好雨旣落於是命倌人於雨止星出之時乘駕而往舍於桑田所以教民稼穡故也倌人者毛氏云主駕者説文曰小臣也匪直也人毛氏云非徒庸君然不如蘇説為長不直哉是人也蓋言不直為人如此而其心又秉之以塞實淵深不至於浮虚褊淺此所以致國家之富而有騋牝三千者言其有三千匹也馬七尺曰騋騋馬與牝有三千也蘇嘗曰春秋傳文公元年革車三十乘季年乃三百乘而此言三千者蓋言可用者三百乘而其牝者三千也此説是也雖然使文公而虚浮褊淺則不能以致富矣惟文公不求近功而特秉心塞淵此所以致殷富也觀文公之種木則知其養馬矣然周官國馬之制天子十有二閑馬六種三千四百五十六匹邦國六閑馬四種千二百九十六匹衞之先君兼邶鄘而有之馬數過制今文公滅而復興徙而能富馬有三千似非禮制何哉蓋國人方且美其富而不以禮制責之也學詩者當以意逆志是為得之人之常情好逸而惡勞征伐之事人情之所甚憚也以民情之所甚憚者而人君驅之於鋒鏑之餘板築之間而斯民乃忘其勞忘其死者使之有其道故也太王之居邠也狄人侵之至于岐下聿來胥宇至于百堵皆興衞文公之東徙渡河野處漕邑乃建城市而營宫室皆當斯民離散之餘乃以土功而勞之宜斯民之不勝其怨矣太王文公為之民乃悦而從之者由太王文公使之有道故也蓋文公所以使民者非直為觀美也蓋將以道使其民也此民所以悦之如其不然則民將盻然疾視其長上其何以堪之耶嗚呼章臺之土未乾而楚宫之禍已至阿房之工未畢而秦室之亡已兆後之人君可不戒哉黃曰文公當亂亡之餘救死扶傷之不暇而乃遽有宫室之營若不足美者而衞人作詩以美之何哉太王方避狄遷岐之際而有百堵皆興之作宣王當勞來還定之餘而有考室考牧之詩蓋惟其有得斯民之情則雖勞而不怨況其所以營宫室者非為己也乃為民也得其時而不妨民得其制而不侈靡則民安得而不悦國安得而不富乎定之方中營宫室時星也左傳曰凡土功水昬正而栽杜氏注謂今十月定星昬而中於是植板築而興作今文公以定星方中之候而始有宫室之營可謂得其時矣豈若春築臺夏築臺之違農時歟揆之以日蓋古者建國必參之日影以正朝夕以辨内外之位此所謂得其時制也楚宫楚室説者以宫為宗廟室為室家古者將營宫室宗廟為先宫室為後予以為詩之辭特互辭成章初不若是之拘也樹之榛栗椅桐梓漆爰伐琴瑟文公於其事之小者尤為之備則其大者可知也升彼虚矣云云此如公劉治豳必逝彼百泉瞻彼溥原乃陟南岡乃覯于京其建國之不苟者求以便民也而豈直為觀美哉旣察其地可為桑麻而又卜之吉矣文公猶以為未也又當天雨甘澤之時而教民為稼穡之事其所以慮民者何其逺也匪直也人蓋詩人言而形容不能盡謂不直其為人也如此而其所以秉心者又誠實而無偽淵深而不淺所以能治國家富庶之盛而有騋牝三千之多夫馬之多寡何與於心而詩人以為秉心之效蓋天下之事未有不自吾心之所發者魯僖公思無邪而思馬斯徂衞文公秉心塞淵而騋牝三千其小者如此況其大者乎諸家疑騋牝三千為衞國之過制予以為詩人之辭不可言語求曰三千者特言其多耳誰謂爾無羊三百維羣宣王之時羊果三百而已乎按左氏言文公元年革車三十乘季年乃三百乘左氏實書其實而詩人形容其美學者當以意逆志而不以文害辭則得之矣蝃丁訃反蝀都動反止奔也衞文公能以道化其民淫奔之恥國人不齒也蝃蝀在東莫之敢指女子有行逺于萬反父母兄弟朝隮子西反于西崇朝其雨女子有行逺兄弟父母乃如之人也懷昬姻也大無信也不知命也李曰止奔者言能止當時淫奔之風也衞之淫風可謂甚矣上自公室下至庶民莫不弃禮踰法以為鳥獸之行一旦文公能以道化其民而民知止於禮義其有淫奔之風者國人皆不齒也淫奔之恥者言淫奔為可恥此國人所以不與之齒列也蝃蝀在東莫之敢指毛氏曰夫婦過禮則虹氣盛君子見戒而懼諱之莫之敢指也毛意謂虹縁當時夫婦過禮而見此説不然程氏蝃蝀乃隂陽氣之交映日而見故朝西而暮東在東者隂氣就交於陽也猶易云自我西郊夫陽唱而隂和男行而女隨乃理之正今隂來交陽人所醜惡故莫敢指之朝隮于西者乃陽方之氣來交於隂則理之順故和而為雨程氏以上章一句為隂陽之逆下章言隂陽之和據詩人言不應如此分别諸家之説皆如此故不可從蓋虹者朝陽射之則在西言早時日在東故虹在西夕陽射之則在東言夕時日在西故虹在東隮周禮注云隮虹也淮南子曰天二氣為虹文中子曰至治之世虹霓不見此蓋言虹為淫氣也莫之敢指者以譬夫人淫奔之行國人皆不指視之也崇朝終朝也亦言虹霓之見於西正崇朝其雨之時詩人大槩以虹霓而譬淫奔惡之之甚也女子有行程氏云女子之義從於人也必待父母之命兄弟之議媒妁之言男先下之然後從焉奈何女之所行皆不由命而奔也其説未然據詩言女子有行逺父母兄弟考之泉水竹竿皆是此意不應竹竿泉水乃有適人之道於此乃作違背父母兄弟之命鄭氏云行道也女子生而有適人之道何憂於不嫁而為淫奔之過乎此説是也之人是人也如是淫奔之人懷思昬姻之事遂至於大無信也程氏曰女子以不自失為信所謂貞信之教是也違背父母可謂無信矣毛氏云女不待命也王氏以為女不知命據詩人以為不知命其説不然人苟知事之有命也則不義安得而待之矣王氏曰男女之欲性也有命焉君子不謂之性也今也從性所欲而不知命有所制此之謂不知命三説皆是論語曰道之以政齊之以刑民免而無恥道之以徳齊之以禮有恥且格夫刑政與徳禮所以異者在乎恥與不恥之間耳恥之於人大矣古之為治者先勵廉恥則天下之人皆畏清議而不敢為非清議之所與榮於華衮之襃清議之所貶辱於市朝之撻如此則不待常刑而民自從化矣苟不真知廉恥所尚則民不知恥雖有刀鋸驅之於前亦不肯從也衞之俗不知命甚矣如桑中之詩曰政散民流而不可止是豈真不可止哉不得其道也桑中不能止者不能勵廉恥故也文公之以道化民者蓋勵廉恥以率之故序所以稱其能以道化其民也黄曰衞國之亂久矣不知其惡而今也知其可恥人莫貴於有恥心有恥且格則不復為可恥之事矣君子以是知天理之終不可泯没而風化之未始無所自來也文公乗歴世殘敗之後而能務財訓農通商惠工敬教勸學授方任能以道化其民亦知不善之為可恥而淫奔之為可止也使人有畏心不若使人有恥心若文公者可謂賢哉相息亮反䑕刺無禮也衞文公能正其羣臣而刺在位不承先君之化無禮儀也相䑕有皮人而無儀人而無儀不死何為相䑕有齒人而無止人而無止不死何俟相䑕有體人而無禮人而無禮胡不遄市專反死李曰相䑕刺無禮者言衞之羣臣不承先公之化無禮儀也及文公之時正其羣臣而以在位之無禮儀者為可刺惟其以無禮儀者為可刺故人能知其禮儀而自别於無禮儀者觀文公能以道化其民故人知以淫奔為恥今又能正其羣臣使人知有禮儀蓋風俗之本也相䑕有皮云云毛氏云相者視也説文曰相者省視也言視是䑕之為䑕猶有皮有齒有體而人之為人無禮儀是䑕之不如也鄭氏則以謂䑕有皮雖處髙顯之處偷食苟得不知廉恥亦與人無威儀者同諸家之説皆以䑕有皮無禮蘇氏以視䑕之所以為䑕者豈以其無皮故耶亦有皮無禮耳惟歐陽之説以言鼠猶有皮毛以成其體而人反無威儀容止自飭其身曽䑕之不如也人而不如䑕則何不疾死耳此甚疾之之辭也王氏之説亦然但不合三章分别之言皮以被其外齒以養其内體者内外之所以立此則鑿也凡此三章例皆言何不疾死也攷之左傳越椒執幣傲叔仲惠伯曰是必滅若敖氏之宗衞侯享苦成叔苦成叔傲寗子曰苦成叔家其亡乎郤錡乞師於魯將事不敬孟獻子曰郤氏其亡乎左氏多載不敬之事皆言必死豈皆死哉然自古不敬者多矣蓋言其有必死之道也簡子曰人無禮則不生記亦曰禮者體也一體不備不足以謂之成人自其形而觀之則形體不備謂之不成人可也自其成體之本而觀之則有人之形而無人之道謂之不成人可也莊子有言曰闉跂支離無脤説衞靈公而視全人其脰肩肩甕盎大癭説齊桓公而視全人其脰肩肩知此則知無禮者亦不可謂之成人也黃曰相䑕一篇説者皆未得其㫖予以為詩人非謂䑕有皮有齒有體而人之不如鼠也蓋以為貪冒苟得𧖟食於民而不知禮儀如䑕之徒有皮有齒有體而無禮儀也干旄音毛美好呼報反善也衞文公臣子多好善賢者樂告以善道也孑孑居熱反干旄在浚蘇俊反之郊素絲紕符至反之良馬四之彼姝赤朱反者子何以卑必寐反之孑孑干旟在浚之都素絲組音祖之良馬五之彼姝者子何以予音與之孑孑干旌在浚之城素絲祝之良馬六之彼姝者子何以告之李曰言衞文公之臣子多好善以干旄而就見賢者於浚之郊浚之都浚之城而賢者荅其意莫不樂告以善道也孑孑干旄毛氏云注毛於干首蓋干與竹竿字通用家語曰干旄之忠告至矣竹竿之字從竹從干則是以干與竹竿字通用也鄭氏以干旄為卿大夫所建旟為州長所建遂以首章為卿大夫次章為州長好賢王氏云卿建旃士建物卿士設旄旟則鄉黨之士所建旌則士之所未命而無物者建之然攷之九旗皆注毛於干首亦不必如是之分别也案爾雅載旄於干頭注旄首曰旌則旄旌一也安得為卿大夫則建之士則不建之傳曰鳥隼曰旟是畫鳥之象於其旟鄭氏謂建旟為州長之屬非卿大夫所建然則旟者將兵所建夫何不可其卿大夫亦建之不必指州長也蘇黃門曰古者招庶人以旃士以旂大夫以旌干旄以招之也據其説只依孟子曰招士以旌庶人以旃蓋孟子所云者人君之好賢此則卿大夫之好賢蘇氏之説非也在浚之郊在浚之都城毛氏謂邑外為郊下邑曰都其説非也曰在郊在都在城以言其賢者之所在故以干旄旟干旌而就見之也素絲紕之素絲組之素絲祝之良馬四之良馬五之良馬六之毛氏云紕所以織組也緫紕於此而成文於彼其意以素絲紕組之法御四馬蓋毛氏之意多如此如簡兮執轡如組亦取其御衆其説非也所謂素絲紕之者束帛以贈之而已組之祝之者組以素絲而成組也祝織也鄭氏以祝當作屬二説皆通所謂四之五之六之者鄭氏謂所見之數其説非也四之者始見則以四馬與之中見又以五馬與之終見又以六馬與之言其禮意有加而無己彼姝者子何以予之姝者美貌也言賢者之美貌也毛氏訓姝為順鄭氏以卿大夫有忠順之徳又從以善道與之云心誠愛厚之至非也此蓋言卿大夫以禮而見賢者在賢者當何以告之耶告之以善道而已蓋禮恭然後可與言道之方辭順然後可與言道之妙色從然後可與言道之致今卿大夫禮恭辭順色從矣宜賢者樂告以善道也蓋好賢者非特君好之而為臣者亦當然如子游為武城宰子曰汝得人焉爾乎曰有澹臺滅明者魯用樂正子為政孟子聞之喜而不寐曰其為人也好善則其為臣亦不可不好賢樂善也雖然賢不苟就王公不致敬盡禮則不足以致之如先主之欲見孔明必三顧焉使其不然則孔明髙臥草廬而不肯就也孟子之於齊王王使人來曰寡人有寒疾不可以風朝將視朝不識寡人得見否乎孟子曰有采薪之憂不能造朝明日出弔於東郭氏然則若孟子者欲急於得君矣今也王不就見則不往焉視其出晝猶待三宿蓋賢者之自重如此旣卿大夫以見賢者為急則賢者亦將輕千里而來樂告以善道矣豈特在浚之郊乎黃曰簫韶奏而鳯皇儀干羽舞而有苗格髙宗思而傅説夢成王悟而天反風天下之理未嘗不相為感通也舍己從人如舜則黎獻共為帝臣善養老如文王則伯夷太公有盍歸乎來之歎人苟有好善之心則賢者將輕千里而來苟訑訑之聲音顔色距人於千里之外則賢者將望望而去之衞文公臣子多好善則盡禮以待賢干旄旌旟即招士以旌之意也素絲組紕即實其幣帛筐篚之意也良馬四五六即錫馬蕃庶之意也禮旣盡矣則賢安得不樂告之以善道乎曰何以畀之非無以畀之也何以予之非無以與之也何以告之非無以告之也是以惟恐其無以報之耳齊王不肯就見孟子則孟子有所不屑先主三顧孔明之廬則孔明樂為之用蓋尊徳樂道之心不如是則不足與有為也載馳許穆夫人作也閔其宗國顛覆自傷不能救也衞懿公為狄人所滅國人分散露於漕邑許穆夫人閔衞之亡傷許之小力不能救思歸唁音彦其兄又義不得故賦是詩也載馳載驅歸唁衞侯驅馬悠悠言至於漕大夫跋蒲末反渉我心則憂旣不我嘉不能旋反視爾不臧我思不逺旣不我嘉不能旋濟視爾不臧我思不閟悲位反陟彼阿丘言采其蝱音盲女子善懷亦各有行許人尤之衆稺直吏反且狂我行其野芃芃薄紅反其麥控苦貢反于大邦誰因誰極大夫君子無我有尤百爾所思不如我所之李曰許穆夫人衞之女也衞懿公為狄人所滅國人分散故立戴公暴露而舍於漕邑宗國敗滅君民播遷是以許穆夫人閔念衞國之亡傷已許國之小而力弱不能救故且欲歸國而唁其兄但在禮諸侯夫人父母終惟得使大夫問於兄弟有義不得歸是以許人尤之故賦是詩以見志也載馳載驅歸唁衞侯唁者弔生曰唁左傳昭公二十五年公孫于齊次于陽州齊侯唁公於野井榖梁弔失國曰唁今夫人言己欲馳驅而往歸於宗國以弔唁衞侯故願御者馳馬悠悠然而逺行我欲疾至於漕邑亦猶泉水詩云載脂載牽還車言邁皆是準擬之辭也大夫跋渉鄭以衞大夫來告難於許時蘇説謂大夫許大夫之弔衞者也草行曰跋水行曰渉夫人將歸親唁其兄雖大夫之往而不足以解憂也旣不我嘉夫人旣欲歸唁其兄而許大夫不聽故責之云汝許人盡不善我欲歸唁其兄然不能旋反我心中之思使不得歸也旣不得去而又責之言我視汝許大夫不施善道以救衞由此故我思不逺於衞常欲歸唁之不能旋濟者言歸衞必濟水也不閟者言我思常在目前也王氏云我思之歸於道為不閟不閟者言於道通也非也陟彼阿丘言采其蝱蝱貝母也陸璣注云今藥草阿丘者偏髙曰阿丘王氏曰陟偏髙之丘以采蝱故也采蝱者將以除結懣之疾譬之欲歸唁非平夷之行也亦將以解腹心之至憂故也此説為善女子善懷亦各有行言女子之懷善矣皆可以行也然許人不許歸故斥之以為衆稺且狂狂者言衆皆不更事之人故以我為尤也芃芃其麥言思歸行衞之野見其麥之有實此説與泉水言毖彼泉水亦流于淇孌彼諸姬聊與之謀皆是相望之辭也大夫君子無我有尤者言無以我為過也百爾所思不如我所之者蘇氏曰雖竭爾思慮以為我謀衞不如使我一往親見之也然夫人卒不往者知其非禮而能自克故也論曰此載馳之詩憂思如黍離自克如泉水然而以泉水較之其事又有緩急泉水之詩無故而思歸此則宗國顛覆危亡乃人情之至痛而夫人乃終不得歸寜者其憂思亦甚矣觀其詩辭意曲折則可知其情矣許人尤之正禮所當然也夫人責之以衆稺且狂豈禮所當然哉蓋思歸之急云耳然終以自克而不得以歸寜者當觀其意之如何不可以辭害志也黄曰左傳事見李講戴公與許穆公夫人俱出於宣姜宣姜瀆亂人倫敗壞風俗不及數年衞國為狄人所滅君臣播遷幾不能以自存易曰履霜堅冰至衞國之亡非一朝一夕之故其所由來者漸矣學者觀詩不必至載馳而後知衞之亡觀雄雉新臺之詩而知衞之亡非一日也載馳之夫人其憂思如泉水之衞女然泉水之所憂者不若載馳之深也泉水衞女之思思而能以禮載馳夫人之思思而能以義此聖人所以深取之歟衞淇奥詁訓傳第五國風淇奥於六反美武公之徳也有文章又能聽其規諫以禮自防故能入相于周美而作是詩也瞻彼淇奥緑竹猗猗於宜反有匪君子如切如磋七何反如琢如磨瑟兮僩遐板反兮赫兮咺況晚反兮有匪君子終不可諼況元反兮瞻彼淇奥緑竹青青子丁反有匪君子充耳琇瑩㑹古外反弁皮變反如星瑟兮僴兮赫兮咺兮有匪君子終不可諼兮瞻彼淇奥緑竹如簀音責有匪君子如金如錫如圭如璧寛兮綽兮猗於綺反重較兮善戲謔兮不為虐兮李曰有文章即詩所謂有匪君子是也又能聽其規諫者蓋規正圎之器也箴誨之辭謂之規者以其能正君也孔子曰如有周公之才之美使驕且吝其餘不足觀也已夫以有周公之才固美矣使其有驕吝之心則不足觀矣惟其有才而無驕吝之心然後為可觀也今武公旣有文章又能聽其規諫以禮自防閑而不踰此其所以為賢也然詩之序言又能聽其規諫其義固無害攷之於詩本無是句豈詩人以切磋琢磨為據故云歟瞻彼淇奥淇衞水也奥隈也厓内為隈淇奥者淇水之曲也淇水出衞州共城北山東至黎陽而入河左傳昭公二年韓宣子自齊聘於衞衞侯享之北宫文子賦淇澳其字從水從奥則知從水之奥與此詩淇奥字通用緑字毛氏以為王芻也竹萹竹也陸氏以為二草名與終朝采緑之緑同非言其色也毛氏之説本於爾雅予竊以為不然傳曰淇奥箘輅又曰淇水之竹前漢武帝下淇園之竹以為楗寇恂伐淇奥之竹以為矢則是淇水之有竹也明矣不必以緑竹為草王氏程氏皆以緑竹為竹蘇東坡氏有詩曰惟有長身大君子依依猶得似淇奥則知緑竹之為竹也又明矣觀此諸説則是瞻彼淇水之旁有此緑竹猗猗然美盛也程氏云淇奥之地潤澤膏沃而生緑竹竹生物之美者興徳美内充而文章威儀外著其説為善鄭氏曰武公質美徳盛有康叔之餘烈其意謂緑竹之所以美盛者由得淇水潤澤之也武公之所以徳盛者由得康叔之餘烈也以淇水比康叔詩中本無此意王氏則謂瞻彼淇奥為徳之清潤深閟緑竹猗猗為竹之虚節清和亦不必如此分别有匪君子如切如磋如琢如磨此言有諸中者必形諸外之意匪文章貌論語所謂斐然成章之斐字通用禮記大學亦舉此詩云有斐君子其字亦用論語斐字切磋琢磨爾雅曰治骨曰切治象曰磋治玉曰琢治石曰磨是也切磋琢磨者大學曰如切如磋道學也如琢如磨自修也又其曰切磋琢磨者蓋言武公有文章如切磋琢磨之成器可愛可重也瑟兮僩兮者瑟矜莊貌僩韓詩以為美説文曰武也毛氏曰寛大也荀子曰陋者俄且僩是僩則為寛大之文赫兮咺兮者言威儀容止宣著也諼忘也蓋言淇水之潤澤故生緑竹猶武公所積者厚故其發見於外者斐然如切如磋如琢如磨之成器可愛可重瑟兮僩兮赫兮咺兮其見於外者如此故民愛之不忘也上章言猗猗二章言青青下章言簀者盛也程氏曰猗猗言其態青青言其色如簀言其盛宻比為簀此説是也王氏則以緑竹猗猗者言其少長未剛之時青青為方剛之時如簀為盛之至此乃曲説也毛云以為青青茂盛貌則其字為菁字程氏則只作青字讀充耳瑱也充耳以琇瑩為之琇瑩美石也説者謂琇石之似玉者周禮弁師云王之皮弁㑹五采玉璂又曰諸侯及孤卿大夫之皮弁各以其等為之注云皮弁則侯伯璂飾七子男璂飾五玉亦三采正此㑹弁是也如星言其文之如星也其曰充耳琇瑩以言武公有其徳而稱此服如金如錫如圭如璧言其成徳之貌夫盛徳之至有剛有柔而其化無方或銳或圎而其成不易其化無方則所以為道也其成不易則所以為義也此蓋王氏隨字生義隨句生意非詩人之本意寛言能容衆也綽緩也言其有寛容之徳也重較大車言其多容而任重此皆非也戲謔者武公樂易而不至於過也雖然戲言戲行非君子之所貴而詩人乃以為美之者昔孔子之武城聞弦歌之聲夫子莞爾而笑曰割雞焉用牛刀子游對曰昔者偃也聞諸夫子曰君子學道則愛人小人學道則易使也子曰偃之言是也前言戲之耳雖夫子猶不免於戲孔子之所謂戲者非世俗之所謂戲也其意將以試子游之心雖戲不以為過也武公之所謂戲謔而不至於虐者其亦孔子之所謂戲歟論曰有諸中者必形諸外玉在山而木潤珠生淵而崖不枯此亦理之必然也小人不善無其内而强其外見君子厭然掩其不善而著其善人之視己如見其肺肝外之不可强也如此惟君子和順積中英華發外或見於言辭或見於顔色或見於容止皆粲然可觀豈有君子徒事其外以聳動世俗之觀聽哉孟子曰仁義禮智根於心其生色也睟然見於面盎於背施於四體四體不言而喻其内外之相應也如此今武公之德如此其發見於外者皆不可掩想當時見之者鄙吝之心消姦雄之膽喪此所謂道盛徳至善民之不能忘也黃曰有至足之徳者必有自足之心此人之情也然自足之心一萌則徳不足以為徳矣孔子以為如有周公之才之美使驕且吝其餘不足觀今武公旣有文章又能聽其規諫而以禮自防在武公之徳則充然而有餘在武公之心則歉然而不足詩人因其入相于周而樂於稱頌其美故託淇奥之詩以為喻云爾雅曰河隅謂之奥淇奥衞地也猶周南以汝墳興陳以宛丘名篇也詩人見淇水之隅有緑竹猗猗然茂盛以興武公之徳和順積中而英華外著有不可掩者故曰有匪君子匪文章貌論語所謂斐然成章與此同用禮記舉有斐君子亦以匪為斐豈非通用歟如切如磋禮記以為道學如琢如磨則以為自修要之言其徳之愈足而武公之心愈不自足又從而日新日日新又日新如切磋琢磨之不能自巳也惟其不能自巳故盛徳發見於容貌而有寛厚温粹之美斯民見之自有不能忘者曰充耳琇瑩㑹弁如星以見其佩服之美而人樂之猗重較兮以見其乗車之安而人愛之善戲謔兮以見武公之盛徳雖戲謔之間亦有妙理存焉而人不以為虐也孔子以割雞焉用牛刀之語戲子游聖人之所謂戲者亦如詩人之形容武公者歟大抵人情之惡是人也雖正其言辭而人有所不信人情之善是人也則雖戲且謔而人亦以為善衞人愛武公之深而形容之不能盡曰善戲謔兮以見其樂之之至而亦無惡於戲謔也觀小雅賔之初筵之詩見武公真中庸大學至誠之君子其言温厚誠慤不欺於暗室不愧於屋漏其為人自可想見淇奥之詩不我誣矣考槃刺莊公也不能繼先公之業使賢者退而窮處也考槃在澗碩人之寛獨寐寤言永矢弗諼況元反考槃在阿碩人之薖苦禾反獨寐寤歌永矢弗過古禾反考槃在陸碩人之軸獨寐寤宿永矢弗告李曰莊公不能繼先君武公之業而使賢者自退處於深山窮谷之中此其亡先君之業失先君之意可知矣左傳曰古之王者知命之不長是以並建聖哲樹之風聲分之物采著之話言為之律度以遺後嗣先君之心也成湯敷求哲人俾輔于爾後嗣人君之求賢不惟以自輔亦以為子孫長久之計為子孫者繼先君之業當思祖宗所以畀付之意必其尊徳樂道有加而無已然後可也苟為不然是棄賢者也非棄賢者也是棄祖宗之業也是故序考槃之詩者以為莊公不能繼先公之業序晨風者以為忘穆公之業也考槃鄭氏曰木偃蓋曰槃考槃在澗考成也槃樂也山夾水曰澗曲陵曰阿髙平曰陸考槃在澗在阿在陸者皆是賢者退處之地也夫富與貴是人之所同好也貧與賤是人之所同惡也雖賢者未有不惡貧賤與樂富貴也使賢者惡富貴而樂貧賤是為偽也在澗在阿在陸者皆非人之所樂而賢者獨成樂於此者蘇氏謂必有甚惡而不得已者也其説非是也惟其成樂於此故賢者處之甚安綽綽然有餘裕曽無狹隘褊淺之意故下文曰碩人之寛是也孔叢子曰吾於考槃見遯世而无悶正此之謂歟碩大也言大徳之人也寛容也薖亦寛大之貌軸毛氏曰進也攷之詁訓未有所據要之上章旣言人之寛此皆是寛大之意鄭氏又以薖為飢意以軸為病此説未之敢信獨寐寤言獨寐之間覺寤而言之獨寐寤歌者言獨寐之間覺寤而後歌也獨寐寤宿已覺而猶臥也諼忘也矢鄭氏以為誓其意以謂自誓不忘君之惡不復入君之朝不復告君以善道信如毛氏之説則是所謂碩人者乃躁急之人安得所謂碩人之寛之義哉且君臣猶父子也雖不見用可以怨望而為誓若此哉王氏亦從此説歐陽程氏楊龜山破其説要之歐陽之説又不如程氏楊氏之説為善歐陽氏曰碩人居於山澗之間不以為狹而獨言自謂不忘此樂也永矢弗過謂安然樂居澗中不復有所他之也永矢弗告者自謂其樂不可以妄語於人也程氏楊氏則以永矢弗諼為自陳不能忘其君以永矢弗過為自陳其不得過君之朝以永矢弗告為自陳不得告君以善矢如臯陶矢厥謨之矢同此説是也論曰據此詩初章言永矢弗諼中章言永矢弗過卒章言永矢弗告蓋賢者退而窮處其居甚安雖知朝廷之不可復居矣而又不敢忘於君於此有以見賢者愛君也如此所謂賢者之不忘君非如魏公子牟身居江湖之上心遊魏闕之下正猶劉向所謂忠臣雖在畎畆猶不忘君惓惓之義也孟子去齊其言常曰雖然豈舍王哉王庶幾改之予日望之夫賢者之愛君其切如此豈有不得志而遽忘愛君之誠心乎黃曰按詩言子有鐘皷弗鼓弗考則所謂考槃者猶考擊其槃以自樂之也賢者雖不見用於時而擊槃以自樂澗阿之中雍容寛綽而無怨望之意真所謂遯世無悶者永矢弗諼矢如臯陶矢厥謨之矢賢者在畎畆而不敢忘君故考槃以自得而永陳其不忘君父之意又永陳其不得適君之朝又永陳其不得告君以善道此賢者愛君之誠而忠厚之至也若從毛鄭之説則是賢者一不見用而遂有怨怒之辭尚何足謂之賢乎碩人閔莊姜也莊公惑於嬖妾使驕上僭莊姜賢而不荅終以無子國人閔而憂之碩人其頎其機反衣錦褧苦迥反衣齊侯之子衞侯之妻東宫之妹邢侯之姨譚公維私手如柔荑徒奚反膚如凝脂領如蝤蠐上似修反下音齊齒如瓠犀螓音秦首蛾我波反眉巧笑倩七薦反兮美目盼匹莧反兮碩人敖敖五刀反説始銳反于農郊四牡有驕朱幩符云反鑣鑣表驕反翟茀音弗以朝直遙反大夫夙退無使君勞河水洋洋北流活活古闊反施罛音孤濊濊呼沽反鱣陟連反鮪于軌反發發補末反葭菼揭揭居謁反庶姜孽孽魚桀反庶士有朅欺列反李曰莊姜者州吁之嫡母也妾上僭夫人失位緑衣之詩是也妾旣上僭而夫人失位此莊姜雖賢所以終不見荅也碩人其頎碩大也碩人指莊姜也頎長也猗嗟所謂頎而長兮史記孔子世家所謂頎然而長也蓋言莊姜容貌之偉也衣錦褧衣襌也衣錦則加之以褧襜也鄭氏曰國君夫人翟衣而嫁今衣錦者在塗之所服也齊侯之子至譚公維私此則言莊姜親戚之貴盛也東宫太子之所居也莊姜乃齊侯太子得臣之妹邢侯之姨也邢周公之後也左傳所謂凡蔣邢茅胙祭周公之𦙍是也妻之妹曰姨莊姜乃邢侯之姨也譚公維私譚國名也後為齊所滅左氏莊十年齊侯滅譚是也姊妹之夫曰私譚公乃莊姜姊妹之夫也手如柔荑至美目盼兮言莊姜顔色之美也荑者茅之始也凝脂者言肌膚如脂膏之凝也領説文曰項也蝤蠐蝎也生於木中内外皆潔白故以比項瓠犀瓠瓣也相法曰齒如瓠者貴相也齒如瓠犀言齒如瓠犀之白也螓陸農師曰螓似蟬而小額廣而且方故曰螓首蛾眉鉤如畫故曰蛾眉倩巧笑之狀也倩美好也漢書曰陳平雖賢賴魏倩而後進注云倩者美好也盼者黒白分也碩人敖敖至翟茀以朝此言衣服之美也敖敖長貌説于農郊鄭氏謂説當作襚言莊姜始來更正衣服于衞近郊非也王氏謂說當作駕說之說先儒謂説當作襚誤矣此説是也驕壯貌幩飾也以朱飾馬鑣鑣然而盛也翟茀以朝者言夫人以翟羽飾車茀蔽也夫人乗車不欲露見設翟以自障蔽以朝者言莊姜入君之朝也程氏禮數之備至近郊而説止復整車服而後入君之朝此説是也大夫夙退無使君勞者王氏謂國人所樂得以配君也夫以莊姜容貌之飾車服之盛顔色之美宜其見荅乃不見荅此詩所以閔之也河水洋洋程氏則以因河水興人情放縱難制所以致嬖妾上僭而薄於夫人王氏之説與此相𩔖王氏曰施罟譬則莊姜鱣鮪譬則莊公葭菼則取譬未可必信也毛氏徒釋庶姜庶士之義而上下全不見義則於此章最為難曉以意度之此章乃是嫁時行道之所見者如此故因水取興洋洋盛也北流活活然而北流也罛魚罟也施之水中濊濊然也發發言其魚之長也鱣是大魚似鱏而小口在頷下長至二丈鮪大者謂之王鮪小者謂之鮛鮪揭揭又言其長也爾雅曰葭蘆菼薍郭璞則以葭蘆為别草李巡則以為一草唐孔氏曰以今語驗之乃是别草也庶姜言所從之姪娣也庶姜者言齊大夫送女來者也孽孽言其盛飾也揭揭言其壯茂也庶姜孽孽王氏則以為非一孽據莊姜所患者一州吁爾安得謂之非一孽乎此蓋言莊姜所嫁之時如此而不見荅所以為可閔也觀詩者不觀其人之衣服與其鳥獸草木之名必觀其有精意妙㫖存乎其間如碩人之詩曰衣錦褧衣但言衣服之盛而中庸舉此則曰衣錦尚絅惡其文之著也推此為慎獨之學如曰巧笑倩兮美目盼兮素以為絢兮但言其顔色之美也而孔子則曰繪事後素子夏推之以為禮後之説𩔖皆如此學者徒區區於言語之間雖誦詩三百亦何足為哉黃曰碩人之詩即緑衣之詩緑衣言嬖妾之不當僭而僭碩人言夫人之宜見荅而不見荅故此篇特盛言莊姜之美如此族系之貴如此衣服之盛如此宜為國君之配而乃至於失夫人之位此國人所以傷之也雖然古人之觀詩以意逆志而不泥於章句之末則此詩雖為美莊姜而作未始不為學者之戒也如衣錦褧衣之句皆言莊姜衣服之盛而中庸則曰衣錦尚絅惡其文之著也推此以為謹獨之學如巧笑倩兮美目盼兮素以為絢兮特言莊姜容貌之美而孔子則曰繪事後素子夏推之以為禮之後詩之為詩豈可於言語文字間而有得哉學者當以意悟之毛詩集解卷七
