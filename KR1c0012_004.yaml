body:
  text: 毛詩集解卷四宋李樗黃櫄撰何彼襛如容反矣美王姬也雖則王姬亦下嫁於諸侯車服不繫其夫下王后一等猶執婦道以成肅雍之德也何彼襛矣唐棣徒帝反之華曷不肅雍王姬之車尺奢反何彼襛矣華如桃李平王之孫齊侯之子其釣維何維絲伊緡齊侯之子平王之孫李曰王姬者王女而姬姓春秋言築王姬之館于外杜預云不稱字以王尊是也謂之王姬亦下嫁於諸侯則必非文王之女故毛氏以為武王之女也若以為武王之女則不當列之於風當列之於雅列之於風則疑又非武王之女也姑且存之雖則王姬亦下嫁於諸侯者以諸侯之女嫁於諸侯此其常也以天子之女乃下嫁於諸侯故言雖字以王姬之尊故下於王后一等而所乘之車所衣之服皆不繫其夫為尊卑焉鄭氏謂車乘厭翟勒面繢總服則褕翟是也以王姬之尊如此宜其席貴驕之勢不能安執婦道今乃能執婦道以成肅雍之德此詩人所以美之也襛毛氏以為戎戎也韓詩以襛作茙說文以為衣厚貌大抵襛是華之貌郭璞云唐棣今白栘也陸璣云唐棣郁李一名雀梅一名車下李何其容如此之盛乃唐棣之華也以譬王姬容色之美也鄭氏謂何不敬且和乎王姬往乘車也言其嫁時始乘車則已敬和不如蘇氏以為見王姬之車者皆相告曰何不敬和乎此乃王姬之車也以人之見王姬之車猶且肅雍則王姬之肅雍可知矣華如桃李平王之孫齊侯之子鄭氏謂興王姬與齊侯之子顔色俱盛然所謂華如桃李但只是喻王姬顔色之美也如上章言唐棣之華亦是專言王姬顔色之美有如桃李之華故繼之以平王之孫齊侯之子言平王之孫下嫁於齊侯之子也如下章言其釣維何維絲伊緡此則美齊侯之子故繼之曰齊侯之子平王之孫言齊侯之子娶於平王之孫也魚之所以能釣之者維以絲為繩也如王姬之貴所以娶而得之者以其有禮也平王毛氏以為文王正也文王諡之曰正各論其德所稱不一如稱文王皆曰寧王是也說者又以平王為周東遷之平王若以為東遷之平王則不當列之於二南矣古之王者其說不一如詩稱成湯曰武王靡不勝所謂武王安可以為周之武王乎書曰自成湯至于帝乙成王畏相所謂成王安可以為周之成王乎宋朝太祖皇帝曰聖祖太宗皇帝曰神宗及神宗稱神宗則太宗不復稱神宗矣此平王亦為文王也平王既非東遷之王則齊侯之子亦非齊國之子也齊一也夫以王姬生於深宮之中長於婦人之乎又安知禮果為何物哉今乃能執婦道以成肅雍之德此其所以可嘉也觀帝乙告女之辭曰無以天子之貴而驕諸侯隂之從陽女之從男天地之義也往事爾夫必以禮義觀帝乙之所以告其女之辭則知婦人多以富貴之勢驕陵夫家也堯之二女嬪于虞是行其婦道於虞舜也以堯之女天子之女也舜乃歷山之匹夫耳天子之女下嫁於歷山之匹夫又不比於王姬下嫁於諸侯矣而乃能行婦道非獨舜刑于寡妻其盛德之所致亦可以見二女之為賢者也自漢以來為公主者多以天子之𫝑陵轢夫家受其禍者十常八九至於有詔俾之尚主則牢辭固避惟唐王圭子敬直尚南平公主而公主行舅姑禮憲宗時岐陽公主下嫁於杜悰而主事舅姑以禮聞亦可謂有召南之遺風矣黃曰以王姬嫁諸侯不足為過而詩人美之何也曰以王姬之貴而能執婦道於諸侯之國此詩人所以深取而豈徒形容其下嫁於諸侯哉婦人之情狃於富貴習於驕侈𥘉不知禮義之為何物今也忘其所可恃而盡其所當執非其恭敬和順之德素蓄於中者安能如此哉觀帝乙告女之辭曰無以天子之貴而驕諸侯隂之從陽女之從男天地之義也往事爾夫必以禮義豈非以婦人之所難者有此乎婦人之車服視其夫之祿秩惟王姬則不繫其夫而下王后一等如王后之五路則以厭翟為次是王姬之車也王后之六服則以䄖翟為次是王姬之服也詩人所以樂稱王姬之車服者豈以其車服之足貴哉以其能執婦道以成肅雍之德耳何彼襛矣唐棣之華說者以為歎王姬顔色之美非也曷不肅雍王姬之車說者以為王姬方在車中有和敬之貌亦非也詩人但言王姬車服之盛如唐棣之華故見王姬之車者自有肅雍之心見王姬之車者如此則王姬之德可想而見也平王之孫齊侯之子說者疑為周衰之詩蓋考之春秋莊公九年夏書送王姬秋書築王姬之館于外冬書王姬歸于齊魯莊之九年即莊王之四年也故以平王為周平王然春秋所書王姬與齊襄公之淫僻又何足美詩自周太師之所編而後又經吾夫子之手豈若此其失倫哉商頌言武王載斾可以為周之武王乎書言成王畏相可以為周之成王乎書稱文王為寧王則平王平正之王也易稱賢諸侯為康侯則齊侯齊一之侯也李迃仲又自疑此詩若是武王之女則不當列之於風以為姑且存之豫請矢之曰婦人未嫁則從父母既嫁則從夫王姬雖武王之女而嫁諸侯之國則列之於風亦無可疑矣其釣維何維絲伊緡毛鄭以為相求以道迃仲以為相求以禮竊皆以為不然詩人但言平王之孫齊侯之子宜相為耦如以絲為綸得其所宜也噫二女之嬪于虞亦豈二女之自能爾哉有父如堯有夫如舜雖欲不賢其可得也以平正王之孫嫁齊一侯之子其肅雍之德亦有所自來騶虞鵲巢之應也鵲巢之化行人倫既正朝廷既治天下純𬒳文王之化則庶類蕃殖搜田以時仁如騶虞則王道成也彼茁則劣反者葭音加一發五豝百加反于嗟乎騶虞彼茁者蓬一發五豵子公反于嗟乎騶虞李曰應者效也鵲巢化行此其效也亦如麟趾之詩言關雎之應皆是其應效非主其應瑞也鵲巢之化行則是齊其家室故人倫既正既齊其家故推而行之於朝廷而朝廷既治正身以正朝廷正朝廷以正百官正百官以正萬民故天下純𬒳文王之化由內以及於外由近以及於逺此乃先後之序如此天下純𬒳文王之化則天下之民咸𬒳其澤矣非惟天下之民皆被其澤而草木亦皆被其澤焉故庶類蕃殖其化既及於民又及於萬物此又其序也孔氏曰鵲巢之化謂國君之化行於天下也人倫既正謂夫人均一不失其職是也朝廷既治謂以禮自防聽訟决事是也天下純𬒳文王之化謂羔羊以下也然以禮自防大夫妻之常爾何足以為朝廷既正乎要之不必如此也所謂仁如騶虞亦如所謂德如羔羊也然召南之風乃諸侯之風謂之王道成者此序之所謂先王之所以教也蓋言召南之諸侯推其仁心則可以知其王道之成矣昔魯恭為中牟令隨行阡陌坐桑下有雉過止其傍傍有童兒人曰兒何不捕之兒言雉方將雛人乃矍然而起與恭語曰所以來者欲察君之政迹耳蝗蟲不犯境此一異也化及鳥獸此二異也豎子有仁心此三異也以稚子有仁心然後可以見縣令之賢以諸侯之有仁心然後可以見先王之教也茁毛氏曰出也按說文茁草𥘉生出地貌葭毛氏曰葭蘆也顧野王曰葭葦之未秀者葦大葭也蓬毛氏以為蓬草名爾雅曰齧雕蓬薦黍蓬蒿屬也豝毛氏以為豕牝曰豝說文曰豝牝豕一曰二歲能相把拏也毛氏以為一歲曰豵鄭氏以為豕生三曰豵其說皆不同按說文謂豵生六月豚一曰一歲豵尚叢聚也說文以為豵生六月豚即毛氏所謂一嵗豵也鄭氏以為豕生三曰豵即說文謂一曰一嵗豵尚叢聚也彼茁者葭此言搜田以時也一發五豝此言庶類蕃殖也蓋搜田得其時故國君於此草方生之時而田獵也虞人翼五豝以待公之發蓋言似騶虞之有仁心也按騶虞白虎黑文尾長於軀不食生物不履生草可謂有仁心矣國君之射雖有五豝之多但一發矢焉可以見其有仁心矣故譬之騶虞歐陽公之說則按賈誼新書以謂騶者文王之囿名虞者囿之司獸也其言以謂當毛詩未出之前說者以騶虞為獸然考之於司馬相如文獸者囿騶虞之珍羣見封禪書則漢之時亦有騶虞為獸者歐陽之說又曰上文叙文王之田獵以時發矢射豝下句直歎騶虞不食生物若此乃是刺文王曽騶虞之不若竊嘗以其說為不然所謂于嗟乎騶虞蓋如麟趾于嗟麟兮蓋上文言振振公子信厚故于嗟麟兮以公子如麟也今此詩言一發五豝而後言于嗟乎騶虞以見其仁心如騶虞也若以于嗟乎騶虞為曽騶虞之不若則是于嗟麟兮亦麟之不若也劉氏云先儒行瑞應之說非矣何必以騶虞之說為囿名耶此說得之黃曰箋注之學以騶虞為義獸謂其不履生草不食生物有至仁之德鵲巢之化行而騶虞之瑞應此固漢儒之陋不足辨矣或者又謂詩人託騶虞之德以喻文王故曰仁如騶虞則只是騶虞之詩亦猶言德如羔羊好賢如緇衣之類是也賈誼新書言騶者文王之囿名虞者囿之司獸禮記射義言天子以騶虞為節樂官備也則騶虞之不為獸夫復何疑諸家又謂文王出而獵害田之獸虞人翼五豝五豵以進而文王止於一發故詩人以文王之仁而知王道之成也豫以為仁民愛物文王之心固然而又何待於射獵之時而見之哉嘗妄考之即鹿無虞惟入於林之中蓋虞官精於射獵而熟於從畋也今當葭蓬茁茂之時而田豕衆多之際為虞官者乃能有不忍之心不欲盡獵而多取五豝而一發之豈其不能獵哉不忍故也故詩人以為文王之化至於騶虞之仁則其化深矣文王之躬行始於閨門推於朝廷至極於天下所謂正家以正朝廷正朝廷以正百官正百官以正萬民是也觀召南之化自鵲巢而至羔羊自羔羊而至騶虞則化無不及也周太師編詩以騶虞繫於召南之終而序曰鵲巢之應也蓋以為關雎鵲巢王道之始而仁如騶虞則王道之成也積而至於成王之時則仁及草木而牧羊之童亦有愛物之心又豈騶虞之知仁哉噫吾觀王者之化必至於匹夫匹婦莫不純𬒳鳥獸草木莫不咸若而後為極至苟賢人君子自潔於上而民不免為小人朝廷之間揖遜知禮而民不免為盜賊則不足以語王道之成也邶柏舟詁訓𫝊第三國風柏舟言仁而不遇也衛頃音傾公之時仁人不遇小人在側泛彼柏舟亦泛其流耿耿古幸反不寐如有隱憂微我無酒以敖以遊我心匪鑒不可以茹如預反亦有兄弟不可以據薄言往訴逢彼之怒我心匪石不可轉也我心匪席不可卷也威儀棣棣不可選也憂心悄悄七小反愠于羣小覯閔既多受侮不少靜言思之寤辟避亦反有摽符小反日居月諸胡迭待結反而微心之憂矣如匪浣衣靜言思之不能奮飛李曰衛頃公貞伯之子康叔八世孫也不遇者君不受已之志也故曰仁人不遇而小人得在君側何也蓋君子小人相為消長未有君子進而能與小人共事者亦未有小人進而能與君子共事者也君子之心在於格其君小人之心在於媚其君君子之心在於憂國小人之心在於蠧國君子之心在於進賢小人之心在於妒賢其行事如氷炭之不相入此其所以不可與共事也觀論語載君子小人未有不相反者君子和而不同小人同而不和君子周而不比小人比而不周其行事之相反如此安可與共事哉故為人君者不可不察也今衛頃公不能别白邪正而仁人使之不遇而退則小人安得不羣處於朝廷之上乎此變風之所以作衛之所以衰也泛泛流貌耿耿猶警警也王氏曰柏者天下之良材也而不宜以為舟柏而以為舟亦泛其流然非柏之所宜也毛氏曰柏木所以宜為舟也一則以柏不宜為舟一則以柏宜為舟二說將安所折衷乎然觀詩之意則毛說為長柏者宜為舟也宜為舟則可以載物今乃不用則泛泛然虛流為水中物爾是雖以為舟而不能盡柏之用亦如仁者宜在髙位今乃與衆人並列於朝雖曰在朝其與在野無異君子之仕欲行其道使是君為堯舜之君使是民為堯舜之民今徒然食其祿而道不行豈仁人之本心哉此其所以警警然不寐如有隱痛之憂也鄭氏曰仁人既不遇憂在見侵害嗚呼仁人之所憂者憂國也國將危亡此仁人之所憂若以為憂在見侵害是何待仁人之淺耶憂之淺故酒與遊遨可以改憂憂之深故酒與遊遨不可以改憂微我無酒以敖以遊言我非無酒可以遨遊謂此憂不可以酒解也亦非遨遊之所能釋也我心匪鑒不可以茹毛氏謂鑒所以察形也茹度也鄭氏云鑒之察形但知方圓白黑不能度其真僞我心匪茹是鑒我於衆人之善惡外內心度知之歐陽以其說為不然則以鑒之為物納影在內凡物不擇妍醜皆納其影至於仁人不能如鑒之皆納則為羣小之所譛故下文曰我心匪石不可轉也我心匪席不可卷也石雖可轉心不可轉席雖可卷心不可卷則知鑒可以茹我心匪鑒不可茹此以見仁人之心也不能兼容善惡故為小人所譖也蕭望之張堪劉更生金敞同心輔政當時許史恭顯不以為便鄭朋華龍等欲入更生等不從遂為恭顯所譖望之等不能兼容所以致鄭朋華龍之譛則知我心匪鑒不可以茹安得不為小人之所怒哉夫道不同不相為謀既有君子小人之黨則雖親戚不可據也如王國寶乃謝安之壻范寧之甥如國寶小人則雖謝安范寧之賢亦皆譖之如韋執誼杜黃裳之壻也黃裳方引羣賢以佐中興則雖執誼亦皆逐之其道不同則雖至親亦不可以共事也以衛之仁人兄弟既入於小人之黨矣安可以為依據哉薄言往訴則適所以逢其怒以仁人訴於仁人則如水以投水以仁人之情訴於不仁則如水以投石也安得不遭其怒哉若仁人者可謂孤立無助矣我心匪石不可轉也此言其堅也我心匪席不可卷也此言其平也威儀棣棣不可選也棣富也選具數也如左氏言君臣上下父子兄弟內外各有威儀也賈誼言接君臣上下兄弟內外以事各有容止是也衛之仁人其行事未嘗變其所守使常人遇其讒譖則必失措矣安能堅過於石乎安能平過於席乎安能不失其守乎仁人之心其堅如此以見夷險不易其操也孔子曰事君盡禮人以為諂孔子事君惟盡其恭而當時之人尚指以為諂豈遂變其節也憂心悄悄愠於羣小或以為見怒於羣小或以為仁人愠於羣小家語云小人成羣斯足憂矣是仁人見怒於羣小也孟子曰憂心悄悄愠于羣小士增茲多口是仁人怒羣小之人也二說皆通閔病也言為小人所病者多矣蓋言為小人所譛也觀此可以見小人之情狀既肆其譖言已病君子而小人得志又從而侵侮之以見仁人之不幸也仁人既為小人所譖安而思之寤辟有摽言寐而拊心也摽說文曰擊也日乎月乎何迭而微也歐陽以為日居月諸胡迭而微猶言日朘月削也遂以鄭說為不然然觀十月之交詩曰彼月而食則維其常此日而食于何不臧蓋言月則微矣日未嘗微也今日月皆微以見其失常也君猶日也臣猶月也小人用事則君將失其權矣故告之曰日未嘗微今乃日月皆迭微是失其常度也惟其如此故我之愧辱如衣之不浣濯也雖然如是靜言思之不能奮飛以小人讒譖又為小人侵侮宜可以去國也然猶不能奮飛而去以此見仁人之用心也鄭氏曰不遇於君猶不忍去厚之至也此說得之孟子不遇於齊王三宿而後出晝此可以見其情也孔子曰吾於柏舟見匹夫執志之不易觀柏舟之仁人為羣小之所譖未嘗以夷險易其操雖則如此亦未肯輕去其國此以見仁人之如是也欲觀諸柏舟當觀屈原之離騷其言憂國之將亡倣徨不忍去之辭使人讀之者皆有憂戚之容知離騷則知柏舟矣黃曰君子既不為時君所用又為小人所侮則亦可以去矣而君子乃有惻然憂國不忍舍去之志鄭氏曰不遇於君而猶不忍去厚之至也此說得之孟子不遇齊王三宿而後出晝曰於豫心猶以為速王庶幾改之豫日望之屈原離騷之作言國將亡有倣徨不忍去之辭亦此志也孔子曰吾於柏舟見匹夫執志之不易緑衣衛莊姜傷己也妾上僭夫人失位而作是詩也緑兮衣兮緑衣黃裏心之憂矣曷維其已緑兮衣兮緑衣黃裳心之憂矣曷維其亡緑兮絲兮女所治兮我思古人俾無訧音尤兮絺兮綌兮淒其以風我思古人實獲我心李曰並后匹嫡大都偶國亂之本也並后為亂之本者如幽王以申后為后繼而又寵褒姒晉獻公之寵驪姬唐髙宗之寵武后皆為國家之禍如齊桓公可謂賢矣以內寵如夫人者六人雖有九合之功卒不免有五公子爭立之禍其死也尸蟲出於户外經時而殯則嫡庶之分不可不明也夫子於詩春秋皆詳著之如此詩與白華之詩隱元年書天王使宰咺來歸惠公仲子之賵僖八年書禘于太廟用致夫人皆所以正嫡庶之分也莊姜者莊公之夫人也美而無子公子州吁乃嬖人之子也妾上僣者謂公子州吁之母子也惟州吁之母上僣故莊姜之所以失位此詩之所以作也緑兮衣兮緑衣黃裏緑間色黃正色青赤黃白黑正色也緑紅碧紫驪間色也東為木木色青故青為正色木刻土土色黃並所刻為間故緑色青黃也南為火火色赤故赤為正色火刻金金色白紅色赤白為間也中央土土色黃故黃為正色土刻水水色黑故驪色黃黑為間色也白黑皆然今也以緑為衣以黃為裏則是緑色反見於外而黃色反隱於內此以見夫人失位也衣在上裳在下以間色居上以正色居下亦以見妾上僣也國之有名分如人之有首足也首反居下足反居上何以為人今嫡反在下妾反居上何以為國名分之不正則國隨之亡故曰心之憂矣曷維其己言憂國之心不能自已也曷維其亡言其憂無時而亡也黃魯直曰曷維其己言誰能已之曷維其亡亡之祥也所謂曷維其亡正是上文曷維其己之意不得以為亡之祥也名分之不正固是亡之祥觀詩之意必不如是也毛氏以謂以絲為本以緑為末絲為本者言如治絲本末不可易亦猶嫡妾尊卑之不可亂然以詩之上文觀之則其說不通矣不如王氏以為絲本白也既緑則不可復黃矣猶之皆女子也既妾則不可以復嫡王氏之說固勝於毛氏又不如黃魯直以為均是絲也既緑則不可尚黃均是女也既妾則不可復嫡謂尚黃則與上文合也蓋以女比黃緑者如序嫡妾之分如此之不明此君之罪也古人鄭氏謂制禮者不必以為制禮也言古人之能正嫡妾之分故我思古人能使人無過差之行妾之所以上僣嫡者非妾之罪國君使之然也妾之所以能知尊卑之禮亦非妾之賢乃國君使之然也絺綌所以當暑今乃當凄風之時以待寒以喻莊公所以御莊姜者非其道也思古之人能使嫡妾貴賤各得其序此所以實得我之心也黃魯直以為緑衣莊姜傷己之詩也由後世言之則必曰夫何使我至於此極也今莊姜之辭如此其心可知矣緑衣之詩但言妾上僣夫人失位以刺莊公不能正嫡妾之分而其辭意不失之迫切欲知詩之敦厚者當以刺詩觀之方其美之則未足以見其敦厚惟其刺之然亦辭不迫切故可以知其敦厚也黃曰並后匹嫡大都偶國亂之本也如幽王寵褒姒晉獻公寵驪姬唐髙宗之寵武后皆為國家之禍齊桓公內寵如夫人者六人雖以九合之功卒不免五公子爭立之禍孔子於詩於春秋著之甚詳以此為亂亡之基也漢髙帝欲立趙王如意若非張良四皓漢祚危矣故莊姜此詩亦是憂國之辭非但傷己而已且傷己之詩則當曰夫何使我至於此極也今莊姜辭不迫切而有憂國之念欲知詩人敦厚者尤當於刺詩觀之燕燕衛莊姜送歸妾也燕燕于飛差池其羽之子于歸逺送于野瞻望弗及泣涕如雨燕燕于飛頡戶結反之頏乎即反之之子于歸逺于將之瞻望弗及佇立以泣燕燕于飛下工時掌反其音之子于歸逺送于南瞻望弗及實勞我心仲氏任而鴆反只其心塞淵終溫且惠淑慎其身先君之思以朂寡人李曰衛莊公娶于齊東宮得臣之妹曰莊姜美而無子又娶于陳曰厲媯生孝伯蚤死其娣戴媯生桓公莊姜以為己子莊公死桓公立州吁殺之故其母戴媯於是歸于陳此莊姜送歸妾而作此詩以見己志也燕燕鳦也燕謂之燕燕者孔氏云古人重言之漢書童謡云燕燕尾涎涎是也差池其羽毛氏云燕之于飛必差池其羽鄭氏釋之以謂張舒其尾翼也觀左氏所載晉人徴朝于鄭鄭人使公孫僑對曰謂我敝邑邇在晉國譬諸草木吾臭味也而何敢差池見襄公二十二年詳觀左氏此義則是差池蓋有異同之論故杜元凱以為不齊也惟差池為不齊貌則差池其羽乃是羽翼不齊也言戴媯之歸國也莊姜送之相别之時故取燕之羽翼不齊以為譬故下文曰頡之頏之飛而上曰頡飛而下曰頏下上其音飛而上曰上音飛而下曰下音其飛上下其音上下者是不齊也則差池當以為不齊也將别之時亦如燕翼之不齊所以取以為喻也鄭氏以頡頏為興戴媯將歸出入前却下上其音言其感激聲有小大其說誤也王氏以謂燕方春時以其匹至成巢而生子皆是求之過也子戴媯也戴媯之歸我乃逺送于野也將毛氏以為行不如鄭氏以為送如鵲巢之詩曰百兩將之亦是送也逺送于南陳在衛之南故逺送于南也按左氏曰婦人送迎不出門見兄弟不踰閾今此莊姜送歸妾乃逺行于野者鄭氏云舒己憤盡己情讀詩者當觀其意不可苛細繳繞如法家流也己留而彼去稍稍更逺瞻望弗及故念之泣涕如雨也說文曰無聲出涕曰泣佇立以泣言久立而泣也實勞我心言思念之心勞也仲戴媯字也任毛氏以為大蓋按諸爾雅鄭氏謂以恩相親信蓋按周禮而言之當從鄭氏塞實淵深也惟其心之塞故不至於作僞惟其心之深故不至於浮淺溫和也惠順也既和且順又且善慎其身亦可謂賢矣終溫且惠言終始如一也以舜之德濬哲文明溫恭允塞所謂溫者惟舜盡之所謂塞者惟舜盡之今戴媯為婦人而其心塞淵終溫且惠亦可同於虞舜乎蓋所謂塞淵溫惠者亦如文王之稱文孔文子之稱文公叔文子之稱文雖文則同亦有上下之不同也戴媯將歸之時猶思先君不見答之故勸勉寡人寡人莊姜自稱也其歸之時猶思先君勸勉寡人可以見戴媯之溫厚也楊龜山曰州吁之暴桓公之死戴媯之去皆由夫人失位不見答於先君之故而戴媯猶以先君之思勸勉寡人可謂終溫且惠也詩之教溫柔敦厚以先君見答而能勉寡人此猶未足為敦厚也惟其不見答而能勉寡人非敦厚者能之乎黃曰王氏謂燕方春時以其匹至成巢而生子失時而去此說近之差池其羽箋注未是按左氏所載晋人徵朝于鄭鄭人使公孫僑曰謂我敝邑邇在晉國而何敢差池則是差池乃異同不齊之貌如頡頏上下皆是此類言其去國之時有回首再三不忍相别之意逺送于野古者婦人送迎不出門見兄弟不踰閾說者謂送于野者盡己情舒己憤殊不知詩人所謂至于野者不必以禮文求之若必欲泥其辭則泣涕如雨果如雨乎仲氏戴媯字也仲氏不特其心之誠實淵深而其和惠之心終始如一自謹其身其歸時猶思先君以勉寡人寡人莊姜自言也觀此詩見其與商之三仁去就更相警戒各欲其自靖自獻于先王者無異國風雖變猶有如是之婦人此所謂先王之澤未泯而康叔之餘烈猶在也日月衛莊姜傷己也遭州吁之難傷己不見答於先君以至困窮之詩也日居月諸照臨下土乃如之人兮逝不古處胡能有定寧不我顧日居月諸下土是冒乃如之人兮逝不相好胡能有定寧不我報日居月諸出自東方乃如之人兮德音無良胡能有定俾也可忘日居月諸東方自出父兮母兮畜我不卒胡能有定報我不述李曰州吁嬖人之子也有寵而好用兵公弗禁莊姜惡之見左傳隱公三年若莊姜可謂賢矣以州吁之好兵莊姜知其必亂公乃不禁而莊姜惡之莊姜可謂知所惡矣惟其惡之所以遭州吁之難也州吁肆為無禮此莊姜所以傷己也遭州吁之難傷己不見答於先君者蓋禍所由皆由不見答於先君使先君答於己則妾不得以上僣雖有州吁之暴何能為哉惟其名分不正故州吁肆為無禮而莊姜傷己之不見答於先君此日月之詩所以作也日乎月乎照臨下土言日月之代明也自古多以日比君月比夫人蓋以日昱乎晝月昱乎夜君視外治夫人視內治相須如此故言日乎月乎所以相代而照臨乎下土今也莊姜不見答於先君是不知日月代明之義也下土是冒方是照臨下土之意出自東方言日與月迭出於東方也東方自出亦是日月出東方之意始則曰照臨下土既而曰下土是冒始則曰出自東方既而曰東方自出但顚倒其辭而便於韻耳王氏則以照臨下土為日之與月相繼而生明以照臨下土下土是冒為月之明雖有時而蔽虧不足以臨照然尚與日中天而冒下土出自東方謂月雖不得中天而冒下土然尚與日代出於東方是皆妄為之說也乃如之人兮指莊公也言莊公去我而逝也毛氏以逝為逮不如蘇氏以為去言去我而逝不來其舊處也古故也逝不相好言莊公舍其舊而圖其新故舍我而逝不復相好也德音無良言所以遇於己者無善道也父兮母兮鄭氏言己尊之如父親之如母非也所謂父兮母兮指莊姜之父母也凡人窮呼天疾痛呼父母今州吁之暴而莊姜傷己則呼父母言父母飬我而不得遂其終也胡能有定言莊公之所為何能有定乎其所為無定則安然而不我顧寧不我報言己之事莊公盡其道矣在莊公安然而不報之也俾也可忘鄭氏以為使是無良可忘也其說既曲矣諸家又以為莊姜忘其莊公非也莊姜之為人母其子之暴猶且念之莊姜慈於為母豈肯忘莊公哉戴媯之歸猶曰先君之思以朂寡人戴媯不忘莊公莊姜豈忘莊公乎俾也可忘當是莊公言莊姜言使我果當忘乎是不忘而忘也報我不述言莊公報之不循理也述循也黃曰公子州吁嬖人之子也有寵而好兵公弗禁莊姜惡之若莊姜可謂賢矣及其遭州吁之難不責州吁而思莊公而自傷己厚之至也窮呼天疾痛呼父母故曰日居月諸父兮母兮思之至而傷之極也寧不我顧諸家之說皆非此特言今日之亂安能有定乎我所念者憂其無定耳尚記其不我顧之事乎俾也可忘箋注之說尤為害理諸家之說亦未為安此但言我何時而能定使我憂念之心可以少忘也若莊姜可謂可以怨矣終風衛莊姜傷己也遭州吁之暴見侮慢而不能正也終風且暴顧我則笑謔浪笑敖中心是悼終風且霾惠然肯來莫往莫來悠悠我思終風且曀不日有曀寤言不寐願言則嚔曀曀其隂虺虛鬼反虺其靁寤言不寐願言則懷李曰終日之風又且暴疾此以見州吁之暴也顧莊姜則又笑之此又莊公不能制之也柏舟之詩曰覯閔既多受侮不少小人之於君子既譛之矣又從而侮之此以見小人之情狀也州吁之於母既肆其暴慢之心又從而笑之則是州吁無人道也如此謔浪笑敖此言謔之狀也故莊姜中心是悼也霾爾雅曰風而雨土為霾孫炎曰大風揚塵土從上下也終風且曀隂而風曰曀終日之風而又且曀不見日光而又曀有者又也如春秋書十有一年孟子曰聖人有憂之是也曀曀其隂虺虺其靁終日既隂矣而又虺虺其雷虺虺雷聲也凡此或言終風且霾或言終風且曀或言曀曀其隂虺虺其雷皆是州吁之暴如此莫往莫來毛氏謂人無子道以來事己己亦不得以母道往加之不如蘇氏以為州吁往來皆不可常言惠然之時方肯來而又有都絶不來之時惟其無常如此故莊姜悠悠然而思之蓋子雖無道母之慈常自若也寤言不寐願言則嚔王肅云願以母道往加之則嚔跲而不行蘇氏以為寤而思之則不寐願往從之則有跲制而止之者然觀其文無有母道往加之文亦無有願往從之文則知詩之意但言莊姜之所願欲者跲而不行也莊姜之為母寤言不寐則欲州吁之盡子道而州吁之暴慢如此則其願欲者不行矣願言則懷王氏則以為思往而從之則跲思不往而從之則懷則是此二句為二意所謂願言則懷者亦是上文言吾之所願者今則可懷傷也衛定姜衛獻公之嫡母定公卒夫人姜氏既哭而息見太子之不哀也不內酌飲歎曰是夫也將不唯衛國之敗其必始於未亡人見左成十四年及衛獻公之奔也定姜曰余以巾櫛事先君而暴妾使余見左襄十四年則衛獻公之於母亦如州吁之於母也以衛之為國而為人子者多如此良可怪也母雖不慈子不可不孝子雖不孝母不可不慈如舜之父母或頑或嚚舜不以父母頑嚚之故而不盡其事親之道故往于田號泣于旻天可謂盡為子之道矣以州吁之為人子恣其為無禮而莊姜不以暴虐之故而悠悠我思可謂盡為母之道矣為人子者當如虞舜為人母者當如莊姜然舜之父母始雖頑嚚而終也則底豫則是舜之父母終能改過也州吁之暴而其母之賢如此而州吁曽不之省吕吉甫曰衛莊姜仁於為嫡而為嬖妾之僭慈於為母而為州吁之暴順於為婦而為莊公之不見答若莊姜可謂大不幸者也不如是不足以見莊姜之賢蓋州吁謔浪笑敖無所不至而莊姜乃中心是悼非賢能如是乎黃曰州吁雖暴莊姜之慈自若也州吁謔浪笑敖而莊姜乃中心是悼州吁莫往莫來莊姜乃悠悠我思此如象之不弟求以害舜而舜也象憂亦憂象喜亦喜何嘗以象之不敬而易其愛弟之心哉呂吉甫曰衛莊姜仁於為嫡而為嬖妾之僣慈於為母而為州吁之暴順於為婦而為莊公之不見答若莊姜者可謂大不幸矣不如是不足以見莊姜之賢擊鼓怨州吁也衛州吁用兵暴亂使公孫文仲將而平陳與宋國人怨其勇而無禮也擊鼓其鏜吐當反踴躍用兵土國城漕我獨南行從孫子仲平陳與宋不我以歸憂心有忡敇中反爰居爰處爰喪其馬于以求之于林之下死生契苦結反濶與子成說執子之手與子偕老于嗟濶兮不我活兮于嗟洵呼縣反兮不我信音伸兮李曰左氏春秋𫝊曰宋殤公之即位也公子馮出奔鄭鄭人欲納之及衛州吁立將修先君之怨於鄭而求寵於諸侯以和其民使告于宋曰君若伐鄭以除君害君為主敝邑以賦與陳蔡從則衛國之願也宋人許之於是陳蔡方睦於衛故宋公陳侯蔡人衛人伐鄭圍其東門五日而還見左隱公四年蓋州吁將兵於是役將以伐鄭必先與陳宋和而後進兵伐鄭也國人怨其勇而無禮者子貢問於孔子曰君子亦有惡乎曰有惡惡勇而無禮者蓋勇非可惡也無禮而後可惡為人下者勇而無禮則至於犯上為人上者勇而無禮則至於殘民此其所以可惡也孟子論好勇必言文王一怒而安天下之民武王亦一怒而安天下之民安天下之民而後為勇此則勇而有禮也惟其有禮故所以安民非所以殘民州吁勇而無禮虐用其民其用兵也非所以安民適所以殘民此國人所以怨之也毛氏云鏜然擊鼓聲也司馬法曰鼓聲不過閶孔氏云字雖異音實同也踴躍用兵者鄭氏云此用兵謂治兵時徒見下文云從孫子仲平陳與宋以謂治兵時其說不然據序言用兵暴亂初不言其治兵之時也而毛氏又謂使衆皆踴躍用兵其說又不然據此詩中皆載其士卒怨歎愁苦之言如是其極而謂使衆皆踴躍用兵則序安得謂國人怨之也且如士卒之言不可謂之用兵若以為使衆皆用兵則序何言州吁用兵也蓋言州吁之心安於用兵踴躍欣喜而不自勝也先王之用兵出於不得已故其興師也雖士卒樂為之用而先王之心不以為樂今州吁之用兵國人皆怨之而州吁之喜常自若也詩人以踴躍形容之可謂善著語矣兵凶器也戰危事也以言器之凶事之危而州吁且喜之則其為人可知土國城漕言國人皆執役或役土功於國者或築城郭於漕者漕衛邑也定之方中序言野處漕邑載馳言露於漕邑是也南行者南行而伐鄭也蓋役土功於國者非不勞苦而獨得處於境內今我乃從君事行役於境外其勤勞可知也彼雖在境內猶免死亡之憂我之在外死亡未可知雖欲為土國城漕之人不可得也夫州吁之暴亂內則興土功之事外則興兵伐之事想其當時之人民安室家者無幾矣民生斯時何其不幸也孫子即公孫也仲言其字也孔氏曰經序國人之辭既言從於文仲不得復言從公孫蓋欲陳其辭也平陳與宋者先平陳與宋而後伐鄭也不我以歸懼其南行不得以歸也憂心有忡毛氏曰有忡猶衝衝也爾雅曰忡忡憂貌言憂之甚也爰居爰處孔氏曰從軍之士懼不得歸言我等從軍或有死者病者有亡其馬者則於何居乎於何處乎於何喪其馬乎若我家人於後求我往於何處求之當於山林之下求之也此說是矣此蓋軍士出師皆為必敗之辭也契濶毛氏以為勤苦王氏以為離合二說不同若從王氏之說則下文殊不相貫王氏之意則以死生患難相救而又以濶為離是又有時而離也安能同其患難乎鄭氏以謂與其部伍死也生也相與處勤苦之中而王氏從其說王肅以謂衛人從軍者與其室家訣别之辭歐陽從其說蓋上章言為士卒必敗之辭此則室家相訣别之辭也蓋言生死勤苦將謂與子成相說愛之恩而又與偕老今不然此怨悵之辭也濶逺也不與生同活也而鄭氏謂軍士棄其約離散相逺故吁嗟之濶兮汝不與我相救活傷兮此說不然蓋鄭氏解上文皆以為部伍相約其失如此當從歐陽之說曰因念與子生死勤苦無所不同本期偕老今則濶别不能為生此說是也然下章則以洵為洵音以信為信音伸以謂吁嗟我心所苦如此可伸而在上者不我仲而蘇氏之說亦然其說與上下文不相貫毛氏之說曰洵逺也信極也蓋吁嗟洵兮亦如吁嗟濶兮不我信兮言其志不得伸也古人以好兵譬好色未有好色而不亡其身未有好兵而不亡其國秦始皇之用兵可謂屢得志矣然用兵不已卒至於喪其天下蓋恃其兵者不有敵國必有蕭牆之禍要之皆未免於敗亡也州吁之用兵暴亂國人怨之則其敗亡之徵己見矣宜其見殺春秋書衛人殺州吁于濮見好兵不得衆也衆仲曰州吁阻兵而安忍阻兵無衆安忍無親衆畔親離難以濟矣夫兵猶火也弗戢將自焚也夫州吁弒其君虐用其民於是乎不務令德而欲以亂成必不免矣亦見隱公四年觀擊鼓之詩則衆仲之言豈欺我哉黃曰州吁弒其君而虐用其民兵凶器也而州吁則踴躍用兵詩人以踴躍二字見其好戰喜兵之志先王之用兵出於不得已雖士卒樂為之用而先王之心有不忍為者焉今州吁內則興土役外則好兵戰詩人謂土國城漕我獨南行則見其國人皆勞而已尤甚也故憂其不得歸於室家肝腦塗原野自此章而下皆從軍者與室家訣别之辭國人之怨州吁如此所謂阻兵無衆安忍無親衆叛親離難以濟矣春秋書衛人殺州吁于濮曰衛人殺之其意可見凱風美孝子也衛之淫風流行雖有七子之母猶不能安其室故美七子能盡其孝道以慰其母心而成其志爾凱風自南吹彼棘心棘心天天母氏劬勞凱風自南吹彼棘薪母氏聖善我無令人爰有寒泉在浚音峻之下有子七人母氏勞苦睍胡顯反晥華板反黃鳥載好其音有子七人莫慰母心李曰此蓋七子之母為衛國淫風所化雖有七子之母猶不能安其室七子乃能反躬自責盡孝道以慰其母心使母得留於家而不復嫁此詩之所為作也夫善飬志者人子之職七子能盡其孝道以慰其母心而成其志此正人子當為者也爾雅曰南風謂之凱風李巡曰南風長飬萬物萬物喜樂故曰凱風凱之為言樂也棘心棘木之心也說文曰棘酸棗也大曰棗小曰棘孟子曰飬其樲棘即酸棗也夭夭少壯也如桃之夭夭是也劬勞病苦也爾雅曰劬勞勤苦也喜樂之風自彼長飬之方而來吹彼棘木之心有至於夭夭而興寬仁之母以己慈愛之情飬我七子之身故七子皆至少壯而棘木之難長者凱風吹而夭夭猶七子亦難飬慈母飬而成長我母實亦苦勞也棘薪者毛氏曰棘薪其成就者言凱風自南吹彼棘木至於成薪猶母飬七子至於成人以見其母之聖善也而七子自謂我無令善之人也聖善明智之稱不必便如聰明齊聖如聖人之聖也禮曰六德智仁聖義中和則聖善者亦仁智之通稱也在浚之下猶有寒泉而浚䝉其澤今也有子七人無益於母氏凡此皆自責之辭言己曽寒泉之不若也一云浚水出浚儀東經邶邑入濟今祥符掘井於浚之傍而得泉者實浚之滋也喻己之成人實母之生育也孔氏曰母之欲嫁者本為淫風流行但七子不可斥言其母淫故言母為劬勞而思嫁也此說得之矣睍睆好貌也言黃鳥猶有好音以樂七子無語以慰母心歎黃鳥之不若也凱風之詩灼然甚明讀之孝愛之心油然生矣母之欲嫁由衛國淫風所化不安其室非七子之罪也七子乃引咎自責蓋負罪引慝理所當然也舜之父頑母嚚非舜之罪而舜乃負罪引慝祗載見瞽瞍夔夔齊憟至於瞽瞍亦允若蓋其引咎於己乃所以求愛於其親七子乃引咎自責卒使其母之留可謂能孝矣夫孝盡事親之道惟舜能之當變風既作之時七子能負罪引慝而使其母安於其室於舜則庶幾矣可謂難能也孟子曰凱風親之過小也小辨親之過大也親之過大而不怨是愈踈也親之過小而怨是不可磯也愈踈不孝也不可磯亦不孝也自常情觀之當父母有過又當權其輕重親之過小當如凱風親之過大當如小辨若孟子者可謂深於詩矣孔子曰詩可以興可以觀可以羣可以怨然亦可以無怨吾於凱風小辨見之矣黃曰此一詩皆孝子自責之辭七子之母為衛淫風所化而不能安其室此母之過也孝子不斥母之過而誦母之劬勞負罪引慝以為七子而不能安一母曽寒泉黃鳥之不若也故為此詩以自責己而卒能感其母以不嫁此大孝飬志而序者所謂成其志也嗚呼吾觀凱風之詩而歎其有虞舜之遺風也夫父頑母嚚非舜之罪而舜負罪引慝其愛親之念皆寓於南風之歌豈非南風長飬萬物如父母之於子其恩豈可忘乎孟子曰凱風小辨詩見李講毛詩集解卷四
