body:
  text: 毛詩集解卷二十九宋李樗黃櫄撰都人士周人刺衣服無常也古者長民衣服不二從容有常以齊其民則民德歸一傷今不復見古人也彼都人士狐裘黃黃其容不改出言有章行歸于周萬民所望彼都人士臺笠緇撮彼君子女綢直如髮我不見兮我心不說彼都人士充耳琇實彼君子女謂之尹吉我不見兮我心苑結彼都人士垂帶而厲彼君子女卷髮如蠆我不見兮言從之邁匪伊垂之帶則有餘匪伊卷之髮則有旟我不見兮云何盱矣李曰言古者在上長率其民其所衣之衣未嘗變易雖居閒暇之時其衣服亦且有常上之躬行者既如此則下民化之者亦如此觀鄉黨一篇先言夫子在朝廷之儀其次又言夫子衣服如緇衣羔裘素衣麑裘黃衣狐裘至於䙝裘長短右袂絺綌之用無所不備言夫子衣服如此可謂衣服不二矣讀鄉黨一篇可以感發人之善意則知古者長民能身率之宜民德之歸一也禮記曰析言破律亂名改作執左道以亂政殺作淫聲異服竒技竒器以疑衆殺夫為淫聲異服雖曰有罪與夫析言亂名執左道者其罪固不同然皆不免於殺者使衣服不二則可以齊其民衣服既二則必惑民又焉免於殺邪如鄭之子臧好聚鷸冠楚之子玉為瓊辨玉纓春申君之珠履皆是變其衣服以二民使當古之時皆不免於戮矣今幽王之衣服無常此詩所以𤣥之也彼都人士都美也言古之士有美行其所衣之服則狐裘也而狐裘之色黃黃然論其容貌則足以稱其裘之黃也其容貌則不改出言語則有文章所行之行則有忠信此下民所望而為則效也夫狐裘黃黃則是非先王之法服不敢服出言有章則是非先王之法言不敢言行歸于周則是非先王之德行不敢行惟其如此此民之所以取法也臺笠緇撮臺所以禦暑笠所以禦雨言古之人雖有美行者以草為笠緇布為冠其衣服固有常矣而當時之婦人女子亦皆可取女有君子之行故謂之君子女綢直如髮言其性情緻密操行正直如髮之密無有隆殺也今之士則不如此此我心之所以憂也故曰我不見兮我心不說充耳琇實所以塞耳亦如淇奧之詩所謂充耳琇瑩彼君子女謂之尹吉尹氏吉氏皆王姻之舊姓如春秋書尹氏卒書尹氏立王子朝皆當時大族也左傳曰姬姞耦其子孫必蕃周之所謂尹吉如晉之所謂王謝也皆是當時有禮法之家則女有君子之行者必謂之尹吉之女也我不見兮我心苑結言不見今之士如此則心屈積而不恱苑屈也積也垂帶而厲厲帶之垂者言古者垂其帶之飾而厲然為女則曲卷其髮如蠆蟲也今不見女之如此則行何從乎匪伊垂之古之所以為衣服非強為之也皆因其自然夫帶之垂非故垂也而帶於禮自當有餘非故卷其髮也髮於禮自當有旟旟揚也古者衣冠不正朋友之罪則是衣服之不正古人以為甚恥蓋所以壞其德者不在大也席不正不坐則以席之不正而坐者必其心之不正也割不正不食則以其割之不正而食者亦以其心之不正也今衣服之無常者亦以德行之無常也觀此可為變衣服之戒采緑刺怨曠也幽王之時多怨曠者也終朝采緑不盈一掬豫髮曲局薄言歸沐終朝采藍不盈一襜五日為斯六日不詹之子于狩言韔其弓之子于釣言綸之繩其釣維何維魴及鱮維魴及鱮薄言觀者李曰鄭氏云怨曠者君子行役過時之所由也而刺之者譏其不但憂思而已欲從君子於外非禮也蘇氏亦曰言思怨而已其如不知義也此皆錯㑹作詩者之意夫序曰幽王之時多怨曠者也則是刺幽王也非是刺怨曠也孟子曰昔者太王好色愛厥妃詩云古公亶父來朝走馬率西水滸至于岐下爰及姜女當是時也內無怨女外無曠夫使幽王之治能如文王則采緑之詩豈作乎惟其時多征役久勞於外此其所以怨曠也觀雄雉之詩曰淫亂不恤國事軍旅數起大夫久役男女怨曠此是怨曠之詩而說詩者皆知其為刺宣公乃於此詩而強為之說以為譏刺婦人不當怨曠何也非婦人所當然也汝墳之婦人乃能勉其夫以正殷其雷之大夫妻乃能勸其夫以義此豈有怨曠之情乎怨曠者固為非矣然必思其所以致之者其罪大也正如北山之大夫非所當然耳所以致之者信有罪也緑王芻也自旦及食時為終朝兩手曰掬王芻易得之菜也而終朝采之菜既易得而其時不為不久而采不盈一掬者心不在焉故也如禮記曰心不在焉視之而不見聽之而不聞食焉不知其味今也采緑而不盈一掬者婦人之心在於怨曠而不在於采緑故也婦人夫不在家不為容飾不為膏沐而其髮曲局局卷也薄言歸沐言庶幾其夫之歸而後沐也王氏曰既曲局矣則其歸沐非得已也然而曰薄言歸沐則亦局而已此與伯兮所謂豈無膏沐誰適為容異意也此說非也此詩所謂薄言歸沐正與伯兮所謂豈無膏沐誰適為容同意也伯兮之意則以夫不在故不為膏沐也此詩之意則以夫歸而後沐也薄者詩之辭也非薄略也如芣苡之詩曰薄言采之采蘩之詩曰薄言還歸皆是詩之辭如此不必曰茍而已終朝采藍不盈一襜藍染草也衣之前蔽曰襜此亦是上章之意也詹至也毛氏曰婦人五日一御此蓋泥於內則妾雖年老未滿五十必與五日之御此固不足取也鄭曰五日六日者五月之日六月之日也期至五月而歸今六月猶不至據詩中但有五日六日之文而又添一月字是畫蛇添足也如七月之詩曰一之日二之日方可以為月此五日六日不可謂五月六月也但當是時所指五日而歸今乃六日而不見其歸是失其當時所期之日也正所謂期逝不至也伯兮之詩所謂其雨其雨杲杲出日亦是此意之子于狩言韔其弓此則思其君子在家之事也言君子往狩我則為之韔其弓君子往釣我則為之綸其繩韔其弓者言射畢則弛其弓而納之韔也綸其繩者言釣竿之上須綸與之作繩既言其所為之事又思其所得之物言君子之所釣者必得魴鱮之魚既得魴鱮之魚故我得以觀之傷今之時不然也黍苗刺幽王也不能膏潤天下卿士不能行召伯之職焉芃芃黍苖隂雨膏之悠悠南行召伯勞之我任我輦我車我牛我行既集蓋云歸哉我徒我御我師我旅我行既集蓋云歸處肅肅謝功召伯營之烈烈征師召伯成之原隰既平泉流既清召伯有成王心則寧李曰此詩之言幽王不能如隂雨之潤及天下者以卿士不能行召伯之職故也召伯召穆公也穆公者召康公之後也召康公為二伯故其後繼之為伯召康公之為伯也聽訟於甘棠之下而民之感其德澤猶不忍伐其木故甘棠詩曰蔽芾甘棠勿翦勿伐召伯所茇以其憩息之地猶念之如此則康公之為伯也可知矣而召穆公之為伯亦能以膏澤下於民我任我輦我車我牛則饋運者無有怨歎之情我徒我御我師我旅則行役者無怨歎之情可謂其能繼康公之風矣芃芃長大貌黍苗之所以芃芃然而長大者得隂雨以膏之故也亦猶悠悠然逺行之人得召伯以勞之故也以見召伯知人之勞以勞之下泉之詩曰芃芃黍苖隂雨膏之四國有王郇伯勞之觀此詩則知郇伯之功與召伯同也然郇伯之能勞四國之民但見於下泉之詩考之於詩而他無所見惟召伯之事又見於嵩髙之詩王命召伯定申伯之宅蓋此詩言肅肅謝功召伯營之而嵩髙之詩曰因是謝人以作爾庸其語相合故知此詩正陳其定申伯宅時事也召伯之營謝也有負任者有挽輦者有將車者有牽傍牛者凡行者既集成其事故召伯告之以可歸也此言召伯知人之勞而遣之歸也蓋人之勞役上之人必有以勞之則忘其勞矣如楚莊王之伐蕭也師人多寒王巡三軍拊而勉之三軍之士皆如挾纊夫楚之莊王非有布帛以暖其寒也但以溫言感而慰之故三軍雖無布帛之賜而暖於布帛況召伯之營謝也既知其勞而又遣之使歸則人之感戴為如何哉且召伯之能遣行者以歸則知幽王之時師旅久役既不知其勞又不告之使歸也孔氏曰君行師從卿行旅從既然矣而學詩者正不當如此之泥也肅肅謝功召伯營之肅肅嚴正貌言肅肅之謝功召伯則經營之矣烈烈之征師召伯則有成功矣此蓋深美召伯功緒成就而歸也原隰既平泉流既清此言召伯之營謝也相其原隰之宜通其水泉之利功業既成故宣王之心於此得寧也此又以見君臣同心皆在於愛民也但以一詩觀之皆言召伯之功而詩人獨於此末句但言王心則寧其意甚有含蓄皆言召伯之功成則王心安寧則知幽王之時未嘗安民也此詩専言召伯至於末章則刺幽王正如蕩之詩一詩之中皆言文王曰咨末章言商監不逺在夏后之世亦有涵蓄可以一唱而三歎也蓋此詩方言卿士不能行召伯之職而於末章則歸罪於幽王蕩之詩每章皆言紂之惡而至卒章則令厲王而為之鑒詩人之辭深逺如此學者可不深思而熟究之隰桑刺幽王也小人在位君子在野思見君子盡心以事之隰桑有阿其葉有難既見君子其樂如何隰桑有阿其葉有沃既見君子云何不樂隰桑有阿其葉有幽既見君子德音孔膠心乎愛矣遐不謂矣中心藏之何日忘之李曰幽王之世非無君子也君子退而在野在位者無非小人也然當時衛武公在位為幽王卿士則是在位者非無君子孟子曰使在王所者長幼卑尊皆薛居州也王誰與為不善使在王所者長幼卑尊皆非薛居州也王誰與為善一薛居州獨如宋王何幽王之時羣小在位雖一衛武公果何所補哉在易之夬五陽一隂君子在位小人猶厠於其間在易之剝五隂一陽小人在位君子猶存於其間幽王之時羣小在位衛武公獨為卿士正所謂剝之時也夬之世五陽而攻一隂是猶有小人矣積而至於乾則小人無有矣剝之世五隂而攻一陽是猶冇君子矣積而至於坤則君子不復存矣自古無道之世其始未嘗無君子立於朝小人得意君子必髙舉逺引退而窮處也君子退而窮處於巖穴之下而斯民之心思慕之切未嘗忘之隰桑之詩所以作也隰中之桑阿然而美其葉又難然而茂盛以譬君子之德可以芘䕃下民如此沃柔也幽黑色也惟君子之美如隰中之桑故我思見此君子苟見君子則其樂當如之何也故曰其樂如何云何不樂德音孔膠言德音所及膠固而不可解也心乎愛矣此言其思愛君子雖逺在野豈不能逺告之哉此所謂盡心事之也王鄭皆引論語愛之能勿勞乎忠焉能勿誨乎為言蓋謂與此詩相合非也此詩所言者非是小人誨君子也忠於人者則誨之亦猶斯民之愛君子則必有以告之也中心藏之何日忘之此以見其思賢者無日而已也白華周人刺幽后也幽王取申女以為后又得褒姒而黜申后故下國化之以妾為妻以孽代宗而王弗能治周人為之作是詩也白華菅兮白茅束兮之子之逺俾我獨兮英英白雲露彼菅茅天步艱難之子不猶滮池北流浸彼稻田嘯歌傷懷念彼碩人樵彼桑薪卬烘于煁維彼碩人實勞我心鼓鍾于宫聲聞于外念子懆懆視我邁邁有鶖在梁有鶴在林維彼碩人實勞我心鴛鴦在梁戢其左翼之子無良二三其德有扁斯石履之卑兮之子之逺俾我疧兮李曰伊川云幽王寵褒姒而黜申后周人為之作詩以刺之王字誤作后字理或然也幽王其初也取申國之女以為后既得褒姒則黜之幽王既如此則天下皆視之以妾為妻則化幽王之寵褒姒也以孽代宗則化幽王之寵伯服也王既不能自治又安能治國哉觀齊桓葵丘之㑹命於諸侯曰無易樹子無以妾為妻正此詩所謂以妾為妻也易樹子正此詩所謂以孽代宗也然齊桓公好內龍如夫人者六人而太子之位卒不能定身死之後諸子爭立桓公不能自正其身則又何以命諸侯桓公且然況幽王乎白華野菅也白華漚之以為菅又用白茅以束之菅之與茅各有所宜亦猶妾之與后亦各有所宜也而王之於己乃逺弃之使我獨居何哉英英白雲英英白雲之貌白雲之於菅與茅也皆有以覆露之使菅茅皆得蒙其德澤也而王於嫡與妾乃不得並蒙其寵今天步艱難如此王何為不圖此乎滮池北流滮流貌伊川曰水之微流也尚能浸溉稻田王之崇髙尊大而反不能通流其寵澤念此可以嘯歌而傷懷也碩人蓋指申后也亦猶碩人其頎蓋指莊姜也樵彼桑薪言人之樵也取彼桑薪乃宜以炊㸑今乃燎於烓竈煁烓竈其火延上謂之烘猶今之火爐也此亦是言遇后不以道也故念碩人之勞我心也鼓鐘于宫此譬王之為惡於內然以前史觀之當時之惡後世無有不知之者雖牀第之言後世亦知之矣故古人謂欲其不知莫若勿為王之所為如此豈有天下不聞乎故我念之懆懆而不恱王乃視我邁邁果何所益哉有鶖在梁有鶴在林二物各得其所而申后獨不得其所故念此碩人而勞心也鴛鴦在梁鴛鴦者雌雄相好之鳥戢其左翼者言以右翼而戢其左翼此蓋言自得之貌今王之不善其於后也始則寵之今則弃之此所謂士也罔極二三其德也有扁斯石者乃乘石也其處之卑乃其分之所當然也亦猶卑賤之人不可以為后也而王乃以卑賤之人而為后而於后乃逺弃之故使我困病如此疷病也詳觀此詩大抵與緑衣之詩相類緑衣之詩則專以緑衣取譬反覆而盡其義而不為不足此詩則泛取譬喻而盡其義而不為有餘其為詩體雖不同而發明嫡妾之分則一也綿蠻微臣刺亂也大臣不用仁心遺忘微賤不肯飲食教載之故作是詩也綿蠻黃鳥止于丘阿道之云逺我勞如何飲之食之教之誨之命彼後車謂之載之綿蠻黃鳥止于丘隅豈敢憚行畏不能趨飲之食之教之誨之命彼後車謂之載之綿蠻黃鳥止于丘側豈敢憚行畏不能極飲之食之教之誨之命彼後車謂之載之李曰此詩言當時公卿皆無仁愛之心遺弃貧賤之臣久役於外不肯飲食教載之微臣之勞則至矣大臣恬然不之恤以見當時國亂禮廢恩義之薄一至於此蓋當是時幽王不知臣下之勤勞而其大夫又不知微臣之勞如此上之人不知之則幽王之時所以遇臣下可知矣此詩又言道之云逺我勞如何豈敢憚行畏不能趨其勞如此而大臣不之知則幽王之時所以遇微臣可知矣蓋古之盛時不獨人君知臣下之勤勞至后妃亦能知使者之勞瘁觀卷耳之詩又言及馬之虺僕之痡其所以知勤勞如此故始酌之以金罍又酌之以兕觥猶曰姑酌之而已至其末章以金罍兕觥為不足答其勞但嗟吁之而已以深宫中之婦人如此則王可知矣大臣可知矣幽王之時不然此詩所以刺之也綿蠻小鳥貌丘阿丘之中曲也毛氏曰鳥止于阿人止於仁非也大學曰綿蠻黃鳥止于丘隅孔子曰於止知其所止可以人而不如鳥乎詩云穆穆文王於緝熙敬止為人君止於仁為人臣止於敬為人父止於慈為人子止於孝與國人交止於信毛氏之言蓋本於此蓋古人斷章取義若用以解詩則多齟齬而不合者詩人之意但言黃鳥之微得其所止小臣乃不得所止曽黃鳥之不如也大學所謂可以人而不如鳥者故方可以為說至於君止於仁此非詩之本意也道之云逺言道路之逺我勞當如之何邪以見勞之甚也勞之甚渴則當飲之飢則當食之事之未集則當預教之車敗則當命後車載之古之人君恩義如此今何忘已而不肯飲食教載之哉後車倅車也豈敢憚行畏不能趨我非敢畏行也但恐其疲勞不能疾趨耳此以見其憂勤之甚也豈敢憚行畏不能極我非敢憚行但恐其不能至其所也極至也亦以見其憂勤之甚也國語曰齊朝駕則夕極於魯國極之為言至也凡言此者足以見其憂勤之至也瓠葉大夫刺幽王也上弃禮而不能行雖有牲牢饔餼不肯用也故思古之人不以微薄廢禮焉幡幡瓠葉采之亨之君子有酒酌言嘗之冇兔斯首炮之燔之君子有酒酌言獻之有兔斯首燔之炙之君子有酒酌言酢之有兔斯首燔之炮之君子有酒酌言酬之李曰言幽王弃賔客之禮而不能行雖有牲牢饔餼之物而不肯用之以行禮故作詩者思古之人不以微薄之物而廢也六畜曰牲繫養者曰牢熟曰饔腥曰餼昔子貢欲去告朔之餼羊子曰爾愛其羊我愛其禮是子貢之所愛者羊而孔子之所愛者禮子貢之所愛者小孔子之所愛者大古之人所以不以微薄而廢禮也蓋物雖微而禮至重也昔楚元王敬禮申公等穆生不嗜酒元王每置酒嘗為穆生設醴及王戊即位嘗設後忘設焉穆生退曰可以逝矣醴酒不設王之意怠夫醴酒禮之薄者也以醴酒之薄則或設或不設似不足以為進退然其設則可以見其意之勤不設則可以見其意之怠物之輕重雖不同而禮寓於其間則亦烏可廢也幽王之為人也必其所愛者小所廢者大頍辨之詩曰有頍者辨實維伊何爾酒既㫖爾殽既嘉言有酒之㫖有殽之嘉何為不用之以宴同姓同姓之親而酒殽之美猶不肯用則於賔客雖有牲牢饔餼而不肯用乃其宜也幡幡瓠葉貌也瓠葉新生可以為𦵔也采之亨之君子有酒共酌而嘗之蓋得瓠葉為飲酒之𦵔故共酌此酒也有兔斯首言一兔也兔以首言猶魚以尾言也爛毛而炮曰炮加火上燒曰燔炕火曰炙言以物貫而炙之也說文曰炙炮肉也言炙宗廟中熟肉以炙為炮則炙與炮同也蓋亦是炮之類若别而言之則炕火曰炙得兔首故共酌此酒也獻者主人獻賔也酢者賔酢主人也酬者主人既卒酢爵又酌自飲卒爵復酌進賔此皆是微物而可以存禮也鄭氏之說此君子者謂庶人之有賢行者也其農功畢乃為酒漿以合朋友此不必泥於庶人以為說但是古之君子不以微薄而廢禮雖瓠葉兔首猶用以為禮今有牲牢饔餼之物而不肯用之以為禮非有他義也漸漸之石下國刺幽王也戎狄叛之荆舒不至乃命將率東征役久病於外故作是詩也漸漸之石維其髙矣山川悠逺維其勞矣武人東征不皇朝矣漸漸之石維其卒矣山川悠逺曷其沒矣武人東征不皇出矣有豕白蹢蒸涉波矣月離于卑俾滂沱矣武人東征不皇他矣李曰幽王之時西戎北狄共為反叛而荆舒之貢不至此但言荆舒不至而兼以戎狄叛之以見幽王無道致戎狄之交侵也幽王以荆舒不至遂遣將士征之士卒久病於外而不得歸然以為下國刺之何也蓋王師出征諸侯之人亦從而病焉故刺之也鄭氏曰山石漸漸然而髙峻不可登而上喻戎狄衆強而無禮義不可得而伐之也王氏曰石之漸漸然亷利足以傷物而無化養之道焉幽王暴戾無德之譬也一則以喻戎狄一則以喻幽王其說皆非也而鄭氏之繆尤甚鄭氏既以石喻戎狄又以山川悠逺為荆舒之國如此分别可謂泥於序之言也歐氏曰漸漸髙石與悠悠然長逺之山川皆自其東征之人序其所歷險阻之勞爾其說甚簡而徑蓋說詩者不費辭而理明則可謂得說詩之㫖矣蘇氏曰漸漸之石而欲以力平之乎吾見其髙而已不可平也山川悠逺而欲以行盡之乎吾見其勞而已不可盡也此說不如歐氏之簡徑既言山石之髙以見其跋涉險阻也又言山川之悠逺以知其道里之逺而下繼之不皇朝矣者鄭氏謂皇正也此說甚曲歐陽既辨之矣王氏曰此朝與趙括母所謂東鄉朝其羣吏同意此說恐亦未盡蓋下章言不皇他矣言不暇言及於他矣則不皇朝矣者蓋亦是言不暇言及朝王也方在萬里之外而不得歸深以為病故不暇言及朝王矣曷其沒矣言何時而盡也沒盡也武人東征不皇出矣言武人之勞且深入而不暇言及出此山川之險阻矣有豕白蹢鄭氏謂喻荆舒之君唐突難禁制以月離于畢俾滂沱矣喻荆舒之叛漸萌亦由王出也其取譬皆曲折而不合王氏亦以有豕白蹢喻戎狄荆舒之君與鄭氏不相逺歐陽公曰豕涉波而月離畢將雨之驗也謂征伐者在乎險阻之中惟雨是憂不皇及他也此說亦可謂簡徑而明矣而張橫渠之說尤分明其說曰豕之負塗曵泥其常性也今其足皆白衆與涉波而去水患之多可知矣惟以此為水患之多則四句相連理或然也蹢蹄也蒸衆也蓋月離于畢則有雨星有好風星有好雨正謂此也苕之華音花大夫閔時也幽王之時西戎東夷交侵中國師旅並起因之以饑饉君子閔周室之將亡傷已逢之故作是詩也苕之華藝其黃矣心之憂矣維其傷矣苕之華其葉青青知我如此不如無生牂羊墳首三星在罶人可以食鮮可以飽李曰此言幽王之時戎既叛中國又病加之以師旅因之以饑饉其亡徴見矣故君子作詩以自傷也兵之上䇿莫如自知已不能自治而欲治人則是空內而從事於外雖足以討夷狄之罪而民以愁困果何益哉幽王之時夷狄交侵此固夷狄之罪而幽王不能自治故加之以師旅因之以饑饉此君子思周之將亡而作是詩也秦始皇從事於胸奴而不知秦民之愁困故秦亦以亡隋煬帝為遼東之役民亦苦之故隋亦以亡是皆從事於四夷而不知內之困也苕陵苕也苕之華盛則黃矣盛至於黃則落矣故下章言其葉青青言華落則惟見其葉青青矣以見周室之衰亦如此華也維其傷矣此言其感傷也知我如此不如無生正序所謂傷已逢之也言當時之人皆苦其虐謂不如無生也蓼莪之詩曰鮮民之生不如死之久矣兔爰之詩曰我生之初尚無為我生之後逢此百罹則是當時之人不以為樂故以生不如死也牂羊墳首三星在罶此二句頗難說毛氏曰牂羊牝羊也墳大也罶曲梁也寡婦之笱也三星心星也牂羊墳首無是道也三星在罶言不可久也諸家皆以此為說而張橫渠之說則以謂充庖墳首有牂羊言歉嵗而君食足也魚笱三星夜照天言羣生不可充其飢腸也此二說姑兩存之人可以食鮮可以飽此言其苟且如此但可以食矣不可以望其飽也此以見其四海困窮也武王之興師也屢豐年夫大兵之後必有凶年而武王之興師則屢豐年者蓋人和則天地之和應焉幽王之時師旅並起曽無休息民既怨矣加之以師旅因之以饑饉亦其理然也何草不黃下國刺幽王也四夷交侵中國背叛用兵不息視民如禽獸君子憂之故作是詩也何草不黃何日不行何人不將經營四方何草不𤣥何人不矜哀我征夫獨為匪民匪兕匪虎率彼曠野哀我征夫朝夕不暇有芃者狐率彼幽草有棧之車行彼周道李曰左傳云國之興也視民如傷是其福也其亡也以民為土芥是其禍也方周室之初文王視民如傷此周之所以興及至幽王視民如禽獸此周之所以亡也懷保小民其仁至矣而其心猶視民如傷則文王之心可知矣幽王之兵革不息征伐不休民之苦甚矣而幽王曽不之恤視民如禽獸則幽王之心可知也蓋驅民於行陳之間鋒鏑之下乃萬死一生之地非暴虐殘忍糜爛其民者必不肯為也嵗暮則草黃何草不黃以見其久役也何日不行以見其一嵗之中無日不行也何人不將以見其一國之中無人得免戰爭之苦也人之所以將行者蓋為幽王經營四方也然幽王果能經營四方乎何草不𤣥𤣥赤黑色草始生其色𤣥蓋此言嵗暮之時不得歸又至於明年之春也何人不矜者矜不必是無妻但久役於外弃其室家則可謂之矜也哀我征夫獨為匪民言以我征夫為非民乎蓋以民視之則仁愛之必不至於久役也今既不以民視之故不復顧惜之也匪兕匪虎言兕也虎也乃在於曠野之中也今我非兕乎非虎乎何為在此曠野之中而不歸乎率循也惟其如是故哀我征夫朝夕不得皇暇以見其征役之久也有芃者狐芃小貌棧車役車也言狐之小率循於幽草之中以喻民以役車而行周道之中也王氏曰四夷交侵中國諸侯莫肯朝事則周道鞠為茂草故以率彼幽草況行彼周道也此曲說也天下之民皆人耳人能以仁存心已欲立而立人已欲達而達人己亦人也人亦己也吾之愛民是誠何心哉以己之心而推之未有不愛民也幽王視民如禽獸詩中言匪兕匪虎率彼曠野有芃者狐率彼幽草則是視民如禽獸矣求其愛民之心果安在哉毛詩集解卷二十九
