body:
  text: 毛詩集解卷九宋李樗黄櫄撰中谷有蓷吐雷反閔周也夫婦日以衰薄凶年饑饉室家相弃爾中谷有蓷暵呼但反其乾矣有女仳匹指反離嘅口愛反其嘆平聲矣嘅其嘆矣遇人之艱難矣中谷有蓷暵其脩矣有女仳離條其歗本又作嘯矣條其歗矣遇人之不淑矣中谷有蓷暵其濕矣有女仳離啜張劣反其泣矣啜其泣矣何嗟及矣李曰孔子繋易言夫婦之道不可以不久也故受之以恒恒者久也則常而久者乃夫婦之道也今而室家相棄豈其宜哉然亦因凶年饑饉耳凶年饑饉為夫婦者正當患難相恤豈至弃而不保可以見平王不能厚風俗而夫婦日以衰薄也豈不可閔者乎此中谷有蓷所由作也蓷陸璣等以為菴蔄韓詩𩔖以為益母毛氏以為鵻郭璞以為茺蔚夫蓷者宜於水者也孔氏以為水浸之暵然其乾乎此固謬矣而王氏又云脩久也言久暵矣而又苦濕焉此亦非詩人之本意惟蘇氏程氏得之而蘇說為詳蘇氏曰蓷鵻也暵燥也仳别也脩長也草長逺地則易枯中谷之蓷旱之所難及也今也既先燥其生於乾者又燥其生而長者及其甚也則雖生於濕者亦不能免也旱及於濕則盡矣譬如周人風俗衰薄其始也人之艱難者弃其妻爾其後人之不善者弃之矣及其至甚又有無故而弃者矣故其以艱難而見弃者則嘆之嘆之者知其不得已也以不善而見弃者則條條然而嘯嘯之者怨之深矣及其無故而見弃者則泣而已泣者窮之甚也此言盡之矣啜者泣時縮氣聲也論曰莊子曰以人屬者廹窮禍患害則相弃以天屬者迫窮禍患害則相救夫婦雖曰人屬而五典皆本於天序豈可廹窮禍患害則相弃乎為夫婦者必與之同患難亦與之同逸樂氓之詩曰自我徂爾三嵗食貧與之同患雖而不與之同逸樂也谷風之詩曰我有旨蓄亦以御冬宴爾新昬以我御窮是亦與之同患難而不與之同逸樂也至於此詩則又是不能與之同患難其所以然者豈民之罪哉是上之人不能以風化下所以禮義廢壊豈不可傷哉此序所以閔周也黄曰王者之治必先使天下有相生相養相親相恤之道顧其父子兄弟夫婦而有不忍相去之意然後禮義生焉禮義生則可殺可辱可飢可寒而不可與為不善此孟子所謂未有仁而遺其親未有義而後其君者也蓋人惟平居不忍忘其親故緩急不忍忘其君今平王不能善天下之風俗而反以敗天下之風俗至於夫婦之情日以衰薄一遇凶荒則室家相弃夫人至於弃其室家忘其夫婦則亦無所不至矣尚何望其知君哉予於谷風之詩而知衛之所以亡於中谷有蓷之詩而知周之所以亡兔爰閔周也桓王失信諸侯背叛構怨連禍王師傷敗君子不樂其生焉有兔爰爰雉離于羅我生之𥘉尚無為我生之後逢此百罹尚寐無吪五戈反有兔爰爰雉離于罦我生之𥘉尚無造我生之後逢此百憂尚寐無覺有兔爰爰雉離于罿昌鍾反我生之初尚無庸我生之後逢此百凶尚寐無聦李曰左傳隱公二年鄭武公莊公為平王卿士王貳于虢鄭伯怨王王曰無之故周鄭交質王子狐為質於鄭鄭公子忽為質于周王崩周人將卑虢公政四月鄭祭足帥師取温之麥秋又取成周之禾周鄭交惡君子曰信不由中質無益也此序所謂桓王失信是也桓王既失信諸侯由是背叛即左傳所謂王奪鄭伯政鄭伯不朝是也王師傷敗者即所謂戰于繻葛王卒大敗祝聃射王中肩是也惟其如此故君子不以生為樂而作此詩也有兔爰爰雉離于罿我生之初尚無庸我生之後逢此百凶尚寐無聦爰爰緩也爾雅曰鳥罟謂之羅羅鳥網也又曰繴謂之罿罿罬也罬謂之罦罦覆車也郭璞曰今之翻車也有兩轅中施罥以捕鳥則知罿罦是一物也離麗也毛鄭之説則以有兔爰爰為緩以雉離于羅為急喻王政之有緩急有緩者有聼從也有急者有所躁蹙也此説皆非詩中本意而强為此義也王氏則以謂有兔爰爰以喻背叛之諸侯雉離于羅以喻傷敗之王師此説皆非詩人之本意而王氏又以羅罦罿皆網𩔖網不信之器也王不信將以罔諸侯而終至於自罔其説迂回曲折求合於序皆所不取惟歐陽氏曰有兔爰爰雉離于羅者嘆物之生有幸有不幸也謂兔則爰爰而自得雉則陷身於羅網兔則幸而雉則不幸也尚無為毛氏謂尚無成人為也言我生初㓜稚之時庶㡬無此成人之所為言冀其無征役之事非也尚無為但言我生尚幸世之無事也尚庶㡬也造即為也庸用也亦是無為之意而王氏則謂我生之初尚無為尚無造尚無庸非志於功名者也非志於功名而憂在於天下故謂之君子此蓋曲説也罹憂也言我今則逢此百憂也百憂百凶亦是百罹之意吪動也言我欲長寐而不動也覺寤也言我欲長寐而不寤也聦耳有聞也言我欲長寐而無所聞知也與詩所謂鮮民之生不如死之久矣又曰知我如此不如無生又曰不自我先不自我後皆是此意也王氏則以謂凶甚於憂憂甚於罹皆是强為之説據詩三章皆是一意但换其韻耳論曰子貢問於孔子曰足食足兵民信之矣必不得已而去於斯三者何先曰去兵曰必不得已而去於斯二者何先曰去食自古皆有死民無信不立孔子言寜去其兵食而信不可一日無也信苟立矣未有兵食之不足足兵食而無信亦不能一朝居也王室有警則舉烽燧以召諸侯所當為之事也而失信此幽王所以有犬戎之禍秦變法令募民徙木而示之信此非所當為之事也非所當為之事而有信此商君所以得其志也夫所不當為之事而有信其利己如此况所當為之事而有信其利為何如然而桓王既失信安得諸侯之不背叛㦲黄曰司馬温公言國保於民民保於信非信無以使民非民無以守國推而至於上不信下下不信上上下離心以至於敗予讀兔爰之詩而見温公之言為不誣也桓王一失其信而至於諸侯背叛王師傷敗人君之於天下其可一日而忘信乎兵食可去而信不可去非兵食之果可去也與其去於此者不若去扵彼苟信不立雖有菽粟安得而食雖有城池將誰與守此君子之所以閔周之亡而不樂其生也葛藟力軌反王族刺平王也周室道衰弃其九族焉緜緜葛藟在河之滸呼五反終逺兄弟謂他人父謂他人父亦莫我顧緜緜葛藟在河之涘終逺兄弟謂他人母謂他人母亦莫我有緜緜葛藟在河之漘順春反終逺兄弟謂他人昆謂他人昆亦莫我聞李曰王族刺平王之詩也今乃列之於平王之後此可疑也皇甫士安直指以謂桓王之詩此則不可得而見如載馳乃戴公之詩也而列之於文公之後清人乃文公之詩也而列之於莊昭之間此皆因秦焚書之後篇帙散亡傳者失次闕之可也九族鄭氏謂上自髙祖下至𤣥孫然髙祖非已之所逮事𤣥孫非已之所及見如之何而親之當從歐陽之說以為九族者父族四母族三妻族二也弃其九族者言其無親親之道也緜緜葛藟葛藟二草也葛似藟爾雅曰葛似藤皆蔓生故言緜緜者長不絶之貌也水涯曰滸涘亦涯也夷上灑下曰漘葛藟所以比九族也說者不一宋昭公將去羣公子樂豫曰不可公族公室之枝葉也若去之則本根無所庇䕃矣葛藟猶能庇其本根故君子以為比況國君乎説者又以為比則止取其能庇本根也然詩人之意固是以葛藟比九族然在河之滸意必有所主矣若如左傳之言都不見在河之意鄭氏曰葛藟生於河之涯得其潤澤以長大而不絶喻王之同姓得王之恩施以生長其子孫或者又謂葛生於山而反近於水人君當親族人而乃親他人其説皆不如王氏曰河滸水所盪危地也潤澤葛藟而生之則所以自固猶之王者敦叙九族而親之亦所以自固此説為善終逺兄弟謂他人父者言王逺弃其兄弟而謂他人為父也謂他人父亦莫我顧者呼他人為父他人非我眷屬終不顧我也言王既以他人為父亦無顧我之意也我九族也蘇氏曰弃逺其兄弟而謂他人父彼非王族亦豈肯顧王㦲其説亦通謂他人母蘇氏曰謂其夫為父其妻則母也亦莫我有者言視之如無也謂他人昆言以他人為兄也亦莫我聞者不與我相聞知也宋昭公事見文七年論曰孔子曰不愛其親而愛他人者謂之悖徳不敬其兄而敬他人者謂之悖禮以順則逆民無則焉蓋不獨於父母然也於九族亦當然也夫他人非不可愛也亦非不可敬也先愛其親以及他人先敬其兄以及他人然後謂之順若不愛其親不敬其兄則是於所厚者薄而又愛人之親敬人之兄則是於所薄者厚其倒置如此則謂墨氏兼愛之學愛其親與他人同敬其兄與他人同愛無差等猶為不可况不愛其親不敬其兄乎今也王於親族既不能愛之敬之則親族豈愛敬於王乎宋華亥欲代其兄合比為右師與寺人栁證之公使代之見於左師左師曰是夫也必亡女喪而宗室於人何有人亦於女何有已而宋華亥果亡此乃報施之理也今既亦莫我顧則親族亦不顧於王矣亦莫我有則親族亦莫有王矣夫秦皇之强卒以孤立蓋為此也可不戒哉黄曰周家盛時則大封同姓以厚其恩如宗子維城之詩内睦九族以篤其敬如戚戚兄弟之詩今周道衰故弃其九族此所謂寡助之至也周安得而不亡乎觀葛藟一詩見平王不愛其親而愛他人不敬其親而敬他人於所厚者薄矣而尚安能於所薄者厚哉其本亂而末治者未之有也若平王可謂先自撥其本矣采葛懼讒也彼采葛兮一日不見如三月兮彼采蕭兮一日不見如三秋兮彼采艾五蓋反兮一日不見如三嵗兮李曰此詩大抵言讒人之可畏而以葛蕭艾為之喻其義亦難曉鄭氏曰采葛喻臣以小事使出采蕭喻臣以大事使出采艾喻臣以急事使出鄭氏之説歐陽已破之矣毛氏則以謂采葛所以共絺綌采蕭所以共祭祀采艾所以共疾病雖事之無可疑者亦不敢行此説亦未當且從歐氏之説歐氏曰詩人以采葛采蕭采艾者皆積少以成多如王聼讒皆積微而成惑故曰積毁消骨叢輕折軸浸潤之譖膚受之愬皆積少而成多也一日不見如三月兮言其不見君則懼讒人乘間以入也雖一日不見如三月之久也如三秋兮如三嵗兮則其情之益疎甚矣蓋人之譖人多因其不見則乘間而讒之如漢之桑𢎞羊上官桀蓋主與燕王通謀欲言霍光出都肄郎羽林道上稱蹕候伺光出沐日奏之𢎞恭石顯欲退蕭望之周堪劉更生即令華龍告望之等謀欲罷車騎將軍踈退許史狀候望之出沐日奏之夫以桑𢎞羊之於霍光𢎞恭石顯之於蕭望之皆以候及出沐日然後得肆其間則知忠臣正士一日不在朝廷則譖言易入讒說殄行並作矣夫以一日不見且譖入之若其久出則將如之何是以古之人堲讒說殄行也黄曰讒謗之言非能遽以入人也浸潤之譖膚受之愬蓋入之以漸漬之以漸積毁消骨叢輕折軸曽參之母雖信曾參之非殺人而三人言之則投杼而走此詩人懼讒而以采葛采蕭采艾為喻也大車刺周大夫也禮義陵遲男女淫奔故陳古以刺今大夫不能聼男女之訟焉大車檻檻毳只銳反衣如菼吐敢反豈不爾思畏子不敢大車啍啍他敦反毳衣如璊音門豈不爾思畏子不奔榖則異室死則同穴謂予不信有如皦古了反日李曰刺周大夫禮義陵遲蓋言禮義廢壊也家語曰三尺之隄空車不能登者峻故也百仞之山重載陟焉陵遟故也王肅注曰陵遟猶坡陁也則陵遟是廢壊之意惟禮義廢壊則人倫不明人倫不明則男女皆踰禮法而相奔故陳古大夫之聽訟以消淫奔之行刺今不能也檻檻大車聲也啍啍車行貌也大車者王氏與蘇氏皆曰大夫之車也毳衣者毛氏以為天子大夫四命其出封五命如子男之服鄭氏則以謂子男入為大夫者王氏則以謂上大夫為卿者也是皆泥於詩序刺周大夫之言也據此言大車檻檻毳衣如菼乃古聽訟者之車服也作此詩刺周之大夫而詩之所陳乃是古大夫不可執今之大夫而求合於詩序也菼爾雅曰菼鵻郭璞曰菼草色如鵻在青白之間鄭氏曰其青者如鵻王氏則謂菼言其衣之色也徐安道謂菼𥘉生蒼黒𩔖𤣥衣曰青曰青白之間曰𤣥曰蒼黑則是菼之色説者不一如璊說文曰赬色禾之赤苗曰虋璊之玉色如之王氏則謂如裳之色記内朝曰璊赬色稷之璊色謂之麇麇色在赤黄之間似禾赬極光瑩掬之光澤烜烜然如赤珠此是一色也曰赤色曰赬色曰纁曰朱黄之間則是璊之色説者不一如此陸農師曰毳衣作㑹宗彝非所以聽訟又其色不得如菼青璊赤是或一服也則知世代久逺毳衣與其色皆不得而定當存此數説以待知者然學治經當如伯樂之治馬秦穆公使九方臯求馬三月而返報曰得之穆公曰何馬也對曰牝而黄使人徃取之則牡而驪穆公不悦召伯樂而謂之曰敗矣子所使求馬物色牝牡尚弗能知又何馬之能知也伯樂喟然太息曰臯之所觀天機也得其精而忘其麤在於内而忘其外若臯之相者乃有貴乎馬者也馬至果天下之馬也學者欲辨菼之色或曰青或曰白或曰青白之間或曰𤣥或曰蒼黑欲辨璊之色或曰纁或曰朱黄之間或曰赤或曰赬皆是不過物色牝牡之間若治經之要當求其大意而通之大車檻檻毳衣如菼者言古乏聽訟者乘此車服此衣斯民見之則曰我豈不思為其無禮畏子聽訟故不敢爾故曰豈不爾思畏子不敢畏子不奔者言聽訟者能止奔也榖則異室死則同穴謂予不信有如皦日爾雅曰榖生也男子則正位乎外女子則正位乎内死則同穴而葬此男女之正禮也此言榖則異室死則同穴者言當時之人不為淫奔以禮聘我我則從之以合於男女之正禮也皦日白日也謂予不信有如皦日當時之人相誓之辭也左傳范宣子曰所不請於君焚丹書者有如日公子重耳曰所不與舅氏同心者有如白水魯昭公曰所能見夫人者有如河或曰白水或曰日或曰河相誓之辭也孔子曰聼訟吾猶人也必也使無訟乎聼訟非難而使無訟為難文王之時虞芮爭田欲訟於周及其至文王之境耕者遜畔行者遜道遂自愧而止若文王可謂能無訟故不待至於周庭而後決也然則後之聽訟者皆當如此傳曰臯陶喑而為大理蓋不待言也古之聽訟者但聞其車聲見其服飾而淫奔之心息何待於言哉觀大車之詩深得夫子無訟之意學者不可不詳味也黄曰古之為民上者正心誠意以化其民而使民無犯禮之思故其為大夫者非特能聼訟而亦使之無訟聞大車之聲見毳衣之容而非禮之念不萌於中非畏刑也畏禮義也今禮義陵遟則其隄防已壊矣又何以禁水之奔溢㦲故為大夫非惟不能止訟而且不能聽訟此詩人所以傷今而思古也丘中有麻思賢也莊王不明賢人放逐國人思之而作是詩也丘中有麻彼留子嗟彼留子嗟將其来施施丘中有麥彼留子國彼留子國將其来食丘中有李彼留之子彼留之子貽我佩玖音乆李曰莊王桓王之子也莊王不明當時之賢如留氏之族皆放逐之故國人思其賢而欲其復来而作是詩也丘中有麻丘中有麥丘中有李者毛氏以丘中墝埆之處盡有麻麥草木乃彼子嗟之所治其意謂子嗟能敎民農桑使得有之果如此說未足以見子嗟之賢蘇氏曰𨼆居於丘陵之間而殖麻麥果實以為生者子嗟也其説雖無害然據詩之本意所謂丘中有麻有麥有李者亦猶詩所謂山有榛隰有苓南山有臺北山有萊皆是譬賢者之本𩔖也歐陽氏謂麻麥之𩔖生於丘中以其有用皆見收於人此説是也言丘中尚有麻麥李而子嗟乃不得見用此所以可惜也故上言丘中有麻下言彼留子嗟此所以深歎子嗟之不見用也程氏則以謂麻麥喻賢者以李喻不賢者據三章皆是一意豈有辭同而意異乎彼留子嗟毛氏鄭氏蘇氏皆以為留姓惟歐陽不以為姓而以為淹留之留非為大夫姓留也若以為大夫之姓則莊王之事跡見於春秋史記當時大夫留氏無所聞於人其被放逐亦不見其事既其事不顯著其後何從而知之此說不然丘中有麻所謂彼留子嗟者亦猶陳風所謂子仲之子豈必求於他書有子仲乃言其姓氏乎蓋詩中所陳便是實事跡不必於春秋史記中而求之也彼留子嗟彼留子國毛氏以子嗟為子子國為父使果是父子不應先子而後父大抵只是侯也程氏之説猶不可信程氏曰麻可衣麥可食宜殖丘中興賢者宜在朝則能養於人彼不賢者乃留於朝子之賢反窮處而咨嗟其義甚至若使詩人之意果如程氏之説則下文亦不相貫則知此詩當從毛鄭之説將其来施施毛氏以為難進歐陽氏以謂難於自進據此詩但是國人欲其来非謂賢者之難進也孟子曰施施從外来則是欲其施施而来也將其来食毛氏曰子國復来我乃得食鄭氏曰言其將来食庶其親己得厚待之其説皆非也歐陽曰思其来而禄之也王氏曰將其来而禄於朝也其説皆是玖者石次玉者貽我佩玖者言庶㡬其来遺我以善也程氏曰佩者外飾玖非真玉彼留之子所遺我者徒文飾而無實也蓋程氏既以此為不賢之人故其説遂以為徒文飾而無實此説未敢以為必然自古人君用人必合於民心民心之所喜者吾則從而用之民心之所惡者吾則從而黜之故其用人也不以私己之好惡為進退惟以斯民之好惡為去取如蒼舒隤敳檮戭大臨之𩔖天下之人謂之八凱伯奮仲堪之𩔖天下之人謂之八元惟天下之人既以為善故舜舉於朝廷之上帝鴻氏有不才子天下之人謂之渾敦少皡氏有不才子天下之人謂之窮竒顓頊氏有不才子天下之人謂之檮杌縉雲氏有不才子天下之人謂之饕餮惟天下之人既以為惡故舜流放竄殛與天下共棄之至於後世則不然民之所欲佐吾君者皆委棄於草野而不用民之所惡者皆舉而致之髙位是以朝廷之上無非讒諂面諛之人而民之所以思賢者也此詩及遵大路白駒之詩皆是民之思賢者惟恐其不留其既去也惟恐不来民之思賢如此而人君乃不加意何以慰斯民之望乎此詩人所以刺之也黄曰丘中有麻一詩古今之説者皆失其義夫詩言賢人放逐而國人思之則詩中所謂彼留子嗟彼留子國彼留之子皆國人思賢而欲留之之意也諸家乃以留為大夫氏而子嗟為子國之子夫莊王不明而何獨棄留氏父子乎借或有之則春秋當書史記當載今皆不見於他經而獨見於毛氏此其為説不免於附㑹歐陽公嘗辨之矣然亦以子嗟子國為當時賢者是亦無所經見也予竊以為嗟者詩人欲留賢者而形於嗟歎國者詩人欲留賢者而使之在國也而彼留之子則其意明矣丘中有麻有麥有李固不可以為賢者種治之功亦不必以為賢者𨼆居之地是特言國之有爵禄而當留賢者以食之也白駒之詩曰皎皎白駒食我場苗縶之維之以永今朝此亦留賢者之意學者試思之鄭緇衣詁訓傳第七國風緇衣美武公也父子並為周司徒善於其職國人宜之故美其徳以明有國善善之功焉緇衣之宜兮敝予又改為兮適子之館兮還予授子之粲兮緇衣之好兮敝予又改造兮適子之館兮還予授子之粲兮緇衣之蓆兮敝予又改作兮適子之館兮還予授子之粲兮李曰美武公也父子者蓋武公之父桓公也武公桓公皆入為周司徒而皆稱其職位故國人皆以為宜而美其徳以明有國善善之功焉唐孔氏曰武公既為鄭國之君又復作周司徒已是其善又能善其職此乃有國者善中之善其說非也程氏曰武公父子相繼為周司徒善終於其職詩人美其為國君而能好善行善道享章服宫室廩禄之報此說是也蓋此言善善之功亦猶葛覃所謂化天下以婦道葛覃之詩未嘗有化天下婦道之實事但詩人所言如此此詩亦然或者又謂皆是武公有善善之功武公桓公既為周之卿士武公善於其職故詩人以緇衣美之而莊公乃不免於刺則是莊公云不善其職也緇衣之宜兮緇黒色也緇衣卿士聽朝正服也緇衣之宜兮猶所謂象服是宜也好毛氏曰好猶宜也蓆毛氏曰大也其說本於爾雅王氏則以蓆為多言予之多也既以蓆為予之多又曰敝予又改作兮則上下文殊不相貫豈有予之之多而又改作邪程氏則以蓆為安舒之義服稱其徳則安舒其說甚善然而以蓆為安則不知何所考據也館舎也言諸侯皆有館舎也還自朝而還也言子若自朝而還我則授子以粲也粲者餐也言欲飲食之辭也以詩觀之則宜好蓆只是一意言國人之愛武公父子緇衣之敝我將為子改作之蓋欲其久於其職也觀此詩則知好賢之篤也禮記曰好賢如緇衣惡惡如巷伯則爵不瀆而民作愿刑不試而民咸服人君之好賢誠能如民之愛武公如此之篤則天下之不治未之有也自古賢者常難於久任小人常易於得志蓋賢者之心固欲終身立於其君之朝然常不旋踵而退小人不可一日立於朝廷之上然每至於深根固蒂而不可破如唐明皇之於姚崇宋璟輩可謂深知之矣不數十年而皆罷其用李林甫至十九年而不退則知賢者難於久任而小人得志之易也如此可勝歎哉黄曰鄭桓公友厲王之子宣王母弟始封於鄭幽王八年為周大司徒犬戎之難桓公死之其子武公與平王東遷故父子相繼為周司徒國人愛武公而思桓公故曰以明有國善善之功焉予以為善善者以見桓公武公積善之久也惟武公積善之不已故國人愛之亦不已孔子曰吾讀緇衣見好賢之至嗚呼非武公父子之賢其何以得此於國人哉粲諸家盡以為䬸也予以為作粲粲衣服之粲蓋上文但言緇衣而未嘗及飲食況以粲為䬸又費辭也將仲子刺莊公也不勝其母以害其弟弟叔失道而公弗制祭仲諫而公弗聽吐丁反小不忍以致大亂焉將仲子兮無踰我里無折我樹杞豈敢愛之畏我父母仲可懐也父母之言亦可畏也將仲子兮無踰我牆無折我樹桑豈敢愛之畏我諸兄仲可懐也諸兄之言亦可畏也將仲子兮無踰我園無折我樹檀豈敢愛之畏人之多言仲可懐也人之多言亦可畏也李曰左傳隱公元年鄭武公娶于申曰武姜生莊公及共叔段莊公寤生驚姜氏故名曰寤生遂惡之愛共叔段欲立之亟請於武公公弗許及莊公即位請京使居之祭仲曰都城過百雉國之害也公曰姜氏欲之焉辟害所謂焉辟害者則是不勝其母也不勝其母是不能止也不能止其母乃所以害其弟弟叔段失其道而公弗制祭仲諫之公弗聽則小不忍以致大亂其所謂畏我諸兄畏我父母畏人之多言皆所謂小不忍也將仲子兮無踰我里將者請也二十五家為里杞栁屬也檀彊忍之木也無踰我里無折我樹杞蓋言祭仲之諫異姓之人與我家事傷害我兄弟也無踰我里言無與我家事也無折我樹把言無害我兄弟也無踰我牆無折我樹桑無踰我園無折我樹檀皆是此意也鄭氏云無踰我里言無干我親戚無折我樹把喻言無傷我兄弟也夫親戚即兄弟也其説非也王氏以謂始曰無踰我里中曰無踰我牆卒曰無踰我園以言仲子之言彌峻而莊公拒之彌固也始曰無折我樹把中曰無折我樹桑卒曰無折我樹檀以言莊公不制段於早而段之彌强也不必如此分别豈敢愛之畏我父母仲可懐也父母之言亦可畏也言祭仲之諫莊公公拒之曰我非愛惜之也父母可畏仲可念也父母之言亦可畏也畏我諸兄畏人之多言亦是此意論曰祭仲之諫莊公不以大邑封段非惡段也乃愛段也莊公拒祭仲之諫以大邑封之非愛段也乃惡段也視莊公之言曰多行不義必自斃又曰不義不暱厚將崩莊公之意欲置段於死地然其曰畏我父母畏我諸兄畏人之多言蓋段未有大過惡而莊公欲誅之則父母諸兄國人將以我為何如人也惟稔其惡而後誅之彼父母國人諸兄亦不得而有辭此莊公之本意也而莊公不免有克段之名是莊公徒自欺也天下後世不可得而欺也周公嘗誅管蔡矣而周公𥘉無殺之之意及管蔡四國流言與武庚為亂周公不得已而誅之後世不以周公殺兄之過為不如舜蓋以周公本無殺之之意也莊公之於叔段雖封大邑而殺之之意深矣春秋書鄭伯克段于鄢榖梁釋之曰何甚乎鄭伯甚鄭伯之處心積慮成於殺也如莊公之畏父母諸兄畏人之多言故以大邑封之俟其惡積之深而後誅之以免天下之議也春秋書之見其肺肝矣觀春秋書鄭伯克段于鄢而觀將仲子之詩則莊公之惡自見春秋書鄭伯棄其師而觀清人之詩則文公之惡自見蓋不待傳注而知之也黄曰莊公拒祭仲之諫而不制叔段非愛之也乃所以稔其禍而處之於不可赦之地也以春秋攷之莊公豈以祭仲離間其兄弟而拒之哉曰多行不義必自斃曰不義不暱厚將崩無庸將自及莊公之心術可見矣春秋書鄭伯克段于鄢所以彰鄭伯之處心詩人述鄭伯拒祭仲之辭而君子論莊公拒祭仲之心學者當即詩人之言而考之於春秋則莊公之心可見矣叔于田刺莊公也叔處于京繕甲治兵以出于田國人説而歸之叔于田巷無居人豈無居人不如叔也洵美且仁叔于狩巷無飲酒豈無飲酒不如叔也洵美且好叔適野巷無服馬豈無服馬不如叔也洵美且武李曰左傳云武姜請京使居之即所謂叔處于京是也大叔完聚繕甲兵具卒乘者即此所謂繕甲治兵是也繕之為言善也大叔繕甲治兵以出田獵國人皆悦之所以有此詩也叔于田巷無居人言叔段出田獵也叔之出田獵而所居之巷如無人非實無其人也雖有人不如叔之洵美且仁也冬獵曰狩言叔之出狩而巷無飲酒之人豈實是無人哉雖有人不如叔之洵美且好也郊外曰野言叔之適野而巷無服馬之人豈實無人哉雖有人不如叔之洵美且武也言此皆愛之辭也鄭氏曰叔徃田國人注心於叔似如無人處其義不甚分明歐陽氏已破之矣至於王氏之説其鑿又甚焉不必復辨夫仁之為名豈易得哉孔門之髙弟如子路如冉有公西華皆不許以仁列國大夫如陳文子如令尹子文亦不許以仁而叔段乃得謂之仁者叔段豈真有仁哉國人悦之故以此名與之也楊龜山曰先王之道微禮義消亡政敎不明而國俗傷敗故人之好惡不必當其是非而毁譽不足攷其善惡則其所譽而好之者未必誠善也所毁而惡之者未必誠惡也叔段不義而為衆所好者亦以衰俗好惡毁譽不當其實故也然則所謂仁者豈誠有仁哉所謂有禮者豈誠有禮哉所謂武者豈誠有武㦲是皆若此而已若楊龜山之説可謂善矣所謂且仁且好且武自非大聖賢不足以得此名而叔段乃得此名者豈非妄與之乎如揚之水之詩一章言既見君子云何不樂二章言既見君子云何其憂夫桓叔篡弑之人也而詩人以君子之名歸之君子之名豈易得哉而桓叔乃得之亦猶此詩所謂且仁且好且武也唐安禄山史思明唐室之巨賊也而范陽之人謂之二聖夫聖孔子不居而禄山思明何人而得之亦可謂妄與人也黄講見下篇大叔于田刺莊公也叔多才而好勇不義而得衆也大叔于田乘乘馬執轡如組音祖兩驂如舞叔在藪火烈具舉䄠音但禓素歴反暴虎獻于公所將叔無狃戒其傷女叔于田乗乘黄兩服上襄兩驂鴈行叔在藪火烈具揚叔善射忌又良御忌抑磬控忌抑縱送忌叔于田乗乘鴇音保兩服齊首兩驂如手叔在藪火烈具阜叔馬慢忌叔𤼵罕忌抑釋掤忌抑鬯弓忌李曰大叔之所謂大者蓋左氏之所謂京城大叔蘇氏以為不然二詩皆曰叔于田故此加大字以别之非謂段為大叔也然不知者又加大於首章失之矣此說非也所謂名詩於大叔者蓋將以别前詩亦猶小雅有小明大雅有大明小雅有小旻大雅有召旻特以為分别爾非有義理於其間陸德明曰本或作大叔于田者誤蘇氏言叔之多才詩所謂善御善射是也叔之好勇詩所謂䄠禓暴虎是也多才如周公然後為善叔之多才果如周公乎好勇如太王然後為善叔之好勇果如太王乎盆成括仕於齊孟子曰死矣盆成括盆成括見殺門人問曰夫子何以知其將見殺曰小冇才未聞君子之大道則足以殺其軀而已閔子侍側誾誾如也子路行行如也冉有子貢侃侃如也孔子曰若由也不得其死然夫多才不如周公而如盆成括則足以見殺好勇不如太王而如子路則必不得其死如羿善射奡盪舟亦皆不得其死然叔之多才勇適所以取禍也義而得衆然後為善不義而得衆亦所取禍左氏所謂多行不義必自斃不義而行其斃必速矣大叔于田乗乗馬車乗駟馬謂之乘言叔段往於田獵駕此一乗之馬也叔既善射故其執馬轡如組孔子家語曰組緫紕於此成文於彼今也執轡如組以見叔之善御也兩驂如舞一車四馬謂之乘别而言之則轅下兩馬謂之服參於兩旁謂之驂服在中驂在外如舞者言如舞之中節也藪澤也韓詩曰禽獸居之曰藪火烈毛氏以烈為行列言衆人皆揚火也具舉者言一時而舉也以見其段之得衆也䄠禓肉袒也禓去禓衣也暴虎爾雅曰徒摶也此言段之好勇也論語所謂暴虎馮河是也叔之暴虎進于公所國人戒之曰請叔無狃於此爾雅曰狃復也孫炎曰狃復也又曰前事復為也戒者言國人謂叔不當再如此也恐其傷女以見國人愛之之辭也乗乗黄四馬皆黄也黄騂曰黄馬之上色也襄駕也其兩服者皆馬之上駕也兩服上襄言最良之馬也鴈行者驂與駕相次序如鴈之行也具揚者言一時而揚也叔善射忌又良御忌良亦善也忌助辭既善射又善御以見其多才抑起辭也騁馬曰磬止馬曰控𤼵矢曰縱從禽曰送乗乗鴇四馬皆鴇也鴇今之烏騘也爾雅曰驪白雜毛曰鴇齊首言馬之齊首也兩驂如手如人左右手之能相佐助也阜盛也慢遲也罕希也言田事且畢則其行馬遲而𤼵矢希也掤箭筩上蓋所以覆矢也鬯弓弢弓也弛弓而納之於弢釋掤而覆矢弛弓而弢之皆言田事且畢也左曰太叔又收貳以為已邑至於廩延子封曰可矣厚將得衆公曰不義不暱厚將崩觀此詩則知子封得衆之言驗也段之不義而乃為衆所歸則衆歸之者皆不義之徒也漢七國反景帝問爰盎曰何如盎曰不足憂也上曰吳王誘天下豪傑白頭舉事此其計不百全豈𤼵乎何以言其無能為也盎對曰誠令吳得豪傑亦且輔而為誼不反矣吳所誘皆無賴子弟亡命姦人故相誘以亂觀此詩則知衆歸叔段皆不義之徒也然此詩所言皆以叔段為義而序所以刺莊公者王氏曰人君明義以正衆使衆知義而孰敢為不義為不義則衆之所棄也安能得衆哉楊龜山亦曰叔段以不義得衆其失在於莊公不制之早也人君明義以正衆使衆知義則雖有不義者莫之與也雖有僭竊者莫之助也尚何使人悦而歸之哉二説皆是如將仲子叔于田不刺叔段而刺莊公揚之水不刺桓叔而刺昭公皆禍之所由生也黄曰管蔡與商人同濟其惡則商人必以管蔡為賢共叔段與京人叛則國人必以段為仁且武此如安禄山史思明乃唐室之賊而當時之人以為二聖也噫項羽之仁匹婦之仁耳項羽之勇匹夫之勇耳若叔段之洵美且仁且武者亦如項羽之仁且勇歟知伯非賢而謂之賢盧把非忠而謂之忠亦此𩔖也司馬温公常言君子挾才以為善小人挾才以為惡挾才而為善者善無不至挾才以為惡者惡無不至小人智足以遂其姦勇足以決其暴是虎而翼者其為害豈不多哉大叔多才而不義所謂挾才而為惡者也所謂䄠禓暴虎善射善御即智足以遂其姦勇足以決其暴也智伯善射力足技藝畢給而不免於亡是所以為亡之資也盆成括小有才而不免於見殺是其所以為見殺之招也叔多才而不義其亦如智伯之射御足力而行之以不仁盆成括小有才而未聞君子之大道者歟然詩人不以刺大叔而以刺莊公蓋亦莊公不防閑於其始也毛詩集解卷九
