body:
  text: 毛詩集解卷十五宋李樗黃櫄撰渭陽康公念母也康公之母晉獻公之女文公遭麗姬之難乃旦反未反而秦姬卒穆公納文公康公時為太子贈送文公于渭之陽念母之不見也我見舅氏如母存焉及其即位思而作是詩也我送舅氏曰至渭陽何以贈之路車乘去聲黃我送舅氏悠悠我思何以贈之瓊瑰古回反玉佩李曰晉獻公蒸於齊姜生秦穆夫人及太子申生見莊二十八年又娶二女於戎大戎狐姬生重耳小戎子生夷吾見文七年秦穆夫人是齊姜所生重耳是大戎所生秦穆夫人乃與文公異母之子也秦康公之母乃晉獻公之女重耳乃康公之舅也文公遭麗姬之難姬晉獻公之妾也譖太子申生申生縊於新城又譖重耳重耳奔狄重耳既出奔狄十二年而復行適衛適曹適鄭適楚適秦遂納之當時秦穆夫人已死矣康公時為太子贈送文公于渭陽因念母之不見也按僖公十五年秦穆獲晉侯以歸秦穆夫人為之請則是十五年以前夫人猶在其後不知何年而卒穆公納文公之時其母不見康公因思其母曰我見舅氏如母存焉蓋以兄弟同氣而生也康公念母及此其即位故思而作詩因見舅而思其母也舅氏者舅之與外甥氏姓必異故書𫝊通謂之舅氏渭水名也秦是時都雍孔氏曰雍在渭南水北曰陽晉在秦東行必渡渭地理志云又扶風渭城縣故咸陽也其地在渭水之北我送舅氏至於渭陽之道可謂逺矣而又贈之以路車乘黃者即叔于田所謂乘乘黃也乘黃四馬也悠悠我思言其心悠然而思也瓊瑰玉佩者瓊瑰毛氏曰石次玉孔氏以為瓊者玉之美名非玉名也瑰是美石之名也禮記曰見似目瞿聞名心瞿康公思其親見其似者如此況見母之兄弟乎秦康公之於舅氏既送之於渭陽之道又贈之以路車乘黃又贈之以瓊瑰玉佩則其愛舅之心厚矣其為太子之時念母不見其思念如此至於文公七年方即位其送舅氏已十七年後猶能追感其事則為康公者可謂孝矣然秦自伐殽之後日尋干戈以相征討昏姻之道既絶遂為仇讎之邦使康公即位能推其愛舅之心釋舊憾而修新好則秦晉之民不勝其幸其為孝豈不大哉考之春秋戰于令狐日尋干戈使兩國之民肝腦塗地則雖愛舅何以補哉孟子曰古之人所以大過人者善推其所為而已康公所以至於如此者不能善推所為故也黃講同權輿刺康公也忘先君之舊臣與賢者有始而無終也於我乎夏屋渠渠今也每食音似無餘于嗟乎不承權輿於我乎每食四簋音鬼今也每食不飽于嗟乎不承權輿李曰康公忘先君穆公之舊臣不加禮以待賢者有始而無終也詩人既刺康公忘穆公之業始弃其賢臣今又刺其忘先君之舊臣有始而無終也則康公之不待賢可知也于我乎夏屋渠渠今也每食無餘毛氏以為夏大也鄭氏以為屋具也渠渠謂勤勤也言康公始者于賢臣則設重饌以待之其意勤勤王肅則以夏屋為室屋之屋不以為屋具鄭氏所謂屋者以下文每食無餘是言飲食之事遂以上文為言飲食之具其說為曲不如王肅之說為簡然王肅曰屋則立之于先君食則受之於今君故居大屋而食無餘分先君康公求之於詩本無此意渠渠蘇氏以為深廣王氏以為大具蘇氏皆從王肅之說以為室屋之屋也四簋毛氏以為黍稷稻粱且方曰簠圎曰簋簋乃盛稻粱之器簠乃盛黍稷之器不應兼言盛黍稷稻粱也毛氏但見經文言四簋遂以為黍稷稻粱然不知簋乃盛黍稷之器非盛稻粱之器也言四簋者以黍稷分為四簋以見黍稷之多也承繼也權輿始也有夏屋之渠渠以待賢者之至及其後則每食無餘則待賢之意少衰其後每食不飽則又非特無餘於此見其有始而無終也故繼之曰于嗟乎不承權輿嗟不能繼其始也孟子曰食而弗愛豕交之也愛而不敬獸畜之也恭敬者幣之未將者也恭敬而無實君子不可以虛拘飲食之間固不足為輕重人君之待賢士非飲食則無以見其誠意鹿鳴之詩宴羣臣嘉賔也既飲食之又實幣帛筐篚以將其厚意然後忠臣嘉賔得盡其心矣夫忠臣嘉賔豈徒以口腹責望於君哉蓋不可以虛拘也觀此則知秦之賢者以每食無餘每食不飽刺康公苟不以意逆志則是飲食之間冝非賢者用心也昔楚元王敬禮申公白生等穆生不嗜酒元王每致酒常與穆生設醴及王戊即位常設後忘設焉穆生退曰可以逰矣醴酒不設王之意怠不去楚人將鉗我於市稱疾臥申公白生强起曰獨不念先君之德歟今王一旦失小禮何足至此穆生曰先王所以禮吾三人者為道之存也今而忽之是忘道也忘道之人胡可久處豈為區區之禮哉遂謝病去蓋人君待賢之心有始無卒則必見於飲食之間惟賢者見幾而作不俟終日此魯君燔肉不至孔子不脫冕而行楚元王醴酒不設穆生所以逺去之也以其人君之誠意不至不得不去也唐眀皇時薛令之為東宫官嘗曰朝日上團團照見先生盤盤中何所有苜蓿長闌干飯澀匙難捥羮稀箸易寬遂去觀薛令之去亦穆生之去也黃曰觀此一詩乃知康公待賢之禮不如其初而賢者之所以去也然區區飲食之微何足以為輕重而曰無餘不飽者非不知亟餽鼎肉為犬馬之畜也蓋以其禮意之衰耳故燔肉不至而孔子行醴酒不設而穆生逝孟子曰恭敬者幣之未將者也禮衰則敬衰賢者之去就亦當決於此歟陳宛丘詁訓𫝊第十二國風宛丘刺幽公也淫荒昏亂遊蕩無度焉子之湯他即反兮宛丘之上兮洵音荀有情兮而無望兮坎其擊鼓宛丘之下無冬無夏值直置反其鷺羽坎其擊缶宛丘之道無冬無夏值其鷺翿李曰武王封媯滿於陳以備三恪幽公其六世孫淫荒於女色而昏亂於政事自古人君惟其志有所惑則政事有不暇恤者矣淫荒昏亂而又遊戲放蕩以見其無所節度也子之湯兮宛丘之上兮至而無望兮子之湯兮毛氏則以子為大夫按此詩專刺幽公毛氏以子為大夫則以人君不可以稱子然觀山有樞之詩曰子冇衣裳子有車馬言子者蓋指晉昭公也晉昭稱子則知幽公亦稱子也湯蕩也宛丘爾雅曰宛中宛丘郭璞曰宛丘謂中央隆峻狀如一丘矣毛氏曰四方髙中央下曰宛丘二說不同毛氏之意則以謂宛丘是為中央宛然而下郭璞之意則以爾雅又曰山上有丘故謂其中央隆峻如一丘要之二說不同難為辨明詩人之意但言幽公遊蕩在宛丘之上信有荒淫之情而無威儀以為民望也蓋人君當正其威儀使民觀而象之然後能成其教以行其政令今幽公但縱其荒淫則何以為民之望哉坎擊鼓聲也鷺羽鷺鳥之羽也可以為翳爾雅曰鷺舂鉏郭璞曰今之白鷺也頭翅背上皆有長翰毛故可以為翳翳舞者所持以指麾也缶爾雅曰盎謂之缶孫炎曰瓦器郭璞曰盎盆也易曰不鼓缶而歌藺相如𫝊曰使秦王擊缶則缶者乃瓦器可以為樂器也翿即翳也爾雅曰纛也纛翳也纛值者毛氏以為持顔師古云以立為言以鷺鳥之羽以為翳立之為舞值或訓持或訓立雖則不同其意則一也夫以幽公擊鼓於宛丘之下擊缶于宛丘之道其聲坎坎然無冬無夏常秉鷺羽以為樂則無一日而不淫荒也王氏則以值為遭曰值者百姓厭苦之言夫以值為遭其詁訓明白勝於以為持以為立然詩人言之無冬無夏但言常然也如王氏說則又為百姓遭此鷺羽一節不如以為持立其說不迃曲也黃講同東門之枌符云反疾亂也幽公淫荒風化之所行男女弃其舊業亟欺冀反㑹於道路歌舞於市井爾東門之枌宛丘之栩兄浦反子仲之子婆娑素何反其下榖旦于差南方之原不績其麻市也婆娑榖旦于逝越以鬷子公反邁視爾如荍祁饒反貽我握椒李曰言幽公之淫荒其風俗之所行陳國之男女皆失其業而亟㑹於道路歌舞於井市也古者重男女之别而宫室之內尤致其謹男不入女不出不共寢席不同椸枷宫室之內猶且如此其在道路之間男子由右女子由左如此則荒淫之風何自而萌今也幽公先為荒淫之行此陳國之男女亦化而為淫荒其無恥甚矣市井者八家為井因以交易故為市井市井者因井以為市也東門之枌宛丘之栩枌爾雅曰榆白枌孫炎曰白者名枌栩者杼蓋以東門宛丘是國之道路交㑹男女所聚之處又有二木而人息于下是以子仲之子婆娑于其下也古者公孫之子以王父字為氏則子仲必是王父之字故以為氏也子仲者陳大夫也婆娑舞者之容婆娑然也榖善也差擇也蓋擇其善日也南方之原毛鄭以原為陳大夫按左傳莊公二十七年季友如陳葬原仲經曰南方之原而以原為氏不甚眀白故歐陽之說為勝歐陽以為南方原野則其說為簡徑言擇其吉日相期于南方之原野其婦人皆不紡績其麻以服女功之事而亦婆娑然舞于市也績說文曰紡也七月詩曰八月載績注曰蠶事畢而麻事起也毛鄭既以原為大夫氏而其下文曰不績其麻遂以為原氏之女故于上文子仲之子則以為男也歐氏既以為原野不以為大夫氏故於子仲之子則曰莫知其男女也逝往也越於鬷總也邁行也毛氏以鬷為數言以善日而往所㑹之處于是績麻者亦以麻總而行按詩言越以鬷邁只是言總集而行商頌曰鬷假無言亦是訓總不必以為麻總也視爾如荍貽我握椒言其相遇之男女相說為我視汝如荍之花言其顔色之美如此而爾又遺我握椒言相與游蕩而無耻也爾雅曰荍芘芣也郭氏曰今蜀葵也似葵紫色謝氏曰小草多花少葉又翹起其遺我以握椒者孔氏曰椒實芬香故以相遺也論曰上有所好者下必有甚焉古之人君有所好於上則大夫從而視效之大夫既翕然而為之則國人未有不化之者襄公淫荒在位如孟姜孟庸亦皆化之陳幽公淫荒而子仲之子亦皆為之為世族大夫猶且如此則國人可知矣然當時所以至於如此者蓋本於幽公幽公所以至於如此者又有所本漢地理志云周武王封舜後媯滿於陳是為胡公妻以元女大姬婦人尊貴祭祀用史巫故其俗好巫鬼鄭氏亦曰大姬無子好巫覡禱祈鬼神歌舞之樂民俗從而為之是民之好歌舞者又皆本於大姬矣書曰敢有恆舞於宫酣歌于室言其歌舞無節若巫覡然故謂之巫風惟巫覡常以歌舞為事大姬既化而為巫覡之事矣幽公又化而為遊蕩歌舞於宛丘之上幽公既好之故其臣如子仲之子亦化之而婆娑於枌栩之下淫荒之事其來有漸顔師古於值其鷺羽則曰舞以事神于婆娑其下則曰歌舞以娛神按詩所言固是譏其好歌舞原其所由則本大姬之所致是非歌舞事神乃為樂耳師古之說非也蘇曰國之風俗各有所本晉有堯之遺風而儉不中禮陳以大姬之餘而遊蕩無度亦理勢然也此說是也黃曰嘗觀豳之風俗其男耕其婦饁其女桑至於八月載績則蠶事畢而麻事起矣至於嵗功既成則躋公堂稱兕觥而祝其君以萬夀焉今陳之風俗至於男女不紡績其麻市也婆娑弃其舊業而歌舞於市井此所為上有好者下必有甚焉者也幽公淫荒昏亂游蕩無度則其在位世族亦如之此勢之所必然者雖然亦非獨幽公之罪也陳自大姬好巫覡禱祈鬼神而樂為歌舞其國俗之化非一日矣噫晉有堯之遺風而儉不中禮陳以大姬之餘而游蕩無度國之風俗亦各有所本哉衡門誘音酉僖公也願音願而無立志故作是詩以誘掖其君也衡門之下可以棲音西遲泌悲立反之洋洋可以樂音洛飢豈其食魚必河之魴音房豈其取去聲妻必齊之姜豈其食魚必河之鯉豈其取妻必宋之子李曰周宣王時僖公幽公之子也願慤而無自立之志故國人作此詩以誘掖之也誘進也掖扶持之力也此詩當且從歐陽說首章則言陳國雖小苟有志于為治亦可以有為二章三章則言何必大國然後可以有為衡門雖淺陋若居之不以為陋則亦可以棲遲泌水之洋洋然若閲之而樂則亦可以忘飢皆言陳國雖小亦可以有為也特患無其志耳食魚者凡魚皆可食也若必魴鯉而後食則終身有不得食者矣娶妻者諸姓皆可娶也若必齊宋而後娶則終身有不得娶者矣言必待大國而後有為苟無大國則終身不得有為者矣衡門者橫木為門門之深者有阿孰堂宇此惟橫木為之言其淺陋也棲遲爾雅曰息也泌水毛氏曰泉水也洋洋廣大也樂飢可以樂而忘飢也鄭氏以為療飢鄭氏喜于改字不可從也魴邉魚也陸農師舉里語曰洛鯉河魴貴于牛羊則魴鯉乃魚之美者齊姜姓也齊者伯夷之後伯夷主四嶽之職賜姓曰姜宋者子姓也殷之苖裔契之後也舜封契於商賜姓曰子春秋左氏𫝊所謂齊姜莊姜皆是齊之女也所謂聲子仲子皆是宋之女也此詩與甫田詩辭雖反而意則同齊襄公自以為必得諸侯然徒有其志而不修其德故抑之而曰無田甫田維莠驕驕僖公自以為小國不足以有為願而無自立之志故進之曰衡門之下可以棲遲泌之洋洋可以樂飢蓋為國者不可以無志也有其志而無其效者有之矣未有無其志而有其效者也僖公願而無立志其不能有為者必矣齊襄公雖有志而無其實故有志於求諸侯而無得諸侯之道亦將不能有為其與無志也亦何以異然甫田之詩正猶孟子所謂以若所為求若所欲猶緣木而求魚今之諸侯猶七年之病求三年之艾苟為不蓄終身不得者也此詩正猶孟子謂為長者折枝語人曰我不能非不能也不為也今日舉百鈞則為有力人矣然則舉烏獲之任是亦烏獲而已矣夫人豈以不勝為患哉弗為耳然學者之於詩要當通之于言意之表不可泥于文辭之末如必以此詩言事親之說而求之以事親之事以此言修身之說而求之以修身之事是守株待也甫田之詩雖以刺襄公之志大心勞然亦可以為學者修身之道也衡門之詩雖以誘掖僖公之立志然亦可以為學者處世之道也夫尊其所聞則髙明行其所知則光大不尊其所聞則安得而髙明不行其所知則安得而光大學者能三復甫田之詩所謂婉兮孌兮總角丱兮未幾見兮突而辨兮則德修罔覺矣榱題數尺所安不過容膝食前方丈所食不過一飽學者能三復衡門之詩所謂豈其食魚必河之魴豈其取妻必齊之姜則可以視富貴如浮雲耳此二詩學者可以一唱而三嘆也黃曰此詩言陳國雖小苟有志於為治亦可以有為特患其無志耳橫門之木亦可以休息泌泉之水亦可以忘飢孰是陳國而不可有為乎以其國之小而遂甘心于自弃則是食魚而必魴鯉無魴鯉則終身不可食邪娶妻必宋齊無宋齊則終身不可娶邪湯以七十里而為政於天下未聞以千里而畏人者也此孟子誘引齊宣之意亦詩人誘引僖公之意歟東門之池刺時也疾其君之淫昏而思賢女以配君子也東門之池可以漚烏豆反麻彼美淑姬可與晤五故反歌東門之池可以漚紵直吕反彼美淑姬可與晤語東門之池可以漚菅古顔反彼美淑姬可與晤言李曰此詩言陳君淫亂使其得賢女以配之未必至於此詩人所以疾其君而思之也東門之池可以漚麻說文曰久漬也周官考工記㡛氏以涗水漚其絲注云漚漸也則漚有漸漬之意東門之池有此池水可以漬麻以為衣服以譬國有賢妃夙夜警戒使君子入於善而不自知以成其德亦如池水之漚麻也蘇黃門曰婦人之於君子日夜相與無間庶可以漸革其暴如池之漚麻漸漬而不自知此言是也惟賢女可以輔佐君子故國人思得彼美善之淑女可以為君對而歌也淑賢女也孔氏曰以黃帝姓姬炎帝姓姜二姓之後子孫昌盛其家之女美者尤多遂以姬姜為婦人之美稱晤者對也歌者孟子曰仁言不如仁聲之入人深也歌者長聲可以感發人之善意晤歌亦有漚麻之意晤言亦是此意紵者說文曰麻屬也細者為絟粗者為紵陸氏曰紵亦麻也科生數十莖宿根在地中至春自生不歲種也荆揚之間一歲三收今官園種之歲再刈刈便生剝之以鐡若竹挾之表厚皮自脫但得其裏韌如筋者謂之徽紵左傳鄭子産獻新紵于吳季札即此是也菅者茅之屬已漚為菅未漚為茅陸氏曰菅似茅而滑澤無毛根下五寸中有白粉者柔韌冝為索漚乃尤善矣其說是也詩人之意皆以麻取譬為漸漬之久以言婦人之于君子亦可以漸漬以成其德自古人君修身慎行而無流連荒亡之禍者非其獨有正臣義士獻可替否以格其非心亦由賢妃正女夙夜警戒以相成其德周宣王夜臥晏起姜后乃脫簪珥待罪于永巷使其傅母通言于王曰妾不才淫心見矣致使君王失禮夜臥而晏起宣王曰寡人之罪夫人何遂勤于政事早朝晏退遂成中興之治齊桓公好淫樂衛姬為之不聽鄭衛之聲楚莊王之初即位好田獵畢弋樊姬諌不止乃不食鳥獸之肉三年王遂勤政事不倦此三君者皆由內有良佐以成其德也使周宣王齊桓公楚莊王而無賢妃以為之配則未必不如陳幽公使幽公有姜后樊妃衛妃以道輔佐其君子未有不能幡然改志而遷仁義也故詩人思得賢女以配君子也中才庸主惟其為女寵所惑第裯既交則情與愛遷顔辭媚熟則事為私奪日夜相與則漸漬其惡而不自知惟得其賢妃貞女淑範懿行為之內助則人君相勸而為善亦漸漬而不自知也詩人以漚麻譬之可謂能近取譬矣不獨人君為然匹夫之微得賢女以為助則薄夫敦頑夫亷矣吳許升少為博徒而不操行妻吕榮躬勤家業以奉養其姑數勸升修學每為不義輒流涕進規榮父積忿疾升乃呼榮欲改嫁之榮歎曰命之所遭義無離二終不肯歸升感激自厲乃尋師逺學遂以成名是以德盛名立而不自知許升其始也自為不義及其終乃能悔過遷善而得與士君子之列其不可誣也如此然漚麻以喻取其漸漬不特見於夫婦之間人之習為善惡亦皆如此始習為惡其久也則為惡人始習為善其久也則為善人優而遊之饜而飫之然後安其學而親其師樂其友而信其道日漸月漬德盛仁熟不知其所以然而然者其習於惡者亦然故古人謂積善在身猶長日加益而不自知積惡在身猶火銷膏而人不見荀子曰蘭槐之根是為芷其漸之􅎵君子不近庶人不服其質非不美也所漸者然也古人又曰學之漸人也甚於丹青其初則炳久則渝此皆是復習積慣久而自至不可以驟然而得也黃曰古之人君修身慎行而無荒淫之過者非特有忠臣良士以格其非心而亦內有賢妃正女夙夜警戒故關雎之樂得淑女雞鳴之思得賢妃皆本于袵席之助而為歌詠也宣王晏朝而姜后脫簪以待罪齊桓好淫樂衛姬為之不聽鄭衛之音楚莊好田獵樊姬為之不食鳥獸之肉皆能易怠而勤易昏而明賢女之助豈小補哉東門之楊刺時也昏姻失時男女多違親迎去聲女猶有不至者也東門之楊其葉牂牂子桑反昏以為期眀星煌煌東門之楊其葉肺肺普背反昏以為期眀星晢晢之世反李曰昏姻失時者言失其嫁娶之時也男女多違者言男子親迎而女不從所謂多違也昏姻失時即詩謂東門之楊也男女多違即詩謂昏以為期眀星煌煌也東門之楊爾雅曰楊蒲桞也郭氏曰可以為箭左氏所謂董澤之蒲是也牂牂盛也肺肺毛氏曰猶盛也煌煌晢晢皆言其星眀也毛氏以秋冬為昏姻之時鄭氏以仲春為昏姻之時毛氏之意則以荀子曰霜降逆女冰泮殺止家語曰羣生閉藏乎隂而為化育之始故聖人以為合男女窮天數也霜降而婦功成嫁娶者行焉冰泮而農桑起昏禮殺於此毛氏之說據於此鄭氏之意則以周官曰仲春之月㑹男女之無夫家者觀此兩說毛氏為勝按匏有苦葉之詩曰士如歸妻逮冰未泮而歸妻是秋冬之間可以為嫁娶之時也鄭氏於士如歸妻逮冰未泮則可以為請期二月可以昏矣據詩言歸妻則實已逆女安得以歸妻為請期乎然據周禮仲春之月㑹男女之無夫家者下文又言于是時也奔者不禁則是於霜降之後冰泮之前使民皆得行嫁娶之禮及至仲春之月猶有男女之無夫家者則以媒氏㑹之是以有奔者不禁之事先王立法不應専用仲春之月其法必不如是之密也東門之楊其葉牂牂蓋楊以感陽氣而生今其葉牂牂肺肺然茂盛是春夏之交也則失昏姻之時可知矣程氏曰楊最得陽氣之先者言人反不及時陸氏曰楊之發拆首於衆木昏姻失時則木之不如也此說亦與程氏同是亦一說也昏禮自納采至請期皆用旦匏有苦葉所謂雍雍鳴鴈旭日始旦是也親迎則用昏此詩所謂昏以為期是也禮記曰昏禮不用樂幽隂之義也不用樂亦是以昏親迎之意孔氏曰男女親迎用昏時以為期今女不肯時行至於明星煌煌而夜已極深而不至禮當及時配合女當隨夫而行至使昏姻失時男女多違如是此說是也蓋男子以昏時為期乃至于明星煌煌晢晢則婦人不至可知矣此詩所以刺之也自周之衰昏姻之禮廢而不修春秋書紀裂繻來逆女則是外之親迎也逆婦姜于齊是內親迎也著之詩刺不親迎惟其親迎之禮廢故陽唱而隂不和男行而女不隨東門之楊之詩雖行親迎而女不至女之所以不至者蓋當時淫風大行遂相奔誘女留他色不肯行也昏禮父親醮子而命之迎子承命而行主人筵几於廟而拜迎於門外壻執鴈入揖遜升堂再拜奠鴈降出御婦車而壻授綏御輪三周先俟於外婦至壻揖婦以入其周旋進退威儀容止可觀如此今乃弃之而不肯為至於鑽穴隙相窺踰牆相從父母國人皆賤之乃甘心為之世所以至此者非民之罪上人之罪也黃曰此詩如丰之詩言陽唱而隂不和男行而女不隨亦男女多違親迎女猶有不至者也楊葉始生為楊之得時牂牂然過盛則過時矣興親迎者以昏為期今也眀星煌煌則過也肺肺則葉益盛矣晢晢則星益眀矣夫昏姻之禮為其正而已正而不從則是不從父母之命而甘于父母國人之賤者也風俗至此豈由民之罪哉上失其道民散久矣墓門刺陳他也陳他無良師傅以至于不義惡加於萬民焉墓門有棘斧以斯之夫也不良國人知之知而不已誰昔然矣墓門有梅有梟萃止夫也不良歌以訊之訊豫不顧顛倒思豫李曰陳他者文公子桓公之弟也桓五年甲戌己丑陳侯鮑卒於是陳亂他殺太子免而代之桓公病病而亂作國人分散此正所謂不義也其所以至于不義惡加于萬民者以其無良師傅訓導之也故詩人推本而言之墓門有棘斧以斯之斯說文曰析也爾雅曰斯離也孫炎曰斯析之離然則斯者有離析之狀墓門有棘言墓道之門不修治之則有棘生焉棘生則冝以斧開析而去之言他之為不義冝得良師傅以誘導之則可以格其非心夫也不良夫謂師傅也惟他必得賢輔夫然後可以磨厲訓迪而去其非心今他之師傅不良則其至於不義惡加于萬民也故雖國內之人皆知之而已獨不知之國人知之而不能去者則以他習成其惡而不自知也故曰知而不已誰昔然矣程氏曰衆皆知之已獨不之知自昔誰如是乎此追咎自他幼小不得師傅遂成其惡誰昔然矣後來誰如是乎此言是也賈誼曰習與正人居之不能無正猶生長於齊不能不齊言也習與不正人居之猶生長於楚不能不楚言也秦使趙髙傅胡亥豈胡亥之性本惡哉蓋其所以導之非其人故也此言正詩所謂誰昔然矣梟惡聲之鳥一名鵩鳥陸氏疏曰梟大如班鳩緑色惡聲之鳥也入人家凶賈誼所賦鵩鳥即此是也墓門有梅有梟萃止萃聚也言梅雖美木而生於墓門荒蕪之地則有惡鳥集焉言他之性本善而師傅之不良則惡歸之矣上言墓門有棘斧以斯之不能去其不善而復于善此章言墓門有梅有梟萃止蓋言他之性非不善也所以輔導者非其人耳夫也不良歌以訊之言他師傅不良故我作歌以訊告之告之而汝不我顧至于顛倒乃知思我之言也方其未遭患難之時聞此言則未必以為然及其既遭患難則必悔之何所補哉顛倒急難之際也他雖殺太子免而代之未幾而為蔡人所殺是所謂顛倒也毛氏曰至于顛倒而惡加於民以惡加萬民為顛倒非矣論曰天下之禍莫大于不善人得志于世君以為賢而信任之天下皆知其必至於禍敗而已則不知也天下皆知而已獨不知則必至於顛倒而後悔也申屠剛謂隗囂曰夫未至豫言固常為虛及其已至又無所及是以忠言正諌希得為用也使人君能於未至而聽納忠鯁之言則天下安有顛倒之患哉惟其事未至則忽而不信或指之以為狂妄及其已至雖能悟其忠而悔其不從則是噬臍爾唐明皇天寶間李林甫以佞諛見用而張九齡以忠言見黜當此時必以林甫為賢而以九齡為不才也及其禍發幽陵身竄巴蜀乃知九齡之先見而悟林甫之嫉賢妒能也豈非所謂顛倒思豫者乎至于德宗用一盧杞以致涇卒之變亦可悟矣猶謂盧杞非姦邪夫眀皇德宗委任非人以取播遷之辱其禍一也眀皇猶能於顛倒之時而思豫固無益於禍敗也然比德宗于顛倒之後而尚不悟則眀皇為猶賢也若德宗者真所謂下愚不移者也黃曰按春秋桓公五年陳侯鮑卒於是陳亂文公子他殺太子免而代之此正所謂不義也此詩必是陳國耆舊之臣見陳他師傅之不良而知其有後日之不義嘗歌詠以風告之矣而其君之不我聽也故及其有今日之亂而追咎於無良師傅蓋師傅者所以朝夕而訓導之也少成若天性習慣如自然豈一朝一夕之故乎賈誼曰習與正人居猶生長於齊不能不齊言也習與不正人居猶生長於楚不能不楚言也秦趙髙傅胡亥豈胡亥之性本惡哉蓋其所以導之者非其人故也陳他弒逆之惡使其有賢師傅以教之長其善而去其惡豈至是乎故此詩以為歌以訊之顛倒思豫言其昔日嘗告之先君而先君不我信今亂已成矣雖思我之言將何及邪唐太宗髙麗之敗而後思魏徴唐德宗播遷之後而思陸贄凡人之智能見已然而不能見未然待其已然而後悔之亦奚及矣防有鵲巢憂讒賊也宣公多信讒君子憂懼焉防有鵲巢邛有旨苕徒雕反誰侜陟留反豫美心焉忉忉都勞反中唐有甓蒲歷反邛有旨鷊五歷反誰侜豫美心焉惕惕吐歷反李曰此詩言宣公信讒讒人將巧發竒中以賊害善良此君子所以憂懼也防有鵲巢邛有旨苕蘇氏曰防邛皆丘陵也毛氏以防為邑名王氏則以為止水之防蘇氏說苕者草名也孔氏引苕之華𫝊云苕陵苕此直曰苕草彼陵苕之草好生下隰此則生於髙丘與彼異也陸氏曰苕蔓生莖如勞豆而細葉似蒺藜而青其莖葉緑色可生食如小豆藿也王氏則以苕謂為掃除不祥苕即陵霄花緣樹而生其花可愛故曰旨苕中唐爾雅曰廟中路謂之唐瓴甋謂之甓李巡曰瓴甋一名甓郭氏曰㼾甎也今江東呼為瓴甓鷊亦草名也爾雅曰鷊綬也郭氏曰小草雜色似綬也陸氏曰鷊五色作綬文故曰綬草陸璣則又以鷊為鳥名綬鳥一名鷊亦或謂之上綬下有囊如小綬五色食之甚美此數說異端當從歐陽氏其說謂讒人之譖君子非一朝一夕之故必由積纍而成如防之有鵲巢積漸構成之爾又如苕饒蔓引牽連將及我也中唐有甓非一甓也亦以積纍而成㫖鷊綬草雜衆色以成文猶多言交織以成惑義與貝錦同此說為勝孔氏則引毛鄭之說而發眀之曰防多樹木故鵲鳥往巢焉邛丘地美故㫖苕生焉以言宣公信讒故讒人集焉此說固通至于邛有旨鷊則不可以如此說惟其中唐有甓其說不行則知毛鄭之說為不可從王氏則以四章分而為四每句各有一說逐句各生文義則其辭牽强固已勞矣蘇氏則又為防有鵲巢衆鳥皆得居之邛有旨苕衆人皆得采之朝有讒人而不眀則君子不保其祿位其取喻為不切程氏則以防有鵲巢中唐有甓以興不善以旨苕旨鷊興善則是以二句分為善惡也皆不如歐陽氏說侜說文曰有壅蔽也豫美者言我所美者君也此詩言美與葛生之詩所謂豫美亡此同葛生所美指夫也蓋婦人所美者夫故也此詩所美者謂君也蓋我之所美者君故也惟其讒言積纍而成是以壅蔽我君以斥去君子也謂此者誰乎而我心惕惕忉忉也言誰者指讒人蓋不欲斥言其人也忉忉惕惕皆憂也黃曰宣公好信讒而君子憂懼及已以謂讒言惑人非一朝一夕之故必由積纍而成如防之有鵲巢積漸結成之又如苕華延蔓將及我也中唐有甓非一甓亦以積纍而成旨鷊綬草雜衆色以成文猶衆言交織以成惑曰旨云者言甘言美語竒禍巧中此宣公之所以信而君子之所以懼也然所以致讒言之多者由宣公之不明故爾使宣公君臣之間相愛如父子相信如兄弟則讒言何自而入乎受之則至不受則何所容致之則入不致則安從入上官桀之黨有譖霍光者昭帝輒怒曰大將軍忠臣先帝所屬以輔朕身有毁者坐之自是無敢復言則知讒言之所以惑人者皆其不明之過也故詩言憂讒賊而序言宣公多信讒蓋謂此歟月出刺好色也在位不好德而說美色焉月出皎兮佼古卯反人僚兮舒窈鳥了反糾其趙反兮勞心悄七小反兮月出皓胡老反兮佼人懰音栁兮舒懮于久反受兮勞心慅七老反兮月出照兮佼人燎力召反兮舒天于表反紹兮勞心慘七感反兮李曰月出皎兮說文曰皎月之白也方言曰自關之東河濟之閒民好者謂之佼孟子曰子都之佼是也僚亦好貌舒遲也窈糾者舒之姿也此言月之初出其皎然而白以喻婦人形體僚然而好也非特形體之僚其容止則舒遲而窈糾其可美如此不能見之是以使我心思之故悄悄然而憂也此蓋言其好色也王氏曰女隂物也而晦時月出之皎也則非時之晦矣而又佼僚者不得相悅其說為甚鑿說者又言月臣道也陳之大夫有臣之道不皎于國政而皎於國之婦人此說尤鑿於王氏不如毛鄭之說為簡徑懰與燎皆好貌也懮受夭紹皆舒之姿也慅慘皆憂也夫當時在位之臣聞其婦人顔貌之美好又聞其容止之舒遲思而見之不得其心則憂好色如此安能好德哉德之與色不兩立也未有好色而能好德者亦未有好德而能好色者陳大夫於佼好之婦人其思之也如此則其惑於色者甚矣必不能好德也孔子曰吾未見好德如好色者也陳大夫能移其好色之心而好德其未得也則惟恐其不及其已得也則惟恐其不留如此則豈不為賢大夫哉唐李習之曰有人言曰某所有女國色也天下之人必極其力而求之無所愛矣有人告曰某所有士國士也天下之人不一往而見之豈非不好德而好色者乎此誠名言也大抵人之常情從善如登從惡如崩好色之人常勝于好德好利之心常勝于好義惟在反求諸已而已矣黃講同毛詩集解卷十五
