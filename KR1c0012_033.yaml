body:
  text: 毛詩集解卷三十三宋李樗黃櫄撰公劉召康公戒成王也成王將涖政戒以民事美公劉之厚於民而獻是詩也李曰成王將涖政其年尚幼召公懼其驕心易生故以公劉所以厚於民事者而戒之觀七月之詩周公告王者也其詩之所陳言稼穡勤勞農桑等事此詩之告王者其詩之所陳則言宫室勤勞等事其詩雖不同而言民事則一也成王之時享盈成之治天下無事矣而又生於深宫之中長於婦人之手未嘗知憂未嘗知懼茍不陳先王之勤勞而言之則稼穡之事或懵而不知無逸曰相小人厥父母勤勞稼穡厥子乃不知稼穡之艱難乃逸乃諺曰昔之人無聞知夫小人之無所不為以其不知稼穡之艱難故也故曰昔之人無聞知雖先人之勤勞且忽之矣今成王幼沖之年處太平之世茍為趨事於逸遊而不知戒懼則必以先祖之勤勞為徒勞也故召公諄諄而訓戒之則召公之心可謂勤矣蓋自古人臣之戒其君者必止於未形也以武王之盛德受一旅􅋙未足為過而召公作書而訓戒之懼其此心之一開也况成王中才之主其年又幼召公安得不以此為警戒哉黃曰進貧窶之説於有餘者之前進愁嘆之説於燕笑者之前説之者益諄諄聽之者若罔聞吁吾不懼夫聽者之不孚而深咎夫説者之無術也蓋身之所歷者不待告而喻目之所見者不待言而知若夫身之所未嘗歷目之所未嘗見卒然説之而強其我從使之忘其有餘而知貧寠者之情厭燕笑之樂而知愁嘆者之可恤此人情之所必難者也然茍得其道焉此不難進彼不難受人情之所必難者而吾能使之欣然以從我召康公之戒成王蓋得其道矣文武之業盈成矣成王居而有之文武之治太平矣成王出而享之涖政之初萬幾之繁所未知也小民之依所未知也盈成太平之治方可以適吾之欲而召康公乃遽欲以小民之事戒之誠人情之所難者而康公也不以民事戒成王而以公劉望成王一篇之中無一語以為成王戒而推美公劉之所以厚於民者如此吁此召康公進戒之微權也夫人之常情論上世則以為迂言他人則以為異惟乃祖乃父是人情之所素信者也康公謂以民事戒成王成王未必聽惟美公劉之厚於民言存於美意存於戒言在公劉意在成王知公劉之可尊則知民事之可重矣知公劉之可信則知召公之言不可忘矣康公不能必成王之信乎我而能必成王之信公劉吁善進戒於君者皆如是也七月之詩舉趾穫稻之事小民婦子之情莫不備述無逸之書論小民之依者尤詳而勤勤於七嗚呼三不敢之義者尤切要之七月之詩必以后稷先公為戒而無逸之書必以太王王季文王為説吁此進戒之微權也篤公劉匪居匪康乃埸乃疆乃積乃倉乃裹餱糧于橐于囊思輯用光弓矢斯張干戈戚揚爰方啓行李曰篤公劉匪居匪康此章言公劉遷豳之始也先儒之説以匪居謂不可以居為居匪安謂不可以安為安雖有疆埸且置而棄之乃裹此糧食於囊橐之中以思輯用光詩人之意恐不如此者孟子曰昔者公劉好貨詩曰乃積乃倉乃裹餱糧于橐于囊思輯用光弓矢斯張干戈戚揚爰方啓行故居者有積倉行者有裹糧然後可以爰方啓行也孟子之言為得詩人之意篤厚也夫以篤厚哉公劉之為民也不以所居為居不以所安為安其疆埸則治其倉廪則富然後裹其餱糧而置於橐囊之中以思和輯其人民光其基業乃持其兵器開啓其道路而行以遷於豳也蓋非倉廪之富則何以有餱糧非餱糧之備則何以爰方啓行也孟子所謂居者有積倉行者有裹糧然後可以爰方啓行也小曰橐大曰囊戚斧也揚鉞也左氏曰君王命剝圭以為鏚柲文則從金即此戚是也啓行開啓其道路而行也史記曰不窋末年夏后氏政衰去稷不務不窋以失其官而奔戎狄之間不窋卒子鞠陶立鞠陶卒子公劉立公劉復修后稷之業務耕種行地宜自漆沮渡渭取材用行者有資居者有蓄積民賴其慶百姓懷之多徙而保卬焉史記所謂行者有資居者有積即此所謂乃積乃倉乃裹餱糧是也其曰自漆沮渡渭取材用即末章所謂涉渭為亂取厲取鍛是也詩之六章各有次序不應先言自漆沮渡渭取材用方言行有資居有蓄史記之文失其倫序多矣公劉既已遷於豳而史記乃謂之慶節徙國於豳與詩人之言大相違戾學者從詩而舍史記可也黃曰此詩六章皆以篤公劉一句冠其章首篤之為言厚也書言公劉克篤前烈而此詩言篤公劉其言異而意同原詩之意蓋曰篤哉公劉之為民也所居可以安矣而不敢以自安何為不敢哉篤於為民則忘於為己故治其疆埸積其倉廪然後裹其餱糧置之於橐囊之中而以為啓行之資小謂之橐大謂之囊曰橐曰囊指其器也行者有裹糧然後可以和輯其人而光大其基業張其弓矢干戈戚揚之器以啓其道路而遷於豳夫公劉不輕於用民也必先有以蓄民之財洽民之情而後用民之力其篤於為民之心可於是而見之矣後世厚於為己薄於為民疆埸不治倉廩不繼一旦卒然有警羽檄一馳而民力四起千里餽糧民有菜色飢者弗食勞者弗息而民命塗炭矣由是觀之則公劉之所以為吾民之計者如此其至非厚於民者能如是哉史記曰公劉修后稷之業耕種治地行者有資居者有蓄史記之言其此詩之證歟昔孟子答齊宣王好貨之説而論此章曰居者有積倉行者有裹糧然後可以爰方啓行吁孟子何其深於詩也然後可三字足以見公劉厚民之心而挽齊王好貨之心孟子之善言詩如此哉篤公劉于胥斯原既庶既繁既順乃宣而無永嘆陟則在巘復降在原何以舟之維玉及瑤鞞琫容刀李曰篤公劉胥相也巘小山别於大山也舟帶也言公劉之相此原地也民既庶矣既繁矣而又順矣乃宣之使出耕作民皆欣然趨事赴功而無愁嘆之聲也此以見民之樂從於是陟而在巘降而在原相其形勢度其土宜以見其用心反復於民也民於是願帶之以玉瑶鞞琫容刀之佩也皆民愛其君如此黃曰君民之心未嘗不同君民之情未嘗不通君焉忘己而為民則民焉愛君如愛己君薄於民民始薄於君矣公劉之厚於民凡其所以為民之心無所不至方其始也相土以為居使之無離散之患及其既繁庶而且和穆也則復從而宣𨗳之使之無怨嘆之聲若是亦足矣而公劉之心猶不自己方且陟而在巘復降在原巘小山别大山也陟巘降原所以相其形勢度其土宜以為斯民永久之利其為民之心諄復不厭惟公劉以民為心故民亦以公劉為心曰何以舟之舟帶也何以舟云者斯民之心蓋以為吾君之為民如此吾民其何以報之哉於是願帶之以玉瑶鞞琫容刀之佩也此其愛君之意也説文云玉瑶所以稱其君之文德容刀所以稱其君之武德又云下曰鞞上曰琫要之詩人之情其惡是人也必言其車服之盛佩玉之飾以見其不足以稱之其善是人亦必言其車服之盛佩玉之飾以見其足以稱之是故瓊瑰之贈晉人所以念康公之親瓊琚之報衛人所以答威公之義維玉及瑶鞞琫容刀周人所以報公劉之德吁其孰謂民愚哉篤公劉逝彼百泉瞻彼溥原乃陟南岡乃覯于京京師之野于時處處于時廬旅于時言言于時語語篤公劉于京斯依蹌蹌濟濟俾筵俾几既登乃依乃造其曹執豕于牢酌之用匏食之飲之君之宗之篤公劉既溥既長既景乃岡相其隂陽觀其流泉其軍三單度其隰原徹田為糧度其夕陽豳居允荒篤公劉于豳斯館涉渭為亂取厲取鍛止基乃理爰衆爰有夾其皇澗遡其過澗止旅乃密芮鞫之即李曰篤公劉上章既言其定民之居此章則言相宇者王氏曰先定民居而後相宇厚於民故也言公劉相宇也逝往彼百泉之間瞻望其溥原相其可居之處以為未也猶升南山之脊見其可居者惟此京地則曰是乃京師之野於此可以處也可以廬舍其賔旅也可以施教令也言言語語者言於此而施教令也篤公劉此章言宫室既成可以燕樂羣臣也言公劉於京師之地依之而建宫室也其朝會之儀則蹌蹌濟濟公劉則命設几筵而待之賔既登席而依兒矣乃遂造其羣物之所搏豕於牢之中而烹之以為飲酒之殽而飲酒則酌之用匏而已王氏曰其食也則執豕于牢而已其飲也則酌之用匏而已言其儉也其儉如此則亦厚於民故也君既飲食其羣臣羣臣遂從而君之尊之羣臣皆愛其上不以菲薄而怨其君也篤公劉蘇氏謂此章宫室既成則治其田原既廣且長矣於是考之以日景以定其經界參之以高岡以相其隂陽寒暖之莭觀其水泉灌溉之利然後可以辨其土宜以授野人也其軍三單者蓋言古者天子六軍大國三軍大國之有三軍則以餘卒為羡今方遷豳通三軍之數而無有羡卒故其軍三單蓋以其始遷故也惟其通滿三軍之數而無有羡卒故度其隰原之田以什一之法取其民以為糧食也既而民益衆然後度其夕陽之地以居之則豳之居信乎其大也夕陽山西也夕乃見日也取民之法夏曰貢商曰助周曰徹皆良法也而周之徹法最為盡善孟子言之盡釋其端而自於公劉始後世從而守之則公劉之法可謂善也篤公劉此章言宫室既成遂作館舍之時先使涉渭乘舟絶水為亂而過取厲取鍛以厲其器用乃正其作舍之基以治其事而行旅之人歸者甚衆其澗之所在則或夾其皇澗或遡其過澗遡者鄉也開門而向澗也皇澗過澗皆澗之名也以見其行旅之多也芮鞫之即芮鞫皆水之所也水之內曰芮水之外曰鞫止旅乃密芮鞫之即言行旅之多而得其所安也以見其治道之盛雖行旅猶如此則其居者可知也周自公劉至於文王武王凡四遷公劉遷於豳太王遷於岐文王遷於豐武王遷於鎬豐鎬之遷無所經見惟綿詩言太王遷於岐此詩言公劉遷於豳是皆所以為民也而後世不知遷徙之勞安然而有之此召公所以致意於此也黃曰建國之法先王畿而後邦國使民知有尊也今也公劉之遷豳先定民居而後相上宇其為民之心何如哉厚之至也夫公劉之相宇往彼百泉之間望彼廣原之地蓋將以度其所宜處而奠民居也故復升於南山之脊見其可居者惟此京師之野於是處乎此而廬旅乎此廬旅者為賔旅往來之舍也公劉之建邦非欲利己蓋欲利人非欲便於吾國亦欲便於他國故必使行旅者皆必出於其途而後見其處心之廣大如此于時言言于時語語者説者類曰於此而施政發令也豫竊以為不然蓋公劉之未遷也已有以得乎民之心既遷也復有以適乎民之欲是以公劉遷乎此而民樂從之如太王遷岐而民從之如歸市也故言言語語者以此見斯民歡悅之情笑語於此而非勉從也此喜色相告之意也吁公劉何以得此於民哉唐魏徵謂太宗曰陛下處臺榭則欲民有棟宇食膏梁則欲民有飽適愚謂公劉所以得民之道蓋如此也夫泂酌召康公戒成王也言皇天親有德饗有道也泂酌彼行潦挹彼注兹可以餴饎豈弟君子民之父母泂酌彼行潦挹彼注兹可以濯罍豈弟君子民之攸歸泂酌彼行潦挹彼注兹可以濯溉豈弟君子民之攸塈李曰書云皇天無親克敬惟親天之所以親於人君者惟其有德故也其曰親有德饗有道其意一也然而所謂道德者果何自而見之哉觀之斯民可見矣民之於君好之如芝蘭親之如父母則是道德之盛也如其怨歎之聲不絶於口則是道德之衰也天之禍福於人君唯在其德之如何不在於祭祀之間也紂之亡也郊社不修宗廟不饗民乃攘竊神祗之犧牷牲其於祭祀之間如此此上天之所以降禍也則知紂之亡乃在於郊祀之不修也然如虞之粢盛豐潔而卒為晉所滅則是祭祀之豐潔又無益也以是知國之存亡在於道德之盛衰可知也泂酌彼行潦泂逺也言泂酌行潦之水置之大器之中待其澄清則挹之注於小器之中以此水而沃酒食之饎也饎酒食也夫以行潦之水其為物也微矣以薄陋之物薦之於天而天乃享之者則以樂易之君子可以為民父母故也民之視聽乃天之視聽民既從之矣則天安得而違之乎罍祭器也溉清也塈息也下二章皆是上章之意王氏徒見序言皇天親有德而饗有道遂於詩中求其所謂道德民之父母德也民之攸塈道也又其甚曰周道於是為盛故稱皇天焉使周微而無道將不得稱皇天乎何其陋也黃曰幽明無二理明此理者無二心立民長伯之理於敬事上帝之心得之諧萬民之理於事鬼神之心得之而吾夫子亦曰明乎郊社之禮禘嘗之義治國其如示諸掌乎蓋事神治人無過此一心心無二心則理固無二理也誠存於心以之事天則天必享以之治人則人必歸是故事天不在備物愛民不在小惠事天而出於誠心則雖禴祭可以受福二簋可以用享是心不誠則雖殺牛而祭福不至豐潔以祀天不親曾何益哉愛民而出於誠心則雖役民以築臺而猶子來以勸趨植羽以從禽而猶欣欣乎有喜是心不誠則雖移民移粟民不以為惠不鼓不擒人不以為仁將誰欺哉雖然人情猶知敬天而不知推事天之心以治人也蓋其心以為民愚也無知也彼蒙蒙蚩蚩而吾欲以誠化之豈不難哉自人君有是心而愛民之誠心衰矣大臣慮其如是也是以推事天之理以明治人之理謂天有是理民有是情冥冥之中無聲可聞無臭可接而誠心之存猶可以感通孰謂斯民而有不可化之理哉故泂酌一詩意在於告成王以治民之理而先假夫事天之理以喻之也作序者從而斷之曰言皇天親有德饗有道者其微意固有在然特曰皇天云者愚恐詩人之不止於此意請得而詳辨之夫其詩曰泂酌彼行潦挹彼注兹可以餴饎豈弟君子民之父母其次章曰可以濯罍豈弟君子民之攸歸其末章曰可以濯溉豈弟君子民之攸塈夫三章言酌彼行潦以薦鬼神而皆曰可以可以云者設辭也三章之終皆斷然以為豈弟君子民之父母民之攸歸民之攸塈實辭也如左氏言潢汙行潦之水可以薦鬼神可以羞王公而况君子結二國之信行之以禮又焉用質左氏之言蓋欲實其信禮之説而假薦鬼神之禮以明之也故觀詩人之辭當察其意之所在泥於言語之末則失其旨矣嘗觀於詩先設辭於彼而後立意於此者類亦不少泂酌之意豈異是哉為此詩者其意蓋曰泂酌彼行潦之水挹之於彼而注之於此以為用猶可以沃酒食之饎而熟之以祭則天之所享豈於物乎杳冥之中不可以言語通而齊戒潔誠猶可以致其享則治民之理何謂不然使為君而樂易之德不忘於心則雖善政未施而民已懷矣善教未行而民已孚矣其曰民之父母民之攸歸民之攸塈塈安也以見其豈弟之德在民之不能忘如此也濯罍濯溉亦無異議罍祭之器也溉祭之潔也要之以言事天之誠耳康公以豈弟之德望成王而先推享天之理以喻成王人皆謂康公之意言皇天之親有德饗有道愚謂康公之意假天之親有德以見斯民之歸有德假天之饗有道以見斯民之懷有道也夫天無私親惟德是輔則民罔常懷懷于有仁從可知矣故嘗謂為民上而謂民之難服者皆未有愛民之誠心者也茍其愛民之誠如事天之誠使民如承大祭則必不輕用民力矣臨民而如臨上帝則必不敢失民心矣吁天下之理莫過乎此心之誠也誠於愛民不必有赫赫然為民之功而民自懷之愛民不出於誠心則雖良法美意彰彰於天下而無益於嘆息愁恨之聲也大學論若保赤子之義而發明之曰心誠求之雖不中不逺矣夫赤子者飢寒之變疾痛之加彼未能以語人也然而保赤子者能得其情而順適其欲何哉父母之愛子誠心也心誠求之則赤子無難知之情矣天下之窮民其無告者何啻赤子之未能言者哉然君焉茍以誠心求之則萬里之逺若一堂之上萬口之異若一辭之戴吁此召康公戒成王之意也此召康公所以論享天之理以明治民之理也益之贊禹曰惟德動天無遠弗屆愚謂益之意在於告禹以苗民之易格而先假動天感神之理以明之也成王之告君陳曰至治馨香感于神明愚謂成王之意在於告君陳以頑民之易化而先推感於神明之理以喻之也吁泂酌之詩其微言實在於是為此詩者語焉而不詳愚故詳其説而辨之卷阿召康公戒成王也言求賢用吉士也李曰鄭氏云吉猶善也唐孔氏曰吉士亦是賢人但序者别其文以足句亦因經有吉士之文故也此説是也周自文王以來賢才羣聚於朝其所以遺後嗣者無以復加矣而召公猶以求賢用吉士為戒蓋人君之於人材欲其無所不用不可以為止於如是而不求也如漢祖之興謀臣如雨猛士如雲宜其不必以求賢為念也及得天下之後乃過沛而歌曰安得猛士兮守四方是其求賢之心無有己也成王處盈成之世召公懼其驕心易生怠於求賢也故切切然作詩以訓戒之則召公之愛其君者至矣周公之作無逸也陳民事之艱難以戒其君之逸豫而召公又作公劉之詩以戒成王厚於民事周公之作立政言用人之當否以戒成王之用賢而召公又作卷阿之詩以戒成王用吉士則周召之相其君者一道也而或者乃以二人不相悅豈不厚誣古人哉黃曰成王涖政之初而召康公謹先入之戒者三曰厚民曰饗天而以求賢用吉士終焉蓋曰愛民所以畏天而籲俊所以尊上帝三事而一理也推此三者雖堯舜之治不能加毫末於此矣康公何其善告於君哉後世人臣不以堯舜之所以治天下者望其君故不能以其大者要者而告其君政事之末條目之細無益於天下國家者乃敢上章喧譁至於任用之非人忠邪之不辨而古人所謂罔不興罔不亡之由者則皆默默而不敢一言吁盍亦以康公之所以告成王者而告其君哉故嘗謂成王即位之初周公左召公右康公既戒之以求賢用吉士而周公作立政之書亦曰勿以憸人其惟吉士二公之戒皆天下治亂之本成王所以得為賢君成周所以得為至治者二公之力居多雖然曰求賢曰用吉士初非有異也作序者因詩人有吉士吉人之辭而及之耳若求為異説則為此詩者既曰吉士又曰吉人亦有異義也豈其然乎有卷者阿飄風自南豈弟君子來遊來歌以矢其音李曰卷曲也飄風回風也毛氏曰惡人被德化而消猶飄風之入曲阿也不如鄭氏云大陵曰阿有大陵卷然而曲回風從長飬之方而來入之喻王者當屈體以待賢者賢者則猥然就之鄭氏之説為勝惟人君能如卷阿之受風故樂易之君子皆來告之以善夫苟不好善則人將曰訑訑豫既已知之矣訑訑之聲音顔色距人於千里之外則讒諂靣諛之人至矣況乎國君之尊如雷霆之威無不摧如萬鈞之重無不壓也苟不能屈體以求賢則彼將金玉爾音而有遐心矣孰肯樂告之以善道哉黃曰天下非名之能欺人而惟誠之能感人漢唐之君求賢之詔非不屢下也而卒不足以得賢何者求賢之名盛而求賢之實衰非日蝕詔不下非地震詔不下非水旱詔不下平日尊賢待士之誠不至而一旦欲以虛名來天下之豪傑吁庸有是理哉高宗思而傅説夢成王悟而周公歸有急親賢之君則十六相更相薦揚而至矣有善飬老之君則二老有盍歸乎來之嘆矣吾以是知誠之能感人也召公以求賢告君而先之曰有卷者阿飄風自南夫卷阿不與風期也而風必至焉然則有阿之卷必有風之飄然阿大陵也卷者曲之勢也莫峻於阿阿而卷則不抗於自峻而有以來自南之風莫尊於君君尊而謙則不抗於自尊而有以來天下之賢天下之理峻於自立者人不我親誠於待下者人必樂附唯木之樛者葛藟纍之唯阿之卷者南風飄之人君能屈己以求賢則賢者必樂為之用矣是故豈弟之誠不忘於中則尊賢待士之誠必發見於外訑訑之聲音不形於顔色則濟濟之士咸輕於千里故來遊來歌以矢其音者以見賢者願立於朝而樂告之以善道也茍非其有求賢之誠則避色避地皆賢人而在朝在位者非吉士雖招之而不至安肯來而遊雖𨗳之而不言安肯矢其音此髙祖所以不能來四皓光武所以不能屈子陵也吁燕昭王卑辭厚幣以招賢者而樂毅自魏往劇辛自趙往此來遊來歌之意也衛文公臣子多好善而賢者樂告之以善道也此矢其德音之意也矢之為言如臯陶矢厥謨之謂也愚嘗觀仁宗皇帝朝一時賢者毛奮鱗集曠古未有而敢言之士尤多吁誠之能感人也如此哉前輩嘗言人君茍有求賢之誠則賢者將扣閽而自至信矣伴奐爾遊矣優遊爾休矣豈弟君子俾爾彌爾性似先公酋矣爾土宇昄章亦孔之厚矣豈弟君子俾爾彌爾性百神爾主矣爾受命長矣茀祿爾康矣豈弟君子俾爾彌爾性純嘏爾常矣李曰伴奐爾遊矣此下三章小蘇先生之説最為善伴奐鄭氏曰自從弛之意彌終也酋就也言成王之時天下已平惟當伴奐而遊優遊而休端拱無為坐視天民之阜但能得樂易君子而用之以終成其德性則能肖先君之業有所成就矣爾土宇昄章昄大也章著也言成王承文武之緒其土宇大而且著其厚甚矣不可以有加矣但能求樂易之君子而用之以終成其德性則為神明之主矣爾受命長矣言周之受命既長矣而福祿又康安矣但能得樂易君子而用之以成其德性則可以長保其純嘏矣且以唐明皇觀之其時非不伴奐而遊優遊而休也非不土宇昄章也非不茀祿爾康也然自天寶以後驕心浸起惟其求賢之心少替退張九齡而進李林甫用小人而去君子是以不能保其太平之業也使成王茍不知求賢方且簡賢才而信讒佞則是亦為明皇而已黃曰此三章皆一意然其辭有輕重要其微意皆在於三章之末句愚嘗觀諸家講解而惑矣説文以伴奐為廣大而有文章而鄭氏以為自縱弛之意其説以為賢者既用則人君得以優遊而伴奐而自休息也小蘇李迃仲先生則以為成王之時天下已平唯當伴奐而優遊端拱而無為也陳少南先生則以為人君惟在於優遊而不役於智巧以與賢者講學然以愚觀之皆恐非康公之言夫謂之廣大而有文章固美辭也以為賢者既用而人君得以伴奐而優遊則詩人之辭不若是其遽也以為天下已平成王惟當伴奐而遊優遊而休則是召康公教其以逸豫也以為不役於智巧則是文王之時也至於爾土宇昄章亦孔之厚矣爾受命長矣茀祿爾康矣諸家之説亦皆不同然其失也皆在於不察詩人輕重之言爾土宇昄章説文云昄大也章盛也茀祿爾康説文云茀小也康安也愚以為盛貌也召公之意以為天下之治如此其可樂也土地之廣如此其盛大也福祿之慶又如此其厚也吾君將何所為乎亦當知所以保之之道耳保之如何亦惟曰求賢以自輔也然而求賢者人君之所難言於天下治安之時而以難必之事言之於難言之人亦君子之所甚慮也故蹇叔之言不用於秦師方興之日伍員之諫不行於夫差屢勝之後是故於己更事者言與未嘗更事者言不同也成王以幼沖之資出而當盈成之運方是之時中外無虞四方乂寧淮夷已服頑民已定天下之治已休休矣而召康公以求賢用吉士戒之是猶進食於飽者進藥石於壯者其不為之唾去也幾希故召康公之戒亦難乎其為辭矣康公也不直其辭而微其言其一章則先言至治之樂而後進其保治之説其二章則先言其有天下之盛而後進其保天下之説其三章則先言其享福祿之慶而後進戒其保福祿之説夫人惟知其有而後不忍喪其有知其不足恃而後不敢以自恃謂伴奐爾遊優遊爾休天下無事固可樂矣然吾君亦當思所以充其德性而嗣先公之業乎疆土之廣宫室之盛固亦甚厚矣然吾君亦當思所以充其德性而使百神之我主乎受命之長福祿之康固亦盛矣然吾君亦當思所以充其德性而使純嘏之我常乎先公之業不能繼則伴奐優遊何足樂宗廟社稷之不我享則土宇昄章何足榮純嘏之大福不可常則受命之長何足恃反而思之天下雖無事而吾不可以無事而忽之賢不可以不求也吉士不可以不用也使康公不微其言而直以求賢用吉士戒之成王之心必曰天下之治已伴奐而優遊矣土宇已盛矣福祿已康矣吾又何資於賢而必汲汲於吉士哉惟康公先言其所已然而後戒其所未然使之知此之不足恃而不敢以自忽也吁召康公何其善進言於君也哉漢文帝之時號為海內富庶天下乂寧而賈誼必為之痛哭流涕為之長太息如禍患之迫乎其後誼之憂國誠然矣然其言太過而無優遊不迫之意帝退而觀天下之勢不至於此則益不之信故誣亂以為治固小人之用心而抑治以為亂亦非進言之至術至觀此詩然後知康公之戒其君其言固自有法有馮有翼有孝有德以引以翼豈弟君子四方為則顒顒卬卬如圭如璋令聞令望豈弟君子四方為綱李曰有馮有翼鄭氏以馮為馮几以翼為敬以孝為成王以德為羣臣其意以祭祀為説歐陽則非之矣此蓋賢者之衆多如此有可以為輔翼者有孝者有德者皆可以誘掖其君以當道也成王能得此樂易之君子則可以為四方之法則也顒顒卬卬此章亦言賢者如此或説以為成王非也顒顒溫貌卬卬盛貌如圭如璋言其德如圭璋也惟其如此故人聞之則有善聞望之則有威儀夫玉在山而木潤淵生珠而崖不枯有諸中必形諸外此理之常然也成王能得此樂易之君子則可以為四方之綱也黃曰人君用舍之際天下之趨向係焉不可不謹也用得其人則天下皆淬礪於賢人吉士之域而四方之綱紀由是而定矣一非其人則天下趨之而紀綱亦有不足觀者天寶之際唐之天下豈不大治林甫一用而唐之紀綱遂以大亂由是而觀則召康公之戒其意深矣公之意蓋曰人不可以妄用也當察其實而考其素有馮翼之才孝德之行者然後可以用之以為四方之則有顒卬之志圭璋之質而令聞令望之人者然後可以任之以為四方之綱蓋康公之意以為才與德稱名與實孚然後可謂之賢謂之吉士才有餘而德不足則盆成括之徒耳名有餘而實不足則少正卯之徒耳其不誤天下國家也幾希此馮翼之才所以尤貴於孝德之行而聞望之令所以尤貴於圭璋之質也吁此二章其康公告成王以用人之法歟鄭氏以有孝為成王以有德為羣臣其意以祭祀為説而陳少南先生亦以顒顒卬卬如圭如璋令聞令望為人君德性內成而儀容外著詩人之意愚恐不然鳳凰于飛翽翽其羽亦集爰止藹藹王多吉士惟君子使媚于天子鳳凰于飛翽翽其羽亦傅于天藹藹王多吉人惟君子命媚于庶人李曰鳳凰于飛此章言賢者以類進也古之人多以鳳凰比賢者君子在治若鳳在亂若鳳鳳凰之鳥非太平則不出翽翽衆多也藹藹盡力也鳳凰之飛翽翽其羽以類而進咸集於此以譬藹藹之吉士在有道之朝亦引類而進也維君子之所使媚愛天子也又鳳凰于飛此章亦上章之意傅戾也媚于庶人言愛乎庶民也黃曰嘗觀古今之天下方其盛也賢人萃焉及其衰也小人朋焉夫聖明之君其智固足以知之而亦安能盡天下之才而用之哉何賢人君子皆為之用而天下無遺賢也世之説曰天生聖君必生賢佐申甫自嶽降傅説為列星賢人君子之用於世豈偶然哉故天欲平治天下則天下皆君子而無小人未欲平治天下則反之嗚呼是不然也天心仁愛人君豈不欲朝廷皆君子然天下有君子必有小人安能絶其類哉要之君子小人消長之理在人君任用之際有以先之也殊不知舜不相禹而相歡兜吾見鯀與放齊之徒翕然相與都俞於虞朝矣如成王不相周公而相管蔡吾見武庚之徒翕然攀援於周行矣惟舜用禹以先天下故臯蘷稷契以類而進惟成王師周公以先天下故康公康叔以類而用此易所謂拔茅連茹也故曰鳳凰於飛翽翽其羽亦集爰止又曰鳳凰于飛翽翽其羽亦傅于天鳳凰肅肅而飛衆羽翽翽而從鳳凰飛而止衆羽亦集焉鳳凰飛于天衆羽亦戾焉何衆羽之趨於鳳凰者如是也鳳凰者衆羽之所慕也聖人不能盡天下之賢而用之惟得一相如禹如周公而野無遺賢朝無幸位譬如龍翔而雨即霏矣虎嘯而風即號矣何患天下之有遺材也嘗觀髙宗未得傅説則憂思而不遑既得傅説則專任而無憂天下之賢不止一傅説也而高宗獨汲汲於説何哉吁其父歸之其子焉往髙宗蓋知此理者也藹藹王多吉士維君子使又曰藹藹王多吉人維君子命初無異義蓋言吉人吉士之多者以有君子在上也此所以實其鳳凰飛而衆羽從之之意也曰媚于天子媚于庶人蓋媚于天子所以媚于庶人也愛君所以愛民也媚庶人所以媚天子為民所以為君也知媚君而不知媚民非愛君之誠也其秦髙斯漢桑𢎞羊唐楊國忠之徒耳其不忠於君莫大焉吾嘗講假樂之詩至於百辟卿士媚于天子不解于位民之攸塈一章已妄論之矣故不復述其説鳳凰鳴矣于彼髙岡梧桐生矣于彼朝陽菶菶萋萋雍雍喈喈李曰鳳凰鳴矣鳳凰之鳥非梧桐不棲鳳凰鳴於高岡之上必有梧桐之木生於朝陽之地梧桐之木菶菶萋萋然而盛則鳳凰之鳥雍雍喈喈然而和鳴言成王之朝能致賢者如此梧桐之木生于朝陽之地者蓋其朝見日陽被仁溫之氣為多而説者以被溫仁之氣為人君之德則鑿矣黃曰先曰鳳凰飛而衆羽從此又言梧桐生而鳳凰鳴猶方其論九官之用則曰禹先之也論三后之用則曰周公先之也及其論禹之所以用周公之所以歸則又曰舜之聖成王之賢也且夫古人所以必以鳳比君子者何哉非取其羽毛之異也非謂其罕見之奇也賢人君子難進而易退危邦不入亂邦不居有道則見無道則隱猶鳳凰焉非髙岡不翔非梧桐不棲故鳳凰鳴於髙岡之上者以有梧桐之木生於朝陽之地也梧桐之木菶菶萋萋而盛鳳凰之鳥雍雍喈喈而和且夫太公伯夷天下之大老也方其隱於東海北海之濵也默默然而處恐有聞焉及其盍歸乎來之嘆也翻翻而起恐或後焉向者胡為而避今也胡為而歸此君子出處之道詩人形容之意也後世有如魯二生漢四皓皆終於隱而不見於世夫若人者用之雖未必能成王佐之事業要以後世之君輕儒慢士而賢人君子有以窺其用心也梧桐之不菶菶萋萋何怪乎鳳凰之不雍雍喈喈也噫鳳兮鳳兮何德之衰君子之車既庶且多君子之馬既間且馳矢詩不多維以遂歌李曰君子之車此章言其所以寵錫君子者甚厚矣韓文公曰假如賢者至乃一見之愚者不得見焉則賢者莫不至而愚者日逺矣假如愚者至以千金與之賢者至亦以千金與之則愚者莫不至而賢者日逺矣蓋待賢者之道當異於衆人茍以衆人待之則彼將有辭曰吾君待我以何禮而責我以何事也故必待之甚厚則賢者樂告之以善道也今也君子之車馬如此之富則其禮貌可知矣然君子豈在於車馬之間哉蓋以車馬之多則見其禮待之甚厚也召公之作詩其辭不多惟使樂人歌之欲使成王以為戒也召公雖曰此詩不多然其辭諄諄如此已為多矣猶曰矢詩不多者蓋召公愛其君甚切其心猶以為少也黃曰先儒之論此章皆曰人君待賢者之禮當如此其厚也故必有車馬以錫之如書所謂車服以庸易所謂錫馬蕃庶也愚竊謂不然夫康公之意固欲成王之待賢者以禮矣然不告其君以待賢者之誠而告其君以待賢者之物康公之意必不爾也夫車必曰君子之車馬必曰君子之馬猶杜子美之詩曰座對賢人酒門聽長者車人孰無酒不若對賢人酒人孰無車不若聽長者車愛其人而貴其物也天下之言弓者必曰烏號之弓言履者必曰曲阜之履豈貴其物乎抑貴其人乎康公先言菶菶萋萋雍雍喈喈而繼之曰君子之車既庶且多君子之馬既間且馳蓋謂梧桐之木盛則鳳凰鳴矣人君之誠至則賢者至矣吾君苟有好賢之誠則天下之賢者莫不願立於其朝將有不逺千里而來者矣君子之車而庶且多君子之馬而間且馳指車馬而曰君子以見朝廷無憸人也夫如是康公愛君之意遂矣故曰維以遂歌夫康公作卷阿詩其辭非不詳也而猶曰矢詩不多維以遂歌蓋其愛君之誠動於中而愛君之辭形於外則辭多猶以為少也吁康公之愛其君也為何如後世之言為人臣者必曰周召信乎其為人臣者必如二公而後無愧民勞召穆公刺厲王也民亦勞止汔可小康惠此中國以綏四方無縱詭隨以謹無良式遏寇虐憯不畏明柔逺能邇以定我王民亦勞止汔可小休惠此中國以為民逑無縱詭隨以謹惛怓式遏寇虐無俾民憂無棄爾勞以為王休民亦勞止汔可小息惠此京師以綏四國無縱詭隨以謹罔極式遏寇虐無俾作慝敬愼威儀以近有德民亦勞止汔可小愒惠此中國俾民憂泄無縱詭隨以謹醜厲式遏寇虐無俾正敗戎雖小子而式𢎞大民亦勞止汔可小安惠此中國國無有殘無縱詭隨以謹繾綣式遏寇虐無俾正反王欲玉女是用大諫李曰召穆公者召康公十六世孫也召康公當武王成王之世言聽諫從其所陳者無非切直之言而王能聽之故天下大治召穆公者當厲王之世非無切直之言也觀民勞與蕩之詩其言非不忠也奈其王之不聽何故天下大亂其愛君之心非不同特所遇之時異耳江漢之詩所謂召虎即穆公也當厲王之世不見信用其所見於世者惟其言耳至於宣王之世能信用之乃有平淮夷之功所謂百里奚非愚於虞而智於秦者正此類也考之國語王行暴虐侈傲國人謗王召公諫曰民不堪命王怒使人監謗召公諫曰是障之也防民之口甚於防川川壅而潰傷人必多民亦如之則知穆公在厲王之世其忠諫屢矣非獨民勞與蕩二篇也其後厲王奔於彘太子靜匿召公之宫國人聞之乃圍之召公曰昔吾驟諫王王不從以及此難也今殺王太子王其以我為懟而怒乎事君者險而不懟怨而不怒况事王乎乃以子代宣王太子卒得脫觀此則穆公之所存可謂大過人矣慶鄭之於晉惠公驟諫不從及戰於韓原戎馬還濘而止公號慶鄭慶鄭曰愎諫違卜固敗是求又何逃焉遂去之慶鄭之於惠公固謂忠諫至其君陷於難安然坐視而不之救是以其君怨懟而讎之也聞召公之風可以少愧矣觀此詩與蕩詩其言優遊而不迫則召穆公之忠厚可見於此二詩况其肯讎君於急難之中乎召穆公既脫太子於難乃與周公行政謂之共和共和十四年厲王死於彘乃立太子靜為王夫以十四年之間朝廷無主召公乃與周公行政於天下天下不以為專宣王不以為疑此非其才如伊尹者不能也而召公能之可不謂之大賢乎召公之賢如此則學者於此詩不可不詳考之也迄毛氏曰危也鄭氏曰幾也毛氏之説以為民皆罷勞而又危則其説不甚簡徑不如鄭氏之説為優易之井卦曰汔至亦未繘井汔亦訓幾汔而未為用則未為有功也此迄字同也言告於王曰當時之民亦勞苦矣庶幾厲王可以少安之乎言少安者未敢望厲王奮然大安斯民但冀其少康之使之得休息足矣中國毛氏曰京師也四方毛氏曰諸夏也鄭氏亦同皆非也中國只是説諸夏王氏曰惠此中國以綏四方自中國以至夷狄皆綏之是也但王氏又以下文四國為中國而又失之泥矣毛鄭之失則以中國為京師王氏之失則以四國為中國其失一也安民之道必有其序先京師而後諸夏先諸夏而後夷狄此先後之序也聖人之於天下非不欲一視而同仁也然未能治近而先欲治遠正孔子所謂吾恐季孫之憂不在顓臾而在蕭墻之內也然而可以施惠者惟在於無縱詭隨而已詭隨者蘇氏曰不顧是非而妄從人者是也毛鄭皆以為詭人之善隨人之惡其説不甚近夫小人欲仕於朝廷者必先中君之欲然後可以得志如唐太宗嘗玩庭中樹宇文士及從而譽之不已帝正色曰魏徵嘗勸我遠佞人我不知佞人為誰意疑是汝宇文士及從旁稱美可謂詭隨也蓋彼不顧理之是非君以為是亦以為是君以為非亦以為非既合君之意然後可以要君之爵矣天下之事惟吾之所欲則天下之人必受其禍矣王能無縱詭隨之人無良之人既以謹慎則寇虐不畏法之人亦將遏止之也孔氏曰惡有小大詭隨未為大害故直云不得縱之也無良則為小惡己著故謹敕之寇虐則加害於民故遏止之自古人臣之肆其大惡而無所忌憚者則以人君有以縱之於始也左氏傳曰人之多幸國之不幸也有一人焉幸而從事則天下必受其禍矣不於詭隨之時而禁止之至於為寇虐而欲遏止之亦已晚矣如唐代宗之時所用之人如元載李輔國之徒皆大姦惡無如之何至遣刺客殺之其無策甚矣柔逺即上文綏四方是也能邇即上文惠中國是也逺近既安則上亦安如逺人已叛而近者已離王雖欲一日之安得乎故曰柔逺能邇而後可以安我王也休息也以為民逑逑聚也言使民無離散也宣王之時萬民離散不安其居而能勞來還定安集之則知厲王之時斯民流離散亂於四方矣故告之曰以為民逑也惛怓亂也無棄爾勞鄭氏以為無廢汝始時勤政事之功不如蘇氏以為爾勞舊也詭隨者禁之舊者用之茍有功者勿棄則君子在朝小人在野豈不為王之休美乎民亦勞止以綏四國即上文綏四方也罔極不中也無俾作慝遏止寇虐之人使不得作邪慝也敬愼威儀以近有德言王當敬愼其威儀則能親近有德之人蓋禮貌茍衰則有德之人必去矣如漢武不冠不見汲黯至於公孫𢎞則不冠亦見之唐姚崇宋璟為相每進見明皇輒為之起去則臨軒送之及林甫為相雖寵過於姚宋然禮遇殊卑薄矣蓋為無德之人乃可以無禮待之茍為有德之人而倨傲之如此則將有去志矣觀厲王之世所親者惟榮夷公之徒安能近有德哉愒亦息也俾民憂泄俾民去其憂也泄去也以謹醜厲厲惡也無俾正敗無使正道得敗壞也戎雖小子而式𢎞大者言王雖號小子而所係天下之事甚重不可不愼也民亦勞止云云國無有殘者言國無殘敗之禍也繾綣附著也左氏昭公二十五年曰繾綣從公無通內外元愷曰不敢離散也説文曰不相離散也孔氏謂人行反覆為惡固執不舍常為惡行不如蘇氏以為小人之固結其君無俾正反言無使正道反而為邪也厲王乎我欲女如玉是用大諫也自古人君之所以欲殺諫臣者必以為拂己而不知實愛己也人之諂諛雖曰遜志然猶疾疢也乃所以害之也人之忠直雖曰拂已然猶藥石也乃所以愛之也使君能察其臣之所以諫己者謂何其心不過欲其君為賢為聖使天下躋於太平之域則必無殺諫臣之患矣板凡伯刺厲王也上帝板板下民卒疸出話不然為猶不逺靡聖管管不實于亶猶之未逺是用大諫天之方難無然憲憲天之方蹶無然泄泄辭之輯矣民之洽矣辭之懌矣民之莫矣我雖異事及爾同僚我即爾謀聽我囂囂我言維服勿以為笑先民有言詢于芻蕘天之方虐無然謔謔老夫灌灌小子蹻蹻匪我言耄爾用憂謔多將熇熇不可救藥天之方懠無為夸毗威儀卒迷善人載尸民之方殿屎則莫我敢葵喪亂蔑資曾莫惠我師天之牖民如塤如篪如璋如圭如取如擕擕無曰益牖民孔易民之多辟無自立辟價人維藩大師維垣大邦維屏大宗維翰懷德維寧宗子維城無俾城壞無獨斯畏敬天之怒無敢戲豫敬天之渝無敢馳驅昊天曰明及爾出王昊天曰旦及爾遊衍李曰左氏傳云凡蔣邢茅胙祭周公之胤也凡伯周公之後也入為王朝卿士春秋書天王使凡伯來聘則凡伯亦其苗裔世為王臣也上帝板板板反也疸病也凡伯以厲王之不道遂言曰愛民者天之常道耳今天使下民皆病則反其常道矣天降禍如此可畏可不愼哉吾出話以告之厲王不以為然而且肆於民上則其所謀皆不逺矣凡伯之出話無非逺謀也而厲王不從惟知耽樂於目前不知禍之將至也管管無所依恃也言厲王之心不知有聖人之法度故專己直情偃然無所忌憚肆為欺詐而不實於誠信之道也蓋人茍知有聖人之法度則必戰戰兢兢不敢茍作其心既無聖人矣則矯誣詐偽何所不至哉惟其謀猷如此不遠我是以用大諫也自下文至於末章皆是大諫也上既言為猶不逺此又言猶之未逺蓋反覆言之矣天之方難無然憲憲憲憲猶欣欣也孟子曰天之方蹶無然泄泄泄泄猶沓沓也事君無義進退無禮言則非先王之道者猶沓沓也嘗聞之曰書籍難曉以古今之語不同耳在凡伯謂之泄泄孟子又轉而為沓沓今沓沓之語又難曉但觀孟子所謂事君無義進退無禮言則非先王之道意自可見矣鄭氏之説皆以天為王言王方行暴虐之政以艱難天下之民汝臣等無得如是欣欣然喜樂而勸之王之方欲動變先王之道而行邪僻之政汝臣等無得如是沓沓然隨從而助之其説皆以為王非也此只説上天方降災王不可以不懼也言天方降大難於王何為乎欣欣然而不懼天方有警動於王何為乎沓沓然而不知止也天心之仁愛人君至矣故降災以警動之人君欲解天心惟恐懼修省而已茍能愼德則雖有桑榖之變而可以致中興苟不知懼則天災日益其欲當天心者果何為哉在於治民而已然民豈難治哉王之教令茍和順矣則下民無有不和洽王之教令茍悅美矣則下民無有不安定古人曰安危在出令民之休戚係於上之人所施教令如何耳觀尚書所載皆古帝王所以教令其臣民者其治亂可考也我雖異事此章又責同寮之臣王氏曰事雖異然其同治天下則凡伯與厲王無以異於同僚矣此説牽強之甚言我與爾大臣其職事雖異然常與爾同僚正左氏所謂吾嘗與同僚敢不盡心焉是也以同僚之故而就爾謀而汝同僚者乃聽我囂囂而不之信我之所言誠可行也汝勿以為笑先世之民嘗有言芻蕘采薪之人其言尚可采而況於我乃同僚之人乎凡伯諫王不聽故欲與同僚共陳之而其同僚乃姦邪之小人反笑其所言況欲與之共諫於王乎昔趙盾與士會同心以事君諫不入則子繼之是同僚當如此也今厲王之時同僚諫君皆以為笑其異於趙盾士會逺矣天之方虐言天之將虐以喪國家王何為謔謔然戲侮之也惟老者知其不可不戒故以此諫王而王乃蹻蹻然不顧其所言小子指厲王也説文曰蹻蹻舉足髙也以舉足髙之意觀之則蹻蹻是驕怠之意劉向新序曰老夫灌灌小子蹻蹻言老夫欲盡其言小子蹻而不受也灌灌毛氏曰猶款款也汝之所以不用我言者豈非以我之老故邪然我之言實非老也但是爾用憂為戲謔也自古庸君之朝無不播棄黎老老人之言可以治國反以其言之老遂以其言耄而不可用也而秦穆公之於蹇叔曰爾何知中壽爾墓之木拱矣此所謂以老人之言為耄也熇熇盛也説文曰火熱貌是亦熾盛之意言王不用我之言及其積也將如火之益熱不可救止也天之方懠懠怒也夸毗爾雅曰體柔也言天方震怒王何為懦而不能自立今威儀皆迷亂則其無立志可知也當世所謂善人者又皆不敢出言尸位而已故斯民呻吟無有揆度之者斯民當喪亂之際無有資財曾莫有惠我衆者以其聚斂愈甚而斯民益困天之牖民正如所謂天序有典天秩有禮天命有德天討有罪皆是為順於天理也茍能順天之理以牖民則如塤篪之相應圭璋之相合取擕之甚易也牖如循循然善誘人之誘同且人之生也皆有固有之性因其善性則其教不肅而成其政不嚴而治茍將求多於民則牖民之道變易矣益者言其無求多也特言牖者以帶上文言之耳鄭氏曰無曰是何益詩人但言無曰益鄭氏又增言無曰是何益可謂鑿矣民之多辟無自立辟此辟亦當作僻字讀言今之民既多邪僻矣而王又為邪僻何以牖民哉未有己不正而能正民也厲王既為邪僻安能正民乎價人維藩大師或讀作大字價人或以為大人或以為善人或以為掌軍事者無所經見今姑兼存之大師大衆也大邦諸侯也大宗強族也王所恃以為藩籬屏翰蔽其國家者在此數者茍以德懷之則無有不寧矣宗子維城言同姓之宗子亦當以德懷之矣詩人以懷德維寧間於中則宗子維城亦當以德懷之也左氏曰君其修德以固宗子何城如之所謂宗子維城是也無使宗子之城壞無使汝獨居則可畏也宗族既離則為厲王者眇然匹夫矣豈不可畏哉敬天之怒此章又戒王以畏天反覆言之者以見厲王忽天戒也渝變也是亦天怒之意也天怒如此王當戒之無敢戲豫馳驅自肆夫所謂天者豈逺乎哉無曰髙髙在上陟降厥士日鑒在兹故昊天之明與爾出入與爾遊衍不可以為逺而忽之旦明也王往也觀敬之一章皆是言天與人不逺王當敬之故此詩既告之以敬天之怒又申之以昊天曰明敬之一篇之意盡在其中矣夫厲王之無道凡伯所以告之也猶盡其至如此末章所言惟文王能之文王陟降厥士故曰昊天之明及爾出王與爾遊衍不以為逺而忽之在帝左右是也此豈厲王之所能為哉而凡伯亦告之以此者蓋古人責難於君以孔孟之時其君皆庸主耳以孔孟告之無非堯舜禹湯文武之道乃知古人之事君無有不然也毛詩集解卷三十三
