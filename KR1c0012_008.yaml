seq: 8
body:
  text: 欽定四庫全書毛詩集解卷八宋李樗黃櫄撰氓刺時也宣公之時禮義消亡淫風大行男女無别遂相奔誘華户瓜反落色衰復相棄背或乃困而自悔喪其妃音配耦故序其事以風去聲焉美反正刺淫泆也氓之蚩蚩尺之反抱布貿莫豆反絲匪來貿絲來即我謀送子涉淇至于頓丘匪我愆期子無良媒將七羊反子無怒秋以為期乘彼垝俱毁反垣音𡊮以望復關不見復關泣涕漣漣既見復關載笑載言爾卜爾筮體無咎言以爾車來以我賄遷桑之未落其葉沃若于嗟鳩兮無食桑椹音甚于嗟女兮無與士耽都南反士之耽兮猶可説也女之耽兮不可説也桑之落矣其黃而隕自我徂爾三嵗食貧淇水湯湯音傷漸子廉反車帷裳女也不爽士二其行下孟反士也罔極二三其德三嵗為婦靡室勞矣夙興夜寐靡有朝矣言既遂矣至于暴矣兄弟不知嘻許意反其笑矣靜言思之躬自悼矣及爾偕老老使我怨淇則有岸隰則有泮音畔總角之宴言笑晏晏信誓旦旦不思其反反是不思亦已焉哉李曰淫亂之風起於禮義之廢禮義興則人知男女之别若漢廣所謂無思犯禮是也惟禮義既廢則男女無别交相往來至於奔誘也夫其始也不正則其終也必壞始則相奔誘終則相棄背及困而女子又悔其事故序其事以諷刺之美反正美其能自悔也刺淫泆刺當時之淫泆也氓之蚩蚩抱布貿絲匪來貿絲來即我謀送子涉淇至于頓丘匪我愆期子無良媒將子無怒秋以為期唐孔氏以上章説女初奔男之事下四章言困而自悔蓋自氓之蚩蚩至於以我賄遷此皆是男女相從之辭自桑之未落至於已焉哉皆是女子見棄自悔之辭王氏則以為一章二章為美反正三章為刺淫泆四章為華落色衰復相棄背五章六章言困而自悔喪其妃耦據序所謂反正即所謂自悔者豈一章二章既言反正五章六章又言自悔是一事而分為兩也蚩蚩敦厚貌其初有一民之敦厚者抱布而來其抱布而來者將以貿絲也非真來貿絲也欲為謀室家之道也此婦人既為男子所誘遂送之涉淇水以至于頓丘之地也頓丘丘名今澶州有頓丘城亦近淇水丘一成曰頓丘男子與女會期女云非我欲愆過於期也為期太近恐子無良媒遂欲悔而不奔待媒而後許故以此為美反正非也據此詩但言來即我謀是其自來謀室家之道豈待媒哉乘彼垝垣至以我賄遷垝毁也復關關名君子所近之地上既言秋以為期於是乘彼垝垣以望君子自復關來所近之地鄭氏曰前既與民以秋為期期至故登毁垣鄉其所近而望之猶有廉恥之心非也詩但言婦人乘垝垣以望君子其所近之地安得謂之有恥耶不見復關泣涕漣漣言其未見也其憂如此既見復關載笑載言者言其既見也其喜如此爾卜爾筮鄭氏謂復關既見此婦人告之曰我卜汝筮汝宜為室家矣歐陽以鄭之説為非謂上下文初蕪男子之語忽以此兩句為男告女豈成文理據詩所述是女被棄逐怨悔而追敘與男相得之初恩勤之篤而責其終始棄背之辭云子初來即我謀我既許子而我乃㳏以卜筮於是我從子往爾推其文理爾卜爾筮者爾其男子也此説是也體者卜兆筮卦之體書曰體王其罔害男子既以卜筮之吉而誘女子女子於是謂爾既以車來要我我則以貨賄遷就於汝也桑之未落至不可説也桑之未落其葉沃若東坡以謂此句善形容物色當以桑葉子細觀之今閩中之桑葉不見其沃若觀浙中之桑葉然後始見其沃若也于嗟鳩兮無食桑椹鄭氏謂國之賢者刺此婦人見誘于嗟而戒之歐陽以為非據序但言序其事以風其上則是詩人序述女語爾此説是也鳩之食椹似若可信然鳩食椹之美而不去不知其將隕也以興男子其初相得之厚不知其相棄背也故曰于嗟鳩兮無食桑椹于嗟女兮無與士耽無食桑椹言桑之不可恃也無與士耽言士所欲者耽樂之事不可信也士之耽兮猶可説也女之耽兮不可説也言男子之失節猶可解説女之失身不可解説也夫士之耽兮豈可解説哉此句正猶彼月而食則維其常此日而食于何不臧月食豈是常事然以日食比之則月食乃其常也此婦人之意以女失節比之男子為重也此蓋自悔之辭故以已之失節尤為可恨桑之落矣至躬自悼矣桑之落矣其黃而隕此言男子之意衰也鄭氏以未落為仲秋黃隕為季秋此曲説也唐孔氏謂以興婦人年老色衰此亦非也此但喻男子之意衰爾上章既以鳩喻女子則桑當為男子也自我徂爾三歲食貧言自我往爾家三嵗食貧言家之貧也湯盛也漸漬也以帷而障車傍加裳以為容飾此婦人之車也冒涉淇水之盛漸漬車帷之裳其艱難如此女也不爽士二其行士也罔極二三其德言女之於男子本無差忒之行但士於女其行有二也極中也言士無中正之德此所以二三也三嵗為婦靡室勞矣言三嵗為婦不以室家為勞也夙興夜寐靡有朝矣言其晏卧早起非一朝一夕也言既遂矣至於暴矣言昏姻之道既遂乃以暴而加我也兄弟不知嘻其笑矣嘻笑貌鄭氏曰兄弟在家不知我之見酷暴若其知之則嘻嘻然而笑王氏之説曰兄弟不知我之見暴故笑知則悲傷矣當從王氏之説靜言思之躬自悼矣自傷如此及爾偕老至不思其反及爾偕老老使我怨者言其初也將與爾至老今老乃棄我使我怨也淇則有岸隰則有泮蘇氏曰淇猶有岸隰猶有泮何汝心之不我知也總角之宴言笑晏晏總角言結髮時也宴安樂也晏晏和柔也言其𥘉童稚之時晏然其樂如此今不復有此樂也信誓旦旦者言當時信誓之明也如此男子曽不思其反反覆也言不思其舊時也既不思其舊尚何望哉亦無可奈何也論曰女子淫奔豈得為美事今雖反正何足為美而詩人乃美之者以見詩人待人之恕也孟子曰西子蒙不潔則人皆掩鼻而過之雖有惡人齋戒沐浴則可以祀上帝夫西子蒙之不潔則以為可羞以見君子有過亦在所不取也惡人齋戒則可以祀上帝以見小人而能改過亦在所取也君子以人治人改而止使能知過而必改君子不輕絶之也蓋欲人之改過爾漢書原涉曰家人寡婦始自約敕之時意乃慕宋伯姬及陳孝婦不幸一為盜賊所汚遂行淫泆雖知其非禮然不能自還吾猶此矣如原涉此言非也豈有知淫泆而不能正哉觀氓之詩能自反如此孰謂不能自還哉黃曰氓之一詩女子自悔之辭也女子之從夫其義不可不明一失節於人則終身不可復悔所謂不待父母之命媒妁之言則國人皆賤之是故當謹於其始也不謹之於始而悔之於終其將何及而聖人取之何哉夫人惟能自悔則改過遷善之機也此聖人所以取之以為來世戒歟竹竿衛女思歸也適異國而不見答思而能以禮者也籊籊竹竿以釣于淇豈不爾思逺莫致之泉源在左淇水在右女子有行逺父母兄弟淇水在右泉源在左巧笑之瑳七可反佩玉之儺乃可反淇水悠悠檜楫松舟駕言出遊以寫我憂李曰衛女思欲歸而不得歸而能以禮自克此其所以曰能以禮者也籊籊竹竿以釣于淇豈不爾思逺莫致之竹竿之詩大意從歐陽之説淇衛水也籊籊長而殺也毛氏謂釣以得魚婦人待禮以成為室家王氏亦以謂釣有男下女之道故詩人者每以釣喻夫婦之相求淇水者言衛女嫁於異國故思淇水若泉水之詩所謂思須與漕我心悠悠載馳所謂我行其野芃芃其麥之類是也若謂以釣于淇而取譬夫婦何必獨言淇水乎蘇氏雖不以為譬喻然謂以籊籊之竹竿而所以釣于淇猶言誰謂河廣一葦杭之此其説亦為曲説惟歐陽曰衛女之思歸者述其國俗之樂此説是也蓋言衛之樂如此豈不爾思逺莫致之者言我豈不以思見之乎以其逺無由而致此室家之道爾其説亦非泉源在左淇水在右女子有行逺父母兄弟淇水在右泉源在左巧笑之瑳佩玉之儺泉源在左淇水在右者毛氏曰泉源者小水之源也淇水大水也此亦是言舊時遊泳二水之間其樂如此今也嫁於異國而不得見也故曰女子有行逺父母兄弟瑳笑貌儺行有節也巧笑之瑳亦是思舊時遊於泉源之間其樂如此而歐陽氏則謂此又思衛女之在其國者巧笑佩玉威儀間暇樂於二水之上念已有所不如也亦不必如此説此詩多是思舊時之事不必以為當時之事也淇水悠悠檜楫松舟駕言出遊以寫我憂悠悠流貌檜楫松舟以檜為楫以松為舟也柏葉松身曰檜言淇水之地舟楫之盛可觀如此蓋思之也王氏毛氏皆以喻夫婦亦非詩人之意歐氏謂淇水悠悠然故但言駕此車出遊以寫我心之憂也故曰駕言出遊以寫我憂惟其思歸而不得此序所謂能以禮者也王氏謂巧笑之瑳佩玉之儺言雖不見答而能自強以禮也王氏欲以此説強合於序其説非也據序但謂思而能以禮者也非謂能自強以禮也泉水載馳竹竿三詩皆是思歸衛國之詩泉水以常時思歸非有故也載馳以衛國之滅而思歸竹竿以不見答而思歸是自閔而思歸也然載馳之詩猶言其力不能救之事竹竿則不見其不見答之事則知竹竿之女子其忠厚可見矣夫人之不見答多形於怨如氓及谷風之詩皆載其怨恨之辭也今衛女徒思衛國之樂以見其思歸之意其夫家之過未嘗斥言之其忠厚可見矣是以知觀詩者不求於刺詩之中未可以見詩人之意黃曰人惟其愁困憔悴之中則思其昔日逸樂之事竹竿一詩蓋女適異國而不見答故思其國俗之樂以見欲歸之意此詩所言皆興也而先儒以為比則已失其義矣噫谷風之婦有怨辭載馳之夫人有悲辭而竹竿一詩雍容和緩述其昔日之樂而不言今日之恨為此詩者其亦敦厚之人乎故曰思而能以禮者也芄音丸蘭刺惠公也驕而無禮大夫刺之芄蘭之攴童子佩觿許規反雖則佩觿能不我知容兮遂兮垂帶悸兮芄蘭之葉童子佩韘失涉反雖則佩韘能不我甲容兮遂兮垂帶悸兮李曰蓋言惠公驕傲無禮此詩所以刺之也芄蘭之支童子佩觿雖則佩觿能不我知容兮遂兮垂帶悸兮爾雅曰雚芄蘭郭氏曰蔓生斷之有白汁可啖蓋言芄蘭之為物枝葉柔弱故以比惠公毛氏以興君子之德當柔潤溫良此説非也而王氏之説則以為芄蘭之為物不能自立以刺無禮此説是也然王氏又謂支離矣葉則離本逺矣離本逺則尤柔不能自立以刺無禮之甚此説是也觿者所以解結成人之佩也禮記內則注曰觿貌如錐以象骨為之是可以解結也説文曰佩角鋭端而可以解結是也韘玦也能射御則佩之説文曰韘可以鉤弦也以象骨為之著於右臂巨指蓋亦成人之佩也蓋言惠公為童子結觿結韘無其德而不稱其服也雖則佩觽能不我知雖則佩韘能不我甲鄭氏云雖則佩觿與其才能實不如我衆臣之所為也雖則佩韘與其才能實不如我衆臣之所狎習蓋以甲訓狎其説未如程氏之為善程氏曰惠公雖佩觿才能實不知也雖佩韘其才能實不能君我長我也蓋以甲字為長故可從容刀也遂蘇氏以遂字與玉璲字通用垂帶紳帶也悸毛氏以悸悸然行止有節度不如程氏之言悸悸者執心不定也此説是也正如更始既至長安宫升前殿郎吏以次列庭中更始羞怍刮席不敢視不足為君也如此論曰夫服其服者不可不稱其德服衰絰者必有哀色如服衰絰而無哀色則與吉服同服冠冕者必有欽容如服冠冕而無欽容則與袒裼同故其服成人之服者必有成人之禮也古者二十而冠則必責之以為人子為人弟為人臣之禮至於人君則不必至冠而後服成人之服既服其服必責以成人之禮苟無其禮而服其服則與童子同也故遍魯國之人皆儒服而不得為儒是無儒者之德也知魯國儒服之不足為儒則知惠公之為童子也黃曰桓十二年左傳曰惠公之即位也少杜預云蓋是時公年十五六惠公以幼童即位而以才能驕其臣雖衣成人之服而無成人之德此大夫所以知其不足與有為而刺其無禮歟成王以孺子而知周公之德昭帝以幼嵗而知霍光之忠此其所以為賢君也若惠公者尚足以語是哉河廣宋襄公母歸于衛思而不止故作是詩也誰謂河廣一葦杭之誰謂宋逺跋丘䜴反豫望之誰謂河廣曽不容刀誰謂宋逺曽不崇朝李曰河廣宋襄公之母桓公之夫人衛文公之妹也生襄公而見出襄公即位夫人思宋而不可歸蓋母既見出義與廟絶故不可歸也誰謂河廣一葦杭之者一束葦也杭度也刀小船也崇朝終朝也言誰謂河之廣歟一束之葦可以度誰謂宋之逺歟跂足可以望見之也誰謂河之廣歟曽不容於一刀誰謂宋之逺歟曽不崇朝可致然河非不可渡今我之不渡知義自不渡爾宋非不可往也今我之不往知義自不往也論曰載馳之詩曰大夫跋涉我心則憂竹竿之詩曰豈不爾思逺莫致之皆言其逺也至於此詩惟言其甚近者蓋言人之於逺者則憚而不往至於甚近而不往者非有所憚也義不可也大抵人之行事當論其所當為與不當為者如何耳其所當為者雖千里之逺猶在所往也其不當為者雖咫尺之地不可妄動也公父文伯之母季康子之從祖母也康子往焉䦱門而與之言皆不踰閾孔子嘉其有男女之别夫一門限而禮存焉非其足不可踰閾也禮不可也觀此則知宋襄之母有念子之心而不敢歸宋此詩所以賢之也黃曰天下之事其所當為者雖千里而近其所不當為者雖咫尺而逺衛之於宋可以束葦而渡可以跋足而見可以旦行而至夫豈難往哉於禮有所不可往則雖近而猶逺也禮之不可踰也如此哉伯兮刺時也言君子行役為于偽反王前驅過時而不反焉伯兮朅丘列反兮邦之桀兮伯也執殳市朱反為王前驅自伯之東首如飛蓬豈無膏沐誰適都歷反為容其雨其雨杲杲古老反出日願言思伯甘心首疾焉於虔反得諼況𡊮反草言樹之背願言思伯使我心痗音昧李曰言君子行役為王前驅過時而不反焉衛宣公之時蔡人衛人陳人從王伐鄭伯也從王行役之久其家思之此詩之所以作也伯兮朅兮邦之桀兮伯也執殳為王前驅伯毛氏以為州伯非也鄭氏以為君子之字是也朅武勇貌如所謂庶士有朅邦之桀兮言其伯之武勇真可謂邦之桀也桀特立也殳考工記曰殳長尋有四尺在車左也前驅左氏傳曰前驅歂犬射而殺之也此章蓋言男子役於王事也自伯之東首如飛蓬豈無膏沐誰適為容自伯之東此言君子之東行也首如飛蓬所謂頭如蓬而不暇梳也豈無膏沐誰適為容容飾也適主也言我非無膏沐但夫不在家故未嘗有容飾也如采緑之詩曰豫髮曲局薄言歸沐蓋言膏沐必俟夫之歸夫不在則未嘗有容飾也其雨其雨杲杲出日願言思伯甘心首疾此章言人謂其雨其雨今乃杲杲然出日猶言夫之將歸而今乃不歸也願言思伯甘心首疾言其情之切也惟情之切故雖首疾而甘心焉焉得諼草言樹之背願言思伯使我心痗諼忘也唐孔氏曰諼訓為忘非草名謂欲得令人善忘憂之草爾雅曰諼忘也孫氏引詩云焉得諼草是諼字非草名也然而説文又謂諼字從草從憲是以諼為草名言其能令人忘憂爾嵇叔夜養生論曰合歡蠲忿諼草忘憂故後之言諼者皆本於此也背北堂也昏禮曰婦洗在北堂注云房室所居之地總謂之堂房半以北為北堂房半以南為南堂有向北之義也焉得諼草樹於北堂冀其忘憂也杜子美詩曰趨庭赴北堂後世以北堂喻母道誤矣使我心痗心之病也論曰古者師出不踰時所以重民力也莊公八年書師次于郎以俟陳人蔡人甲午治兵夏師及齊師圍郕郕降于齊師秋師還春秋之世用兵多矣未嘗有書師還者而獨於莊八年書之者以見踰時不反如此之久也然采薇之詩曰昔我往矣楊栁依依今我來思雨雪霏霏東山之詩曰自我不見于今三年而詩人乃美之者蓋用之得其道則如采薇東山之詩雖久而民無怨憝之心用之不得其道則如此詩踰時之久而詩人刺之也且以六月之詩言宣王北伐非其時也而詩人乃美之者用之得其道故也黃曰汝墳之婦女能閔其君子而猶勉以正殷其雷之大夫妻能閔其勤勞而勸之以義夫以婦人而思其君子者情之常也而能勉之以正勸之以義為難然則伯兮之詩其不足以知此乎曰衛國之風固不足以比二南之化而過時不反亦非王者使民之道也有狐刺時也衛之男女失時喪其妃音配耦焉古者國有凶荒則殺所戒反禮而多昏會男女之無夫家者所以育人民也有狐綏綏在彼淇梁心之憂矣之子無裳有狐綏綏在彼淇厲心之憂矣之子無帶有狐綏綏在彼淇側心之憂矣之子無服李曰此詩言衛之男女年盛之時而喪其妃耦也古者國有凶荒則減殺其禮而多昏觀大司徒以荒政十有二聚萬民十曰多昏言不備禮而娶者多也蓋多昏可以會男女之無夫家者而蕃育人民今則不然故詩人所以刺之有狐綏綏在彼淇梁心之憂矣之子無裳綏匹行貌也石絶水為梁厲深也所謂深則厲言深可厲之處也此詩言狐尚匹行而衛之男女乃無夫家言狐之不如也心之憂矣之子無裳之子無帶之子無服毛氏曰無室家如無衣服此曲説也王氏曰無裳則憂其無裳而已無帶則又憂無服則所憂者衆矣此説是也蓋此詩言無裳無帶無服但言其衣服之不備也歐陽氏常有言曰不及時者有二禮義既喪淫風大行犯禮相奔者不禁及遭強暴橫見侵陵則男女有未及嫁娶之年先時而犯禮者矣世變多故兵飢荒亂民不安居與力不足則男女有過嫁娶之年而不待禮者矣蓋先王盛時世既乂安能以禮化民既無先時之失又無後時之過如摽有梅桃夭之詩是也及後世禮義既廢喪亂荐至民無先時之失則必有後時之失如谷風及氓之詩則是失之先時如此詩則失之後時所謂不能辰夜不夙則莫是也黃曰觀氓之詩則知衛之男女不正觀有狐之詩則知衛之男女失其時男女之不以正者淫奔之風也昏姻之不以時者以凶荒之災也然國有凶荒豈嵗之罪哉君以奢侈示民而民之失其本業也久矣采蘩條桑之風不復見而抱布貿絲之俗不可革此之子無裳無帶無服所以為衛之憂也雖欲殺禮而多昏其可得乎木瓜美齊桓公也衛國有狄之敗出處于漕齊桓公救而封之遺惟季反之車馬器服焉衛人思之欲厚報之而作是詩也投我以木瓜報之以瓊琚音居匪報也永以為好也投我以木桃報之以瓊瑶音遙匪報也永以為好也投我以木李報之以瓊玖匪報也永以為好也李曰言閔公二年衛人與狄人戰于滎澤衛師敗績於是出處于漕齊桓公城楚丘而封之遺之車馬五祭服焉左傳曰齊侯使公子無虧帥車三百乘甲士三千人以戍曹歸公乘馬祭服五稱牛羊豕雞狗皆三百與門材歸夫人魚軒重錦三十兩外傳齊語亦曰衛人出廬于漕齊桓公城楚丘以封之其畜散而無育齊桓公與之繫馬三百此皆遺之以車馬器服也桓公救衛而封之其恩大矣而又遺之以車馬器服則其恩又如何衛人所以思其厚德而欲報之也投我以木瓜報之以瓊琚匪報也永以為好也爾雅曰楙木瓜木瓜葉似奈實如小瓜陸農師曰江左右者名柤其實如小瓜而有鼻食之津潤而不香者謂之木瓜圓而小於木瓜食之酸澀而香者謂之木桃似木瓜而無鼻而其品又為下謂之木李此木瓜木桃木李之别也徐安道乃謂瓜有瓜珠桃有羊桃李有雀李皆草蔓也故言木瓜木桃木李以别之也此則不知木瓜木桃木李之品為如何而妄為此説也孔子曰多識於鳥獸草木之名皆如安道之説何足貴哉此則學王氏而未至其弊遂至於此琚佩玉名也瓊者唐孔氏曰瓊玉之美名非玉名也瑶説文曰瑶玉之美者玖説文曰石之似玉黑色此詩蓋言人投我以木瓜木桃木李我則報之以瓊琚瓊瑶瓊玖木瓜木桃木李微物也瓊琚瓊瑶瓊玖寶物也以寶物而報微物猶自以為未足以報其德故但欲以為結好耳此蓋言人遺我以微物必有以厚報之況齊桓之德如此其大則報之當如何王氏曰木瓜木桃木李以言齊桓公投我以仁之實其説鑿矣而又謂投我者彌薄則實齊桓之德為薄既謂齊桓之德薄又謂報之者彌厚是豈衛人之情乎鄭氏解永好以謂欲令齊長以為玩好結已國之恩歐陽氏不取此説以好者當如結好之好非以為玩好也論曰齊桓公之於衛其恩固大矣出民於水火之中而免於豺狼之患使康叔得以復享其祭祀而衛之人民亦得以養其父母而保其子孫則齊桓公可謂生死肉骨者矣衛人雖盡其所有而報之而衛人之心猶以為未足以報之序言欲厚報之非衛人之所欲如此乎齊桓公於是假仁義而行然至於邢遷如歸衛國忘亡其與武王之興滅國繼絶世亦可謂庶幾矣衛人感齊桓之德欲厚報之則知邢之心亦必然矣劉內翰曰桓公之封衛德莫大焉雖衛亦自以為桓公之於我德莫大焉春秋之書城楚丘者曽無以異常諸侯矣彼衛已滅矣無王命而擅封之是擅王命諸侯之大罪也故以小惠許之則桓公有德以大法論之則諸侯為専封某竊以此説為不然夫專封者天子黜之諸侯封之則可以謂之専封若狄人伐衛桓公救之亦伯者之所當為也謂之小惠亦不可也黃曰木瓜木桃木李皆微物也而詩人欲以瓊琚瓊瑶瓊玖報之且猶以為未足非物之不足而心之不足也衛為狄人所滅而齊桓公救之使公子無虧帥車三百乘甲士三千人以戍曹歸公乘馬祭服五稱牛羊豕雞狗三百與門材歸夫人魚軒重錦三十兩此以車馬器物而遺之也吁衛君辱於泥塗而齊置之祍席衛無社稷而今有其社稷衛無民人而今有其人民則衛人之所以德於齊者殆欲輕九鼎而卑華嶽矣其將何以報之乎昔衛人不能恤黎而今齊能救衛衛人安得不感且愧吁此齊之所以霸而衛之所以不競也王黍離詁訓傳第六國風黍離閔宗周也周大夫行役至于宗周過故宗廟宫室盡為禾黍閔周室之顛覆倣蒲皇反徨音皇不忍去而作是詩也彼黍離離彼稷之苗行邁靡靡中心搖搖知我者謂我心憂不知我者謂我何求悠悠蒼天此何人哉彼黍離離彼稷之穗音遂行邁靡靡中心如醉知我者謂我心憂不知我者謂我何求悠悠蒼天此何人哉彼黍離離彼稷之實行邁靡靡中心如噎於結反知我者謂我心憂不知我者謂我何求悠悠蒼天此何人哉李曰孟子曰詩亡然後春秋作春秋之作蓋在平王之世黍離以下之詩皆是平王之詩也安得謂詩亡然後春秋作乎孟子所謂詩亡者雅頌之詩亡也今也平王之詩既下列於國風則是詩之亡矣既以平王之詩為國風則是天王下列於諸侯矣然春秋或書天王其或書天王者蓋春秋所以存王道也以是知春秋與詩相為表裏閔宗周也有宗周有成周成周東周也宗周豐鎬也周自文武以來居於豐鎬至成王之時則營東都也如書曰我乃卜澗水東􅬖水西惟洛食此則春秋所謂東周是也王城者後之河南郡是也我又卜􅬖水東亦惟洛食此則春秋所謂成周是也後之洛陽是也成王之營東都者王城則遷九鼎焉如成周則居頑民焉自豐鎬而言之則宗周為西周而王城為東周周既東遷矣則成周為東周而王城為西周平王以來皆居於王城及至敬王遭子朝之亂王城多子朝之黨敬王不能居於是遷于成周昭公三十二年天王入于成周是也此宗周成周之辨也宗周蓋自文武都豐鎬至於幽王為犬戎所滅平王遂東遷洛邑故大夫閔行役於西周過宗廟宫室其地已廢而民盡耕闢之盡為禾黍周大夫其心憂傷而閔周室之顛覆如此是以倣徨不忍去而作是詩也彼黍離離彼稷之苗行邁靡靡中心搖搖知我者謂我心憂不知我者謂我何求悠悠蒼天此何人哉説文曰黍稷屬而黑者也大暑而種故謂之黍孔氏黍可為酒故字從禾入水苗禾之未秀者也穗則禾之已秀矣説文曰穗禾成秀也實則秀而實矣故苗而秀秀而實蓋其序也稷爾雅曰粢稷也説文曰稷五榖之長也沈內翰曰稷乃今之穄也蓋宗周之地盡為禾黍也王氏曰視稷而謂之黍者憂而惛也亦不必如此説如蓼莪之詩曰蓼蓼者莪匪莪伊蒿則可以如此説至於此詩則不可箕子閔商之歌曰麥秀漸漸兮禾黍油油既曰麥秀又曰禾黍則亦與此同意彼稷之苗彼稷之穗彼稷之實以見盡為禾黍之意曰苗曰穗曰實又以見行役如此之久也邁亦行也靡靡遲遲也言其行役不忍去其心安舒遲緩如此也搖搖言心之憂傷而不定也楚王謂儀秦曰寡人心搖搖然若旌正與此同意醉憂之狀也噎咽也説文曰飯窒也言其心之憂不能喘息也知我者謂我心憂不知我者謂我何求周室之顛覆如此不知我者謂我何求久留於此者何人也楊龜山曰周自東遷而後政益衰敗黍離降而為國風則宗周之亡久矣蓋自幽王馴致至此其詩曰此何人哉無所歸咎也亦不必如此詩言此何人哉蓋言含蓄之辭亦不必謂之無所歸咎此蓋周大夫不欲指斥其人也黃講闕君子于役刺平王也君子行役無期度大夫思其危難乃旦反以風焉君子于役不知其期曷至哉雞棲音西于塒音時日之夕矣羊牛下來君子于役如之何勿思君子于役不日不月曷其有佸雞棲于桀日之夕矣牛羊下括古活反君子于役苟無飢渴李曰此詩言君子行役之久無有期度惟其無有期度故大夫思之此大夫者蓋同僚也思其行役艱苦以風于上也君子于役至如之何勿思蓋不知其期言無期度也曷至哉曷何也言何時至哉塒者鑿牆棲雞曰塒雞之將棲則日必夕矣羊牛亦從牧地下來此言畜産出入尚有期度而君子于役不然也君子于役如之何勿思言君子困于行役如之何而不思君子于役不日不月曷其有佸雞棲于桀日之夕矣牛羊下括君子于役苟無飢渴不日不月言何日何月當歸也曷其有佸佸會也言何時得會聚也雞棲于􅍻為桀亦是言君子乃不如雞與羊牛也括至也言君子于役苟無飢渴至此不敢望其必歸苟無飢渴之患足矣黃曰此詩所謂大夫思其危難以風者蓋同僚之人為之憂傷而作是詩以風諫其上也君子陽陽閔周也君子遭亂相招為祿仕全身逺害而已君子陽陽左執簧右招我由房其樂只且君子陶陶左執翿徒刀反右招我由敖其樂只且李曰此詩君子遭亂相招呼為祿而仕也君子之將仕必行其道今乃欲為祿而仕不求其道之行豈君子之本心哉蓋身居亂世畏懼罪罟但欲全身逺害而已君子陽陽左執簧右招我由房其樂只且陽陽樂貌也史記曰晏子之御擁大蓋䇿駟馬意氣揚揚甚自得也是陽陽為樂貌也陶陶亦和樂之貌也此言君子以此樂官賤職為樂也左執簧簧笙也左手執其笙簧右手招呼其友於房中而為房中之樂也翿纛也舞者所執蓋羽舞敖燕舞之位也其樂只且且言且樂此而已論曰憲問恥子曰邦有道榖邦無道榖恥也當衰周之時可謂無道矣而君子乃相招為祿仕所可恥者何以為君子哉君子之仕於君亦不一也孟子曰仕非為貧也而有時乎為貧娶妻非為養也而有時乎為養為貧者辭尊居卑辭富居貧君子陽陽之詩正居卑居貧之謂也樂官之職豈君子所當為哉今也君子為之又與其類相招而且以此為樂者蓋以貴不可居故也惟以貴不可居則當時在位者皆小人也凡衰亂之世賢者多窮處於草野及不得已而仕者皆居於下位老子在周為柱下史梅福在漢為市門卒此詩與簡兮之詩辭尊居卑之義也王氏曰左執者言無所事也簧所以為聲翿所以為容隱則無所事於容聲故曰左執簧左執翿此説非也據詩言左執簧但是左手所執非以無所事為義王氏又謂簧翿取聲容之義不必仕於伶官也此説亦非也據此詩言正是君子仕於伶官而謂不必仕於伶官非也説者必謂左執簧右招我由房雖是詩人傷君子不得志意亦小之也蓋以君子不得用則當引去可也不當在朝以取伶官之辱此皆不知辭尊居卑之義也黃曰史記言晏子之御䇿駟馬意氣揚揚自得則陽陽猶陶陶也夫君子遭亂當窮居野處以道自樂不得已而仕則當救時為民以身許國今乃相招為祿仕尚何足為君子乎曰陳蕃李固不得救東漢之難而徒以其身陷不測之淵郭泰明哲保身申屠蟠見幾而作君子之所深取蓋亂世不可以有為則辭尊居卑君子不怨雖處賤職人之所恥而君子則陽陽以自得陶陶以自樂其亦有所見者哉揚之水刺平王也不撫其民而逺屯戍于母家周人怨思焉揚之水不流束薪彼其音記之子不與我戍申懷哉懷哉曷月豫還歸哉揚之水不流束楚彼其之子不與我戍甫懷哉懷哉曷月豫還歸哉揚之水不流束蒲彼其之子不與我戍許懷哉懷哉曷月豫還歸哉李曰此詩言平王不能撫其人民而逺屯戍于申周民不得歸其鄉里此所以懷怨而思歸也揚之水説者不一鄭氏則以謂激揚之水至湍迅而不能流束薪此説非也豈有湍迅之水不能流移束薪乎王氏則謂水之揚足以流束薪其意則亦謂揚水可以流束薪而今乃不能非也據詩但言揚之水不流束薪安得謂水之揚足以流束薪乎張氏則以謂揚之為悠揚言水之悠揚緩而流故不能以漂蒲楚也此亦未盡程氏曰揚之水潤也淺故激力不足以流薪此説得之不如蘇氏之説為詳蘇氏曰揚之水非自流之水也水不能流而或揚之雖束薪之易流有不流矣水之能自流者物斯從之安在其揚之哉周之盛也諸侯聽役於王室無敢違命及其衰也雖令而不至平王未能使諸侯宗周而強使戍申役焉宜諸侯之不從也此説得之其取譬又皆得詩人之意鄭氏則喻平王恩澤號令不行於下民此蓋鄭氏徒見序言不撫其民遂遷就此説而附合於序非也束薪一束之薪也楚荆也今俗所謂黃荆蒲有二説毛氏以為草鄭氏以為栁左傳曰董澤之蒲蒲即楚也此二説皆通申平王母家也幽王娶申國女為后故申為平王母家甫也許也申也同姓之國皆薑姓也外傳曰齊許申吕為大薑是知申甫許皆是薑姓也彼其之子不與我戍申鄭氏之子是子也彼其是子獨處鄉里不與我來守申是思之言也此説非也歐陽程氏蘇氏皆以謂此國人怨諸侯之子不戍申此説與上文相貫蓋言平王不能調發諸侯之子來與我共戌申也懷思思歸也曷月豫還歸哉言何日當歸乎此久戍不得歸之辭也蓋先王盛時豈無戍役之事哉采薇之詩曰遣戍役以守衛中國而其詩乃無怨憝之辭今也遣役戍屯於母家而詩人乃怨思之如此程氏曰平王獨私恩其母家非有王者保天下之心人怨宜之此説是也蓋申國有難天子當命方伯與鄰國諸侯以救之豈得獨勞畿內之民哉故采薇遣戍其戍有名平王之遣戍其戍為挾私詩人所以刺之也晉平公杞出也故治把知悼子合諸侯之大夫以城把子太叔曰晉國不恤宗周之闕而夏肄是屏其棄諸姬亦可知也矣諸姬是棄其誰歸之見襄公二十九年城把與平王之戍申其事一也蓋以私存心諸侯於是離心焉以是知人君之行事當以公為先以公存心則如采薇詩人美之以私存心則如揚之水刺之其遣戍則同而其美刺則不同也黃曰先王盛時豈無戍役之事哉如遣戍役以守衛中國見於采薇之詩而詩人未嘗有怨辭今平王之戍而周人怨思焉何哉中國冇難天子當命方伯與鄰國諸侯救之而今也獨勤畿內之民而不能帥諸侯之師此如揚水之激而不能流一束之薪也揚之水非自流之水水不能自流而或揚之則雖束薪束楚束蒲之易流而有所不能流平王號令素不能以及於諸侯而乃勤周民以逺戍于母家宜詩人之怨思也且平王之戍専為母家非天下之公心也而孰肯從之乎上之人有私心而天下之人於是乎有離心觀揚之水一詩雖國人怨諸侯之辭而實平王之罪也毛詩集解卷八
